<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เกมตัวอย่าง React — Template</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  KAMPAI-SCHOOL · REACT GAME TEMPLATE (single-file, React 18 + Babel standalone)
═══════════════════════════════════════════════════════════════════════════
  ใช้เมื่อ: เกมเป็น React component (เช่นได้ JSX/TSX ดิบจาก AI/Stitch ที่ import
  จาก 'react' + 'lucide-react' — รันใน iframe ตรง ๆ ไม่ได้)

  วิธี port เกม React ที่มีอยู่:
  1. cp ไฟล์นี้ → public/games/{subject}/{slug}.html
  2. ตั้ง GAME_SLUG = '{slug}'  (SECTION A)
  3. ลบ `import React...` + `import {...} from 'lucide-react'` ออกจาก source
  4. เอา component (export default function App → function App) วางใน SECTION C
  5. destructure ไอคอน lucide ที่ใช้จาก _mkIcon (อย่าเขียน shim เอง — ใช้ที่ให้)
  6. เรียก sendGameEnd(score, mode, extra) ตอนจบเกม + navigateBack() ปุ่มออก
  7. pnpm verify:game public/games/{subject}/{slug}.html  (ต้องผ่าน 7/7 รวม render)

  ⚠️ lucide IconNode = ["svg", attrs, [["path",{...}], ...]]  → drawing อยู่ index 2
     (เคยพลาด map ผิด level → createElement(undefined) → จอดำ — ดู GAME.md)
═══════════════════════════════════════════════════════════════════════════
-->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;600&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: 'Kanit', 'Sarabun', sans-serif; background: #0f172a; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<!-- ═══ KAMPAI SDK (single source — อย่าแก้) ═══ -->
<script src="/games/kampai-sdk.js"></script>
<script>
window.KAMPAI = window.KAMPAI || { isEmbed:false, isTouch:false, ready:true, student:null, stats:null, leaderboard:[], input:{up:false,down:false,left:false,right:false,a:false,b:false}, onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, exit:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}} };
</script>

<script type="text/babel">
/* ═══════════════════════════════════════════════════════════════════════════
   SECTION A · ตั้งค่า (แก้แค่ GAME_SLUG — integration อยู่ใน /games/kampai-sdk.js)
   ═══════════════════════════════════════════════════════════════════════════ */
const GAME_SLUG = 'CHANGE-ME';   // ⚠️ ต้องตรงกับ educational_hub_items.game_slug
KAMPAI.setSlug(GAME_SLUG);

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION B · React + lucide-react shim (อย่าแก้ — ใช้ตอน source import จาก lucide-react)
   ═══════════════════════════════════════════════════════════════════════════ */
const { useState, useEffect, useCallback, useRef } = React;
const _ICONS = (window.lucide && (window.lucide.icons || window.lucide)) || {};
const _mkIcon = (name) => (p = {}) => {
  // lucide IconNode = ["svg", attrs, [["path",{...}], ...]] — เอาเฉพาะ drawing children (index 2)
  const node = _ICONS[name];
  const paths = (node && Array.isArray(node[2])) ? node[2] : [];
  const sz = p.size || 24;
  return React.createElement('svg', {
    xmlns: 'http://www.w3.org/2000/svg', width: sz, height: sz, viewBox: '0 0 24 24',
    fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round',
    strokeLinejoin: 'round', className: p.className, style: p.style,
  }, paths.map((c, i) => React.createElement(c[0], { key: i, ...c[1] })));
};
// destructure เฉพาะไอคอนที่เกมใช้ (เพิ่ม/ลบได้ตามต้องการ)
// ⚠️ ห้ามตั้งชื่อ binding ทับ JS global! ไอคอน lucide บางตัวชื่อชน global
//    (Map, Image, History, Text, Set, Date, Event, Promise...) → const Map=... จะทับ global Map
//    ใน scope ที่ทุก <script> แชร์ → Tailwind Play CDN เรียก new Map().set() พัง → จอเบี้ยวไม่มี CSS.
//    ใช้ชื่อเลี่ยง เช่น  const MapIcon = _mkIcon('Map')  (verify:game Check 8 จับให้)
const Sparkles = _mkIcon('Sparkles'), Play = _mkIcon('Play'), Trophy = _mkIcon('Trophy'),
  Home = _mkIcon('Home');

/* ═══════════════════════════════════════════════════════════════════════════
   SECTION C · GAME (วาง component ของคุณตรงนี้ — ตัวอย่าง: เก็บแต้ม + leaderboard)
   ═══════════════════════════════════════════════════════════════════════════ */
// การ์ด "สถิติฉัน" (จอเริ่ม) — คะแนนสูงสุด + จำนวนครั้งที่เล่น จาก KAMPAI.stats
function MyStats({ stats }) {
  if (!stats) return null;   // เปิดทดสอบเดี่ยว ๆ → ไม่มี stats → ซ่อน
  const cell = (val, label) => (
    <div className="flex-1 bg-white/10 border border-white/15 rounded-xl p-2.5">
      <div className="text-2xl font-black text-amber-400 leading-tight">{(val || 0).toLocaleString()}</div>
      <div className="text-[11px] text-slate-300">{label}</div>
    </div>
  );
  return (
    <div className="flex gap-2.5 w-full max-w-sm">
      {cell(stats.personalBest, 'คะแนนสูงสุด')}
      {cell(stats.playsCount, 'เล่นไปแล้ว (ครั้ง)')}
    </div>
  );
}

// แสดง leaderboard จาก KAMPAI (ส่งมาจาก wrapper ตอน init — ไม่ต้องยิง DB เอง)
function Leaderboard({ rows }) {
  if (!rows.length) return null;
  const medals = ['🥇', '🥈', '🥉'];
  return (
    <div className="bg-white/95 text-slate-800 rounded-xl p-3 w-full max-w-sm shadow-lg">
      <div className="font-bold text-sm mb-2 flex items-center gap-1"><Trophy className="w-4 h-4 text-amber-500" /> อันดับนักเรียน</div>
      <ul className="space-y-1">
        {rows.slice(0, 5).map((r) => (
          <li key={r.studentId || r.rank} className={`flex items-center gap-2 px-1.5 py-1 rounded-lg ${r.isMe ? 'bg-amber-100' : ''}`}>
            <span className="w-6 text-center font-bold text-amber-600">{medals[r.rank - 1] || r.rank}</span>
            {r.photoUrl
              ? <img src={r.photoUrl} alt="" className="w-7 h-7 rounded-full object-cover" />
              : <div className="w-7 h-7 rounded-full bg-violet-400 text-white flex items-center justify-center text-xs font-bold">{(r.displayName || '?')[0]}</div>}
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold truncate">{r.displayName}{r.isMe ? ' (คุณ)' : ''}</div>
              <div className="text-[11px] text-slate-500">{(r.personalBest || 0).toLocaleString()} คะแนน · {r.classLabel || ''}</div>
            </div>
          </li>
        ))}
      </ul>
    </div>
  );
}

function App() {
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [player, setPlayer] = useState(null);   // KAMPAI.student
  const [stats, setStats] = useState(null);     // KAMPAI.stats
  const [board, setBoard] = useState([]);       // KAMPAI.leaderboard

  // รับข้อมูลนักเรียน/สถิติ/leaderboard เมื่อพร้อม
  useEffect(() => {
    KAMPAI.onReady((k) => { setPlayer(k.student); setStats(k.stats); setBoard(k.leaderboard || []); });
  }, []);

  const finish = () => {
    setDone(true);
    KAMPAI.submitScore(score, { mode: 'normal' }); // ⚠️ ต้องเรียกตอนจบเกมทุกครั้ง
  };

  return (
    <div className="fixed inset-0 flex flex-col items-center justify-center text-white p-6 text-center gap-5 overflow-y-auto">
      <h1 className="text-3xl font-bold flex items-center gap-2">
        <Sparkles className="w-7 h-7 text-amber-400" /> เกมตัวอย่าง React
      </h1>
      {player && <div className="text-sm text-slate-300">ผู้เล่น: <b>{player.displayName}</b></div>}

      {!done ? (
        <>
          <div className="text-6xl font-black text-amber-400 tabular-nums">{score}</div>
          <button onClick={() => setScore((s) => s + 10)}
            className="px-8 py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-900 text-xl font-bold flex items-center gap-2">
            <Play className="w-5 h-5" /> เก็บแต้ม +10
          </button>
          <button onClick={finish}
            className="px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold flex items-center gap-2">
            <Trophy className="w-5 h-5" /> จบเกม + ส่งคะแนน
          </button>
          <MyStats stats={stats} />
          <Leaderboard rows={board} />
        </>
      ) : (
        <>
          <Trophy className="w-20 h-20 text-amber-400" />
          <div className="text-2xl font-bold">จบเกม! คะแนน {score}</div>
          <Leaderboard rows={board} />
          <button onClick={() => { setScore(0); setDone(false); }}
            className="px-6 py-3 rounded-2xl bg-amber-500 text-slate-900 font-bold">เล่นใหม่</button>
        </>
      )}

      <button onClick={() => KAMPAI.goHome()}
        className="mt-1 px-6 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 font-bold flex items-center gap-2">
        <Home className="w-5 h-5" /> กลับหน้าหลัก
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
