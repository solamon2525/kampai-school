  <style>
    body {
      overflow-x: hidden;
    }
    .toolbar {
      max-width: 100vw;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .skill-tag {
      display: inline-block;
      font-size: 6.8pt;
      font-weight: 800;
      color: var(--ws-accent, #086c5c);
      border: 1px solid var(--ws-accent, #086c5c);
      border-radius: 3px;
      padding: 0.3mm 1.5mm;
      line-height: 1.2;
    }
    .eng-word {
      font-size: 11pt;
      font-weight: 900;
      color: var(--ws-accent, #086c5c);
      margin: 0.4mm 0;
      letter-spacing: -0.01em;
    }
    .classify-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2mm;
      margin: 0.6mm 0;
    }
    .classify-box {
      border: 1px dashed var(--ws-line, #c9d2df);
      border-radius: 3px;
      padding: 0.8mm 1.5mm;
      font-size: 6.8pt;
      font-weight: 700;
      color: var(--ws-muted, #5b6475);
      background: var(--ws-soft, #eef6f3);
    }
    .step-block {
      display: flex;
      flex-direction: column;
      gap: 1mm;
      margin-top: 0.8mm;
    }
    .step-row {
      display: grid;
      grid-template-columns: 22mm 1fr;
      gap: 1.5mm;
      align-items: end;
      min-height: 6.2mm;
    }
    .step-tag {
      font-size: 6.5pt;
      font-weight: 800;
      color: var(--ws-paper, #ffffff);
      background: var(--ws-accent, #086c5c);
      border-radius: 3px;
      padding: 0.6mm;
      text-align: center;
      line-height: 1.1;
    }
    .step-tag.gold {
      background: var(--ws-accent-2, #d69b18);
    }
    .step-body {
      min-height: 5.8mm;
      border-bottom: 1px dotted var(--ws-muted, #5b6475);
      display: flex;
      align-items: flex-end;
      font-weight: 700;
      font-size: 7.8pt;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .work-fill {
      color: transparent;
      font-weight: 800;
    }
    .show-answers .work-fill,
    .q.reveal-answer .work-fill {
      color: var(--ws-danger, #b42318) !important;
      font-weight: 800 !important;
    }
    .count-5 .step-row {
      min-height: 8.5mm;
    }
    .count-5 .step-body {
      min-height: 8mm;
      font-size: 9pt;
    }
    .count-5 .eng-word {
      font-size: 13pt;
    }
    .count-5 .skill-tag {
      font-size: 7.8pt;
    }
    .count-5 .classify-box {
      font-size: 7.8pt;
    }

</head>
