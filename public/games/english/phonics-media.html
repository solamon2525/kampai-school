<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สื่อ Phonics Chart — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #155e75; --line: #a5f3fc; --muted: #64748b; --ok: #16a34a; --bad: #dc2626;
    }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(145deg, #cffafe 0%, #ecfeff 40%, #a5f3fc 100%);
      min-height: 100%; color: #0f172a; padding: 12px;
    }
    .shell {
      max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15,23,42,.12); border: 1px solid rgba(255,255,255,.7);
      overflow: hidden; display: flex; flex-direction: column; min-height: calc(100vh - 24px);
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
      background: linear-gradient(90deg, #155e75, #0e7490 50%, #0891b2); color: #fff;
    }
    header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 160px; }
    header .badge {
      font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px;
      border-radius: 999px; font-weight: 700;
    }
    .btn {
      font-family: inherit; font-weight: 700; border: none; border-radius: 12px;
      padding: 10px 14px; cursor: pointer; font-size: .95rem; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { transform: scale(.97); }
    .btn-back {
      background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
      padding: 8px 12px; font-size: .85rem;
    }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .btn-ok { background: var(--ok); color: #fff; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #ecfeff;
      border-bottom: 1px solid var(--line); align-items: center;
    }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #67e8f9; }
    .seg button {
      font-family: inherit; font-weight: 800; border: none; background: #fff;
      color: var(--deep); padding: 8px 14px; cursor: pointer; font-size: .9rem;
    }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #0e7490; font-weight: 600; flex: 1; min-width: 160px; }
    .stage { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
    @media (min-width: 820px) { .stage { grid-template-columns: 1fr 300px; } }
    .grid-wrap { padding: 14px; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
    .grid.blends { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
    .tile {
      aspect-ratio: 1; border-radius: 14px; border: 2px solid #a5f3fc; background: #fff;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-weight: 800; color: var(--deep); min-height: 56px; user-select: none;
    }
    .tile:hover { border-color: #22d3ee; }
    .tile.on { background: linear-gradient(145deg, #22d3ee, #06b6d4); color: #fff; border-color: #0891b2; }
    .tile .letter { font-size: clamp(1.25rem, 4vw, 1.75rem); line-height: 1; text-transform: uppercase; }
    .tile .sub { font-size: .65rem; font-weight: 700; opacity: .75; text-transform: lowercase; }
    .detail {
      background: #ecfeff; border-top: 1px solid var(--line); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 820px) { .detail { border-top: none; border-left: 1px solid var(--line); } }
    .detail-empty { color: var(--muted); font-weight: 600; text-align: center; margin: auto 0; line-height: 1.5; }
    .detail-card, .practice-card { display: none; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .detail-card.show, .practice-card.show { display: flex; }
    .big-letter { font-size: 4rem; font-weight: 800; color: var(--deep); line-height: 1; text-transform: uppercase; }
    .big-letter .lower { font-size: 2.4rem; color: #0891b2; margin-left: 6px; }
    .sound-chip, .cue-chip {
      display: inline-flex; align-items: center; gap: 6px; background: #fff;
      border: 2px solid #67e8f9; border-radius: 999px; padding: 8px 16px;
      font-weight: 800; color: var(--deep); font-size: 1rem;
    }
    .cue-chip { font-size: .95rem; border-color: #fbbf24; background: #fffbeb; }
    .thai-hint { font-size: .9rem; font-weight: 700; color: #0e7490; }
    .words { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .word-btn, .choice-btn {
      font-family: inherit; font-weight: 800; font-size: 1.1rem; border: 2px solid #a5f3fc;
      background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; color: #0f172a; text-align: left; width: 100%;
    }
    .word-btn:hover, .choice-btn:hover { background: #cffafe; }
    .choice-btn.correct { border-color: #86efac; background: #dcfce7; }
    .choice-btn.wrong { border-color: #fca5a5; background: #fee2e2; }
    .choice-btn:disabled { cursor: default; opacity: .95; }
    .word-btn .emoji, .choice-btn .emoji { font-size: 1.6rem; }
    .word-btn .meta, .choice-btn .meta { display: flex; flex-direction: column; gap: 2px; }
    .word-btn .en, .choice-btn .en { font-size: 1.15rem; }
    .word-btn .th, .choice-btn .th { font-size: .8rem; font-weight: 600; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .actions .btn { flex: 1; min-width: 110px; }
    .practice-prompt {
      font-size: 1.1rem; font-weight: 800; color: var(--deep); line-height: 1.4;
      background: #fff; border-radius: 14px; padding: 12px; width: 100%; border: 2px dashed #67e8f9;
    }
    .practice-letter {
      font-size: 3.2rem; font-weight: 800; color: var(--deep); text-transform: uppercase;
    }
    .practice-fb { min-height: 28px; font-weight: 800; font-size: 1rem; }
    .practice-fb.ok { color: var(--ok); }
    .practice-fb.no { color: var(--bad); }
    .streak { font-size: .85rem; font-weight: 700; color: #0e7490; }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
      padding: 10px 16px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line);
    }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
    .learn-only { display: contents; }
    .shell.mode-practice .learn-only { display: none; }
    .shell.mode-practice .stage { grid-template-columns: 1fr; }
    .practice-wrap { display: none; padding: 20px; max-width: 480px; margin: 0 auto; width: 100%; }
    .shell.mode-practice .practice-wrap { display: block; }
    .shell.mode-practice .stage > .grid-wrap,
    .shell.mode-practice .stage > .detail { display: none; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>🔤 Phonics Chart — เสียงตัวอักษรอังกฤษ</h1>
      <span class="badge">ป.1–3 · ภาษาอังกฤษ</span>
    </header>

    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึก</button>
      </span>
      <span class="seg learn-only" id="tabSeg">
        <button type="button" data-tab="letters" class="on">A–Z</button>
        <button type="button" data-tab="blends">Blends</button>
        <button type="button" data-tab="digraphs">Digraphs</button>
      </span>
      <p class="hint" id="hintText">แตะตัวอักษร → ฟังแบบ “a as in apple” + คำตัวอย่าง</p>
      <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    </div>

    <div class="stage">
      <div class="grid-wrap learn-only">
        <div class="grid" id="grid"></div>
      </div>
      <aside class="detail learn-only">
        <div class="detail-empty" id="detailEmpty">แตะตัวอักษรทางซ้าย<br>เพื่อฟังเสียงและดูคำตัวอย่าง</div>
        <div class="detail-card" id="detailCard">
          <div class="big-letter" id="bigLetter"></div>
          <div class="sound-chip" id="soundChip"></div>
          <div class="cue-chip" id="cueChip"></div>
          <p class="thai-hint" id="thaiHint"></p>
          <div class="words" id="words"></div>
          <div class="actions">
            <button type="button" class="btn btn-accent" id="btnSound">🔊 ฟังเสียง</button>
            <button type="button" class="btn btn-primary" id="btnAllWords">🗣️ อ่านคำทั้งหมด</button>
          </div>
        </div>
      </aside>
    </div>

    <div class="practice-wrap">
      <div class="practice-card show" id="practiceCard">
        <p class="streak" id="streakLabel">ถูกติดกัน: 0</p>
        <div class="practice-letter" id="practiceLetter">?</div>
        <div class="cue-chip" id="practiceCue">—</div>
        <div class="practice-prompt">คำไหนขึ้นต้นด้วยเสียงนี้?</div>
        <div class="words" id="practiceChoices"></div>
        <div class="practice-fb" id="practiceFb"></div>
        <div class="actions">
          <button type="button" class="btn btn-accent" id="btnPracticeSound">🔊 ฟังเสียงอีกครั้ง</button>
          <button type="button" class="btn btn-ok" id="btnPracticeNext">ข้อถัดไป →</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>🏫 โรงเรียนบ้านคำไผ่ · สื่อการสอน</span>
      <a href="/play/vocab-hub">คลังคำศัพท์อังกฤษ →</a>
    </div>
  </div>

  <script>
    (function () {
      var MEDIA_SLUG = 'phonics-media';
      if (window.KAMPAI) { try { window.KAMPAI.setSlug(MEDIA_SLUG); } catch (e) {} }

      function item(id, sound, thai, words) {
        return {
          id: id,
          label: id.length === 1 ? id.toUpperCase() + id : id,
          sound: sound,
          thai: thai,
          words: words,
          cue: id + ' as in ' + words[0].en,
        };
      }
      function w(en, th, emoji) { return { en: en, th: th, emoji: emoji }; }

      var LETTERS = [
        item('a', 'æ', 'เสียงสั้นเหมือน "แอ" ใน apple', [w('apple','แอปเปิล','🍎'), w('ant','มด','🐜')]),
        item('b', 'b', 'เสียง "บ" ปิดปากแล้วเปิด', [w('ball','ลูกบอล','⚽'), w('book','หนังสือ','📖')]),
        item('c', 'k', 'เสียงแข็ง "ค" (cat) — ไม่ใช่ "ซ"', [w('cat','แมว','🐱'), w('cup','ถ้วย','🥤')]),
        item('d', 'd', 'เสียง "ด"', [w('dog','หมา','🐶'), w('duck','เป็ด','🦆')]),
        item('e', 'e', 'เสียงสั้น "เอะ" ใน egg', [w('egg','ไข่','🥚'), w('elephant','ช้าง','🐘')]),
        item('f', 'f', 'เสียง "ฟ" ฟันบนแตะปากล่าง', [w('fish','ปลา','🐟'), w('fan','พัดลม','🪭')]),
        item('g', 'g', 'เสียงแข็ง "ก" (goat)', [w('goat','แพะ','🐐'), w('grape','องุ่น','🍇')]),
        item('h', 'h', 'เสียงลมหายใจ "ฮ"', [w('hat','หมวก','🎩'), w('hand','มือ','✋')]),
        item('i', 'ɪ', 'เสียงสั้น "อิ" ใน igloo', [w('igloo','บ้านน้ำแข็ง','🏠'), w('insect','แมลง','🐛')]),
        item('j', 'dʒ', 'เสียง "จ" นุ่ม (jam)', [w('jam','แยม','🍓'), w('juice','น้ำผลไม้','🧃')]),
        item('k', 'k', 'เสียง "ค" เหมือน c ใน cat', [w('kite','ว่าว','🪁'), w('key','กุญแจ','🔑')]),
        item('l', 'l', 'เสียง "ล" ปลายลิ้นแตะเพดาน', [w('lion','สิงโต','🦁'), w('leaf','ใบไม้','🍃')]),
        item('m', 'm', 'เสียง "ม" ปิดปาก', [w('moon','พระจันทร์','🌙'), w('milk','นม','🥛')]),
        item('n', 'n', 'เสียง "น"', [w('nose','จมูก','👃'), w('net','ตาข่าย','🥅')]),
        item('o', 'ɒ', 'เสียงสั้น "ออ" ใน octopus', [w('octopus','ปลาหมึก','🐙'), w('orange','ส้ม','🍊')]),
        item('p', 'p', 'เสียง "ป" พ่นลม', [w('pig','หมู','🐷'), w('pen','ปากกา','🖊️')]),
        item('q', 'kw', 'มักคู่กับ u = "คว" (queen)', [w('queen','ราชินี','👑'), w('quilt','ผ้าห่ม','🛏️')]),
        item('r', 'r', 'เสียง "ร" แบบอังกฤษ', [w('rabbit','กระต่าย','🐰'), w('red','สีแดง','🔴')]),
        item('s', 's', 'เสียง "ซ/ส" ลมยาว', [w('sun','พระอาทิตย์','☀️'), w('snake','งู','🐍')]),
        item('t', 't', 'เสียง "ท/ต" พ่นลม', [w('tiger','เสือ','🐯'), w('tree','ต้นไม้','🌳')]),
        item('u', 'ʌ', 'เสียงสั้น "อะ" ใน umbrella', [w('umbrella','ร่ม','☂️'), w('up','ขึ้น','⬆️')]),
        item('v', 'v', 'เสียง "ว" สั่น', [w('van','รถตู้','🚐'), w('violin','ไวโอลิน','🎻')]),
        item('w', 'w', 'เสียง "ว" กลมปาก', [w('water','น้ำ','💧'), w('wolf','หมาป่า','🐺')]),
        item('x', 'ks', 'เสียง "คซ" มักอยู่ท้ายคำ', [w('box','กล่อง','📦'), w('fox','จิ้งจอก','🦊')]),
        item('y', 'j', 'ต้นคำเสียง "ย" (yellow)', [w('yellow','สีเหลือง','💛'), w('yo-yo','โยโย่','🪀')]),
        item('z', 'z', 'เสียง "ซ" สั่น', [w('zebra','ม้าลาย','🦓'), w('zoo','สวนสัตว์','🦁')]),
      ];

      var BLENDS = [
        item('bl','bl','b + l พร้อมกัน',[w('blue','สีน้ำเงิน','💙'), w('black','สีดำ','⬛')]),
        item('br','br','b + r',[w('bread','ขนมปัง','🍞'), w('brush','แปรง','🪥')]),
        item('cl','cl','c + l',[w('clock','นาฬิกา','🕐'), w('cloud','เมฆ','☁️')]),
        item('cr','cr','c + r',[w('crab','ปู','🦀'), w('cry','ร้องไห้','😢')]),
        item('dr','dr','d + r',[w('drum','กลอง','🥁'), w('dress','ชุดกระโปรง','👗')]),
        item('fl','fl','f + l',[w('flag','ธง','🚩'), w('flower','ดอกไม้','🌸')]),
        item('fr','fr','f + r',[w('frog','กบ','🐸'), w('fruit','ผลไม้','🍎')]),
        item('gl','gl','g + l',[w('glass','แก้ว','🥛'), w('glue','กาว','🧴')]),
        item('gr','gr','g + r',[w('green','สีเขียว','💚'), w('grape','องุ่น','🍇')]),
        item('pl','pl','p + l',[w('plane','เครื่องบิน','✈️'), w('plant','ต้นไม้','🌱')]),
        item('pr','pr','p + r',[w('prize','รางวัล','🏆'), w('proud','ภูมิใจ','😊')]),
        item('sk','sk','s + k',[w('sky','ท้องฟ้า','🌌'), w('skate','สเก็ต','⛸️')]),
        item('sl','sl','s + l',[w('slide','สไลเดอร์','🛝'), w('sleep','นอน','😴')]),
        item('sm','sm','s + m',[w('smile','ยิ้ม','😊'), w('small','เล็ก','🔹')]),
        item('sn','sn','s + n',[w('snake','งู','🐍'), w('snow','หิมะ','❄️')]),
        item('sp','sp','s + p',[w('spoon','ช้อน','🥄'), w('spider','แมงมุม','🕷️')]),
        item('st','st','s + t',[w('star','ดาว','⭐'), w('stop','หยุด','🛑')]),
        item('sw','sw','s + w',[w('swim','ว่ายน้ำ','🏊'), w('swing','ชิงช้า','🪑')]),
        item('tr','tr','t + r',[w('tree','ต้นไม้','🌳'), w('train','รถไฟ','🚂')]),
        item('tw','tw','t + w',[w('twin','ฝาแฝด','👯'), w('twelve','สิบสอง','🔢')]),
      ];

      var DIGRAPHS = [
        item('ch','tʃ','เสียง "ช" (chair)',[w('chair','เก้าอี้','🪑'), w('cheese','ชีส','🧀')]),
        item('sh','ʃ','เสียง "ช" ลมยาว (ship)',[w('ship','เรือ','🚢'), w('fish','ปลา','🐟')]),
        item('th','θ','ลิ้นแตะฟัน (think)',[w('three','สาม','3️⃣'), w('thumb','นิ้วโป้ง','👍')]),
        item('wh','w','มักเสียงเหมือน w (whale)',[w('whale','วาฬ','🐋'), w('white','สีขาว','⬜')]),
        item('ph','f','เสียง "ฟ" (phone)',[w('phone','โทรศัพท์','📱'), w('photo','รูปภาพ','📷')]),
        item('ck','k','ท้ายคำเสียง "ค" (duck)',[w('duck','เป็ด','🦆'), w('sock','ถุงเท้า','🧦')]),
        item('ng','ŋ','เสียง "ง" ท้ายคำ (ring)',[w('ring','แหวน','💍'), w('king','ราชา','🤴')]),
        item('qu','kw','q + u = "คว"',[w('queen','ราชินี','👑'), w('quiet','เงียบ','🤫')]),
      ];

      // x/ck/ng มักอยู่ท้ายคำ — cue ใช้ "ends with"
      LETTERS.find(function (x) { return x.id === 'x'; }).cue = 'x as in box';
      DIGRAPHS.find(function (x) { return x.id === 'ck'; }).cue = 'ck as in duck';
      DIGRAPHS.find(function (x) { return x.id === 'ng'; }).cue = 'ng as in ring';

      var DATA = { letters: LETTERS, blends: BLENDS, digraphs: DIGRAPHS };
      var tab = 'letters';
      var mode = 'learn';
      var selected = null;
      var practiceItem = null;
      var practiceAnswered = false;
      var streak = 0;

      var shell = document.getElementById('shell');
      var grid = document.getElementById('grid');
      var detailEmpty = document.getElementById('detailEmpty');
      var detailCard = document.getElementById('detailCard');
      var bigLetter = document.getElementById('bigLetter');
      var soundChip = document.getElementById('soundChip');
      var cueChip = document.getElementById('cueChip');
      var thaiHint = document.getElementById('thaiHint');
      var wordsEl = document.getElementById('words');
      var hintText = document.getElementById('hintText');

      function speak(text, lang) {
        lang = lang || 'en-US';
        if (window.KAMPAI && KAMPAI.sound && typeof KAMPAI.sound.speak === 'function') {
          try {
            if (KAMPAI.sound.speak.length >= 3) KAMPAI.sound.speak(text, lang, true);
            else KAMPAI.sound.speak(text, lang);
            return;
          } catch (e) {}
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = lang;
          u.rate = 0.85;
          window.speechSynthesis.speak(u);
        }
      }

      /** เสียง phoneme แบบห้องเรียน: "a as in apple" */
      function speakSound(item) {
        speak(item.cue, 'en-US');
      }

      function speakWord(en) { speak(en, 'en-US'); }

      function renderGrid() {
        var list = DATA[tab];
        grid.className = 'grid' + (tab !== 'letters' ? ' blends' : '');
        grid.innerHTML = '';
        list.forEach(function (it) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tile' + (selected && selected.id === it.id ? ' on' : '');
          btn.innerHTML = tab === 'letters'
            ? '<span class="letter">' + it.id.toUpperCase() + '</span><span class="sub">' + it.id + '</span>'
            : '<span class="letter" style="font-size:1.2rem">' + it.id + '</span>';
          btn.addEventListener('click', function () { selectItem(it); });
          grid.appendChild(btn);
        });
      }

      function selectItem(it) {
        selected = it;
        renderGrid();
        detailEmpty.style.display = 'none';
        detailCard.classList.add('show');
        if (tab === 'letters') {
          bigLetter.innerHTML = it.id.toUpperCase() + '<span class="lower">' + it.id + '</span>';
        } else {
          bigLetter.textContent = it.id;
        }
        soundChip.textContent = '/' + it.sound + '/';
        cueChip.textContent = '“' + it.cue + '”';
        thaiHint.textContent = it.thai;
        wordsEl.innerHTML = '';
        it.words.forEach(function (word) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'word-btn';
          b.innerHTML = '<span class="emoji">' + word.emoji + '</span><span class="meta"><span class="en">' +
            word.en + '</span><span class="th">' + word.th + '</span></span>';
          b.addEventListener('click', function () { speakWord(word.en); });
          wordsEl.appendChild(b);
        });
        speakSound(it);
      }

      function allWordsPool() {
        var pool = [];
        Object.keys(DATA).forEach(function (k) {
          DATA[k].forEach(function (it) {
            it.words.forEach(function (word) {
              pool.push({ item: it, word: word, tab: k });
            });
          });
        });
        return pool;
      }

      function wordMatchesItem(wordEn, it) {
        // คำถูกถ้าอยู่ใน words ของ item นั้น
        return it.words.some(function (w) { return w.en === wordEn; });
      }

      function startsWithSound(wordEn, it) {
        var w = wordEn.toLowerCase();
        var id = it.id.toLowerCase();
        if (id === 'x' || id === 'ck' || id === 'ng') {
          return w.endsWith(id === 'x' ? 'x' : id);
        }
        if (id === 'c') return w.startsWith('c') || w.startsWith('k');
        if (id === 'k') return w.startsWith('k') || w.startsWith('c');
        return w.startsWith(id);
      }

      function nextPractice() {
        practiceAnswered = false;
        document.getElementById('practiceFb').textContent = '';
        document.getElementById('practiceFb').className = 'practice-fb';

        var list = DATA[tab] || LETTERS;
        practiceItem = list[Math.floor(Math.random() * list.length)];

        document.getElementById('practiceLetter').textContent =
          practiceItem.id.length === 1 ? practiceItem.id.toUpperCase() : practiceItem.id;
        document.getElementById('practiceCue').textContent = '“' + practiceItem.cue + '”';
        document.getElementById('streakLabel').textContent = 'ถูกติดกัน: ' + streak;

        var correct = practiceItem.words[Math.floor(Math.random() * practiceItem.words.length)];
        var pool = allWordsPool().filter(function (p) {
          return p.word.en !== correct.en && !startsWithSound(p.word.en, practiceItem);
        });
        // shuffle pool
        pool.sort(function () { return Math.random() - 0.5; });
        var choices = [correct];
        for (var i = 0; i < pool.length && choices.length < 3; i++) {
          if (!choices.some(function (c) { return c.en === pool[i].word.en; })) {
            choices.push(pool[i].word);
          }
        }
        choices.sort(function () { return Math.random() - 0.5; });

        var box = document.getElementById('practiceChoices');
        box.innerHTML = '';
        choices.forEach(function (word) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'choice-btn';
          b.innerHTML = '<span class="emoji">' + word.emoji + '</span><span class="meta"><span class="en">' +
            word.en + '</span><span class="th">' + word.th + '</span></span>';
          b.addEventListener('click', function () { onPracticePick(b, word, correct); });
          box.appendChild(b);
        });

        speakSound(practiceItem);
      }

      function onPracticePick(btn, word, correct) {
        if (practiceAnswered) return;
        practiceAnswered = true;
        var ok = word.en === correct.en;
        var fb = document.getElementById('practiceFb');
        var buttons = document.querySelectorAll('#practiceChoices .choice-btn');
        buttons.forEach(function (el) {
          el.disabled = true;
          var en = el.querySelector('.en').textContent;
          if (en === correct.en) el.classList.add('correct');
        });
        if (ok) {
          btn.classList.add('correct');
          streak++;
          fb.textContent = '✅ ถูกต้อง! ' + practiceItem.cue;
          fb.className = 'practice-fb ok';
          if (window.KAMPAI && KAMPAI.sound) try { KAMPAI.sound.correct(); } catch (e) {}
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.textContent = '❌ ลองใหม่ — คำที่ถูกคือ ' + correct.en;
          fb.className = 'practice-fb no';
          if (window.KAMPAI && KAMPAI.sound) try { KAMPAI.sound.wrong(); } catch (e) {}
        }
        document.getElementById('streakLabel').textContent = 'ถูกติดกัน: ' + streak;
        speakWord(correct.en);
      }

      function setMode(m) {
        mode = m;
        shell.classList.toggle('mode-practice', m === 'practice');
        document.querySelectorAll('#modeSeg button').forEach(function (b) {
          b.classList.toggle('on', b.dataset.mode === m);
        });
        if (m === 'practice') {
          hintText.textContent = 'ฟังเสียงแบบ “a as in apple” แล้วเลือกคำที่ขึ้นต้นด้วยเสียงนั้น';
          // โหมดฝึกใช้ A–Z เป็นหลัก (ชัดสำหรับป.ต้น)
          tab = 'letters';
          nextPractice();
        } else {
          hintText.textContent = 'แตะตัวอักษร → ฟังแบบ “a as in apple” + คำตัวอย่าง';
        }
      }

      document.getElementById('modeSeg').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-mode]');
        if (btn) setMode(btn.dataset.mode);
      });

      document.getElementById('tabSeg').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-tab]');
        if (!btn) return;
        tab = btn.dataset.tab;
        document.querySelectorAll('#tabSeg button').forEach(function (b) {
          b.classList.toggle('on', b === btn);
        });
        selected = null;
        detailCard.classList.remove('show');
        detailEmpty.style.display = 'block';
        renderGrid();
      });

      document.getElementById('btnSound').addEventListener('click', function () {
        if (selected) speakSound(selected);
      });
      document.getElementById('btnAllWords').addEventListener('click', function () {
        if (!selected) return;
        var i = 0;
        function next() {
          if (i >= selected.words.length) return;
          speakWord(selected.words[i].en);
          i++;
          setTimeout(next, 1300);
        }
        // เล่น cue ก่อน แล้วค่อยคำ
        speakSound(selected);
        setTimeout(next, 1600);
      });
      document.getElementById('btnPracticeSound').addEventListener('click', function () {
        if (practiceItem) speakSound(practiceItem);
      });
      document.getElementById('btnPracticeNext').addEventListener('click', nextPractice);
      document.getElementById('btnFs').addEventListener('click', function () {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
        else if (document.exitFullscreen) document.exitFullscreen();
      });

      renderGrid();
    })();
  </script>
</body>
</html>
