<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/english/past-tense-mini-media.html"><meta name="curriculum-indicators" content="ต 1.1 ป.4/2, ต 2.1 ป.4/1"><title>ใบงาน Past Tense Mini ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.184.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.eng-word{font-size:12pt;font-weight:800;color:var(--ws-accent);margin:.5mm 0}
.tick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:22mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-5 .eng-word{font-size:14pt}
</style>
</head><body>
<header class="toolbar"><h1>📘 ใบงาน Past Tense Mini</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="be">was/were</option><option value="regular">-ed</option><option value="irregular">irregular</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const ITEMS=[
 {type:'be',prompt:'เติมคำ: She ___ happy yesterday.',focus:'was/were',answer:'was',step1:'She = he/she/it',step2:'อดีต → was',step3:'was'},
 {type:'be',prompt:'เติมคำ: They ___ at school.',focus:'was/were',answer:'were',step1:'They',step2:'อดีต → were',step3:'were'},
 {type:'be',prompt:'เติมคำ: I ___ tired last night.',focus:'was/were',answer:'was',step1:'I',step2:'อดีต → was',step3:'was'},
 {type:'regular',prompt:'play ในรูปอดีตคือ',focus:'-ed',answer:'played',step1:'play',step2:'+ ed',step3:'played'},
 {type:'regular',prompt:'watch ในรูปอดีตคือ',focus:'-ed',answer:'watched',step1:'watch',step2:'+ ed',step3:'watched'},
 {type:'regular',prompt:'like ในรูปอดีตคือ',focus:'-ed',answer:'liked',step1:'like',step2:'+ d',step3:'liked'},
 {type:'irregular',prompt:'go ในรูปอดีตคือ',focus:'irregular',answer:'went',step1:'go',step2:'รูปพิเศษ',step3:'went'},
 {type:'irregular',prompt:'see ในรูปอดีตคือ',focus:'irregular',answer:'saw',step1:'see',step2:'รูปพิเศษ',step3:'saw'},
 {type:'irregular',prompt:'eat ในรูปอดีตคือ',focus:'irregular',answer:'ate',step1:'eat',step2:'รูปพิเศษ',step3:'ate'},
 {type:'irregular',prompt:'เติมคำ: We ___ to the park yesterday. (go)',focus:'irregular',answer:'went',step1:'go → went',step2:'yesterday',step3:'went'}
];
const SKILL={be:'was/were',regular:'-ed',irregular:'irregular'};
window.WORKSHEET_CONFIG={
  worksheetKey:'past-tense-mini',
  icon:'📘',title:'ใบงาน Past Tense Mini',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–6',mediaLabel:'Past Tense Mini',
  sourceMediaUrl:'/games/english/past-tense-mini-media.html',indicators:['ต 1.1 ป.4/2','ต 2.1 ป.4/1'],
  directions:'ติ๊กประเภทกริยา → แปลงรูปอดีตทีละขั้น → เขียนคำตอบ',
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="eng-word">'+e(item.focus)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ was/were</div><div class="tick-box">□ -ed</div><div class="tick-box">□ irregular</div></div>'
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 base</span><div class="step-body"><span class="work-fill">'+e(item.step1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 rule</span><div class="step-body"><span class="work-fill">'+e(item.step2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 past</span><div class="step-body"><span class="work-fill">'+e(item.step3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
