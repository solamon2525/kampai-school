<script>
const ITEMS=[{"type":"grammar","prompt":"Fill in: is / are","text":"She ___ my teacher.","answer":"is"},{"type":"grammar","prompt":"Fill in: a / an","text":"I have ___ egg.","answer":"an"},{"type":"grammar","prompt":"Choose: this / these","text":"___ books are mine. (near)","answer":"These"},{"type":"grammar","prompt":"Rewrite correctly","text":"They is happy.","answer":"They are happy."},{"type":"sight","prompt":"เขียนประโยคใช้คำ sight word","word":"because","answer":"เช่น I like mangoes because they are sweet."},{"type":"sight","prompt":"เขียนประโยคใช้คำ sight word","word":"friend","answer":"เช่น My friend is kind."},{"type":"sight","prompt":"วงคำที่สะกดถูก","word":"school / scool / schol","answer":"school"},{"type":"sight","prompt":"แปลและแต่งประโยค","word":"always","answer":"เสมอ · เช่น I always wash my hands."},{"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Circle the apple.","answer":"วงผลไม้แอปเปิล"},{"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Underline the cat.","answer":"ขีดเส้นใต้แมว"},{"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Tick the big book.","answer":"ติ๊กหนังสือเล่มใหญ่"},{"type":"instr","prompt":"เขียนคำสั่งภาษาอังกฤษสั้น ๆ","text":"สั่งให้เพื่อนวงกลมดวงดาว","answer":"Circle the star."},{"type":"grammar","prompt":"เลือก that / those","text":"___ bird is far away.","answer":"That"},{"type":"grammar","prompt":"แต่งประโยค 1 ประโยคใช้ are","text":"two dogs","answer":"There are two dogs. / The dogs are cute."},{"type":"sight","prompt":"เติมคำในช่องว่าง","text":"I ___ to school every day. (go)","answer":"go"},{"type":"instr","prompt":"เรียงคำสั่งให้ถูก","text":"the / Circle / sun","answer":"Circle the sun."},{"type":"grammar","prompt":"อธิบายกฎสั้น ๆ","text":"ใช้ an เมื่อไร","answer":"ก่อนเสียงสระ (a,e,i,o,u)"},{"type":"sight","prompt":"เขียนคำและประโยค","word":"people","answer":"people · เช่น Many people smile."}];
window.WORKSHEET_CONFIG={
  icon:'🇬🇧',title:'ใบงานคลัง English ป.4–5',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–ป.5',
  mediaLabel:'English Grammar Hub',sourceMediaUrl:'/games/english/english-grammar-p45-hub/index.html',
  indicators:["ต 2.1 ป.4/1","ต 1.1 ป.4/1","ต 1.1 ป.4/2"],
  directions:"ฝึก Grammar · Sight Words · Follow Instructions พร้อมเหตุผลสั้น ๆ",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="q-context english-hub-case">'+e(item.text||item.word||'')+'</div>'
      +'<div class="classify-grid english-grammar-hub-grid">'
      +'<div class="classify-box">Answer: ________</div>'
      +'<div class="classify-box">Why / Example: ________</div></div>'
      +'<div class="work-line"></div><div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';}
};
</script>
<script src="/games/worksheet-topic.js?v=1.199.1"></script>
<script>
function render(){window.KampaiTopicWorksheet.render();}
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');
document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();
window.KampaiWorksheet.loadTeachers();
render();
</script>
