<script>
const ITEMS=[
  // 14 Grammar questions
  {"type":"grammar","prompt":"Fill in: is / am / are","text":"She ___ my English teacher.","answer":"is"},
  {"type":"grammar","prompt":"Fill in: is / am / are","text":"They ___ playing football in the park.","answer":"are"},
  {"type":"grammar","prompt":"Fill in: is / am / are","text":"I ___ ready to study English today.","answer":"am"},
  {"type":"grammar","prompt":"Fill in: a / an","text":"I have ___ red apple in my bag.","answer":"a"},
  {"type":"grammar","prompt":"Fill in: a / an","text":"He eats ___ egg for breakfast.","answer":"an"},
  {"type":"grammar","prompt":"Fill in: a / an / the","text":"Look at ___ bright sun in the blue sky.","answer":"the"},
  {"type":"grammar","prompt":"Choose: this / that","text":"___ pencil in my hand is yellow. (near)","answer":"This"},
  {"type":"grammar","prompt":"Choose: these / those","text":"___ birds in the tall tree are flying. (far)","answer":"Those"},
  {"type":"grammar","prompt":"Fill in possessive: his / her / their","text":"She loves ___ cute cat very much.","answer":"her"},
  {"type":"grammar","prompt":"Fill in possessive: my / our / his","text":"He rides ___ bicycle to school every morning.","answer":"his"},
  {"type":"grammar","prompt":"Fill in preposition: in / on / under","text":"The English book is ___ the wooden chair.","answer":"on"},
  {"type":"grammar","prompt":"Fill in preposition: in / on / under","text":"The sleepy cat is resting ___ the table.","answer":"under"},
  {"type":"grammar","prompt":"Choose Wh-word: Who / Where / What","text":"___ is your English teacher? — Ms. Anna.","answer":"Who"},
  {"type":"grammar","prompt":"Choose Wh-word: Who / Where / What","text":"___ is the library located? — Next to the office.","answer":"Where"},

  // 14 Sight Words questions
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"because","answer":"เพราะว่า · เช่น I study hard because I love English."},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"important","answer":"สำคัญ · เช่น Reading is important for everyone."},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"remember","answer":"จดจำ · เช่น Remember to bring your notebook."},
  {"type":"sight","prompt":"เติมคำในช่องว่าง","text":"Raise your hand if you have a ___ . (question)","answer":"question"},
  {"type":"sight","prompt":"เติมคำในช่องว่าง","text":"Write the correct ___ on your paper. (answer)","answer":"answer"},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"family","answer":"ครอบครัว · เช่น I love my happy family."},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"friend","answer":"เพื่อน · เช่น She is my best friend."},
  {"type":"sight","prompt":"วงคำที่สะกดถูก","word":"beautiful / beatiful / beautifull","answer":"beautiful"},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"together","answer":"ด้วยกัน · เช่น We sing songs together."},
  {"type":"sight","prompt":"เติมคำในช่องว่าง","text":"It was cold and rainy ___ afternoon. (yesterday)","answer":"yesterday"},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"weather","answer":"สภาพอากาศ · เช่น The sunny weather makes me happy."},
  {"type":"sight","prompt":"วงคำที่สะกดถูก","word":"always / alway / allways","answer":"always"},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"everyone","answer":"ทุกคน · เช่น Everyone is smiling in class."},
  {"type":"sight","prompt":"แปลและแต่งประโยค","word":"practice","answer":"ฝึกฝน · เช่น We practice speaking every day."},

  // 14 Follow Instructions questions
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Circle the red apple on the table.","answer":"วงกลมผลแอปเปิลสีแดง"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Underline the cute cat.","answer":"ขีดเส้นใต้แมวน่ารัก"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Tick the yellow school bus.","answer":"ติ๊กเครื่องหมายถูกที่รถโรงเรียนสีเหลือง"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Cross out the cold ice cream.","answer":"กากบาทที่ไอศกรีมเย็น"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Put the book in the school bag.","answer":"วาดหรือใส่หนังสือลงในกระเป๋านักเรียน"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Point to the tall giraffe.","answer":"ชี้หรือทำเครื่องหมายที่เจ้ายีราฟคอยาว"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Choose the happy smiling face.","answer":"เลือกใบหน้าที่ยิ้มอย่างมีความสุข"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Color the bright yellow sun.","answer":"ระบายสีดวงอาทิตย์สีเหลืองสดใส"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Find the boy reading a book.","answer":"หาเด็กผู้ชายที่กำลังอ่านหนังสือ"},
  {"type":"instr","prompt":"อ่านคำสั่งแล้วทำเครื่องหมาย","text":"Match the green vegetable.","answer":"จับคู่ผักสดเพื่อสุขภาพ"},
  {"type":"instr","prompt":"เขียนคำสั่งภาษาอังกฤษสั้น ๆ","text":"สั่งให้เพื่อนวงกลมดาวสีเหลือง","answer":"Circle the yellow star."},
  {"type":"instr","prompt":"เขียนคำสั่งภาษาอังกฤษสั้น ๆ","text":"สั่งให้เพื่อนขีดเส้นใต้คำศัพท์","answer":"Underline the word."},
  {"type":"instr","prompt":"เรียงคำสั่งให้ถูกต้อง","text":"apple / the / Circle / red","answer":"Circle the red apple."},
  {"type":"instr","prompt":"แปลคำสั่งเป็นภาษาไทย","text":"Tick the correct answer.","answer":"ทำเครื่องหมายถูกที่คำตอบที่ถูกต้อง"}
];

window.WORKSHEET_CONFIG={
  icon:'🇬🇧',title:'ใบงานคลัง English ป.4–5',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–ป.5',
  mediaLabel:'English Grammar Hub',sourceMediaUrl:'/games/english/english-grammar-p45-hub/index.html',
  indicators:["ต 2.1 ป.4/1","ต 1.1 ป.4/1","ต 1.1 ป.4/2"],
  directions:"ฝึก Grammar · Sight Words · Follow Instructions พร้อมเหตุผลสั้น ๆ",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="q-context english-hub-case">'+e(item.text||item.word||'')+'</div>'
      +'<div class="classify-grid english-grammar-hub-grid">'
      +'<div class="classify-box">Answer: ________</div>'
      +'<div class="classify-box">Why / Example: ________</div></div>'
      +'<div class="work-line"></div><div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';}
};
</script>

<script>
function render(){window.KampaiTopicWorksheet.render();}
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');
document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();
window.KampaiWorksheet.loadTeachers();
render();
</script>
