// TWO-PLAYER MODE (local hot-seat or online)
// =====================================================================
const match = KampaiVersus.create({
  duration: 60,
  title: 'แข่งศัพท์ภาษาอังกฤษ',
  onPlay: ({ rng }) => startOnlineMatch(rng),
  onEnd: () => { onlineActive = false; }
});
function startOnlineMultiplayer() {
  match.openMenu();
}
function startOnlineMatch(rng) {
  onlineRng = rng;
  onlineActive = true;
  onlineScore = 0;
  onlineCorrect = 0;
  onlineQPos = 0;
  
  playEl.classList.add('show');
  
  onlineQOrder = [...Array(allItems.length).keys()];
  shuffleWithRng(onlineQOrder, onlineRng);
  
  renderOnlineQuestion();
}
function shuffleWithRng(array, rng) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
function renderOnlineQuestion() {
  if (!onlineActive || mode !== 'online') return;
  
  if (onlineQPos >= onlineQOrder.length) {
    onlineQPos = 0;
    shuffleWithRng(onlineQOrder, onlineRng);
  }
  
  const qIdx = onlineQOrder[onlineQPos];
  const target = allItems[qIdx];
  curItem = target;
  
  playEl.innerHTML = '';
  
  const prompt = document.createElement('div');
  prompt.className = 'q-prompt';
  prompt.innerHTML = `<div class="play-wrap">${quizPrompt(target)}</div>`;
  playEl.appendChild(prompt);
  
  let pool = allItems.filter(it => it.en !== target.en);
  let opts = [target];
  
  while (opts.length < 4 && pool.length > 0) {
    const rIdx = Math.floor(onlineRng() * pool.length);
    opts.push(pool.splice(rIdx, 1)[0]);
  }
  
  shuffleWithRng(opts, onlineRng);
  
  const optWrap = document.createElement('div');
  optWrap.className = 'q-options';
  optWrap.id = 'online-opts';
  playEl.appendChild(optWrap);
  
  opts.forEach((opt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'opt';
    const key = String.fromCharCode(65 + idx);
    btn.innerHTML = `<span class="opt-key">${key}</span> <span>${thSide(opt)}</span>`;
    btn._item = opt;
    btn.addEventListener('click', () => submitOnlineAnswer(opt === target, btn, target));
    optWrap.appendChild(btn);
  });
  
  setScore(`คะแนน <b>${onlineScore}</b>`);
  speak(target, null, 'en');
}
function submitOnlineAnswer(isCorrect, btn, target) {
  if (!onlineActive || mode !== 'online') return;
  
  if (isCorrect) {
    onlineCorrect++;
    onlineScore += 10;
    btn.classList.add('ok');
    try { KAMPAI.sound.correct(); } catch (_) {}
    toast(true, 'ถูกต้อง!');
    speak(target);
    
    match.report(onlineScore, { correct: onlineCorrect });
    
    setTimeout(() => {
      onlineQPos++;
      renderOnlineQuestion();
    }, 450);
  } else {
    btn.classList.add('bad');
    try { KAMPAI.sound.wrong(); } catch (_) {}
    toast(false, 'คำตอบคือ ' + thSide(target));
    [...document.querySelectorAll('.opt')].forEach(o => {
      if (o._item === target) o.classList.add('ok');
    });
    
    setTimeout(() => {
      onlineQPos++;
      renderOnlineQuestion();
    }, 900);
  }
}

// =====================================================================
// SPELL MODE (สะกดคำ) — สาธิตอัตโนมัติ: สะกดทีละตัว → อ่าน + แปล → คำถัดไป
// =====================================================================
function startSpell(){
  spOrder = shuffle([...Array(allItems.length).keys()]);
  spPos = 0;
  playEl.classList.add('show');
  renderSpell();
}
function spellNext(){ clearTimeout(spStepTimer); spPos++; renderSpell(); }
function renderSpell(){
  clearTimeout(spStepTimer);
  if(window.speechSynthesis) speechSynthesis.cancel();
  spGen++; const myGen = spGen;
  if(spPos>=spOrder.length) spPos=0;                 // วน loop
  const item = allItems[spOrder[spPos]];
  curItem = item;
  const word = item.en || item.label;
  const letters = [...word];
  barEl.style.width = ((spPos+1)/spOrder.length*100)+'%';

  let visual='';
  if(item.bgColor) visual = `<span class="sp-swatch" style="background:${item.bgColor}"></span>`;
  else if(item.image) visual = imageMarkup(item,'sp-image','sp-emoji');
  else if(item.emoji) visual = `<span class="sp-emoji">${item.emoji}</span>`;

  const lettersHtml = letters.map((ch,i)=>`<span class="sp-letter" data-i="${i}">${ch}</span>`).join('');
  playEl.innerHTML =
    `<div class="spell-wrap">`+
      `<div class="sp-visual">${visual}</div>`+
      `<div class="sp-letters">${lettersHtml}</div>`+
      `<div class="sp-read" id="sp-read">อ่านว่า <b>${item.th}</b></div>`+
      (item.meaning ? `<div class="sp-mean" id="sp-mean">แปลว่า <b>${item.meaning}</b></div>` : '')+
    `</div>`;
  playEl.querySelector('.spell-wrap').addEventListener('click', spellNext);

  const boxes = [...playEl.querySelectorAll('.sp-letter')];
  let i = 0;
  function step(){
    if(i>0){ boxes[i-1].classList.remove('on'); boxes[i-1].classList.add('done'); }
    if(i<boxes.length){
      const idx = i;
      boxes[idx].classList.add('on');
      let letterAdvanced=false;
      const advanceLetter=()=>{
        if(letterAdvanced) return; letterAdvanced=true;
        if(mode!=='spell'||myGen!==spGen) return;
        i++; spStepTimer = setTimeout(step, cellMs);
      };
      const letterFallback = setTimeout(advanceLetter, 1500);   // กันค้างถ้า onend ไม่ยิง
      speakLetter(letters[idx].toUpperCase(), ()=>{ clearTimeout(letterFallback); advanceLetter(); });
    } else {
      document.getElementById('sp-read')?.classList.add('show');
      document.getElementById('sp-mean')?.classList.add('show');
      let wordAdvanced=false;
      const advance=()=>{ if(wordAdvanced) return; wordAdvanced=true; if(mode!=='spell'||myGen!==spGen) return; spStepTimer=setTimeout(()=>{ spPos++; renderSpell(); }, 1500); };
      const fallback=setTimeout(advance, 6000);      // กันค้างถ้า onend ไม่ยิง
      speak(item, ()=>{ clearTimeout(fallback); advance(); });   // รอเสียงอ่านคำเต็มจบจริงก่อนค่อยไปคำถัดไป
    }
  }
  spStepTimer = setTimeout(step, 450);
}

  flashKnown.add(flashDeck.shift());     // รู้แล้ว: เอาออกจากกอง
  saveKnownEns();                        // จำข้ามรอบ
  renderFlashCard();
});
btnReview.addEventListener('click',e=>{
  e.stopPropagation();
  if(!revealed) return;
  const idx = flashDeck.shift();
  flashReviewCount[idx] = (flashReviewCount[idx]||0) + 1;   // นับสถิติคำที่ยังไม่แม่น
  // Spaced Repetition: คำที่ทบทวนบ่อย → โผล่เร็วขึ้น (แทรกใกล้หัวกองมากขึ้น)
  const reviews = flashReviewCount[idx];
  const gap = Math.max(1, Math.ceil(flashDeck.length / (reviews + 1)));   // ยิ่งทบทวนบ่อย gap ยิ่งสั้น
  const insertAt = Math.min(gap, flashDeck.length);
  flashDeck.splice(insertAt, 0, idx);
  renderFlashCard();
});
btnFlashPrev.addEventListener('click', e => {
  e.stopPropagation();
  if (flashHistory.length <= 1) return;
  const cur = flashHistory.pop(); // เอาปัจจุบันออก
  const prev = flashHistory.pop(); // เอาอันก่อนหน้าออกมา
  if (flashKnown.has(prev)) {
    flashKnown.delete(prev);
    saveKnownEns();
  }
  const prevIdx = flashDeck.indexOf(prev);
  if (prevIdx >= 0) flashDeck.splice(prevIdx, 1);
  flashDeck.unshift(prev);
  renderFlashCard();
});

function toggleStarItem(item){
  item.starred = !item.starred;
  
  // Load current global starred list
  let list = [];
  try {
    const saved = localStorage.getItem('vocab_hub_starred_words');
    if (saved) list = JSON.parse(saved);
  } catch(e) {}
  
  const existingIdx = list.findIndex(x => x.en === item.en && x.label === item.label && x.sourceSlug === item.sourceSlug);
  
  if (item.starred) {
    if (existingIdx === -1) {
      list.push({
        sourceSlug: item.sourceSlug || currentSlug,
        en: item.en,
        th: item.th,
        meaning: item.meaning,
        label: item.label,
        image: item.image,
        emoji: item.emoji,
        bgColor: item.bgColor,
        darkText: item.darkText,
        example: item.example,
        level: itemLevel(item),
        phonics: item.phonics
      });
    }
  } else {
    if (existingIdx !== -1) {
      list.splice(existingIdx, 1);
    }
  }
  
  localStorage.setItem('vocab_hub_starred_words', JSON.stringify(list));
}

// =====================================================================
// FLASH CARD SWIPE GESTURES
// =====================================================================
(function() {
  let startX = 0, startY = 0;
  let moveX = 0, moveY = 0;
  let isDragging = false;
  
  const swLeft = document.getElementById('sw-left');
  const swRight = document.getElementById('sw-right');
  
  tcard.addEventListener('mousedown', dragStart);
  tcard.addEventListener('touchstart', dragStart, { passive: true });
  
  function dragStart(e) {
    if (mode !== 'flash') return;
    isDragging = true;
    const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
    startX = clientX;
    startY = clientY;
    moveX = 0;
    moveY = 0;
    tcard.style.transition = 'none';
    
    if (e.type === 'mousedown') {
      document.addEventListener('mousemove', dragMove);
      document.addEventListener('mouseup', dragEnd);
    } else {
      document.addEventListener('touchmove', dragMove, { passive: false });
      document.addEventListener('touchend', dragEnd);
    }
  }
  
  function dragMove(e) {
    if (!isDragging) return;
    const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
    moveX = clientX - startX;
    moveY = clientY - startY;
    
    if (e.type === 'touchmove' && Math.abs(moveX) > Math.abs(moveY)) {
      e.preventDefault();
    }
    
    const deg = moveX * 0.08;
    const baseRotateY = tcard.classList.contains('flipped') ? 180 : 0;
    tcard.style.transform = `translateX(${moveX}px) translateY(${moveY}px) rotateZ(${deg}deg) rotateY(${baseRotateY}deg)`;
    
    // Show indicators
    const threshold = window.innerWidth * 0.15;
    if (moveX > 0) {
      swRight.style.opacity = Math.min(0.9, moveX / threshold);
      swLeft.style.opacity = 0;
    } else if (moveX < 0) {
      swLeft.style.opacity = Math.min(0.9, -moveX / threshold);
      swRight.style.opacity = 0;
    }
  }
  
  function dragEnd(e) {
    if (!isDragging) return;
    isDragging = false;
    
    document.removeEventListener('mousemove', dragMove);
    document.removeEventListener('mouseup', dragEnd);
    document.removeEventListener('touchmove', dragMove);
    document.removeEventListener('touchend', dragEnd);
    
    const threshold = window.innerWidth * 0.2;
    
    swLeft.style.opacity = 0;
    swRight.style.opacity = 0;
    
    if (!revealed) {
      // Tap or short drag -> reveal answer
      if (Math.abs(moveX) < 15 && Math.abs(moveY) < 15) {
        btnReveal.click();
      }
      resetCard();
    } else {
      if (moveX > threshold) {
        swipeOut('right');
      } else if (moveX < -threshold) {
        swipeOut('left');
      } else {
        // Tap card to repeat pronunciation
        if (Math.abs(moveX) < 15 && Math.abs(moveY) < 15) {
          if (curItem) speak(curItem);
        }
        resetCard();
      }
    }
  }
  
  function resetCard() {
    tcard.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    const baseRotateY = tcard.classList.contains('flipped') ? 180 : 0;
    tcard.style.transform = `rotateY(${baseRotateY}deg)`;
  }
  
  function swipeOut(direction) {
    tcard.style.transition = 'transform 0.25s ease-in, opacity 0.25s';
    const outX = direction === 'right' ? window.innerWidth : -window.innerWidth;
    const baseRotateY = tcard.classList.contains('flipped') ? 180 : 0;
    tcard.style.transform = `translateX(${outX}px) rotateY(${baseRotateY}deg) rotateZ(${direction === 'right' ? 20 : -20}deg)`;
    tcard.style.opacity = '0';
    
    setTimeout(() => {
      if (direction === 'right') {
        btnKnow.click();
      } else {
        btnReview.click();
      }
      tcard.style.transition = 'none';
      tcard.style.opacity = '1';
      tcard.style.transform = 'rotateY(0deg)';
    }, 250);
  }
})();

// =====================================================================
// KEYBOARD
// =====================================================================
document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
    return;
  }
  if(!currentSlug) return;
  if(e.key==='Escape'){ location.hash=''; showHub(); return; }
  if(mode==='auto'){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); goTo(curSlide+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); goTo(curSlide-1); }
  } else if(mode==='flash'||mode==='fliprace'){
    if(!revealed){
      if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); btnReveal.click(); }
    } else {
      if(isFlipRace){
        if(e.key==='1'||e.key==='k'||e.key==='K'){ btnKnow.click(); }
        else if(e.key==='2'||e.key==='r'||e.key==='R'){ btnReview.click(); }
        else if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); btnKnow.click(); }
      } else {
        if(e.key==='1'||e.key==='j'||e.key==='J'||e.key==='ArrowLeft'){ btnC1.click(); }
        else if(e.key==='2'||e.key==='k'||e.key==='K'||e.key==='ArrowDown'){ btnC2.click(); }
        else if(e.key==='3'||e.key==='l'||e.key==='L'||e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); btnC3.click(); }
      }
    }
  } else if(mode==='choice'||mode==='listen'||mode==='timed'||mode==='online'){
    if(/^[1-4]$/.test(e.key)){ const o=document.querySelectorAll('.opt')[+e.key-1] || document.getElementById('online-opts')?.querySelectorAll('.opt')[+e.key-1]; if(o) o.click(); }
    else { const m='abcd'.indexOf(e.key.toLowerCase()); if(m>=0){ const o=document.querySelectorAll('.opt')[m] || document.getElementById('online-opts')?.querySelectorAll('.opt')[m]; if(o) o.click(); } }
  } else if(mode==='tf'){
    if(e.key==='1'||e.key==='ArrowLeft'||e.key.toLowerCase()==='a'||e.key.toLowerCase()==='f'){ btnTfFalse.click(); }
    else if(e.key==='2'||e.key==='ArrowRight'||e.key.toLowerCase()==='d'||e.key.toLowerCase()==='t'){ btnTfTrue.click(); }
  } else if(mode==='spell'){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); spellNext(); }
  }
});
