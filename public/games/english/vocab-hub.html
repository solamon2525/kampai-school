  onReady:function(cb){cb(this);}, setSlug:function(){return this;}, beginRound:function(){return this;},
  submitScore:function(){return false;}, goHome:function(){history.back();},
  sound:{correct:function(){},wrong:function(){},gameOver:function(){},timeUp:function(){},
         speak:function(){},stopSpeak:function(){},mountToggles:function(){},

</script>

<script>
// KampaiMatch fallback stub
window.KampaiMatch = window.KampaiMatch || {
  create: function() {
    return {
      available: false,
      openMenu: function() { alert('โหมดออนไลน์เล่นผ่านระบบ /play เท่านั้น'); },
      report: function() {},
      finish: function() {},
      leave: function() {}
    };
  }
};
</script>
<script src="/games/kampai-versus.js"></script>
<script>
window.KampaiVersus = window.KampaiVersus || {
  create: function(options) {
    const online = window.KampaiMatch && window.KampaiMatch.create
      ? window.KampaiMatch.create(options)
      : null;
    return {
      available: false,
      openMenu: function() { if (online) online.openMenu(); },
      report: function(score, info) { if (online) online.report(score, info); },
      finish: function(score, info) {
        if (!online) return false;
        online.finish(score, info);
        return true;
      },
      leave: function() { if (online) online.leave(); },
      mode: null
    };
  }
};
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;height:100dvh;background:#1565C0;overflow:hidden;user-select:none;
  font-family:'TH Sarabun New',Sarabun,Arial,sans-serif}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ===== PLAYER CHIP ===== */
#player-chip{
  display:none;position:fixed;top:1.2vh;right:2vw;z-index:90;
  align-items:center;gap:6px;padding:4px 12px 4px 4px;
  background:rgba(0,0,0,0.35);border-radius:20px;
  font-size:1.8vh;color:#fff;
}
#player-chip img,#player-chip .pc-init{
  width:28px;height:28px;border-radius:50%;object-fit:cover;
}
#player-chip .pc-init{
  display:flex;align-items:center;justify-content:center;
  background:#FFE082;color:#1565C0;font-weight:700;
}

/* ===== HUB ===== */
#hub-view{
  display:flex;flex-direction:column;
  width:100vw;height:100vh;height:100dvh;
  padding:2.5vh 3vw 2vh;
}
#hub-title{
  text-align:center;
  font-size:5.5vh;font-weight:700;
  color:#FFE082;letter-spacing:0.06em;
  margin-bottom:0.6vh;
}
#hub-sub{
  text-align:center;font-size:2.2vh;
  color:rgba(255,224,130,0.55);
  margin-bottom:2vh;
}
#hub-grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-auto-rows:minmax(15vh,1fr);
  gap:1.4vh 1.2vw;
  overflow-y:auto;
}
.hub-card{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.07);
  cursor:pointer;
  gap:0.3vh;
  padding:0.8vh 0.5vw;
  overflow:hidden;
  transition:background 0.14s,transform 0.12s,border-color 0.14s;
}
.hub-card:hover{
  background:rgba(255,255,255,0.18);
  border-color:rgba(255,215,0,0.55);
  transform:scale(1.04);
}
.hub-card .hc-icon{font-size:3vh;line-height:1}
.hub-card .hc-th{width:100%;font-weight:700;color:#FFE082;text-align:center;line-height:1.05;
  word-break:break-word;overflow-wrap:break-word}
.hub-card .hc-en{font-size:1.6vh;color:rgba(255,255,255,0.55);text-align:center}
.hub-card .hc-count{font-size:1.4vh;color:rgba(255,215,0,0.4)}
.hc-progress{
  width:80%;height:5px;border-radius:3px;background:rgba(255,255,255,0.12);
  margin-top:0.3vh;overflow:hidden;position:relative;
}
.hc-prog-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#4FC3F7,#81C784);
  transition:width 0.4s ease;
}
.hc-prog-fill.done{background:linear-gradient(90deg,#FFD700,#FFA000)}
.hc-prog-pct{
  font-size:1.2vh;color:rgba(255,255,255,0.5);margin-top:0.1vh;
}

/* ===== TYPE-IN ===== */
.ti-input-wrap{display:flex;gap:8px;margin-top:2vh;width:90%;max-width:400px}
.ti-input{
  flex:1;padding:10px 14px;font-size:3.2vh;border-radius:12px;border:2px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.12);color:#fff;text-align:center;
  font-family:inherit;outline:none;caret-color:#FFE082;
}
.ti-input:focus{border-color:#FFE082}
.ti-input::placeholder{color:rgba(255,255,255,0.3)}
.ti-submit{
  padding:10px 20px;font-size:3vh;border-radius:12px;border:none;
  background:#FFE082;color:#1565C0;font-weight:700;cursor:pointer;
}
.ti-submit:hover{background:#FFD54F}
.ti-hint{font-size:2.2vh;color:rgba(255,255,255,0.5);margin-top:1vh;min-height:3vh}
.ti-answer{font-size:3vh;margin-top:1.5vh;font-weight:700}
.ti-answer.ok{color:#81C784}
.ti-answer.bad{color:#EF5350}

/* ===== TOPIC VIEW ===== */
#topic-view{
  display:none;flex-direction:column;
  width:100vw;height:100vh;height:100dvh;
}
#topic-view.show{display:flex}

/* Banner */
#word{
  flex:0 0 24vh;
  perspective:900px;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:0 2vw;
}
#tcard{
  position:relative;width:92%;height:90%;
  transform-style:preserve-3d;
  transition:transform 0.5s ease;
}
#tcard.flipped{transform:rotateY(180deg)}
.swipe-indicator {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 1.5vh 3vh;
  border-radius: 12px;
  font-size: 3vh;
  font-weight: bold;
  color: white;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
}
.swipe-indicator.swipe-left {
  left: 5vw;
  background: rgba(220, 53, 69, 0.95);
  border: 2px solid #ff4d4d;
  transform: translateY(-50%) rotate(-5deg);
}
.swipe-indicator.swipe-right {
  right: 5vw;
  background: rgba(40, 167, 69, 0.95);
  border: 2px solid #4ade80;
  transform: translateY(-50%) rotate(5deg);
}
.tface{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.tface.tback{transform:rotateY(180deg)}
#wfront{
  font-size:min(14vh,12vw);font-weight:700;line-height:1;
  color:#FFE082;white-space:nowrap;letter-spacing:0.02em;
}
#wfront .wf-emoji{margin-right:0.18em}
#wfront .wf-image{width:min(34vh,52vw);height:min(34vh,52vw)}
.front-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
#wfront-sub{
  font-size:6.5vh;font-weight:700;line-height:1;
  color:#ffffff;white-space:nowrap;
}
#wfront-sub:empty{display:none}
#wback-en{
  font-size:min(10vh,11vw);font-weight:700;line-height:1;
  color:#FFE082;white-space:nowrap;
}
#wback-th{
  font-size:7vh;font-weight:700;line-height:1;
  color:rgba(255,224,130,0.7);white-space:nowrap;margin-top:0.3em;
}
#wback-mean{
  font-size:5vh;font-weight:700;line-height:1;
  color:#ffffff;white-space:nowrap;margin-top:0.25em;
}
#wback-mean:empty{display:none}
#wback-example{
  font-size:2.4vh;font-style:italic;font-weight:400;
  color:rgba(255,255,255,0.65);white-space:normal;text-align:center;
  max-width:80vw;margin-top:0.4em;
}
#wback-example:empty{display:none}
.back-col{display:flex;flex-direction:column;align-items:center}
#btn-say{
  position:absolute;top:1vh;right:2vw;z-index:5;
  font-size:2.8vh;width:6vh;height:6vh;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,224,130,0.4);background:rgba(0,0,0,0.25);color:#FFE082;
  transition:background 0.12s,transform 0.1s;
}
#btn-say:hover{background:rgba(255,215,0,0.3);transform:scale(1.08)}
#voice-mode-pill{
  position:absolute;top:7.8vh;right:2vw;z-index:5;
  display:none;align-items:center;justify-content:center;
  padding:0.55vh 1.1vh;border-radius:999px;
  border:1px solid rgba(255,224,130,0.32);
  background:rgba(8,28,66,0.68);
  color:#FFE082;font-size:1.45vh;font-weight:700;letter-spacing:0.02em;
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
  pointer-events:none;
}
#phonics-hint{
  position:absolute;left:50%;bottom:0.4vh;z-index:4;
  display:none;align-items:center;justify-content:center;gap:0.7vh;flex-wrap:wrap;
  transform:translateX(-50%);max-width:92vw;
  color:rgba(255,255,255,0.88);font-size:1.65vh;font-weight:700;
}
#phonics-hint .ph-label{opacity:0.82}
#phonics-hint .ph-part{
  min-width:44px;min-height:36px;padding:4px 10px;border-radius:10px;
  border:1px solid rgba(255,224,130,0.45);background:rgba(8,28,66,0.62);
  color:#FFE082;font:inherit;cursor:pointer;
}
#phonics-hint .ph-part:hover,#phonics-hint .ph-part:focus-visible{
  background:rgba(255,224,130,0.2);outline:2px solid rgba(255,224,130,0.7);outline-offset:2px;
}
#phonics-hint .ph-arrow{opacity:0.75}
#btn-star{
  position:absolute;top:1vh;right:calc(2vw + 8vh);z-index:5;
  font-size:2.8vh;width:6vh;height:6vh;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,224,130,0.4);background:rgba(0,0,0,0.25);color:#FFE082;
  transition:background 0.12s,transform 0.1s;
  display:flex;align-items:center;justify-content:center;
}
#btn-star:hover{background:rgba(255,215,0,0.3);transform:scale(1.08)}
#btn-star.active{color:#FFD700;border-color:#FFD700;background:rgba(255,215,0,0.18)}

/* Grid */
#grid{
  flex:1;
  padding:0.4vh 0.5vw;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-auto-flow:column;
  gap:0.5vh 0.8vw;
}
#grid.visual-grid{
  --visual-cols:3;
  --visual-rows:2;
  --visual-card-size:220px;
  grid-template-columns:repeat(var(--visual-cols),var(--visual-card-size));
  grid-template-rows:repeat(var(--visual-rows),var(--visual-card-size));
  grid-auto-flow:row;
  place-content:center;
  gap:clamp(8px,1.2vh,14px);
}
.cell{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.2vh;
  border-radius:8px;
  border:1.5px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.04);
  transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s,background 0.15s;
  overflow:hidden;
}
.cell.visual-card{aspect-ratio:1/1;gap:clamp(3px,0.6vh,8px);padding:clamp(6px,1vh,12px)}
.cell-visual{
  width:72%;height:58%;min-height:0;
  display:flex;align-items:center;justify-content:center;
}
.cell .emoji{font-size:clamp(54px,8vh,104px);line-height:1}
.vocab-image{display:block;width:100%;height:100%;object-fit:contain}
.image-fallback{display:none}
.image-failed>.vocab-image{display:none}
.image-failed>.image-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.cell-image{filter:drop-shadow(0 6px 8px rgba(0,0,0,0.2))}
/* Default highlight (non-color topics) */
.cell.hl{
  background:#FFD700;
  border-color:#FF8F00;
  transform:scale(1.05);
  z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.cell.hl .lbl{color:#1A237E}
.cell.hl .cell-reading{color:#1A237E}
/* Color-cell keeps its bgColor; highlight = border glow */
.cell.color-cell{border-color:rgba(255,255,255,0.28)}
.cell.color-cell.hl{
  background:inherit;
  transform:scale(1.06);
  z-index:5;
  border-color:#ffffff !important;
  box-shadow:0 0 0 4px #ffffff, 0 0 0 7px #000000, 0 12px 28px rgba(0,0,0,0.5) !important;
}
.cell.color-cell.hl .lbl{color:inherit}
#grid.interactive .cell{cursor:pointer}
#grid.interactive .cell:hover{border-color:rgba(255,215,0,0.55)}
.lbl{
  font-size:min(7vh,8.5vw);font-weight:700;line-height:1;
  color:#fff;text-align:center;padding:0 0.3em;
  white-space:nowrap;
}
.cell-reading{
  color:#FFE082;font-size:clamp(15px,2.1vh,20px);font-weight:700;line-height:1.15;
  text-align:center;padding:0 3.4em;white-space:normal;
}
#grid.hide-readings .cell-reading{display:none}

/* Grid Header & Mute Controls */
#grid-header {
  display: none;
  justify-content: space-between;
  align-items: center;
  padding: 0 3vw;
  margin-bottom: 0.5vh;
  gap: 8px;
}
.grid-header-title {
  color: #FFE082;
  font-size: 2vh;
  font-weight: 700;
}
.grid-header-copy{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#scope-controls{display:none;align-items:center;gap:6px}
#scope-controls .scope-label{color:rgba(255,255,255,0.78);font-size:1.7vh;font-weight:700}
.scope-btn{
  min-height:44px;padding:5px 12px;border-radius:999px;
  border:1.5px solid rgba(255,224,130,0.35);background:rgba(8,28,66,0.5);
  color:rgba(255,255,255,0.82);font:700 1.7vh inherit;cursor:pointer;
}
.scope-btn.on{background:#FFE082;color:#12305f;border-color:#FFE082}
.scope-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.grid-ctrl-btn {
  padding: 4px 12px;
  font-size: 1.8vh;
  font-weight: 700;
  border-radius: 8px;
  border: 1.5px solid rgba(255,224,130,0.35);
  background: rgba(255,224,130,0.1);
  color: #FFE082;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.grid-ctrl-btn:hover {
  background: rgba(255,224,130,0.22);
  border-color: rgba(255,224,130,0.6);
  transform: scale(1.04);
}
.grid-ctrl-btn.on{background:#FFE082;color:#12305f;border-color:#FFE082}
.cell-star {
  position: absolute;
  top: 6px;
  left: 6px;
  z-index: 10;
  width: 4.2vh;
  height: 4.2vh;
  min-width: 26px;
  min-height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(0,0,0,0.45);
  color: rgba(255,255,255,0.4);
  font-size: 1.8vh;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
}
.cell-star:hover {
  transform: scale(1.1);
  background: rgba(0,0,0,0.65);
}
.cell-star.active {
  color: #FFD700;
  border-color: rgba(255,215,0,0.5);
  background: rgba(255,215,0,0.15);
}
@media (max-width: 600px) {
  #grid-header {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
  }
  .grid-header-copy{justify-content:center}
  #scope-controls{width:100%;justify-content:center}
  .scope-btn{font-size:13px;padding:5px 10px}
  .grid-header-title {
    font-size: 1.8vh;
  }
  .grid-ctrl-btn {
    font-size: 1.6vh;
    padding: 3px 8px;
  }
}

/* ===== PLAY AREA (choice / match / listen) ===== */
#play{display:none;flex:1;flex-direction:column;padding:1.5vh 3vw}
#play.show{display:flex}

/* choice + listen */
.play-wrap{display:flex;flex-direction:column;height:100%;gap:2vh}
.q-prompt{
  flex:0 0 30vh;display:flex;align-items:center;justify-content:center;gap:1.5vw;
  border-radius:18px;border:2px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);
}
.q-prompt .qp-emoji{font-size:18vh;line-height:1}
.q-prompt .qp-image{width:min(28vh,46vw);height:min(28vh,46vw)}
.q-prompt .qp-label{font-size:9vh;font-weight:700;color:#FFE082;line-height:1}
.q-prompt .qp-mean{font-size:9vh;font-weight:700;color:#FFE082;line-height:1.05;text-align:center;padding:0 2vw}
.q-prompt .qp-swatch{width:26vh;height:26vh;border-radius:24px;border:3px solid rgba(255,255,255,0.55);box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.q-listen{
  font-size:9vh;width:22vh;height:22vh;border-radius:50%;cursor:pointer;
  border:3px solid #FFD700;background:rgba(255,215,0,0.18);color:#FFE082;
  transition:background 0.12s,transform 0.1s;
}
.q-listen:hover{background:rgba(255,215,0,0.32);transform:scale(1.05)}
.q-options{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw}
.opt{
  display:flex;align-items:center;justify-content:flex-start;gap:1.5vw;
  border-radius:14px;cursor:pointer;padding:1vh 1.4vw;
  border:2.5px solid rgba(255,255,255,0.28);background:rgba(8,28,66,0.55);
  color:#fff;font-size:5vh;font-weight:700;text-align:center;line-height:1.05;
  transition:background 0.12s,border-color 0.12s,transform 0.1s;
}
.opt .opt-key{
  flex:0 0 auto;
  width:6.4vh;height:6.4vh;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:#FFD54F;color:#0D47A1;
  font-size:4vh;font-weight:800;line-height:1;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
.opt .opt-emoji{font-size:7vh;line-height:1}
.opt .opt-image{width:8vh;height:8vh;flex:0 0 auto}
.opt .opt-swatch{width:8vh;height:8vh;border-radius:16px;border:2px solid rgba(255,255,255,0.6)}
.opt:hover{background:rgba(255,255,255,0.16)}
.opt.ok{border-color:#43A047;background:rgba(67,160,71,0.35);color:#C8E6C9}
.opt.bad{border-color:#E53935;background:rgba(229,57,53,0.35)}

/* match */
.match-cols{flex:1;display:flex;gap:4vw;justify-content:center;align-items:center}
.mcol{flex:1;max-width:40vw;display:flex;flex-direction:column;gap:1.2vh;justify-content:center}
.mcard{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:1vw;
  border-radius:14px;cursor:pointer;padding:1vh 1.2vw;min-height:10vh;
  border:2.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);
  color:#fff;font-size:4vh;font-weight:700;text-align:center;line-height:1.05;
  transition:background 0.12s,border-color 0.12s,transform 0.12s,box-shadow 0.12s;
}
.mcard .mc-emoji{font-size:6vh;line-height:1}
.mcard .mc-image{width:7vh;height:7vh;flex:0 0 auto}
.mcard:hover{background:rgba(255,255,255,0.16)}
.mcard.sel{
  border-color:#ffffff !important;
  box-shadow:0 0 0 4px #ffffff, 0 0 0 7px #000000, 0 8px 20px rgba(0,0,0,0.4) !important;
  transform:scale(1.04);
  z-index:2;
}
.mcard.matched{border-color:#43A047;background:rgba(67,160,71,0.28);color:#C8E6C9;pointer-events:none}
.mcard.wrong{border-color:#E53935;background:rgba(229,57,53,0.3);animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* spell (สะกดคำ) */
.spell-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer}
.sp-visual{height:18vh;display:flex;align-items:center;justify-content:center}
.sp-visual .sp-emoji{font-size:16vh;line-height:1}
.sp-visual .sp-image{width:18vh;height:18vh}
.sp-visual .sp-swatch{width:18vh;height:18vh;border-radius:50%;border:3px solid rgba(255,255,255,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.sp-letters{display:flex;gap:1.4vw;justify-content:center;flex-wrap:wrap;max-width:94vw}
.sp-letter{
  min-width:10vh;height:13vh;padding:0 1vh;
  display:flex;align-items:center;justify-content:center;
  font-size:8vh;font-weight:700;line-height:1;text-transform:uppercase;
  border-radius:14px;border:2.5px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4);
  opacity:0.5;transform:scale(0.92);
  transition:opacity 0.18s,transform 0.18s,background 0.18s,border-color 0.18s,color 0.18s;
}
.sp-letter.done{opacity:1;transform:scale(1);color:#FFE082;border-color:rgba(255,224,130,0.45)}
.sp-letter.on{
  opacity:1;transform:scale(1.1);z-index:2;
  background:#FFD700;border-color:#FF8F00;color:#1A237E;
  box-shadow:0 10px 26px rgba(0,0,0,0.45);
}
.sp-read,.sp-mean{font-size:5vh;font-weight:700;line-height:1.1;text-align:center;opacity:0;transition:opacity 0.35s}
.sp-read{color:#fff}
.sp-read b{color:#FFD700}
.sp-mean{color:#FFE082}
.sp-mean b{color:#FFD700}
.sp-read.show,.sp-mean.show{opacity:1}

/* Bottom bar */
#bottom{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:stretch;
  padding:0.6vh 1.5vw 0.8vh;
  gap:4px;
}
#dotsnav{
  display:flex;gap:10px;align-items:center;justify-content:center;
}
#dots{display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.25);transition:background 0.2s}
.dot.active{background:#FFD700}
#lctrl{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.cbtn{
  font-size:1.55vh;
  padding:3px 8px;border-radius:5px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.65);
  transition:background 0.12s,color 0.12s;
}
.cbtn:hover{background:rgba(255,255,255,0.18)}
.cbtn.on{background:#FFD700;border-color:#FF8F00;color:#1A237E;font-weight:700}
#btn-home{color:rgba(255,224,130,0.7);border-color:rgba(255,224,130,0.3)}
#btn-home:hover{background:rgba(255,224,130,0.15);color:#FFE082}
#score{font-size:2vh;font-weight:700;color:#fff;white-space:nowrap;text-align:center}
#score b{color:#FFD700}
#speed{
  display:flex;align-items:center;justify-content:center;gap:4px;
}
#speed label{font-size:1.55vh;color:rgba(255,255,255,0.45);margin-right:2px}
.spd{
  font-size:1.55vh;
  padding:3px 9px;border-radius:5px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);
  transition:background 0.12s,color 0.12s;
}
.spd:hover{background:rgba(255,255,255,0.18)}
.spd.on{background:#FFD700;border-color:#FF8F00;color:#1A237E;font-weight:700}
#flash-variant{display:none;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
#flash-variant label{font-size:1.55vh;color:rgba(255,255,255,0.45);margin-right:2px}
.fv{
  font-size:1.55vh;
  padding:3px 9px;border-radius:5px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);
  transition:background 0.12s,color 0.12s;
}
.fv:hover{background:rgba(255,255,255,0.18)}
.fv.on{background:#FFD700;border-color:#FF8F00;color:#1A237E;font-weight:700}
#flash-reset{
  font-size:1.7vh;line-height:1;
  padding:3px 8px;border-radius:5px;cursor:pointer;margin-left:4px;
  border:1px solid rgba(255,224,130,0.35);
  background:rgba(255,224,130,0.1);color:rgba(255,224,130,0.8);
  transition:background 0.12s,color 0.12s;
}
#flash-reset:hover{background:rgba(255,224,130,0.22);color:#FFE082}
#wfront .wf-swatch{display:inline-block;width:18vh;height:18vh;border-radius:24px;border:3px solid rgba(255,255,255,0.55);box-shadow:0 8px 24px rgba(0,0,0,0.35);vertical-align:middle}

/* Quiz (flash) controls — in-flow row ใต้การ์ด เหนือแถบล่าง */
#quiz-ctrl{
  display:none;flex:0 0 auto;justify-content:center;align-items:center;
  gap:20px;padding:1.2vh 2vw;z-index:30;
}
#quiz-ctrl.show{display:flex}
.qbtn{
  font-size:3.2vh;font-weight:700;
  padding:0.7vh 5vw;border-radius:12px;cursor:pointer;
  border:2px solid rgba(255,255,255,0.35);
  background:rgba(0,0,0,0.4);color:#fff;
  backdrop-filter:blur(6px);
  transition:background 0.15s,transform 0.1s;
}

/* Math Question — English arithmetic speaking practice */
.math-shell{width:min(920px,94vw);margin:auto;display:flex;flex-direction:column;align-items:center;gap:2vh;padding:2vh}
.math-settings,.math-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.math-settings-ops{gap:12px}
.math-chip{min-height:44px;padding:9px 16px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:700 2vh Sarabun,sans-serif;cursor:pointer}
.math-chip.on{background:#FFD54F;color:#172554;border-color:#FFF3B0}
.math-chip.math-op{min-width:56px;min-height:52px;padding:8px 14px;border-radius:14px;font-size:clamp(26px,4vh,36px);font-weight:900;line-height:1}
.math-question{font-size:clamp(30px,6vh,64px);font-weight:900;text-align:center;color:#fff;line-height:1.25}
.math-hint{font-size:clamp(15px,2.2vh,24px);color:rgba(255,255,255,.7);text-align:center}
.math-options{width:min(720px,92vw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.math-option{min-height:58px;border:2px solid rgba(255,255,255,.22);border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:clamp(20px,3vh,32px);font-weight:800;cursor:pointer}
.math-option:hover,.math-option:focus-visible{background:rgba(255,255,255,.18);outline:3px solid #FFD54F;outline-offset:2px}
.math-option.ok{background:#2E7D32;border-color:#81C784}.math-option.bad{background:#C62828;border-color:#EF9A9A}
.math-answer{display:none;width:min(760px,92vw);padding:18px;border-radius:18px;background:rgba(255,213,79,.12);border:2px solid rgba(255,213,79,.45);text-align:center}
.math-answer.show{display:block}.math-answer-en{font-size:clamp(24px,4.2vh,46px);font-weight:900;color:#FFD54F}.math-answer-th{margin-top:7px;font-size:clamp(16px,2.2vh,23px);color:#fff}
.math-primary{min-height:48px;padding:10px 24px;border:0;border-radius:14px;background:#FFD54F;color:#172554;font-size:clamp(17px,2.4vh,24px);font-weight:900;cursor:pointer}
.math-secondary{min-height:48px;padding:10px 20px;border:2px solid rgba(255,255,255,.24);border-radius:14px;background:rgba(255,255,255,.09);color:#fff;font-size:clamp(16px,2.2vh,22px);font-weight:800;cursor:pointer}
@media (max-width:560px){.math-options{grid-template-columns:1fr}.math-shell{padding:1vh}.math-chip{font-size:16px;padding:8px 11px}.math-chip.math-op{min-width:48px;font-size:28px}}
.qbtn:hover{background:rgba(0,0,0,0.6);transform:scale(1.05)}
#btn-reveal{border-color:#FFD700;color:#FFE082}
#btn-reveal:hover{background:rgba(255,215,0,0.3)}
#btn-next{display:none}
#btn-next.show{display:block}
#btn-know,#btn-review{display:none}
#btn-know.show,#btn-review.show{display:block}
#btn-know{border-color:#43A047;color:#C8E6C9}
#btn-know:hover{background:rgba(67,160,71,0.3)}
#btn-review{border-color:#FFD700;color:#FFE082}
#btn-review:hover{background:rgba(255,215,0,0.3)}

/* True/False UI */
#tf-game {
  display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:3vh; padding:0 2vw;
}
.tf-prompt {
  font-size:min(12vh, 10vw); font-weight:700; color:#FFE082; text-align:center;
}
.tf-sub {
  font-size:7vh; font-weight:700; color:#fff; text-align:center; margin-top:1vh;
}
.tf-btns {
  display:flex; gap:6vw; width:100%; max-width:600px; justify-content:center; margin-top:2vh;
}
.tf-btn {
  font-size:4vh; font-weight:700; padding:1.5vh 6vw; border-radius:16px; cursor:pointer;
  border:3px solid rgba(255,255,255,0.35); text-shadow:0 2px 4px rgba(0,0,0,0.5);
  box-shadow:0 6px 16px rgba(0,0,0,0.35); transition:transform 0.15s, background 0.15s;
}
.tf-btn:active { transform:scale(0.95); }
.tf-btn.false { background:linear-gradient(135deg, #ef5350, #c62828); border-color:#ef9a9a; color:#fff; }
.tf-btn.true { background:linear-gradient(135deg, #66bb6a, #2e7d32); border-color:#a5d6a7; color:#fff; }

/* Word Search UI */
#ws-game {
  display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:2vh; padding:0 2vw;
}
.ws-layout {
  display:flex; align-items:center; justify-content:center; gap:4vw; width:100%; max-width:1000px;
}
.ws-grid-wrap {
  position:relative; background:rgba(0,0,0,0.3); border-radius:18px; padding:10px; border:2px solid rgba(255,255,255,0.15);
}
.ws-grid {
  display:grid; grid-template-columns:repeat(10, 1fr); gap:6px; width:min(55vh, 76vw); height:min(55vh, 76vw);
  user-select:none; -webkit-user-select:none;
}
.ws-cell {
  display:flex; align-items:center; justify-content:center;
  font-size:min(3.2vh, 4.2vw); font-weight:700; color:#fff; background:rgba(255,255,255,0.06);
  border-radius:8px; border:1px solid rgba(255,255,255,0.12); cursor:pointer;
  transition:background 0.15s, color 0.15s;
}
.ws-cell.dragged { background:rgba(255, 215, 0, 0.4); color:#FFD700; }
.ws-cell.found { background:rgba(76, 175, 80, 0.45); color:#a5d6a7; border-color:#81c784; }
.ws-words {
  display:flex; flex-direction:column; gap:1vh; width:220px; background:rgba(0,0,0,0.25);
  padding:1.5vh; border-radius:12px; border:1px solid rgba(255,255,255,0.1); height:min(55vh, 76vw); overflow-y:auto;
}
.ws-word-item {
  font-size:2.2vh; font-weight:600; color:#fff; padding:6px 12px; border-radius:6px;
  background:rgba(255,255,255,0.05); text-align:left; transition:opacity 0.2s, background 0.2s;
}
.ws-word-item.found {
  text-decoration:line-through; opacity:0.5; color:#a5d6a7; background:rgba(76,175,80,0.15);
}

/* Flip Race & General Time Overlay */
.fr-timer {
  font-size:2.8vh; font-weight:700; color:#fff; background:rgba(0,0,0,0.45);
  padding:6px 16px; border-radius:20px; border:1px solid rgba(255,255,255,0.15);
  margin-bottom:1vh; display:inline-flex; align-items:center; gap:8px;
}

/* Flash Enhancements */
#btn-c1 { border-color:#e53935; color:#ff8a80; }
#btn-c1:hover { background:rgba(229,57,53,0.3); }
#btn-c2 { border-color:#fb8c00; color:#ffd180; }
#btn-c2:hover { background:rgba(251,140,0,0.3); }
#btn-c3 { border-color:#43a047; color:#b9f6ca; }
#btn-c3:hover { background:rgba(67,160,71,0.3); }
#btn-flash-prev { border-color:#90a4ae; color:#cfd8dc; }
#btn-flash-prev:hover { background:rgba(144,164,174,0.3); }

/* Progress bar */
#bar-wrap{position:fixed;top:0;left:0;width:100%;height:3px;z-index:20;background:rgba(255,255,255,0.1)}
#bar{height:100%;background:#FFD700;transition:width 0.25s linear}

/* Toast */
#toast{
  position:fixed;top:11vh;left:50%;transform:translateX(-50%) translateY(-20px);

  opacity:0;pointer-events:none;transition:opacity 0.18s,transform 0.18s;z-index:50;backdrop-filter:blur(4px);
}

/* Win overlay */
#win{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:rgba(13,71,161,0.92);overflow-y:auto}
#win.show{display:flex}
#win .win-emoji{font-size:16vh;line-height:1;animation:pop 0.5s}
@keyframes pop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
#win .win-text{font-size:5vh;font-weight:700;color:#FFE082}
#win .win-stars{font-size:6vh;line-height:1}
#win .win-score{font-size:2.8vh;color:#fff}
#win .win-btns{display:flex;gap:2vw;margin-top:1vh}
.win-btn{font-size:3vh;font-weight:700;padding:1.1vh 3.5vw;border-radius:14px;cursor:pointer;
  border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.1);color:#fff;transition:background 0.14s,transform 0.1s}
.win-btn:hover{background:rgba(255,255,255,0.22);transform:scale(1.04)}
.win-btn.primary{border-color:#FFD700;background:rgba(255,215,0,0.25);color:#FFE082}

#cfx{position:fixed;inset:0;z-index:70;pointer-events:none;display:none}

/* ===== STUDENT BANNER (Hub) ===== */
#hub-student-banner{
  display:none;

.hsb-avatar{

/* ===== LEADERBOARD (Hub) ===== */
#hub-leaderboard{

function scrambleWord(en){
  const chars = en.replace(/[^A-Za-z]/g,'').toUpperCase().split('');
  if(chars.length<2) return chars.join(' ');
  let out, guard=0;
  do { out = chars.slice().sort(()=>Math.random()-0.5); guard++; }
  while(out.join('')===chars.join('') && guard<20);
  return out.join(' ');
}

function sayText(item){
  const slug = item.sourceSlug || currentSlug;
  if (slug === 'alphabet') return item.label;   // อ่านชื่อตัวอักษรเดี่ยว (A) ไม่อ่านคำตัวอย่าง (A for Apple)
  return (item.en || item.label).replace(/\s*–\s*/g, ' for ');
}
function sayThaiText(item){
  let parts = [];
  if (item.th) {
    parts.push("อ่านว่า " + item.th);
  }
  if (item.meaning) {
    parts.push("แปลว่า " + item.meaning);
  }
  if (parts.length === 0) {
    parts.push(item.label);
  }
  return parts.join(" ");
}
function _speakOne(text, lang, voice, rate, onDone){
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; if(voice) u.voice = voice; u.rate = rate;
    if(onDone){ u.onend=onDone; u.onerror=onDone; }
    speechSynthesis.speak(u);
  } catch(_){ if(onDone) onDone(); }
}
function speak(item, onDone, voiceOverride){
  if (!window.speechSynthesis){ if(onDone) onDone(); return; }
  const m = ['en','th','both'].includes(voiceOverride) ? voiceOverride : voiceMode;
  try {
    speechSynthesis.cancel();
    if(m === 'th'){
      _speakOne(sayThaiText(item), 'th-TH', thVoice, 0.95, onDone);
    } else if(m === 'both'){
      _speakOne(sayText(item), 'en-US', enVoice, 0.9, ()=>{
        setTimeout(()=>{ _speakOne(sayThaiText(item), 'th-TH', thVoice, 0.95, onDone); }, 180);
      });
    } else {
      _speakOne(sayText(item), 'en-US', enVoice, 0.9, onDone);
    }
  } catch(_){ if(onDone) onDone(); }
}
// อ่านชื่อตัวอักษรทีละตัว — ไม่ cancel (queue ต่อกัน กันตัดเสียงตัวก่อนหน้า)

    if(onDone){ u.onend=onDone; u.onerror=onDone; }
    speechSynthesis.speak(u);
  } catch(_){ if(onDone) onDone(); }
}
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}} return actx; }
function tone(freq, start, dur, type='sine', vol=0.16){
  const c = ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const t=c.currentTime+start;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

  if(n<=3)  return 'min(3.6vh,9vw)';
  if(n<=5)  return 'min(3.6vh,7vw)';

function confetti(){
  const ctx=cfx.getContext('2d'); cfx.width=innerWidth; cfx.height=innerHeight; cfx.style.display='block';
  const cols=['#FFD700','#FF6F61','#4FC3F7','#81C784','#BA68C8','#FFFFFF'], parts=[];
  for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-0.5)*15,vy:Math.random()*-13-3,c:cols[i%cols.length],s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4});
  let f=0;
  (function step(){
    f++; ctx.clearRect(0,0,cfx.width,cfx.height);
    parts.forEach(p=>{ p.vy+=0.4; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); });
    if(f<95) requestAnimationFrame(step); else { ctx.clearRect(0,0,cfx.width,cfx.height); cfx.style.display='none'; }
  })();
}

        pbEl.classList.add('show');
      }

  sWin(); confetti();
  try{KAMPAI.sound.fxFlash(true);}catch(_){}

        finalScore = (typeof qLen !== 'undefined' && qLen > 0) ? Math.round((score / qLen) * 100) : 0;
      } else if (mode === 'math') {
        finalScore = mathScore;
      } else if (mode === 'match') {
        finalScore = 100;
      } else {
        finalScore = 100;
      }
    } else {
      finalScore = 100;
    }
    let starCount = 0;
    if (typeof stars === 'string') {
      starCount = (stars.match(/⭐/g) || []).length;
    }
    const scoreMeta = {
      stars: starCount,
      mode: (typeof mode !== 'undefined' ? mode : 'normal')
    };
    if (mode === 'math') Object.assign(scoreMeta, {
      difficulty: mathDifficulty, ops: mathOps.slice(), voice: mathVoiceGender, format: mathFormat, correct: mathCorrect,
      total: mathTotal, timeMs: Date.now() - mathStartTime
    });
    window.KAMPAI.submitScore(finalScore, scoreMeta);
  }
}

function buildCell(item, sIdx, cIdx){

function syncVisualGridSize(){
  if(!isVisualTopic || mode!=='auto' || !gridEl.clientWidth || !gridEl.clientHeight) return;
  const cols=matchMedia('(max-width: 768px)').matches?2:3;
  const rows=2;
  const style=getComputedStyle(gridEl);
  const gap=parseFloat(style.columnGap)||8;
  const padX=(parseFloat(style.paddingLeft)||0)+(parseFloat(style.paddingRight)||0);
  const padY=(parseFloat(style.paddingTop)||0)+(parseFloat(style.paddingBottom)||0);
  const size=Math.max(96,Math.floor(Math.min(
    (gridEl.clientWidth-padX-gap*(cols-1))/cols,
    (gridEl.clientHeight-padY-gap*(rows-1))/rows
  )));
  gridEl.style.setProperty('--visual-cols',cols);
  gridEl.style.setProperty('--visual-rows',rows);
  gridEl.style.setProperty('--visual-card-size',size+'px');
}
function rebuildTopicSlides(preserveItem){

  slides=[];
  for(let i=0;i<allItems.length;i+=ips) slides.push(allItems.slice(i,i+ips));
  slideEls=slides.map((slide,sIdx)=>slide.map((item,cIdx)=>buildCell(item,sIdx,cIdx)));
  dotsEl.innerHTML='';
  slides.forEach(()=>{ const dot=document.createElement('div'); dot.className='dot'; dotsEl.appendChild(dot); });
  dotElArr=Array.from(dotsEl.querySelectorAll('.dot'));
  if(isVisualTopic){
    gridEl.style.gridTemplateRows='';
  }else{
    gridEl.style.gridTemplateRows=`repeat(${Math.ceil(ips/2)}, 1fr)`;
  }
  const preservedIndex=preserveItem?allItems.indexOf(preserveItem):-1;
  const activeIndex=preservedIndex>=0?preservedIndex:0;
  curSlide=Math.floor(activeIndex/ips);
  curCell=activeIndex%ips;
}

// MATH QUESTION MODE — What is 9 + 9? / The answer is eighteen.
// =====================================================================
function numberWord(value){
  const item = TOPICS.numbers.find(it => Number(it.label) === value);
  return item ? item.en.toLowerCase() : String(value);
}
function mathThaiReading(word){
  const item = TOPICS.numbers.find(it => it.en.toLowerCase() === word.toLowerCase());
  return item ? item.th : word;
}
function mathRange(){
  // easy/medium = ช่วงตัวเลข · เครื่องหมายเลือกแยกปุ่ม + − × ÷
  if(mathDifficulty==='hard') mathDifficulty='medium';
  const max = mathDifficulty==='easy' ? 20 : 100;
  const ops = (Array.isArray(mathOps) && mathOps.length) ? mathOps.slice() : ['+','-'];
  return {max, ops};
}
function toggleMathOp(op){
  const allowed = ['+','-','×','÷'];
  if(!allowed.includes(op)) return;
  const on = mathOps.includes(op);
  if(on){
    if(mathOps.length<=1) return; // ต้องเหลืออย่างน้อย 1 เครื่องหมาย
    mathOps = mathOps.filter(o=>o!==op);
  }else{
    mathOps = allowed.filter(o=>mathOps.includes(o) || o===op);
  }
  startMathQuestion();
}
function makeMathQuestion(){
  const cfg=mathRange(), op=cfg.ops[Math.floor(Math.random()*cfg.ops.length)];
  let a=1,b=1,answer=2;
  if(op==='+'){
    a=1+Math.floor(Math.random()*(cfg.max-1));
    b=1+Math.floor(Math.random()*(cfg.max-a)); answer=a+b;
  }else if(op==='-'){
    a=2+Math.floor(Math.random()*(cfg.max-1));
    b=1+Math.floor(Math.random()*(a-1)); answer=a-b;
  }else if(op==='×'){
    a=2+Math.floor(Math.random()*9); b=2+Math.floor(Math.random()*9); answer=a*b;
  }else{
    b=2+Math.floor(Math.random()*9); answer=1+Math.floor(Math.random()*Math.floor(cfg.max/b)); a=b*answer;
  }
  return {a,b,op,answer};
}
function pickEnVoiceByGender(gender){
  const wantMale = gender === 'male';
  const vs = ((window.speechSynthesis && speechSynthesis.getVoices()) || [])
    .filter(v => v.lang && /^en/i.test(v.lang));
  if(!vs.length) return null;
  const femaleRe = /female|woman|girl|zira|samantha|karen|susan|hazel|jenny|aria|emma|amy|salli|joanna|ivy|kendra|kimberly|michelle|raveena|olivia|sonia|linda|heather|catherine|moira|fiona|tessa|veena|allison|ava|serena|natalie|google us english$/i;
  const maleRe = /male|man|boy|david|mark|george|guy|ryan|brian|matthew|justin|joey|daniel|thomas|arthur|ravi|aaron|eric|james|fred|noah|oliver|tom|google uk english male|microsoft david|microsoft mark|microsoft george/i;
  const clearRe = /natural|neural|online|premium|enhanced|google|microsoft|samantha|aria|jenny|guy|ryan/i;
  const scored = vs.map(v => {
    const n = String(v.name || '');
    let score = 0;
    if(wantMale){
      if(maleRe.test(n)) score += 12;
      if(femaleRe.test(n)) score -= 12;
    }else{
      if(femaleRe.test(n)) score += 12;
      if(maleRe.test(n)) score -= 12;
    }
    if(clearRe.test(n)) score += 5;
    if(/en[-_]US/i.test(v.lang)) score += 3;
    else if(/en[-_]GB/i.test(v.lang)) score += 2;
    else if(/en[-_]AU/i.test(v.lang)) score += 1;
    if(v.localService) score += 1;
    return { v, score };
  }).sort((a, b) => b.score - a.score);
  return scored[0].v;
}
function mathOpSpeakWord(op){
  if(op === '+') return 'plus';
  if(op === '-') return 'minus';
  if(op === '×') return 'times';
  return 'divided by';
}
function mathQuestionSpeakParts(q){
  if(!q) return [];
  return [
    'What is',
    numberWord(q.a),
    mathOpSpeakWord(q.op),
    numberWord(q.b) + '?',
  ];
}
function mathAnswerSpeakParts(q){
  if(!q) return [];
  return ['The answer is', numberWord(q.answer) + '.'];
}
let mathSpeakGen = 0;
function mathSpeakCancel(){
  mathSpeakGen += 1;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(_){}
}
function mathSpeakParts(parts){
  if(!window.speechSynthesis || !parts || !parts.length) return;
  const gen = ++mathSpeakGen;
  try{ speechSynthesis.cancel(); }catch(_){}
  const voice = pickEnVoiceByGender(mathVoiceGender);
  let index = 0;
  function speakNext(){
    if(gen !== mathSpeakGen) return;
    if(index >= parts.length) return;
    const isFirst = index === 0;
    const chunk = String(parts[index++] || '').trim();
    if(!chunk){ setTimeout(speakNext, 40); return; }
    try{
      const u = new SpeechSynthesisUtterance(chunk);
      u.lang = (voice && voice.lang) || 'en-US';
      if(voice) u.voice = voice;
      // ช้า + ชัด สำหรับเด็กประถม ฟังตามทัน
      u.rate = 0.74;
      u.pitch = 1.0;
      u.volume = 1;
      const gapAfter = index >= parts.length ? 0 : 340;
      u.onend = () => setTimeout(speakNext, gapAfter);
      u.onerror = () => setTimeout(speakNext, 100);
      setTimeout(() => {
        if(gen !== mathSpeakGen) return;
        try{ speechSynthesis.speak(u); }catch(_){ setTimeout(speakNext, 100); }
      }, isFirst ? 90 : 0);
    }catch(_){
      setTimeout(speakNext, 100);
    }
  }
  speakNext();
}
function mathSpeakQuestion(q){
  mathSpeakParts(mathQuestionSpeakParts(q));
}
function mathSpeakAnswer(q){
  mathSpeakParts(mathAnswerSpeakParts(q));
}
function mathSpeak(text){
  // fallback ข้อความเดี่ยว (ยังช้าและชัด)
  if(!text) return;
  mathSpeakParts([String(text)]);
}
function setMathVoiceGender(gender){
  mathVoiceGender = gender === 'male' ? 'male' : 'female';
  try{ localStorage.setItem('kvh_math_voice', mathVoiceGender); }catch(_){}
  document.querySelectorAll('[data-math-voice]').forEach(btn=>{
    const on = btn.dataset.mathVoice === mathVoiceGender;
    btn.classList.toggle('on', on);

function startMathQuestion(){

function renderMathQuestion(){

    if(candidate>=1&&candidate<=100) answers.add(candidate);
  }
  const options=[...answers].sort(()=>Math.random()-.5);
  const opLabel={'+':'บวก','-':'ลบ','×':'คูณ','÷':'หาร'};
  const opHint=mathOps.map(o=>opLabel[o]||o).join(' · ');
  const voiceHint=mathVoiceGender==='male'?'เสียงชาย':'เสียงหญิง';
  playEl.innerHTML=`<div class="math-shell">
    <div class="math-settings" aria-label="ช่วงตัวเลข">
      <button type="button" class="math-chip${mathDifficulty==='easy'?' on':''}" data-math-level="easy">ง่าย 1–20</button>

      <button type="button" class="math-chip math-op${mathOps.includes('+')?' on':''}" data-math-op="+" title="บวก" aria-pressed="${mathOps.includes('+')}">+</button>
      <button type="button" class="math-chip math-op${mathOps.includes('-')?' on':''}" data-math-op="-" title="ลบ" aria-pressed="${mathOps.includes('-')}">−</button>
      <button type="button" class="math-chip math-op${mathOps.includes('×')?' on':''}" data-math-op="×" title="คูณ" aria-pressed="${mathOps.includes('×')}">×</button>
      <button type="button" class="math-chip math-op${mathOps.includes('÷')?' on':''}" data-math-op="÷" title="หาร" aria-pressed="${mathOps.includes('÷')}">÷</button>
    </div>
    <div class="math-settings" aria-label="เลือกเสียงอ่าน ผู้ชายหรือผู้หญิง">
      <button type="button" class="math-chip${mathVoiceGender==='female'?' on':''}" data-math-voice="female" aria-pressed="${mathVoiceGender==='female'}">👩 หญิง</button>
      <button type="button" class="math-chip${mathVoiceGender==='male'?' on':''}" data-math-voice="male" aria-pressed="${mathVoiceGender==='male'}">👨 ชาย</button>
    </div>
    <div class="math-settings" aria-label="รูปแบบคำตอบ">
      <button type="button" class="math-chip${mathFormat==='reveal'?' on':''}" data-math-format="reveal">คิดแล้วเฉลย</button>
      <button type="button" class="math-chip${mathFormat==='choice'?' on':''}" data-math-format="choice">เลือกตอบ</button>
    </div>
    <div class="math-hint">ข้อ ${mathPos+1}/${mathTotal} · คะแนน ${mathScore} · ตอบต่อเนื่อง ${mathStreak} · ${opHint} · ${voiceHint}</div>
    <div class="math-question">What is ${q.a} ${q.op} ${q.b}?</div>
    <button type="button" class="math-secondary" id="math-speak-question">🔊 ฟังโจทย์</button>
    ${mathFormat==='choice'?`<div class="math-options">${options.map(n=>`<button type="button" class="math-option" data-math-answer="${n}">${numberWord(n)}</button>`).join('')}</div>`:''}
    <div class="math-answer" id="math-answer"><div class="math-answer-en">The answer is ${answerWord}.</div><div class="math-answer-th">ดิ แอนเซอร์ อิส ${mathThaiReading(answerWord)} · คำตอบคือ ${q.answer}</div></div>
    <div class="math-actions"><button type="button" class="math-primary" id="math-reveal">${mathFormat==='choice'?'ดูเฉลย':'เฉลย'}</button><button type="button" class="math-secondary" id="math-next" style="display:none">ข้อต่อไป ›</button></div>
  </div>`;
  setScore(`Math Question · <b>${mathScore}</b> คะแนน`);
  document.getElementById('math-speak-question').onclick=()=>mathSpeakQuestion(q);
  document.querySelectorAll('[data-math-level]').forEach(btn=>btn.onclick=()=>{mathDifficulty=btn.dataset.mathLevel==='easy'?'easy':'medium';startMathQuestion();});
  document.querySelectorAll('[data-math-op]').forEach(btn=>btn.onclick=()=>toggleMathOp(btn.dataset.mathOp));
  document.querySelectorAll('[data-math-voice]').forEach(btn=>btn.onclick=()=>setMathVoiceGender(btn.dataset.mathVoice));
  document.querySelectorAll('[data-math-format]').forEach(btn=>btn.onclick=()=>{mathFormat=btn.dataset.mathFormat;startMathQuestion();});
  document.querySelectorAll('[data-math-answer]').forEach(btn=>btn.onclick=()=>checkMathAnswer(Number(btn.dataset.mathAnswer),btn));

function checkMathAnswer(value,btn){
  if(mathLocked) return;
  mathLocked=true;
  const correct=value===mathQuestion.answer;
  btn.classList.add(correct?'ok':'bad');
  document.querySelectorAll('[data-math-answer]').forEach(b=>{if(Number(b.dataset.mathAnswer)===mathQuestion.answer)b.classList.add('ok');b.disabled=true;});
  if(correct){ mathCorrect++; mathStreak++; mathScore+=10+Math.min(mathStreak-1,5)*2; try{KAMPAI.sound.correct();}catch(_){} }
  else{ mathStreak=0; try{KAMPAI.sound.wrong();}catch(_){} }
  revealMathAnswer(true);
}

function renderSlide(sIdx){
  gridEl.innerHTML='';
  slideEls[sIdx].forEach(el=>gridEl.appendChild(el));
  requestAnimationFrame(syncVisualGridSize);
}
function applyHl(sIdx,cIdx){ slideEls[sIdx].forEach((el,i)=>el.classList.toggle('hl',i===cIdx)); }
function setBannerAuto(item){
  tcard.classList.remove('flipped');
  wfront.textContent=item.en;
  wfront.style.fontSize=bannerFontSize(item.en);
  wfrontSub.textContent=currentSlug === 'fruits' && item.th && showThaiReading
    ? 'คำอ่าน: '+item.th
    : (item.meaning || '');
  updatePhonicsHint(item);
}
function updatePhonicsHint(item){
  if(!phonicsHint) return;
  const show = currentSlug === 'fruits' && voiceMode !== 'en' && item && Array.isArray(item.phonics);
  if(!show){ phonicsHint.style.display='none'; phonicsHint.innerHTML=''; return; }
  phonicsHint.style.display='flex';
  phonicsHint.innerHTML = '<span class="ph-label">ฝึกผสมเสียง</span>'
    + item.phonics.map((part,i)=>`${i?' <span class="ph-arrow">+</span> ':''}<button type="button" class="ph-part" data-phonics-part="${part}" aria-label="ฟังเสียงช่วง ${part}">${part}</button>`).join('')
    + `<span class="ph-arrow">→ ${item.en.toLowerCase()}</span>`;
}
function setHl(sIdx,cIdx){
  applyHl(sIdx,cIdx);
  curItem=slides[sIdx][cIdx];
  setBannerAuto(curItem);
  updateBannerStar();
  
  clearTimeout(timer);
  
  if (mode === 'auto' && !autoPaused) {
    timer = setTimeout(() => {
      curCell++;
      if (curCell >= slides[curSlide].length) {
        goTo(curSlide + 1);
      } else {
        setHl(curSlide, curCell);
      }
    }, cellMs);
  }

  barEl.style.width=((cIdx+1)/ips*100)+'%';
}
function goTo(idx){
  dotElArr[curSlide]?.classList.remove('active');
  curSlide=((idx%slides.length)+slides.length)%slides.length;
  curCell=0;
  dotElArr[curSlide]?.classList.add('active');
  renderSlide(curSlide);
  setHl(curSlide,0);
}
function startTimer(){
  clearTimeout(timer);
  if(mode!=='auto'||autoPaused) return;
  setHl(curSlide, curCell);
}
function pauseAuto(){
  if(mode!=='auto'||autoPaused) return;
  autoPaused=true;
  clearTimeout(timer);
  btnPause.textContent='▶'; btnPause.classList.add('on');
  if(window.speechSynthesis) speechSynthesis.cancel();
}
function resumeAuto(){
  if(mode!=='auto'||!autoPaused) return;
  autoPaused=false;
  btnPause.textContent='⏸'; btnPause.classList.remove('on');
  startTimer();
}

// FLASH MODE (สุ่ม) — flashcard หลายทิศ + deck รู้แล้ว/ทบทวน
// =====================================================================
function pickVariant(it){
  if(flashVariant!=='mixed') return flashVariant;
  const pool = applicableVariants(it);
  return pool[Math.floor(Math.random()*pool.length)];
}
function updateFlashScore(){
  if (isFlipRace) {
    const took = Date.now() - flashStartTime;
    setScore(`เวลา <b>${fmtTime(took)}</b> · เหลือ ${flashDeck.length}/${flashTotal} ใบ`);
  } else {
    const t = flashStartTime ? ' · ⏱ '+fmtTime(Date.now()-flashStartTime) : '';
    setScore(`รู้แล้ว <b>${flashKnown.size}</b>/${flashTotal} · เหลือ ${flashTotal-flashKnown.size}${t}`);
  }
}
function flashWin(){
  quizCtrl.classList.remove('show');
  clearInterval(flashTimer); flashTimer=null;
  const elapsed = flashStartTime ? Date.now()-flashStartTime : 0;
  const took = fmtTime(elapsed);
  
  if (isFlipRace) {
    const bestKey = flipRaceBestKey(currentSlug);
    let bestTime = parseInt(localStorage.getItem(bestKey) || '99999999');
    let isNewRecord = false;
    if (elapsed < bestTime) {
      bestTime = elapsed;
      localStorage.setItem(bestKey, bestTime.toString());
      isNewRecord = true;
    }
    
    let html = `เคลียร์การ์ดครบ <b>${flashTotal}</b> ใบ<br>ใช้เวลา <b>${took}</b>`;
    if (isNewRecord) {
      html += `<br><span style="color:#FFD700;font-weight:700">✨ สถิติใหม่! ✨</span>`;
    } else {
      html += `<br><span style="font-size:0.8em;opacity:0.8">เวลาดีที่สุด: ${fmtTime(bestTime)}</span>`;
    }
    
    try {
      KAMPAI.submitScore(flashTotal, {
        mode: 'fliprace',
        topic: currentSlug,
        timeMs: elapsed,
        stars: 3
      });
    } catch (_) {}
    
    showWin('🏆', isNewRecord ? 'ทำลายสถิติ!' : 'สุดยอด!', html, '⭐⭐⭐');
  } else {
    // สถิติ: คำที่กดทบทวนบ่อยสุด (ยังไม่แม่น)
    const hard = Object.entries(flashReviewCount)
      .filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([i,n])=>`${allItems[i].en} (${n})`);
    let html = `รู้แล้วครบ <b>${flashTotal}</b> คำ${took?` · ใช้เวลา <b>${took}</b>`:''}`;
    if(hard.length) html += `<br><span style="font-size:0.8em;opacity:0.85">ทบทวนบ่อย: ${hard.join(' · ')}</span>`;
    try{KAMPAI.submitScore(flashTotal,{mode:'flash',topic:currentSlug,variant:flashVariant,timeMs:elapsed,stars:3});}catch(_){}
    showWin('🎉','เก่งมาก!', html, '⭐⭐⭐');
  }
}
function renderFlashCard(){
  // ข้ามใบที่ "รู้แล้ว" ออกจากหัวกอง — กองหมด = ฉลอง
  while(flashDeck.length && flashKnown.has(flashDeck[0])) flashDeck.shift();
  if(!flashDeck.length){ flashWin(); return; }
  const it = allItems[flashDeck[0]]; curItem=it;
  updateBannerStar();
  
  // บันทึกประวัติใบที่แสดงเพื่อเตรียมปุ่ม Prev (เฉพาะในโหมด Flash ปกติ)
  if (!isFlipRace) {
    if (flashHistory.length === 0 || flashHistory[flashHistory.length - 1] !== flashDeck[0]) {
      if (flashHistory.length >= 15) flashHistory.shift();
      flashHistory.push(flashDeck[0]);
    }
  }
  
  // แสดงปุ่มย้อนกลับก็ต่อเมื่อประวัติยาวพอที่จะย้อน
  if (!isFlipRace && flashHistory.length > 1) {
    btnFlashPrev.style.display = 'block';
  } else {
    btnFlashPrev.style.display = 'none';
  }
  
  const v = flashRevealVariant = pickVariant(it);
  tcard.classList.remove('flipped'); revealed=false;
  // ----- FRONT (โจทย์ตามทิศ) -----
  if(v==='th2en'){ wfront.textContent=thSide(it); wfront.style.fontSize=bannerFontSize(thSide(it)); }
  else if(v==='pic2word'){
    wfront.innerHTML = it.image
      ? imageMarkup(it,'wf-image','wf-emoji')
      : (it.emoji ? `<span class="wf-emoji">${it.emoji}</span>` : `<span class="wf-swatch" style="background:${it.bgColor}"></span>`);
    wfront.style.fontSize='14vh';
  }
  else if(v==='audio2word'){ wfront.textContent='🔊'; wfront.style.fontSize='14vh'; speak(it,null,'en'); }  // ฟัง→ทาย: เล่นเสียงทันที (บังคับ EN ไม่ให้เฉลย)
  else if(v==='spell2word'){ const sc=scrambleWord(it.en); wfront.textContent=sc; wfront.style.fontSize=bannerFontSize(sc.replace(/ /g,'')); }  // สะกด: ตัวอักษรสลับ
  else { wfront.textContent=it.en; wfront.style.fontSize=bannerFontSize(it.en); }                  // en2th
  wfrontSub.textContent='';
  updatePhonicsHint(it);
  // ----- BACK (เฉลย: คำเต็ม + คำอ่าน + ไทย) -----
  wbackEn.textContent=it.en; wbackEn.style.fontSize=backEnFontSize(it.en);
  wbackTh.textContent='('+it.th+')';
  wbackMean.textContent=thSide(it);
  wbackExample.textContent=it.example || '';
  // ----- controls + progress -----
  btnReveal.style.display=''; btnNext.classList.remove('show');
  
  if (isFlipRace) {
    btnFlashPrev.style.display = 'none';
    btnC1.style.display = 'none';
    btnC2.style.display = 'none';
    btnC3.style.display = 'none';
    btnKnow.classList.remove('show'); btnReview.classList.remove('show');
  } else {
    btnC1.classList.remove('show'); btnC2.classList.remove('show'); btnC3.classList.remove('show');
  }
  
  quizCtrl.classList.add('show');
  updateFlashScore();
  barEl.style.width=(flashKnown.size/flashTotal*100)+'%';
}
function startFlash(){
  const candidates = [...Array(allItems.length).keys()].filter(i=>flashVariant!=='pic2word' || hasVisual(allItems[i]));
  flashTotal = candidates.length;
  // โหลด "รู้แล้ว" ที่จำไว้ → เริ่มจากเฉพาะคำที่ยังไม่แม่น
  const knownEns = loadKnownEns(currentSlug);
  flashKnown = new Set(candidates.filter(i=>knownEns.has(allItems[i].en)));
  flashDeck = shuffle(candidates.filter(i=>!flashKnown.has(i)));
  if(!flashDeck.length){    // แม่นครบทุกคำแล้ว → เริ่มทบทวนทั้งหมดใหม่ (ไม่ล้างที่จำไว้ใน localStorage)
    flashKnown = new Set();
    flashDeck = shuffle(candidates);
  }
  flashReviewCount = {};
  flashStartTime = Date.now();
  flashHistory = [];
  clearInterval(flashTimer);
  flashTimer = setInterval(()=>{ if(mode==='flash') updateFlashScore(); }, 1000);
  renderFlashCard();
}
function startFlipRace(){
  const candidates = [...Array(allItems.length).keys()].filter(i=>flashVariant!=='pic2word' || hasVisual(allItems[i]));
  flashTotal = candidates.length;
  flashKnown = new Set();
  flashDeck = shuffle(candidates);
  flashReviewCount = {};
  flashStartTime = Date.now();
  flashHistory = [];
  clearInterval(flashTimer);
  flashTimer = setInterval(()=>{ if(mode==='fliprace') updateFlashScore(); }, 1000);
  renderFlashCard();
}
function resetFlashProgress(){
  try { localStorage.removeItem(flashStoreKey(currentSlug)); } catch(_){}
  flashKnown = new Set();
  if (mode==='fliprace') startFlipRace(); else startFlash();
}

// CHOICE + LISTEN MODES (multiple choice w/ score)
// =====================================================================
function startQuizGame(){
  qOrder=shuffle([...Array(allItems.length).keys()]);
  qLen=Math.min(allItems.length,15);
  qOrder=qOrder.slice(0,qLen);
  qPos=0; score=0; streak=0; qLock=false;
  playEl.classList.add('show');
  renderQuestion();
}
const startChoice = startQuizGame;
const startListen = startQuizGame;
function glyph(item){
  const slug = item.sourceSlug || currentSlug;
  if(item.image)   return imageMarkup(item,'opt-image','opt-emoji');
  if(item.emoji)   return `<span class="opt-emoji">${item.emoji}</span>`;
  if(item.bgColor) return `<span class="opt-swatch" style="background:${item.bgColor}"></span>`;  // หมวดสี: ตัวเลือกเป็นช่องสี
  return slug==='months' ? item.en : item.label;   // months: ชื่อเต็ม (label เป็นตัวย่อ)
}
// ตัวเลือกทายคำ — alphabet โชว์คำตัวอย่าง (Apple) ไม่ใช่ "A – Apple" (กันตัวอักษรโจทย์โผล่ในคำตอบ)
function optLabel(item){
  const slug = item.sourceSlug || currentSlug;
  if(slug==='alphabet'){ return item.en.split('–').pop().trim(); }
  return item.en;
}
// โจทย์ทายคำ = cue ที่ "ไม่ใช่คำอังกฤษ" → ให้เด็กเลือกคำอังกฤษเอง (กันโจทย์เฉลยคำตอบตรงตัว)
function quizPrompt(item){
  if(item.image)   return imageMarkup(item,'qp-image','qp-emoji');
  if(item.emoji)   return `<span class="qp-emoji">${item.emoji}</span>`;        // รูป (สัตว์/ผลไม้/ร่างกาย/รูปทรง/ครอบครัว)
  if(item.bgColor) return `<span class="qp-swatch" style="background:${item.bgColor}"></span>`; // ช่องสี (สี)
  if(item.meaning) return `<span class="qp-mean">${item.meaning}</span>`;        // คำแปลไทย (วัน/เดือน)
  return `<span class="qp-label">${item.label}</span>`;                          // ตัวเลข (5) / ตัวอักษร (A)
}
function renderQuestion(){
  if(qPos>=qLen){
    const pct=Math.round(score/qLen*100);
    const stars = pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
    const starCount = pct>=90?3:pct>=60?2:1;
    try{KAMPAI.submitScore(score,{mode:mode,topic:currentSlug,total:qLen,percent:pct,stars:starCount});}catch(_){}
    showWin(pct>=80?'🏆':'👍','เล่นจบแล้ว!',`ตอบถูก <b>${score}</b>/${qLen} (${pct}%)`,stars);
    return;
  }
  qLock=false;
  const target=allItems[qOrder[qPos]];
  curItem=target;
  setScore(`ข้อ <b>${qPos+1}</b>/${qLen} · ถูก <b>${score}</b> · สตรีค ${streak}🔥`);
  // build 4 options
  const others=shuffle(allItems.filter(x=>x!==target)).slice(0,3);
  const opts=shuffle([target,...others]);
  const isListen = mode==='listen';
  let promptHtml;
  if(isListen){
    promptHtml=`<button class="q-listen" id="q-play">🔊</button>`;
  } else {
    promptHtml=`<div class="q-prompt">${quizPrompt(target)}</div>`;
  }
  playEl.innerHTML=
    `<div class="play-wrap">`+
      promptHtml+
      `<div class="q-options" id="q-opts"></div>`+
    `</div>`;
  const optWrap=document.getElementById('q-opts');
  opts.forEach((it,idx)=>{
    const b=document.createElement('div');
    b.className='opt';
    const key=String.fromCharCode(65+idx);   // A B C D
    b.innerHTML = `<span class="opt-key">${key}</span>` + (isListen ? glyph(it) : optLabel(it));
    b._item = it;
    b.addEventListener('click',()=>pickQuiz(it,target,b));
    optWrap.appendChild(b);
  });
  if(isListen){
    const pb=document.getElementById('q-play');
    pb.addEventListener('click',()=>speak(target,null,'en'));   // โหมดฟัง → ทาย: บังคับ EN ไม่ให้เฉลย
    speak(target,null,'en');
  } else {
    speak(target);
  }
}
function pickQuiz(choice,target,btn){
  if(qLock) return; qLock=true;
  if(choice===target){
    score++; streak++; btn.classList.add('ok'); toast(true,'ถูกต้อง!'); sCorrect(); speak(target);
  } else {
    streak=0; btn.classList.add('bad'); sWrong();
    toast(false, mode==='listen' ? ('คำตอบคือ '+target.label) : ('คำตอบคือ '+target.en));
    [...document.querySelectorAll('.opt')].forEach(o=>{
      if(o._item===target) o.classList.add('ok');   // เทียบด้วย item ตรง ๆ (รองรับ emoji/สี/ข้อความ)
    });
  }
  setScore(`ข้อ <b>${qPos+1}</b>/${qLen} · ถูก <b>${score}</b> · สตรีค ${streak}🔥`);
  setTimeout(()=>{ qPos++; renderQuestion(); }, choice===target?700:1250);
}

// =====================================================================
// MATCH MODE
// =====================================================================
function chunkEven(arr,maxPer){
  const n=Math.max(1,Math.ceil(arr.length/maxPer)), size=Math.ceil(arr.length/n), out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
function startMatch(){
  const picks=shuffle(allItems).slice(0, Math.min(allItems.length,12));
  mRounds=chunkEven(picks,6); mRi=0; mMatched=0; mTotal=picks.length; mLock=false;
  playEl.classList.add('show');
  renderMatchRound();
}
function matchCardInner(item, side){
  if(side==='l'){
    if(item.image) return imageMarkup(item,'mc-image','mc-emoji')+`<span>${escapeHtml(item.label)}</span>`;
    return item.emoji ? `<span class="mc-emoji">${item.emoji}</span><span>${item.label}</span>` : item.label;
  }
  const slug = item.sourceSlug || currentSlug;
  return item.meaning || (slug==='numbers' ? item.en : item.th);   // ขวา = คำแปล / numbers=คำอังกฤษ / alphabet=คำอ่าน
}
function renderMatchRound(){
  const round=mRounds[mRi];
  mSel={l:null,r:null};
  const lefts=round.map((it,i)=>({it,i}));
  const rights=shuffle(round.map((it,i)=>({it,i})));
  setScore(`จับคู่ <b>${mMatched}</b>/${mTotal} · รอบ ${mRi+1}/${mRounds.length}`);
  playEl.innerHTML=`<div class="match-cols"><div class="mcol" id="mc-l"></div><div class="mcol" id="mc-r"></div></div>`;
  const colL=document.getElementById('mc-l'), colR=document.getElementById('mc-r');
  lefts.forEach(({it,i})=>{
    const el=document.createElement('div'); el.className='mcard'; el.dataset.pid=i; el.dataset.side='l';
    const isColor = isColorTopic || (currentSlug === 'starred' && it.sourceSlug === 'colors');
    if(isColor&&it.bgColor){ el.style.background=it.bgColor; }
    el.innerHTML=matchCardInner(it,'l');
    el.addEventListener('click',()=>pickMatch(el)); colL.appendChild(el);
  });
  rights.forEach(({it,i})=>{
    const el=document.createElement('div'); el.className='mcard'; el.dataset.pid=i; el.dataset.side='r';
    el.innerHTML=matchCardInner(it,'r');
    el.addEventListener('click',()=>pickMatch(el)); colR.appendChild(el);
  });
}
function pickMatch(el){
  if(mLock||el.classList.contains('matched')) return;
  const side=el.dataset.side, pid=+el.dataset.pid, cur=mSel[side];
  if(cur&&cur.el===el){ el.classList.remove('sel'); mSel[side]=null; return; }
  if(cur) cur.el.classList.remove('sel');
  el.classList.add('sel'); mSel[side]={pid,el};
  if(mSel.l&&mSel.r){
    const L=mSel.l, R=mSel.r;
    if(L.pid===R.pid){
      L.el.classList.remove('sel'); R.el.classList.remove('sel');
      L.el.classList.add('matched'); R.el.classList.add('matched');
      mSel={l:null,r:null}; mMatched++;
      setScore(`จับคู่ <b>${mMatched}</b>/${mTotal} · รอบ ${mRi+1}/${mRounds.length}`);
      sCorrect();
      if([...playEl.querySelectorAll('.mcard.matched')].length === mRounds[mRi].length*2){
        if(mRi<mRounds.length-1){ mLock=true; toast(true,'รอบนี้ผ่าน!'); setTimeout(()=>{ mRi++; mLock=false; renderMatchRound(); },900); }
        else { try{KAMPAI.submitScore(mMatched,{mode:'match',topic:currentSlug,total:mTotal,stars:3});}catch(_){} showWin('🎉','จับคู่ครบแล้ว!',`ครบทั้ง <b>${mTotal}</b> คู่`,'⭐⭐⭐'); }
      }
    } else {
      mLock=true; L.el.classList.add('wrong'); R.el.classList.add('wrong');
      L.el.classList.remove('sel'); R.el.classList.remove('sel'); sWrong();
      setTimeout(()=>{ L.el.classList.remove('wrong'); R.el.classList.remove('wrong'); mSel={l:null,r:null}; mLock=false; },500);
    }
  }
}

// =====================================================================
// TIME ATTACK MODE (⏱️ แข่งเวลา) — ตอบมากที่สุดใน 60 วินาที
// =====================================================================
const TA_DURATION = 60;   // วินาที
function startTimeAttack(){
  taScore=0; taTotal=0; taStreak=0; taLock=false; taTimeLeft=TA_DURATION;
  taPool=shuffle([...Array(allItems.length).keys()]);
  playEl.classList.add('show');
  updateTaScore();
  barEl.style.width='100%';
  taTimer=setInterval(()=>{
    taTimeLeft--;
    barEl.style.width=(taTimeLeft/TA_DURATION*100)+'%';
    updateTaScore();
    if(taTimeLeft<=10) try{KAMPAI.sound.timeUp();}catch(_){}
    if(taTimeLeft<=0){ clearInterval(taTimer); taTimer=null; endTimeAttack(); }
  },1000);
  renderTimeAttackQ();
}
function updateTaScore(){
  setScore(`⏱️ <b>${taTimeLeft}</b>s · ถูก <b>${taScore}</b>/${taTotal} · สตรีค ${taStreak}🔥`);
}
function renderTimeAttackQ(){
  if(taTimeLeft<=0) return;
  taLock=false;
  // วน pool ถ้าหมด
  if(!taPool.length) taPool=shuffle([...Array(allItems.length).keys()]);
  const target=allItems[taPool.shift()];
  curItem=target;
  const others=shuffle(allItems.filter(x=>x!==target)).slice(0,3);
  const opts=shuffle([target,...others]);
  const promptHtml=`<div class="q-prompt">${quizPrompt(target)}</div>`;
  playEl.innerHTML=
    `<div class="play-wrap">`+
      promptHtml+
      `<div class="q-options" id="q-opts"></div>`+
    `</div>`;
  const optWrap=document.getElementById('q-opts');
  opts.forEach((it,idx)=>{
    const b=document.createElement('div');
    b.className='opt';
    const key=String.fromCharCode(65+idx);
    b.innerHTML = `<span class="opt-key">${key}</span>` + optLabel(it);
    b._item = it;
    b.addEventListener('click',()=>pickTimeAttack(it,target,b));
    optWrap.appendChild(b);
  });
}
function pickTimeAttack(choice,target,btn){
  if(taLock||taTimeLeft<=0) return; taLock=true;
  taTotal++;
  if(choice===target){
    taScore++; taStreak++; btn.classList.add('ok'); sCorrect();

  } else {
    taStreak=0; btn.classList.add('bad'); sWrong();

    [...document.querySelectorAll('.opt')].forEach(o=>{
      if(o._item===target) o.classList.add('ok');
    });
  }
  updateTaScore();
  setTimeout(()=>renderTimeAttackQ(), choice===target?400:800);
}
function endTimeAttack(){
  taLock=true;
  const pct = taTotal>0 ? Math.round(taScore/taTotal*100) : 0;
  const stars = pct>=90?3:pct>=60?2:1;
  const starsStr = '⭐'.repeat(stars);

}

// =====================================================================
function startTypein(){
  tiOrder=shuffle([...Array(allItems.length).keys()]);

  tiOrder=tiOrder.slice(0,tiLen);
  tiPos=0; tiScore=0; tiLock=false;

}
function renderTypeinQ(){
  if(tiPos>=tiLen){
    const pct=Math.round(tiScore/tiLen*100);
    const stars=pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
    const starCount=pct>=90?3:pct>=60?2:1;
    try{KAMPAI.submitScore(tiScore,{mode:'typein',topic:currentSlug,total:tiLen,percent:pct,stars:starCount});}catch(_){}
    showWin(pct>=80?'🏆':'👍','เล่นจบแล้ว!',`พิมพ์ถูก <b>${tiScore}</b>/${tiLen} (${pct}%)`,stars);
    return;
  }
  tiLock=false;
  const target=allItems[tiOrder[tiPos]];
  curItem=target;
  setScore(`ข้อ <b>${tiPos+1}</b>/${tiLen} · ถูก <b>${tiScore}</b>`);
  // โจทย์ = emoji/สี/คำแปลไทย
  const prompt = quizPrompt(target);
  // คำใบ้: ตัด hint (dash) แสดงจำนวนตัวอักษร
  const wordLen = target.en.length;
  const lenHint = wordLen > 1 ? `(${wordLen} ตัวอักษร)` : '';
  playEl.innerHTML=
    `<div class="play-wrap" style="align-items:center">`+
      `<div class="q-prompt">${prompt}</div>`+
      `<div class="ti-hint" id="ti-hint">${lenHint}</div>`+
      `<div class="ti-input-wrap">`+
        `<input class="ti-input" id="ti-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำอังกฤษ...">`+
        `<button class="ti-submit" id="ti-submit">ตรวจ</button>`+
      `</div>`+
      `<div class="ti-answer" id="ti-answer"></div>`+
    `</div>`;
  const inp=document.getElementById('ti-input');
  const subBtn=document.getElementById('ti-submit');
  setTimeout(()=>inp.focus(),100);
  subBtn.addEventListener('click',()=>checkTypein(target));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); checkTypein(target); }
  });
}
function checkTypein(target){
  if(tiLock) return;
  const inp=document.getElementById('ti-input');
  const ansEl=document.getElementById('ti-answer');
  const hintEl=document.getElementById('ti-hint');
  const val=(inp?inp.value:'').trim();
  if(!val) return;   // ไม่พิมพ์อะไร
  const correct = val.toLowerCase()===target.en.toLowerCase();
  if(correct){
    tiLock=true; tiScore++;
    ansEl.textContent='✓ '+target.en; ansEl.className='ti-answer ok';
    sCorrect(); toast(true,'ถูกต้อง!'); speak(target);
    setScore(`ข้อ <b>${tiPos+1}</b>/${tiLen} · ถูก <b>${tiScore}</b>`);
    setTimeout(()=>{ tiPos++; renderTypeinQ(); },1200);
  } else {
    // ผิด: โชว์ hint (ตัวแรก) + ให้ลองใหม่ 1 ครั้ง
    sWrong();
    const firstLetter = target.en[0].toUpperCase();
    hintEl.textContent = `คำใบ้: ขึ้นต้นด้วย ${firstLetter}... (${target.en.length} ตัวอักษร)`;
    // ถ้าผิด 2 ครั้ง → เฉลย + ข้ามไป
    if(hintEl.dataset.miss==='1'){
      tiLock=true;
      ansEl.textContent='✗ '+target.en; ansEl.className='ti-answer bad';
      toast(false,'คำตอบคือ '+target.en); speak(target);
      setTimeout(()=>{ tiPos++; renderTypeinQ(); },1800);
    } else {
      hintEl.dataset.miss='1';
      inp.value=''; inp.focus();
      toast(false,'ลองอีกครั้ง!');
    }
  }
}

function startTF() {

}
function renderTFQ() {

  tfLock = false;

    clearInterval(tfTimer); tfTimer = null;

    showWin(tfScore >= 10 ? '🏆' : '👍', 'เล่นจบแล้ว!', `ตอบถูก <b>${tfScore}</b>/${tfLen} (${pct}%)<br>ใช้เวลา <b>${fmtTime(elapsed)}</b>`, starsStr);
    return;
  }
  
  const currentIdx = tfOrder[tfPos];
  const item = allItems[currentIdx];
  curItem = item;
  tfEngWord.textContent = item.en;
  
  tfCurrentAnswer = Math.random() < 0.5;
  if (tfCurrentAnswer) {
    tfThaiWord.textContent = thSide(item);

    if (allItems.length > 1) {
      let pool = allItems.filter(it => it.en !== item.en);

    }

  }

function checkTF(userAns) {

  tfLock = true;

  if (isCorrect) {

  setScore(`ข้อ <b>${tfPos + 1}</b>/${tfLen} · คะแนน <b>${tfScore}</b>`);
  
  setTimeout(() => {
    tfPos++;
    renderTFQ();
  }, 1000);
}

// =====================================================================
// WORD SEARCH MODE (🧩 หาคำ)
// =====================================================================
function startWordSearch() {
  wsScore = 0;
  wsFoundCount = 0;
  wsStartTime = Date.now();
  
  clearInterval(wsTimer);
  wsTimer = setInterval(() => {
    if (mode === 'wordsearch') {
      document.getElementById('ws-time-val').textContent = fmtTime(Date.now() - wsStartTime);
    }
  }, 1000);
  
  const validItems = allItems.filter(it => /^[a-zA-Z]{3,8}$/.test(it.en));
  if (validItems.length < 4) {
    wsWords = allItems.slice(0, 6).map(it => ({ en: it.en.toUpperCase().replace(/[^A-Z]/g, ''), item: it, found: false }));
  } else {
    wsWords = shuffle([...validItems]).slice(0, 6).map(it => ({ en: it.en.toUpperCase(), item: it, found: false }));
  }
  
  generateWSGrid();
}
function generateWSGrid() {
  wsGridSize = 10;
  wsGrid = Array(wsGridSize).fill(null).map(() => Array(wsGridSize).fill(''));
  
  wsWords.forEach(wordObj => {
    const word = wordObj.en;
    let placed = false;
    let attempts = 0;
    
    while (!placed && attempts < 100) {
      attempts++;
      const dir = Math.floor(Math.random() * 2); // 0 = Horiz, 1 = Vert
      const row = Math.floor(Math.random() * wsGridSize);
      const col = Math.floor(Math.random() * wsGridSize);
      
      if (canPlaceWord(word, row, col, dir)) {
        placeWord(word, row, col, dir);
        wordObj.placedInfo = { row, col, dir, length: word.length };
        placed = true;
      }
    }
  });
  
  // Fill remaining spaces with random letters
  for (let r = 0; r < wsGridSize; r++) {
    for (let c = 0; c < wsGridSize; c++) {
      if (wsGrid[r][c] === '') {
        wsGrid[r][c] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
      }
    }
  }
  
  // Render Grid
  wsGridEl.innerHTML = '';
  wsGridEl.style.gridTemplateColumns = `repeat(${wsGridSize}, 1fr)`;
  
  for (let r = 0; r < wsGridSize; r++) {
    for (let c = 0; c < wsGridSize; c++) {
      const cell = document.createElement('div');
      cell.className = 'ws-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.textContent = wsGrid[r][c];
      wsGridEl.appendChild(cell);
    }
  }
  
  renderWSWordList();
  setupWSDragging();
}
function renderWSWordList() {
  wsWordsList.innerHTML = '';
  wsWords.forEach(w => {
    const div = document.createElement('div');
    div.className = 'ws-word-item' + (w.found ? ' found' : '');
    div.textContent = `${w.item.emoji || ''} ${w.en} (${thSide(w.item)})`;
    wsWordsList.appendChild(div);
  });
  setScore(`หาคำศัพท์ <b>${wsFoundCount}</b>/${wsWords.length}`);
  barEl.style.width = (wsFoundCount / wsWords.length * 100) + '%';
}
function canPlaceWord(word, row, col, dir) {
  if (dir === 0) {
    if (col + word.length > wsGridSize) return false;
    for (let i = 0; i < word.length; i++) {
      if (wsGrid[row][col + i] !== '' && wsGrid[row][col + i] !== word[i]) return false;
    }
  } else {
    if (row + word.length > wsGridSize) return false;
    for (let i = 0; i < word.length; i++) {
      if (wsGrid[row + i][col] !== '' && wsGrid[row + i][col] !== word[i]) return false;
    }
  }
  return true;
}
function placeWord(word, row, col, dir) {
  for (let i = 0; i < word.length; i++) {
    if (dir === 0) {
      wsGrid[row][col + i] = word[i];
    } else {
      wsGrid[row + i][col] = word[i];
    }
  }
}
function setupWSDragging() {
  let isDown = false;
  let startR = -1, startC = -1;
  let currentSelection = [];
  
  function getCellFromTouch(e) {
    const touch = e.touches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (el && el.classList.contains('ws-cell')) {
      return el;
    }
    return null;
  }
  function handleStart(cell) {
    if (mode !== 'wordsearch' || !cell) return;
    isDown = true;
    startR = parseInt(cell.dataset.row);
    startC = parseInt(cell.dataset.col);
    updateSelection(cell);
  }
  function handleMove(cell) {
    if (!isDown || mode !== 'wordsearch' || !cell) return;
    updateSelection(cell);
  }
  function handleEnd() {
    if (!isDown) return;
    isDown = false;
    checkWSSelection();
    document.querySelectorAll('.ws-cell.dragged').forEach(c => c.classList.remove('dragged'));
  }
  function updateSelection(cell) {
    const curR = parseInt(cell.dataset.row);
    const curC = parseInt(cell.dataset.col);
    
    let cells = [];
    if (curR === startR) {
      const minC = Math.min(startC, curC);
      const maxC = Math.max(startC, curC);
      for (let c = minC; c <= maxC; c++) {
        cells.push({ r: startR, c });
      }
    } else if (curC === startC) {
      const minR = Math.min(startR, curR);
      const maxR = Math.max(startR, curR);
      for (let r = minR; r <= maxR; r++) {
        cells.push({ r, c: startC });
      }
    } else {
      cells.push({ r: startR, c: startC });
    }
    
    currentSelection = cells;
    
    document.querySelectorAll('.ws-cell.dragged').forEach(c => c.classList.remove('dragged'));
    cells.forEach(pos => {
      const el = wsGridEl.querySelector(`[data-row="${pos.r}"][data-col="${pos.c}"]`);
      if (el) el.classList.add('dragged');
    });
  }
  function checkWSSelection() {
    if (!currentSelection.length) return;
    let selectedText = currentSelection.map(pos => wsGrid[pos.r][pos.c]).join('');
    let reversedText = [...selectedText].reverse().join('');
    
    let foundWord = wsWords.find(w => !w.found && (w.en === selectedText || w.en === reversedText));
    if (foundWord) {
      foundWord.found = true;
      wsFoundCount++;
      
      currentSelection.forEach(pos => {
        const el = wsGridEl.querySelector(`[data-row="${pos.r}"][data-col="${pos.c}"]`);
        if (el) el.classList.add('found');
      });
      
      try { KAMPAI.sound.correct(); } catch (_) {}
      speak(foundWord.item, null, 'en');
      renderWSWordList();
      
      if (wsFoundCount >= wsWords.length) {
        clearInterval(wsTimer); wsTimer = null;
        const elapsed = Date.now() - wsStartTime;
        
        try {
          KAMPAI.submitScore(wsWords.length, {
            mode: 'wordsearch',
            topic: currentSlug,
            timeMs: elapsed,
            stars: 3
          });
        } catch (_) {}
        
        showWin('🧩', 'ยอดเยี่ยม!', `ค้นหาคำศัพท์ครบทั้งหมด <b>${wsWords.length}</b> คำ<br>ใช้เวลา <b>${fmtTime(elapsed)}</b>`, '⭐⭐⭐');
      }
    }
    currentSelection = [];
  }
  
  wsGridEl.addEventListener('mousedown', e => {
    const cell = e.target.closest('.ws-cell');
    handleStart(cell);
  });
  document.addEventListener('mousemove', e => {
    if (!isDown) return;
    const cell = e.target.closest('.ws-cell');
    handleMove(cell);
  });
  document.addEventListener('mouseup', handleEnd);
  
  wsGridEl.addEventListener('touchstart', e => {
    const cell = getCellFromTouch(e);
    handleStart(cell);
  }, { passive: true });
  wsGridEl.addEventListener('touchmove', e => {
    if (!isDown) return;
    const cell = getCellFromTouch(e);
    if (cell) handleMove(cell);
  }, { passive: true });
  wsGridEl.addEventListener('touchend', handleEnd);
}
