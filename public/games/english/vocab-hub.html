<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คำศัพท์ภาษาอังกฤษ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#1565C0;overflow:hidden;user-select:none;
  font-family:'TH Sarabun New',Sarabun,Arial,sans-serif}

/* ===== HUB ===== */
#hub-view{
  display:flex;flex-direction:column;
  width:100vw;height:100vh;
  padding:2.5vh 3vw 2vh;
}
#hub-title{
  text-align:center;
  font-size:5.5vh;font-weight:700;
  color:#FFE082;letter-spacing:0.06em;
  margin-bottom:0.6vh;
}
#hub-sub{
  text-align:center;font-size:2.2vh;
  color:rgba(255,224,130,0.55);
  margin-bottom:2vh;
}
#hub-grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:1.4vh 1.2vw;
}
.hub-card{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:14px;
  border:2px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.07);
  cursor:pointer;
  gap:0.5vh;
  padding:1vh 0.5vw;
  transition:background 0.14s,transform 0.12s,border-color 0.14s;
}
.hub-card:hover{
  background:rgba(255,255,255,0.18);
  border-color:rgba(255,215,0,0.55);
  transform:scale(1.04);
}
.hub-card .hc-icon{font-size:4vh;line-height:1.1}
.hub-card .hc-th{font-size:7.8vh;font-weight:700;color:#FFE082;text-align:center;line-height:1.05}
.hub-card .hc-en{font-size:1.6vh;color:rgba(255,255,255,0.55);text-align:center}
.hub-card .hc-count{font-size:1.4vh;color:rgba(255,215,0,0.4)}

/* ===== TOPIC VIEW ===== */
#topic-view{
  display:none;flex-direction:column;
  width:100vw;height:100vh;
}
#topic-view.show{display:flex}

/* Banner */
#word{
  flex:0 0 24vh;
  perspective:900px;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:0 2vw;
}
#tcard{
  position:relative;width:92%;height:90%;
  transform-style:preserve-3d;
  transition:transform 0.5s ease;
}
#tcard.flipped{transform:rotateY(180deg)}
.tface{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.tface.tback{transform:rotateY(180deg)}
#wfront{
  font-size:14vh;font-weight:700;line-height:1;
  color:#FFE082;white-space:nowrap;letter-spacing:0.02em;
}
#wfront .wf-emoji{margin-right:0.18em}
.front-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
#wfront-sub{
  font-size:6.5vh;font-weight:700;line-height:1;
  color:#ffffff;white-space:nowrap;
}
#wfront-sub:empty{display:none}
#wback-en{
  font-size:10vh;font-weight:700;line-height:1;
  color:#FFE082;white-space:nowrap;
}
#wback-th{
  font-size:7vh;font-weight:700;line-height:1;
  color:rgba(255,224,130,0.7);white-space:nowrap;margin-top:0.3em;
}
#wback-mean{
  font-size:5vh;font-weight:700;line-height:1;
  color:#ffffff;white-space:nowrap;margin-top:0.25em;
}
#wback-mean:empty{display:none}
.back-col{display:flex;flex-direction:column;align-items:center}
#btn-say{
  position:absolute;top:1vh;right:2vw;z-index:5;
  font-size:2.8vh;width:6vh;height:6vh;border-radius:50%;cursor:pointer;
  border:2px solid rgba(255,224,130,0.4);background:rgba(0,0,0,0.25);color:#FFE082;
  transition:background 0.12s,transform 0.1s;
}
#btn-say:hover{background:rgba(255,215,0,0.3);transform:scale(1.08)}

/* Grid */
#grid{
  flex:1;
  padding:0.4vh 0.5vw;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-auto-flow:column;
  gap:0.5vh 0.8vw;
}
.cell{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.2vh;
  border-radius:8px;
  border:1.5px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.04);
  transition:border-color 0.15s,box-shadow 0.15s,transform 0.15s,background 0.15s;
  overflow:hidden;
}
.cell .emoji{font-size:6vh;line-height:1}
/* Default highlight (non-color topics) */
.cell.hl{
  background:#FFD700;
  border-color:#FF8F00;
  transform:scale(1.05);
  z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.cell.hl .lbl{color:#1A237E}
/* Color-cell keeps its bgColor; highlight = border glow */
.cell.color-cell{border-color:rgba(255,255,255,0.28)}
.cell.color-cell.hl{
  background:inherit;
  transform:scale(1.06);
  z-index:5;
  border-color:#ffffff !important;
  box-shadow:0 0 0 4px #ffffff, 0 0 0 7px #000000, 0 12px 28px rgba(0,0,0,0.5) !important;
}
.cell.color-cell.hl .lbl{color:inherit}
.lbl{
  font-size:7vh;font-weight:700;line-height:1;
  color:#fff;text-align:center;padding:0 0.3em;
  white-space:nowrap;
}

/* ===== PLAY AREA (choice / match / listen) ===== */
#play{display:none;flex:1;flex-direction:column;padding:1.5vh 3vw}
#play.show{display:flex}

/* choice + listen */
.play-wrap{display:flex;flex-direction:column;height:100%;gap:2vh}
.q-prompt{
  flex:0 0 30vh;display:flex;align-items:center;justify-content:center;gap:1.5vw;
  border-radius:18px;border:2px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.06);
}
.q-prompt .qp-emoji{font-size:18vh;line-height:1}
.q-prompt .qp-label{font-size:9vh;font-weight:700;color:#FFE082;line-height:1}
.q-prompt .qp-mean{font-size:9vh;font-weight:700;color:#FFE082;line-height:1.05;text-align:center;padding:0 2vw}
.q-prompt .qp-swatch{width:26vh;height:26vh;border-radius:24px;border:3px solid rgba(255,255,255,0.55);box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.q-listen{
  font-size:9vh;width:22vh;height:22vh;border-radius:50%;cursor:pointer;
  border:3px solid #FFD700;background:rgba(255,215,0,0.18);color:#FFE082;
  transition:background 0.12s,transform 0.1s;
}
.q-listen:hover{background:rgba(255,215,0,0.32);transform:scale(1.05)}
.q-options{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:1.6vh 2vw}
.opt{
  display:flex;align-items:center;justify-content:center;gap:1vw;
  border-radius:14px;cursor:pointer;padding:1vh 1.4vw;
  border:2.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);
  color:#fff;font-size:5vh;font-weight:700;text-align:center;line-height:1.05;
  transition:background 0.12s,border-color 0.12s,transform 0.1s;
}
.opt .opt-emoji{font-size:7vh;line-height:1}
.opt .opt-swatch{width:8vh;height:8vh;border-radius:16px;border:2px solid rgba(255,255,255,0.6)}
.opt:hover{background:rgba(255,255,255,0.16)}
.opt.ok{border-color:#43A047;background:rgba(67,160,71,0.35);color:#C8E6C9}
.opt.bad{border-color:#E53935;background:rgba(229,57,53,0.35)}

/* match */
.match-cols{flex:1;display:flex;gap:4vw;justify-content:center;align-items:center}
.mcol{flex:1;max-width:40vw;display:flex;flex-direction:column;gap:1.2vh;justify-content:center}
.mcard{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:1vw;
  border-radius:14px;cursor:pointer;padding:1vh 1.2vw;min-height:10vh;
  border:2.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.08);
  color:#fff;font-size:4vh;font-weight:700;text-align:center;line-height:1.05;
  transition:background 0.12s,border-color 0.12s,transform 0.12s,box-shadow 0.12s;
}
.mcard .mc-emoji{font-size:6vh;line-height:1}
.mcard:hover{background:rgba(255,255,255,0.16)}
.mcard.sel{
  border-color:#ffffff !important;
  box-shadow:0 0 0 4px #ffffff, 0 0 0 7px #000000, 0 8px 20px rgba(0,0,0,0.4) !important;
  transform:scale(1.04);
  z-index:2;
}
.mcard.matched{border-color:#43A047;background:rgba(67,160,71,0.28);color:#C8E6C9;pointer-events:none}
.mcard.wrong{border-color:#E53935;background:rgba(229,57,53,0.3);animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* spell (สะกดคำ) */
.spell-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;cursor:pointer}
.sp-visual{height:18vh;display:flex;align-items:center;justify-content:center}
.sp-visual .sp-emoji{font-size:16vh;line-height:1}
.sp-visual .sp-swatch{width:18vh;height:18vh;border-radius:50%;border:3px solid rgba(255,255,255,0.4);box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.sp-letters{display:flex;gap:1.4vw;justify-content:center;flex-wrap:wrap;max-width:94vw}
.sp-letter{
  min-width:10vh;height:13vh;padding:0 1vh;
  display:flex;align-items:center;justify-content:center;
  font-size:8vh;font-weight:700;line-height:1;text-transform:uppercase;
  border-radius:14px;border:2.5px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4);
  opacity:0.5;transform:scale(0.92);
  transition:opacity 0.18s,transform 0.18s,background 0.18s,border-color 0.18s,color 0.18s;
}
.sp-letter.done{opacity:1;transform:scale(1);color:#FFE082;border-color:rgba(255,224,130,0.45)}
.sp-letter.on{
  opacity:1;transform:scale(1.1);z-index:2;
  background:#FFD700;border-color:#FF8F00;color:#1A237E;
  box-shadow:0 10px 26px rgba(0,0,0,0.45);
}
.sp-read,.sp-mean{font-size:5vh;font-weight:700;line-height:1.1;text-align:center;opacity:0;transition:opacity 0.35s}
.sp-read{color:#fff}
.sp-read b{color:#FFD700}
.sp-mean{color:#FFE082}
.sp-mean b{color:#FFD700}
.sp-read.show,.sp-mean.show{opacity:1}

/* Bottom bar */
#bottom{
  flex:0 0 6vh;
  display:flex;align-items:center;
  padding:0 1.5vw 0.8vh;
  position:relative;gap:5px;
}
#dots{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;align-items:center;
}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.25);transition:background 0.2s}
.dot.active{background:#FFD700}
#lctrl{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cbtn{
  font-size:1.55vh;
  padding:3px 8px;border-radius:5px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.65);
  transition:background 0.12s,color 0.12s;
}
.cbtn:hover{background:rgba(255,255,255,0.18)}
.cbtn.on{background:#FFD700;border-color:#FF8F00;color:#1A237E;font-weight:700}
#btn-home{color:rgba(255,224,130,0.7);border-color:rgba(255,224,130,0.3)}
#btn-home:hover{background:rgba(255,224,130,0.15);color:#FFE082}
#score{margin-left:auto;font-size:2vh;font-weight:700;color:#fff;white-space:nowrap}
#score b{color:#FFD700}
#speed{
  display:flex;align-items:center;gap:4px;margin-left:1vw;
}
#speed label{font-size:1.55vh;color:rgba(255,255,255,0.45);margin-right:2px}
.spd{
  font-size:1.55vh;
  padding:3px 9px;border-radius:5px;cursor:pointer;
  border:1px solid rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.65);
  transition:background 0.12s,color 0.12s;
}
.spd:hover{background:rgba(255,255,255,0.18)}
.spd.on{background:#FFD700;border-color:#FF8F00;color:#1A237E;font-weight:700}

/* Quiz (flash) overlay */
#quiz-ctrl{
  display:none;position:fixed;bottom:9vh;left:50%;transform:translateX(-50%);
  gap:20px;z-index:30;
}
#quiz-ctrl.show{display:flex}
.qbtn{
  font-size:3.2vh;font-weight:700;
  padding:0.7vh 5vw;border-radius:12px;cursor:pointer;
  border:2px solid rgba(255,255,255,0.35);
  background:rgba(0,0,0,0.4);color:#fff;
  backdrop-filter:blur(6px);
  transition:background 0.15s,transform 0.1s;
}
.qbtn:hover{background:rgba(0,0,0,0.6);transform:scale(1.05)}
#btn-reveal{border-color:#FFD700;color:#FFE082}
#btn-reveal:hover{background:rgba(255,215,0,0.3)}
#btn-next{display:none}
#btn-next.show{display:block}

/* Progress bar */
#bar-wrap{position:fixed;top:0;left:0;width:100%;height:3px;z-index:20;background:rgba(255,255,255,0.1)}
#bar{height:100%;background:#FFD700;transition:width 0.25s linear}

/* Toast */
#toast{
  position:fixed;top:11vh;left:50%;transform:translateX(-50%) translateY(-20px);
  font-size:3vh;font-weight:700;padding:1vh 3vw;border-radius:14px;
  opacity:0;pointer-events:none;transition:opacity 0.18s,transform 0.18s;z-index:50;backdrop-filter:blur(4px);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:rgba(67,160,71,0.92);color:#fff}
#toast.bad{background:rgba(229,57,53,0.92);color:#fff}

/* Win overlay */
#win{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;background:rgba(13,71,161,0.92)}
#win.show{display:flex}
#win .win-emoji{font-size:16vh;line-height:1;animation:pop 0.5s}
@keyframes pop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
#win .win-text{font-size:5vh;font-weight:700;color:#FFE082}
#win .win-stars{font-size:6vh;line-height:1}
#win .win-score{font-size:2.8vh;color:#fff}
#win .win-btns{display:flex;gap:2vw;margin-top:1vh}
.win-btn{font-size:3vh;font-weight:700;padding:1.1vh 3.5vw;border-radius:14px;cursor:pointer;
  border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.1);color:#fff;transition:background 0.14s,transform 0.1s}
.win-btn:hover{background:rgba(255,255,255,0.22);transform:scale(1.04)}
.win-btn.primary{border-color:#FFD700;background:rgba(255,215,0,0.25);color:#FFE082}

#cfx{position:fixed;inset:0;z-index:70;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="bar-wrap"><div id="bar" style="width:0"></div></div>

<!-- HUB -->
<div id="hub-view">
  <div id="hub-title">คำศัพท์ภาษาอังกฤษ</div>
  <div id="hub-sub">English Vocabulary — เลือกหัวข้อ &nbsp;|&nbsp; F = เต็มจอ</div>
  <div id="hub-grid"></div>
</div>

<!-- TOPIC -->
<div id="topic-view">
  <div id="word">
    <button id="btn-say" title="ฟังเสียงอ่าน">🔊</button>
    <div id="tcard">
      <div class="tface tfront"><div class="front-col"><span id="wfront"></span><span id="wfront-sub"></span></div></div>
      <div class="tface tback">
        <div class="back-col">
          <span id="wback-en"></span>
          <span id="wback-th"></span>
          <span id="wback-mean"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="grid"></div>
  <div id="play"></div>
  <div id="bottom">
    <div id="lctrl">
      <button class="cbtn" id="btn-home">← หน้าหลัก</button>
      <button class="cbtn mbtn on" id="m-auto">▶ อัตโนมัติ</button>
      <button class="cbtn mbtn" id="m-flash">🎲 สุ่ม</button>
      <button class="cbtn mbtn" id="m-choice">🎯 ทายคำ</button>
      <button class="cbtn mbtn" id="m-match">🔗 จับคู่</button>
      <button class="cbtn mbtn" id="m-listen">🎧 ฟังเสียง</button>
      <button class="cbtn mbtn" id="m-spell">🔤 สะกดคำ</button>
      <button class="cbtn" id="btn-sound">🔊 เสียง</button>
    </div>
    <div id="dots"></div>
    <div id="score"></div>
    <div id="speed">
      <label>Speed</label>
      <button class="spd" data-ms="2000">2s</button>
      <button class="spd on" data-ms="1500">1.5s</button>
      <button class="spd" data-ms="1000">1s</button>
      <button class="spd" data-ms="500">0.5s</button>
    </div>
  </div>
</div>

<div id="quiz-ctrl">
  <button class="qbtn" id="btn-reveal">เฉลย</button>
  <button class="qbtn" id="btn-next">ถัดไป ›</button>
</div>

<div id="toast"></div>
<div id="win">
  <div class="win-emoji">🎉</div>
  <div class="win-text">เก่งมาก!</div>
  <div class="win-stars"></div>
  <div class="win-score"></div>
  <div class="win-btns">
    <button class="win-btn primary" id="win-again">▶ เล่นอีกครั้ง</button>
    <button class="win-btn" id="win-home">← หน้าหลัก</button>
  </div>
</div>
<canvas id="cfx"></canvas>

<script>
// =====================================================================
// TOPIC METADATA (for hub cards)
// =====================================================================
const TOPIC_META = [
  { slug:'numbers',  title:'ตัวเลข',          en:'Numbers 1–100',    icon:'🔢', count:100 },
  { slug:'colors',   title:'สี',               en:'Colors',           icon:'🎨', count:12  },
  { slug:'days',     title:'วันในสัปดาห์',     en:'Days of the Week', icon:'📅', count:7   },
  { slug:'months',   title:'เดือน',            en:'Months',           icon:'🗓️', count:12  },
  { slug:'alphabet', title:'ตัวอักษร A–Z',     en:'Alphabet',         icon:'🔤', count:26  },
  { slug:'animals',  title:'สัตว์',            en:'Animals',          icon:'🐾', count:12  },
  { slug:'fruits',   title:'ผลไม้',            en:'Fruits',           icon:'🍎', count:10  },
  { slug:'body',     title:'ส่วนของร่างกาย',   en:'Body Parts',       icon:'🫀', count:10  },
  { slug:'shapes',   title:'รูปทรง',           en:'Shapes',           icon:'🔷', count:8   },
  { slug:'family',   title:'ครอบครัว',         en:'Family',           icon:'👨‍👩‍👧', count:8   },
];

// =====================================================================
// VOCABULARY DATA  { label, en, th, [emoji, bgColor, darkText] }
// =====================================================================
const TOPICS = {
  numbers: [
    {label:'1',  en:'One',          th:'วัน'},          {label:'2',  en:'Two',          th:'ทู'},
    {label:'3',  en:'Three',        th:'ทรี'},           {label:'4',  en:'Four',         th:'โฟร์'},
    {label:'5',  en:'Five',         th:'ไฟว์'},          {label:'6',  en:'Six',          th:'ซิกซ์'},
    {label:'7',  en:'Seven',        th:'เซเว่น'},        {label:'8',  en:'Eight',        th:'เอท'},
    {label:'9',  en:'Nine',         th:'ไนน์'},          {label:'10', en:'Ten',          th:'เทน'},
    {label:'11', en:'Eleven',       th:'อีเลฟเว่น'},    {label:'12', en:'Twelve',       th:'ทเวลฟ์'},
    {label:'13', en:'Thirteen',     th:'เธอร์ทีน'},     {label:'14', en:'Fourteen',     th:'โฟร์ทีน'},
    {label:'15', en:'Fifteen',      th:'ฟิฟทีน'},       {label:'16', en:'Sixteen',      th:'ซิกซ์ทีน'},
    {label:'17', en:'Seventeen',    th:'เซเว่นทีน'},    {label:'18', en:'Eighteen',     th:'เอทีน'},
    {label:'19', en:'Nineteen',     th:'ไนน์ทีน'},      {label:'20', en:'Twenty',       th:'ทเวนตี้'},
    {label:'21', en:'Twenty-one',   th:'ทเวนตี้วัน'},   {label:'22', en:'Twenty-two',   th:'ทเวนตี้ทู'},
    {label:'23', en:'Twenty-three', th:'ทเวนตี้ทรี'},   {label:'24', en:'Twenty-four',  th:'ทเวนตี้โฟร์'},

let enVoice = null;
function loadVoices(){
  const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []) || [];
  enVoice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis){ speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function sayText(item){
  if (currentSlug === 'alphabet') return item.label;   // อ่านชื่อตัวอักษรเดี่ยว (A) ไม่อ่านคำตัวอย่าง (A for Apple)
  return (item.en || item.label).replace(/\s*–\s*/g, ' for ');
}
function speak(item){
  if (!audioOn || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayText(item));
    u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch(_){}
}
// อ่านชื่อตัวอักษรทีละตัว — ไม่ cancel (queue ต่อกัน กันตัดเสียงตัวก่อนหน้า)
function speakLetter(ch){
  if(!audioOn || !window.speechSynthesis) return;
  try {
    const u = new SpeechSynthesisUtterance(ch);
    u.lang='en-US'; if(enVoice) u.voice=enVoice; u.rate=0.8;
    speechSynthesis.speak(u);
  } catch(_){}
}
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}} return actx; }
function tone(freq, start, dur, type='sine', vol=0.16){
  if(!audioOn) return;
  const c = ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const t=c.currentTime+start;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sCorrect(){ tone(660,0,0.12); tone(880,0.1,0.16); }
function sWrong(){ tone(170,0,0.25,'square',0.13); }
function sWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.22,'triangle',0.15)); }

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function cellFontSize(label){
  const n=label.length;
  if(n<=4) return '10vh';
  if(n<=7) return '7.5vh';
  if(n<=10) return '6vh';
  return '4.8vh';
}
function bannerFontSize(text){
  const n=text.length;
  if(n<=7) return '14vh';
  if(n<=11) return '10vh';
  if(n<=14) return '8vh';
  return '6.5vh';
}
function backEnFontSize(text){
  const n=text.length;
  if(n<=7) return '10vh';
  if(n<=11) return '8vh';
  if(n<=14) return '6.5vh';
  return '5.5vh';
}
let toastTimer=null;
function toast(ok,text){
  clearTimeout(toastTimer);
  toastEl.className=(ok?'ok':'bad')+' show';
  toastEl.textContent=(ok?'✓ ':'✗ ')+text;
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),900);
}
function confetti(){
  const ctx=cfx.getContext('2d'); cfx.width=innerWidth; cfx.height=innerHeight; cfx.style.display='block';
  const cols=['#FFD700','#FF6F61','#4FC3F7','#81C784','#BA68C8','#FFFFFF'], parts=[];
  for(let i=0;i<140;i++) parts.push({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-0.5)*15,vy:Math.random()*-13-3,c:cols[i%cols.length],s:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-0.5)*0.4});
  let f=0;
  (function step(){
    f++; ctx.clearRect(0,0,cfx.width,cfx.height);
    parts.forEach(p=>{ p.vy+=0.4; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); });
    if(f<95) requestAnimationFrame(step); else { ctx.clearRect(0,0,cfx.width,cfx.height); cfx.style.display='none'; }
  })();
}
function showWin(emoji,text,scoreHtml,stars){
  winEl.querySelector('.win-emoji').textContent=emoji;
  winEl.querySelector('.win-text').textContent=text;
  winEl.querySelector('.win-stars').textContent=stars||'';
  winEl.querySelector('.win-score').innerHTML=scoreHtml||'';
  winEl.classList.add('show');
  sWin(); confetti();
}

function getIps(count){
  if(count<=10) return count;
  if(count<=12) return 6;
  return 10;
}
function buildCell(item){
  const el=document.createElement('div');
  el.className='cell'+(isColorTopic?' color-cell':'');
  if(isColorTopic&&item.bgColor){ el.style.background=item.bgColor; el.style.borderColor='rgba(255,255,255,0.28)'; }

  const lbl=document.createElement('span');
  lbl.className='lbl'; lbl.textContent=item.label;

}
function showTopic(slug){
  const items=TOPICS[slug];
  if(!items) return;

  curSlide=0; curCell=0;
  currentSlug=slug; allItems=items;

function setBannerAuto(item){

function goTo(idx){

// CHOICE + LISTEN MODES (multiple choice w/ score)

function startQuizGame(){
  qOrder=shuffle([...Array(allItems.length).keys()]);
  qLen=Math.min(allItems.length,15);
  qOrder=qOrder.slice(0,qLen);
  qPos=0; score=0; streak=0; qLock=false;
  playEl.classList.add('show');
  renderQuestion();
}
const startChoice = startQuizGame;
const startListen = startQuizGame;
function glyph(item){
  if(item.emoji)   return `<span class="opt-emoji">${item.emoji}</span>`;
  if(item.bgColor) return `<span class="opt-swatch" style="background:${item.bgColor}"></span>`;  // หมวดสี: ตัวเลือกเป็นช่องสี
  return currentSlug==='months' ? item.en : item.label;   // months: ชื่อเต็ม (label เป็นตัวย่อ)
}
// ตัวเลือกทายคำ — alphabet โชว์คำตัวอย่าง (Apple) ไม่ใช่ "A – Apple" (กันตัวอักษรโจทย์โผล่ในคำตอบ)
function optLabel(item){
  if(currentSlug==='alphabet'){ return item.en.split('–').pop().trim(); }
  return item.en;
}
// โจทย์ทายคำ = cue ที่ "ไม่ใช่คำอังกฤษ" → ให้เด็กเลือกคำอังกฤษเอง (กันโจทย์เฉลยคำตอบตรงตัว)
function quizPrompt(item){
  if(item.emoji)   return `<span class="qp-emoji">${item.emoji}</span>`;        // รูป (สัตว์/ผลไม้/ร่างกาย/รูปทรง/ครอบครัว)
  if(item.bgColor) return `<span class="qp-swatch" style="background:${item.bgColor}"></span>`; // ช่องสี (สี)
  if(item.meaning) return `<span class="qp-mean">${item.meaning}</span>`;        // คำแปลไทย (วัน/เดือน)
  return `<span class="qp-label">${item.label}</span>`;                          // ตัวเลข (5) / ตัวอักษร (A)
}
function renderQuestion(){
  if(qPos>=qLen){
    const pct=Math.round(score/qLen*100);
    const stars = pct>=90?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
    showWin(pct>=80?'🏆':'👍','เล่นจบแล้ว!',`ตอบถูก <b>${score}</b>/${qLen} (${pct}%)`,stars);
    return;
  }
  qLock=false;
  const target=allItems[qOrder[qPos]];
  curItem=target;
  setScore(`ข้อ <b>${qPos+1}</b>/${qLen} · ถูก <b>${score}</b> · สตรีค ${streak}🔥`);
  // build 4 options
  const others=shuffle(allItems.filter(x=>x!==target)).slice(0,3);
  const opts=shuffle([target,...others]);
  const isListen = mode==='listen';
  let promptHtml;
  if(isListen){
    promptHtml=`<button class="q-listen" id="q-play">🔊</button>`;
  } else {
    promptHtml=`<div class="q-prompt">${quizPrompt(target)}</div>`;
  }
  playEl.innerHTML=
    `<div class="play-wrap">`+
      promptHtml+
      `<div class="q-options" id="q-opts"></div>`+
    `</div>`;
  const optWrap=document.getElementById('q-opts');
  opts.forEach(it=>{
    const b=document.createElement('div');
    b.className='opt';
    b.innerHTML = isListen ? glyph(it) : optLabel(it);
    b._item = it;
    b.addEventListener('click',()=>pickQuiz(it,target,b));
    optWrap.appendChild(b);
  });
  if(isListen){
    const pb=document.getElementById('q-play');
    pb.addEventListener('click',()=>speak(target));
    speak(target);
  } else {
    speak(target);
  }
}
function pickQuiz(choice,target,btn){
  if(qLock) return; qLock=true;
  if(choice===target){
    score++; streak++; btn.classList.add('ok'); toast(true,'ถูกต้อง!'); sCorrect(); speak(target);
  } else {
    streak=0; btn.classList.add('bad'); sWrong();
    toast(false, mode==='listen' ? ('คำตอบคือ '+target.label) : ('คำตอบคือ '+target.en));
    [...document.querySelectorAll('.opt')].forEach(o=>{
      if(o._item===target) o.classList.add('ok');   // เทียบด้วย item ตรง ๆ (รองรับ emoji/สี/ข้อความ)
    });
  }
  setScore(`ข้อ <b>${qPos+1}</b>/${qLen} · ถูก <b>${score}</b> · สตรีค ${streak}🔥`);
  setTimeout(()=>{ qPos++; renderQuestion(); }, choice===target?700:1250);
}

// =====================================================================
// MATCH MODE
// =====================================================================
function chunkEven(arr,maxPer){
  const n=Math.max(1,Math.ceil(arr.length/maxPer)), size=Math.ceil(arr.length/n), out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
function startMatch(){
  const picks=shuffle(allItems).slice(0, Math.min(allItems.length,12));
  mRounds=chunkEven(picks,6); mRi=0; mMatched=0; mTotal=picks.length; mLock=false;
  playEl.classList.add('show');
  renderMatchRound();
}
function matchCardInner(item, side){
  if(side==='l'){ return item.emoji ? `<span class="mc-emoji">${item.emoji}</span><span>${item.label}</span>` : item.label; }
  return item.meaning || (currentSlug==='numbers' ? item.en : item.th);   // ขวา = คำแปล / numbers=คำอังกฤษ / alphabet=คำอ่าน
}
function renderMatchRound(){
  const round=mRounds[mRi];
  mSel={l:null,r:null};
  const lefts=round.map((it,i)=>({it,i}));
  const rights=shuffle(round.map((it,i)=>({it,i})));
  setScore(`จับคู่ <b>${mMatched}</b>/${mTotal} · รอบ ${mRi+1}/${mRounds.length}`);
  playEl.innerHTML=`<div class="match-cols"><div class="mcol" id="mc-l"></div><div class="mcol" id="mc-r"></div></div>`;
  const colL=document.getElementById('mc-l'), colR=document.getElementById('mc-r');
  lefts.forEach(({it,i})=>{
    const el=document.createElement('div'); el.className='mcard'; el.dataset.pid=i; el.dataset.side='l';
    if(isColorTopic&&it.bgColor){ el.style.background=it.bgColor; }
    el.innerHTML=matchCardInner(it,'l');
    el.addEventListener('click',()=>pickMatch(el)); colL.appendChild(el);
  });
  rights.forEach(({it,i})=>{
    const el=document.createElement('div'); el.className='mcard'; el.dataset.pid=i; el.dataset.side='r';
    el.innerHTML=matchCardInner(it,'r');
    el.addEventListener('click',()=>pickMatch(el)); colR.appendChild(el);
  });
}
function pickMatch(el){
  if(mLock||el.classList.contains('matched')) return;
  const side=el.dataset.side, pid=+el.dataset.pid, cur=mSel[side];
  if(cur&&cur.el===el){ el.classList.remove('sel'); mSel[side]=null; return; }
  if(cur) cur.el.classList.remove('sel');
  el.classList.add('sel'); mSel[side]={pid,el};
  if(mSel.l&&mSel.r){
    const L=mSel.l, R=mSel.r;
    if(L.pid===R.pid){
      L.el.classList.remove('sel'); R.el.classList.remove('sel');
      L.el.classList.add('matched'); R.el.classList.add('matched');
      mSel={l:null,r:null}; mMatched++;
      setScore(`จับคู่ <b>${mMatched}</b>/${mTotal} · รอบ ${mRi+1}/${mRounds.length}`);
      sCorrect();
      if([...playEl.querySelectorAll('.mcard.matched')].length === mRounds[mRi].length*2){
        if(mRi<mRounds.length-1){ mLock=true; toast(true,'รอบนี้ผ่าน!'); setTimeout(()=>{ mRi++; mLock=false; renderMatchRound(); },900); }
        else showWin('🎉','จับคู่ครบแล้ว!',`ครบทั้ง <b>${mTotal}</b> คู่`,'⭐⭐⭐');
      }
    } else {
      mLock=true; L.el.classList.add('wrong'); R.el.classList.add('wrong');
      L.el.classList.remove('sel'); R.el.classList.remove('sel'); sWrong();
      setTimeout(()=>{ L.el.classList.remove('wrong'); R.el.classList.remove('wrong'); mSel={l:null,r:null}; mLock=false; },500);
    }
  }
}

// =====================================================================
// SPELL MODE (สะกดคำ) — สาธิตอัตโนมัติ: สะกดทีละตัว → อ่าน + แปล → คำถัดไป
// =====================================================================
function startSpell(){
  spOrder = shuffle([...Array(allItems.length).keys()]);
  spPos = 0;
  playEl.classList.add('show');
  renderSpell();
}
function spellNext(){ clearTimeout(spStepTimer); spPos++; renderSpell(); }
function renderSpell(){
  clearTimeout(spStepTimer);
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(spPos>=spOrder.length) spPos=0;                 // วน loop
  const item = allItems[spOrder[spPos]];
  curItem = item;
  const word = item.en || item.label;
  const letters = [...word];
  barEl.style.width = ((spPos+1)/spOrder.length*100)+'%';

  let visual='';
  if(item.bgColor) visual = `<span class="sp-swatch" style="background:${item.bgColor}"></span>`;
  else if(item.emoji) visual = `<span class="sp-emoji">${item.emoji}</span>`;

  const lettersHtml = letters.map((ch,i)=>`<span class="sp-letter" data-i="${i}">${ch}</span>`).join('');
  playEl.innerHTML =
    `<div class="spell-wrap">`+
      `<div class="sp-visual">${visual}</div>`+
      `<div class="sp-letters">${lettersHtml}</div>`+
      `<div class="sp-read" id="sp-read">อ่านว่า <b>${item.th}</b></div>`+
      (item.meaning ? `<div class="sp-mean" id="sp-mean">แปลว่า <b>${item.meaning}</b></div>` : '')+
    `</div>`;
  playEl.querySelector('.spell-wrap').addEventListener('click', spellNext);

  const boxes = [...playEl.querySelectorAll('.sp-letter')];
  let i = 0;
  function step(){
    if(i>0){ boxes[i-1].classList.remove('on'); boxes[i-1].classList.add('done'); }
    if(i<boxes.length){
      boxes[i].classList.add('on');
      speakLetter(letters[i].toUpperCase());
      i++;
      spStepTimer = setTimeout(step, 760);
    } else {
      speak(item);                                   // อ่านคำเต็ม
      document.getElementById('sp-read')?.classList.add('show');
      document.getElementById('sp-mean')?.classList.add('show');
      spStepTimer = setTimeout(()=>{ spPos++; renderSpell(); }, 2600);
    }
  }
  spStepTimer = setTimeout(step, 450);
}

// =====================================================================
// KEYBOARD
// =====================================================================
document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
    return;
  }
  if(!currentSlug) return;
  if(e.key==='Escape'){ location.hash=''; showHub(); return; }
  if(mode==='auto'){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); goTo(curSlide+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); goTo(curSlide-1); }
  } else if(mode==='flash'){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); if(!revealed) btnReveal.click(); else btnNext.click(); }
  } else if(mode==='choice'||mode==='listen'){
    if(/^[1-4]$/.test(e.key)){ const o=document.querySelectorAll('.opt')[+e.key-1]; if(o) o.click(); }
  } else if(mode==='spell'){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); spellNext(); }
  }
});

// =====================================================================
// HASH ROUTING + INIT
// =====================================================================
function route(){
  const h=(location.hash||'').replace('#','');
  if(!h||h==='home'){ showHub(); return; }
  if(TOPICS[h]){ showTopic(h); return; }
  showHub();
}
window.addEventListener('hashchange',route);
buildHub();
route();
</script>
