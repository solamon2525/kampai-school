  <style>
    body {
      overflow-x: hidden;
    }
    .toolbar {
      max-width: 100vw;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .skill-tag {
      display: inline-block;
      font-size: 6.8pt;
      font-weight: 800;
      color: var(--ws-accent, #0284c7);
      border: 1px solid var(--ws-accent, #0284c7);
      border-radius: 3px;
      padding: 0.3mm 1.5mm;
      line-height: 1.2;
    }
    .eng-word {
      font-size: 13pt;
      font-weight: 900;
      color: var(--ws-accent, #0284c7);
      margin: 0.4mm 0;
      letter-spacing: 0.02em;
    }
    .classify-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2mm;
      margin: 0.6mm 0;
    }
    .classify-box {
      border: 1px dashed var(--ws-line, #c9d2df);
      border-radius: 3px;
      padding: 0.8mm 1.5mm;
      font-size: 6.8pt;
      font-weight: 700;
      color: var(--ws-muted, #5b6475);
      background: var(--ws-soft, #f0f9ff);
    }
    .step-block {
      display: flex;
      flex-direction: column;
      gap: 1mm;
      margin-top: 0.8mm;
    }
    .step-row {
      display: grid;
      grid-template-columns: 24mm 1fr;
      gap: 1.5mm;
      align-items: end;
      min-height: 6.5mm;
    }
    .step-tag {
      font-size: 6.5pt;
      font-weight: 800;
      color: var(--ws-paper, #ffffff);
      background: var(--ws-accent, #0284c7);
      border-radius: 3px;
      padding: 0.8mm;
      text-align: center;
      line-height: 1.1;
    }
    .step-tag.gold {
      background: #d97706;
    }
    .step-body {
      min-height: 5.5mm;
      border-bottom: 1px dotted var(--ws-muted, #78849e);
      display: flex;
      align-items: flex-end;
      font-weight: 700;
      font-size: 8pt;
      padding-bottom: 0.5mm;
    }
    .work-fill {
      color: transparent;
      font-weight: 800;
    }
    .show-answers .work-fill {
      color: var(--ws-danger, #dc2626);
    }
    .q-foot .answer-line {
      display: flex;
      align-items: center;
      gap: 2mm;
      font-size: 8.5pt;
      font-weight: 800;
      color: var(--ws-accent, #0284c7);
    }
    .answer-fill {
      color: transparent;
      font-weight: 900;
      border-bottom: 1.5px solid var(--ws-accent, #0284c7);
      padding: 0 2mm;
    }
    .show-answers .answer-fill {
      color: var(--ws-danger, #dc2626);
      border-bottom-color: var(--ws-danger, #dc2626);
    }
    .count-5 .step-row {
      min-height: 8.5mm;
    }
    .count-5 .eng-word {
      font-size: 15pt;
    }
  </style>
</head>
