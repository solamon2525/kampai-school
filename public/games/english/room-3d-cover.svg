<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="0.55" stop-color="#5b21b6"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.30"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="160" y="600" font-size="210" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🚪</text>
  <text x="1110" y="170" font-size="180" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🅰️</text>

  <g transform="translate(640,112)">
    <rect x="-220" y="-26" width="440" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ภาษาอังกฤษ ป.4–6 · 3D</text>
  </g>
  <text x="640" y="268" font-size="104" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">ห้องคำศัพท์ 3 มิติ</text>
  <text x="640" y="346" font-size="33" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">หมุนดูห้อง · แตะสิ่งของ · เรียนคำศัพท์อังกฤษ</text>

  <!-- ห้อง isometric + สิ่งของ -->
  <g transform="translate(640,540)">
    <!-- พื้น+ผนัง -->
    <polygon points="-300,40 0,-90 300,40 0,170" fill="#d6b48f" stroke="#0f172a" stroke-width="3"/>
    <polygon points="-300,40 -300,-150 0,-280 0,-90" fill="#ede9fe" stroke="#0f172a" stroke-width="3"/>
    <polygon points="300,40 300,-150 0,-280 0,-90" fill="#ddd6fe" stroke="#0f172a" stroke-width="3"/>
    <!-- เก้าอี้ -->
    <g transform="translate(-150,10)" stroke="#0f172a" stroke-width="2.5">
      <polygon points="-30,0 0,-16 30,0 0,16" fill="#f59e0b"/><rect x="-30" y="-44" width="14" height="44" fill="#b45309"/><rect x="-30" y="0" width="12" height="34" fill="#b45309"/>
    </g>
    <!-- ลูกบอล -->
    <circle cx="120" cy="20" r="34" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/><circle cx="108" cy="12" r="9" fill="#1f2937"/><circle cx="132" cy="28" r="9" fill="#1f2937"/>
    <!-- โคมไฟ -->
    <g transform="translate(-30,-70)" stroke="#0f172a" stroke-width="2.5">
      <polygon points="-26,0 26,0 16,-40 -16,-40" fill="#fbbf24"/><rect x="-4" y="0" width="8" height="60" fill="#94a3b8"/><ellipse cx="0" cy="64" rx="26" ry="9" fill="#334155"/>
    </g>
    <!-- นาฬิกาบนผนัง -->
    <circle cx="150" cy="-120" r="30" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/><line x1="150" y1="-120" x2="150" y2="-140" stroke="#0f172a" stroke-width="3"/><line x1="150" y1="-120" x2="166" y2="-114" stroke="#0f172a" stroke-width="3"/>
  </g>

  <g transform="translate(640,672)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · แตะสิ่งของ · 10 คำศัพท์</text>
  </g>
</svg>
