<!DOCTYPE html>
<html lang="th"><head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/vocab-quiz-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reading ป.6 — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#0f766e;--line:#99f6e4;--muted:#64748b;--ok:#059669;--bad:#e11d48;--navy:#0f172a}
    html,body{max-width:100%;overflow-x:hidden}
    body{font-family:'Sarabun',sans-serif;background:linear-gradient(145deg,#99f6e4,#0f766e22);min-height:100%;padding:12px;color:#0f172a}
    .shell{max-width:1100px;margin:0 auto;background:#fff;border-radius:1.5rem;box-shadow:0 20px 50px rgba(15,23,42,.12);overflow:hidden;min-height:calc(100vh - 24px);display:flex;flex-direction:column}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--deep),#0f766e);color:#fff}
    header h1{font-size:1.15rem;font-weight:800;flex:1;min-width:160px}
    .badge{font-size:.75rem;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-weight:700}
    .btn{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:10px 14px;min-height:44px;min-width:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .btn:active{transform:scale(.97)}
    .btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;font-size:.85rem}
    .btn-primary{background:var(--deep);color:#fff}
    .btn-ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--line);align-items:center}
    .seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
    .seg button{font-family:inherit;font-weight:800;border:none;background:#fff;color:var(--deep);padding:8px 14px;min-height:44px;cursor:pointer}
    .seg button.on{background:var(--deep);color:#fff}
    .hint{font-size:.9rem;color:var(--deep);font-weight:700;flex:1;min-width:140px}
    .stage{flex:1;padding:16px;overflow:auto}
    .footer{padding:10px;font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
    .practice{display:none;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
    .shell.mode-practice .learn{display:none}.shell.mode-practice .practice{display:flex}
    .choice{font-family:inherit;font-weight:800;font-size:1.05rem;padding:14px;min-height:44px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left}
    .choice.ok{background:#dcfce7}.choice.no{background:#fee2e2}
    .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .pick button{font-family:inherit;font-weight:800;font-size:1rem;padding:12px 14px;min-height:44px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--deep)}
    .pick button.on{background:var(--deep);color:#fff}
    .box{background:#f8fafc;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:700;line-height:1.7;font-size:1.1rem}
    .box h2{color:var(--deep);margin-bottom:8px;font-size:1.45rem}
    .emo{font-size:3.2rem;margin-bottom:8px}
    .ex{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff;border:1px dashed var(--line);font-size:1rem}
    .speech-status{font-size:.88rem;font-weight:700;color:#78350f;background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:8px 12px;margin-bottom:12px;display:none}
    .speech-status.show{display:block}
    .engine-card{background:#f8fafc;border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
    .engine-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
    .engine-mode-group{display:inline-flex;flex-wrap:wrap;gap:6px}
    .ke-quiz-card,.ke-quiz-summary{display:flex;flex-direction:column;gap:12px}
    .ke-quiz-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-weight:800}
    .ke-badge{padding:4px 10px;border-radius:999px;background:#ccfbf1;color:var(--deep);font-size:.85rem}
    .ke-progress{color:var(--muted);font-size:.9rem}
    .ke-prompt{font-size:1.15rem;font-weight:800;color:var(--navy);line-height:1.5}
    .ke-audio-row{display:flex;flex-wrap:wrap;gap:8px}
    .ke-options{display:grid;grid-template-columns:1fr;gap:8px}
    @media(min-width:600px){.ke-options{grid-template-columns:1fr 1fr}}
    .ke-option,.ke-btn{min-height:46px;min-width:44px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy);font-family:inherit;font-size:.98rem;font-weight:700;cursor:pointer;text-align:left;overflow-wrap:anywhere}
    .ke-btn{background:var(--deep);color:#fff;border-color:var(--deep);text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .ke-option.is-correct{background:#dcfce7;border-color:var(--ok);color:#065f46}
    .ke-option.is-wrong{background:#fee2e2;border-color:var(--bad);color:#9f1239}
    .ke-clue{padding:10px 12px;border-radius:10px;background:#fef3c7;color:#78350f;font-weight:700}
    .ke-feedback{min-height:24px;padding:10px 14px;border-radius:12px;font-weight:700;background:#fff;border:1px solid #cbd5e1;color:var(--navy)}
    .ke-feedback.is-good{background:#dcfce7;border-color:var(--ok);color:#065f46}
    .ke-feedback.is-learn{background:#fef3c7;border-color:#f59e0b;color:#78350f}
    @media(max-width:600px){body{padding:0}.shell{border-radius:0;min-height:100vh}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head><body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back()">← กลับคลังสื่อ</button>
    <h1>📖 Reading Comprehension ป.6</h1>
    <span class="badge">ป.6 · English</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
    </span>
    <p class="hint" id="hintText">สื่อ ป.6 — ไม่เก็บคะแนน</p>
    <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/english/english-reading-p6-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="speech-status" id="speechStatus" role="status" aria-live="polite"></div>
    <div class="learn"><div class="pick" id="pick"></div><div class="box" id="box"></div></div>
    <div class="practice">
      <div class="engine-card">
        <div class="engine-toolbar">
          <div class="engine-mode-group">
            <button type="button" class="btn btn-primary" id="btnQuizChoice">📝 เลือกความหมาย / ทักษะ</button>
            <button type="button" class="btn btn-ghost" id="btnQuizListen">🔊 ฟังเสียงเลือกหัวข้อ</button>
          </div>
          <button type="button" class="btn btn-ghost" id="btnQuizNew">🔄 ชุดใหม่</button>
        </div>
        <div id="quizEngineRoot"></div>
      </div>
      <div class="engine-card">
        <p style="font-weight:800;font-size:1.1rem;color:var(--deep)" id="prQ"></p>
        <div id="prChoices" style="display:grid;gap:8px"></div>
        <p id="prFb" style="font-weight:800;min-height:24px"></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn btn-ghost" id="btnSpeakPr">🔊 ฟังโจทย์</button>
          <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อ ป.6 · Phase 13 · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG='english-reading-p6-media';
if(window.KAMPAI){KAMPAI.setSlug(MEDIA_SLUG);if(KAMPAI.sound&&KAMPAI.sound.mountToggles)KAMPAI.sound.mountToggles();}
const ITEMS=[{"emoji":"👂","name":"Follow instructions","body":"Read and do: Open your book. Circle the word. Draw a line.","tip":"หา action verbs","ex":"Underline the title.","q":"คำสั่ง “Circle the word” แปลว่า?","a":"วงกลมคำ"},{"emoji":"🔤","name":"Read aloud","body":"อ่านข้อความสั้น นิทาน บทกลอนให้ออกเสียงชัด","tip":"หยุดตามเครื่องหมายวรรคตอน","ex":"Once upon a time…","q":"เมื่ออ่านออกเสียงควรทำอย่างไร?","a":"ชัดและถูกหลัก"},{"emoji":"🖼️","name":"Match text–picture","body":"เลือกประโยคให้ตรงภาพ/สัญลักษณ์","tip":"หา keyword ในประโยค","ex":"A boy is running. → ภาพเด็กวิ่ง","q":"วิธีจับคู่ประโยคกับภาพคือ?","a":"หาคำสำคัญ"},{"emoji":"🎯","name":"Main idea","body":"ใจความสำคัญ = สิ่งที่เรื่องพูดถึงเป็นหลัก","tip":"ถาม Who? What? Where?","ex":"เรื่องเกี่ยวกับการช่วยเพื่อน","q":"ใจความสำคัญคืออะไร?","a":"ประเด็นหลักของเรื่อง"},{"emoji":"❓","name":"Answer questions","body":"ตอบคำถามจากเรื่องที่อ่าน/ฟัง: Who did what?","tip":"กลับไปหาหลักฐานในข้อความ","ex":"Where did Mia go? → to the park","q":"ก่อนตอบควหาก่อน?","a":"หลักฐานในข้อความ"},{"emoji":"📝","name":"Short retell","body":"เล่า/เขียนสรุปสั้น ๆ 2–3 ประโยค","tip":"beginning → middle → end","ex":"First… Then… Finally…","q":"สรุปเรื่องสั้นควรมีกี่ส่วนคร่าว ๆ?","a":"ต้น-กลาง-จบ"}];
let cur=ITEMS[0];
let mode='learn';
let quizType='choice';
let quizSession=null;
let currentPr=ITEMS[0];

function stopSpeech(){
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.stopAllSpeech==='function'){
    window.KampaiMediaLab.stopAllSpeech();
  }else{
    try{window.KAMPAI?.sound?.stopSpeak?.();}catch(_){}
    try{window.speechSynthesis?.cancel?.();}catch(_){}
  }
}

function speakText(text,lang='en-US'){
  const clean=String(text||'').trim();
  if(!clean)return;
  const statusEl=document.getElementById('speechStatus');
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.speakSafe==='function'){
    const res=window.KampaiMediaLab.speakSafe(clean,{lang,rate:0.9});
    if(statusEl){
      if(res&&res.ok===false){
        statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านเนื้อหาบนหน้าจอต่อได้';
        statusEl.classList.add('show');
      }else{
        statusEl.textContent='';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try{
    if(window.KAMPAI?.sound?.speak){KAMPAI.sound.speak(clean,lang,true);return;}
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang=lang;u.rate=0.9;
      window.speechSynthesis.speak(u);
      return;
    }
  }catch(_){}
  if(statusEl){
    statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านเนื้อหาบนหน้าจอต่อได้';
    statusEl.classList.add('show');
  }
}

function buildQuizPool(){
  return ITEMS.map((item,idx)=>({
    id:'read-'+idx,
    term:item.name,
    meaning:item.a+' ('+item.tip+')',
    reading:item.emoji,
    example:item.ex,
    explain:item.name+' — '+item.body+' ('+item.tip+')',
    locale:'en-US'
  }));
}

function updateQuizButtons(){
  const cBtn=document.getElementById('btnQuizChoice');
  const lBtn=document.getElementById('btnQuizListen');
  if(cBtn)cBtn.className='btn '+(quizType==='choice'?'btn-primary':'btn-ghost');
  if(lBtn)lBtn.className='btn '+(quizType==='listen'?'btn-primary':'btn-ghost');
}

function mountQuizEngine(){
  if(!window.KampaiEngines||!window.KampaiEngines.Quiz)return;
  updateQuizButtons();
  const opts={
    items:buildQuizPool(),
    mode:'media',
    roundSize:6,
    locale:'en-US',
    speak:(text,loc)=>speakText(text,loc||'en-US'),
    onAnswer:(res)=>{
      if(window.KAMPAI&&window.KAMPAI.sound){
        try{res.isCorrect?KAMPAI.sound.correct():KAMPAI.sound.wrong();}catch(_){}
      }
    }
  };
  quizSession=quizType==='listen'
    ?window.KampaiEngines.Quiz.mountListen('#quizEngineRoot',opts)
    :window.KampaiEngines.Quiz.mountChoice('#quizEngineRoot',opts);
}

function setMode(m){
  stopSpeech();
  mode=m==='practice'?'practice':'learn';
  document.getElementById('shell').classList.toggle('mode-practice',mode==='practice');
  document.getElementById('hintText').textContent=mode==='learn'?'เลือกหัวข้อ · อ่านให้เข้าใจ':'ตอบคำถาม · ไม่เก็บคะแนน';
  if(mode==='practice'){
    nextPr();
    mountQuizEngine();
  }else if(window.KampaiEngines?.Quiz?.cleanup){
    window.KampaiEngines.Quiz.cleanup();
  }
}

function render(){
  document.getElementById('pick').innerHTML=ITEMS.map((x,i)=>'<button type="button" data-i="'+i+'" class="'+(x===cur?'on':'')+'">'+(x.emoji?x.emoji+' ':'')+x.name+'</button>').join('');
  document.getElementById('box').innerHTML=(cur.emoji?'<div class="emo">'+cur.emoji+'</div>':'')+'<h2>'+cur.name+'</h2><p>'+cur.body+'</p>'+(cur.tip?'<p style="margin-top:10px;color:var(--muted);font-size:1rem">💡 '+cur.tip+'</p>':'')+(cur.ex?'<div class="ex">'+cur.ex+'</div>':'')+'<div style="margin-top:12px"><button type="button" class="btn btn-ghost" id="btnSpeakTopic">🔊 ฟังหัวข้อและตัวอย่าง</button></div>';
  const speakBtn=document.getElementById('btnSpeakTopic');
  if(speakBtn){
    speakBtn.onclick=()=>speakText(cur.name+'. '+(cur.ex||cur.body),'en-US');
  }
}
document.getElementById('pick').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;stopSpeech();cur=ITEMS[+b.dataset.i];render();};
function nextPr(){const a=ITEMS[Math.floor(Math.random()*ITEMS.length)];currentPr=a;document.getElementById('prQ').textContent=a.q;document.getElementById('prFb').textContent='';
  const opts=new Set([a.a]);while(opts.size<4)opts.add(ITEMS[Math.floor(Math.random()*ITEMS.length)].a);
  const box=document.getElementById('prChoices');box.innerHTML=[...opts].sort(()=>Math.random()-0.5).map(o=>'<button type="button" class="choice">'+o+'</button>').join('');
  box.onclick=e=>{const b=e.target.closest('.choice');if(!b)return;const ok=b.textContent===a.a;b.classList.add(ok?'ok':'no');document.getElementById('prFb').textContent=ok?'✅ เก่งมาก!':'เฉลย: '+a.a;if(window.KAMPAI&&KAMPAI.sound)(ok?KAMPAI.sound.correct:KAMPAI.sound.wrong)();};}
document.getElementById('btnNext').onclick=nextPr;
document.getElementById('btnSpeakPr').onclick=()=>speakText(currentPr.name+'. '+currentPr.ex,'en-US');
document.getElementById('btnQuizChoice').onclick=()=>{stopSpeech();quizType='choice';mountQuizEngine();};
document.getElementById('btnQuizListen').onclick=()=>{stopSpeech();quizType='listen';mountQuizEngine();};
document.getElementById('btnQuizNew').onclick=()=>{stopSpeech();mountQuizEngine();};
render();setMode('learn');mountQuizEngine();
document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button[data-mode]');if(!b)return;
  [...document.querySelectorAll('#modeSeg button')].forEach(x=>x.classList.toggle('on',x===b));
  setMode(b.dataset.mode);
};
document.getElementById('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
window.addEventListener('pagehide',stopSpeech);
window.getState=()=>Object.freeze({
  slug:MEDIA_SLUG,
  mode,
  currentTopic:cur.name,
  quizType,
  quizState:quizSession?quizSession.getState():null,
  reducedMotion:typeof window.matchMedia==='function'?Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches):false
});
window.__getState=window.getState;
</script>
</body></html>
