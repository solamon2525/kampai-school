<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    
    <!-- Title Gold Gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFbeb"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>

    <!-- Balloon Gradients -->
    <radialGradient id="balloonRed" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.4" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="balloonBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.4" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="balloonGreen" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="0.4" stop-color="#10b981"/>
      <stop offset="1" stop-color="#064e3b"/>
    </radialGradient>
    <radialGradient id="balloonYellow" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.4" stop-color="#eab308"/>
      <stop offset="1" stop-color="#854d0e"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Clouds -->
  <path d="M-50,200 Q20,100 120,200 Q220,100 320,200 Q420,100 480,200 L480,300 L-50,300 Z" fill="#ffffff" opacity="0.6"/>
  <path d="M800,150 Q900,50 1000,150 Q1100,50 1200,150 Q1300,50 1380,150 L1380,250 L800,250 Z" fill="#ffffff" opacity="0.5"/>
  <path d="M300,450 Q450,300 600,450 Q750,300 900,450 L900,550 L300,550 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="1150" cy="120" r="80" fill="#fef08a" opacity="0.8"/>
  <circle cx="1150" cy="120" r="100" fill="#fef08a" opacity="0.3"/>

  <!-- Balloons -->
  <g filter="url(#shadow)">
    <!-- Red Balloon (A) -->
    <g transform="translate(180, 220)">
      <path d="M 0 0 C -45 -10 -45 -70 0 -80 C 45 -70 45 -10 0 0 Z" fill="url(#balloonRed)"/>
      <path d="M 0 0 L -5 10 L 5 10 Z" fill="#991b1b"/>
      <path d="M 0 10 Q -10 30 0 50 T 0 90" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="0" y="-30" fill="#ffffff" font-size="44" font-weight="bold" text-anchor="middle" font-family="'Fredoka One', sans-serif">A</text>
    </g>

    <!-- Blue Balloon (sh) -->
    <g transform="translate(1050, 320)">
      <path d="M 0 0 C -50 -10 -50 -75 0 -85 C 50 -75 50 -10 0 0 Z" fill="url(#balloonBlue)"/>
      <path d="M 0 0 L -5 10 L 5 10 Z" fill="#1e3a8a"/>
      <path d="M 0 10 Q 10 30 0 50 T 0 95" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="0" y="-32" fill="#ffffff" font-size="38" font-weight="bold" text-anchor="middle" font-family="'Fredoka One', sans-serif">sh</text>
    </g>

    <!-- Green Balloon (cat) -->
    <g transform="translate(350, 420)">
      <path d="M 0 0 C -55 -10 -55 -85 0 -95 C 55 -85 55 -10 0 0 Z" fill="url(#balloonGreen)"/>
      <path d="M 0 0 L -6 11 L 6 11 Z" fill="#064e3b"/>
      <path d="M 0 11 Q -15 35 0 60 T 0 110" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="0" y="-38" fill="#ffffff" font-size="34" font-weight="bold" text-anchor="middle" font-family="'Fredoka One', sans-serif">cat</text>
    </g>

    <!-- Yellow Balloon (B) -->
    <g transform="translate(860, 150)">
      <path d="M 0 0 C -45 -10 -45 -70 0 -80 C 45 -70 45 -10 0 0 Z" fill="url(#balloonYellow)"/>
      <path d="M 0 0 L -5 10 L 5 10 Z" fill="#854d0e"/>
      <path d="M 0 10 Q 10 25 0 45 T -5 80" fill="none" stroke="#475569" stroke-width="2"/>
      <text x="0" y="-30" fill="#ffffff" font-size="44" font-weight="bold" text-anchor="middle" font-family="'Fredoka One', sans-serif">B</text>
    </g>
  </g>

  <!-- Sound Waves (Speaker) -->
  <g transform="translate(640, 170)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="65" fill="#2563eb"/>
    <!-- Speaker Icon -->
    <path d="M-25,-15 L-15,-15 L-2,-27 L-2,27 L-15,15 L-25,15 Z" fill="#ffffff"/>
    <path d="M8,-18 C15,-10 15,10 8,18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M18,-28 C28,-14 28,14 18,28" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Text / Branding -->
  <g filter="url(#shadow)" transform="translate(640, 480)">
    <!-- Main Title -->
    <text x="0" y="0" fill="url(#gold)" font-size="82" font-weight="900" text-anchor="middle" stroke="#1e3a8a" stroke-width="6" stroke-linejoin="round" letter-spacing="2">🗣️ Phonics Pop</text>
    <!-- Subtitle -->
    <text x="0" y="55" fill="#1e3a8a" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="4">เกมฝึกฟังเสียงโฟนิกส์และสะกดคำ</text>
    <text x="0" y="105" fill="#475569" font-size="22" font-weight="bold" text-anchor="middle">กลุ่มสาระการเรียนรู้ภาษาต่างประเทศ (ภาษาอังกฤษ)</text>
  </g>
</svg>
