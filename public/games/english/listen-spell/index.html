<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ฟังแล้วสะกด — Listen & Spell (kampai SDK)</title>
<!--
  KAMPAI-SCHOOL · GAME "ฟังแล้วสะกด" (listen-spell) — ภาษาอังกฤษ ป.4-6
  โครงสร้างโฟลเดอร์ (5 ไฟล์): index.html + style.css + config.js + data.js + game.js
  แก้พารามิเตอร์ → config.js · แก้คำศัพท์ → data.js · แก้ลอจิก → game.js · แก้หน้าตา → style.css
  3 โหมด: ฟังเสียง (TTS) → แตะตัวอักษรสะกดให้ถูก — แข่งเวลา / ฝึก / ออนไลน์
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD -->
<div id="score-container">⭐ <span id="score-value">0</span></div>
<div id="timer-container">⏱️ <span id="timer-value">60</span></div>
<div id="life-container">❤️❤️❤️</div>
<div id="player-chip"></div>

<!-- Play area -->
<div id="play">
    <div id="hint-emoji">🔊</div>
    <div id="hint-th"></div>
    <button id="listen-btn" onclick="sayWord()">🔊 ฟังอีกครั้ง</button>
    <div id="combo-badge"></div>
    <div id="slots"></div>
    <div id="tiles"></div>
</div>
<button id="stop-btn" class="btn btn-ghost" onclick="endGame()">⏹️ จบเกม</button>

<!-- Start screen -->
<div id="blocker">
    <h1>🔊 ฟังแล้วสะกด</h1>
    <p>ฟังเสียงคำภาษาอังกฤษ แล้วแตะตัวอักษรเรียงให้สะกดถูก<br>มีรูปเป็นคำใบ้ — กด 🔊 เพื่อฟังซ้ำได้</p>
    <div id="my-stats">
        <div class="ms-cell"><div class="ms-val" id="ms-best">0</div><div class="ms-label">คะแนนสูงสุด</div></div>
        <div class="ms-cell"><div class="ms-val" id="ms-plays">0</div><div class="ms-label">เล่นไปแล้ว (ครั้ง)</div></div>
    </div>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list" class="leaderboard-list"><li class="lb-loading">กำลังโหลด...</li></ul>
    </div>
    <div class="cat-label">เลือกหมวดคำ</div>
    <div id="cat-row" class="cat-row"></div>
    <div class="mode-row">
        <button class="btn btn-primary" onclick="startGame('race')">⏱️ แข่งเวลา 60 วิ</button>
        <button class="btn btn-blue" onclick="startGame('practice')">🧠 ฝึก (3 ชีวิต)</button>
        <button class="btn btn-ghost" id="online-btn" onclick="openOnline()" style="display:none">🏁 แข่ง 2 คน</button>
    </div>
</div>

<!-- Game Over screen -->
<div id="gameover-screen">
    <h1>จบเกม!</h1>
    <p>คะแนนสุดท้าย</p>
    <div id="final-score">0</div>
    <p id="go-summary" style="font-size:15px"></p>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list-gameover" class="leaderboard-list"><li class="lb-loading">—</li></ul>
    </div>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px;">
        <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
        <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
    </div>
</div>

<!-- ═══ KAMPAI SDK + Online framework (single source — อย่าแก้) ═══ -->
<script src="/games/kampai-sdk.js"></script>
<script>
/* fallback stub: กันพังถ้าเปิด standalone แล้ว SDK โหลดไม่ได้ */
window.KAMPAI = window.KAMPAI || { isEmbed:false, isTouch:false, ready:true, student:null, stats:null, leaderboard:[], input:{}, onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, exit:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},speak:function(){},speakBilingual:function(){},getVoiceMode:function(){return 'en';},setVoiceMode:function(){},stopSpeak:function(){},fxFlash:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}} };
</script>
<script src="/games/kampai-match.js"></script>
<script src="/games/kampai-versus.js"></script>
<script>window.KampaiVersus = window.KampaiVersus || { create:function(o){ var m=(window.KampaiMatch&&window.KampaiMatch.create)?window.KampaiMatch.create(o):null; return { available:false, openMenu:function(){ if(m)m.openMenu(); }, report:function(s,i){ if(m)m.report(s,i); }, finish:function(s,i){ if(m){m.finish(s,i);return true;} return false; }, leave:function(){}, mode:null }; } };</script>
<script>
window.KampaiMatch = window.KampaiMatch || { create:function(){return{available:false,openMenu:function(){alert('โหมดออนไลน์เล่นผ่านระบบเท่านั้น');},report:function(){},finish:function(){},leave:function(){}};} };
</script>

<!-- ═══ เกม (5 ไฟล์): config → data → game (โหลดตามลำดับ แชร์ global scope) ═══ -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
