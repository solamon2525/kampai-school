<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="0.55" stop-color="#0e4257"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>

  <!-- faint watermark letters -->
  <text x="200" y="640" font-size="520" font-weight="800" fill="#ffffff" opacity="0.05" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="1090" y="150" font-size="300" font-weight="800" fill="#ffffff" opacity="0.05" text-anchor="middle" dominant-baseline="middle">Z</text>

  <!-- floating ABC chips -->
  <g font-family="'Fredoka One','Kanit',sans-serif" font-weight="800" filter="url(#sh)">
    <g transform="translate(180,250) rotate(-12)"><rect x="-46" y="-46" width="92" height="92" rx="18" fill="url(#gold)"/><text x="0" y="6" font-size="56" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">A</text></g>
    <g transform="translate(1095,300) rotate(10)"><rect x="-46" y="-46" width="92" height="92" rx="18" fill="#f8fafc"/><text x="0" y="6" font-size="56" fill="#155e75" text-anchor="middle" dominant-baseline="middle">B</text></g>
    <g transform="translate(150,470) rotate(8)"><rect x="-40" y="-40" width="80" height="80" rx="16" fill="#f8fafc"/><text x="0" y="6" font-size="48" fill="#155e75" text-anchor="middle" dominant-baseline="middle">C</text></g>
  </g>

  <!-- top pill -->
  <g transform="translate(640,118)">
    <rect x="-170" y="-26" width="340" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ภาษาอังกฤษ</text>
  </g>

  <!-- title -->
  <text x="640" y="290" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">แข่งคำศัพท์</text>
  <text x="640" y="378" font-size="40" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">Vocabulary Race · ดูรูป → เลือกคำอังกฤษ</text>

  <!-- example: emoji + answer chips -->
  <g transform="translate(640,520)">
    <text x="-300" y="0" font-size="92" text-anchor="middle" dominant-baseline="middle">🐱</text>
    <g dominant-baseline="middle" text-anchor="middle" font-size="40" font-weight="800" font-family="'Fredoka One','Kanit',sans-serif">
      <rect x="-150" y="-40" width="150" height="80" rx="18" fill="#f8fafc"/><text x="-75" y="4" fill="#1e293b">dog</text>
      <rect x="10" y="-40" width="150" height="80" rx="18" fill="url(#gold)" stroke="#fff7e0" stroke-width="4"/><text x="85" y="4" fill="#0f172a">cat</text>
      <rect x="170" y="-40" width="150" height="80" rx="18" fill="#f8fafc"/><text x="245" y="4" fill="#1e293b">fish</text>
    </g>
  </g>

  <!-- bottom ribbon -->
  <g transform="translate(640,642)">
    <rect x="-200" y="-24" width="400" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="25" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">🔥 8 หมวด · เดี่ยว · ฝึก · ออนไลน์แข่งสด</text>
  </g>
</svg>
