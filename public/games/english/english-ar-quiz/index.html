<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English AR Quiz — ยืนเลือกคำตอบ ป.4 (kampai)</title>
<!--
  เกม AR ภาษาอังกฤษ ป.4 — ยืน/แตะ 3 โซน เลือกคำตอบ
  KAMPAI SDK + KampaiAR engine · ดู AR-GAME.md
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── จอเริ่ม ── -->
<div class="screen active" id="startScreen">
    <div class="card">
        <div class="logo">🔤</div>
        <h1 class="title">English AR Quiz</h1>
        <div class="subtitle">ภาษาอังกฤษ · ป.4 · ยืนเลือกคำตอบ</div>
        <div id="player-chip"></div>
        <div class="hint">
            🎥 ขยับตัวไปยัง <b>โซน</b> ของคำตอบที่ใช่ แล้ว <b>ค้างไว้</b> จนแถบเต็ม<br>
            📱 ไม่มีกล้อง? <b>แตะโซน</b> คำตอบได้เลย
        </div>
        <button class="btn" id="startBtn">▶️ เริ่มเล่น</button>
        <div class="lb-box" id="lbBox" style="display:none">
            <h3>🏆 อันดับ</h3>
            <ul class="lb-list" id="lbList"></ul>
        </div>
    </div>
</div>

<!-- ── จอเล่น (เต็มจอ) ── -->
<div class="screen" id="gameScreen">
    <video id="arVideo" autoplay playsinline muted></video>
    <div class="ar-dim"></div>
    <canvas id="arCanvas"></canvas>

    <div class="hud">
        <button class="back-btn" id="quitBtn">🏠 ออก</button>
        <div style="display:flex; gap:8px;">
            <span class="pill" id="roundPill">ข้อ 1/10</span>
            <span class="pill score" id="scorePill">⭐ 0</span>
        </div>
    </div>
    <div id="question">—</div>
    <div id="status-tag"></div>

    <div class="zones">
        <div class="zone" data-zone="left"   id="zoneLeft">
            <div class="ztag">ซ้าย</div><div class="choice">A</div><div class="zone-bar"><div class="zone-fill"></div></div>
        </div>
        <div class="zone" data-zone="center" id="zoneCenter">
            <div class="ztag">กลาง</div><div class="choice">B</div><div class="zone-bar"><div class="zone-fill"></div></div>
        </div>
        <div class="zone" data-zone="right"  id="zoneRight">
            <div class="ztag">ขวา</div><div class="choice">C</div><div class="zone-bar"><div class="zone-fill"></div></div>
        </div>
    </div>

    <div class="narrow-hint" style="position:absolute; bottom:6px; width:100%; text-align:center; z-index:20; font-size:12px; color:#93c5fd;">เหมาะกับจอกว้าง/แท็บเล็ต</div>
    <div id="loading">กำลังเปิดกล้อง…</div>
</div>

<!-- ── จอจบ ── -->
<div class="screen" id="resultScreen">
    <div class="card">
        <div class="logo">🎉</div>
        <h1 class="title">Great job!</h1>
        <div id="final-score">0</div>
        <div id="final-detail"></div>
        <div class="row">
            <button class="btn" id="restartBtn">🔄 เล่นอีกครั้ง</button>
            <button class="btn ghost" id="homeBtn">🏠 หน้าหลัก</button>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="/games/kampai-sdk.js"></script>
<script>window.KAMPAI = window.KAMPAI || { isEmbed:false, ready:true, student:null, stats:null, leaderboard:[], onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, sound:{ unlock:function(){}, correct:function(){}, wrong:function(){}, timeUp:function(){}, gameOver:function(){}, speak:function(){}, stopSpeak:function(){}, fxFlash:function(){}, mountToggles:function(){}, defaultBgm:function(){}, bgmStart:function(){}, bgmStop:function(){} } };</script>
<script src="/games/kampai-ar.js"></script>
<script>window.KampaiAR = window.KampaiAR || { VERSION:'stub', create:function(){ return { start:function(){return Promise.resolve(false);}, stop:function(){}, setActive:function(){}, tap:function(){}, mode:'tap' }; } };</script>
<script src="game.js"></script>
</body>
</html>
