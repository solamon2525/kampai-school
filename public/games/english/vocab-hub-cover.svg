<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background: bright kid-friendly blue (matches the game) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88E5"/>
      <stop offset="0.55" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <!-- Gold title gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.5" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="300" r="470" fill="url(#glow)"/>

  <!-- Floating decorative letters (low opacity) -->
  <g font-weight="900" text-anchor="middle">
    <text x="155" y="250" font-size="120" fill="#FFFFFF" opacity="0.10">A</text>
    <text x="1120" y="210" font-size="100" fill="#FFE082" opacity="0.14">B</text>
    <text x="230" y="560" font-size="92" fill="#FFFFFF" opacity="0.09">C</text>
    <text x="1090" y="560" font-size="110" fill="#FFFFFF" opacity="0.10">a</text>
    <text x="100" y="410" font-size="70" fill="#FFE082" opacity="0.10">z</text>
    <text x="1190" y="400" font-size="74" fill="#FFFFFF" opacity="0.08">x</text>
  </g>

  <!-- Color dots motif (the "colors" topic) -->
  <g opacity="0.9" filter="url(#sh)">
    <circle cx="150" cy="120" r="16" fill="#E53935"/>
    <circle cx="200" cy="150" r="11" fill="#FB8C00"/>
    <circle cx="1130" cy="120" r="16" fill="#43A047"/>
    <circle cx="1080" cy="150" r="11" fill="#8E24AA"/>
  </g>

  <!-- Top badge -->
  <g transform="translate(640, 92)">
    <rect x="-230" y="-27" width="460" height="54" rx="27" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="25" font-weight="700" fill="#FFF3C4" text-anchor="middle" dominant-baseline="middle" letter-spacing="1.5">✨ ภาษาอังกฤษ · ป.1–6 ✨</text>
  </g>

  <!-- Main title -->
  <text x="640" y="195" font-size="96" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">คำศัพท์ภาษาอังกฤษ</text>
  <text x="640" y="258" font-size="30" font-weight="700" fill="#BBDEFB" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">English Vocabulary · 10 หมวดคำศัพท์</text>

  <!-- Center showcase: spelling mode R - E - D -->
  <g transform="translate(640, 400)" filter="url(#sh)">
    <!-- three gold letter tiles -->
    <g>
      <rect x="-205" y="-70" width="120" height="140" rx="20" fill="url(#gold)"/>
      <text x="-145" y="6" font-size="92" font-weight="900" fill="#0D47A1" text-anchor="middle" dominant-baseline="middle">R</text>
      <rect x="-60" y="-70" width="120" height="140" rx="20" fill="url(#gold)"/>
      <text x="0" y="6" font-size="92" font-weight="900" fill="#0D47A1" text-anchor="middle" dominant-baseline="middle">E</text>
      <rect x="85" y="-70" width="120" height="140" rx="20" fill="url(#gold)"/>
      <text x="145" y="6" font-size="92" font-weight="900" fill="#0D47A1" text-anchor="middle" dominant-baseline="middle">D</text>
    </g>
  </g>

  <!-- Caption under tiles -->
  <text x="640" y="515" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">
    <tspan fill="#FFE082">อ่านว่า</tspan> เรด · <tspan fill="#FFE082">แปลว่า</tspan> สีแดง
  </text>

  <!-- Bottom feature banner -->
  <g transform="translate(640, 648)">
    <rect x="-470" y="-26" width="940" height="52" rx="26" fill="#ffffff" opacity="0.14"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" opacity="0.97">▶️ อัตโนมัติ · 🎲 สุ่ม · 🎯 ทายคำ · 🔗 จับคู่ · 🎧 ฟังเสียง · 🔤 สะกดคำ</text>
  </g>
</svg>
