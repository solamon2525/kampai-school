<main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างแบบฝึกหัด Phonics...</article></div></section></main>

  { group:'short-o', sound:'o', cue:'/ɒ/', word:'fox', parts:['f','o','x'], th:'ฟอกซ์ (สุนัขจิ้งจอก)', options:['fox','box','fix','fan'], answer:'fox' },
  { group:'short-o', sound:'o', cue:'/ɒ/', word:'box', parts:['b','o','x'], th:'บอกซ์ (กล่อง)', options:['box','fox','bag','bus'], answer:'box' },

  { group:'short-o', sound:'o', cue:'/ɒ/', word:'log', parts:['l','o','g'], th:'ล็อก (ท่อนไม้)', options:['log','leg','lid','lip'], answer:'log' },

  // Short U (/ʌ/)

  { group:'short-u', sound:'u', cue:'/ʌ/', word:'cup', parts:['c','u','p'], th:'คัพ (ถ้วย)', options:['cup','cap','cop','cat'], answer:'cup' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'bus', parts:['b','u','s'], th:'บัส (รถประจำทาง)', options:['bus','bag','bug','box'], answer:'bus' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'bug', parts:['b','u','g'], th:'บัก (แมลงปีกแข็ง)', options:['bug','bag','big','bed'], answer:'bug' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'rug', parts:['r','u','g'], th:'รัก (พรมปูพื้น)', options:['rug','red','rat','run'], answer:'rug' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'jug', parts:['j','u','g'], th:'จัก (เหยือกน้ำ)', options:['jug','jet','jam','job'], answer:'jug' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'mug', parts:['m','u','g'], th:'มัก (แก้วมีหู)', options:['mug','map','mop','mat'], answer:'mug' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'run', parts:['r','u','n'], th:'รัน (วิ่ง)', options:['run','rug','rat','red'], answer:'run' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'nut', parts:['n','u','t'], th:'นัท (ถั่ว/เมล็ดพืช)', options:['nut','net','not','nap'], answer:'nut' },
  { group:'short-u', sound:'u', cue:'/ʌ/', word:'tub', parts:['t','u','b'], th:'ทับ (อ่างน้ำ)', options:['tub','top','ten','tin'], answer:'tub' },

  // Blends & Digraphs
  { group:'blends', sound:'ch', cue:'/tʃ/', word:'chair', parts:['ch','air'], th:'แชร์ (เก้าอี้)', options:['chair','chin','ship','star'], answer:'chair' },
  { group:'blends', sound:'ch', cue:'/tʃ/', word:'chin', parts:['ch','in'], th:'ชิน (คาง)', options:['chin','chair','thin','pin'], answer:'chin' },
  { group:'blends', sound:'sh', cue:'/ʃ/', word:'ship', parts:['sh','i','p'], th:'ชิพ (เรือลำใหญ่)', options:['ship','shop','fish','chip'], answer:'ship' },
  { group:'blends', sound:'sh', cue:'/ʃ/', word:'shop', parts:['sh','o','p'], th:'ช็อป (ร้านค้า)', options:['shop','ship','stop','drop'], answer:'shop' },
  { group:'blends', sound:'sh', cue:'/ʃ/', word:'fish', parts:['f','i','sh'], th:'ฟิช (ปลา)', options:['fish','dish','wish','ship'], answer:'fish' },

  { group:'blends', sound:'dr', cue:'/dr/', word:'drum', parts:['dr','u','m'], th:'ดรัม (กลอง)', options:['drum','drop','draw','dress'], answer:'drum' },

  { group:'blends', sound:'cl', cue:'/kl/', word:'clock', parts:['cl','o','ck'], th:'คล็อก (นาฬิกา)', options:['clock','duck','sock','rock'], answer:'clock' }

window.WORKSHEET_CONFIG = {
  icon: '🔤',
  title: 'Phonics Reading Worksheet',
  subject: 'ภาษาอังกฤษ',
  gradeLabel: 'ป.1–ป.4',
  mediaLabel: 'Phonics Reading Studio',
  sourceMediaUrl:'/games/english/phonics-media.html',
  indicators: ['ต 1.1 ป.1/2', 'ต 2.2 ป.1/1'],
  directions: 'ฝึกผสมเสียงโฟนิกส์ แยกเสียงย่อย (Sound Blending) เลือกคำศัพท์ที่ถูกต้อง และคัดคำให้สวยงาม',
  getItems(topic) {
    if (!topic || topic === 'mixed') return PHONICS_ITEMS;
    return PHONICS_ITEMS.filter(item => item.group === topic);
  },
  renderQuestion(item) {
    const e = window.KampaiTopicWorksheet.escapeHtml;
    const boxes = item.parts.map(p => '<span class="sound-box" style="display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:2px solid #2563eb;border-radius:8px;font-weight:800;font-size:1.15rem;margin:0 3px;background:#eff6ff;color:#1e40af;">' + e(p) + '</span>').join(' + ');
    const opts = item.options.map(opt => {
      const isCorrect = opt.toLowerCase() === item.answer.toLowerCase();
      return '<span style="display:inline-block;padding:3px 10px;margin:2px 4px;border:1.5px solid #cbd5e1;border-radius:6px;font-weight:700;' + (isCorrect ? 'background:#f0fdf4;border-color:#86efac;' : '') + '">○ ' + e(opt) + '</span>';
    }).join(' ');

    return '<div class="q-stem" style="line-height:1.6;font-size:1.05rem;">' +
      '<div class="q-prompt" style="font-weight:700;color:#0f172a;margin-bottom:6px;">' +
        'เสียง <strong style="color:#2563eb;font-size:1.2rem;">' + e(item.sound) + '</strong> ' + e(item.cue) +
        ' · ความหมาย: <span style="color:#b45309;font-weight:800;">' + e(item.th) + '</span>' +
      '</div>' +
      '<div style="margin:6px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px;">' +
        '<span style="font-weight:700;color:#475569;font-size:0.95rem;">กระจายเสียงสะกด (Phonemes):</span> ' + boxes +
      '</div>' +
      '<div class="word-bank" style="margin:8px 0;padding:6px 10px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;">' +
        '<span style="font-size:0.9rem;font-weight:700;color:#64748b;">ตัวเลือก:</span> ' + opts +
      '</div>' +
    '</div>' +
    '<div class="q-work-block" style="margin-top:6px;display:flex;flex-direction:column;gap:6px;">' +
      '<div class="work-line" style="display:flex;align-items:center;gap:8px;font-weight:700;color:#334155;">' +
        'เขียนคำศัพท์: <span class="work-fill" style="flex:1;min-height:28px;border-bottom:2px dashed #94a3b8;">' + e(item.answer) + '</span>' +
      '</div>' +
      '<div class="answer teacher-answer" style="color:#16a34a;font-weight:800;font-size:0.95rem;">' +
        '✅ เฉลย: ' + e(item.answer) + ' (' + e(item.cue) + ' ' + e(item.th) + ')' +
      '</div>' +
    '</div>';
  }
};
</script>
<script src="/games/worksheet-topic.js?v=2.0.0"></script>
<script>
function render() { window.KampaiTopicWorksheet.render(); }
document.getElementById('btnRandom').onclick = window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick = () => document.body.classList.toggle('show-answers');
document.getElementById('btnPrint').onclick = () => window.KampaiWorksheet.printA4();
window.KampaiWorksheet.loadTeachers();
render();
</script>
<script src="/games/worksheet-modes.js?v=2.0.0"></script>
