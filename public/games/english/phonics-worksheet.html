<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/english/phonics-media.html"><meta name="curriculum-indicators" content="ต 1.1 ป.1/2,ต 2.2 ป.1/1">
<title>Phonics Worksheet ป.1–3 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.184.0" rel="stylesheet">
<style>
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center;line-height:1.15}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt;padding-bottom:.3mm}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>🔤 Phonics — เสียงและคำ</h1><div class="toolbar-ctrls">
<select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="1">ป.1–3</option></select><select class="t-select" id="selTopic" aria-label="กลุ่มเสียง"><option value="mixed">ผสมทุกเสียง</option><option value="letter">ตัวอักษรเดี่ยว</option><option value="blend">Blends</option><option value="digraph">Digraphs</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 New set</button><button class="btn" id="btnAnswers">👁 Teacher key</button><button class="btn green" id="btnPrint">🖨 Print A4</button>
</div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">Loading worksheet</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const PHONICS_ITEMS=[
 {type:'letter',sound:'a',cue:'/æ/',words:['apple','ant','sun'],answer:'apple, ant',position:'ต้นคำ',s1:'Hear /æ/',s2:'Check beginning',s3:'apple, ant'},
 {type:'letter',sound:'b',cue:'/b/',words:['ball','book','cat'],answer:'ball, book',position:'ต้นคำ',s1:'Hear /b/',s2:'Check beginning',s3:'ball, book'},
 {type:'letter',sound:'c',cue:'/k/',words:['cat','cup','fish'],answer:'cat, cup',position:'ต้นคำ',s1:'Hear /k/',s2:'Check beginning',s3:'cat, cup'},
 {type:'letter',sound:'f',cue:'/f/',words:['fish','fan','dog'],answer:'fish, fan',position:'ต้นคำ',s1:'Hear /f/',s2:'Check beginning',s3:'fish, fan'},
 {type:'letter',sound:'m',cue:'/m/',words:['moon','map','pen'],answer:'moon, map',position:'ต้นคำ',s1:'Hear /m/',s2:'Check beginning',s3:'moon, map'},
 {type:'blend',sound:'bl',cue:'/bl/',words:['blue','black','rain'],answer:'blue, black',position:'ต้นคำ',s1:'Blend b+l',s2:'Check beginning',s3:'blue, black'},
 {type:'blend',sound:'st',cue:'/st/',words:['star','stop','ship'],answer:'star, stop',position:'ต้นคำ',s1:'Blend s+t',s2:'Check beginning',s3:'star, stop'},
 {type:'blend',sound:'cr',cue:'/kr/',words:['crab','cry','tree'],answer:'crab, cry',position:'ต้นคำ',s1:'Blend c+r',s2:'Check beginning',s3:'crab, cry'},
 {type:'blend',sound:'fl',cue:'/fl/',words:['flag','flower','chair'],answer:'flag, flower',position:'ต้นคำ',s1:'Blend f+l',s2:'Check beginning',s3:'flag, flower'},
 {type:'digraph',sound:'sh',cue:'/ʃ/',words:['ship','shop','cat'],answer:'ship, shop',position:'ต้นคำ',s1:'Digraph sh=/ʃ/',s2:'Check beginning',s3:'ship, shop'},
 {type:'digraph',sound:'ch',cue:'/tʃ/',words:['chair','chick','ring'],answer:'chair, chick',position:'ต้นคำ',s1:'Digraph ch=/tʃ/',s2:'Check beginning',s3:'chair, chick'},
 {type:'digraph',sound:'th',cue:'/θ/',words:['three','thin','moon'],answer:'three, thin',position:'ต้นคำ',s1:'Digraph th=/θ/',s2:'Check beginning',s3:'three, thin'},
 {type:'digraph',sound:'ph',cue:'/f/',words:['phone','photo','ball'],answer:'phone, photo',position:'ต้นคำ',s1:'Digraph ph=/f/',s2:'Check beginning',s3:'phone, photo'},
 {type:'digraph',sound:'ck',cue:'/k/',words:['duck','sock','sun'],answer:'duck, sock',position:'ท้ายคำ',s1:'Digraph ck=/k/',s2:'Check ending',s3:'duck, sock'},
 {type:'digraph',sound:'ng',cue:'/ŋ/',words:['ring','king','map'],answer:'ring, king',position:'ท้ายคำ',s1:'Digraph ng=/ŋ/',s2:'Check ending',s3:'ring, king'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'phonics',icon:'🔤',title:'Phonics — Sounds & Words',subject:'ภาษาอังกฤษ',gradeLabel:'ป.1–3',mediaLabel:'Phonics Chart',
  sourceMediaUrl:'/games/english/phonics-media.html',indicators:['ต 1.1 ป.1/2','ต 2.2 ป.1/1'],
  directions:'สแกนฟังเสียงจากสื่อ แล้วจับคู่เสียง แยกเสียง และเขียนคำ',
  getItems(topic){return topic==='mixed'?PHONICS_ITEMS:PHONICS_ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const answers=item.answer.split(',').map(s=>s.trim());
    const boxes=item.sound.split('').map(letter=>'<span class="sound-box">'+e(letter)+'</span>').join('');
    const words=item.words.map(word=>{
      const hit=answers.some(a=>a.toLowerCase()===word.toLowerCase());
      return '○ '+(hit?'<span class="word-hit">'+e(word)+'</span>':e(word));
    }).join(' &nbsp; ');
    const where=item.position==='ท้ายคำ'?'end':'beginning';
    return '<div class="q-stem"><div class="q-prompt">Sound <strong>'+e(item.sound)+'</strong> '+e(item.cue)+' — circle words with this sound at the '+where+'.</div><div class="word-bank">'+words+'</div><div class="sound-row"><span>Split the sound:</span>'+boxes+'</div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 Hear</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 Locate</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 Match</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
