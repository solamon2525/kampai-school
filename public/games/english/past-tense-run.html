<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Past Tense Run — วิ่งเติมคำอดีต</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Kanit', sans-serif; color: #fff; overflow: hidden; }
body { background: linear-gradient(180deg, #1d4ed8, #0f172a); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#hud { display: none; align-items: center; justify-content: center; gap: 10px; padding: 52px 14px 8px; }
#hud.on { display: flex; }
#score { font-size: 24px; font-weight: 700; color: #FFD700; background: rgba(0,0,0,.35); padding: 4px 16px; border-radius: 999px; }
#tag { font-size: 13px; font-weight: 600; color: #bfdbfe; background: rgba(255,255,255,.12); padding: 4px 12px; border-radius: 999px; }
#play { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 14px; }
#play.on { display: flex; }
#prompt { font-size: 15px; color: #93c5fd; font-weight: 600; text-align: center; }
#q { font-size: clamp(22px, 5.5vw, 34px); font-weight: 700; text-align: center; line-height: 1.35; max-width: 520px; }
#q .blank { color: #fde68a; border-bottom: 3px dashed #fbbf24; padding: 0 8px; }
#speak-btn { width: 48px; height: 48px; border: none; border-radius: 50%; background: rgba(59,130,246,.45); color: #fff; font-size: 22px; cursor: pointer; }
#ans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 460px; }
.a { font-family: inherit; font-size: clamp(20px, 5vw, 28px); font-weight: 700; padding: 18px 8px; min-height: 52px; border: none; border-radius: 16px; cursor: pointer; color: #1e293b; background: #f8fafc; box-shadow: 0 5px 0 #cbd5e1; }
.a:active { transform: translateY(4px); box-shadow: 0 1px 0 #cbd5e1; }
.a.correct { background: linear-gradient(135deg,#86efac,#22c55e); }
.a.wrong { background: linear-gradient(135deg,#fca5a5,#ef4444); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: rgba(15,23,42,.92); }
.screen.off { display: none; }
h1 { font-size: 30px; background: linear-gradient(135deg,#FFD700,#FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#final { color: #FFD700; font-size: 46px; font-weight: 700; }
.btn { padding: 14px 30px; font-family: inherit; font-size: 19px; font-weight: 600; border: none; border-radius: 999px; color: #fff; cursor: pointer; min-height: 48px; }
.btn-primary { background: linear-gradient(45deg,#22c55e,#16a34a); }
.btn-versus { background: linear-gradient(45deg,#f59e0b,#f97316); }
.btn-blue { background: linear-gradient(45deg,#3b82f6,#2563eb); }
.res-links { font-size: 14px; color: #94a3b8; margin-top: 4px; }
.res-links a { color: #93c5fd; font-weight: 600; text-decoration: none; }
.res-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
    <div id="hud"><div id="score">⭐ <span id="score-v">0</span></div><div id="tag">Past Tense</div></div>
    <div id="play">
        <div id="prompt">เติมคำในช่องว่าง</div>
        <div id="q">She ___ happy.</div>
        <button type="button" id="speak-btn" onclick="speakQ()" title="ฟังเสียง">🔊</button>
        <div id="ans"></div>
    </div>
</div>

<div id="start" class="screen">
    <h1>🏃 Past Tense Run</h1>
    <p style="color:#cbd5e1;max-width:360px;line-height:1.45">เติม was/were · กริยา -ed · กริยาไม่ปกติ (went, saw, ate…) ให้ถูกมากที่สุดใน 50 วินาที</p>
    <button class="btn btn-primary" onclick="startSingle()">▶ เริ่มเกม (เดี่ยว)</button>
    <button class="btn btn-versus" onclick="vs.openMenu()">🏁 แข่ง 2 คน</button>
    <p class="res-links"><a href="/games/english/past-tense-mini-media.html" target="_blank" rel="noopener">ดูสื่อสอน</a> · <a href="/games/english/past-tense-mini-worksheet.html" target="_blank" rel="noopener">ใบงาน</a></p>
</div>

<div id="over" class="screen off">
    <h1>จบเกม!</h1><p>คะแนนของคุณ</p><div id="final">0</div>
    <div id="kampai-result"></div>
    <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
    <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
    <p class="res-links"><a href="/games/english/past-tense-mini-media.html" target="_blank" rel="noopener">ดูสื่อสอน</a> · <a href="/games/english/past-tense-mini-worksheet.html" target="_blank" rel="noopener">ใบงาน</a></p>
</div>

<script src="/games/kampai-sdk.js"></script>
<script>window.KAMPAI = window.KAMPAI || { isEmbed:false, ready:true, student:null, stats:null, leaderboard:[], classmates:[], onReady:function(cb){cb(this);}, setSlug:function(){return this;}, beginRound:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},speak:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}}, online:{available:false} };</script>
<script src="/games/kampai-match.js"></script>
<script>window.KampaiMatch = window.KampaiMatch || { create:function(){ return { available:false, openMenu:function(){ alert('โหมดออนไลน์เล่นผ่านระบบ /play เท่านั้น'); }, report:function(){}, finish:function(){}, leave:function(){} }; } };</script>
<script src="/games/kampai-versus.js"></script>
<script>window.KampaiVersus = window.KampaiVersus || { create:function(o){ var m=(window.KampaiMatch&&window.KampaiMatch.create)?window.KampaiMatch.create(o):null; return { available:false, openMenu:function(){ if(m)m.openMenu(); }, report:function(s,i){ if(m)m.report(s,i); }, finish:function(s,i){ if(m){m.finish(s,i);return true;} return false; }, leave:function(){}, mode:null }; } };</script>

<script>
const GAME_SLUG = 'past-tense-run';
const DURATION = 50;
KAMPAI.setSlug(GAME_SLUG);
const $ = (id) => document.getElementById(id);

const BANK = [
    { prompt: 'เลือก was หรือ were', sentence: 'She ___ happy yesterday.', ans: 'was', opts: ['was','were','is','are'], speak: 'She was happy yesterday.' },
    { prompt: 'เลือก was หรือ were', sentence: 'They ___ at school.', ans: 'were', opts: ['were','was','is','am'], speak: 'They were at school.' },
    { prompt: 'เลือก was หรือ were', sentence: 'I ___ tired this morning.', ans: 'was', opts: ['was','were','are','be'], speak: 'I was tired this morning.' },
    { prompt: 'เลือก was หรือ were', sentence: 'We ___ in the park.', ans: 'were', opts: ['were','was','is','been'], speak: 'We were in the park.' },
    { prompt: 'กริยาปกติ (-ed)', sentence: 'Yesterday I ___ football.', ans: 'played', opts: ['played','play','playing','plays'], speak: 'Yesterday I played football.' },
    { prompt: 'กริยาปกติ (-ed)', sentence: 'She ___ TV last night.', ans: 'watched', opts: ['watched','watch','watches','watching'], speak: 'She watched TV last night.' },
    { prompt: 'กริยาปกติ (-ed)', sentence: 'He ___ pizza yesterday.', ans: 'liked', opts: ['liked','like','likes','liking'], speak: 'He liked pizza yesterday.' },
    { prompt: 'กริยาปกติ (-ed)', sentence: 'We ___ to music.', ans: 'listened', opts: ['listened','listen','listens','listening'], speak: 'We listened to music.' },
    { prompt: 'กริยาไม่ปกติ', sentence: 'They ___ to the market.', ans: 'went', opts: ['went','goed','goes','going'], speak: 'They went to the market.' },
    { prompt: 'กริยาไม่ปกติ', sentence: 'I ___ a big bird.', ans: 'saw', opts: ['saw','seed','seen','sees'], speak: 'I saw a big bird.' },
    { prompt: 'กริยาไม่ปกติ', sentence: 'She ___ rice for lunch.', ans: 'ate', opts: ['ate','eated','eats','eating'], speak: 'She ate rice for lunch.' },
    { prompt: 'กริยาไม่ปกติ', sentence: 'He ___ a new bag.', ans: 'had', opts: ['had','haved','has','having'], speak: 'He had a new bag.' },
    { prompt: 'กริยาไม่ปกติ', sentence: 'I ___ my homework.', ans: 'did', opts: ['did','doed','does','doing'], speak: 'I did my homework.' },
    { prompt: 'เติมคำอดีต', sentence: 'Tom ___ home early.', ans: 'went', opts: ['went','go','goes','going'], speak: 'Tom went home early.' },
    { prompt: 'เติมคำอดีต', sentence: 'The cats ___ hungry.', ans: 'were', opts: ['were','was','is','be'], speak: 'The cats were hungry.' },
    { prompt: 'เติมคำอดีต', sentence: 'Mum ___ the door.', ans: 'opened', opts: ['opened','open','opens','opening'], speak: 'Mum opened the door.' },
];

const vs = KampaiVersus.create({
    duration: DURATION,
    title: 'Past Tense Run',
    rankBy: 'score',
    onPlay: ({ rng, player }) => startRound(rng, player),
    onEnd:  () => { locked = true; },
});

let qrand = Math.random, score = 0, correct = 0, locked = false;
let singleMode = false, singleTimer = 0, cur = null, used = [];

function startSingle() {
    singleMode = true;
    startRound(Math.random, null);
    clearTimeout(singleTimer);
    singleTimer = setTimeout(() => { locked = true; endGame(); }, DURATION * 1000);
}

function startRound(rng, player) {
    qrand = rng || Math.random;
    score = 0; correct = 0; locked = false; used = [];
    if (player !== null) singleMode = false;
    KAMPAI.beginRound();
    $('start').classList.add('off'); $('over').classList.add('off');
    $('hud').classList.add('on'); $('play').classList.add('on');
    $('score-v').textContent = 0;
    nextQ();
}

function pickQ() {
    if (used.length >= BANK.length) used = [];
    let i, guard = 0;
    do { i = (qrand() * BANK.length) | 0; guard++; } while (used.includes(i) && guard < 40);
    used.push(i);
    return BANK[i];
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = (qrand() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function nextQ() {
    locked = false;
    cur = pickQ();
    $('prompt').textContent = cur.prompt;
    $('q').innerHTML = cur.sentence.replace('___', '<span class="blank">___</span>');
    $('tag').textContent = cur.prompt.includes('ไม่ปกติ') ? 'Irregular' : (cur.prompt.includes('-ed') ? 'Regular -ed' : 'was / were');
    const opts = shuffle(cur.opts);
    $('ans').innerHTML = opts.map((v) =>
        `<button type="button" class="a" onclick="answer('${v.replace(/'/g, "\\'")}',this)">${v}</button>`
    ).join('');
    speakQ();
}

function speakQ() {
    if (!cur) return;
    try { KAMPAI.sound.speak(cur.speak || cur.ans, 'en-US', true); } catch (_) {}
}

function answer(v, btn) {
    if (locked) return; locked = true;
    if (v === cur.ans) {
        btn.classList.add('correct'); correct++; score += 10;
        $('score-v').textContent = score;
        KAMPAI.sound.correct();
        vs.report(score, { correct });
        setTimeout(nextQ, 320);
    } else {
        btn.classList.add('wrong');
        KAMPAI.sound.wrong();
        Array.from($('ans').children).forEach((b) => {
            if (b.textContent === cur.ans) b.classList.add('correct');
        });
        setTimeout(nextQ, 700);
    }
}

function endGame() {
    if (vs.finish(score, { correct })) return;
    clearTimeout(singleTimer);
    KAMPAI.sound.gameOver();
    KAMPAI.submitScore(score, { mode: 'normal', correct });
    $('hud').classList.remove('on'); $('play').classList.remove('on');
    $('final').textContent = score; $('over').classList.remove('off');
}

KAMPAI.onReady(function () { KAMPAI.sound.mountToggles(); });
</script>
</body>
</html>
