<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sight Words ป.4 — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #0d9488; --line: #99f6e4; --muted: #64748b; --ok: #16a34a; --bad: #dc2626; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #ccfbf1, #99f6e4); min-height: 100%; padding: 12px; }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #0f766e, #14b8a6); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #f0fdfa; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #5eead4; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #0f766e; font-weight: 600; flex: 1; }
    .stage { flex: 1; display: grid; grid-template-columns: 1fr; }
    @media (min-width: 820px) { .stage { grid-template-columns: 1fr 300px; } }
    .grid-wrap { padding: 14px; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .tile { aspect-ratio: 1.2; border-radius: 14px; border: 2px solid #99f6e4; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .95rem; color: var(--deep); text-transform: lowercase; padding: 4px; text-align: center; }
    .tile:hover { border-color: #2dd4bf; }
    .tile.on { background: linear-gradient(145deg, #2dd4bf, #14b8a6); color: #fff; border-color: #0d9488; }
    .side { padding: 16px; background: #f0fdfa; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
    @media (min-width: 820px) { .side { border-top: none; border-left: 1px solid var(--line); } }
    .empty { color: var(--muted); font-weight: 600; margin: auto; line-height: 1.5; }
    .flash { width: 100%; max-width: 260px; min-height: 180px; perspective: 800px; cursor: pointer; }
    .flash-inner { width: 100%; height: 180px; position: relative; transform-style: preserve-3d; transition: transform .5s; }
    .flash.flipped .flash-inner { transform: rotateY(180deg); }
    .flash-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; border: 3px solid #5eead4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; }
    .flash-front { background: #fff; }
    .flash-back { background: #ccfbf1; transform: rotateY(180deg); }
    .word-big { font-size: 2.5rem; font-weight: 800; color: var(--deep); text-transform: lowercase; }
    .word-th { font-size: 1rem; font-weight: 700; color: var(--muted); }
    .sentence { font-size: 1rem; font-weight: 600; color: #334155; line-height: 1.4; }
    .actions { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
    .actions .btn { flex: 1; min-width: 100px; }
    .practice-only { display: none; padding: 24px; max-width: 480px; margin: 0 auto; width: 100%; flex-direction: column; gap: 14px; align-items: center; }
    .shell.mode-practice .grid-wrap, .shell.mode-practice .side { display: none; }
    .shell.mode-practice .practice-only { display: flex; }
    .pr-word { font-size: 3rem; font-weight: 800; color: var(--deep); text-transform: lowercase; }
    .choices { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .choice { font-family: inherit; font-weight: 800; font-size: 1.1rem; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; text-align: left; }
    .choice.ok { background: #dcfce7; border-color: #86efac; }
    .choice.no { background: #fee2e2; border-color: #fca5a5; }
    .fb { font-weight: 800; min-height: 24px; }
    .streak { font-size: .85rem; color: #0f766e; font-weight: 700; }
    .footer { padding: 10px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>👁️ Sight Words — คำอ่านจำ ป.4</h1>
      <span class="badge">ป.4 · ภาษาอังกฤษ</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกอ่าน</button>
      </span>
      <p class="hint">แตะคำ → พลิกการ์ด · กด 🔊 ฟังเสียง</p>
      <button type="button" class="btn btn-ghost" id="btnFs">⛶</button>
    </div>
    <div class="stage">
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
      <aside class="side" id="side">
        <p class="empty" id="empty">เลือกคำจากตาราง</p>
        <div id="cardBox" style="display:none;width:100%">
          <div class="flash" id="flash">
            <div class="flash-inner">
              <div class="flash-face flash-front"><span class="word-big" id="wFront"></span><span class="word-th">แตะเพื่อพลิก</span></div>
              <div class="flash-face flash-back"><span class="word-th" id="wTh"></span><span class="sentence" id="wSent"></span></div>
            </div>
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="btnSpeak">🔊 ฟัง</button>
            <button type="button" class="btn btn-ghost" id="btnFlip">🔄 พลิก</button>
          </div>
        </div>
      </aside>
    </div>
    <div class="practice-only">
      <p class="streak" id="streak">🔥 0 ติดต่อกัน</p>
      <p style="font-weight:700;color:#0f766e">อ่านคำนี้:</p>
      <p class="pr-word" id="prWord">because</p>
      <p style="font-weight:600">ความหมายใดถูกต้อง?</p>
      <div class="choices" id="prChoices"></div>
      <p class="fb" id="prFb"></p>
      <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
    </div>
    <footer>ตัวชี้วัด <strong>ต 1.1 ป.4/2</strong> · คู่เกม <a href="/play/reading-quest">Reading Quest</a></footer>
  </div>
  <script>
    if (window.KAMPAI) window.KAMPAI.setSlug('sight-words-p4');

    const WORDS = [
      { w: 'because', th: 'เพราะว่า', s: 'I study because I want to learn.' },
      { w: 'before', th: 'ก่อน', s: 'Wash your hands before eating.' },
      { w: 'between', th: 'ระหว่าง', s: 'The cat is between the boxes.' },
      { w: 'different', th: 'แตกต่าง', s: 'We have different hobbies.' },
      { w: 'important', th: 'สำคัญ', s: 'Reading is important.' },
      { w: 'something', th: 'บางสิ่ง', s: 'I want something to drink.' },
      { w: 'through', th: 'ผ่าน', s: 'We walk through the park.' },
      { w: 'thought', th: 'คิด', s: 'I thought about the answer.' },
      { w: 'enough', th: 'เพียงพอ', s: 'Is this enough water?' },
      { w: 'example', th: 'ตัวอย่าง', s: 'This is an example sentence.' },
      { w: 'family', th: 'ครอบครัว', s: 'My family is kind.' },
      { w: 'friend', th: 'เพื่อน', s: 'She is my best friend.' },
      { w: 'answer', th: 'คำตอบ', s: 'Please write your answer.' },
      { w: 'question', th: 'คำถาม', s: 'Do you have a question?' },
      { w: 'animal', th: 'สัตว์', s: 'The animal is sleeping.' },
      { w: 'beautiful', th: 'สวยงาม', s: 'The flower is beautiful.' },
      { w: 'children', th: 'เด็ก ๆ', s: 'The children are playing.' },
      { w: 'country', th: 'ประเทศ', s: 'Thailand is my country.' },
      { w: 'favorite', th: 'ที่ชอบที่สุด', s: 'Blue is my favorite color.' },
      { w: 'remember', th: 'จำ', s: 'Remember to do homework.' },
      { w: 'sometimes', th: 'บางครั้ง', s: 'Sometimes I read books.' },
      { w: 'together', th: 'ด้วยกัน', s: 'We work together.' },
      { w: 'weather', th: 'อากาศ', s: 'The weather is hot today.' },
      { w: 'yesterday', th: 'เมื่อวาน', s: 'I went to school yesterday.' },
    ];

    let current = null;
    let streak = 0;

    const grid = document.getElementById('grid');
    grid.innerHTML = WORDS.map((x, i) =>
      `<button type="button" class="tile" data-i="${i}">${x.w}</button>`
    ).join('');

    function selectWord(i) {
      current = WORDS[i];
      document.querySelectorAll('.tile').forEach((t, j) => t.classList.toggle('on', j === i));
      document.getElementById('empty').style.display = 'none';
      document.getElementById('cardBox').style.display = '';
      document.getElementById('wFront').textContent = current.w;
      document.getElementById('wTh').textContent = current.th;
      document.getElementById('wSent').textContent = current.s;
      document.getElementById('flash').classList.remove('flipped');
    }

    grid.querySelectorAll('.tile').forEach(btn => {
      btn.onclick = () => selectWord(+btn.dataset.i);
    });

    document.getElementById('flash').onclick = () => {
      document.getElementById('flash').classList.toggle('flipped');
    };
    document.getElementById('btnFlip').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('flash').classList.toggle('flipped');
    };

    function speak(text, lang) {
      if (window.KAMPAI?.sound?.speak) window.KAMPAI.sound.speak(text, lang);
      else if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang || 'en-US';
        speechSynthesis.speak(u);
      }
    }
    document.getElementById('btnSpeak').onclick = (e) => {
      e.stopPropagation();
      if (current) speak(current.w + '. ' + current.s, 'en-US');
    };

    function newPractice() {
      const item = WORDS[Math.floor(Math.random() * WORDS.length)];
      document.getElementById('prWord').textContent = item.w;
      const wrong = WORDS.filter(x => x.w !== item.w).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.th);
      const opts = [item.th, ...wrong].sort(() => Math.random() - 0.5);
      document.getElementById('prChoices').innerHTML = opts.map(o =>
        `<button type="button" class="choice" data-a="${o}">${o}</button>`
      ).join('');
      document.getElementById('prFb').textContent = '';
      document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
          const ok = btn.dataset.a === item.th;
          btn.classList.add(ok ? 'ok' : 'no');
          streak = ok ? streak + 1 : 0;
          document.getElementById('streak').textContent = `🔥 ${streak} ติดต่อกัน`;
          document.getElementById('prFb').textContent = ok ? '✓ ถูกต้อง!' : `✗ ความหมาย: ${item.th}`;
          document.getElementById('prFb').style.color = ok ? '#16a34a' : '#dc2626';
          speak(item.w, 'en-US');
          document.querySelectorAll('.choice').forEach(b => {
            b.disabled = true;
            if (b.dataset.a === item.th) b.classList.add('ok');
          });
        };
      });
    }
    document.getElementById('btnNext').onclick = newPractice;

    document.getElementById('modeSeg').querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        const pr = btn.dataset.mode === 'practice';
        document.getElementById('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
        document.getElementById('shell').classList.toggle('mode-practice', pr);
        if (pr) newPractice();
      };
    });

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };

    selectWord(0);
  </script>
</body>
</html>
