<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#689f38"/>
    </linearGradient>
    <linearGradient id="snakeHeadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="snakeBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="15" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  
  <!-- Minecraft Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="80" y="80" width="240" height="60" rx="5"/>
    <rect x="420" y="120" width="320" height="80" rx="5"/>
    <rect x="900" y="70" width="280" height="70" rx="5"/>
  </g>

  <!-- Ground / Hill (Voxel Styled) -->
  <path d="M-100 500 L1380 400 L1380 750 L-100 750 Z" fill="url(#grassGrad)"/>
  <path d="M-100 500 L1380 400 L1380 440 L-100 535 Z" fill="#5d4037" opacity="0.35"/> <!-- dirt side layer -->

  <!-- Minecraft Voxel Sun -->
  <rect x="1050" y="60" width="120" height="120" fill="#fff59d" filter="url(#dropShadow)"/>
  
  <!-- Spelling Block "S" (Hovering/Rotating Isometric style) -->
  <g transform="translate(300, 240)" filter="url(#dropShadow)">
    <!-- Top Face -->
    <polygon points="0,-60 100,-10 0,40 -100,-10" fill="#ffb74d"/>
    <!-- Left Face -->
    <polygon points="-100,-10 0,40 0,140 -100,90" fill="#f57c00"/>
    <!-- Right Face -->
    <polygon points="0,40 100,-10 100,90 0,140" fill="#e65100"/>
    <!-- Text "S" on Top Face -->
    <text x="0" y="-5" font-family="Courier New, monospace" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="skewY(20) scale(1, 0.8)">S</text>
  </g>

  <!-- Spelling Block "A" -->
  <g transform="translate(520, 180)" filter="url(#dropShadow)">
    <polygon points="0,-60 100,-10 0,40 -100,-10" fill="#ffb74d"/>
    <polygon points="-100,-10 0,40 0,140 -100,90" fill="#f57c00"/>
    <polygon points="0,40 100,-10 100,90 0,140" fill="#e65100"/>
    <text x="0" y="-5" font-family="Courier New, monospace" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="skewY(20) scale(1, 0.8)">A</text>
  </g>

  <!-- 3D Voxel Snake (Isometric style cubes) -->
  <!-- Tail segment 2 -->
  <g transform="translate(680, 520)" filter="url(#dropShadow)">
    <polygon points="0,-45 75,-8 0,30 -75,-8" fill="#9ccc65"/>
    <polygon points="-75,-8 0,30 0,105 -75,67" fill="#7cb342"/>
    <polygon points="0,30 75,-8 75,67 0,105" fill="#558b2f"/>
  </g>
  <!-- Tail segment 1 -->
  <g transform="translate(810, 460)" filter="url(#dropShadow)">
    <polygon points="0,-45 75,-8 0,30 -75,-8" fill="#9ccc65"/>
    <polygon points="-75,-8 0,30 0,105 -75,67" fill="#7cb342"/>
    <polygon points="0,30 75,-8 75,67 0,105" fill="#558b2f"/>
  </g>
  <!-- Snake Head (Bigger & Darker Green) -->
  <g transform="translate(940, 400)" filter="url(#dropShadow)">
    <!-- Top -->
    <polygon points="0,-54 90,-9 0,36 -90,-9" fill="#4caf50"/>
    <!-- Left -->
    <polygon points="-90,-9 0,36 0,126 -90,81" fill="#2e7d32"/>
    <!-- Right -->
    <polygon points="0,36 90,-9 90,81 0,126" fill="#1b5e20"/>
    
    <!-- White Eye Block Left -->
    <polygon points="-55,40 -40,47 -40,62 -55,55" fill="#ffffff"/>
    <polygon points="-48,46 -40,47 -40,54 -48,53" fill="#000000"/> <!-- pupil -->
    
    <!-- White Eye Block Right -->
    <polygon points="-25,52 -10,59 -10,74 -25,67" fill="#ffffff"/>
    <polygon points="-18,58 -10,59 -10,66 -18,65" fill="#000000"/> <!-- pupil -->
  </g>

  <!-- Foreground Trees (Minecraft style) -->
  <!-- Left Tree -->
  <g transform="translate(100, 360)">
    <rect x="-15" y="100" width="30" height="120" fill="#795548"/>
    <rect x="-70" y="-20" width="140" height="120" fill="#2e7d32" rx="10"/>
    <rect x="-50" y="-60" width="100" height="80" fill="#388e3c" rx="8"/>
  </g>
  <!-- Right Tree -->
  <g transform="translate(1180, 260)">
    <rect x="-12" y="80" width="24" height="150" fill="#795548"/>
    <rect x="-60" y="-10" width="120" height="100" fill="#2e7d32" rx="10"/>
    <rect x="-40" y="-40" width="80" height="70" fill="#388e3c" rx="8"/>
  </g>

  <!-- Big Title (Spelling Snake 3D) -->
  <g transform="translate(640, 630)" filter="url(#dropShadow)">
    <text x="0" y="-40" font-family="'Kanit', sans-serif" font-weight="900" font-size="64" fill="#ffffff" stroke="#1b5e20" stroke-width="6" text-anchor="middle" letter-spacing="2">งูกินคำศัพท์ 3 มิติ</text>
    <text x="0" y="25" font-family="'Kanit', sans-serif" font-weight="700" font-size="34" fill="#ffd54f" stroke="#e65100" stroke-width="3" text-anchor="middle" letter-spacing="4">SPELLING SNAKE 3D</text>
  </g>
</svg>
