<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#16306b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>

  <!-- faint watermark letters -->
  <text x="200" y="640" font-size="520" font-weight="800" fill="#ffffff" opacity="0.05" text-anchor="middle" dominant-baseline="middle">A</text>
  <text x="1090" y="150" font-size="300" font-weight="800" fill="#ffffff" opacity="0.05" text-anchor="middle" dominant-baseline="middle">Z</text>

  <!-- sound waves (left) + apple hint -->
  <g transform="translate(170,300)" filter="url(#sh)">
    <text x="0" y="0" font-size="120" text-anchor="middle" dominant-baseline="middle">🔊</text>
    <path d="M70 -40 q40 40 0 80" stroke="#fcd34d" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M96 -64 q66 64 0 128" stroke="#fcd34d" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g transform="translate(1095,300)" filter="url(#sh)"><text x="0" y="0" font-size="120" text-anchor="middle" dominant-baseline="middle">🍎</text></g>

  <!-- top pill -->
  <g transform="translate(640,112)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ภาษาอังกฤษ ป.4-6</text>
  </g>

  <!-- title -->
  <text x="640" y="278" font-size="118" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">ฟังแล้วสะกด</text>
  <text x="640" y="366" font-size="40" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">Listen &amp; Spell · ฟังเสียง → เรียงตัวอักษร</text>

  <!-- example: spelling slots A P P L E -->
  <g transform="translate(640,520)" font-family="'Fredoka One','Kanit',sans-serif" font-weight="800" font-size="56" filter="url(#sh)">
    <g text-anchor="middle" dominant-baseline="middle">
      <rect x="-260" y="-50" width="100" height="100" rx="20" fill="url(#gold)"/><text x="-210" y="6" fill="#0f172a">A</text>
      <rect x="-150" y="-50" width="100" height="100" rx="20" fill="#f8fafc"/><text x="-100" y="6" fill="#1e293b">P</text>
      <rect x="-40" y="-50" width="100" height="100" rx="20" fill="#f8fafc"/><text x="10" y="6" fill="#1e293b">P</text>
      <rect x="70" y="-50" width="100" height="100" rx="20" fill="url(#gold)"/><text x="120" y="6" fill="#0f172a">L</text>
      <rect x="180" y="-50" width="100" height="100" rx="20" fill="#f8fafc"/><text x="230" y="6" fill="#1e293b">E</text>
    </g>
  </g>

  <!-- bottom ribbon -->
  <g transform="translate(640,642)">
    <rect x="-220" y="-24" width="440" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="25" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">🔊 ฝึกฟัง + สะกดคำ · แข่งเวลา · ฝึก</text>
  </g>
</svg>
