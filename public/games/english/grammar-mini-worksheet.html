<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/english/grammar-mini.html"><meta name="curriculum-indicators" content="ต 2.1 ป.4/1"><title>ใบงาน Grammar Mini ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.12" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.12" rel="stylesheet">
<style>
.sound-row{display:flex;gap:1.5mm;align-items:center;margin:1mm 0;flex-wrap:wrap;font-size:8pt;font-weight:700}
.evidence-line{min-height:6mm;border-bottom:1px dotted var(--ws-muted);font-size:8pt;font-weight:700;margin:.8mm 0;display:flex;align-items:flex-end;gap:1mm}
.evidence-line .lbl{color:var(--ws-accent);font-weight:800;flex:0 0 auto}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}

</style>
</head><body>
<header class="toolbar"><h1>📝 ใบงาน Grammar Mini</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="isare">is / are</option><option value="aan">a / an</option><option value="demonstrative">this/that/these/those</option><option value="apply">ใช้ในประโยค</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.12"></script><script>
const GRAMMAR_ITEMS=[
{type:'isare',prompt:'เติม is หรือ are: They ___ happy.',context:'They = พหูพจน์',choices:['is','are'],answer:'are',evidence:'They = more than one → are',s1:'They = พหู',s2:'ใช้ are',s3:'They are happy.'},
{type:'isare',prompt:'She ___ a teacher.',context:'She = เอกพจน์',choices:['is','are'],answer:'is',evidence:'She = one person → is',s1:'She = เอก',s2:'ใช้ is',s3:'She is a teacher.'},
{type:'isare',prompt:'The books ___ on the desk.',context:'books = พหูพจน์',choices:['is','are'],answer:'are',evidence:'books ends with s → plural',s1:'books = พหู',s2:'ใช้ are',s3:'The books are on the desk.'},
{type:'isare',prompt:'My cat ___ cute.',context:'cat = เอกพจน์',choices:['is','are'],answer:'is',evidence:'My cat = one → is',s1:'cat = เอก',s2:'ใช้ is',s3:'My cat is cute.'},
{type:'aan',prompt:'___ apple',context:'apple',choices:['a','an'],answer:'an',sound:'a',evidence:'apple starts with vowel sound /æ/',s1:'เสียงต้น = สระ',s2:'ใช้ an',s3:'an apple'},
{type:'aan',prompt:'___ book',context:'book',choices:['a','an'],answer:'a',sound:'b',evidence:'book starts with /b/',s1:'เสียงต้น = พยัญชนะ',s2:'ใช้ a',s3:'a book'},
{type:'aan',prompt:'___ umbrella',context:'umbrella',choices:['a','an'],answer:'an',sound:'u',evidence:'umbrella /ʌ/ = vowel sound',s1:'เสียงสระ /ʌ/',s2:'ใช้ an',s3:'an umbrella'},
{type:'aan',prompt:'___ dog',context:'dog',choices:['a','an'],answer:'a',sound:'d',evidence:'dog /d/ = consonant',s1:'พยัญชนะ',s2:'ใช้ a',s3:'a dog'},
{type:'demonstrative',prompt:'___ (ใกล้ เอก) pen on my desk',context:'ปากกาบนโต๊ะ — ใกล้มือ',choices:['This','That','These','Those'],answer:'This',evidence:'near + singular pen',s1:'ใกล้ + เอก',s2:'This',s3:'This pen on my desk.'},
{type:'demonstrative',prompt:'___ (ไกล เอก) tree over there',context:'ต้นไม้ไกล ๆ',choices:['This','That','These','Those'],answer:'That',evidence:'far + singular',s1:'ไกล + เอก',s2:'That',s3:'That tree over there.'},
{type:'demonstrative',prompt:'___ (ใกล้ พหู) books are mine',context:'หนังสือหลายเล่มใกล้มือ',choices:['This','That','These','Those'],answer:'These',evidence:'near + plural books',s1:'ใกล้ + พหู',s2:'These',s3:'These books are mine.'},
{type:'demonstrative',prompt:'___ (ไกล พหู) shoes are dirty',context:'รองเท้าหลายคู่ไกล ๆ',choices:['This','That','These','Those'],answer:'Those',evidence:'far + plural shoes',s1:'ไกล + พหู',s2:'Those',s3:'Those shoes are dirty.'},
{type:'apply',prompt:'แก้ประโยค: "He are my friend."',context:'He are my friend.',choices:['He is my friend.','He are my friends.'],answer:'He is my friend.',evidence:'He = singular → is',s1:'He = เอก',s2:'is',s3:'He is my friend.'},
{type:'apply',prompt:'เลือกถูก: ___ hour ago',context:'hour',choices:['a hour','an hour'],answer:'an hour',sound:'h',evidence:'hour starts with vowel sound /aʊ/',s1:'เสียงสระ',s2:'an',s3:'an hour ago'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'grammar-mini',icon:'📝',title:'ใบงาน Grammar Mini',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–6',mediaLabel:'Grammar Mini',
  sourceMediaUrl:'/games/english/grammar-mini.html',indicators:['ต 2.1 ป.4/1'],
  directions:'ดูเอก/พหู หรือเสียงต้นคำ → เลือก is/are · a/an · this/that → เขียนประโยค',
  getItems(t){return t==='mixed'?GRAMMAR_ITEMS:GRAMMAR_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const sound=item.sound?'<div class="sound-row"><span>First sound:</span><span class="sound-box">'+e(item.sound)+'</span></div>':'';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="q-context">'+e(item.context)+'</div>'
      +sound
      +'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>'
      +'<div class="evidence-line"><span class="lbl">Evidence</span><span class="work-fill">'+e(item.evidence)+'</span></div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 Clue</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 Choose</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 Sentence</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.12"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.12"></script></body></html>
