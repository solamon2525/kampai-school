<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Follow Instructions Lab cover</title>
  <desc id="desc">Lab-themed cover with colored shapes for following English instructions in order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="160" cy="560" r="70" fill="#ef4444"/>
  <rect x="320" y="500" width="130" height="130" rx="18" fill="#3b82f6"/>
  <polygon points="620,490 710,630 530,630" fill="#22c55e"/>
  <circle cx="820" cy="560" r="70" fill="#eab308"/>
  <rect x="980" y="500" width="130" height="130" rx="18" fill="#ef4444"/>
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="820" height="160" rx="34" fill="#ffffff" opacity="0.95"/>
    <text x="114" y="150" font-family="Arial, sans-serif" font-size="58" font-weight="900" fill="#4c1d95">Follow Instructions Lab</text>
    <text x="118" y="200" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7c3aed">Touch shapes in the right order</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="280" width="420" height="140" rx="28" fill="url(#gold)"/>
    <text x="970" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#7c2d12">Touch the red circle</text>
    <text x="970" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#7c2d12">then the blue square</text>
  </g>
  <g opacity="0.25" fill="#ffffff">
    <circle cx="1100" cy="120" r="40"/>
    <circle cx="1180" cy="180" r="24"/>
    <circle cx="1040" cy="200" r="18"/>
  </g>
</svg>
