<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Kanit, Sarabun, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect y="480" width="1280" height="240" fill="url(#ground)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="320" width="90" height="160" fill="#78350f"/>
    <rect x="190" y="260" width="70" height="220" fill="#92400e"/>
    <rect x="1020" y="300" width="100" height="180" fill="#78350f"/>
    <rect x="1140" y="340" width="80" height="140" fill="#a16207"/>
    <rect x="280" y="380" width="50" height="100" fill="#16a34a"/>
    <rect x="265" y="340" width="80" height="50" fill="#22c55e"/>
    <rect x="950" y="370" width="50" height="110" fill="#16a34a"/>
    <rect x="935" y="330" width="80" height="50" fill="#22c55e"/>
  </g>

  <g filter="url(#shadow)" transform="translate(520,300)">
    <rect x="30" y="80" width="16" height="40" fill="#1e3a5f" rx="2"/>
    <rect x="54" y="80" width="16" height="40" fill="#1e3a5f" rx="2"/>
    <rect x="24" y="30" width="52" height="55" fill="#3b82f6" rx="4"/>
    <rect x="32" y="0" width="36" height="36" fill="#fbbf24" rx="4"/>
    <rect x="8" y="32" width="14" height="36" fill="#fbbf24" rx="2"/>
    <rect x="78" y="32" width="14" height="36" fill="#fbbf24" rx="2"/>
  </g>

  <g filter="url(#shadow)" transform="translate(700,250) rotate(15 40 40)">
    <rect width="80" height="80" fill="#fbbf24" rx="6"/>
    <text x="40" y="52" text-anchor="middle" font-size="36" font-weight="800" fill="#92400e">?</text>
  </g>

  <g filter="url(#shadow)" transform="translate(380,220) rotate(-12 30 30)">
    <rect width="60" height="60" fill="#f97316" rx="5"/>
    <text x="30" y="42" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">+</text>
  </g>

  <g filter="url(#shadow)" transform="translate(320,200)">
    <rect width="50" height="50" fill="#3b82f6" rx="5"/>
    <polygon points="25,12 28,20 37,20 30,25 33,34 25,29 17,34 20,25 13,20 22,20" fill="#fff"/>
  </g>

  <g filter="url(#shadow)" transform="translate(900,220)">
    <rect width="50" height="50" fill="#a855f7" rx="5"/>
    <text x="25" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">F</text>
  </g>

  <g filter="url(#shadow)" transform="translate(860,340)">
    <rect x="10" y="20" width="60" height="70" fill="#1f2937" rx="4"/>
    <rect x="22" y="8" width="10" height="10" fill="#ef4444"/>
    <rect x="48" y="8" width="10" height="10" fill="#ef4444"/>
  </g>

  <polygon points="200,180 205,195 220,195 208,204 213,220 200,211 187,220 192,204 180,195 195,195" fill="#fbbf24" filter="url(#shadow)"/>
  <polygon points="1080,200 1084,212 1096,212 1087,219 1091,232 1080,225 1069,232 1073,219 1064,212 1076,212" fill="#fbbf24" filter="url(#shadow)"/>

  <rect x="56" y="48" width="340" height="52" rx="26" fill="#0f172a" opacity="0.55"/>
  <text x="84" y="84" font-size="26" font-weight="700" fill="#ffedd5">English P.4-6</text>

  <text x="640" y="580" text-anchor="middle" font-size="64" font-weight="800" fill="url(#title)" filter="url(#shadow)">Voxel Quiz Adventure</text>
  <text x="640" y="630" text-anchor="middle" font-size="26" font-weight="600" fill="#fff7ed" opacity="0.9">3D English Quiz World</text>
</svg>
