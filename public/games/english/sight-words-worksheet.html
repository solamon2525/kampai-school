<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/english/sight-words-p4.html"><meta name="curriculum-indicators" content="ต 1.1 ป.4/2"><title>ใบงาน Sight Words ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.13" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.13" rel="stylesheet">
<style>
.word-bank{display:flex;flex-wrap:wrap;gap:1.5mm;margin:1mm 0;justify-content:center}
.word-bank span{border:1.4px solid var(--ws-accent);border-radius:4px;padding:.6mm 2mm;font-size:9pt;font-weight:800;color:var(--ws-accent);background:var(--ws-soft)}
.write-line{min-height:8mm;border-bottom:1.4px solid var(--ws-ink);margin:1mm 0}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-5 .write-line{min-height:10mm}
</style>
</head><body>
<header class="toolbar"><h1>👁️ ใบงาน Sight Words</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="meaning">ความหมายคำ</option><option value="sentence">ใช้ในประโยค</option><option value="compare">เปรียบเทียบคำ</option><option value="read">อ่านจำ</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.13"></script><script>
const BANK=['because','before','between','important'];
const SIGHT_ITEMS=[
{type:'meaning',prompt:'because หมายความว่าอะไร',context:'because',choices:['เพราะว่า','ก่อน','ระหว่าง'],answer:'เพราะว่า',s1:'because = ให้เหตุผล',s2:'เชื่อมเหตุ–ผล',s3:'I stayed home because it rained.'},
{type:'meaning',prompt:'before หมายความว่าอะไร',context:'before',choices:['ก่อน','หลัง','เพราะ'],answer:'ก่อน',s1:'before = ก่อนเวลา',s2:'ตรงข้าม after',s3:'Wash hands before eating.'},
{type:'meaning',prompt:'between หมายความว่าอะไร',context:'between',choices:['ระหว่าง','ข้างใน','ข้างนอก'],answer:'ระหว่าง',s1:'between = กลางสองสิ่ง',s2:'between A and B',s3:'The ball is between the chairs.'},
{type:'meaning',prompt:'important หมายความว่าอะไร',context:'important',choices:['สำคัญ','ง่าย','เร็ว'],answer:'สำคัญ',s1:'important = สำคัญ',s2:'Health is important.',s3:'ไม่ใช่ easy/fast'},
{type:'sentence',prompt:'เติมคำ: I was tired ___ I went to bed early.',context:'because / before / between',choices:['because','before','between'],answer:'because',s1:'ต้องการเหตุผล',s2:'because',s3:'I was tired because …'},
{type:'sentence',prompt:'เติม: ___ dinner, wash your hands.',context:'before / because / important',choices:['Before','Because','Important'],answer:'Before',s1:'ล้างมือก่อนกิน',s2:'Before',s3:'Before dinner, wash your hands.'},
{type:'sentence',prompt:'เติม: Reading is ___ for learning.',context:'important / between / before',choices:['important','between','before'],answer:'important',s1:'การอ่านสำคัญ',s2:'important',s3:'Reading is important for learning.'},
{type:'compare',prompt:'แยกความต่าง before กับ because',context:'before · because',choices:['before=เวลา · because=เหตุผล','ความหมายเหมือนกัน'],answer:'before บอกเวลา · because บอกเหตุผล',s1:'before = ก่อน',s2:'because = เพราะ',s3:'คนละหน้าที่'},
{type:'compare',prompt:'between ใช้กับกี่สิ่ง',context:'between',choices:['สองสิ่ง','สามสิ่งขึ้นไป','สิ่งเดียว'],answer:'สองสิ่ง (between A and B)',s1:'กลางสอง',s2:'among = หลาย',s3:'between A and B'},
{type:'read',prompt:'อ่านและแปล: "This is important."',context:'This is important.',choices:['นี่สำคัญ','นี่ก่อน','นี่เพราะ'],answer:'นี่สำคัญ / สิ่งนี้สำคัญ',s1:'This = นี่',s2:'important = สำคัญ',s3:'This is important.'},
{type:'read',prompt:'อ่าน: "Sit between Tom and Ann."',context:'Sit between Tom and Ann.',choices:['นั่งระหว่าง Tom กับ Ann','นั่งก่อน Tom'],answer:'นั่งระหว่าง Tom กับ Ann',s1:'Sit = นั่ง',s2:'between Tom and Ann',s3:'นั่งกลางสองคน'},
{type:'sentence',prompt:'สร้างประโยคใช้ because อย่างน้อย 1 คำ',context:'because',choices:['เช่น I like math because it is fun.','เช่น Because I run.'],answer:'เช่น I like math because it is fun.',s1:'because + เหตุผล',s2:'ประโยคสมบูรณ์',s3:'ประธาน+กริยา+because'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'sight-words',icon:'👁️',title:'ใบงาน Sight Words',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–6',mediaLabel:'Sight Words ป.4',
  sourceMediaUrl:'/games/english/sight-words-p4.html',indicators:['ต 1.1 ป.4/2'],
  directions:'ใช้ word-bank · เลือกความหมาย · เขียนประโยคด้วยคำเป้า',
  getItems(t){return t==='mixed'?SIGHT_ITEMS:SIGHT_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="word-bank">'+BANK.map(w=>'<span>'+e(w)+'</span>').join('')+'</div>'
      +'<div class="q-context">'+e(item.context)+'</div>'
      +'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>'
      +'<div class="write-line" aria-label="write a sentence"></div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 Word</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 Meaning</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 Sentence</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.13"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.13"></script></body></html>
