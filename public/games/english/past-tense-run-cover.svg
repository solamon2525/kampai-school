<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Past Tense Run cover</title>
  <desc id="desc">English past tense race cover with was/were and -ed verbs on a running track.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="1040" cy="120" rx="90" ry="90" fill="#fde68a" opacity="0.9"/>
  <path d="M0 480 Q320 420 640 480 T1280 480 L1280 720 L0 720 Z" fill="#1e3a8a"/>
  <path d="M0 520 Q320 470 640 520 T1280 520" fill="none" stroke="#fbbf24" stroke-width="10" stroke-dasharray="40 28"/>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" font-weight="900">
    <rect x="90" y="88" width="700" height="150" rx="32" fill="#ffffff" opacity="0.95"/>
    <text x="124" y="168" font-size="68" fill="#1e3a8a">Past Tense Run</text>
    <text x="128" y="214" font-size="30" fill="#f59e0b">was / were · -ed · went saw ate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="860" y="160" width="300" height="100" rx="24" fill="url(#gold)"/>
    <text x="1010" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#7c2d12">She ___ happy</text>
  </g>
  <g filter="url(#shadow)" transform="translate(220 470)">
    <ellipse cx="70" cy="120" rx="70" ry="22" fill="#0f172a" opacity="0.25"/>
    <circle cx="70" cy="58" r="34" fill="#f97316"/>
    <circle cx="58" cy="52" r="5" fill="#111827"/>
    <circle cx="82" cy="52" r="5" fill="#111827"/>
    <path d="M55 70c10 8 20 8 30 0" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <rect x="52" y="92" width="36" height="50" rx="12" fill="#fb923c"/>
    <rect x="40" y="138" width="22" height="36" rx="10" fill="#1f2937"/>
    <rect x="78" y="138" width="22" height="36" rx="10" fill="#1f2937"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="800" fill="#ffffff" opacity="0.85">
    <text x="520" y="560" font-size="42">was</text>
    <text x="700" y="560" font-size="42">went</text>
    <text x="900" y="560" font-size="42">played</text>
  </g>
</svg>
