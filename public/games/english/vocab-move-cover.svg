<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Fredoka One','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="0.55" stop-color="#15233f"/><stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#facc15"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.26"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="290" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="600" font-size="200" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🅰️</text>
  <text x="1130" y="180" font-size="170" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🕺</text>

  <!-- badge -->
  <g transform="translate(640,104)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="25" font-weight="600" fill="#e0f2fe" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">⚡ KAMPAI · ภาษาอังกฤษ ป.4–6 · AR กล้อง</text>
  </g>
  <!-- title -->
  <text x="640" y="248" font-size="116" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">เดินตอบศัพท์</text>
  <text x="640" y="322" font-size="32" font-weight="700" fill="#bae6fd" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">เดินซ้าย–ขวา เลือกคำแปลที่ถูก · ฟังเสียงคำศัพท์</text>

  <!-- floating English word card -->
  <g transform="translate(640,432)" filter="url(#sh)">
    <rect x="-150" y="-44" width="300" height="88" rx="20" fill="#0a0f1e" stroke="#facc15" stroke-width="4"/>
    <text x="0" y="2" font-size="56" font-weight="800" fill="#facc15" text-anchor="middle" dominant-baseline="middle">apple</text>
  </g>

  <!-- LEFT answer zone (correct, purple) -->
  <g transform="translate(250,556)">
    <rect x="-150" y="-50" width="300" height="100" rx="24" fill="#a855f7" fill-opacity="0.28" stroke="#a855f7" stroke-width="5"/>
    <text x="0" y="-2" font-size="40" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">แอปเปิ้ล</text>
    <text x="0" y="34" font-size="18" fill="#e9d5ff" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">← เดินมาซ้าย</text>
  </g>
  <!-- RIGHT answer zone (cyan) -->
  <g transform="translate(1030,556)">
    <rect x="-150" y="-50" width="300" height="100" rx="24" fill="#06b6d4" fill-opacity="0.24" stroke="#06b6d4" stroke-width="5"/>
    <text x="0" y="-2" font-size="40" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">กล้วย</text>
    <text x="0" y="34" font-size="18" fill="#cffafe" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">เดินมาขวา →</text>
  </g>

  <!-- chibi student walking toward the correct (left) zone -->
  <g transform="translate(620,560)" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- motion swoosh -->
    <path d="M 70 -40 q -34 8 -64 4" stroke="#facc15" stroke-width="6" fill="none" opacity="0.7"/>
    <path d="M 78 -14 q -38 8 -70 2" stroke="#facc15" stroke-width="6" fill="none" opacity="0.45"/>
    <!-- legs (mid-stride) -->
    <path d="M -6 22 L -22 64" fill="none" stroke-width="13"/>
    <path d="M 8 22 L 26 60" fill="none" stroke-width="13"/>
    <!-- navy shorts -->
    <rect x="-20" y="0" width="40" height="30" rx="8" fill="#1e3a5f"/>
    <!-- white school shirt -->
    <path d="M -24 -34 q 24 -12 48 0 l 4 36 q -28 12 -56 0 z" fill="#f8fafc"/>
    <!-- arms swinging -->
    <path d="M -22 -22 L -44 -6" fill="none" stroke-width="11"/>
    <path d="M 22 -22 L 40 -34" fill="none" stroke-width="11"/>
    <!-- head -->
    <circle cx="0" cy="-58" r="30" fill="#fcd9b6"/>
    <path d="M -30 -64 q 30 -34 60 0 q -8 -14 -30 -14 q -22 0 -30 14 z" fill="#3b2a1d"/>
    <!-- smile + eyes -->
    <circle cx="-10" cy="-58" r="3.4" fill="#0f172a" stroke="none"/>
    <circle cx="12" cy="-58" r="3.4" fill="#0f172a" stroke="none"/>
    <path d="M -9 -46 q 9 9 20 0" fill="none" stroke-width="3"/>
  </g>

  <!-- footer -->
  <g transform="translate(640,682)">
    <rect x="-260" y="-24" width="520" height="48" rx="24" fill="#facc15" opacity="0.16"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">ขยับร่างกายจริง (MediaPipe) · 10 คำศัพท์ · แตะตอบได้</text>
  </g>
</svg>
