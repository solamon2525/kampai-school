<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Compass & Map Aura -->
  <g fill="none" stroke="rgba(251, 191, 36, 0.08)" stroke-width="2">
    <circle cx="640" cy="360" r="300" />
    <circle cx="640" cy="360" r="200" />
    <line x1="640" y1="60" x2="640" y2="660" />
    <line x1="340" y1="360" x2="940" y2="360" />
  </g>

  <!-- Explorer Fox Vector (Bottom-Left) -->
  <g transform="translate(250, 480)">
    <!-- Body -->
    <path d="M -40,120 L 40,120 L 20,40 L -20,40 Z" fill="#ea580c" />
    <!-- Collar -->
    <polygon points="-15,40 0,55 15,40" fill="#fff" />
    <polygon points="-25,40 0,60 25,40" fill="#2563eb" /> <!-- Blue scarf -->
    <!-- Head -->
    <path d="M -60,-10 C -60,40 60,40 60,-10 C 60,-40 30,-50 0,-50 C -30,-50 -60,-40 -60,-10 Z" fill="#ea580c" />
    <!-- Cheeks (White parts) -->
    <path d="M -55,-10 C -55,20 -20,30 -10,10 C -10,-10 -30,-20 -55,-10 Z" fill="#fff" />
    <path d="M 55,-10 C 55,20 20,30 10,10 C 10,-10 30,-20 55,-10 Z" fill="#fff" />
    <!-- Snout -->
    <polygon points="-15,5 15,5 0,25" fill="#fff" />
    <circle cx="0" cy="22" r="7" fill="#000" />
    <!-- Eyes -->
    <ellipse cx="-25" cy="-10" rx="8" ry="12" fill="#000" />
    <ellipse cx="25" cy="-10" rx="8" ry="12" fill="#000" />
    <circle cx="-22" cy="-13" r="3" fill="#fff" />
    <circle cx="28" cy="-13" r="3" fill="#fff" />
    <!-- Ears -->
    <polygon points="-55,-35 -80,-90 -25,-50" fill="#ea580c" />
    <polygon points="-50,-40 -70,-80 -30,-50" fill="#ffedd5" />
    <polygon points="55,-35 80,-90 25,-50" fill="#ea580c" />
    <polygon points="50,-40 70,-80 30,-50" fill="#ffedd5" />
    <!-- Pith Helmet (Explorer Hat) -->
    <path d="M -70,-45 C -45,-85 45,-85 70,-45 Z" fill="#fef08a" stroke="#d97706" stroke-width="2" />
    <ellipse cx="0" cy="-42" rx="72" ry="10" fill="#fef08a" stroke="#d97706" stroke-width="2" />
    <path d="M -20,-75 Q 0,-85 20,-75" fill="none" stroke="#d97706" stroke-width="3" />
  </g>

  <!-- Letters Floating in Space -->
  <g font-family="sans-serif" font-weight="900" font-size="48" fill="rgba(255,255,255,0.15)">
    <text x="120" y="200" transform="rotate(-15, 120, 200)">A</text>
    <text x="1050" y="180" transform="rotate(20, 1050, 180)">Q</text>
    <text x="960" y="520" transform="rotate(-10, 960, 520)">Z</text>
    <text x="450" y="130" transform="rotate(5, 450, 130)">E</text>
  </g>

  <!-- Glowing Map & Treasure Chest Graphic (Right) -->
  <g transform="translate(1000, 420)" filter="url(#glow)">
    <rect x="-100" y="-20" width="200" height="140" fill="#d97706" rx="10" stroke="#78350f" stroke-width="4" />
    <path d="M -100,-20 C -100,-60 100,-60 100,-20 Z" fill="#b45309" stroke="#78350f" stroke-width="4" />
    <!-- Glowing Gems inside -->
    <rect x="-40" y="-30" width="80" height="10" fill="#fbbf24" />
    <circle cx="-15" cy="-25" r="8" fill="#38bdf8" />
    <circle cx="15" cy="-25" r="8" fill="#4ade80" />
    <circle cx="0" cy="-22" r="6" fill="#f43f5e" />
  </g>

  <!-- Title & Branding -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="640" y="320" font-family="sans-serif" font-weight="900" font-size="82" fill="#fbbf24" stroke="#000" stroke-width="2">ENGLISH QUEST</text>
    <text x="640" y="390" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" letter-spacing="4">ผจญภัยศัพท์อังกฤษแสนสนุก</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="660" font-family="sans-serif" font-weight="bold" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="1">เรียนรู้คำศัพท์ ค้นหากล่องสมบัติ และพิชิตด่านภาษาอังกฤษ</text>
</svg>
