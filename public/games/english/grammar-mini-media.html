<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grammar Mini — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #4338ca; --line: #c7d2fe; --muted: #64748b;
      --ok: #16a34a; --bad: #dc2626;
    }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(145deg, #e0e7ff 0%, #eef2ff 40%, #c7d2fe 100%);
      min-height: 100%; color: #0f172a; padding: 12px;
    }
    .shell {
      max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden;
      display: flex; flex-direction: column; min-height: calc(100vh - 24px);
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
      background: linear-gradient(90deg, #4338ca, #4f46e5 50%, #6366f1); color: #fff;
    }
    header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 160px; }
    header .badge {
      font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px;
      border-radius: 999px; font-weight: 700;
    }
    .btn {
      font-family: inherit; font-weight: 700; border: none; border-radius: 12px;
      padding: 10px 14px; cursor: pointer; font-size: .95rem; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { transform: scale(.97); }
    .btn-back {
      background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
      padding: 8px 12px; font-size: .85rem;
    }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .btn-ok { background: var(--ok); color: #fff; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #eef2ff;
      border-bottom: 1px solid var(--line); align-items: center;
    }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #a5b4fc; }
    .seg button {
      font-family: inherit; font-weight: 800; border: none; background: #fff;
      color: var(--deep); padding: 8px 14px; cursor: pointer; font-size: .9rem;
    }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #4338ca; font-weight: 600; flex: 1; min-width: 160px; }
    .stage { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
    @media (min-width: 860px) { .stage { grid-template-columns: 1.1fr .9fr; } }
    .main-panel { padding: 14px; overflow: auto; }
    .topic-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .topic-tab {
      font-family: inherit; font-weight: 800; border: 2px solid #a5b4fc; background: #fff;
      border-radius: 14px; padding: 10px 14px; cursor: pointer; font-size: .95rem;
    }
    .topic-tab.on { background: var(--deep); color: #fff; border-color: #312e81; }
    .rule-card {
      background: #eef2ff; border: 2px dashed #a5b4fc; border-radius: 14px;
      padding: 14px; margin-bottom: 12px; line-height: 1.55; font-weight: 600;
    }
    .rule-card h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--deep); }
    .examples { display: flex; flex-direction: column; gap: 8px; }
    .ex-row {
      background: #fff; border: 2px solid #e0e7ff; border-radius: 12px; padding: 12px 14px;
      font-weight: 700; font-size: 1.05rem; cursor: pointer; text-align: left;
    }
    .ex-row:hover { background: #eef2ff; }
    .ex-row .th { font-size: .8rem; color: var(--muted); font-weight: 600; margin-top: 4px; }
    .ex-row mark { background: #fde68a; padding: 0 4px; border-radius: 4px; }
    .detail {
      background: #eef2ff; border-top: 1px solid var(--line); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 860px) { .detail { border-top: none; border-left: 1px solid var(--line); } }
    .detail-empty { color: var(--muted); font-weight: 600; text-align: center; margin: auto 0; line-height: 1.5; }
    .detail-card { display: none; flex-direction: column; gap: 10px; }
    .detail-card.show { display: flex; }
    .sentence { font-size: 1.5rem; font-weight: 800; color: var(--deep); line-height: 1.4; }
    .tip { font-size: .95rem; font-weight: 600; color: #4338ca; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .actions .btn { flex: 1; min-width: 110px; }
    .practice-wrap { display: none; padding: 20px; max-width: 520px; margin: 0 auto; width: 100%; }
    .shell.mode-practice .practice-wrap { display: block; }
    .shell.mode-practice .stage { display: none; }
    .practice-card { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
    .practice-topic { font-size: .85rem; font-weight: 800; color: #4338ca; text-align: center; }
    .practice-sentence {
      font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 800; color: var(--deep);
      background: #fff; border: 2px dashed #a5b4fc; border-radius: 14px; padding: 16px; text-align: center;
    }
    .practice-sentence .blank { color: #ea580c; text-decoration: underline wavy #f97316; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .choice-btn {
      font-family: inherit; font-weight: 800; font-size: 1.15rem; border: 2px solid #c7d2fe;
      background: #fff; border-radius: 14px; padding: 14px; cursor: pointer; color: var(--deep);
    }
    .choice-btn:hover { background: #eef2ff; }
    .choice-btn.correct { background: #dcfce7; border-color: #86efac; color: var(--ok); }
    .choice-btn.wrong { background: #fee2e2; border-color: #fca5a5; color: var(--bad); }
    .choice-btn:disabled { cursor: default; }
    .practice-fb { min-height: 28px; font-weight: 800; text-align: center; }
    .practice-fb.ok { color: var(--ok); }
    .practice-fb.no { color: var(--bad); }
    .streak { font-size: .85rem; font-weight: 700; color: #4338ca; text-align: center; }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
      padding: 10px 16px; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line);
    }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>📝 Grammar Mini — is/are · a/an · this/that</h1>
      <span class="badge">ป.3–4 · ภาษาอังกฤษ</span>
    </header>

    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึก</button>
      </span>
      <p class="hint" id="hintText">เลือกหัวข้อ → อ่านกฎและตัวอย่าง</p>
      <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    </div>

    <div class="stage">
      <div class="main-panel">
        <div class="topic-tabs" id="topicTabs"></div>
        <div class="rule-card" id="ruleCard"></div>
        <div class="examples" id="examples"></div>
      </div>
      <aside class="detail">
        <div class="detail-empty" id="detailEmpty">แตะตัวอย่างทางซ้าย<br>เพื่อฟังและดูคำอธิบาย</div>
        <div class="detail-card" id="detailCard">
          <div class="sentence" id="detailSentence"></div>
          <p class="tip" id="detailTip"></p>
          <div class="actions">
            <button type="button" class="btn btn-accent" id="btnSpeak">🔊 Listen</button>
          </div>
        </div>
      </aside>
    </div>

    <div class="practice-wrap">
      <div class="practice-card">
        <p class="streak" id="streakLabel">Correct streak: 0</p>
        <p class="practice-topic" id="practiceTopic"></p>
        <div class="practice-sentence" id="practiceSentence"></div>
        <div class="choices" id="practiceChoices"></div>
        <div class="practice-fb" id="practiceFb"></div>
        <div class="actions">
          <button type="button" class="btn btn-accent" id="btnPracticeSpeak">🔊 Listen</button>
          <button type="button" class="btn btn-ok" id="btnPracticeNext">Next →</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>🏫 โรงเรียนบ้านคำไผ่ · สื่อการสอน</span>
      <a href="/play/vocab-hub">English Vocab Hub →</a>
    </div>
  </div>

  <script>
    (function () {
      var MEDIA_SLUG = 'grammar-mini-media';
      if (window.KAMPAI) { try { window.KAMPAI.setSlug(MEDIA_SLUG); } catch (e) {} }

      var TOPICS = {
        isare: {
          label: 'is / are',
          rule: '<h3>is / are</h3><p>ใช้ <strong>is</strong> กับ he, she, it, ชื่อคนเดียว<br>ใช้ <strong>are</strong> กับ I, you, we, they, คนหลายคน</p>',
          examples: [
            { en: 'He is happy.', th: 'เขามีความสุข', tip: 'He + is' },
            { en: 'She is a student.', th: 'เธอเป็นนักเรียน', tip: 'She + is' },
            { en: 'It is a cat.', th: 'มันเป็นแมว', tip: 'It + is' },
            { en: 'They are friends.', th: 'พวกเขาเป็นเพื่อนกัน', tip: 'They + are' },
            { en: 'We are ready.', th: 'พวกเราพร้อมแล้ว', tip: 'We + are' },
          ],
          practice: [
            { parts: ['He', null, 'tall.'], answer: 'is', opts: ['is', 'are', 'am', 'be'] },
            { parts: ['They', null, 'students.'], answer: 'are', opts: ['is', 'are', 'am', 'be'] },
            { parts: ['She', null, 'my teacher.'], answer: 'is', opts: ['is', 'are', 'am', 'be'] },
            { parts: ['I', null, 'fine.'], answer: 'am', opts: ['is', 'are', 'am', 'be'] },
            { parts: ['It', null, 'cold today.'], answer: 'is', opts: ['is', 'are', 'am', 'be'] },
            { parts: ['You', null, 'kind.'], answer: 'are', opts: ['is', 'are', 'am', 'be'] },
          ],
        },
        aan: {
          label: 'a / an',
          rule: '<h3>a / an</h3><p>ใช้ <strong>a</strong> นำหน้าคำที่ขึ้นต้นด้วยเสียงพยัญชนะ (consonant sound)<br>ใช้ <strong>an</strong> นำหน้าคำที่ขึ้นต้นด้วยเสียงสระ (vowel sound)</p>',
          examples: [
            { en: 'a cat', th: 'แมวหนึ่งตัว', tip: 'c = consonant sound → a' },
            { en: 'an apple', th: 'แอปเปิ้ลหนึ่งลูก', tip: 'a = vowel sound → an' },
            { en: 'a book', th: 'หนังสือเล่มหนึ่ง', tip: 'b = consonant → a' },
            { en: 'an egg', th: 'ไข่หนึ่งฟอง', tip: 'e = vowel → an' },
            { en: 'a uniform', th: 'ชุดนักเรียน (เสียง yu)', tip: 'u อ่าน yu = consonant sound → a' },
          ],
          practice: [
            { parts: [null, 'orange'], answer: 'an', opts: ['a', 'an'] },
            { parts: [null, 'dog'], answer: 'a', opts: ['a', 'an'] },
            { parts: [null, 'umbrella'], answer: 'an', opts: ['a', 'an'] },
            { parts: [null, 'pen'], answer: 'a', opts: ['a', 'an'] },
            { parts: [null, 'ice cream'], answer: 'an', opts: ['a', 'an'] },
            { parts: [null, 'ball'], answer: 'a', opts: ['a', 'an'] },
          ],
        },
        demonstratives: {
          label: 'this/that',
          rule: '<h3>this · that · these · those</h3><p><strong>this/these</strong> = ใกล้ผู้พูด · <strong>that/those</strong> = ไกลผู้พูด<br>this/that + เอกพจน์ · these/those + พหูพจน์</p>',
          examples: [
            { en: 'This is my book.', th: 'นี่คือหนังสือของฉัน', tip: 'this + เอกพจน์ ใกล้' },
            { en: 'That is a tree.', th: 'นั่นคือต้นไม้', tip: 'that + เอกพจน์ ไกล' },
            { en: 'These are apples.', th: 'นี่คือแอปเปิ้ล (หลายลูก)', tip: 'these + พหูพจน์ ใกล้' },
            { en: 'Those are birds.', th: 'นั่นคือนก (หลายตัว)', tip: 'those + พหูพจน์ ไกล' },
          ],
          practice: [
            { parts: [null, 'is my pen.'], answer: 'This', opts: ['This', 'That', 'These', 'Those'] },
            { parts: [null, 'are my friends.'], answer: 'Those', opts: ['This', 'That', 'These', 'Those'] },
            { parts: [null, 'are cats.'], answer: 'These', opts: ['This', 'That', 'These', 'Those'] },
            { parts: [null, 'is a school.'], answer: 'That', opts: ['This', 'That', 'These', 'Those'] },
          ],
        },
      };

      var activeTopic = 'isare';
      var streak = 0;
      var practiceQ = null;

      function speak(text, lang) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = lang || 'en-US';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      }

      function renderTopics() {
        var tabs = document.getElementById('topicTabs');
        tabs.innerHTML = '';
        Object.keys(TOPICS).forEach(function (key) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'topic-tab' + (key === activeTopic ? ' on' : '');
          b.textContent = TOPICS[key].label;
          b.addEventListener('click', function () {
            activeTopic = key;
            renderTopics();
            renderLearn();
          });
          tabs.appendChild(b);
        });
        renderLearn();
      }

      function renderLearn() {
        var t = TOPICS[activeTopic];
        document.getElementById('ruleCard').innerHTML = t.rule;
        var ex = document.getElementById('examples');
        ex.innerHTML = '';
        document.getElementById('detailEmpty').style.display = '';
        document.getElementById('detailCard').classList.remove('show');
        t.examples.forEach(function (item) {
          var row = document.createElement('button');
          row.type = 'button';
          row.className = 'ex-row';
          var hi = item.en.replace(/\b(is|are|am|a|an)\b/gi, function (m) { return '<mark>' + m + '</mark>'; });
          row.innerHTML = hi + '<div class="th">' + item.th + '</div>';
          row.addEventListener('click', function () {
            document.getElementById('detailEmpty').style.display = 'none';
            document.getElementById('detailCard').classList.add('show');
            document.getElementById('detailSentence').textContent = item.en;
            document.getElementById('detailTip').textContent = item.tip;
          });
          ex.appendChild(row);
        });
      }

      function renderPracticeSentence(q) {
        var html = '';
        q.parts.forEach(function (p) {
          if (p === null) html += '<span class="blank">_____</span> ';
          else html += p + ' ';
        });
        return html.trim();
      }

      function nextPractice() {
        var pool = TOPICS.isare.practice.concat(TOPICS.aan.practice, TOPICS.demonstratives.practice);
        practiceQ = pool[Math.floor(Math.random() * pool.length)];
        var topicKey = 'demonstratives';
        if (TOPICS.isare.practice.indexOf(practiceQ) >= 0) topicKey = 'isare';
        else if (TOPICS.aan.practice.indexOf(practiceQ) >= 0) topicKey = 'aan';
        document.getElementById('practiceTopic').textContent = TOPICS[topicKey].label;
        document.getElementById('practiceSentence').innerHTML = renderPracticeSentence(practiceQ);
        document.getElementById('practiceFb').textContent = '';
        document.getElementById('practiceFb').className = 'practice-fb';
        var box = document.getElementById('practiceChoices');
        box.innerHTML = '';
        var opts = practiceQ.opts.slice().sort(function () { return Math.random() - 0.5; });
        opts.forEach(function (opt) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'choice-btn';
          b.textContent = opt;
          b.addEventListener('click', function () {
            if (b.disabled) return;
            var ok = opt === practiceQ.answer;
            box.querySelectorAll('.choice-btn').forEach(function (x) { x.disabled = true; });
            b.classList.add(ok ? 'correct' : 'wrong');
            if (!ok) {
              box.querySelectorAll('.choice-btn').forEach(function (x) {
                if (x.textContent === practiceQ.answer) x.classList.add('correct');
              });
            }
            var fb = document.getElementById('practiceFb');
            fb.textContent = ok ? '✅ Correct!' : 'Answer: ' + practiceQ.answer;
            fb.className = 'practice-fb ' + (ok ? 'ok' : 'no');
            streak = ok ? streak + 1 : 0;
            document.getElementById('streakLabel').textContent = 'Correct streak: ' + streak;
          });
          box.appendChild(b);
        });
      }

      function fullPracticeSentence(q, ans) {
        return q.parts.map(function (p) { return p === null ? ans : p; }).join(' ').replace(/\s+/g, ' ').trim();
      }

      document.getElementById('modeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-mode]');
        if (!b) return;
        var m = b.dataset.mode;
        document.getElementById('shell').classList.toggle('mode-practice', m === 'practice');
        document.querySelectorAll('#modeSeg button').forEach(function (x) {
          x.classList.toggle('on', x.dataset.mode === m);
        });
        document.getElementById('hintText').textContent = m === 'practice'
          ? 'เลือกคำที่ถูก — ไม่จับเวลา'
          : 'เลือกหัวข้อ → อ่านกฎและตัวอย่าง';
        if (m === 'practice') nextPractice();
      });

      document.getElementById('btnSpeak').addEventListener('click', function () {
        var t = document.getElementById('detailSentence').textContent;
        if (t) speak(t);
      });
      document.getElementById('btnPracticeSpeak').addEventListener('click', function () {
        if (practiceQ) speak(fullPracticeSentence(practiceQ, practiceQ.answer));
      });
      document.getElementById('btnPracticeNext').addEventListener('click', nextPractice);
      document.getElementById('btnFs').addEventListener('click', function () {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
        else if (document.exitFullscreen) document.exitFullscreen();
      });

      renderTopics();
    })();
  </script>
</body>
</html>
