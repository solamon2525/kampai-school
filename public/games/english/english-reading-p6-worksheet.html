<script>
const ITEMS=[{"type":"skill","prompt":"แปลคำสั่ง: Underline the title","answer":"ขีดเส้นใต้ชื่อเรื่อง"},{"type":"comp","prompt":"ใจความสำคัญหมายถึงอะไร","answer":"ประเด็นหลักของเรื่อง"},{"type":"skill","prompt":"อ่านออกเสียงควรทำอย่างไร","answer":"ชัดและถูกหลัก"},{"type":"comp","prompt":"ก่อนตอบคำถามจากเรื่องควรทำอะไร","answer":"หากหลักฐานในข้อความ"},{"type":"skill","prompt":"จับคู่ประโยคกับภาพใช้วิธีใด","answer":"หาคำสำคัญ"},{"type":"comp","prompt":"อ่านเรื่องสั้นแล้วตอบ Who / Where","answer":"ตามเรื่อง"},{"type":"skill","prompt":"Circle the word แปลว่า","answer":"วงกลมคำ"},{"type":"comp","prompt":"สรุปเรื่อง 3 ประโยค (ต้น-กลาง-จบ)","answer":"ตามนักเรียน"},{"type":"comp","prompt":"ข้อความตรงภาพเด็กวิ่ง ข้อใดเหมาะ","answer":"A boy is running."},{"type":"skill","prompt":"เครื่องหมายวรรคตอนช่วยการอ่านอย่างไร","answer":"บอกจังหวะหยุด"},{"type":"comp","prompt":"ตั้งคำถามจากเรื่อง 1 ข้อ","answer":"ตามนักเรียน"},{"type":"skill","prompt":"ปฏิบัติตามคำสั่ง: Draw a line under…","answer":"ทำตามคำสั่ง"},{"type":"comp","prompt":"บอกใจความจากนิทานสั้นที่ครูให้อ่าน","answer":"ตามเรื่อง"},{"type":"skill","prompt":"เลือกประโยคให้ตรงสัญลักษณ์ห้าม","answer":"Do not… / No…"},{"type":"comp","prompt":"ตอบคำถาม: What happened first?","answer":"ตามเรื่อง"},{"type":"comp","prompt":"เขียน retell สั้น ๆ ภาษาอังกฤษ","answer":"ตามนักเรียน"}];
window.WORKSHEET_CONFIG={

};
