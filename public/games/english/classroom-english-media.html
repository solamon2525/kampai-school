<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/vocab-quiz-engine.js?v=2.0.0"></script>
  <script src="/games/engine/connect-match-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classroom English — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #1d4ed8;
      --deep-dark: #1e3a8a;
      --line: #bfdbfe;
      --muted: #475569;
      --ink: #0f172a;
      --border: #cbd5e1;
      --ok: #15803d;
      --bad: #b91c1c;
      --cream: #eff6ff;
    }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(145deg, #bfdbfe, #eff6ff);
      min-height: 100vh;
      padding: 12px;
      color: var(--ink);
    }
    .shell {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(90deg, var(--deep-dark), var(--deep));
      color: #ffffff;
    }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 150px; }
    .badge {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      min-width: 44px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .seg button:focus-visible, .cats button:focus-visible,
    .ke-option:focus-visible, .ke-btn:focus-visible,
    .ke-match-card:focus-visible, .ke-memory-card:focus-visible, .flash-inner:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .btn-primary { background: var(--deep); color: #ffffff; }
    .btn-primary:hover { background: var(--deep-dark); }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #ffffff; color: var(--deep); border: 2px solid var(--line); }
    .btn-ghost:hover { background: var(--cream); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: #ffffff;
    }
    .seg button {
      font-family: inherit;
      font-weight: 800;
      border: none;
      background: #ffffff;
      color: var(--deep);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.86rem;
      min-height: 44px;
      min-width: 44px;
    }
    .seg button.on { background: var(--deep); color: #ffffff; }
    .hint { font-size: 0.85rem; color: var(--deep-dark); font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .speech-status {
      font-size: 0.88rem;
      font-weight: 700;
      color: #78350f;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 8px 12px;
      display: none;
      max-width: 960px;
      margin: 0 auto 12px;
      width: 100%;
    }
    .speech-status.show { display: block; }
    .panel { display: none; flex-direction: column; gap: 14px; max-width: 960px; margin: 0 auto; width: 100%; }
    .panel.on { display: flex; }
    .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .cats button {
      font-family: inherit;
      font-weight: 800;
      padding: 8px 14px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      cursor: pointer;
      color: var(--deep);
      min-height: 44px;
      min-width: 44px;
    }
    .cats button.on { background: var(--deep); color: #ffffff; border-color: var(--deep); }
    .list { display: grid; gap: 10px; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: var(--cream);
    }
    .en { font-weight: 800; color: var(--deep-dark); font-size: 1.1rem; flex: 1; min-width: 140px; }
    .th { font-weight: 600; color: #334155; flex: 1; min-width: 120px; }
    .flash { max-width: 460px; margin: 0 auto; width: 100%; perspective: 800px; }
    .flash-inner {
      min-height: 220px;
      width: 100%;
      border-radius: 20px;
      border: 3px solid var(--line);
      background: linear-gradient(160deg, #eff6ff, #ffffff);
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(29, 78, 216, 0.12);
      font-family: inherit;
    }
    .flash-inner .big { font-size: 1.9rem; font-weight: 800; color: var(--deep-dark); overflow-wrap: anywhere; }
    .flash-inner .sub { font-weight: 700; color: #334155; line-height: 1.45; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .engine-card {
      background: #f8fafc;
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .engine-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .engine-mode-group { display: inline-flex; flex-wrap: wrap; gap: 8px; }
    .ke-quiz-card, .ke-quiz-summary { display: flex; flex-direction: column; gap: 14px; }
    .ke-quiz-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 800; }
    .ke-badge { padding: 4px 10px; border-radius: 999px; background: #dbeafe; color: var(--deep-dark); font-size: 0.85rem; }
    .ke-progress { color: var(--muted); font-size: 0.92rem; }
    .ke-prompt { font-size: 1.18rem; font-weight: 800; color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
    .ke-audio-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ke-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ke-options { grid-template-columns: 1fr 1fr; } }
    .ke-option, .ke-btn {
      min-height: 46px;
      min-width: 44px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .ke-option:hover { background: var(--cream); border-color: var(--deep); }
    .ke-btn {
      background: var(--deep);
      color: #ffffff;
      border-color: var(--deep);
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .ke-option.is-correct { background: #dcfce7; border-color: var(--ok); color: #14532d; }
    .ke-option.is-wrong { background: #fee2e2; border-color: var(--bad); color: #7f1d1d; }
    .ke-clue { padding: 10px 12px; border-radius: 10px; background: #fef3c7; color: #78350f; font-weight: 700; }
    .ke-feedback, .ke-match-feedback {
      min-height: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--ink);
      line-height: 1.45;
    }
    .ke-feedback.is-good { background: #dcfce7; color: #14532d; border: 1.5px solid var(--ok); }
    .ke-feedback.is-learn { background: #fef3c7; color: #78350f; border: 1.5px solid #d97706; }
    .ke-match-wrap { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .ke-match-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .ke-match-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .ke-match-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ke-match-card, .ke-memory-card {
      width: 100%;
      min-height: 48px;
      min-width: 44px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .ke-match-card:hover, .ke-memory-card:hover { border-color: var(--deep); background: var(--cream); }
    .ke-match-card.active { border-color: var(--deep); background: #dbeafe; box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2); }
    .ke-match-card.matched, .ke-memory-card.matched { background: #dcfce7; border-color: var(--ok); color: #14532d; cursor: default; }
    .ke-match-card.error, .ke-memory-card.error { background: #fee2e2; border-color: var(--bad); color: #7f1d1d; }
    .ke-memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; }
    .ke-memory-card.flipped { background: var(--cream); border-color: var(--deep); }
    .footer { padding: 10px 16px; font-size: 0.82rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
      .ke-match-grid { gap: 10px; }
      .ke-match-card { font-size: 0.88rem; padding: 8px 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back()">← กลับคลังสื่อ</button>
    <h1>🗣️ Classroom English Phrases</h1>
    <span class="badge">ป.1–6 · English</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="flash">🃏 แฟลชการ์ด</button>
      <button type="button" data-mode="practice">✏️ ฝึกสั้น</button>
      <button type="button" data-mode="match">🔗 จับคู่</button>
    </span>
    <p class="hint" id="hintText">สื่อการสอน — แตะ 🔊 เพื่อฟังวลีในห้องเรียน</p>
    <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/english/classroom-english-media-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="speech-status" id="speechStatus" role="status" aria-live="polite"></div>

    <div class="panel on learn" id="p-learn">
      <div class="cats" id="cats"></div>
      <div class="list" id="list"></div>
    </div>

    <div class="panel" id="p-flash"></div>

    <div class="panel practice" id="p-practice">
      <div class="engine-card">
        <div class="engine-toolbar">
          <div class="engine-mode-group">
            <button type="button" class="btn btn-primary" id="btnQuizChoice">📝 ทายความหมาย</button>
            <button type="button" class="btn btn-ghost" id="btnQuizListen">🔊 ฟังเสียงเลือกวลี</button>
          </div>
          <button type="button" class="btn btn-ghost" id="btnQuizNew">🔄 ชุดใหม่</button>
        </div>
        <div id="quizEngineRoot"></div>
      </div>
    </div>

    <div class="panel" id="p-match">
      <div class="engine-card">
        <div class="engine-toolbar">
          <div class="engine-mode-group">
            <button type="button" class="btn btn-primary" id="btnMatchConnect">🔗 โยงคู่วลีกับความหมาย</button>
            <button type="button" class="btn btn-ghost" id="btnMatchMemory">🃏 เปิดป้ายจำคู่</button>
          </div>
          <button type="button" class="btn btn-ghost" id="btnMatchNew">🔄 ชุดใหม่</button>
        </div>
        <div id="matchEngineRoot"></div>
      </div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG = 'classroom-english-media';
if (window.KAMPAI) {
  KAMPAI.setSlug(MEDIA_SLUG);
  if (KAMPAI.sound && KAMPAI.sound.mountToggles) KAMPAI.sound.mountToggles();
}

const DATA = {
  Greetings: [
    { en: 'Good morning', th: 'สวัสดีตอนเช้า', note: 'ใช้ทักทายคุณครูและเพื่อนในตอนเช้า' },
    { en: 'How are you?', th: 'สบายดีไหม', note: 'ใช้ถามสารทุกข์สุกดิบเมื่อพบกัน' },
    { en: 'I am fine, thank you.', th: 'ฉันสบายดี ขอบคุณ', note: 'คำตอบสุภาพเมื่อมีคนถามว่าสบายดีไหม' },
    { en: 'See you tomorrow', th: 'พรุ่งนี้นะ', note: 'ใช้บอกลาหลังเลิกเรียน' }
  ],
  Polite: [
    { en: 'Please', th: 'ได้โปรด / กรุณา', note: 'วางท้ายหรือต้นประโยคเพื่อแสดงความสุภาพ' },
    { en: 'Thank you', th: 'ขอบคุณ', note: 'กล่าวเมื่อได้รับความช่วยเหลือหรือของ' },
    { en: 'Excuse me', th: 'ขอโทษ (แทรก/เรียก)', note: 'ใช้เมื่อขออนุญาตถามหรือเดินผ่าน' },
    { en: 'I am sorry', th: 'ขอโทษ', note: 'ใช้กล่าวขออภัยเมื่อทำผิดพลาด' }
  ],
  Classroom: [
    { en: 'May I come in?', th: 'ขออนุญาตเข้าได้ไหม', note: 'พูดหน้าประตูห้องเรียนก่อนเดินเข้า' },
    { en: 'May I go to the toilet?', th: 'ขออนุญาตไปห้องน้ำ', note: 'ยกมือขออนุญาตคุณครูก่อนออกจากห้อง' },
    { en: 'I do not understand', th: 'ฉันไม่เข้าใจ', note: 'บอกคุณครูอย่างสุภาพเมื่อต้องการคำอธิบายเพิ่ม' },
    { en: 'Please repeat', th: 'ช่วยพูดอีกครั้ง', note: 'ขอให้คุณครูหรือเพื่อนพูดซ้ำช้าๆ' },
    { en: 'Open your book', th: 'เปิดหนังสือ', note: 'คำสั่งจากคุณครูให้เปิดหนังสือเรียน' },
    { en: 'Listen carefully', th: 'ตั้งใจฟัง', note: 'คำสั่งให้ฟังคำอธิบายอย่างตั้งใจ' }
  ],
  Praise: [
    { en: 'Well done!', th: 'เก่งมาก', note: 'คำชมเมื่อทำกิจกรรมสำเร็จ' },
    { en: 'Good job!', th: 'ทำได้ดี', note: 'คำชมให้กำลังใจเพื่อนหรือนักเรียน' },
    { en: 'Try again', th: 'ลองอีกครั้ง', note: 'คำให้กำลังใจเมื่อยังไม่สำเร็จ' }
  ]
};

const ENGINE_POOL = Object.entries(DATA).flatMap(([category, list]) =>
  list.map((item, idx) => ({
    id: `${category}:${idx}:${item.en}`,
    term: item.en,
    left: item.en,
    right: item.th,
    reading: category,
    meaning: item.th,
    explain: `${item.en} — ${item.th} (${item.note})`,
    locale: 'en-US'
  }))
);

let mode = 'learn';
let cat = 'Greetings';
let flashIdx = 0;
let flashBack = false;
let quizQuestionType = 'choice';
let matchSubMode = 'connect';
let quizSession = null;
let matchSession = null;

const hints = {
  learn: 'เลือกหมวดหมู่ → แตะ 🔊 เพื่อฟังวลีในห้องเรียน',
  flash: 'แตะการ์ดเพื่อพลิกดูคำแปลภาษาไทยและวิธีใช้',
  practice: 'ฝึกสั้น: ทายความหมายหรือฟังเสียงวลีในห้องเรียน (ไม่เก็บคะแนน)',
  match: 'จับคู่วลีภาษาอังกฤษกับความหมายภาษาไทย (ไม่จับเวลา · ไม่เก็บคะแนน)'
};

function stopSpeech() {
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
    window.KampaiMediaLab.stopAllSpeech();
  } else {
    try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
    try { window.speechSynthesis?.cancel?.(); } catch (_) {}
  }
}

let lastSpeakTs = 0;
function speak(t) {
  const clean = String(t || '').trim();
  if (!clean) return;
  const now = Date.now();
  if (now - lastSpeakTs < 200) return;
  lastSpeakTs = now;
  const statusEl = document.getElementById('speechStatus');

  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
    const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'en-US', rate: 0.9 });
    if (statusEl) {
      if (res && res.ok === false) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านวลีและคำแปลต่อได้';
        statusEl.classList.add('show');
      } else {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  if (window.KAMPAI && KAMPAI.sound && KAMPAI.sound.speak) {
    KAMPAI.sound.speak(clean, 'en-US', true);
  } else if (window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    } catch (_) {}
  } else if (statusEl) {
    statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านวลีและคำแปลต่อได้';
    statusEl.classList.add('show');
  }
}

function setMode(m) {
  stopSpeech();
  mode = (m === 'flash' || m === 'practice' || m === 'match') ? m : 'learn';
  document.getElementById('shell').classList.toggle('mode-practice', mode === 'practice');
  document.querySelectorAll('#modeSeg button').forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  const target = document.getElementById('p-' + mode);
  if (target) target.classList.add('on');
  document.getElementById('hintText').textContent = hints[mode] || '';
  if (mode === 'learn') render();
  if (mode === 'flash') { flashBack = false; renderFlash(); }
  if (mode === 'practice' && !quizSession) mountQuiz();
  if (mode === 'match' && !matchSession) mountMatch();
}

function render() {
  document.getElementById('cats').innerHTML = Object.keys(DATA).map(k =>
    `<button type="button" data-c="${k}" class="${k === cat ? 'on' : ''}">${k}</button>`
  ).join('');
  document.getElementById('list').innerHTML = DATA[cat].map((r, i) =>
    `<div class="row"><div class="en">${r.en}</div><div class="th">${r.th}</div><button type="button" class="btn btn-ghost" data-say="${i}" aria-label="ฟังเสียง ${r.en}">🔊</button></div>`
  ).join('');
}

function renderFlash() {
  const el = document.getElementById('p-flash');
  const item = ENGINE_POOL[flashIdx % ENGINE_POOL.length];
  const raw = DATA[item.reading]?.find(x => x.en === item.term);
  el.innerHTML =
    `<div class="flash"><button type="button" class="flash-inner" id="flashCard">` +
      (flashBack
        ? `<div class="sub">หมวด <strong>${item.reading}</strong></div>` +
          `<div class="big">${item.meaning}</div>` +
          `<div class="sub">💡 ${raw ? raw.note : ''}</div><small style="font-weight:700;color:var(--muted)">แตะเพื่อกลับหน้า</small>`
        : `<div class="big">${item.term}</div>` +
          `<div class="sub">หมวด: ${item.reading}</div>` +
          `<small style="font-weight:700;color:var(--muted)">แตะเพื่อดูคำแปล</small>`) +
    `</button></div>` +
    `<div class="actions">` +
      `<button type="button" class="btn btn-ghost" id="btnPrevF">← ก่อนหน้า</button>` +
      `<button type="button" class="btn btn-primary" id="btnNextF">ถัดไป →</button>` +
      `<button type="button" class="btn btn-accent" id="btnSpeakF">🔊 ฟังเสียง</button>` +
    `</div>` +
    `<p style="text-align:center;font-weight:700;color:var(--muted)">${(flashIdx % ENGINE_POOL.length) + 1} / ${ENGINE_POOL.length}</p>`;

  document.getElementById('flashCard').onclick = () => { flashBack = !flashBack; renderFlash(); };
  document.getElementById('btnPrevF').onclick = () => {
    stopSpeech();
    flashIdx = (flashIdx - 1 + ENGINE_POOL.length) % ENGINE_POOL.length;
    flashBack = false;
    renderFlash();
  };
  document.getElementById('btnNextF').onclick = () => {
    stopSpeech();
    flashIdx = (flashIdx + 1) % ENGINE_POOL.length;
    flashBack = false;
    renderFlash();
  };
  document.getElementById('btnSpeakF').onclick = () => speak(item.term);
}

function updateQuizButtons() {
  const cBtn = document.getElementById('btnQuizChoice');
  const lBtn = document.getElementById('btnQuizListen');
  if (cBtn) cBtn.className = 'btn ' + (quizQuestionType === 'choice' ? 'btn-primary' : 'btn-ghost');
  if (lBtn) lBtn.className = 'btn ' + (quizQuestionType === 'listen' ? 'btn-primary' : 'btn-ghost');
}

function mountQuiz() {
  if (!window.KampaiEngines || !window.KampaiEngines.Quiz) return;
  updateQuizButtons();
  const opts = {
    items: ENGINE_POOL,
    mode: 'media',
    roundSize: 8,
    locale: 'en-US',
    speak: (text) => speak(text),
    onAnswer: (res) => {
      if (window.KAMPAI && window.KAMPAI.sound) {
        try {
          if (res.isCorrect) KAMPAI.sound.correct();
          else KAMPAI.sound.wrong();
        } catch (_) {}
      }
    }
  };
  quizSession = quizQuestionType === 'listen'
    ? window.KampaiEngines.Quiz.mountListen('#quizEngineRoot', opts)
    : window.KampaiEngines.Quiz.mountChoice('#quizEngineRoot', opts);
}

function updateMatchButtons() {
  const cBtn = document.getElementById('btnMatchConnect');
  const mBtn = document.getElementById('btnMatchMemory');
  if (cBtn) cBtn.className = 'btn ' + (matchSubMode === 'connect' ? 'btn-primary' : 'btn-ghost');
  if (mBtn) mBtn.className = 'btn ' + (matchSubMode === 'memory' ? 'btn-primary' : 'btn-ghost');
}

function mountMatch() {
  if (!window.KampaiEngines || !window.KampaiEngines.ConnectMatch) return;
  updateMatchButtons();
  matchSession = window.KampaiEngines.ConnectMatch.mount('#matchEngineRoot', {
    items: ENGINE_POOL,
    pairCount: 6,
    mode: 'media',
    subMode: matchSubMode,
    locale: 'en-US',
    onMatch: (pair) => {
      if (window.KAMPAI && window.KAMPAI.sound) {
        try { KAMPAI.sound.correct(); } catch (_) {}
      }
      if (pair && pair.leftText) speak(pair.leftText);
    }
  });
}

document.getElementById('cats').onclick = e => {
  const b = e.target.closest('[data-c]');
  if (!b) return;
  stopSpeech();
  cat = b.dataset.c;
  render();
};
document.getElementById('list').onclick = e => {
  const b = e.target.closest('[data-say]');
  if (!b) return;
  speak(DATA[cat][+b.dataset.say].en);
};
document.getElementById('modeSeg').onclick = e => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  setMode(b.dataset.mode);
};
document.getElementById('btnQuizChoice').addEventListener('click', () => {
  stopSpeech();
  quizQuestionType = 'choice';
  mountQuiz();
});
document.getElementById('btnQuizListen').addEventListener('click', () => {
  stopSpeech();
  quizQuestionType = 'listen';
  mountQuiz();
});
document.getElementById('btnQuizNew').addEventListener('click', () => {
  stopSpeech();
  mountQuiz();
});
document.getElementById('btnMatchConnect').addEventListener('click', () => {
  stopSpeech();
  matchSubMode = 'connect';
  mountMatch();
});
document.getElementById('btnMatchMemory').addEventListener('click', () => {
  stopSpeech();
  matchSubMode = 'memory';
  mountMatch();
});
document.getElementById('btnMatchNew').addEventListener('click', () => {
  stopSpeech();
  mountMatch();
});
document.getElementById('btnFs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopSpeech();
});
window.addEventListener('pagehide', stopSpeech);

window.getState = () => Object.freeze({
  slug: MEDIA_SLUG,
  mode: mode,
  category: cat,
  phraseCount: ENGINE_POOL.length,
  flashIndex: flashIdx,
  flashBack: flashBack,
  quizQuestionType: quizQuestionType,
  matchSubMode: matchSubMode,
  quizState: quizSession ? quizSession.getState() : null,
  matchState: matchSession ? matchSession.getState() : null,
  reducedMotion: typeof window.matchMedia === 'function'
    ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    : false
});
window.__getState = window.getState;

render();
mountQuiz();
mountMatch();
setMode('learn');
</script>
</body>
</html>
