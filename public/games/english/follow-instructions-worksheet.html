<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/english/follow-instructions.html"><meta name="curriculum-indicators" content="ต 1.1 ป.4/1, ต 1.1 ป.4/3"><title>ใบงาน Follow Instructions ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.12" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.12" rel="stylesheet">
<style>
.verb-cmd{display:flex;gap:1.5mm;flex-wrap:wrap;margin:1mm 0;justify-content:center}
.verb-cmd span{border:1.5px solid var(--ws-accent);border-radius:4px;padding:.6mm 2mm;font-size:8pt;font-weight:800;color:var(--ws-accent)}
.verb-cmd .active{background:var(--ws-accent);color:var(--ws-paper)}
.target-row{display:flex;gap:2mm;flex-wrap:wrap;justify-content:center;margin:1mm 0;font-size:14pt}
.evidence-line{min-height:6mm;border-bottom:1px dotted var(--ws-muted);font-size:8pt;font-weight:700;margin:.8mm 0;display:flex;align-items:flex-end;gap:1mm}
.evidence-line .lbl{color:var(--ws-accent);font-weight:800;flex:0 0 auto}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>

<header class="toolbar"><h1>📋 ใบงาน Follow Instructions</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="circle">Circle — วงกลม</option><option value="underline">Underline — ขีดเส้นใต้</option><option value="tick">Tick — ติ๊กถูก</option><option value="read">อ่านคำสั่ง</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.12"></script><script>
const FOLLOW_ITEMS=[
{type:'circle',prompt:'อ่านคำสั่งแล้วเลือกสิ่งที่ต้อง "Circle"',context:'"Circle the apple."',choices:['🍎 แอปเปิล','🍌 กล้วย','🐱 แมว'],answer:'วงกลม 🍎 แอปเปิล',verb:'Circle',target:'apple',s1:'Circle = วงกลม',s2:'apple = แอปเปิล',s3:'วงกลมเฉพาะแอปเปิล'},
{type:'circle',prompt:'"Circle the dog." ต้องทำอย่างไร',context:'🐕 🐈 🐦 🐟',choices:['วงกลมสุนัข','ขีดเส้นใต้แมว','ติ๊กนก'],answer:'วงกลม 🐕 สุนัข',verb:'Circle',target:'dog',s1:'อ่านคำกริยา Circle',s2:'dog = สุนัข',s3:'วงกลมสุนัข'},
{type:'underline',prompt:'"Underline the cat." หมายถึงอะไร',context:'🐱 🐶 🐰 🐻',choices:['ขีดเส้นใต้แมว','วงกลมสุนัข','ติ๊กกระต่าย'],answer:'ขีดเส้นใต้ 🐱 แมว',verb:'Underline',target:'cat',s1:'Underline = ขีดเส้นใต้',s2:'cat = แมว',s3:'ขีดแมวเท่านั้น'},
{type:'underline',prompt:'"Underline the word book." ในประโยค "I read a book."',context:'I read a book.',choices:['ขีดเส้นใต้ book','วงกลม read','ติ๊ก a'],answer:'ขีดเส้นใต้คำว่า book',verb:'Underline',target:'book',s1:'หาคำ book',s2:'Underline ใต้ book',s3:'ไม่ขีด read/a'},
{type:'tick',prompt:'"Tick the correct answer." หมายถึงอะไร',context:'2 + 3 = ? · 4 · 5 · 6',choices:['ติ๊ก 5','วงกลม 4','ขีด 6'],answer:'ติ๊ก ✓ ที่ 5',verb:'Tick',target:'5',s1:'Tick = ติ๊กถูก',s2:'2+3=5',s3:'ติ๊ก 5'},
{type:'tick',prompt:'"Tick the banana." เลือกอะไร',context:'🍎 🍌 🍊 🍇',choices:['ติ๊กกล้วย','วงกลมแอปเปิล','ขีดส้ม'],answer:'ติ๊ก 🍌 กล้วย',verb:'Tick',target:'banana',s1:'Tick = ติ๊ก',s2:'banana = กล้วย',s3:'ติ๊กกล้วย'},
{type:'read',prompt:'แปลความหมาย: "Circle the red ball."',context:'🔴 ⚽ 🔵 ⚽',choices:['วงกลมลูกบอลสีแดง','ขีดลูกบอลสีน้ำเงิน'],answer:'วงกลมลูกบอลสีแดง',verb:'Circle',target:'red ball',s1:'Circle · red · ball',s2:'ลูกบอลสีแดง',s3:'ไม่วงกลมน้ำเงิน'},
{type:'read',prompt:'แปล: "Underline the big tree."',context:'🌳เล็ก 🌳ใหญ่ 🌸',choices:['ขีดเส้นใต้ต้นไม้ใหญ่','วงกลมดอกไม้'],answer:'ขีดเส้นใต้ต้นไม้ใหญ่',verb:'Underline',target:'big tree',s1:'big · tree',s2:'Underline',s3:'ต้นไม้ใหญ่'},
{type:'circle',prompt:'"Circle all the stars." ต่างจาก Circle the star อย่างไร',context:'⭐ ⭐ 🌙 ⭐',choices:['วงกลมทุกดาว','วงกลมดวงเดียว'],answer:'วงกลมทุกดาว (all = ทั้งหมด)',verb:'Circle',target:'all stars',s1:'all = ทั้งหมด',s2:'ทุก ⭐',s3:'ไม่วงกลมพระจันทร์'},
{type:'underline',prompt:'"Underline the verb run." ในประโยค "They run fast."',context:'They run fast.',choices:['ขีด run','ขีด They','ขีด fast'],answer:'ขีดเส้นใต้ run',verb:'Underline',target:'run',s1:'verb = run',s2:'Underline run',s3:'They/fast ไม่ใช่'},
{type:'tick',prompt:'"Tick the sentence that is correct."',context:'A) He are happy. B) He is happy.',choices:['ติ๊ก B','ติ๊ก A'],answer:'ติ๊ก B) He is happy.',verb:'Tick',target:'B',s1:'He ใช้ is',s2:'อ่านทั้งสอง',s3:'B ถูกต้อง'},
{type:'read',prompt:'เรียงขั้นตอนเมื่อได้รับคำสั่งภาษาอังกฤษ',context:'Circle / Underline / Tick',choices:['1 อ่านคำกริยา 2 หาคำเป้า 3 ทำตามคำสั่ง','1 ทายความหมาย 2 ข้าม'],answer:'1 อ่านคำกริยา → 2 หาคำเป้า → 3 ทำตามคำสั่ง',verb:'All',target:'steps',s1:'อ่านคำสั่งครบ',s2:'แยกประเภท',s3:'ทำตามคำสั่ง'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'follow-instructions',icon:'📋',title:'ใบงาน Follow Instructions',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–6',mediaLabel:'Follow Instructions',
  sourceMediaUrl:'/games/english/follow-instructions.html',indicators:['ต 1.1 ป.4/1','ต 1.1 ป.4/3'],
  directions:'อ่านคำกริยาคำสั่ง → หาคำเป้า → Circle / Underline / Tick',
  getItems(t){return t==='mixed'?FOLLOW_ITEMS:FOLLOW_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const cmds=['Circle','Underline','Tick'].map(v=>'<span class="'+(v===item.verb?'active':'')+'">'+e(v)+'</span>').join('');
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="verb-cmd">'+cmds+'</div>'
      +'<div class="q-context">'+e(item.context)+'</div>'
      +'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>'
      +'<div class="evidence-line"><span class="lbl">Verb + target</span><span class="work-fill">'+e(item.verb)+' → '+e(item.target)+'</span></div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 Verb</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 Target</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 Do it</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.12"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.12"></script></body></html>
