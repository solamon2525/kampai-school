<style>

<script src="/games/worksheet-runtime.js?v=1.199.1"></script><script>
const ITEMS=[
  {type:'be',prompt:'She ___ a doctor.',focus:'is / am / are',answer:'is',step1:'ประธาน She (เอกพจน์)',step2:'รูปปัจจุบัน',step3:'is'},
  {type:'be',prompt:'I ___ a student.',focus:'is / am / are',answer:'am',step1:'ประธาน I',step2:'คู่ am เสมอ',step3:'am'},
  {type:'be',prompt:'They ___ playing football.',focus:'is / am / are',answer:'are',step1:'ประธาน They (พหูพจน์)',step2:'They คู่ are',step3:'are'},
  {type:'be',prompt:'We ___ hungry now.',focus:'is / am / are',answer:'are',step1:'ประธาน We (พหูพจน์)',step2:'รูปปัจจุบัน',step3:'are'},
  {type:'be',prompt:'He ___ at home yesterday.',focus:'was / were',answer:'was',step1:'He (เอกพจน์) + yesterday',step2:'อดีตเอกพจน์ → was',step3:'was'},
  {type:'be',prompt:'You ___ very kind to me.',focus:'is / am / are',answer:'are',step1:'ประธาน You',step2:'You คู่ are',step3:'are'},
  {type:'be',prompt:'The dog ___ sleeping under the tree.',focus:'is / am / are',answer:'is',step1:'The dog (เอกพจน์)',step2:'เอกพจน์ใช้ is',step3:'is'},
  {type:'be',prompt:'We ___ in Bangkok last week.',focus:'was / were',answer:'were',step1:'We + last week (อดีต)',step2:'อดีตพหูพจน์ → were',step3:'were'},
  {type:'be',prompt:'It ___ a sunny day today.',focus:'is / am / are',answer:'is',step1:'ประธาน It (เอกพจน์)',step2:'It คู่ is',step3:'is'},
  {type:'be',prompt:'The children ___ happy yesterday.',focus:'was / were',answer:'were',step1:'children (หลายคน) + yesterday',step2:'อดีตพหูพจน์ → were',step3:'were'},

  {type:'articles',prompt:'I saw ___ elephant at the zoo.',focus:'a / an / the',answer:'an',step1:'elephant เสียงสระ /e/',step2:'เสียงสระนำหน้า → an',step3:'an'},
  {type:'articles',prompt:'He is ___ honest boy.',focus:'a / an / the',answer:'an',step1:'honest ไม่ออกเสียง h (/ɒ/)',step2:'เสียงสระนำหน้า → an',step3:'an'},
  {type:'articles',prompt:'She bought ___ new book yesterday.',focus:'a / an / the',answer:'a',step1:'new book เสียงพยัญชนะ /n/',step2:'เอกพจน์ทั่วไป → a',step3:'a'},
  {type:'articles',prompt:'___ sun rises in the east.',focus:'a / an / the',answer:'The',step1:'sun สิ่งเดียวในโลก',step2:'เฉพาะเจาะจง → The',step3:'The'},
  {type:'articles',prompt:'Pass me ___ pencil on the desk.',focus:'a / an / the',answer:'the',step1:'ดินสอบนโต๊ะตัวนั้น',step2:'เจาะจงชัดเจน → the',step3:'the'},
  {type:'articles',prompt:'She wants to be ___ English teacher.',focus:'a / an / the',answer:'an',step1:'English เสียงสระ /ɪ/',step2:'อาชีพเสียงสระ → an',step3:'an'},
  {type:'articles',prompt:'We go to school by ___ bus.',focus:'a / an / the / ∅',answer:'∅ (ไม่ต้องเติม)',step1:'by + ยานพาหนะ',step2:'ไม่ต้องมี article',step3:'∅'},
  {type:'articles',prompt:'Look at ___ moon in the sky.',focus:'a / an / the',answer:'the',step1:'moon มีดวงเดียวในโลก',step2:'เฉพาะเจาะจง → the',step3:'the'},
  {type:'articles',prompt:'That is ___ university in Bangkok.',focus:'a / an / the',answer:'a',step1:'university เสียงพยัญชนะ /juː/',step2:'เสียง ย → ใช้ a',step3:'a'},
  {type:'articles',prompt:'He ate ___ apple for breakfast.',focus:'a / an / the',answer:'an',step1:'apple เสียงสระ /æ/',step2:'เสียงสระ → an',step3:'an'},

  {type:'pronouns',prompt:'Lisa is kind. Everyone loves ___.',focus:'her / him / she',answer:'her',step1:'Lisa (ผู้หญิง)',step2:'รูปกรรม = her',step3:'her'},
  {type:'pronouns',prompt:'John lost ___ pencil at school.',focus:'his / him / he',answer:'his',step1:'ของ John (ผู้ชาย)',step2:'แสดงความเป็นเจ้าของ = his',step3:'his'},
  {type:'pronouns',prompt:'This is my cat. ___ is very cute.',focus:'It / Its / She',answer:'It',step1:'my cat (สัตว์ 1 ตัว)',step2:'สรรพนามประธาน = It',step3:'It'},
  {type:'pronouns',prompt:'We cleaned ___ classroom today.',focus:'our / us / we',answer:'our',step1:'ห้องเรียนของพวกเรา',step2:'เจ้าของของ We = our',step3:'our'},
  {type:'pronouns',prompt:'The teacher asked ___ to answer.',focus:'me / I / my',answer:'me',step1:'ตำแหน่งกรรมหลังกริยา asked',step2:'รูปกรรมของ I = me',step3:'me'},
  {type:'pronouns',prompt:'The birds built ___ nest in the tree.',focus:'their / them / they',answer:'their',step1:'the birds หลายตัว',step2:'ความเป็นเจ้าของ = their',step3:'their'},
  {type:'pronouns',prompt:'Give ___ that book, please. (เขาผู้ชาย)',focus:'him / his / he',answer:'him',step1:'ตำแหน่งกรรมหลัง Give',step2:'รูปกรรมผู้ชาย = him',step3:'him'},
  {type:'pronouns',prompt:'That red bag is ___. (ของฉัน)',focus:'mine / my / me',answer:'mine',step1:'สรรพนามเจ้าของท้ายประโยค',step2:'my bag = mine',step3:'mine'},
  {type:'pronouns',prompt:'The kids did the work by ___.',focus:'themselves / their',answer:'themselves',step1:'เด็กๆ ทำด้วยตนเอง',step2:'reflexive ของ they = themselves',step3:'themselves'},
  {type:'pronouns',prompt:'Anna and ___ are best friends.',focus:'I / me / my',answer:'I',step1:'ตำแหน่งประธานร่วมกับ Anna',step2:'รูปประธาน = I',step3:'I'},

  {type:'demonstratives',prompt:'___ is my pencil right here in hand.',focus:'This / That / These / Those',answer:'This',step1:'ดินสอ 1 แท่ง + อยู่ใกล้ในมือ',step2:'ใกล้ + เอกพจน์ → This',step3:'This'},
  {type:'demonstratives',prompt:'Look at ___ birds flying way up there.',focus:'This / That / These / Those',answer:'those',step1:'birds หลายตัว + บินอยู่ไกล',step2:'ไกล + พหูพจน์ → those',step3:'those'},
  {type:'demonstratives',prompt:'___ shoes I am wearing are soft.',focus:'This / That / These / Those',answer:'These',step1:'shoes หลายข้าง + สวมอยู่ (ใกล้)',step2:'ใกล้ + พหูพจน์ → These',step3:'These'},
  {type:'demonstratives',prompt:'Do you see ___ red car over there?',focus:'This / That / These / Those',answer:'that',step1:'รถ 1 คัน + อยู่ตรงโน้น (ไกล)',step2:'ไกล + เอกพจน์ → that',step3:'that'},
  {type:'demonstratives',prompt:'___ are sweet cookies on my plate.',focus:'This / That / These / Those',answer:'These',step1:'cookies หลายชิ้น + บนจานฉัน',step2:'ใกล้ + พหูพจน์ → These',step3:'These'},
  {type:'demonstratives',prompt:'Who is ___ boy standing by the gate?',focus:'This / That / These / Those',answer:'that',step1:'boy คนเดียว + ยืนตรงประตู',step2:'ไกล + เอกพจน์ → that',step3:'that'},
  {type:'demonstratives',prompt:'I like ___ picture in my hand.',focus:'This / That / These / Those',answer:'this',step1:'picture 1 รูป + อยู่ในมือ',step2:'ใกล้ + เอกพจน์ → this',step3:'this'},
  {type:'demonstratives',prompt:'___ stars in the night sky look bright.',focus:'This / That / These / Those',answer:'Those',step1:'stars หลายดวง + บนฟ้าไกล',step2:'ไกล + พหูพจน์ → Those',step3:'Those'},
  {type:'demonstratives',prompt:'Are ___ your keys on the table near you?',focus:'this / that / these / those',answer:'these',step1:'keys หลายดอก + วางใกล้',step2:'ใกล้ + พหูพจน์ → these',step3:'these'},
  {type:'demonstratives',prompt:'What was ___ noise outside last night?',focus:'this / that / these / those',answer:'that',step1:'noise สิ่งเดียว + นอกบ้าน (ไกล)',step2:'ไกล + เอกพจน์ → that',step3:'that'},

  {type:'prepositions',prompt:'The cat is sleeping ___ the chair.',focus:'under / in / between',answer:'under',step1:'นอนใต้เก้าอี้',step2:'ใต้ = under',step3:'under'},
  {type:'prepositions',prompt:'The books are ___ the school bag.',focus:'in / on / behind',answer:'in',step1:'อยู่ในกระเป๋า',step2:'ข้างใน = in',step3:'in'},
  {type:'prepositions',prompt:'There is an apple ___ the table.',focus:'on / under / next to',answer:'on',step1:'วางบนโต๊ะ',step2:'บนพื้นผิว = on',step3:'on'},
  {type:'prepositions',prompt:'The shop is ___ the bank and school.',focus:'between / in front of / on',answer:'between',step1:'ระหว่าง 2 สิ่ง (A and B)',step2:'ระหว่าง = between',step3:'between'},
  {type:'prepositions',prompt:'The boy is hiding ___ the door.',focus:'behind / under / in',answer:'behind',step1:'แอบข้างหลังประตู',step2:'ข้างหลัง = behind',step3:'behind'},
  {type:'prepositions',prompt:'The car is parked ___ the house.',focus:'in front of / between / under',answer:'in front of',step1:'จอดอยู่หน้าบ้าน',step2:'ข้างหน้า = in front of',step3:'in front of'},
  {type:'prepositions',prompt:'Sit ___ me so we can read together.',focus:'next to / in / under',answer:'next to',step1:'นั่งข้างๆ ฉัน',step2:'ข้างๆ = next to',step3:'next to'},
  {type:'prepositions',prompt:'The clock is hanging ___ the wall.',focus:'on / in / under',answer:'on',step1:'แขวนบนผนัง',step2:'แนบผนัง = on',step3:'on'},
  {type:'prepositions',prompt:'Fish swim ___ the river.',focus:'in / on / at',answer:'in',step1:'ว่ายในแม่น้ำ',step2:'ในน้ำ = in',step3:'in'},
  {type:'prepositions',prompt:'We have English class ___ Monday.',focus:'on / in / at',answer:'on',step1:'วันในสัปดาห์ (Monday)',step2:'หน้าวัน = on',step3:'on'}
];
const SKILL={be:'Verb to Be',articles:'Articles',pronouns:'Pronouns',demonstratives:'Demonstratives',prepositions:'Prepositions'};
window.WORKSHEET_CONFIG={
  worksheetKey:'grammar-vocab-p46',
  icon:'🔤',title:'ใบงาน Grammar & Vocab',subject:'ภาษาอังกฤษ',gradeLabel:'ป.4–6',mediaLabel:'Grammar & Vocab Media',
  sourceMediaUrl:'/games/english/grammar-vocab-media.html',indicators:['ต 1.1 ป.4/2','ต 2.2 ป.5/1','ต 3.1 ป.5/1'],
  directions:'วิเคราะห์ประธานและบริบท → เลือกหลักไวยากรณ์ → เขียนคำตอบที่ถูกต้อง',
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="eng-word">'+e(item.focus)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ หลักการ</div><div class="tick-box">□ รูปประธาน</div><div class="tick-box">□ บริบทเวลา</div></div>'
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ประธาน/คำ</span><div class="step-body"><span class="work-fill">'+e(item.step1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 กฎไวยากรณ์</span><div class="step-body"><span class="work-fill">'+e(item.step2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 คำตอบ</span><div class="step-body"><span class="work-fill">'+e(item.step3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">Answer <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.199.1"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.199.1"></script></body></html>
