<!DOCTYPE html>
<html lang="th">
<head>
    <script src="/games/kampai-sdk.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังอังกฤษ ป.4-5 — Grammar · Sight Words</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Sarabun',sans-serif;background:linear-gradient(145deg,#e0e7ff,#c7d2fe);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
        .main-container{width:100%;max-width:1152px;background:#fff;border-radius:2rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden;height:90vh;min-height:600px}
        @media(min-width:768px){.main-container{flex-direction:row;height:85vh}}
        .sidebar{background:#4338ca;color:#fff;padding:24px;width:100%;display:flex;flex-direction:column;flex-shrink:0}
        @media(min-width:768px){.sidebar{width:300px}}
        .sidebar h2{font-size:1.3rem;font-weight:800;margin-bottom:16px}
        .field-label{font-size:.85rem;color:#c7d2fe;margin-bottom:6px;display:block;font-weight:600}
        .select-field{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(199,210,254,.4);border-radius:12px;padding:12px;font-family:inherit;font-size:1rem;color:#fff}
        .select-field option{color:#1e293b}
        .btn{width:100%;font-family:inherit;font-weight:700;padding:14px;border-radius:12px;border:none;cursor:pointer;font-size:1.05rem;margin-bottom:8px}
        .btn-random{background:#f59e0b;color:#fff}
        .btn-answer{background:#10b981;color:#fff}
        .btn-back{background:rgba(255,255,255,.15);color:#e0e7ff;font-size:.95rem}
        .display-area{flex:1;padding:20px 24px;overflow:auto}
        .main-title{font-size:1.2rem;font-weight:800;color:#4338ca;margin-bottom:14px}
        .sub-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
        .sub-tab{font-family:inherit;font-weight:700;padding:8px 12px;border:2px solid #c7d2fe;border-radius:10px;background:#fff;color:#4338ca;cursor:pointer;font-size:.85rem}
        .sub-tab.on{background:#4338ca;color:#fff;border-color:#4338ca}
        .rule-box{background:#eef2ff;border:2px dashed #a5b4fc;border-radius:14px;padding:14px;line-height:1.6;font-weight:600;margin-bottom:12px}
        .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
        .word-tile{font-family:inherit;font-weight:800;padding:10px 6px;border:2px solid #c7d2fe;border-radius:10px;background:#fff;color:#4338ca;cursor:pointer;font-size:.8rem;text-transform:lowercase}
        .word-tile.on{background:#4338ca;color:#fff}
        .flash-card{background:#eef2ff;border:2px solid #a5b4fc;border-radius:16px;padding:20px;text-align:center;margin:12px 0}
        .word-big{font-size:2rem;font-weight:800;color:#4338ca;text-transform:lowercase}
        .explain-box{background:#eef2ff;border:2px dashed #a5b4fc;border-radius:14px;padding:16px;line-height:1.65;font-weight:600;margin-top:12px}
        .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:12px auto}
        .choice{font-family:inherit;font-weight:800;font-size:1rem;padding:14px;border:2px solid #c7d2fe;border-radius:14px;background:#fff;cursor:pointer}
        .choice.ok{background:#dcfce7;border-color:#86efac}
        .choice.no{background:#fee2e2;border-color:#fca5a5}
        .choice-emoji{font-size:2rem;padding:16px}
        .practice-q{font-size:1.15rem;font-weight:800;text-align:center;color:#4338ca;margin:12px 0;line-height:1.5}
        .blank{color:#ea580c;text-decoration:underline wavy #f97316}
        .hidden{display:none!important}
        .footer{text-align:center;font-size:.8rem;color:#64748b;padding-top:12px;margin-top:auto}
        .footer a{color:#4338ca;font-weight:700;text-decoration:none}
    </style>
</head>
<body>
<div class="main-container">
    <div class="sidebar">
        <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
        <h2>🇬🇧 English Hub</h2>
        <div class="field-group">
            <label class="field-label" for="topic">หัวข้อ</label>
            <select id="topic" class="select-field">
                <option value="grammar">📝 Grammar</option>
                <option value="sight">👁️ Sight Words</option>
                <option value="instructions">📋 Follow Instructions</option>
            </select>
        </div>
        <div id="ctrlGrammar">
            <label class="field-label">กฎไวยากรณ์</label>
            <div class="sub-tabs" id="gramTabs"></div>
        </div>
        <button type="button" class="btn btn-random" onclick="randomAction()">🎲 สุ่มฝึก</button>
        <button type="button" class="btn btn-answer" onclick="showAnswer()">✅ แสดงเฉลย</button>
    </div>
    <div class="display-area">
        <h1 id="mainTitle" class="main-title">Grammar — is/are · a/an · this/that</h1>
        <div id="viewGrammar">
            <div class="rule-box" id="ruleBox"></div>
            <div id="gramExamples" style="font-weight:700;line-height:1.8"></div>
        </div>
        <div id="viewSight" class="hidden">
            <div class="word-grid" id="wordGrid"></div>
            <div class="flash-card hidden" id="flashCard">
                <div class="word-big" id="flashWord">—</div>
                <p id="flashTh" style="color:#64748b;font-weight:600;margin-top:6px"></p>
                <p id="flashSent" style="margin-top:8px;font-weight:600"></p>
            </div>
        </div>
        <div id="viewInstr" class="hidden">
            <div class="rule-box">อ่านประโยคภาษาอังกฤษ → เลือก emoji ที่ตรงคำสั่ง<br>Circle = วงกลม · Underline = ขีดเส้นใต้ · Tick = ติ๊กถูก</div>
        </div>
        <div id="viewQuiz" class="hidden">
            <p class="practice-q" id="prQ">—</p>
            <div class="choices" id="prChoices"></div>
        </div>
        <div id="explain" class="explain-box">เลือกหัวข้อแล้วฝึกทำ</div>
        <div class="footer">ป.4-5 · คู่ <a href="/games/english/grammar-mini.html">grammar-mini</a> · <a href="/games/english/sight-words-p4.html">sight-words</a></div>
    </div>
</div>
<script>
const GAME_SLUG='english-grammar-p45-hub';
if(window.KAMPAI)window.KAMPAI.setSlug(GAME_SLUG);
document.getElementById('btnBack').onclick=()=>{if(KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else location.href='/h/nattapong';};
const GRAMMAR={
    isare:{label:'is/are',rule:'<strong>is</strong> กับ he/she/it · <strong>are</strong> กับ I/you/we/they · <strong>am</strong> กับ I',
        ex:['He <mark>is</mark> happy.','They <mark>are</mark> friends.','I <mark>am</mark> fine.'],
        practice:[{parts:['He',null,'tall.'],a:'is',opts:['is','are','am']},{parts:['They',null,'students.'],a:'are',opts:['is','are','am']}]},
    aan:{label:'a/an',rule:'<strong>a</strong> + consonant sound · <strong>an</strong> + vowel sound',
        ex:['<mark>a</mark> cat','<mark>an</mark> apple','<mark>a</mark> book','<mark>an</mark> egg'],
        practice:[{parts:[null,'orange'],a:'an',opts:['a','an']},{parts:[null,'dog'],a:'a',opts:['a','an']}]},
    demo:{label:'this/that',rule:'<strong>this/these</strong> = ใกล้ · <strong>that/those</strong> = ไกล',
        ex:['<mark>This</mark> is my pen.','<mark>That</mark> is a bird.'],
        practice:[{parts:['___ is my bag. (ใกล้)'],a:'This',opts:['This','That','These']},{parts:['___ are birds. (ไกล)'],a:'Those',opts:['This','That','Those']}]}
};
const SIGHT=[
    {w:'because',th:'เพราะว่า',s:'I study because I want to learn.'},
    {w:'important',th:'สำคัญ',s:'Reading is important.'},
    {w:'family',th:'ครอบครัว',s:'My family is kind.'},
    {w:'friend',th:'เพื่อน',s:'She is my best friend.'},
    {w:'beautiful',th:'สวยงาม',s:'The flower is beautiful.'},
    {w:'country',th:'ประเทศ',s:'Thailand is my country.'},
    {w:'remember',th:'จำ',s:'Remember to do homework.'},
    {w:'weather',th:'อากาศ',s:'The weather is hot.'},
    {w:'yesterday',th:'เมื่อวาน',s:'I went yesterday.'},
    {w:'together',th:'ด้วยกัน',s:'We work together.'},
    {w:'question',th:'คำถาม',s:'Do you have a question?'},
    {w:'answer',th:'คำตอบ',s:'Write your answer.'}
];
const INSTR=[
    {en:'Circle the apple.',th:'วงกลมแอปเปิ้ล',a:'🍎',w:['🍌','🍊','🥕']},
    {en:'Underline the dog.',th:'ขีดเส้นใต้สุนัข',a:'🐶',w:['🐱','🐮','🐷']},
    {en:'Tick the book.',th:'ติ๊กหนังสือ',a:'📚',w:['✏️','📐','🎒']},
    {en:'Circle the fish.',th:'วงกลมปลา',a:'🐟',w:['🐦','🦋','🐸']},
    {en:'Tick the happy face.',th:'ติ๊กหน้ายิ้ม',a:'😊',w:['😢','😴','😠']}
];
const TITLES={grammar:'Grammar — is/are · a/an · this/that',sight:'Sight Words — คำอ่านจำ ป.4-5',instructions:'Follow Instructions — อ่านคำสั่ง เลือกภาพ'};
let topic='grammar',gramKey='isare',sightIdx=0,quizItem=null,bodyQuiz=false;
function renderGrammar(){
    const g=GRAMMAR[gramKey];
    document.getElementById('ruleBox').innerHTML=g.rule;
    document.getElementById('gramExamples').innerHTML=g.ex.map(e=>`<div style="margin:6px 0;padding:10px;background:#fff;border:2px solid #e0e7ff;border-radius:10px">${e}</div>`).join('');
    document.getElementById('gramTabs').innerHTML=Object.entries(GRAMMAR).map(([k,v])=>`<button type="button" class="sub-tab ${k===gramKey?'on':''}" data-k="${k}">${v.label}</button>`).join('');
    document.getElementById('gramTabs').querySelectorAll('.sub-tab').forEach(btn=>{
        btn.onclick=()=>{gramKey=btn.dataset.k;renderGrammar();};
    });
    document.getElementById('explain').innerHTML=g.rule.replace(/<[^>]+>/g,'');
}
function renderSight(){
    document.getElementById('wordGrid').innerHTML=SIGHT.map((x,i)=>`<button type="button" class="word-tile ${i===sightIdx?'on':''}" data-i="${i}">${x.w}</button>`).join('');
    document.getElementById('wordGrid').querySelectorAll('.word-tile').forEach(btn=>{
        btn.onclick=()=>{sightIdx=+btn.dataset.i;const w=SIGHT[sightIdx];
            document.getElementById('flashCard').classList.remove('hidden');
            document.getElementById('flashWord').textContent=w.w;
            document.getElementById('flashTh').textContent=w.th;
            document.getElementById('flashSent').textContent=w.s;
            renderSight();
            document.getElementById('explain').innerHTML=`${w.w} = ${w.th}<br>${w.s}`;
            if(window.KAMPAI&&KAMPAI.sound)KAMPAI.sound.speak(w.w,'en-US');
        };
    });
}
function nextQuiz(){
    if(topic==='grammar'){
        const pool=GRAMMAR[gramKey].practice;
        const p=pool[Math.floor(Math.random()*pool.length)];
        const sent=p.parts.map(x=>x===null?'<span class="blank">___</span>':x).join(' ');
        quizItem={q:sent,a:p.a,opts:p.opts,plain:true};
    }else if(topic==='sight'){
        const w=SIGHT[Math.floor(Math.random()*SIGHT.length)];
        const wrong=SIGHT.filter(x=>x.w!==w.w).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.th);
        quizItem={q:`"${w.w}" แปลว่า?`,a:w.th,opts:[w.th,...wrong].sort(()=>Math.random()-0.5),plain:false};
    }else{
        const it=INSTR[Math.floor(Math.random()*INSTR.length)];
        quizItem={q:`"${it.en}"<br><small>${it.th}</small>`,a:it.a,opts:[it.a,...it.w].sort(()=>Math.random()-0.5),emoji:true};
    }
    document.getElementById('prQ').innerHTML=quizItem.q;
    const el=document.getElementById('prChoices');
    el.className='choices'+(quizItem.emoji?'':'');
    el.innerHTML=quizItem.opts.map(o=>`<button type="button" class="choice ${quizItem.emoji?'choice-emoji':''}">${o}</button>`).join('');
    el.querySelectorAll('.choice').forEach(btn=>{
        btn.onclick=()=>{const ok=btn.textContent===quizItem.a;btn.classList.add(ok?'ok':'no');
            el.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===quizItem.a)b.classList.add('ok');});
            document.getElementById('explain').innerHTML=ok?'✓ Correct!':`✗ Answer: ${quizItem.a}`;};
    });
}
function render(){
    bodyQuiz=false;
    document.getElementById('mainTitle').textContent=TITLES[topic];
    document.getElementById('viewGrammar').classList.toggle('hidden',topic!=='grammar');
    document.getElementById('viewSight').classList.toggle('hidden',topic!=='sight');
    document.getElementById('viewInstr').classList.toggle('hidden',topic!=='instructions');
    document.getElementById('viewQuiz').classList.add('hidden');
    document.getElementById('ctrlGrammar').classList.toggle('hidden',topic!=='grammar');
    if(topic==='grammar')renderGrammar();
    else if(topic==='sight'){renderSight();document.getElementById('explain').innerHTML='แตะคำเพื่อดูความหมายและฟังเสียง';}
    else document.getElementById('explain').innerHTML='กดสุ่มฝึกเพื่อทำแบบฝึกหัด';
}
function randomAction(){
    bodyQuiz=true;
    document.getElementById('viewGrammar').classList.add('hidden');
    document.getElementById('viewSight').classList.add('hidden');
    document.getElementById('viewInstr').classList.add('hidden');
    document.getElementById('viewQuiz').classList.remove('hidden');
    nextQuiz();
}
function showAnswer(){
    if(bodyQuiz&&quizItem)document.getElementById('explain').innerHTML=`Answer: <strong>${quizItem.a}</strong>`;
    else if(topic==='grammar')renderGrammar();
    else if(topic==='sight'&&SIGHT[sightIdx]){const w=SIGHT[sightIdx];document.getElementById('explain').innerHTML=`${w.w} = ${w.th}`;}
}
document.getElementById('topic').onchange=e=>{topic=e.target.value;render();};
render();
</script>
</body>
</html>
