          <strong>คำถาม:</strong> ${e(item.prompt)}
        </div>
      </div>
      <div class="answer-write-area">
        <div class="answer-line-fill">
          <span class="ans-prefix">คำตอบ:</span>
          <span class="teacher-ans-text">${e(item.answer)}</span>
          <span class="student-placeholder">.....................................................................................................................................................................................</span>
        </div>
        <div class="answer-line-fill">
          <span class="ans-prefix">หลักฐานในข้อความ:</span>
          <span class="teacher-ans-text">${e(item.evidence)}</span>
          <span class="student-placeholder">.....................................................................................................................................................................................</span>
        </div>
      </div>
    `;
    return html;
  }
};
</script>
