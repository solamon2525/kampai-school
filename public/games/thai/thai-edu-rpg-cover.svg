<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a5c"/><stop offset="0.5" stop-color="#12122a"/><stop offset="1" stop-color="#0a0a18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="0.5" stop-color="#f5c842"/><stop offset="1" stop-color="#c9962a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#9b5de5" stop-opacity="0.30"/><stop offset="1" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sword" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bff0ff"/><stop offset="1" stop-color="#4cc9f0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="320" rx="680" ry="380" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="120" cy="90" r="2" opacity="0.6"/><circle cx="300" cy="150" r="1.5" opacity="0.5"/><circle cx="1080" cy="110" r="2" opacity="0.6"/>
    <circle cx="980" cy="200" r="1.5" opacity="0.4"/><circle cx="200" cy="260" r="1.5" opacity="0.5"/><circle cx="1180" cy="300" r="2" opacity="0.5"/>
    <circle cx="60" cy="380" r="1.5" opacity="0.4"/><circle cx="1220" cy="170" r="1.5" opacity="0.5"/>
  </g>
  <!-- floating subject symbols (รอบ ๆ ไม่บังคน) -->
  <text x="170" y="470" font-size="78" opacity="0.18" text-anchor="middle">➗</text>
  <text x="1110" y="500" font-size="78" opacity="0.18" text-anchor="middle">📜</text>
  <text x="250" y="600" font-size="56" opacity="0.16" text-anchor="middle">⚔️</text>

  <!-- badge -->
  <g transform="translate(640,108)">
    <rect x="-235" y="-26" width="470" height="52" rx="26" fill="#ffffff" opacity="0.10"/>
    <text x="0" y="2" font-size="25" font-weight="600" fill="#e8d9ff" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">⚔️ KAMPAI · บูรณาการ ไทย+คณิต · ป.4–5</text>
  </g>
  <!-- title -->
  <text x="640" y="232" font-size="92" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">ภารกิจกอบกู้อาณาจักร</text>
  <text x="640" y="300" font-size="29" font-weight="700" fill="#c9b6ff" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">ตอบคำถาม · ปราบบอส · เก็บการ์ด · เลื่อนเลเวล</text>

  <!-- chibi student hero (ซ้าย กลางล่าง) ถือดาบเรืองแสง — เด็กเด่น ไม่มีของบัง -->
  <g transform="translate(470,540)" stroke="#0a0a18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- glowing sword (ชูขึ้น ด้านข้าง ไม่บังตัว) -->
    <g transform="translate(60,-30) rotate(28)">
      <rect x="-7" y="-150" width="14" height="150" rx="6" fill="url(#sword)" stroke="#2a6f8f"/>
      <rect x="-26" y="-2" width="52" height="14" rx="5" fill="#c9962a" stroke="#0a0a18"/>
      <rect x="-6" y="10" width="12" height="34" rx="4" fill="#8a5a20" stroke="#0a0a18"/>
      <circle cx="0" cy="-150" r="10" fill="#ffffff" opacity="0.85" stroke="none"/>
    </g>
    <!-- legs -->
    <path d="M -12 24 L -18 70" fill="none" stroke-width="14"/>
    <path d="M 12 24 L 18 70" fill="none" stroke-width="14"/>
    <!-- navy shorts -->
    <rect x="-22" y="2" width="44" height="30" rx="8" fill="#1a1a5c"/>
    <!-- white school shirt -->
    <path d="M -26 -36 q 26 -13 52 0 l 5 38 q -30 13 -62 0 z" fill="#f5f5fa"/>
    <!-- arms (ซ้ายเท้าสะเอว ขวาถือดาบ) -->
    <path d="M -26 -24 L -44 -8" fill="none" stroke-width="12"/>
    <path d="M 26 -24 L 50 -36" fill="none" stroke-width="12"/>
    <!-- head -->
    <circle cx="0" cy="-62" r="32" fill="#fcd9b6"/>
    <path d="M -32 -68 q 32 -36 64 0 q -8 -16 -32 -16 q -24 0 -32 16 z" fill="#3b2a1d"/>
    <circle cx="-11" cy="-62" r="3.6" fill="#0a0a18" stroke="none"/>
    <circle cx="13" cy="-62" r="3.6" fill="#0a0a18" stroke="none"/>
    <path d="M -10 -49 q 10 9 22 0" fill="none" stroke-width="3"/>
  </g>

  <!-- boss silhouette (ขวา ไกล ๆ ไม่บังเด็ก) -->
  <g transform="translate(1015,470)" opacity="0.92">
    <text x="0" y="0" font-size="150" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">👹</text>
    <text x="-2" y="-118" font-size="34" text-anchor="middle">👑</text>
  </g>

  <!-- footer -->
  <g transform="translate(640,676)">
    <rect x="-285" y="-24" width="570" height="48" rx="24" fill="#f5c842" opacity="0.16"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#ffe27a" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">RPG ผลัดตา · 15 บอส 5 โซน · ไวพจน์ + ตัวประกอบ/ห.ร.ม./ค.ร.น.</text>
  </g>
</svg>
