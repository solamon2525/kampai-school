<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-punctuation-hub/index.html"><meta name="curriculum-indicators" content="ท 4.1 ป.4/3, ท 4.1 ป.4/4"><title>ใบงานเครื่องหมายวรรคตอน Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.15" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.15" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.mark-box{display:inline-flex;align-items:center;justify-content:center;min-width:12mm;min-height:10mm;border:1.6px solid var(--ws-accent);border-radius:4px;font-size:14pt;font-weight:800;color:var(--ws-accent);margin:.8mm 0;padding:1mm 2mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:7pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>❗ ใบงานเครื่องหมายวรรคตอน Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="mark">เครื่องหมาย</option><option value="fix">แก้วรรคตอน</option><option value="use">ใช้ถูกต้อง</option><option value="read">อ่านจังหวะ</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.15"></script><script>
const PUNCT_ITEMS=[
{type:'mark',prompt:'จุด (.) ใช้เมื่อ',context:'.',choices:['จบประโยค','คำถาม'],answer:'จบประโยค',step1:'จบความ',step2:'.',step3:'จบประโยค'},
{type:'mark',prompt:'? ใช้เมื่อ',context:'?',choices:['ประโยคคำถาม','อ้างคำพูด'],answer:'ประโยคคำถาม',step1:'ถาม',step2:'?',step3:'คำถาม'},
{type:'mark',prompt:'! ใช้เมื่อ',context:'!',choices:['แสดงอารมณ์รุนแรง','จบเรื่อง'],answer:'แสดงอารมณ์รุนแรง/ตื่นเต้น',step1:'อารมณ์',step2:'!',step3:'ตื่นเต้น/สั่ง'},
{type:'mark',prompt:'"  " ใช้เมื่อ',context:'อัญประกาศ',choices:['อ้างคำพูด','จบประโยค'],answer:'อ้างคำพูดโดยตรง',step1:'พูด',step2:'" "',step3:'อ้างคำพูด'},
{type:'fix',prompt:'แก้: "วันนี้อากาศดี"',context:'ขาดจุด',choices:['วันนี้อากาศดี.','วันนี้อากาศดี?'],answer:'วันนี้อากาศดี.',step1:'จบประโยค',step2:'.',step3:'วันนี้อากาศดี.'},
{type:'fix',prompt:'แก้: "คุณชื่ออะไร"',context:'คำถาม',choices:['คุณชื่ออะไร?','คุณชื่ออะไร.'],answer:'คุณชื่ออะไร?',step1:'ถาม',step2:'?',step3:'คุณชื่ออะไร?'},
{type:'use',prompt:'( ) ใช้เมื่อ',context:'วงเล็บ',choices:['ข้อความเสริม/อธิบาย','จบประโยค'],answer:'ข้อความเสริมหรืออธิบาย',step1:'เสริม',step2:'( )',step3:'อธิบาย'},
{type:'use',prompt:'เครื่องหมายคั่น (,) ใช้เมื่อ',context:'comma',choices:['คั่นส่วน/พัก','จบประโยค'],answer:'คั่นส่วนหรือพัก',step1:'ไม่จบประโยค',step2:',',step3:'คั่น/พัก'},
{type:'read',prompt:'"ไปโรงเรียน. แล้วกลับบ้าน." กี่ประโยค',context:'2 ประโยค',choices:['2','1'],answer:'2 ประโยค',step1:'. จบประโยคแรก',step2:'ประโยคสอง',step3:'2'},
{type:'read',prompt:'"ช่วยด้วย!" อารมณ์',context:'!',choices:['ตกใจ/ขอความช่วยเหลือ','ถาม'],answer:'ตกใจ/ขอความช่วยเหลือ',step1:'!',step2:'อารมณ์รุน',step3:'ขอความช่วย'},
{type:'fix',prompt:'แก้: ครูพูดว่า "ตั้งใจเรียน"',context:'อัญประกาศ',choices:['ครูพูดว่า "ตั้งใจเรียน"','ครูพูดว่า ตั้งใจเรียน.'],answer:'ครูพูดว่า "ตั้งใจเรียน"',step1:'อ้างคำพูด',step2:'" "',step3:'มีอัญประกาศ'},
{type:'use',prompt:'... ใช้เมื่อ',context:'จุดไข่ปลา',choices:['ข้อความค้าง/ไม่จบ','จบสนุก'],answer:'ข้อความค้างหรือไม่จบ',step1:'ค้าง',step2:'...',step3:'ไม่จบ/ค้าง'}
];
const SKILL={mark:'เครื่องหมาย',fix:'แก้',use:'ใช้',read:'อ่านจังหวะ'};
window.WORKSHEET_CONFIG={
  icon:'❗',title:'ใบงานเครื่องหมายวรรคตอน Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'วรรคตอน Hub',
  sourceMediaUrl:'/games/thai/thai-punctuation-hub/index.html',indicators:['ท 4.1 ป.4/3','ท 4.1 ป.4/4'],
  directions:'ดูเครื่องหมาย → ติ๊กชนิด → เลือกใช้ → เขียนประโยคถูกต้อง',
  getItems(t){return t==='mixed'?PUNCT_ITEMS:PUNCT_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const s1=item.step1||item.s1||'',s2=item.step2||item.s2||'',s3=item.step3||item.s3||'';
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="mark-box">'+e(item.context)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ .</div><div class="tick-box">□ ?</div><div class="tick-box">□ !</div><div class="tick-box">□ " "</div><div class="tick-box">□ ,</div></div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดู</span><div class="step-body"><span class="work-fill">'+e(s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 เลือก</span><div class="step-body"><span class="work-fill">'+e(s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ใส่</span><div class="step-body"><span class="work-fill">'+e(s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.15"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.15"></script></body></html>
