<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-writing-hub/index.html"><meta name="curriculum-indicators" content="ท 2.1 ป.4/1, ท 4.1 ป.5/3"><title>ใบงานการเขียน Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.184.0" rel="stylesheet">
<style>
.plan-slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1mm;margin:1mm 0}
.plan-slot{border:1.4px dashed var(--ws-accent);border-radius:3px;min-height:10mm;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-accent)}
.fix-box{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin:1mm 0}
.fix-box div{border:1px dashed var(--ws-line);border-radius:3px;min-height:8mm;padding:.5mm;font-size:7pt;font-weight:700}
.fix-box .wrong{color:var(--ws-danger)}.fix-box .right{color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .plan-slot{min-height:12mm}.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>✏️ ใบงานการเขียน Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="plan">วางแผนเขียน</option><option value="paragraph">ย่อหน้า</option><option value="revise">แก้ไข</option><option value="style">สำนวน</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const WRITE_ITEMS=[
{type:'plan',prompt:'เขียนเรื่อง "วันหยุด" วางแผน 3 ส่วน',context:'วันหยุด',choices:['เริ่ม–เหตุการณ์–จบ','เขียนอย่างเดียว'],answer:'เริ่ม(แนะนำ) → เหตุการณ์ → จบ(สรุป)',s1:'เริ่ม = แนะนำ',s2:'กลาง = เหตุการณ์',s3:'จบ = สรุป'},
{type:'plan',prompt:'ก่อนเขียน ควรทำอะไร',context:'ขั้นตอน',choices:[' brainstorm + โครงร่าง','เขียนเลย'],answer:'ระดมความคิด + ทำโครงร่าง',s1:'คิดหัวข้อ',s2:'โครงร่าง 3 ส่วน',s3:'แล้วเขียน'},
{type:'paragraph',prompt:'ย่อหน้าแรกควรมี',context:'ย่อหน้า 1',choices:['แนะนำหัวข้อ','สรุป'],answer:'แนะนำหัวข้อ/ดึงดูดผู้อ่าน',s1:'เริ่มเรื่อง',s2:'แนะนำหัวข้อ',s3:'ดึงดูดผู้อ่าน'},
{type:'paragraph',prompt:'ย่อหน้าสุดท้ายควร',context:'ย่อหน้าสุดท้าย',choices:['สรุป/ข้อคิด','เริ่มใหม่'],answer:'สรุปและ/หรือข้อคิด',s1:'ปิดเรื่อง',s2:'สรุป',s3:'ข้อคิด'},
{type:'revise',prompt:'แก้: "ฉันไปไปโรงเรียน"',context:'ฉันไปไปโรงเรียน',choices:['ฉันไปโรงเรียน','ฉันไปไป'],answer:'ฉันไปโรงเรียน',s1:'หาคำซ้ำ: ไป',s2:'ตัดคำซ้ำ',s3:'ฉันไปโรงเรียน'},
{type:'revise',prompt:'แก้: "เขาชอบมากๆ มาก"',context:'เขาชอบมากๆ มาก',choices:['เขาชอบมากๆ','เขาชอบมาก มาก'],answer:'เขาชอบมากๆ',s1:'มากซ้ำ',s2:'เหลือมากๆ',s3:'เขาชอบมากๆ'},
{type:'style',prompt:'การเขียนบรรยาย vs พรรณนา',context:'สำนวน',choices:['บรรยาย=เหตุการณ์ · พรรณนา=ภาพ','เหมือนกัน'],answer:'บรรยายเล่าเหตุการณ์ · พรรณนาวาดภาพ',s1:'บรรยาย = เกิดอะไร',s2:'พรรณนา = หน้าตา',s3:'ต่างกัน'},
{type:'style',prompt:'ใช้คำเชื่อม "จากนั้น" เมื่อ',context:'คำเชื่อม',choices:['ต่อเหตุการณ์ถัดไป','จบเรื่อง'],answer:'เชื่อมเหตุการณ์ถัดไป (ลำดับเวลา)',s1:'ลำดับเวลา',s2:'จากนั้น',s3:'เหตุการณ์ถัด'},
{type:'plan',prompt:'เขียนจดหมายถึงครู ควรมี',context:'จดหมาย',choices:['คำขึ้นต้น เนื้อหา คำลงท้าย','แค่เนื้อหา'],answer:'คำขึ้นต้น + เนื้อหา + คำลงท้าย + ชื่อ',s1:'เรียนครู',s2:'เนื้อหา',s3:'ลงท้าย+ชื่อ'},
{type:'paragraph',prompt:'1 ย่อหน้าควรมีกี่ประโยค',context:'ย่อหน้า',choices:['3–5 ประโยค (เหมาะสม)','20 ประโยค'],answer:'ประมาณ 3–5 ประโยค เน้นประเด็นเดียว',s1:'1 ประเด็น',s2:'3–5 ประโยค',s3:'ไม่ยาวเกิน'},
{type:'revise',prompt:'ตรวจก่อนส่ง: ต้องดู',context:'ตรวจ',choices:['ตัวสะกด วรรคตอน ความสมบูรณ์','แค่อ่านครั้งเดียว'],answer:'ตัวสะกด · วรรคตอน · ความต่อเนื่อง · ความสมบูรณ์',s1:'สะกด',s2:'วรรคตอน',s3:'สมบูรณ์'},
{type:'style',prompt:'เขียนให้สุภาพ ใช้',context:'สุภาพ',choices:['ครับ/ค่ะ คำสุภาพ','คำหยาบ'],answer:'ครับ/ค่ะ และคำสุภาพ',s1:'สุภาพ',s2:'ครับ/ค่ะ',s3:'เหมาะสม'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'thai-writing-hub',icon:'✏️',title:'ใบงานการเขียน Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'การเขียน Hub',
  sourceMediaUrl:'/games/thai/thai-writing-hub/index.html',indicators:['ท 2.1 ป.4/1','ท 4.1 ป.5/3'],
  directions:'วางแผน เริ่ม|เหตุการณ์|จบ · แก้ข้อความ · เลือกสำนวน',
  getItems(t){return t==='mixed'?WRITE_ITEMS:WRITE_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    let mid='';
    if(item.type==='plan'||item.type==='paragraph')mid='<div class="plan-slots"><div class="plan-slot">1 เริ่ม / แนะนำ</div><div class="plan-slot">2 เหตุการณ์ / เนื้อหา</div><div class="plan-slot">3 จบ / สรุป</div></div>';
    if(item.type==='revise')mid='<div class="fix-box"><div class="wrong">ผิด: '+e(item.context)+'</div><div class="right">ถูก: เขียนใหม่</div></div>';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="q-context">'+e(item.context)+'</div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +mid+'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 วางแผน</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 ลงมือ</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ตรวจ</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
