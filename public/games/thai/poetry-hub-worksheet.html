<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-poetry-hub/index.html"><meta name="curriculum-indicators" content="ท 5.1 ป.4/4, ท 4.1 ป.4/5"><title>ใบงานบทกวี Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.15" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.15" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.word-bank{display:flex;flex-wrap:wrap;gap:1mm;margin:.8mm 0}
.word-bank span{border:1px solid var(--ws-line);border-radius:3px;padding:.4mm 1.5mm;font-size:8pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>🎵 ใบงานบทกวี Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="form">รูปแบบกลอน</option><option value="rhyme">สัมผัส</option><option value="meaning">ความหมาย</option><option value="compose">แต่งกลอน</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.15"></script><script>
const POETRY_ITEMS=[
{type:'form',prompt:'กลอนแปดมีกี่บท',context:'กลอนแปด',choices:['8','4'],answer:'8 บท',step1:'แปด=8',step2:'8 บท',step3:'8'},
{type:'form',prompt:'โคลงมีกี่บรรทัด',context:'โคลง',choices:['4','8'],answer:'4 บรรทัด',step1:'โคลงสั้น',step2:'4 บรรทัด',step3:'4'},
{type:'rhyme',prompt:'สัมผัสคือ',context:'สัมผัส',choices:['เสียงท้ายสลอง','ความหมายเหมือน'],answer:'เสียงท้ายคำสลองกัน',step1:'ฟังเสียงท้าย',step2:'สลอง',step3:'สัมผัส'},
{type:'rhyme',prompt:'คำว่า "ดอก" สัมผัส " ___ "',context:'ดอก',choices:['หมอก','ต้น'],answer:'หมอก (สัมผัส อก)',step1:'ท้าย อก',step2:'หมอก',step3:'สัมผัส'},
{type:'meaning',prompt:'กลอนสอนใจสอนอะไร',context:'กลอนสอนใจ',choices:['ข้อคิดชีวิต','เล่าเรื่องราว'],answer:'ข้อคิด คติชีวิต',step1:'สอนใจ',step2:'ข้อคิด',step3:'คติชีวิต'},
{type:'meaning',prompt:'อ่านบทกวีแล้วหาอารมณ์',context:'อารมณ์',choices:['เศร้า สนุก ชื่นชม ฯลฯ','มีแค่หนึ่ง'],answer:'เช่น เศร้า สนุก ชื่นชม ตามเนื้อหา',step1:'อ่านเนื้อหา',step2:'รู้สึก',step3:'อารมณ์'},
{type:'compose',prompt:'เติมคำสัมผัส: ฟ้า ___ ใส',context:'ฟ้า ___ ใส',choices:['สี','มืด'],answer:'สี (ฟ้าสีใส)',step1:'สัมผัสหรือความหมาย',step2:'สี',step3:'ฟ้าสีใส'},
{type:'compose',prompt:'แต่งโคลง 2 บรรทัดเกี่ยวกับธรรมชาติ',context:'แต่ง',choices:['เช่น ต้นไม้เขียว / ลมพัดเบา','เช่น กินข้าว'],answer:'เช่น ต้นไม้เขียว / ลมพัดเบา',step1:'เลือกธรรมชาติ',step2:'2 บรรทัด',step3:'ภาพธรรมชาติ'},
{type:'form',prompt:'กลอนสุภาพ vs กลอนแปด',context:'รูปแบบ',choices:['สุภาพ=4 วรรค · แปด=8 บท','เหมือนกัน'],answer:'สุภาพ 4 วรรค · แปด 8 บท',step1:'รูปแบบต่าง',step2:'นับวรรค/บท',step3:'ต่างกัน'},
{type:'rhyme',prompt:'ทำไมสัมผัสช่วยจำบทกวี',context:'สัมผัส',choices:['เสียงสลองจำง่าย','ไม่ช่วย'],answer:'เสียงสลองทำให้จำและไหลลื่น',step1:'จังหวะ',step2:'สลอง',step3:'จำง่าย'},
{type:'meaning',prompt:'คำอุปมาในบทกวีคือ',context:'อุปมา',choices:['เปรียบเทียบ','เล่าเหตุจริง'],answer:'เปรียบเทียบให้เห็นภาพ',step1:'ไม่ตรงตัว',step2:'เปรียบ',step3:'อุปมา'},
{type:'compose',prompt:'หาคำสัมผัสกับ "ใจ"',context:'ใจ',choices:['ไหว','มือ'],answer:'ไหว (ใจไหว)',step1:'ท้าย ใจ',step2:'ไหว',step3:'สัมผัส'}
];
const SKILL={form:'รูปแบบ',rhyme:'สัมผัส',meaning:'ความหมาย',compose:'แต่งกลอน'};
window.WORKSHEET_CONFIG={
  icon:'🎵',title:'ใบงานบทกวี Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'บทกวี Hub',
  sourceMediaUrl:'/games/thai/thai-poetry-hub/index.html',indicators:['ท 5.1 ป.4/4','ท 4.1 ป.4/5'],
  directions:'ติ๊กทักษะ → ดูรูปแบบ/สัมผัส → หาความหมาย → สรุปหรือแต่ง',
  getItems(t){return t==='mixed'?POETRY_ITEMS:POETRY_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const s1=item.step1||item.s1||'',s2=item.step2||item.s2||'',s3=item.step3||item.s3||'';
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="word-bank"><span>'+e(item.context)+'</span></div>'
      +'<div class="tick-grid"><div class="tick-box">□ รูปแบบ</div><div class="tick-box">□ สัมผัส</div><div class="tick-box">□ ความหมาย</div><div class="tick-box">□ แต่งกลอน</div></div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดู</span><div class="step-body"><span class="work-fill">'+e(s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 สัมผัส/กฎ</span><div class="step-body"><span class="work-fill">'+e(s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.15"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.15"></script></body></html>
