<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สื่อแผนภาพสระไทย — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #9a3412; --line: #fdba74; --muted: #64748b; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(145deg, #ffedd5 0%, #fff7ed 40%, #fed7aa 100%);
      min-height: 100%; color: #0f172a; padding: 12px;
    }
    .shell {
      max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden;
      display: flex; flex-direction: column; min-height: calc(100vh - 24px);
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px;
      background: linear-gradient(90deg, #9a3412, #c2410c 50%, #ea580c); color: #fff;
    }
    header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 160px; }
    header .badge {
      font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px;
      border-radius: 999px; font-weight: 700;
    }
    .btn {
      font-family: inherit; font-weight: 700; border: none; border-radius: 12px;
      padding: 10px 14px; cursor: pointer; font-size: .95rem; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-back {
      background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
      padding: 8px 12px; font-size: .85rem;
    }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fff7ed;
      border-bottom: 1px solid #fed7aa; align-items: center;
    }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #fdba74; }
    .seg button {
      font-family: inherit; font-weight: 800; border: none; background: #fff;
      color: var(--deep); padding: 8px 12px; cursor: pointer; font-size: .85rem;
    }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #9a3412; font-weight: 600; flex: 1; min-width: 160px; }
    .stage { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
    @media (min-width: 820px) { .stage { grid-template-columns: 1fr 300px; } }
    .grid-wrap { padding: 14px; overflow: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
    .tile {
      border-radius: 14px; border: 2px solid #fdba74; background: #fff; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; font-weight: 800; color: var(--deep); min-height: 72px; padding: 8px; user-select: none;
    }
    .tile:hover { border-color: #ea580c; background: #fff7ed; }
    .tile.on {
      background: linear-gradient(145deg, #fb923c, #ea580c); color: #fff; border-color: #c2410c;
    }
    .tile .form { font-size: 1.6rem; line-height: 1.1; }
    .tile .name { font-size: .7rem; font-weight: 700; opacity: .85; }
    .detail {
      background: #fff7ed; border-top: 1px solid #fed7aa; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    @media (min-width: 820px) { .detail { border-top: none; border-left: 1px solid #fed7aa; } }
    .detail-empty { color: var(--muted); font-weight: 600; text-align: center; margin: auto 0; line-height: 1.5; }
    .detail-card { display: none; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .detail-card.show { display: flex; }
    .big-form { font-size: 3.5rem; font-weight: 800; color: var(--deep); line-height: 1.1; }
    .big-name {
      font-size: 1.2rem; font-weight: 800; color: #c2410c;
      background: #fff; border: 2px solid #fdba74; border-radius: 999px; padding: 6px 16px;
    }
    .pos-hint { font-size: .9rem; font-weight: 700; color: #9a3412; }
    .words { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .word-btn {
      font-family: inherit; font-weight: 800; font-size: 1.15rem; border: 2px solid #fdba74;
      background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; color: #0f172a; text-align: left; width: 100%;
    }
    .word-btn:hover { background: #ffedd5; }
    .word-btn .emoji { font-size: 1.6rem; }
    .word-btn .meta { display: flex; flex-direction: column; gap: 2px; }
    .word-btn .th { font-size: 1.25rem; }
    .word-btn .note { font-size: .8rem; font-weight: 600; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .actions .btn { flex: 1; min-width: 110px; }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
      padding: 10px 16px; font-size: .8rem; color: var(--muted); border-top: 1px solid #fed7aa;
    }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>🌸 แผนภาพสระไทย</h1>
      <span class="badge">ป.1–2 · ภาษาไทย</span>
    </header>

    <div class="toolbar">
      <span class="seg" id="tabSeg">
        <button type="button" data-tab="short" class="on">สระสั้น</button>
        <button type="button" data-tab="long">สระยาว</button>
        <button type="button" data-tab="mix">สระประสม</button>
      </span>
      <p class="hint">แตะสระ → ฟังชื่อสระ + คำตัวอย่าง · คู่กับเกมตะลุยด่านสระพาสนุก</p>
      <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    </div>

    <div class="stage">
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>
      <aside class="detail">
        <div class="detail-empty" id="detailEmpty">แตะสระทางซ้าย<br>เพื่อฟังและดูคำตัวอย่าง</div>
        <div class="detail-card" id="detailCard">
          <div class="big-form" id="bigForm"></div>
          <div class="big-name" id="bigName"></div>
          <p class="pos-hint" id="posHint"></p>
          <div class="words" id="words"></div>
          <div class="actions">
            <button type="button" class="btn btn-accent" id="btnSound">🔊 ฟังชื่อสระ</button>
            <button type="button" class="btn btn-primary" id="btnAllWords">🗣️ อ่านคำทั้งหมด</button>
          </div>
        </div>
      </aside>
    </div>

    <div class="footer">
      <span>🏫 โรงเรียนบ้านคำไผ่ · สื่อการสอน</span>
      <a href="/play/thai-sara-run">เล่นเกมตะลุยด่านสระพาสนุก →</a>
    </div>
  </div>

  <script>
    (function () {
      var MEDIA_SLUG = 'thai-sara-chart';
      if (window.KAMPAI) { try { window.KAMPAI.setSlug(MEDIA_SLUG); } catch (e) {} }

      function v(id, form, name, pos, words) {
        return { id: id, form: form, name: name, pos: pos, words: words };
      }
      function w(th, note, emoji) { return { th: th, note: note, emoji: emoji }; }

      var SHORT = [
        v('a', 'อะ', 'สระอะ', 'อยู่หลังพยัญชนะ · รูป -ะ', [w('กะ','กะ+ทะ=กะทะ','🍲'), w('จะ','จะไป','🚶')]),
        v('i', 'อิ', 'สระอิ', 'อยู่เหนือพยัญชนะ · รูป -ิ', [w('กิ','กิ+ริ=กิริยา','📝'), w('ติ','ติ+ด=ติด','📌')]),
        v('ue', 'อึ', 'สระอึ', 'อยู่เหนือพยัญชนะ · รูป -ึ', [w('นึก','นึกคิด','💭'), w('ตึก','ตึกสูง','🏢')]),
        v('u', 'อุ', 'สระอุ', 'อยู่ใต้พยัญชนะ · รูป -ุ', [w('ตุ','ตุ+ก=ตุ๊กตา','🪆'), w('กุ','กุ+ญแจ','🔑')]),
        v('e', 'เอะ', 'สระเอะ', 'อยู่หน้าพยัญชนะ · รูป เ-ะ', [w('เกะ','เกะกะ','📦'), w('เตะ','เตะบอล','⚽')]),
        v('ae', 'แอะ', 'สระแอะ', 'อยู่หน้าพยัญชนะ · รูป แ-ะ', [w('และ','และ','➕'), w('แพะ','แพะ','🐐')]),
        v('o', 'โอะ', 'สระโอะ', 'อยู่หน้าพยัญชนะ · รูป โ-ะ', [w('โต๊ะ','โต๊ะ','🪑'), w('โป๊ะ','โป๊ะ','🛶')]),
        v('aw', 'เอาะ', 'สระเอาะ', 'รูป เ-าะ', [w('เกาะ','เกาะ','🏝️'), w('เจาะ','เจาะ','🔩')]),
        v('oe', 'เออะ', 'สระเออะ', 'รูป เ-อะ', [w('เงิน','เงิน','💰'), w('เนิน','เนินเขา','⛰️')]),
      ];

      var LONG = [
        v('aa', 'อา', 'สระอา', 'อยู่หลังพยัญชนะ · รูป -า', [w('มา','มา','👋'), w('ตา','ตา','👁️')]),
        v('ii', 'อี', 'สระอี', 'อยู่เหนือพยัญชนะ · รูป -ี', [w('มี','มี','✅'), w('ดี','ดี','👍')]),
        v('uue', 'อือ', 'สระอือ', 'อยู่เหนือพยัญชนะ · รูป -ือ', [w('มือ','มือ','✋'), w('ถือ','ถือ','🎒')]),
        v('uu', 'อู', 'สระอู', 'อยู่ใต้พยัญชนะ · รูป -ู', [w('ดู','ดู','👀'), w('ปู','ปู','🦀')]),
        v('ee', 'เอ', 'สระเอ', 'อยู่หน้าพยัญชนะ · รูป เ-', [w('เท','เทน้ำ','💧'), w('เล','เลข','🔢')]),
        v('aae', 'แอ', 'สระแอ', 'อยู่หน้าพยัญชนะ · รูป แ-', [w('แก','แก้ว','🥛'), w('แพ','แพ','🛶')]),
        v('oo', 'โอ', 'สระโอ', 'อยู่หน้าพยัญชนะ · รูป โ-', [w('โต','โต','📏'), w('โป','โปสเตอร์','🖼️')]),
        v('aww', 'ออ', 'สระออ', 'อยู่หลังพยัญชนะ · รูป -อ', [w('กอ','กอ','🌿'), w('รอ','รอ','⏳')]),
        v('oee', 'เออ', 'สระเออ', 'รูป เ-อ', [w('เธอ','เธอ','😊'), w('เนอ','เนอ','🧸')]),
      ];

      var MIX = [
        v('am', 'อำ', 'สระอำ', 'รูป -ำ', [w('ทำ','ทำ','🛠️'), w('น้ำ','น้ำ','💧')]),
        v('ai1', 'ใอ', 'สระไอ ไม้ม้วน', 'รูป ใ-', [w('ใจ','ใจ','❤️'), w('ใบ','ใบไม้','🍃')]),
        v('ai2', 'ไอ', 'สระไอ ไม้มลาย', 'รูป ไ-', [w('ไป','ไป','🚶'), w('ไต','ไต','🫘')]),
        v('ao', 'เอา', 'สระเอา', 'รูป เ-า', [w('เขา','เขา','⛰️'), w('เบา','เบา','🪶')]),
        v('ia', 'เอีย', 'สระเอีย', 'รูป เ-ีย', [w('เมีย','เมีย','👩'), w('เสีย','เสีย','💔')]),
        v('uea', 'เอือ', 'สระเอือ', 'รูป เ-ือ', [w('เรือ','เรือ','⛵'), w('เกลือ','เกลือ','🧂')]),
        v('ua', 'อัว', 'สระอัว', 'รูป -ัว', [w('ตัว','ตัว','🧍'), w('วัว','วัว','🐄')]),
      ];

      var DATA = { short: SHORT, long: LONG, mix: MIX };
      var tab = 'short';
      var selected = null;

      var grid = document.getElementById('grid');
      var detailEmpty = document.getElementById('detailEmpty');
      var detailCard = document.getElementById('detailCard');

      function speak(text, lang) {
        lang = lang || 'th-TH';
        if (window.KAMPAI && KAMPAI.sound && typeof KAMPAI.sound.speak === 'function') {
          try {
            if (KAMPAI.sound.speak.length >= 3) KAMPAI.sound.speak(text, lang, true);
            else KAMPAI.sound.speak(text, lang);
            return;
          } catch (e) {}
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = lang;
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
        }
      }

      function speakSara(it) {
        speak(it.name + ' เช่น ' + it.words[0].th, 'th-TH');
      }

      function renderGrid() {
        var list = DATA[tab];
        grid.innerHTML = '';
        list.forEach(function (it) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tile' + (selected && selected.id === it.id ? ' on' : '');
          btn.innerHTML = '<span class="form">' + it.form + '</span><span class="name">' + it.name + '</span>';
          btn.addEventListener('click', function () { selectItem(it); });
          grid.appendChild(btn);
        });
      }

      function selectItem(it) {
        selected = it;
        renderGrid();
        detailEmpty.style.display = 'none';
        detailCard.classList.add('show');
        document.getElementById('bigForm').textContent = it.form;
        document.getElementById('bigName').textContent = it.name;
        document.getElementById('posHint').textContent = it.pos;
        var wordsEl = document.getElementById('words');
        wordsEl.innerHTML = '';
        it.words.forEach(function (word) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'word-btn';
          b.innerHTML = '<span class="emoji">' + word.emoji + '</span><span class="meta"><span class="th">' +
            word.th + '</span><span class="note">' + word.note + '</span></span>';
          b.addEventListener('click', function () { speak(word.th, 'th-TH'); });
          wordsEl.appendChild(b);
        });
        speakSara(it);
      }

      document.getElementById('tabSeg').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-tab]');
        if (!btn) return;
        tab = btn.dataset.tab;
        document.querySelectorAll('#tabSeg button').forEach(function (b) {
          b.classList.toggle('on', b === btn);
        });
        selected = null;
        detailCard.classList.remove('show');
        detailEmpty.style.display = 'block';
        renderGrid();
      });

      document.getElementById('btnSound').addEventListener('click', function () {
        if (selected) speakSara(selected);
      });
      document.getElementById('btnAllWords').addEventListener('click', function () {
        if (!selected) return;
        var i = 0;
        speakSara(selected);
        setTimeout(function next() {
          if (i >= selected.words.length) return;
          speak(selected.words[i].th, 'th-TH');
          i++;
          setTimeout(next, 1100);
        }, 1400);
      });
      document.getElementById('btnFs').addEventListener('click', function () {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
        else if (document.exitFullscreen) document.exitFullscreen();
      });

      renderGrid();
    })();
  </script>
</body>
</html>
