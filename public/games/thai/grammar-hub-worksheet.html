<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-grammar-hub/index.html"><meta name="curriculum-indicators" content="ท 4.1 ป.4/2, ท 4.1 ป.5/1"><title>ใบงานไวยากรณ์ไทย Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.12" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.12" rel="stylesheet">
<style>
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1mm;margin:1mm 0}
.pos-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.7mm;font-size:7pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.svo-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:1mm;align-items:center;margin:1mm 0}
.svo-slot{border:1px dashed var(--ws-accent);border-radius:3px;min-height:8mm;font-size:7pt;font-weight:700;text-align:center;padding:.5mm;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>📖 ใบงานไวยากรณ์ไทย Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="pos">ชนิดคำ</option><option value="sentence">ประโยค</option><option value="classifier">ลักษณนาม</option><option value="fix">แก้ประโยค</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.12"></script><script>
const TG_ITEMS=[
{type:'pos',prompt:'"วิ่ง" เป็นคำชนิดใด',context:'วิ่ง',choices:['กริยา','นาม'],answer:'คำกริยา',s1:'แสดงการกระทำ',s2:'วิ่ง = กริยา',s3:'คำกริยา'},
{type:'pos',prompt:'"สวย" เป็นคำชนิดใด',context:'สวย',choices:['คุณศัพท์','กริยา'],answer:'คำคุณศัพท์',s1:'บอกลักษณะ',s2:'สวย = คุณศัพท์',s3:'คำคุณศัพท์'},
{type:'sentence',prompt:'ประโยค "นกบิน" มีกี่ส่วน',context:'นกบิน',choices:['ประธาน+กริยา','นาม+คุณศัพท์'],answer:'ประธาน(นก)+กริยา(บิน)',s1:'นก = ประธาน',s2:'บิน = กริยา',s3:'2 ส่วน'},
{type:'sentence',prompt:'"เด็กๆ เล่นสนุก" ประธานคือ',context:'เด็กๆ เล่นสนุก',choices:['เด็กๆ','เล่นสนุก'],answer:'เด็กๆ',s1:'ใครทำกริยา',s2:'เด็กๆ เล่น',s3:'เด็กๆ'},
{type:'classifier',prompt:'หนังสือ 1 ___',context:'ลักษณนาม',choices:['เล่ม','ตัว'],answer:'เล่ม',s1:'หนังสือ → เล่ม',s2:'1 เล่ม',s3:'เล่ม'},
{type:'classifier',prompt:'ช้าง 1 ___',context:'ลักษณนาม',choices:['เชือก/ตัว','เล่ม'],answer:'เชือก หรือ ตัว',s1:'ช้าง → เชือก/ตัว',s2:'1 เชือก',s3:'เชือก'},
{type:'fix',prompt:'แก้: "เขาไปโรงเรียนแล้วไป"',context:'เขาไปโรงเรียนแล้วไป',choices:['เขาไปโรงเรียนแล้ว','เขาไปไป'],answer:'เขาไปโรงเรียนแล้ว',s1:'ไปซ้ำ',s2:'ตัดไปท้าย',s3:'เขาไปโรงเรียนแล้ว'},
{type:'fix',prompt:'แก้: "ฉันชอบมากๆ มาก"',context:'ฉันชอบมากๆ มาก',choices:['ฉันชอบมากๆ','ฉันชอบมาก มาก'],answer:'ฉันชอบมากๆ',s1:'มากซ้ำ',s2:'เหลือมากๆ',s3:'ฉันชอบมากๆ'},
{type:'pos',prompt:'"ความสุข" เป็นคำ',context:'ความสุข',choices:['นาม','กริยา'],answer:'คำนาม',s1:'สิ่ง/ความรู้สึก',s2:'นาม',s3:'คำนาม'},
{type:'sentence',prompt:'ประโยค "ฝนตก" กริยาคือ',context:'ฝนตก',choices:['ตก','ฝน'],answer:'ตก (ฝน=ประธาน)',s1:'ฝน = ประธาน',s2:'ตก = กริยา',s3:'ตก'},
{type:'classifier',prompt:'ดินสอ 1 ___',context:'ลักษณนาม',choices:['แท่ง','เล่ม'],answer:'แท่ง',s1:'ดินสอ → แท่ง',s2:'1 แท่ง',s3:'แท่ง'},
{type:'fix',prompt:'เติมคำ: "แมว ___ บนหลังคา"',context:'นอน/วิ่ง',choices:['นอน','สวย'],answer:'นอน (กริยา)',s1:'ต้องการกริยา',s2:'นอน',s3:'แมวนอนบนหลังคา'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'thai-grammar-hub',icon:'📖',title:'ใบงานไวยากรณ์ไทย Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'ไวยากรณ์ Hub',
  sourceMediaUrl:'/games/thai/thai-grammar-hub/index.html',indicators:['ท 4.1 ป.4/2','ท 4.1 ป.5/1'],
  directions:'ชนิดคำ □ · ช่อง ประธาน|กริยา|กรรม · ลักษณนาม · แก้ประโยค',
  getItems(t){return t==='mixed'?TG_ITEMS:TG_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    let mid='<div class="pos-grid"><div class="pos-box">□ นาม</div><div class="pos-box">□ กริยา</div><div class="pos-box">□ คุณศัพท์</div></div>';
    if(item.type==='sentence'||item.type==='fix')mid='<div class="svo-row"><div class="svo-slot">ประธาน (S)</div><span>→</span><div class="svo-slot">กริยา (V)</div><span>→</span><div class="svo-slot">กรรม (O)</div></div>';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="q-context">“'+e(item.context)+'”</div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +mid+'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดูคำ</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 หน้าที่</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.12"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.12"></script></body></html>
