<script>
const ITEMS=[{"type":"animal","prompt":"อธิบายความหมายและแต่งประโยค","idiom":"เอาหูไปนา เอาตาไปไร่","literal":"เอาหูไปนาและเอาตาไปไร่","answer":"ไม่สนใจ / ไม่ใส่ใจ"},{"type":"life","prompt":"อธิบายและยกสถานการณ์ใช้","idiom":"น้ำขึ้นให้รีบตัก","literal":"ตักน้ำตอนน้ำขึ้น","answer":"ฉวยโอกาสเมื่อสถานการณ์ดี"},{"type":"proverb","prompt":"อธิบายด้วยคำของตนเอง","idiom":"ช้า ๆ ได้พร้าเล่มงาม","literal":"ทำช้าแล้วได้พร้าสวย","answer":"ทำอย่างรอบคอบได้ผลดี"},{"type":"animal","prompt":"จับคู่ความหมาย","idiom":"ปิดทองหลังพระ","literal":"ปิดทองด้านหลังพระ","answer":"ทำดีโดยไม่ต้องการคำชม"},{"type":"life","prompt":"อธิบายสถานการณ์","idiom":"ตกกระไดพลอยโจน","literal":"ตกลงไปกับกระได","answer":"พลอยทำตามโดยไม่ตั้งใจ"},{"type":"proverb","prompt":"บอกบทเรียนจากสำนวน","idiom":"คบคนพาลพาลพาไปหาผิด","literal":"คบคนพาลแล้วพาไปผิด","answer":"คบเพื่อนไม่ดีอาจเสียหาย"},{"type":"animal","prompt":"แต่งประโยคในโรงเรียน","idiom":"นกน้อยทำรังแต่พอตัว","literal":"นกทำรังเล็กพอตัว","answer":"อยู่อย่างพอเพียงตามกำลัง"},{"type":"life","prompt":"เลือกสำนวนที่เหมาะ","idiom":"พยายามทบทวนก่อนสอบ","literal":"—","answer":"เช่น ขยันไขว่คว้า / ขยันไว้ตัว"},{"type":"mixed","prompt":"แยกความหมายตรงกับโดยนัย","idiom":"หัวใจสลาย","literal":"หัวใจพัง","answer":"นัย: เสียใจมาก"},{"type":"proverb","prompt":"อธิบายและให้เหตุผล","idiom":"รักพี่เสียดายน้อง","literal":"รักพี่และเสียดายน้อง","answer":"ลังเลเลือกระหว่างสองทาง"},{"type":"animal","prompt":"อธิบายสำนวน","idiom":"วัวหายล้อมคอก","literal":"ล้อมคอกหลังวัวหาย","answer":"แก้ปัญหาหลังเกิดเหตุแล้ว"},{"type":"life","prompt":"แต่งประโยคใช้สำนวน","idiom":"สู้เพื่ออนาคต","literal":"—","answer":"เช่น ขยันไขว่คว้าเพื่ออนาคต"},{"type":"proverb","prompt":"บอกสถานการณ์ใช้","idiom":"พูดไปสองไพเบี้ย นิ่งเสียตำลึงทอง","literal":"พูดเสียสองไพ นิ่งได้ตำลึง","answer":"บางครั้งนิ่งไว้ดีกว่าพูด"},{"type":"mixed","prompt":"แยกตรง/นัย","idiom":"หน้าดำคร่ำเครียด","literal":"หน้าดำ","answer":"นัย: กังวลหรือเครียดมาก"},{"type":"life","prompt":"อธิบายสำนวน","idiom":"ยื่นแมวให้วัน","literal":"ให้แมวแก่คนชื่อวัน","answer":"มอบสิ่งให้คนที่ไม่เหมาะ"},{"type":"animal","prompt":"อธิบายและยกตัวอย่าง","idiom":"เสือซ่อนเล็บ","literal":"เสือซ่อนเล็บไว้","answer":"คนเก่งแต่ไม่โอ้อวด"},{"type":"proverb","prompt":"สรุปข้อคิด","idiom":"ทำดีได้ดี ทำชั่วได้ชั่ว","literal":"ทำดีได้ผลดี","answer":"ผลลัพธ์ตามการกระทำ"},{"type":"mixed","prompt":"แยกตรง/นัย","idiom":"ไฟไหม้ฟาง","literal":"ไฟไหม้กองฟาง","answer":"นัย: โกรธง่าย/รุนแรงเร็ว"}];
window.WORKSHEET_CONFIG={
  icon:'💬',title:'ใบงานคลังสำนวนไทย',subject:'ภาษาไทย',gradeLabel:'ป.4–ป.6',
  mediaLabel:'คลังสำนวนไทย',sourceMediaUrl:'/games/thai/thai-idiom-hub/index.html',
  indicators:["ท 1.1 ป.4/2","ท 1.1 ป.5/2"],
  directions:"แยกความหมายตรงกับโดยนัย ใช้ในประโยค และบอกสถานการณ์",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="q-context idiom-case">สำนวน: “'+e(item.idiom)+'”</div>'
      +'<div>ความหมายตรง</div><div class="work-line"></div>'
      +'<div>ความหมายโดยนัย</div><div class="evidence-line"></div>'
      +'<div>สถานการณ์ใช้ / ประโยคตัวอย่าง</div><div class="reason-line"></div><div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+(item.literal?' · ตรง: '+e(item.literal):'')+'</span>';}
};
</script>
