<style>
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Sarabun:wght@400;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Itim', 'Sarabun', sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#a1c4fd}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#gameCanvas{display:block;flex:1;width:100%;touch-action:none}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:flex-start;justify-content:space-between;padding:54px 12px 8px;pointer-events:none;z-index:15;flex-wrap:wrap;gap:6px}
#hud.on{display:flex}
#qHud{position:fixed;top:54px;left:50%;transform:translateX(-50%) scale(0);z-index:16;font-size:clamp(24px,6vw,34px);color:#be185d;font-weight:800;border:3px solid #fbcfe8;background:rgba(255,255,255,0.96);padding:8px 24px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,0.12);white-space:nowrap;pointer-events:none;transition:transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
#hud.on ~ #qHud{transform:translateX(-50%) scale(1)}
.hud-pill{font-weight:700;background:rgba(255,255,255,.88);color:#334155;padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:clamp(14px,3.5vw,18px);border:2px solid rgba(255,255,255,.9)}
#comboBanner{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);padding:12px 24px;border-radius:20px;font-weight:800;font-size:clamp(18px,4.5vw,28px);color:#fff;z-index:25;pointer-events:none;opacity:0;background:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8,#4ade80,#fbbf24);background-size:200% 100%;animation:none;text-shadow:0 2px 8px rgba(0,0,0,.25)}
#comboBanner.show{animation:comboPop .9s ease forwards,rainbowShift 1.2s linear infinite}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
@keyframes rainbowShift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;background:rgba(161,196,253,.55);backdrop-filter:blur(8px)}
.modal.off{display:none}
.modal-card{width:100%;max-width:440px;background:linear-gradient(165deg,#fff 0%,#fef3c7 100%);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.18);border:3px solid #fff;position:relative;overflow:hidden;max-height:92vh;overflow-y:auto}
.modal-card::before{content:'🌸 🍃 🌿';position:absolute;top:8px;left:0;right:0;font-size:18px;opacity:.45;letter-spacing:8px}
.modal-card h1{font-size:clamp(22px,5vw,30px);color:#be185d;margin:20px 0 8px;line-height:1.25}
.modal-card p{color:#64748b;font-size:15px;line-height:1.55;margin-bottom:12px}
.modal-card .score-big{font-size:48px;font-weight:800;color:#f59e0b;margin:8px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 26px;margin:6px;border:none;border-radius:999px;font-family:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.btn:active{transform:scale(.96)}
.btn-green{background:linear-gradient(135deg,#4ade80,#16a34a)}
.btn-orange{background:linear-gradient(135deg,#fb923c,#ea580c)}
.btn-blue{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.lb-box{background:rgba(255,255,255,.95);color:#334155;border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left;max-height:180px;overflow-y:auto}
.lb-box h3{font-size:14px;margin-bottom:6px;color:#be185d}
.lb-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.lb-row:last-child{border:none}
.lb-row.me{background:#fef9c3;border-radius:8px;padding:4px 6px}
#touchControls{position:fixed;bottom:20px;left:20px;right:20px;display:none;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
#touchControls button{pointer-events:auto}
@media (pointer:coarse){#touchControls{display:flex}}
@media (pointer:fine){#touchControls{display:none!important}}
.tbtn{width:64px;height:64px;border-radius:20px;border:none;background:rgba(255,255,255,.92);font-size:26px;font-weight:800;color:#475569;box-shadow:0 6px 0 #cbd5e1,0 10px 20px rgba(0,0,0,.12)}
.tbtn.jump{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#fbcfe8,#f9a8d4);color:#9d174d}
.tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #cbd5e1}
#kampai-snd{top:auto!important;bottom:100px!important;left:20px!important;z-index:30}
</style>
</head>

<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div class="hud-pill" id="scoreHud">⭐ 0</div>

<script src="/games/kampai-sdk.js"></script>

<script>
const GAME_SLUG = 'thai-sara-run';
KAMPAI.setSlug(GAME_SLUG);

const QUESTIONS = [
  { prompt: 'ป _', word: 'ปู', answer: 'ู', opts: ['ู','า','ิ'] },
  { prompt: 'ต _', word: 'ตา', answer: 'า', opts: ['า','ี','ุ'] },
  { prompt: 'ล _ ง', word: 'ลิง', answer: 'ิ', opts: ['ิ','ึ','ื'] },
  { prompt: 'โรงเร _ ยน', word: 'โรงเรียน', answer: 'ี', opts: ['ี','ิ','ื'] },
  { prompt: 'ม _ า', word: 'ม้า', answer: '้', opts: ['้','๊','่'] },
  { prompt: 'หม _', word: 'หมา', answer: 'า', opts: ['า','ิ','ำ'] },
  { prompt: 'น _ ก', word: 'นัก', answer: 'ั', opts: ['ั','ุ','ึ'] },
  { prompt: 'ไก _', word: 'ไก่', answer: '่', opts: ['่','้','๊'] },
  { prompt: 'หม _', word: 'หมู', answer: 'ู', opts: ['ู','ุ','า'] },
  { prompt: 'แม _', word: 'แม่', answer: '่', opts: ['่','้','า'] },
  { prompt: 'ด _ น', word: 'ดิน', answer: 'ิ', opts: ['ิ','ี','ึ'] },
  { prompt: 'ม _ ด', word: 'มัด', answer: 'ั', opts: ['ั','า','ิ'] },
  { prompt: 'เร _', word: 'เรา', answer: 'า', opts: ['า','ิ','ุ'] },
  { prompt: 'เด _ ก', word: 'เด็ก', answer: '็', opts: ['็','่','้'] },
  { prompt: 'ปล _', word: 'ปลา', answer: 'า', opts: ['า','ิ','ุ'] },
  { prompt: 'ช _ าง', word: 'ช้าง', answer: '้', opts: ['้','่','๊'] },
  { prompt: 'ฟ _ น', word: 'ฟัน', answer: 'ั', opts: ['ั','า','ิ'] },
  { prompt: 'ร _ น', word: 'รัน', answer: 'ั', opts: ['ั','ิ','ุ'] },
  { prompt: 'ส _ ต', word: 'สัตว์', answer: 'ั', opts: ['ั','า','ิ'] },
];

const BUBBLE_COLORS = ['#93c5fd','#fca5a5','#86efac'];
const GRAVITY = 0.38, FRICTION = 0.82, RUN = 4.2, JUMP1 = -9.2, JUMP2 = -7.4;
const WORLD_H = 720, PLAT_H = 48;
const V_H = 720;
let V_W = 1280;
let renderScale = 1;
let gameRng = Math.random;
let collectedLetters = [];

function updateLetterHud() {
  const letters = ['ส', 'ร', 'ะ'];
  let html = 'สะสมคำ: ';
  letters.forEach(l => {
    if (collectedLetters.includes(l)) {
      html += `<span style="color:#e11d48; font-weight:900; text-shadow:0 0 4px rgba(225,29,72,0.4); margin:0 3px">${l}</span>`;
    } else {
      html += `<span style="color:#94a3b8; margin:0 3px">◯</span>`;
    }
  });
  document.getElementById('letterHud').innerHTML = html;
}

function getEmojiClue(word) {
  const clues = {
    'ปู': '🦀', 'ตา': '👁️', 'ลิง': '🐒', 'โรงเรียน': '🏫', 'ม้า': '🐎',
    'หมา': '🐕', 'นัก': '🧑‍🎓', 'ไก่': '🐔', 'หมู': '🐖', 'แม่': '👩',
    'ดิน': '🌱', 'มัด': '📦', 'เรา': '👥', 'เด็ก': '👶', 'ปลา': '🐟',
    'ช้าง': '🐘', 'ฟัน': '🦷', 'รัน': '🏃', 'สัตว์': '🦁'
  };
  return clues[word] || '❓';
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = 1280, H = 720, dpr = 1, camX = 0;
let skyGrad = null, gameRunning = false, versusMode = false, versusTimer = null;
let score = 0, lives = 3, combo = 0, correctCount = 0, platIndex = 0;
let qOrder = [], qIdx = 0, currentQ = null, answeredQ = false;
let shakeT = 0, floatTexts = [], petals = [], clouds = [];
let platforms = [], bubbles = [], stars = [], particles = [];
let lastSafePlat = null;

const keys = { left: false, right: false, jump: false };
const player = {
  x: 120, y: 400, vx: 0, vy: 0, w: 44, h: 52,
  onGround: false, jumps: 0, face: 1,
  state: 'idle', hurtT: 0, earPhase: 0,
};

const AudioSynth = {
  ctx: null,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* noop */ }
  },
  play(type, comboN) {
    try {
      this.init();
      const ac = this.ctx;
      if (!ac) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime;
      if (type === 'jump') {
        o.type = 'sine'; o.frequency.setValueAtTime(280, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.12);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.start(t); o.stop(t + 0.16);
      } else if (type === 'star') {
        o.type = 'triangle'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(990, t + 0.08);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.start(t); o.stop(t + 0.22);
      } else if (type === 'correct') {
        const base = 520 + Math.min(comboN, 8) * 40;
        o.type = 'sine'; o.frequency.setValueAtTime(base, t); o.frequency.setValueAtTime(base * 1.25, t + 0.06); o.frequency.setValueAtTime(base * 1.5, t + 0.12);
        g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o.start(t); o.stop(t + 0.3);
      } else if (type === 'wrong') {
        o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.25);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
      }
    } catch (e) { /* noop */ }
  },
};

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  W = rect.width * dpr;
  H = rect.height * dpr;
  canvas.width = W; canvas.height = H;
  renderScale = H / V_H;
  V_W = W / renderScale;
  skyGrad = ctx.createLinearGradient(0, 0, 0, V_H);
  skyGrad.addColorStop(0, '#a1c4fd');
  skyGrad.addColorStop(1, '#c2e9fb');
}

function rand(a, b) { return a + gameRng() * (b - a); }
function shuffle(arr, rng) {
  const r = rng || gameRng;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (r() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: rand(0, 2000), y: rand(40, 180), s: rand(0.7, 1.3), spd: rand(0.15, 0.35) });
  }
}
function initPetals() {
  petals = [];
  for (let i = 0; i < 28; i++) {
    petals.push({ x: rand(0, 3000), y: rand(-V_H, V_H), r: rand(3, 7), rot: rand(0, 6.28), spd: rand(0.4, 1.2), drift: rand(-0.3, 0.3) });
  }
}

function makePlatform(x, y, w, withQuestion) {
  const isMoving = !withQuestion && platIndex > 0 && gameRng() < 0.35; // 35% chance for normal platforms
  const p = {
    x, y, w, h: PLAT_H, flowers: [], shrooms: [], question: withQuestion, id: platIndex++,
    moving: isMoving, baseY: y, phase: gameRng() * 6.28,
    moveRange: rand(35, 75), moveSpeed: 0.015 + gameRng() * 0.02
  };
  const nF = 2 + (gameRng() * 4 | 0);
  for (let i = 0; i < nF; i++) p.flowers.push({ ox: rand(8, w - 8), col: ['#f9a8d4','#fde68a','#c4b5fd'][i % 3] });
  if (gameRng() < 0.35) p.shrooms.push({ ox: rand(12, w - 20) });
  platforms.push(p);
  
  if (gameRng() < 0.45) {
    if (gameRng() < 0.35) {
      // Find the next letter to collect (in sequence)
      const nextIdx = collectedLetters.length;
      if (nextIdx < 3) {
        const letter = ['ส', 'ร', 'ะ'][nextIdx];
        stars.push({
          x: x + rand(20, w - 20),
          y: y - rand(70, 120), // Spawns higher in the air
          taken: false,
          bob: gameRng() * 6.28,
          letter: letter
        });
      } else {
        stars.push({ x: x + rand(20, w - 20), y: y - 28, taken: false, bob: gameRng() * 6.28 });
      }
    } else {
      stars.push({ x: x + rand(20, w - 20), y: y - 28, taken: false, bob: gameRng() * 6.28 });
    }
  }
  return p;
}

function spawnQuestion(plat) {
  if (qIdx >= qOrder.length) qOrder = shuffle(QUESTIONS.map((_, i) => i), gameRng);
  const qi = qOrder[qIdx++ % qOrder.length];
  currentQ = { ...QUESTIONS[qi], platId: plat.id };
  answeredQ = false;
  const opts = shuffle(currentQ.opts.slice(), gameRng);
  bubbles = [];
  const midX = plat.x + plat.w / 2;
  opts.forEach((opt, i) => {
    const offset = (i - 1) * 150; // Spaced by exactly 150px virtual
    const baseY = plat.y - rand(100, 190); // Float higher in the sky
    bubbles.push({
      x: midX + offset,
      y: baseY,
      baseY: baseY,
      r: 34, // Larger choice bubble
      text: opt,
      correct: opt === currentQ.answer,
      wob: gameRng() * 6.28,
      phase: gameRng() * 6.28,
      floatSpeed: 0.02 + gameRng() * 0.03,
      col: BUBBLE_COLORS[i % 3],
    });
  });
  plat.question = false;
  document.getElementById('qHud').textContent = '📖 ' + currentQ.prompt.replace('_', '___') + ' (' + getEmojiClue(currentQ.word) + ')';
}

function resetWorld(rng) {
  platforms = []; bubbles = []; stars = []; particles = []; floatTexts = [];
  platIndex = 0; qIdx = 0; currentQ = null; answeredQ = true;
  qOrder = shuffle(QUESTIONS.map((_, i) => i), rng || Math.random);
  camX = 0;
  collectedLetters = [];
  updateLetterHud();
  const groundY = V_H - 240;
  const first = makePlatform(40, groundY, 420, false);
  lastSafePlat = first;
  let x = 40, y = groundY;
  for (let i = 0; i < 24; i++) {
    const gap = rand(60, 110);
    const dy = rand(-40, 40);
    const withQ = (i + 1) % 3 === 0;
    const w = withQ ? rand(380, 440) : rand(160, 220);
    x += gap + (platforms[platforms.length - 1]?.w || 420);
    y = Math.max(V_H - 480, Math.min(V_H - 240, y + dy));
    makePlatform(x, y, w, withQ);
  }
  player.x = first.x + 60; player.y = first.y - player.h - 2;
  player.vx = 0; player.vy = 0; player.jumps = 0; player.state = 'idle';
}

function addFloatText(x, y, text, col) {
  floatTexts.push({ x, y, text, col, life: 1 });
}

function spawnDust(x, y) {
  for (let i = 0; i < 8; i++) {
    particles.push({ x, y, vx: rand(-2, 2), vy: rand(-3, -1), life: 1, col: '#fff' });
  }
}

function respawnPlayer() {
  if (!lastSafePlat) return;
  player.x = lastSafePlat.x + lastSafePlat.w / 2 - player.w / 2;
  player.y = lastSafePlat.y - player.h - 2;
  player.vx = 0; player.vy = 0; player.jumps = 0;
  player.hurtT = 40; player.state = 'hurt';
  shakeT = 18;
  camX = Math.max(0, lastSafePlat.x - 120); // Reset camera back to safe platform
  addFloatText(player.x, player.y - 20, '-1 พลังชีวิต! 💔', '#ef4444');
}

function handleFall() {
  lives = Math.max(0, lives - 1);
  KAMPAI.sound.wrong();
  AudioSynth.play('wrong');
  respawnPlayer();
  updateHud();
  if (lives <= 0) endGame();
}

function hitBubble(b) {
  if (answeredQ) return;
  answeredQ = true;
  if (b.correct) {
    combo++; correctCount++;
    const bonus = 10 + combo * 3;
    score += bonus;
    player.state = 'happy';
    KAMPAI.sound.correct();
    AudioSynth.play('correct', combo);
    addFloatText(b.x, b.y - 30, 'ถูกต้อง! 🎉', '#16a34a');
    addFloatText(b.x, b.y - 55, '+' + bonus + ' ⭐', '#f59e0b');
    if (combo >= 2) {
      const el = document.getElementById('comboBanner');
      el.textContent = 'คอมโบต่อเนื่อง x' + combo + '! 🌈✨';
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }
    vs.report(score, { correct: correctCount });
    try { KAMPAI.sound.speak(currentQ.word, 'th-TH'); } catch (e) {}
    currentQ = null;
    bubbles = [];
    document.getElementById('qHud').textContent = '📖 วิ่งไปข้างหน้า!';
  } else {
    combo = 0;
    lives = Math.max(0, lives - 1);
    player.state = 'hurt'; player.hurtT = 35;
    shakeT = 16;
    KAMPAI.sound.wrong();
    AudioSynth.play('wrong');
    addFloatText(b.x, b.y - 30, 'ผิด! ลองใหม่', '#ef4444');
    answeredQ = false;
    updateHud();
    if (lives <= 0) endGame();
  }
  document.getElementById('scoreHud').classList.add('pop');
  setTimeout(() => document.getElementById('scoreHud').classList.remove('pop'), 180);
  updateHud();
}

function updateHud() {
  document.getElementById('scoreHud').textContent = '⭐ ' + score;
  document.getElementById('lifeHud').textContent = '❤️'.repeat(lives) || '💔';
}

function extendWorld() {
  const last = platforms[platforms.length - 1];
  if (!last || last.x + last.w - camX < V_W * 1.8) {
    const gap = rand(60, 110);
    const dy = rand(-40, 40);
    const withQ = platIndex % 3 === 0;
    const w = withQ ? rand(380, 440) : rand(160, 220);
    const x = last.x + last.w + gap;
    let y = last.y + dy;
    y = Math.max(V_H - 480, Math.min(V_H - 240, y));
    makePlatform(x, y, w, withQ);
  }
  platforms = platforms.filter(p => p.x + p.w > camX - 200);
  stars = stars.filter(s => s.x > camX - 100);
  bubbles = bubbles.filter(b => b.x > camX - 80);
}

function updatePlayer() {
  // Update moving platforms
  for (const p of platforms) {
    if (p.moving) {
      p.phase += p.moveSpeed;
      p.y = p.baseY + Math.sin(p.phase) * p.moveRange;
      if (player.onGround && lastSafePlat === p) {
        player.y = p.y - player.h;
      }
    }
  }

  // Trigger question spawning dynamically when approaching question platforms
  for (const p of platforms) {
    if (p.question && currentQ === null && p.x - camX < V_W + 100 && p.x - camX > -p.w) {
      spawnQuestion(p);
      break;
    }
  }

  if (keys.left) { player.vx = -RUN; player.face = -1; player.state = player.onGround ? 'run' : player.state; }
  else if (keys.right) { player.vx = RUN; player.face = 1; player.state = player.onGround ? 'run' : player.state; }
  else { player.vx *= FRICTION; if (Math.abs(player.vx) < 0.05) player.vx = 0; if (player.onGround && player.state === 'run') player.state = 'idle'; }

  if (keys.jump) {
    if (player.onGround) {
      player.vy = JUMP1; player.onGround = false; player.jumps = 1;
      player.state = 'jump'; spawnDust(player.x + player.w / 2, player.y + player.h);
      AudioSynth.play('jump');
      keys.jump = false;
    } else if (player.jumps === 1) {
      player.vy = JUMP2; player.jumps = 2; player.state = 'jump';
      spawnDust(player.x + player.w / 2, player.y + player.h / 2);
      AudioSynth.play('jump');
      keys.jump = false;
    }
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  if (player.x < camX) { player.x = camX; player.vx = 0; }
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  player.y += player.vy;
  player.onGround = false;

  if (player.hurtT > 0) player.hurtT--;
  else if (player.state === 'hurt') player.state = 'idle';
  if (player.state === 'happy') player.state = player.onGround ? 'idle' : 'jump';
  player.earPhase += 0.08 + Math.abs(player.vx) * 0.02;

  for (const p of platforms) {
    if (player.x + player.w > p.x + 8 && player.x < p.x + p.w - 8 &&
        player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + player.vy + 4 && player.vy >= 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumps = 0;
      lastSafePlat = p;
      if (player.state !== 'happy' && player.state !== 'hurt') player.state = keys.left || keys.right ? 'run' : 'idle';
    }
  }

  // Update bubbles floating animation
  for (const b of bubbles) {
    b.phase += b.floatSpeed;
    b.y = b.baseY + Math.sin(b.phase) * 14;
  }

  const pad = 14;
  for (const b of bubbles) {
    const dx = (player.x + player.w / 2) - b.x;
    const dy = (player.y + player.h / 2) - b.y;
    if (dx * dx + dy * dy < (b.r + pad) * (b.r + pad)) hitBubble(b);
  }

  for (const s of stars) {
    if (s.taken) continue;
    s.bob += 0.06;
    const sY = s.letter ? s.y + Math.sin(s.bob) * 6 : s.y + Math.sin(s.bob) * 4;
    const dx = (player.x + player.w / 2) - s.x;
    const dy = (player.y + player.h / 2) - sY;
    if (dx * dx + dy * dy < 900) {
      s.taken = true;
      if (s.letter) {
        if (collectedLetters.length < 3 && !collectedLetters.includes(s.letter)) {
          collectedLetters.push(s.letter);
          score += 20;
          AudioSynth.play('correct', collectedLetters.length);
          addFloatText(s.x, s.y - 15, 'สะสม: ' + s.letter + ' ✨', '#e11d48');
          updateLetterHud();
          
          if (collectedLetters.length === 3) {
            score += 100;
            combo++;
            AudioSynth.play('correct', 5);
            addFloatText(player.x, player.y - 45, 'สำเร็จคำวิเศษ! 🎉 +100 ⭐', '#fbbf24');
            const el = document.getElementById('comboBanner');
            el.textContent = 'สะสมอักษรครบคำว่า "สระ"! 🌈✨ +100 ⭐';
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
            
            setTimeout(() => {
              collectedLetters = [];
              updateLetterHud();
            }, 2000);
          }
        }
      } else {
        score += 10;
        AudioSynth.play('star');
        addFloatText(s.x, s.y - 10, '+10 ⭐', '#fbbf24');
      }
      updateHud();
    }
  }

  if (player.y > V_H + 80) handleFall();

  // Auto-scrolling camera (dynamic speed based on combo)
  const scrollSpeed = 1.15 + Math.min(0.6, combo * 0.1);
  camX += scrollSpeed;
  if (camX < 0) camX = 0;

  // Constrain player to right screen edge
  if (player.x > camX + V_W - player.w) {
    player.x = camX + V_W - player.w;
    player.vx = 0;
  }

  extendWorld();
}

function drawCloud(c) {
  const x = c.x - camX * 0.3;
  ctx.save();
  ctx.translate(x, c.y);
  ctx.scale(c.s, c.s);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, 6.28);
  ctx.arc(32, -8, 34, 0, 6.28);
  ctx.arc(64, 0, 26, 0, 6.28);
  ctx.fill();
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.arc(-6, -4, 3, 0, 6.28); ctx.arc(6, -4, 3, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 6, 8, 0.1, 3.04); ctx.stroke();
  ctx.restore();
}

function drawPlatform(p) {
  const x = p.x - camX, y = p.y;
  ctx.fillStyle = p.moving ? '#78350f' : '#92400e';
  ctx.beginPath(); ctx.roundRect(x, y, p.w, p.h, 12); ctx.fill();
  ctx.fillStyle = p.moving ? '#4d7c0f' : '#65a30d';
  ctx.fillRect(x, y - 8, p.w, 14);
  ctx.fillStyle = p.moving ? '#a3e635' : '#84cc16';
  for (let i = 0; i < p.w; i += 18) ctx.fillRect(x + i, y - 10, 10, 6);
  p.flowers.forEach(f => {
    ctx.fillStyle = f.col;
    ctx.beginPath(); ctx.arc(x + f.ox, y - 14, 5, 0, 6.28); ctx.fill();
  });
  p.shrooms.forEach(m => {
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.ellipse(x + m.ox, y - 12, 8, 6, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#fef3c7';
    ctx.fillRect(x + m.ox - 2, y - 8, 4, 8);
  });
}

function drawBunny() {
  const x = player.x - camX, y = player.y;
  const earTilt = Math.sin(player.earPhase) * 0.15 + (player.vy < -2 ? -0.25 : 0.1);
  ctx.save();
  ctx.translate(x + player.w / 2, y + player.h / 2);
  ctx.scale(player.face, 1);
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#fbcfe8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-12, -34 + Math.sin(player.earPhase) * 3, 8, 22, -0.2 + earTilt, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(12, -34 + Math.sin(player.earPhase + 1) * 3, 8, 22, 0.2 - earTilt, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(-22, -18, 44, 40, 16); ctx.fill();
  ctx.fillStyle = '#93c5fd';
  ctx.fillRect(-18, 0, 36, 18);
  ctx.fillStyle = '#fff';
  for (let i = -14; i < 18; i += 7) ctx.fillRect(i, 2, 5, 14);
  ctx.fillStyle = '#fbcfe8';
  ctx.beginPath(); ctx.arc(-12, 4, 5, 0, 6.28); ctx.arc(12, 4, 5, 0, 6.28); ctx.fill();

  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.fillStyle = '#334155';
  if (player.state === 'hurt') {
    // Cross eyes > <
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-11, -6); ctx.lineTo(-5, -2); ctx.moveTo(-11, -2); ctx.lineTo(-5, -6);
    ctx.moveTo(5, -6); ctx.lineTo(11, -2); ctx.moveTo(5, -2); ctx.lineTo(11, -6);
    ctx.stroke();
    // Flat mouth
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(3, 2); ctx.stroke();
  } else if (player.state === 'happy' || player.state === 'jump') {
    // Upward arch eyes ^ ^
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-8, -2, 4, 3.14, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, -2, 4, 3.14, 0); ctx.stroke();
    // Cute open mouth
    ctx.fillStyle = '#f43f5e';
    ctx.beginPath(); ctx.arc(0, 2, 4, 0, 3.14); ctx.fill();
  } else {
    // Normal vertical oval eyes
    ctx.beginPath(); ctx.ellipse(-8, -4, 3, 5, 0, 0, 6.28); ctx.ellipse(8, -4, 3, 5, 0, 0, 6.28); ctx.fill();
    // Sparkles inside eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-9, -6, 1, 0, 6.28); ctx.arc(7, -6, 1, 0, 6.28); ctx.fill();
    // Cute w-mouth
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-2, 2, 2, 0, 3.14); ctx.arc(2, 2, 2, 0, 3.14); ctx.stroke();
  }
  ctx.restore();
}

function drawBubble(b) {
  const wob = 1 + Math.sin(b.wob) * 0.08;
  const x = b.x - camX, y = b.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(wob, 1 / wob);
  const g = ctx.createRadialGradient(-6, -6, 4, 0, 0, b.r);
  g.addColorStop(0, '#fff'); g.addColorStop(0.45, b.col); g.addColorStop(1, b.col);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#1e293b';
  ctx.font = 'bold 36px Itim'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.text, 0, 1);
  ctx.restore();
  b.wob += 0.07;
}

function drawStar(s) {
  if (s.taken) return;
  const x = s.x - camX, y = s.y + Math.sin(s.bob) * 4;
  ctx.save(); ctx.translate(x, y);
  if (s.letter) {
    ctx.fillStyle = '#f59e0b';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Itim'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(s.letter, 0, 1);
  } else {
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const r = i % 2 ? 6 : 12;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  const shakeX = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 0.4 : 0;
  const shakeY = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 0.3 : 0;
  if (shakeT > 0) shakeT--;
  ctx.save();
  ctx.scale(renderScale, renderScale);
  ctx.translate(shakeX, shakeY);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, V_W, V_H);
  clouds.forEach(c => { c.x -= c.spd; if (c.x < camX - 200) c.x = camX + V_W + 200; drawCloud(c); });
  petals.forEach(p => {
    p.y += p.spd; p.x += p.drift; p.rot += 0.02;
    if (p.y > V_H + 20) { p.y = -20; p.x = camX + rand(0, V_W); }
    ctx.save();
    ctx.translate(p.x - camX * 0.15, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = 'rgba(251,182,206,.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  });
  platforms.forEach(drawPlatform);
  stars.forEach(drawStar);
  bubbles.forEach(drawBubble);
  drawBunny();
  particles.forEach(pt => {
    pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.04;
    ctx.globalAlpha = pt.life; ctx.fillStyle = pt.col;
    ctx.beginPath(); ctx.arc(pt.x - camX, pt.y, 3, 0, 6.28); ctx.fill();
    ctx.globalAlpha = 1;
  });
  particles = particles.filter(p => p.life > 0);
  floatTexts.forEach(ft => {
    ft.y -= 1.2; ft.life -= 0.015;
    ctx.globalAlpha = Math.max(0, ft.life);
    ctx.fillStyle = ft.col; ctx.font = 'bold 22px Itim'; ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x - camX, ft.y);
    ctx.globalAlpha = 1;
  });
  floatTexts = floatTexts.filter(f => f.life > 0);
  ctx.restore();
}

function loop() {
  if (!gameRunning) return;
  updatePlayer();
  draw();
  requestAnimationFrame(loop);
}

function startGame(rng, playerInfo) {
  versusMode = playerInfo !== null && playerInfo !== undefined;
  gameRng = rng || Math.random;
  score = 0; lives = 3; combo = 0; correctCount = 0;
  gameRunning = true;
  document.getElementById('startModal').classList.add('off');
  document.getElementById('overModal').classList.add('off');
  document.getElementById('hud').classList.add('on');
  resize();
  resetWorld(gameRng);
  updateHud();
  try { KAMPAI.sound.unlock(); KAMPAI.sound.defaultBgm('playful'); KAMPAI.sound.bgmStart(); } catch (e) {}
  initClouds(); initPetals();
  loop();
  if (!versusMode) return;
  clearTimeout(versusTimer);
  versusTimer = setTimeout(() => { gameRunning = false; endGame(); }, 90 * 1000);
}

function endGame() {
  if (vs.finish(score, { correct: correctCount })) {
    gameRunning = false;
    clearTimeout(versusTimer);
    return;
  }
  gameRunning = false;
  clearTimeout(versusTimer);
  try { KAMPAI.sound.gameOver(); KAMPAI.sound.bgmStop(); } catch (e) {}
  document.getElementById('hud').classList.remove('on');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overModal').classList.remove('off');
  KAMPAI.submitScore(score, { correct: correctCount, combo_max: combo });
}

const vs = KampaiVersus.create({
  duration: 90,
  title: 'ตะลุยด่านสระพาสนุก',
  rankBy: 'score',
  onPlay: ({ rng, player: pInfo }) => startGame(rng, pInfo),
  onEnd: () => { gameRunning = false; },
});

function renderLeaderboard() {
  const lb = KAMPAI.leaderboard || [];
  const stats = KAMPAI.stats;
  const ms = document.getElementById('myStats');
  if (stats && (stats.personalBest > 0 || stats.playsCount > 0)) {
    ms.style.display = 'flex';
    ms.innerHTML = '<div style="flex:1;background:rgba(255,255,255,.6);border-radius:12px;padding:8px"><div style="font-size:22px;font-weight:800;color:#f59e0b">' + (stats.personalBest || 0) + '</div><div style="font-size:12px;color:#64748b">สถิติสูงสุด</div></div><div style="flex:1;background:rgba(255,255,255,.6);border-radius:12px;padding:8px"><div style="font-size:22px;font-weight:800;color:#6366f1">' + (stats.playsCount || 0) + '</div><div style="font-size:12px;color:#64748b">ครั้งที่เล่น</div></div>';
  }
  const box = document.getElementById('startLb');
  const list = document.getElementById('lbList');
  if (!lb.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = lb.slice(0, 5).map((row, i) => '<div class="lb-row' + (row.isMe ? ' me' : '') + '"><span>#' + (i + 1) + '</span><span style="flex:1">' + (row.displayName || row.name || '—') + '</span><span>' + row.score + '</span></div>').join('');
}

KAMPAI.onReady(() => {
  try { KAMPAI.sound.mountToggles(); KAMPAI.controls.mount({ dpad: true }); } catch (e) {}
  renderLeaderboard();
});

document.getElementById('btnStart').onclick = () => startGame(Math.random, null);
document.getElementById('btnVersus').onclick = () => vs.openMenu();
document.getElementById('btnRetry').onclick = () => location.reload();
document.getElementById('btnHome').onclick = () => KAMPAI.goHome();

window.addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') {
    if (!e.repeat) keys.jump = true;
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') keys.jump = false;
});

function bindTouch(btn, key, isJump) {
  const down = e => { e.preventDefault(); if (isJump) keys.jump = true; else keys[key] = true; };
  const up = e => { e.preventDefault(); if (isJump) keys.jump = false; else keys[key] = false; };
  btn.addEventListener('touchstart', down, { passive: false });
  btn.addEventListener('touchend', up);
  btn.addEventListener('touchcancel', up);
  btn.addEventListener('mousedown', down);
  btn.addEventListener('mouseup', up);
  btn.addEventListener('mouseleave', up);
}
bindTouch(document.getElementById('btnLeft'), 'left', false);
bindTouch(document.getElementById('btnRight'), 'right', false);
bindTouch(document.getElementById('btnJump'), null, true);

window.addEventListener('resize', resize);
resize();
</script>
