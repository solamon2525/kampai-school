<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Traditional Thai Lai Thai/Cloud Scrolls Background -->
  <g fill="none" stroke="rgba(251, 191, 36, 0.05)" stroke-width="2.5">
    <path d="M 0,100 Q 150,50 300,150 T 600,100 T 900,200 T 1280,100" />
    <path d="M 0,600 Q 200,650 450,550 T 900,600 T 1280,500" />
  </g>

  <!-- Constellations / Connection Nodes of Synonyms -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.6">
    <line x1="200" y1="200" x2="350" y2="280" />
    <line x1="350" y1="280" x2="180" y2="400" />
    <line x1="1080" y1="200" x2="920" y2="280" />
    <line x1="920" y1="280" x2="1050" y2="420" />
  </g>

  <!-- Floating Synonym Nodes -->
  <g filter="url(#glow)">
    <!-- Node 1: ท้องฟ้า -->
    <circle cx="200" cy="200" r="45" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2" />
    <text x="200" y="208" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">นภา</text>

    <!-- Node 2: ช้าง -->
    <circle cx="350" cy="280" r="45" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2" />
    <text x="350" y="288" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">คชสาร</text>

    <!-- Node 3: พระอาทิตย์ -->
    <circle cx="1080" cy="200" r="45" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2" />
    <text x="1080" y="208" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">สุริยา</text>

    <!-- Node 4: ดอกไม้ -->
    <circle cx="920" cy="280" r="45" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2" />
    <text x="920" y="288" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">บุปผา</text>
  </g>

  <!-- Central Title Board -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="640" y="320" font-family="sans-serif" font-weight="900" font-size="88" fill="#fbbf24" stroke="#000" stroke-width="2">คำไวพจน์</text>
    <text x="640" y="390" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" letter-spacing="6">เชื่อมโยงคำพ้องความหมาย</text>
  </g>

  <!-- Decorative Thai Art center frame -->
  <path d="M 440,230 L 840,230 M 440,420 L 840,420" stroke="#fbbf24" stroke-width="4" stroke-dasharray="15 10" />

  <!-- Subtitle -->
  <text x="640" y="660" font-family="sans-serif" font-weight="bold" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="1">สนุกกับเกมจับคู่คำศัพท์ภาษาไทยที่แปลเหมือนกัน เพิ่มพูนคลังคำสุนทรโวหาร</text>
</svg>
