<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/vocab-quiz-engine.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ใบความรู้วรรณคดีสั้น — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #6d28d9;
      --deep-dark: #5b21b6;
      --accent: #7c3aed;
      --line: #ddd6fe;
      --soft: #faf5ff;
      --muted: #475569;
      --ink: #0f172a;
      --border: #cbd5e1;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(145deg, #ddd6fe, #f5f3ff);
      min-height: 100vh;
      padding: 12px;
      color: var(--ink);
    }
    .shell {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(90deg, var(--deep-dark), var(--accent));
      color: #ffffff;
    }
    header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 160px; }
    .badge {
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      min-width: 44px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .seg button:focus-visible, .pick button:focus-visible,
    .ke-option:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .btn-primary { background: var(--deep); color: #ffffff; }
    .btn-primary:hover { background: var(--deep-dark); }
    .btn-ghost { background: #ffffff; color: var(--deep); border: 2px solid var(--line); }
    .btn-ghost:hover { background: var(--soft); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .seg {
      display: inline-flex;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    .seg button {
      font-family: inherit;
      font-weight: 800;
      border: none;
      background: #ffffff;
      color: var(--deep);
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      min-height: 44px;
      min-width: 44px;
    }
    .seg button.on { background: var(--deep); color: #ffffff; }
    .hint { font-size: 0.88rem; color: var(--deep); font-weight: 700; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .shell.mode-practice .learn { display: none; }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 720px; margin: 0 auto; width: 100%; }
    .shell.mode-practice .practice { display: flex; }
    .pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick button {
      font-family: inherit;
      font-weight: 800;
      font-size: 0.96rem;
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
      color: var(--deep);
      min-height: 44px;
      min-width: 44px;
    }
    .pick button.on { background: var(--deep); color: #ffffff; border-color: var(--deep); }
    .paper {
      background: var(--soft);
      border: 2px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      font-weight: 600;
      line-height: 1.7;
      font-size: 1.06rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .paper h2 { color: var(--deep); font-size: 1.35rem; font-weight: 800; }
    .q { margin-top: 4px; padding-top: 12px; border-top: 1.5px dashed var(--line); }
    .engine-card {
      background: var(--soft);
      border: 2px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }
    .engine-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .engine-mode-group { display: inline-flex; flex-wrap: wrap; gap: 8px; }
    .ke-quiz-card, .ke-quiz-summary, .ke-classify-card, .ke-classify-summary {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ke-quiz-head, .ke-classify-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 800;
      color: var(--deep);
    }
    .ke-badge {
      padding: 4px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: var(--deep);
      font-size: 0.85rem;
    }
    .ke-progress { color: var(--muted); font-size: 0.92rem; }
    .ke-prompt { font-size: 1.15rem; font-weight: 800; color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
    .ke-audio-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ke-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ke-options { grid-template-columns: 1fr 1fr; } }
    .ke-option, .ke-btn {
      min-height: 46px;
      min-width: 44px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .ke-btn {
      background: var(--deep);
      color: #ffffff;
      border-color: var(--deep);
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      align-self: flex-start;
    }
    .ke-option.is-correct { background: #dcfce7; border-color: var(--ok); color: #14532d; }
    .ke-option.is-wrong { background: #fee2e2; border-color: var(--bad); color: #7f1d1d; }
    .ke-option:disabled, .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-item {
      text-align: center;
      padding: 18px 14px;
      background: #ffffff;
      border: 2px dashed var(--accent);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .ke-item-icon { font-size: clamp(36px, 9vw, 52px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.15rem, 2.5vw, 1.4rem); font-weight: 800; color: var(--deep-dark); overflow-wrap: anywhere; }
    .ke-item-sub { font-size: 0.92rem; font-weight: 700; color: var(--muted); }
    .ke-buckets { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 580px) { .ke-buckets { grid-template-columns: 1fr 1fr; } }
    .ke-bucket-btn {
      font-family: inherit;
      font-weight: 800;
      font-size: 0.95rem;
      min-height: 50px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 2px solid var(--line);
      background: #ffffff;
      color: var(--deep);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .ke-bucket-btn.is-correct { outline: 3px solid var(--ok); background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: 0.65; text-decoration: line-through; }
    .ke-feedback, .ke-classify-feedback {
      min-height: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--ink);
      line-height: 1.45;
    }
    .ke-feedback.is-good, .ke-classify-feedback.is-good { background: #dcfce7; color: #14532d; border: 1.5px solid var(--ok); }
    .ke-feedback.is-learn, .ke-classify-feedback.is-learn { background: #fef3c7; color: #78350f; border: 1.5px solid #d97706; }
    .ke-quiz-summary, .ke-classify-summary { text-align: center; padding: 16px 8px; align-items: center; }
    .ke-quiz-summary .ke-btn, .ke-classify-summary .ke-btn { align-self: center; }
    .speech-status {
      font-size: 0.88rem;
      font-weight: 700;
      color: #78350f;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 8px 12px;
      display: none;
    }
    .speech-status.show { display: block; }
    .footer { padding: 10px 16px; font-size: 0.8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .btn:active { transform: none; }
    }
  </style>
</head>

<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back()">← กลับคลังสื่อ</button>
    <h1>📖 ใบความรู้วรรณคดีสั้น</h1>
    <span class="badge">ป.4–6 · ภาษาไทย</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on" aria-pressed="true">📖 เรียนรู้</button>
      <button type="button" data-mode="practice" aria-pressed="false">✏️ ฝึก</button>

    <div class="practice" id="practice">

            <button type="button" class="btn btn-primary" id="btnPracQuiz">📝 ทายสาระวรรณคดี</button>

        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="quizEngineRoot"></div>
        <div id="classifyEngineRoot" style="display:none;"></div>
      </div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
</div>

  { id: 'c6', icon: '👑', label: 'พระรามออกติดตามช่วยนางสีดา', bucketId: 'rama', reason: 'พระรามตามช่วยนางสีดาในเรื่องรามเกียรติ์' },
  { id: 'c7', icon: '🌱', label: 'ตาเจี้ย ตาแก้ว สอนเรื่องความขยันและความโลภ', bucketId: 'folk', reason: 'นิทานพื้นบ้านตาเจี้ย ตาแก้ว สอนเรื่องความขยันและความไม่โลภ' },
  { id: 'c8', icon: '💡', label: 'คติสอนใจให้รู้จักผลของการเลือกทำดีและทำชั่ว', bucketId: 'folk', reason: 'นิทานพื้นบ้านเน้นคติสอนใจในชีวิตประจำวัน' },
];

let cur = STORIES[0];
let mode = 'learn';
let practiceSubMode = 'quiz';
let speaking = false;
let quizSession = null;
let classifySession = null;

function stopSpeech() {
  speaking = false;
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
    window.KampaiMediaLab.stopAllSpeech();
  } else {
    try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
    try { window.speechSynthesis?.cancel?.(); } catch (_) {}
  }
  document.querySelectorAll('.speech-status').forEach((el) => {
    el.textContent = '';
    el.classList.remove('show');
  });
}

function speakText(text, statusId) {
  const clean = String(text || '').trim();
  if (!clean) return;
  const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
    const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
    speaking = Boolean(res && res.ok);
    if (statusEl) {
      if (res && res.ok === false) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านเนื้อเรื่องบนหน้าจอต่อได้';
        statusEl.classList.add('show');
      } else {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try {
    if (window.KAMPAI?.sound?.speak) {
      window.KAMPAI.sound.speak(clean, 'th-TH', true);
      speaking = true;
      return;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'th-TH';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
      speaking = true;
      return;
    }
  } catch (_) {}
  speaking = false;
  if (statusEl) {
    statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านเนื้อเรื่องบนหน้าจอต่อได้';
    statusEl.classList.add('show');
  }
}

function cleanupEngines() {
  if (window.KampaiEngines?.Quiz?.cleanup) window.KampaiEngines.Quiz.cleanup();
  if (window.KampaiEngines?.ClassifyBucket?.cleanup) window.KampaiEngines.ClassifyBucket.cleanup();
}

function mountQuiz() {
  if (!window.KampaiEngines?.Quiz) return;
  cleanupEngines();
  quizSession = window.KampaiEngines.Quiz.mountChoice('#quizEngineRoot', {
    items: QUIZ_POOL,
    mode: 'media',
    roundSize: QUIZ_POOL.length,
    locale: 'th-TH',
    speak: (text) => speakText(text, 'speechStatusPractice'),
    onAnswer: (res) => {
      if (window.KAMPAI?.sound) {
        try {
          if (res.isCorrect) window.KAMPAI.sound.correct();
          else window.KAMPAI.sound.wrong();
        } catch (_) {}
      }
    },
  });
}

function mountClassify() {
  if (!window.KampaiEngines?.ClassifyBucket) return;
  cleanupEngines();
  classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
    items: CLASSIFY_ITEMS,
    buckets: STORY_BUCKETS,
    mode: 'media',
    roundSize: CLASSIFY_ITEMS.length,
    onAnswer: (res) => {
      if (window.KAMPAI?.sound) {
        try {
          if (res.isCorrect) window.KAMPAI.sound.correct();
          else window.KAMPAI.sound.wrong();
        } catch (_) {}
      }
    },
  });
}

function updatePracticeSubUI() {
  const isQuiz = practiceSubMode === 'quiz';
  document.getElementById('quizEngineRoot').style.display = isQuiz ? '' : 'none';
  document.getElementById('classifyEngineRoot').style.display = isQuiz ? 'none' : '';
  document.getElementById('btnPracQuiz').className = 'btn ' + (isQuiz ? 'btn-primary' : 'btn-ghost');
  document.getElementById('btnPracClassify').className = 'btn ' + (isQuiz ? 'btn-ghost' : 'btn-primary');
}

function setMode(nextMode) {
  stopSpeech();
  mode = nextMode === 'practice' ? 'practice' : 'learn';
  document.getElementById('shell').classList.toggle('mode-practice', mode === 'practice');
  document.querySelectorAll('#modeSeg button').forEach((x) => {
    const active = x.dataset.mode === mode;
    x.classList.toggle('on', active);
    x.setAttribute('aria-pressed', String(active));
  });
  document.getElementById('hintText').textContent = mode === 'learn'
    ? 'อ่านใบความรู้วรรณคดีสั้น — ไม่เก็บคะแนน'
    : 'ฝึกทบทวนสาระวรรณคดีและจำแนกตัวละคร (ไม่เก็บคะแนน)';
  if (mode === 'practice') {
    updatePracticeSubUI();
    if (practiceSubMode === 'classify') mountClassify();
    else mountQuiz();
  } else {
    cleanupEngines();
  }
}

function render() {
  document.getElementById('pick').innerHTML = STORIES.map((s) =>
    '<button type="button" data-id="' + s.id + '" class="' + (s.id === cur.id ? 'on' : '') + '">' + (s.emoji ? s.emoji + ' ' : '') + s.title + '</button>'
  ).join('');
  document.getElementById('paper').innerHTML =
    '<h2>' + (cur.emoji ? cur.emoji + ' ' : '') + cur.title + '</h2>' +
    '<p>' + cur.body + '</p>' +
    '<div class="q"><strong>คำถามท้ายบท:</strong> ' + cur.q + '</div>' +
    '<div><button type="button" class="btn btn-primary" id="btnSpeakStory">🔊 ฟังเนื้อเรื่อง</button></div>';
  document.getElementById('btnSpeakStory').onclick = () => {
    speakText(cur.title + ' ' + cur.body + ' คำถามท้ายบท ' + cur.q, 'speechStatusLearn');
  };
}

document.getElementById('pick').addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]');
  if (!b) return;
  stopSpeech();
  cur = STORIES.find((s) => s.id === b.dataset.id) || STORIES[0];
  render();
});

document.getElementById('modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) setMode(b.dataset.mode);
});

document.getElementById('btnPracQuiz').addEventListener('click', () => {
  stopSpeech();
  practiceSubMode = 'quiz';
  updatePracticeSubUI();
  mountQuiz();
});

document.getElementById('btnPracClassify').addEventListener('click', () => {
  stopSpeech();
  practiceSubMode = 'classify';
  updatePracticeSubUI();
  mountClassify();
});

document.getElementById('btnPracSpeak').addEventListener('click', () => {
  if (practiceSubMode === 'classify') {
    const item = classifySession?.currentItem?.();
    speakText(item ? item.label + ' อยู่เรื่องใด' : 'จำแนกครบทุกข้อแล้ว', 'speechStatusPractice');
  } else {
    const q = quizSession?.currentQuestion?.();
    speakText(q ? q.prompt : 'ฝึกครบทุกข้อแล้ว', 'speechStatusPractice');
  }
});

document.getElementById('btnFs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopSpeech();
});
window.addEventListener('pagehide', stopSpeech);

window.getState = () => Object.freeze({
  slug: MEDIA_SLUG,
  mode: mode,
  practiceSubMode: practiceSubMode,
  selectedStoryId: cur.id,
  storyCount: STORIES.length,
  speaking: speaking,
  quizState: quizSession ? quizSession.getState() : null,
  classifyState: classifySession ? classifySession.getState() : null,
  reducedMotion: typeof window.matchMedia === 'function'
    ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    : false,
});
window.__getState = window.getState;

render();
setMode('learn');
</script>
</body>
</html>
