<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-idiom-hub/index.html"><meta name="curriculum-indicators" content="ท 4.1 ป.4/1, ท 4.1 ป.5/1"><title>ใบงานสำนวนไทย Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.181.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.word-bank{display:flex;flex-wrap:wrap;gap:1mm;margin:.8mm 0}
.word-bank span{border:1px solid var(--ws-line);border-radius:3px;padding:.4mm 1.5mm;font-size:8pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>💬 ใบงานสำนวนไทย Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="meaning">ความหมาย</option><option value="use">ใช้ในประโยค</option><option value="match">จับคู่</option><option value="create">สร้างประโยค</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const IDM_ITEMS=[
{type:'meaning',prompt:'"ช้างเผือก" หมายถึง',context:'ช้างเผือก',choices:['ของหายาก/มีค่า','ช้างสีขาวจริง'],answer:'ของหายาก มีค่า หาได้ยาก',step1:'ไม่ใช่ช้างจริง',step2:'สำนวน',step3:'ของหายาก'},
{type:'meaning',prompt:'"น้ำท่วมปาก" หมายถึง',context:'น้ำท่วมปาก',choices:['ปากแข็ง ไม่พูด','น้ำเข้าปาก'],answer:'ปากแข็ง ไม่พูดความลับ',step1:'ไม่ใช่น้ำจริง',step2:'เก็บความลับ',step3:'ปากแข็ง'},
{type:'use',prompt:'ใช้ "มือทอง" ในประโยค',context:'มือทอง',choices:['เขามือทอง ทำงานเก่ง','เขามือทองเป็นทอง'],answer:'เขามือทอง ทำงานเก่ง',step1:'มือทอง=เก่ง',step2:'ไม่ใช่ทองจริง',step3:'ทำงานเก่ง'},
{type:'use',prompt:'"ใจแข็ง" ใช้เมื่อ',context:'ใจแข็ง',choices:['อดทน ไม่ยอมแพ้','หัวใจแข็ง'],answer:'อดทน ไม่ยอมแพ้',step1:'ไม่ใช่หัวใจแข็ง',step2:'อดทน',step3:'ไม่ยอมแพ้'},
{type:'match',prompt:'จับคู่: ปากหวาน = ?',context:'ปากหวาน',choices:['พูดจาดี','รสหวาน'],answer:'พูดจาดี ไพเราะ',step1:'ปากไม่มีรส',step2:'สำนวน',step3:'พูดดี'},
{type:'match',prompt:'"ตาไม่ดี" ในบริบทสายตา',context:'ตาไม่ดี',choices:['สายตาไม่ดี','ใจร้าย'],answer:'สายตาไม่ดี มองไม่ชัด',step1:'บริบทสายตา',step2:'ตรงตัว',step3:'มองไม่ชัด'},
{type:'create',prompt:'สร้างประโยคใช้ "น้ำใจดี"',context:'น้ำใจดี',choices:['ป้ามีน้ำใจดี ช่วยเพื่อนบ้าน','ป้าน้ำใจดีเป็นน้ำ'],answer:'ป้ามีน้ำใจดี ช่วยเพื่อนบ้าน',step1:'น้ำใจดี=ใจดี',step2:'ใส่บริบท',step3:'ประโยคสมบูรณ์'},
{type:'create',prompt:'สร้างประโยค "หูตาล่าไปทั่ว"',context:'หูตาล่า',choices:['เด็กหูตาล่าไปทั่ว อยากรู้ทุกอย่าง','หูตาเดิน'],answer:'เด็กหูตาล่าไปทั่ว อยากรู้ทุกอย่าง',step1:'อยากรู้',step2:'ไม่ใช่หูตาเดิน',step3:'อยากรู้ทุกอย่าง'},
{type:'meaning',prompt:'"กินลิ้นกินเสียง" หมายถึง',context:'กินลิ้น',choices:['อิจฉา','กินลิ้น'],answer:'อิจฉา เมื่อเห็นคนอื่นดี',step1:'ไม่กินลิ้นจริง',step2:'อิจฉา',step3:'ไม่พอใจ'},
{type:'use',prompt:'"มือทอง" กับ "มือเหล็ก" ต่างกัน',context:'เปรียบเทียบ',choices:['ทอง=เก่ง · เหล็ก=แข็งแรง','เหมือนกัน'],answer:'มือทอง=ทำงานเก่ง · มือเหล็ก=แข็งแรงอดทน',step1:'ทอง=ฝีมือ',step2:'เหล็ก=แข็ง',step3:'ต่างความหมาย'},
{type:'match',prompt:'"หัวใจทองคำ" = ?',context:'หัวใจทองคำ',choices:['ใจดี','หัวใจทอง'],answer:'ใจดี มีน้ำใจ',step1:'ไม่ใช่ทองจริง',step2:'อุปมา',step3:'ใจดี'},
{type:'meaning',prompt:'"ช้าๆ ได้พร้าเล่มงาม" สอน',context:'สำนวน',choices:['อดทนทำทีละน้อย','รีบร้อน'],answer:'อดทนทำทีละน้อย จะได้ผลดี',step1:'ช้าแต่ดี',step2:'อดทน',step3:'ทีละน้อย'}
];
const SKILL={meaning:'ความหมาย',use:'ใช้ประโยค',match:'จับคู่',create:'สร้างประโยค'};
window.WORKSHEET_CONFIG={
  icon:'💬',title:'ใบงานสำนวนไทย Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'สำนวน Hub',
  sourceMediaUrl:'/games/thai/thai-idiom-hub/index.html',indicators:['ท 4.1 ป.4/1','ท 4.1 ป.5/1'],
  directions:'ติ๊กทักษะ → อ่านสำนวน → หาความหมาย → ใช้ในประโยค',
  getItems(t){return t==='mixed'?IDM_ITEMS:IDM_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const s1=item.step1||item.s1||'',s2=item.step2||item.s2||'',s3=item.step3||item.s3||'';
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="word-bank"><span>'+e(item.context)+'</span></div>'
      +'<div class="tick-grid"><div class="tick-box">□ ความหมาย</div><div class="tick-box">□ ใช้ประโยค</div><div class="tick-box">□ จับคู่</div><div class="tick-box">□ สร้างประโยค</div></div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 อ่าน</span><div class="step-body"><span class="work-fill">'+e(s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 ความหมาย</span><div class="step-body"><span class="work-fill">'+e(s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ใช้</span><div class="step-body"><span class="work-fill">'+e(s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.181.0"></script></body></html>
