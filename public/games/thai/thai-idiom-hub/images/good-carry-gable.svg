    </g>
    <text x="400" y="100" font-family="Sarabun" font-size="28" font-weight="800" fill="#14532d" text-anchor="middle">ประพฤติตนดีจะมีความสุขสบาย หากประพฤติชั่วชีวิตจะพบแต่ความลำบาก</text>
