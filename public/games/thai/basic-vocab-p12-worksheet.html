<header class="toolbar"><h1>📚 ใบงานคำพื้นฐาน</h1><div class="toolbar-ctrls">

  <select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select>
  <select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="1">ป.1–ป.2</option></select>
  <select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">รวม</option><option value="home">บ้าน</option><option value="nature">ธรรมชาติ</option></select>

</div></header>
<main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/qrcode-generator.min.js?v=1.195.0"></script>

<script>
const ITEMS=[{"type":"home","prompt":"ใครสอนที่โรงเรียน","answer":"ครู"},{"type":"home","prompt":"นั่งบนอะไร","answer":"เก้าอี้"},{"type":"home","prompt":"ดื่มเมื่อกระหาย","answer":"น้ำ"},{"type":"nature","prompt":"สัตว์ที่เห่า","answer":"หมา"},{"type":"nature","prompt":"เมฆดำมักเกิด","answer":"ฝน"},{"type":"home","prompt":"เขียนคำว่า พ่อ แม่","answer":"พ่อ แม่"},{"type":"home","prompt":"วาดโต๊ะแล้วเขียนคำ","answer":"โต๊ะ"},{"type":"nature","prompt":"นก ปลา แมว รวมว่า","answer":"สัตว์"},{"type":"home","prompt":"มาโรงเรียนอย่างไรได้บ้าง","answer":"รถ/เดิน"},{"type":"nature","prompt":"ต้นไม้จัดเป็น","answer":"ธรรมชาติ / พืช"},{"type":"home","prompt":"ของในกล่องข้าว 1 อย่าง","answer":"ตามนักเรียน"},{"type":"home","prompt":"คำเรียกพี่ชาย","answer":"พี่"},{"type":"nature","prompt":"แดด ฝน ลม คือ","answer":"ธรรมชาติ"},{"type":"home","prompt":"เปิดเข้าห้องใช้สิ่งใด","answer":"ประตู"},{"type":"nature","prompt":"วาดฝนแล้วเขียนคำ","answer":"ฝน"},{"type":"home","prompt":"สรุปคำใหม่ที่จำได้ 3 คำ","answer":"ตามนักเรียน"}];

  mediaLabel:'สื่อคำพื้นฐาน',sourceMediaUrl:'/games/thai/basic-vocab-p12-media.html',

  directions:"จับคู่คำใกล้ตัว · เขียนคำ · วาดประกอบ",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},

<script src="/games/worksheet-topic.js?v=1.199.1"></script>
<script>
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
