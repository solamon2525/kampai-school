<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background Gradient (Deep Sunset Track) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c2e"/>
      <stop offset="0.4" stop-color="#2c0c4d"/>
      <stop offset="0.8" stop-color="#4a154b"/>
      <stop offset="1" stop-color="#6b114d"/>
    </linearGradient>
    
    <!-- Title Gold Gradient -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF59D"/>
      <stop offset="0.4" stop-color="#FBC02D"/>
      <stop offset="0.8" stop-color="#F57F17"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Rainbow Tag Gradient -->
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.3" stop-color="#00E676"/>
      <stop offset="0.6" stop-color="#FFD700"/>
      <stop offset="0.8" stop-color="#FF1744"/>
      <stop offset="1" stop-color="#D500F9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8F00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow filter -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  <!-- Glowing Sun in Background -->
  <circle cx="950" cy="220" r="280" fill="url(#sun-glow)"/>
  <circle cx="350" cy="450" r="350" fill="url(#glow)"/>

  <!-- Speed Lines / Horizon -->
  <g stroke="#ffffff" opacity="0.08" stroke-width="2">
    <line x1="0" y1="520" x2="1280" y2="520" stroke-width="4"/>
    <line x1="0" y1="535" x2="1280" y2="535" stroke-dasharray="10 15"/>
    <line x1="0" y1="555" x2="1280" y2="555" stroke-dasharray="20 30"/>
    <line x1="0" y1="585" x2="1280" y2="585" stroke-width="6"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#fff" opacity="0.5">
    <circle cx="100" cy="100" r="2" />
    <circle cx="280" cy="180" r="1.5" />
    <circle cx="1200" cy="150" r="2.5" />
    <circle cx="850" cy="90" r="1.5" />
    <circle cx="700" cy="190" r="2" />
    <circle cx="150" cy="320" r="1.5" />
  </g>

  <!-- Floating Alphabet / Spell boxes (Glow) -->
  <g fill="#fff" filter="url(#sh)">
    <!-- Correct box -->
    <g transform="translate(180, 260) rotate(-10)">
      <rect x="-40" y="-40" width="80" height="80" rx="15" fill="#00E676" opacity="0.85"/>
      <rect x="-40" y="-40" width="80" height="80" rx="15" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="0" y="10" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">กน</text>
    </g>
    <!-- Tricky box -->
    <g transform="translate(1080, 220) rotate(15)">
      <rect x="-40" y="-40" width="80" height="80" rx="15" fill="#FF1744" opacity="0.85"/>
      <rect x="-40" y="-40" width="80" height="80" rx="15" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="0" y="12" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">กง</text>
    </g>
    <!-- Background letters -->
    <text x="320" y="150" font-size="70" opacity="0.1" fill="url(#neon-cyan)" text-anchor="middle" font-weight="900">เกย</text>
    <text x="980" y="480" font-size="80" opacity="0.15" fill="#FFD700" text-anchor="middle" font-weight="900">กบ</text>
    <text x="120" y="520" font-size="60" opacity="0.08" fill="#D500F9" text-anchor="middle" font-weight="900">เกอว</text>
  </g>

  <!-- Badge / Subject header -->
  <g transform="translate(640, 110)">
    <rect x="-240" y="-28" width="480" height="56" rx="28" fill="#ffffff" opacity="0.07"/>
    <rect x="-240" y="-28" width="480" height="56" rx="28" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="2" font-size="24" font-weight="700" fill="#00E5FF" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">🏁 วิชาภาษาไทย ป.4 🏁</text>
  </g>

  <!-- Main Title -->
  <g filter="url(#sh)">
    <text x="640" y="230" font-size="105" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">มอไซต์จอมลุยมาตรา</text>
    <text x="640" y="315" font-size="36" font-weight="700" fill="#E1BEE7" text-anchor="middle" dominant-baseline="middle" letter-spacing="1.5">Spelling Moto Master</text>
  </g>

  <!-- Vector Motorcycle & Rider Mascot (Epic Platformer Style) -->
  <g transform="translate(640, 480) scale(1.6) translate(-75, -50)" filter="url(#sh)">
    <!-- Road slope line -->
    <path d="M -150 90 L 300 90" stroke="#8BC34A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Dust/Particles from rear wheel -->
    <circle cx="-35" cy="75" r="8" fill="#FFD700" opacity="0.4"/>
    <circle cx="-55" cy="70" r="5" fill="#FF9100" opacity="0.5"/>
    <circle cx="-70" cy="80" r="6" fill="#ddd" opacity="0.3"/>

    <!-- Cape waving -->
    <path d="M 20 5 L -45 5 C -25 25 -35 35 -60 20 C -40 5 -35 -5 20 -2 Z" fill="#FF1744"/>

    <!-- Rear Wheel -->
    <circle cx="-10" cy="70" r="25" fill="#37474F"/>
    <circle cx="-10" cy="70" r="17" fill="#CFD8DC"/>
    <circle cx="-10" cy="70" r="8" fill="#37474F"/>
    <!-- Spokes -->
    <line x1="-10" y1="45" x2="-10" y2="95" stroke="#37474F" stroke-width="2"/>
    <line x1="-35" y1="70" x2="15" y2="70" stroke="#37474F" stroke-width="2"/>

    <!-- Front Wheel -->
    <circle cx="120" cy="70" r="25" fill="#37474F"/>
    <circle cx="120" cy="70" r="17" fill="#CFD8DC"/>
    <circle cx="120" cy="70" r="8" fill="#37474F"/>
    <!-- Spokes -->
    <line x1="120" y1="45" x2="120" y2="95" stroke="#37474F" stroke-width="2"/>
    <line x1="95" y1="70" x2="145" y2="70" stroke="#37474F" stroke-width="2"/>

    <!-- Engine / Metallic Parts -->
    <rect x="25" y="45" width="40" height="25" rx="5" fill="#78909C"/>
    <circle cx="45" cy="58" r="8" fill="#B0BEC5"/>

    <!-- Exhaust Pipe -->
    <path d="M 15 65 L -35 55" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>

    <!-- Motorcycle Yellow Frame -->
    <path d="M 5 35 L 75 30 L 115 68 L 70 70 L 30 70 Z" fill="#FFD54F" stroke="#FFB300" stroke-width="3"/>
    
    <!-- Seat -->
    <path d="M 10 32 L 55 30 L 45 40 Z" fill="#263238"/>

    <!-- Handlebar & Fork -->
    <line x1="100" y1="65" x2="75" y2="15" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
    <rect x="65" y="10" width="20" height="6" rx="2" fill="#263238"/>

    <!-- Rider Legs -->
    <path d="M 38 32 L 60 55 L 45 68" fill="none" stroke="#1976D2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Rider Torso -->
    <ellipse cx="45" cy="12" rx="14" ry="19" fill="#FF6D00" transform="rotate(15 45 12)"/>

    <!-- Rider Arms -->
    <path d="M 45 5 L 72 12" fill="none" stroke="#FF6D00" stroke-width="8" stroke-linecap="round"/>

    <!-- Helmet / Head (Mascot style) -->
    <circle cx="50" cy="-20" r="18" fill="#29B6F6"/>
    <!-- Goggles Visor -->
    <path d="M 42 -22 Q 62 -22 66 -16 Q 62 -10 42 -14 Z" fill="#263238"/>
    <path d="M 45 -20 Q 58 -20 62 -16 Q 58 -12 45 -15 Z" fill="#00E5FF"/>
  </g>

  <!-- Bottom Banner & Tags -->
  <g transform="translate(640, 645)">
    <rect x="-440" y="-26" width="880" height="52" rx="26" fill="url(#rainbow)" opacity="0.18"/>
    <rect x="-440" y="-26" width="880" height="52" rx="26" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" opacity="0.95">⏱️ ท้าทายเวลา · 🏍️ ควบคุมรถลุยด่าน · 📦 ชนกล่องสะกดคำ · 🔄 สุ่มภารกิจมาตรา</text>
  </g>
</svg>
