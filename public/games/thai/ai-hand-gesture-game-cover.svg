<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset="0.5" stop-color="#155e75"/><stop offset="1" stop-color="#060918"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#facc15"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="680" ry="380" fill="url(#glow)"/>
  <g fill="#fff"><circle cx="120" cy="100" r="2" opacity="0.5"/><circle cx="1100" cy="120" r="2" opacity="0.5"/><circle cx="220" cy="250" r="1.5" opacity="0.4"/><circle cx="1180" cy="280" r="1.5" opacity="0.4"/></g>

  <!-- floating bilingual words (รอบ ๆ ไม่บังคน) -->
  <g font-weight="700" opacity="0.16" fill="#e0f2fe">
    <text x="180" y="470" font-size="46" text-anchor="middle">apple</text>
    <text x="1090" y="450" font-size="46" text-anchor="middle">มาตรา</text>
    <text x="250" y="600" font-size="40" text-anchor="middle">cat</text>
    <text x="1030" y="600" font-size="40" text-anchor="middle">ควบกล้ำ</text>
  </g>

  <!-- badge -->
  <g transform="translate(640,104)">
    <rect x="-250" y="-26" width="500" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="25" font-weight="600" fill="#cffafe" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">✋ KAMPAI · บูรณาการ ไทย+อังกฤษ · ป.4–6 · AR โบกมือ</text>
  </g>
  <!-- title -->
  <text x="640" y="234" font-size="104" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">อัจฉริยะสองภาษา</text>
  <text x="640" y="306" font-size="30" font-weight="700" fill="#a5f3fc" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">โบกมือ AI · จีบ–กำ–แบ · ลากคำศัพท์ไทย/อังกฤษ</text>

  <!-- chibi student ทำท่ามือ (กลางล่าง เด่น ไม่มีของบัง) -->
  <g transform="translate(640,560)" stroke="#060918" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M -12 24 L -16 66" fill="none" stroke-width="14"/>
    <path d="M 12 24 L 16 66" fill="none" stroke-width="14"/>
    <rect x="-22" y="2" width="44" height="30" rx="8" fill="#155e75"/>
    <path d="M -26 -36 q 26 -13 52 0 l 5 38 q -30 13 -62 0 z" fill="#f8fafc"/>
    <!-- arms ยกขึ้นสองข้าง ทำท่ามือ -->
    <path d="M -24 -26 L -54 -54" fill="none" stroke-width="12"/>
    <path d="M 24 -26 L 54 -54" fill="none" stroke-width="12"/>
    <!-- head -->
    <circle cx="0" cy="-62" r="32" fill="#fcd9b6"/>
    <path d="M -32 -68 q 32 -36 64 0 q -8 -16 -32 -16 q -24 0 -32 16 z" fill="#3b2a1d"/>
    <circle cx="-11" cy="-62" r="3.6" fill="#060918" stroke="none"/>
    <circle cx="13" cy="-62" r="3.6" fill="#060918" stroke="none"/>
    <path d="M -10 -49 q 10 9 22 0" fill="none" stroke-width="3"/>
  </g>
  <!-- ท่ามือ emoji รอบตัวเด็ก (ไม่บังหน้า/ตัว) -->
  <text x="500" y="500" font-size="72" text-anchor="middle" filter="url(#sh)">🤏</text>
  <text x="640" y="392" font-size="58" text-anchor="middle" filter="url(#sh)">✊</text>
  <text x="780" y="500" font-size="72" text-anchor="middle" filter="url(#sh)">🖐️</text>

  <!-- footer -->
  <g transform="translate(640,678)">
    <rect x="-275" y="-24" width="550" height="48" rx="24" fill="#facc15" opacity="0.16"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle" font-family="'Sarabun',sans-serif">เล่นด้วยกล้อง AI หรือเมาส์/แตะ · หลายโหมด ไทย+อังกฤษ</text>
  </g>
</svg>
