<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Prompt','Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b1e"/>
      <stop offset="40%" stop-color="#141132"/>
      <stop offset="80%" stop-color="#2d134d"/>
      <stop offset="100%" stop-color="#18072b"/>
    </linearGradient>

    <!-- Retro Gold Title Gradient -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Neon Cyan Light Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Neon Pink Light Gradient -->
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Neon Red Gradient -->
    <linearGradient id="neonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Neon Green Gradient -->
    <linearGradient id="neonGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Retro Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Radial highlight -->
  <circle cx="640" cy="280" r="450" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Retro clouds/water line at bottom -->
  <path d="M0 640 Q 320 620, 640 640 T 1280 640 L 1280 720 L 0 720 Z" fill="#0c071d" opacity="0.8"/>
  <path d="M0 650 Q 320 635, 640 650 T 1280 650 L 1280 720 L 0 720 Z" fill="#1b1236" opacity="0.5"/>

  <!-- Floating Retro Platforms -->
  <g filter="url(#shadow)" fill="#312e81" stroke="#4f46e5" stroke-width="4">
    <!-- Left Platform -->
    <path d="M 120 400 L 280 400 L 260 420 L 140 420 Z"/>
    <!-- Right Platform -->
    <path d="M 1000 360 L 1160 360 L 1140 380 L 1020 380 Z"/>
  </g>

  <!-- Stars / Sparkles (Retro Style) -->
  <path d="M220 120 l6 -12 l6 12 l12 6 l-12 6 l-6 12 l-6 -12 l-12 -6 z" fill="#fbbf24" opacity="0.8"/>
  <path d="M1060 180 l8 -16 l8 16 l16 8 l-16 8 l-8 16 l-8 -16 l-16 -8 z" fill="#22d3ee" opacity="0.7"/>
  <path d="M150 500 l5 -10 l5 10 l10 5 l-10 5 l-5 10 l-5 -10 l-10 -5 z" fill="#f43f5e" opacity="0.6"/>

  <!-- Watermark Thai character -->
  <text x="640" y="320" font-size="420" font-weight="900" fill="#ffffff" opacity="0.02" text-anchor="middle" dominant-baseline="middle">บ</text>

  <!-- Top Ribbon / Category -->
  <g transform="translate(640, 85)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <text x="0" y="2" font-size="22" font-weight="600" fill="#93c5fd" text-anchor="middle" dominant-baseline="middle" letter-spacing="1.5">🎈 KAMPAI · เกมการศึกษาภาษาไทย</text>
  </g>

  <!-- Floating Vocabulary Balloons & Strings -->
  <!-- Balloon 1: Red (Correct Spelling) -->
  <g transform="translate(200, 260)" filter="url(#shadow)">
    <path d="M0 50 Q -10 120, -5 200" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="60" ry="70" fill="url(#neonRed)"/>
    <polygon points="-8,70 8,70 0,60" fill="#b91c1c"/>
    <text x="0" y="5" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">กะพริบ</text>
    <circle cx="45" cy="-45" r="12" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <path d="M40 -45 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Balloon 2: Cyan (Wrong Spelling) -->
  <g transform="translate(1080, 210)" filter="url(#shadow)">
    <path d="M0 50 Q 15 110, 5 190" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="60" ry="70" fill="url(#neonCyan)"/>
    <polygon points="-8,70 8,70 0,60" fill="#0891b2"/>
    <text x="0" y="5" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">กระพริบ</text>
    <circle cx="45" cy="-45" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <path d="M40 -50 l10 10 M50 -50 l-10 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Balloon 3: Pink (Correct Spelling) -->
  <g transform="translate(380, 500)" filter="url(#shadow)">
    <path d="M0 40 Q -15 80, 0 130" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="55" ry="62" fill="url(#neonPink)"/>
    <polygon points="-7,62 7,62 0,53" fill="#be185d"/>
    <text x="0" y="4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">อนุญาต</text>
  </g>

  <!-- Balloon 4: Green (Correct Spelling) -->
  <g transform="translate(860, 480)" filter="url(#shadow)">
    <path d="M0 40 Q 20 90, -10 150" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="55" ry="62" fill="url(#neonGreen)"/>
    <polygon points="-7,62 7,62 0,53" fill="#15803d"/>
    <text x="0" y="4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">สังเกต</text>
  </g>

  <!-- Flying Character Silhouette (Center Left) -->
  <g transform="translate(480, 240)" filter="url(#shadow)">
    <!-- Character's balloons -->
    <!-- Left balloon -->
    <path d="M-30 -50 L-10 0" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="-40" cy="-75" rx="25" ry="32" fill="#f43f5e" opacity="0.95"/>
    <polygon points="-43,-43 -37,-43 -40,-47" fill="#be185d"/>

    <!-- Right balloon -->
    <path d="M25 -52 L10 0" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <ellipse cx="30" cy="-78" rx="25" ry="32" fill="#06b6d4" opacity="0.95"/>
    <polygon points="27,-46 33,-46 30,-50" fill="#0891b2"/>

    <!-- Character Body -->
    <circle cx="0" cy="10" r="14" fill="#ffffff"/> <!-- Head/Helmet -->
    <path d="M-12 24 L12 24 L16 50 L-16 50 Z" fill="#ffffff"/> <!-- Torso -->
    <circle cx="0" cy="35" r="8" fill="#fbbf24"/> <!-- Emblem -->
    <!-- Arms flying -->
    <path d="M-14 26 Q-30 20, -28 10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 26 Q30 20, 28 10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs dangling -->
    <path d="M-8 50 L-10 70 L-4 72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M8 50 L10 70 L4 72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle in Center -->
  <g transform="translate(640, 280)" filter="url(#shadow)">
    <!-- Retro Arcade Glow Border Behind Title -->
    <text x="0" y="60" font-size="124" font-weight="900" fill="none" stroke="#a855f7" stroke-width="24" stroke-linejoin="round" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">บอลลูนไฟเตอร์</text>
    <text x="0" y="60" font-size="124" font-weight="900" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linejoin="round" text-anchor="middle" dominant-baseline="middle">บอลลูนไฟเตอร์</text>

    <!-- Front Title Text -->
    <text x="0" y="60" font-size="124" font-weight="900" fill="url(#titleGold)" text-anchor="middle" dominant-baseline="middle">บอลลูนไฟเตอร์</text>
  </g>

  <!-- English Subtitle -->
  <text x="640" y="410" font-size="34" font-weight="800" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)" letter-spacing="4">BALLOON FIGHTER</text>

  <!-- Description Text (List of words features) -->
  <text x="640" y="475" font-size="28" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
    เกมฝึกสะกดคำศัพท์ภาษาไทย · คำราชาศัพท์ · คำยืมภาษาต่างประเทศ
  </text>

  <!-- Play Ribbon Button (Bottom) -->
  <g transform="translate(640, 565)" filter="url(#shadow)">
    <!-- Outer glass container -->
    <rect x="-340" y="-30" width="680" height="60" rx="30" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="2.5"/>
    <!-- Small decoration icon -->
    <circle cx="-300" cy="0" r="12" fill="#ef4444"/>
    <circle cx="-300" cy="0" r="6" fill="#ffffff"/>
    <circle cx="300" cy="0" r="12" fill="#10b981"/>
    <circle cx="300" cy="0" r="6" fill="#ffffff"/>
    <!-- Text -->
    <text x="0" y="2" font-size="24" font-weight="700" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle">
      🎮 บินเหยียบบอลลูนมอนสเตอร์ที่สะกดถูกต้อง เพื่อพิชิตบอสเวิลด์!
    </text>
  </g>

  <!-- Footer Version -->
  <text x="1240" y="695" font-size="16" font-weight="500" fill="#64748b" text-anchor="end">v2.0.0 (Ultimate Edition)</text>
</svg>
