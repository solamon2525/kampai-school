<style>

<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const DICT_ITEMS=[
 {type:'order',prompt:'เรียงตามพจนานุกรม: กา เก ไก่',words:'กา เก ไก่',answer:'กา → ไก่ → เก',s1:'ดูพยัญชนะต้น ก',s2:'เทียบสระ/รูปคำ',s3:'กา → ไก่ → เก'},
 {type:'order',prompt:'เรียง: บ้าน ป่า ปา',words:'บ้าน ป่า ปา',answer:'ป่า → ปา → บ้าน',s1:'พยัญชนะ ป / บ',s2:'เรียงตามลำดับพจนานุกรม',s3:'ป่า → ปา → บ้าน'},
 {type:'order',prompt:'คำใดมาก่อน: สวย หรือ สวัสดี',words:'สวย สวัสดี',answer:'สวัสดี มาก่อน สวย',s1:'พยัญชนะต้น ส',s2:'เทียบพยางค์ถัดไป',s3:'สวัสดี มาก่อน'},

 {type:'lookup',prompt:'หาความหมายของคำว่า "อดทน"',words:'อดทน',answer:'ทนต่อความยากลำบากได้โดยไม่ท้อ',s1:'หาพยัญชนะ อ',s2:'เปิดหน้า “อดทน”',s3:'ทนได้โดยไม่ท้อ'},
 {type:'lookup',prompt:'หาความหมายของคำว่า "ขยัน"',words:'ขยัน',answer:'ตั้งใจทำกิจโดยไม่เกียจคร้าน',s1:'หาพยัญชนะ ข',s2:'เปิดหน้า “ขยัน”',s3:'ตั้งใจทำ ไม่เกียจคร้าน'},
 {type:'lookup',prompt:'ส่วนใดของพจนานุกรมบอกวิธีอ่าน',words:'โครงสร้าง',answer:'สัทอักษร/คำอ่าน (ถ้ามี)',s1:'ดูโครงสร้างรายการคำ',s2:'ส่วนอ่าน/สัทอักษร',s3:'บอกวิธีอ่าน'},
 {type:'use',prompt:'ใช้คำ "อดทน" ในประโยค 1 ประโยค',words:'อดทน',answer:'เช่น นักเรียนต้องอดทนฝึกอ่านทุกวัน',s1:'เลือกความหมายที่ถูก',s2:'ใส่ในบริบท',s3:'เขียนประโยคสมบูรณ์'},
 {type:'use',prompt:'ใช้คำ "ขยัน" ในประโยค 1 ประโยค',words:'ขยัน',answer:'เช่น เด็กขยันช่วยงานบ้าน',s1:'เลือกความหมาย',s2:'ใส่ในบริบท',s3:'เขียนประโยคสมบูรณ์'},

 {type:'use',prompt:'ถ้าคำมีหลายความหมาย ควรเลือกอย่างไร',words:'บริบท',answer:'เลือกความหมายที่เข้ากับประโยค',s1:'อ่านทุกความหมาย',s2:'เทียบกับบริบทประโยค',s3:'เลือกความหมายที่เข้ากัน'},
 {type:'lookup',prompt:'ขั้นค้นหาในพจนานุกรมมีอะไรบ้าง',words:'5 ขั้น',answer:'ดูพยัญชนะต้น → สระ → วรรณยุกต์ → อ่านความหมาย → เลือกใช้',s1:'พยัญชนะต้น → สระ',s2:'วรรณยุกต์ → อ่านความหมาย',s3:'เลือกใช้ตามบริบท'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'dictionary',icon:'📖',title:'ใบงานใช้พจนานุกรม',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'พจนานุกรมดิจิทัล',
  sourceMediaUrl:'/games/thai/dictionary-media.html',indicators:['ท 4.1 ป.3/3','ท 4.1 ป.4/3'],
  directions:'เรียงคำตามพจนานุกรม หาความหมาย และนำไปใช้ในประโยค',
  getItems(topic){return topic==='mixed'?DICT_ITEMS:DICT_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const tags=item.type==='order'
      ?['1 พยัญชนะ','2 เทียบลำดับ','3 เรียง']
      :item.type==='lookup'
        ?['1 หาหน้า','2 อ่าน','3 ความหมาย']
        :['1 ความหมาย','2 บริบท','3 ประโยค'];
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="word-bank"><span>'+e(item.words)+'</span></div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">'+tags[0]+'</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[1]+'</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[2]+'</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
