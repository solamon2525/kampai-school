<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview · กระต่าย thai-sara-run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(180deg,#fce7f3,#e0f2fe);padding:20px;color:#334155}
h1{color:#be185d;font-size:1.3rem} p{margin:8px 0 16px;color:#64748b;font-size:.88rem}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;border:3px solid #fbcfe8}
canvas{display:block;margin:0 auto;image-rendering:pixelated;border-radius:10px;border:2px solid #e2e8f0;background-color:#f1f5f9;background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%),linear-gradient(-45deg,#cbd5e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd5e1 75%),linear-gradient(-45deg,transparent 75%,#cbd5e1 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.box{text-align:center;font-size:.7rem;color:#94a3b8;margin-top:4px}
img{max-width:100%;image-rendering:pixelated;border-radius:10px;border:2px solid #e2e8f0;margin-top:8px}
</style></head><body>
<h1>🐰 กระต่าย grid 3×6 · thai-sara-run</h1>
<p>170×227 · วิ่ง / โดด / ยืน</p>
<div class="card"><div class="row">
<div><canvas id="idle" width="200" height="260"></canvas><div class="box">ยืน</div></div>
<div><canvas id="run" width="200" height="260"></canvas><div class="box">วิ่ง</div></div>
<div><canvas id="jump" width="200" height="260"></canvas><div class="box">โดด</div></div>
</div></div>
<div class="card"><img src="bunny-blue-sheet.png?v=4" alt="sheet"></div>
<script>
const FW=170,FH=227,COLS=6;
const IDLE=[12,13,14,15,16,17],RUN=[0,1,2,3,4,5],JUMP=[6,7,8,9,10,11];
function rect(i){return{sx:(i%COLS)*FW,sy:Math.floor(i/COLS)*FH};}
function load(s){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=s+'?v=4';});}
function loop(c,s,fr,fps){const x=c.getContext('2d');x.imageSmoothingEnabled=false;let n=0,t=0;
const sc=Math.min(c.width/FW,c.height/FH);
(function tick(now){if(now-t>1000/fps){t=now;n=(n+1)%fr.length;}
const r=rect(fr[n]);x.clearRect(0,0,c.width,c.height);
x.drawImage(s,r.sx,r.sy,FW,FH,(c.width-FW*sc)/2,(c.height-FH*sc)/2,FW*sc,FH*sc);
requestAnimationFrame(tick);})(0);}
function hold(c,s,f){const x=c.getContext('2d');x.imageSmoothingEnabled=false;
const sc=Math.min(c.width/FW,c.height/FH);const r=rect(f);
x.drawImage(s,r.sx,r.sy,FW,FH,(c.width-FW*sc)/2,(c.height-FH*sc)/2,FW*sc,FH*sc);}
load('bunny-blue-sheet.png').then(s=>{
loop(document.getElementById('idle'),s,IDLE,4);
loop(document.getElementById('run'),s,RUN,12);
loop(document.getElementById('jump'),s,JUMP,10);});
</script></body></html>
