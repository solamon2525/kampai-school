<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/homophone-context-media.html"><meta name="curriculum-indicators" content="ท 4.1 ป.5/1"><title>ใบงานคำพ้องเสียงและการเลือกใช้คำ ป.5</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/color-fill-pack.css?v=1.226.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.220.7" rel="stylesheet"></head><body><header class="toolbar"><h1>💬 ใบงานคำพ้องเสียงและการเลือกใช้คำ</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบ"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ชั้น"><option value="5">ป.5</option></select><select class="t-select" id="selCount" data-fixed-count="4" aria-label="จำนวนข้อ"><option value="4">4 ข้อ/หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="โรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครู"><option value="">-- เลือกครู --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"></main><script src="/games/worksheet-runtime.js?v=1.220.7"></script><script>window.COLOR_FILL_CONFIG={worksheetKey:'homophone-context-color-fill',icon:'💬',title:'คำพ้องเสียงและการเลือกใช้คำ',subject:'ภาษาไทย',grade:'ป.5',indicator:'ท 4.1 ป.5/1',art:'words',summaryLead:'คำพ้องเสียงออกเสียงเหมือนกัน แต่เขียนและมีความหมายต่างกัน จึงต้องใช้บริบทช่วยเลือกคำ',facts:[['กฎ–กด','กฎ = ข้อกำหนด; กด = ออกแรงลง'],['พัน–พันธ์–พรรณ','พัน = ผูก/หนึ่งพัน; พันธ์ = ผูกพัน; พรรณ = ชนิด
