<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Diagonal Split Background representation of teams -->
  <path d="M 0,0 L 500,0 L 200,720 L 0,720 Z" fill="rgba(239, 68, 68, 0.08)" />
  <path d="M 1280,0 L 780,0 L 1080,720 L 1280,720 Z" fill="rgba(37, 99, 235, 0.08)" />

  <!-- Tug of War Rope -->
  <g stroke="#d97706" stroke-width="24" stroke-linecap="round" fill="none">
    <path d="M 50,380 L 1230,380" />
    <!-- Rope threads details -->
    <path d="M 50,380 Q 200,370 350,380 T 650,380 T 950,380 T 1230,380" stroke="#b45309" stroke-width="4" />
  </g>

  <!-- Red Team pulling (Left) -->
  <g transform="translate(260, 380)">
    <!-- Pulley hands / symbols -->
    <circle cx="-100" cy="0" r="32" fill="url(#redGrad)" stroke="#fff" stroke-width="3" />
    <circle cx="-40" cy="-10" r="32" fill="url(#redGrad)" stroke="#fff" stroke-width="3" />
    <circle cx="20" cy="10" r="32" fill="url(#redGrad)" stroke="#fff" stroke-width="3" />
    <!-- Red force lines -->
    <path d="M -160,-50 L -200,-50 M -180,-20 L -220,-20" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Blue Team pulling (Right) -->
  <g transform="translate(1020, 380)">
    <!-- Pulley hands / symbols -->
    <circle cx="100" cy="0" r="32" fill="url(#blueGrad)" stroke="#fff" stroke-width="3" />
    <circle cx="40" cy="-10" r="32" fill="url(#blueGrad)" stroke="#fff" stroke-width="3" />
    <circle cx="-20" cy="10" r="32" fill="url(#blueGrad)" stroke="#fff" stroke-width="3" />
    <!-- Blue force lines -->
    <path d="M 160,-50 L 200,-50 M 180,-20 L 220,-20" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Central Red/Blue flag ribbon marker on rope -->
  <g transform="translate(640, 380)">
    <polygon points="0,0 -20,50 20,50" fill="#fbbf24" stroke="#000" stroke-width="2" />
    <polygon points="0,0 -20,-50 20,-50" fill="#fbbf24" stroke="#000" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="#fff" stroke="#000" stroke-width="3" />
  </g>

  <!-- Thai spelling character blocks in background -->
  <g font-family="sans-serif" font-weight="900" font-size="54" filter="url(#glow)">
    <!-- Red side letters -->
    <text x="180" y="240" fill="#fca5a5" transform="rotate(-15, 180, 240)">ก</text>
    <text x="320" y="550" fill="#fca5a5" transform="rotate(10, 320, 550)">ง</text>
    <!-- Blue side letters -->
    <text x="1080" y="240" fill="#93c5fd" transform="rotate(15, 1080, 240)">ส</text>
    <text x="940" y="550" fill="#93c5fd" transform="rotate(-10, 940, 550)">ม</text>
  </g>

  <!-- Title & Branding -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="640" y="240" font-family="sans-serif" font-weight="900" font-size="82" fill="#fbbf24" stroke="#000" stroke-width="2">TUG OF WAR</text>
    <text x="640" y="310" font-family="sans-serif" font-weight="bold" font-size="28" fill="#38bdf8" letter-spacing="4">ศึกชักเย่อตัวสะกดภาษาไทย</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="660" font-family="sans-serif" font-weight="bold" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="1">สะกดคำศัพท์ให้รวดเร็วและถูกต้อง เพื่อดึงเชือกดึงชัยชนะมาสู่ทีมของคุณ</text>
</svg>
