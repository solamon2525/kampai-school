<!DOCTYPE html><html lang="th"><head>

<style>

<header class="toolbar"><h1>🔤 ใบงานคำพ้อง/คำตรงข้าม</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="synonym">คำพ้องความหมาย</option><option value="sentence">ใช้ในประโยค</option><option value="reason">อธิบายเหตุผล</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const SYN_ITEMS=[
 {type:'synonym',prompt:'หาคำพ้องความหมาย: สวย',word:'สวย',answer:'งาม / งดงาม',s1:'คำตั้ง: สวย',s2:'ความหมายใกล้เคียง = งาม',s3:'คำพ้อง: งาม / งดงาม'},
 {type:'synonym',prompt:'หาคำพ้องความหมาย: เร็ว',word:'เร็ว',answer:'ไว / รวดเร็ว',s1:'คำตั้ง: เร็ว',s2:'บอกความเร็ว',s3:'คำพ้อง: ไว / รวดเร็ว'},
 {type:'synonym',prompt:'หาคำพ้องความหมาย: ใหญ่',word:'ใหญ่',answer:'มหึมา / ใหญ่โต',s1:'คำตั้ง: ใหญ่',s2:'บอกขนาดมาก',s3:'คำพ้อง: มหึมา / ใหญ่โต'},
 {type:'synonym',prompt:'หาคำพ้องความหมาย: กล้า',word:'กล้า',answer:'เด็ดเดี่ยว / กล้าหาญ',s1:'คำตั้ง: กล้า',s2:'ไม่กลัว',s3:'คำพ้อง: เด็ดเดี่ยว / กล้าหาญ'},
 {type:'sentence',prompt:'เลือกคำพ้องที่เหมาะ: ดอกไม้___มาก',word:'สวย/งาม',answer:'งาม',s1:'ช่องว่างต้องการคำชม',s2:'สวย ≈ งาม',s3:'เลือก: งาม'},
 {type:'sentence',prompt:'เติมคำพ้อง: นักเรียน___ไปโรงเรียน',word:'เร็ว/ไว',answer:'รีบ / ไว',s1:'บริบท: การไปโรงเรียน',s2:'ความหมายใกล้ “เร็ว”',s3:'เติม: รีบ / ไว'},
 {type:'sentence',prompt:'เขียนประโยคใช้คำพ้องของ "เศร้า"',word:'เศร้า',answer:'เช่น วันนี้เขารู้สึกโศกเศร้า',s1:'คำตั้ง: เศร้า',s2:'คำพ้อง: โศกเศร้า',s3:'เขียนประโยคสมบูรณ์'},
 {type:'reason',prompt:'ทำไม "โต" และ "ใหญ่" จึงเป็นคำพ้อง',word:'โต/ใหญ่',answer:'ใกล้เคียงความหมาย บอกขนาดเพิ่มขึ้น',s1:'เปรียบ โต กับ ใหญ่',s2:'ทั้งคู่บอกขนาด',s3:'ใกล้เคียง → คำพ้อง'},
 {type:'reason',prompt:'คำใดไม่ใช่คำพ้องของ "ดี"',word:'ดี',answer:'เลว (เป็นคำตรงข้าม)',s1:'หาคำใกล้ “ดี”',s2:'เลว = ความหมายตรงข้าม',s3:'เลว ไม่ใช่คำพ้อง'},
 {type:'reason',prompt:'อธิบายความต่างคำพ้องกับคำตรงข้าม',word:'เปรียบเทียบ',answer:'คำพ้องใกล้ความหมาย คำตรงข้ามตรงกันข้าม',s1:'คำพ้อง = ใกล้กัน',s2:'คำตรงข้าม = ตรงกันข้าม',s3:'สรุปความต่าง'},
 {type:'sentence',prompt:'แทนที่คำให้หลากหลาย: อากาศ___มาก',word:'ร้อน/ร้อนระอุ',answer:'ร้อนระอุ / ร้อนจัด',s1:'ช่องว่างบอกอุณหภูมิ',s2:'แทน “ร้อน” ด้วยคำพ้อง',s3:'ร้อนระอุ / ร้อนจัด'},
 {type:'synonym',prompt:'หาคำพ้องความหมาย: ฉลาด',word:'ฉลาด',answer:'เฉลียว / หลักแหลม',s1:'คำตั้ง: ฉลาด',s2:'บอกความสามารถคิด',s3:'คำพ้อง: เฉลียว / หลักแหลม'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'synonym',icon:'🔤',title:'ใบงานคำพ้อง/คำตรงข้าม',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'คำพ้องความหมาย',
  sourceMediaUrl:'/games/thai/synonym-media.html',indicators:['ท 1.1 ป.4/2'],
  directions:'หาคำพ้อง ใช้ในประโยค และอธิบายความสัมพันธ์ของคำ',
  getItems(topic){return topic==='mixed'?SYN_ITEMS:SYN_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const tags=item.type==='synonym'
      ?['1 คำตั้ง','2 ความหมาย','3 คำพ้อง']
      :item.type==='sentence'
        ?['1 บริบท','2 เลือกคำ','3 ประโยค']
        :['1 เปรียบ','2 ความสัมพันธ์','3 สรุป'];
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="word-bank"><span>'+e(item.word)+'</span></div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">'+tags[0]+'</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[1]+'</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[2]+'</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
