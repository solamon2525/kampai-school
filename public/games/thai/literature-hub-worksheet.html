<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-literature-hub/index.html"><meta name="curriculum-indicators" content="ท 5.1 ป.5/2"><title>ใบงานวรรณคดี Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.14" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.14" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.word-bank{display:flex;flex-wrap:wrap;gap:1mm;margin:.8mm 0}
.word-bank span{border:1px solid var(--ws-line);border-radius:3px;padding:.4mm 1.5mm;font-size:8pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>📚 ใบงานวรรณคดี Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="genre">ประเภทวรรณคดี</option><option value="element">องค์ประกอบ</option><option value="analyze">วิเคราะห์</option><option value="reflect">สะท้อนใจ</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.14"></script><script>
const LIT_ITEMS=[
{type:'genre',prompt:'นิทานสอนอะไร',context:'นิทาน',choices:['ข้อคิด/คติ','แค่ความสนุก'],answer:'ข้อคิด คติชีวิต คุณธรรม',step1:'นิทานมีข้อคิด',step2:'สอนคุณธรรม',step3:'ข้อคิด'},
{type:'genre',prompt:'กลอนสอนใจ vs กลอนแปด',context:'กลอน',choices:['สอนใจ=ข้อคิด · แปด=รูปแบบ','เหมือนกัน'],answer:'กลอนสอนใจเน้นข้อคิด · กลอนแปดเป็นรูปแบบ',step1:'สอนใจ=เนื้อหา',step2:'แปด=8 บท',step3:'ต่างกัน'},
{type:'element',prompt:'ตัวละครในเรื่องคือ',context:'องค์ประกอบ',choices:['ผู้กระทำในเรื่อง','ผู้เขียน'],answer:'ผู้กระทำ/มีบทบาทในเรื่อง',step1:'ไม่ใช่ผู้เขียน',step2:'มีบทบาท',step3:'ตัวละคร'},
{type:'element',prompt:'ฉากในเรื่องคือ',context:'ฉาก',choices:['สถานที่/เวลา','ตัวละคร'],answer:'สถานที่และเวลาเกิดเหตุการณ์',step1:'where/when',step2:'สถานที่',step3:'ฉาก'},
{type:'analyze',prompt:'เรื่อง "หมีกับนก" สอน',context:'นิทาน',choices:['ช่วยเหลือกัน','แข่งขัน'],answer:'ช่วยเหลือและให้อภัย',step1:'อ่านเหตุการณ์',step2:'ข้อคิด',step3:'ช่วยเหลือ'},
{type:'analyze',prompt:'จุดส climax คือ',context:'องค์ประกอบ',choices:['จุดสูงสุดของเรื่อง','จุดเริ่ม'],answer:'จุดที่ความตึงเครียดสูงสุด',step1:'ก่อนจบ',step2:'สูงสุด',step3:'climax'},
{type:'reflect',prompt:'อ่านนิทานแล้วได้อะไร',context:'สะท้อน',choices:['ข้อคิดนำไปใช้','แค่จำเรื่อง'],answer:'ข้อคิดนำไปใช้ในชีวิต',step1:'ไม่ใช่แค่สนุก',step2:'สะท้อน',step3:'นำไปใช้'},
{type:'reflect',prompt:'ทำไมต้องอ่านวรรณคดีไทย',context:'วรรณคดี',choices:['รักษามรดก ภาษา คุณธรรม','ไม่จำเป็น'],answer:'รักษามรดก ภาษา และคุณธรรม',step1:'มรดก',step2:'ภาษาไทย',step3:'คุณธรรม'},
{type:'genre',prompt:'โคลงสี่สอนอะไร',context:'โคลง',choices:['ข้อคิดสั้นกระชับ','เรื่องยาว'],answer:'ข้อคิดสั้นกระชับ',step1:'4 บรรทัด',step2:'ข้อคิด',step3:'กระชับ'},
{type:'element',prompt:'พล็อต คือ',context:'พล็อต',choices:['ลำดับเหตุการณ์','ตัวละคร'],answer:'ลำดับเหตุการณ์ในเรื่อง',step1:'เรื่องราว',step2:'ลำดับ',step3:'plot'},
{type:'analyze',prompt:'แยก: บทเริ่ม vs บทจบ',context:'โครงเรื่อง',choices:['เริ่ม=แนะนำ · จบ=สรุป/ข้อคิด','เหมือนกัน'],answer:'เริ่มแนะนำ · จบสรุป/ข้อคิด',step1:'เริ่ม=ตั้งฉาก',step2:'จบ=ปิดเรื่อง',step3:'ต่างหน้าที่'},
{type:'reflect',prompt:'เขียนข้อคิดจากนิทานที่อ่าน 1 ข้อ',context:'สะท้อน',choices:['เช่น ต้องซื่อสัตย์','เช่น ชอบ'],answer:'เช่น ต้องซื่อสัตย์ / ช่วยเพื่อน',step1:'เลือกเรื่อง',step2:'หาข้อคิด',step3:'เขียนเป็นประโยค'}
];
const SKILL={genre:'ประเภท',element:'องค์ประกอบ',analyze:'วิเคราะห์',reflect:'สะท้อน'};
window.WORKSHEET_CONFIG={
  icon:'📚',title:'ใบงานวรรณคดี Hub',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'วรรณคดี Hub',
  sourceMediaUrl:'/games/thai/thai-literature-hub/index.html',indicators:['ท 5.1 ป.5/2'],
  directions:'ติ๊กทักษะ → อ่านบริบท → วิเคราะห์องค์ประกอบ → สะท้อนข้อคิด',
  getItems(t){return t==='mixed'?LIT_ITEMS:LIT_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const s1=item.step1||item.s1||'',s2=item.step2||item.s2||'',s3=item.step3||item.s3||'';
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="word-bank"><span>'+e(item.context)+'</span></div>'
      +'<div class="tick-grid"><div class="tick-box">□ ประเภท</div><div class="tick-box">□ องค์ประกอบ</div><div class="tick-box">□ วิเคราะห์</div><div class="tick-box">□ สะท้อน</div></div>'
      +(item.choices?'<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>':'')
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 อ่าน</span><div class="step-body"><span class="work-fill">'+e(s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 วิเคราะห์</span><div class="step-body"><span class="work-fill">'+e(s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ข้อคิด</span><div class="step-body"><span class="work-fill">'+e(s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.14"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.14"></script></body></html>
