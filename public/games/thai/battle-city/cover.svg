<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1.5" />
    </pattern>
    <!-- Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0b0f19" />
  <rect width="1280" height="720" fill="url(#grid)" />

  <!-- Decorative Bricks Background -->
  <g fill="#8b4513" stroke="#000" stroke-width="2">
    <rect x="100" y="200" width="120" height="80" rx="4" />
    <rect x="230" y="200" width="120" height="80" rx="4" />
    <rect x="150" y="290" width="120" height="80" rx="4" fill="#64748b" /> <!-- Steel brick -->
    <rect x="1060" y="400" width="120" height="80" rx="4" />
    <rect x="930" y="400" width="120" height="80" rx="4" />
  </g>

  <!-- Letter Icons in Bricks -->
  <g filter="url(#glow)">
    <!-- Letter W Brick -->
    <rect x="160" y="210" width="60" height="60" rx="6" fill="#f59e0b" stroke="#fff" stroke-width="2" />
    <text x="190" y="248" font-family="sans-serif" font-weight="900" font-size="36" fill="#000" text-anchor="middle">W</text>

    <!-- Letter I Brick -->
    <rect x="1090" y="410" width="60" height="60" rx="6" fill="#f59e0b" stroke="#fff" stroke-width="2" />
    <text x="1120" y="448" font-family="sans-serif" font-weight="900" font-size="36" fill="#000" text-anchor="middle">I</text>
  </g>

  <!-- Red Enemy Tank -->
  <g transform="translate(350, 420) rotate(45)">
    <!-- Tracks -->
    <rect x="-35" y="-55" width="20" height="110" fill="#222" rx="4" />
    <rect x="15" y="-55" width="20" height="110" fill="#222" rx="4" />
    <!-- Body -->
    <rect x="-25" y="-45" width="50" height="90" fill="#ef4444" rx="6" stroke="#991b1b" stroke-width="3" />
    <!-- Turret -->
    <circle cx="0" cy="0" r="22" fill="#991b1b" stroke="#fff" stroke-width="2" />
    <rect x="-6" y="-60" width="12" height="50" fill="#ef4444" rx="2" />
  </g>

  <!-- Yellow Player Tank -->
  <g transform="translate(850, 250) rotate(-135)">
    <!-- Tracks -->
    <rect x="-35" y="-55" width="20" height="110" fill="#222" rx="4" />
    <rect x="15" y="-55" width="20" height="110" fill="#222" rx="4" />
    <!-- Body -->
    <rect x="-25" y="-45" width="50" height="90" fill="#fbbf24" rx="6" stroke="#b45309" stroke-width="3" />
    <!-- Turret -->
    <circle cx="0" cy="0" r="22" fill="#b45309" stroke="#fff" stroke-width="2" />
    <rect x="-6" y="-60" width="12" height="50" fill="#fbbf24" rx="2" />
    <!-- Shield effect -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="10 8" />
  </g>

  <!-- Title & Branding -->
  <g filter="url(#glow)" text-anchor="middle">
    <text x="640" y="320" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="72" fill="#f59e0b">BATTLE CITY</text>
    <text x="640" y="380" font-family="'Press Start 2P', monospace, sans-serif" font-size="20" fill="#38bdf8" letter-spacing="4">ULTIMATE SPELLING ARENA</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="660" font-family="sans-serif" font-weight="bold" font-size="24" fill="#64748b" text-anchor="middle" letter-spacing="1">สะกดคำศัพท์ภาษาอังกฤษในสมรภูมิรถถังสุดมันส์</text>
</svg>
