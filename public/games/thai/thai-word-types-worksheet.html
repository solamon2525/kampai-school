<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/thai/thai-word-types.html"><meta name="curriculum-indicators" content="ท 4.1 ป.4/2, ท 4.1 ป.4/6"><title>ใบงานชนิดของคำ ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.14" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.14" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1mm;margin:1mm 0}
.pos-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.7mm;font-size:7pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.word-bank{display:flex;flex-wrap:wrap;gap:1mm;margin:.8mm 0}
.word-bank span{border:1px solid var(--ws-line);border-radius:3px;padding:.4mm 1.5mm;font-size:9pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>📝 ใบงานชนิดของคำ</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="noun">คำนาม</option><option value="verb">คำกริยา</option><option value="adj">คำคุณศัพท์</option><option value="sentence">วิเคราะห์ในประโยค</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.14"></script><script>
const WORDTYPE_ITEMS=[
 {type:'noun',prompt:'จำแนกชนิดคำ: นักเรียน',word:'นักเรียน',answer:'คำนาม (ชื่อคน)',step1:'นักเรียน',step2:'ชื่อคน/สิ่ง',step3:'คำนาม'},
 {type:'noun',prompt:'จำแนกชนิดคำ: โต๊ะ',word:'โต๊ะ',answer:'คำนาม (ชื่อสิ่งของ)',step1:'โต๊ะ',step2:'ชื่อสิ่งของ',step3:'คำนาม'},
 {type:'noun',prompt:'จำแนกชนิดคำ: โรงเรียน',word:'โรงเรียน',answer:'คำนาม (ชื่อสถานที่)',step1:'โรงเรียน',step2:'ชื่อสถานที่',step3:'คำนาม'},
 {type:'verb',prompt:'จำแนกชนิดคำ: วิ่ง',word:'วิ่ง',answer:'คำกริยา (แสดงการกระทำ)',step1:'วิ่ง',step2:'แสดงการกระทำ',step3:'คำกริยา'},
 {type:'verb',prompt:'จำแนกชนิดคำ: อ่าน',word:'อ่าน',answer:'คำกริยา',step1:'อ่าน',step2:'แสดงการกระทำ',step3:'คำกริยา'},
 {type:'verb',prompt:'จำแนกชนิดคำ: คิด',word:'คิด',answer:'คำกริยา (แสดงกิริยา/สภาวะ)',step1:'คิด',step2:'กิริยา/สภาวะ',step3:'คำกริยา'},
 {type:'adj',prompt:'จำแนกชนิดคำ: สวย',word:'สวย',answer:'คำคุณศัพท์ (บอกคุณลักษณะ)',step1:'สวย',step2:'บอกคุณลักษณะ',step3:'คำคุณศัพท์'},
 {type:'adj',prompt:'จำแนกชนิดคำ: เก่ง',word:'เก่ง',answer:'คำคุณศัพท์',step1:'เก่ง',step2:'บอกคุณลักษณะ',step3:'คำคุณศัพท์'},
 {type:'adj',prompt:'จำแนกชนิดคำ: ร้อน',word:'ร้อน',answer:'คำคุณศัพท์ (บอกสภาพ)',step1:'ร้อน',step2:'บอกสภาพ',step3:'คำคุณศัพท์'},
 {type:'sentence',prompt:'ในประโยค "เด็กเก่งอ่านหนังสือ" คำใดเป็นกริยา',word:'เด็กเก่งอ่านหนังสือ',answer:'อ่าน',step1:'เด็ก | เก่ง | อ่าน | หนังสือ',step2:'อ่าน = กระทำ',step3:'กริยา = อ่าน'},
 {type:'sentence',prompt:'ในประโยค "ดอกไม้สวยมาก" คำใดเป็นคุณศัพท์',word:'ดอกไม้สวยมาก',answer:'สวย',step1:'ดอกไม้ | สวย | มาก',step2:'สวย = ลักษณะ',step3:'คุณศัพท์ = สวย'},
 {type:'sentence',prompt:'ในประโยค "ครูสอนดี" คำใดเป็นนาม',word:'ครูสอนดี',answer:'ครู',step1:'ครู | สอน | ดี',step2:'ครู = ชื่อคน',step3:'นาม = ครู'}
];
const SKILL={noun:'คำนาม',verb:'คำกริยา',adj:'คำคุณศัพท์',sentence:'ในประโยค'};
window.WORKSHEET_CONFIG={
  icon:'📝',title:'ใบงานชนิดของคำ',subject:'ภาษาไทย',gradeLabel:'ป.4–6',mediaLabel:'ชนิดของคำ',
  sourceMediaUrl:'/games/thai/thai-word-types.html',indicators:['ท 4.1 ป.4/2','ท 4.1 ป.4/6'],
  directions:'ดูคำ → ติ๊กชนิดคำ □ → ดูหน้าที่ → สรุปชนิด',
  getItems(topic){return topic==='mixed'?WORDTYPE_ITEMS:WORDTYPE_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const s1=item.step1||item.s1||'',s2=item.step2||item.s2||'',s3=item.step3||item.s3||'';
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="word-bank"><span>'+e(item.word)+'</span></div>'
      +'<div class="pos-grid"><div class="pos-box">□ คำนาม</div><div class="pos-box">□ คำกริยา</div><div class="pos-box">□ คำคุณศัพท์</div></div>'
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 คำ</span><div class="step-body"><span class="work-fill">'+e(s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 หน้าที่</span><div class="step-body"><span class="work-fill">'+e(s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ชนิด</span><div class="step-body"><span class="work-fill">'+e(s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.14"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.14"></script></body></html>
