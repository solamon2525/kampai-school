<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}

const READ_ITEMS=[

{type:'main',prompt:'ข่าว: "โรงเรียนเปิดเทอม" ใจความ',context:'ข่าว',choices:['แจ้งวันเปิดเทอม','เล่านิทาน'],answer:'แจ้งข้อมูลวันเปิดเทอม',evidence:'ข่าว = แจ้งข้อมูล',s1:'ข่าวแจ้งอะไร',s2:'เปิดเทอม',s3:'แจ้งวันเปิดเทอม'},

{type:'vocab',prompt:'"ร่มเย็น" หมายถึง',context:'ร่มเย็น',choices:['เย็นสบาย มีร่ม','ร้อน'],answer:'เย็นสบาย มีร่มเงา',evidence:'ร่ม = มีเงา · เย็น = สบาย',s1:'แยกคำ',s2:'ร่ม+เย็น',s3:'เย็นสบาย'},

  getItems(t){return t==='mixed'?READ_ITEMS:READ_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
