<script>
const ITEMS=[{"type":"question","prompt":"เติมเครื่องหมายและอธิบายหน้าที่","text":"หนูชื่ออะไร","answer":"หนูชื่ออะไร? · ใช้เมื่อถาม"},{"type":"exclaim","prompt":"เติมเครื่องหมายและบอกอารมณ์","text":"สุดยอดมาก","answer":"สุดยอดมาก! · ดีใจ/ทึ่ง"},{"type":"dash","prompt":"ใช้ขีดช่วยความหมาย","text":"เปิด ปิด ประตูให้ถูกวิธี","answer":"เปิด–ปิดประตูให้ถูกวิธี"},{"type":"paren","prompt":"ใส่วงเล็บข้อมูลเสริม","text":"ครูสมชาย ครูประจำชั้นป.4 มาแล้ว","answer":"ครูสมชาย (ครูประจำชั้นป.4) มาแล้ว"},{"type":"quote","prompt":"ใส่เครื่องหมายคำพูด","text":"แม่บอก ให้ทำการบ้านก่อน","answer":"แม่บอก “ให้ทำการบ้านก่อน”"},{"type":"mixed","prompt":"แก้เครื่องหมายทั้งประโยค","text":"ใครไปบ้าง น้องสาว พี่ชาย และฉัน","answer":"ใครไปบ้าง? น้องสาว พี่ชาย และฉัน"},{"type":"question","prompt":"เขียนประโยคคำถาม 2 ประโยค","text":"เกี่ยวกับโรงเรียน","answer":"เช่น โรงเรียนเปิดกี่โมง?"},{"type":"exclaim","prompt":"เขียนประโยคแสดงความประหลาดใจ","text":"เหตุการณ์ในห้องเรียน","answer":"เช่น คะแนนเต็มแล้ว!"},{"type":"paren","prompt":"เพิ่มข้อมูลในวงเล็บ","text":"พรุ่งนี้มีการสอบวิชาคณิตศาสตร์","answer":"พรุ่งนี้มีการสอบ (วิชาคณิตศาสตร์)"},{"type":"dash","prompt":"ใช้ขีดแสดงช่วงเวลา","text":"เรียนเวลา 08.30 ถึง 15.30","answer":"เรียนเวลา 08.30–15.30"},{"type":"quote","prompt":"ใส่คำพูดของตัวละคร","text":"ครูกล่าว ตั้งใจเรียนนะ","answer":"ครูกล่าว “ตั้งใจเรียนนะ”"},{"type":"mixed","prompt":"เติมเครื่องหมายที่หายไป","text":"วันนี้อากาศดีจัง","answer":"วันนี้อากาศดีจัง!"},{"type":"question","prompt":"เปลี่ยนเป็นประโยคคำถาม","text":"หนูชอบวิชาคณิตศาสตร์","answer":"หนูชอบวิชาคณิตศาสตร์ไหม?"},{"type":"exclaim","prompt":"เปลี่ยนเป็นประโยคอุทาน","text":"ของเล่นชิ้นนี้สวย","answer":"ของเล่นชิ้นนี้สวยจัง!"},{"type":"paren","prompt":"ใส่วงเล็บชื่อย่อ","text":"องค์การสหประชาชาติ UN","answer":"องค์การสหประชาชาติ (UN)"},{"type":"dash","prompt":"ใช้ขีดคั่นรายการสั้น","text":"สีที่ใช้ แดง เขียว น้ำเงิน","answer":"สีที่ใช้: แดง–เขียว–น้ำเงิน หรือ แดง เขียว น้ำเงิน"},{"type":"mixed","prompt":"แก้ประโยคให้ถูกวรรคตอน","text":"คุณครูถาม ใครทำการบ้านเสร็จแล้ว","answer":"คุณครูถาม “ใครทำการบ้านเสร็จแล้ว?”"},{"type":"quote","prompt":"แยกคำพูดกับคำเล่า","text":"พี่ชายบอกพรุ่งนี้ไปเที่ยวทะเล","answer":"พี่ชายบอก “พรุ่งนี้ไปเที่ยวทะเล”"}];
window.WORKSHEET_CONFIG={
  icon:'✒️',title:'ใบงานเครื่องหมายวรรคตอน',subject:'ภาษาไทย',gradeLabel:'ป.3–ป.5',
  mediaLabel:'เครื่องหมายวรรคตอน',sourceMediaUrl:'/games/thai/thai-punctuation-hub/index.html',
  indicators:["ท 2.1 ป.3/1","ท 2.1 ป.4/1"],
  directions:"เติมเครื่องหมายวรรคตอน อธิบายหน้าที่ และแก้ประโยค",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="q-context">'+e(item.text)+'</div>'
      +'<div class="classify-grid thai-punct-grid">'
      +'<div class="classify-box">เติมเครื่องหมาย: ______</div>'
      +'<div class="classify-box">หน้าที่: ____________</div></div>'
      +'<div>ประโยคที่แก้แล้ว</div><div class="work-line"></div><div class="work-line"></div>'
      +'<div>อธิบายสั้น ๆ</div><div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';}
};
</script>
