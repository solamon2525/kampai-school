<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Linear Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0" />
      <stop offset="100%" stop-color="#FFEEDD" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D" />
      <stop offset="100%" stop-color="#845EC2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="180" fill="#FFE259" opacity="0.08" filter="url(#glow)" />
  <circle cx="400" cy="400" r="160" fill="#845EC2" opacity="0.08" filter="url(#glow)" />

  <!-- Magic Particles & Stars -->
  <g fill="#FFA751" opacity="0.6">
    <path d="M120 180 L123 186 L130 187 L125 192 L126 199 L120 195 L114 199 L115 192 L110 187 L117 186 Z" />
    <path d="M380 140 L382 144 L387 145 L383 149 L384 154 L380 151 L376 154 L377 149 L373 145 L378 144 Z" />
    <circle cx="150" cy="220" r="4" fill="#FF6B9D" />
    <circle cx="340" cy="250" r="3" fill="#845EC2" />
    <circle cx="200" cy="150" r="5" fill="#4FC3F7" />
  </g>

  <!-- Book Container -->
  <g transform="translate(250, 260)">
    <!-- Magic glow behind the book -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="#845EC2" opacity="0.15" filter="url(#glow)" />

    <!-- Open Book Pages (Back) -->
    <path d="M -130,30 Q -60,-20 0,20 Q 60,-20 130,30 L 120,-70 Q 60,-110 0,-70 Q -60,-110 -120,-70 Z" fill="#FFFFFF" stroke="#845EC2" stroke-width="6" stroke-linejoin="round" />
    <!-- Pages Details -->
    <path d="M -122,23 Q -60,-23 0,15 Q 60,-23 122,23 L 115,-65 Q 60,-103 0,-65 Q -60,-103 -115,-65 Z" fill="#FFFBF0" />
    
    <!-- Left Page lines representing text -->
    <path d="M -100,-45 Q -60,-75 -20,-45" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M -100,-25 Q -60,-55 -20,-25" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M -100,-5 Q -60,-35 -20,-5" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Right Page lines representing text -->
    <path d="M 20,-45 Q 60,-75 100,-45" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 20,-25 Q 60,-55 100,-25" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 20,-5 Q 60,-35 100,-5" stroke="#7B6B8E" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Book Spine -->
    <path d="M 0,-70 L 0,20" stroke="#845EC2" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Big Glowing Star above book -->
  <g transform="translate(250, 150)" filter="url(#glow)">
    <path d="M0 -35 L10 -10 L35 -10 L15 5 L22 30 L0 15 L-22 30 L-15 5 L-35 -10 L-10 -10 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Game Title Text -->
  <text x="250" y="390" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="900" font-size="44" fill="#845EC2" filter="url(#glow)">ผจญภัยอ่านสนุก</text>
  <text x="250" y="430" text-anchor="middle" font-family="'Prompt', sans-serif" font-weight="700" font-size="20" fill="#FF6B9D" letter-spacing="2">READING ADVENTURE</text>
</svg>
