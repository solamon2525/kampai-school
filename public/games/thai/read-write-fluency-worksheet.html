<main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>

<script src="/games/kampai-qr.js?v=1.195.0"></script>

<script>
const ITEMS=[{"type":"read","prompt":"อ่านคำ: ไป","answer":"ไป"},{"type":"write","prompt":"คัดคำ: กิน","answer":"กิน"},{"type":"read","prompt":"อ่านประโยค: กากิน","answer":"กากิน"},{"type":"write","prompt":"คัดประโยค: มาโรงเรียน","answer":"มาโรงเรียน"},{"type":"read","prompt":"ทำไมต้องอ่านซ้ำ","answer":"ให้ลื่นขึ้น"},{"type":"write","prompt":"เขียนชื่อตนเอง","answer":"ตามนักเรียน"},{"type":"read","prompt":"ชี้คำทีละคำช่วยอะไร","answer":"ไม่วางตำแหน่งผิด"},{"type":"write","prompt":"คัด: ดี ใจ","answer":"ดีใจ / ดี ใจ"},{"type":"read","prompt":"ประโยคสั้นต้องมีอะไร","answer":"ประธานและกริยา"},{"type":"write","prompt":"แต่งประโยค 3 คำขึ้นไป","answer":"ตามนักเรียน"},{"type":"read","prompt":"อ่านให้เพื่อนฟัง 1 ประโยค","answer":"ฝึกจริง"},{"type":"write","prompt":"ลากเส้นใต้คำว่า โรงเรียน","answer":"โรงเรียน"},{"type":"read","prompt":"จับเวลาอ่าน 1 นาที (ครูช่วย)","answer":"บันทึกจำนวนคำ"},{"type":"write","prompt":"คัดตัวอักษร ก–จ","answer":"กขฃคฅฆงจ"},{"type":"read","prompt":"เมื่ออ่านผิดควรทำอย่างไร","answer":"อ่านใหม่ช้า ๆ"},{"type":"write","prompt":"ชมตัวเอง 1 ประโยค","answer":"ตามนักเรียน"}];
window.WORKSHEET_CONFIG={
  icon:'📖',title:'ใบงานอ่านคล่องเขียนคล่อง',subject:'ภาษาไทย',gradeLabel:'ป.1–ป.2',
  mediaLabel:'สื่ออ่าน-เขียนคล่อง',sourceMediaUrl:'/games/thai/read-write-fluency-media.html',
  indicators:["ท 1.1 ป.1/3","ท 1.1 ป.2/2","ท 2.1 ป.1/1"],
  directions:"ฝึกอ่านและคัดลายมือตัวใหญ่ · ช่องลากเส้นกว้าง",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line" style="font-size:1.15rem"><div class="prompt"><strong style="font-size:1.2rem">'+e(item.prompt)+'</strong></div><div class="answer-line" style="min-height:2.2em">คำตอบ <span class="blank long"></span></div><div class="reason-line" style="min-height:2.4em;border-bottom:2px dotted #94a3b8">เขียน/ลากเส้น <span class="blank long"></span></div><div class="answer teacher-answer">เฉลย: '+e(item.answer)+'</div></div>';}
};
</script>
<script src="/games/worksheet-topic.js?v=1.199.1"></script>
<script>
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');
document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();
window.KampaiWorksheet.loadTeachers();
window.KampaiTopicWorksheet.render();
</script>
