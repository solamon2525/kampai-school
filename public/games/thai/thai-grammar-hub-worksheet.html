<script>
const ITEMS=[{"type":"noun","prompt":"ขีดเส้นใต้นามทุกคำ","text":"แมวนอนบนเสื่อ","answer":"แมว · เสื่อ"},{"type":"verb","prompt":"ขีดเส้นใต้กริยา","text":"เด็ก ๆ วิ่งเล่นในสนาม","answer":"วิ่งเล่น"},{"type":"adj","prompt":"หาคุณศัพท์และบอกคำที่ถูกขยาย","text":"ดอกไม้สีแดงบานสะพรั่ง","answer":"สีแดง ขยายดอกไม้"},{"type":"adv","prompt":"หาวิเศษณ์และบอกหน้าที่","text":"นกบินสูงเหนือต้นไม้","answer":"สูง · บอกอาการของกริยาบิน"},{"type":"prep","prompt":"หาบุพบทและคำที่ตามมา","text":"หนังสืออยู่บนโต๊ะ","answer":"บน + โต๊ะ"},{"type":"conj","prompt":"หาสันธานและความสัมพันธ์","text":"ฝนตกจึงถนนลื่น","answer":"จึง · แสดงผล"},{"type":"mixed","prompt":"จำแนกชนิดคำทีละคำ","text":"น้องสาวอ่านหนังสืออย่างตั้งใจ","answer":"นาม กริยา นาม วิเศษณ์"},{"type":"noun","prompt":"แต่งประโยคที่มีนามอย่างน้อย 2 คำ","text":"ใช้คำ: ครู / นักเรียน","answer":"เช่น ครูชมนักเรียน"},{"type":"verb","prompt":"เติมกริยาให้เหมาะ","text":"ปลา___ในน้ำ","answer":"ว่าย / ว่ายน้ำ"},{"type":"adj","prompt":"เติมคุณศัพท์","text":"ท้องฟ้า___หลังฝนตก","answer":"เช่น สดใส / แจ่มใส"},{"type":"adv","prompt":"เติมวิเศษณ์","text":"นักเรียนอ่านหนังสือ___","answer":"เช่น อย่างตั้งใจ / ช้า ๆ"},{"type":"prep","prompt":"เติมบุพบท","text":"ดินสออยู่ใน___","answer":"เช่น กล่อง / กระเป๋า"},{"type":"conj","prompt":"เชื่อมประโยคด้วยสันธาน","text":"อากาศร้อน / อยากดื่มน้ำ","answer":"เช่น อากาศร้อนจึงอยากดื่มน้ำ"},{"type":"noun","prompt":"หาคำนามเฉพาะ","text":"ครูสมชายสอนวิชาคณิตศาสตร์","answer":"สมชาย"},{"type":"verb","prompt":"เปลี่ยนกริยาให้เป็นอดีตในความหมาย","text":"ฉันกินข้าว","answer":"เช่น ฉันกินข้าวแล้ว"},{"type":"mixed","prompt":"วงนามและขีดกริยา","text":"แม่หุงข้าวในครัว","answer":"นาม: แม่ ข้าว ครัว · กริยา: หุง"},{"type":"adj","prompt":"หาคุณศัพท์ 2 คำ","text":"รถคันสีแดงวิ่งเร็วมาก","answer":"สีแดง · เร็ว"},{"type":"conj","prompt":"เลือกสันธานที่เหมาะ","text":"อยากไปเที่ยว ___ ฝนตกหนัก","answer":"แต่ / แต่เนื่องจาก"}];
window.WORKSHEET_CONFIG={
  icon:'📘',title:'ใบงานคลังไวยากรณ์ไทย',subject:'ภาษาไทย',gradeLabel:'ป.4–ป.5',
  mediaLabel:'คลังไวยากรณ์ไทย',sourceMediaUrl:'/games/thai/thai-grammar-hub/index.html',
  indicators:["ท 4.1 ป.4/2","ท 4.1 ป.4/6","ท 4.1 ป.5/2"],
  directions:"จำแนกชนิดของคำ ขีดเส้นใต้ และแต่งประโยคสั้น",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="q-context">“'+e(item.text)+'”</div>'
      +'<div class="classify-grid word-types-grid">'
      +'<div class="classify-box">[ ] นาม</div><div class="classify-box">[ ] กริยา</div>'
      +'<div class="classify-box">[ ] คุณศัพท์</div><div class="classify-box">[ ] อื่น ๆ</div></div>'
      +'<div>ขีดเส้นใต้ / ระบุชนิดคำ</div><div class="work-line"></div>'
      +'<div>เหตุผลสั้น ๆ</div><div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';}
};
</script>
