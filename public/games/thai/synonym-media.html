    function groupById(id) { return GROUPS.find((g) => g.id === id); }
    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function speak(t) {
      if (window.KAMPAI && KAMPAI.sound && KAMPAI.sound.speak) KAMPAI.sound.speak(t, 'th-TH');
      else if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'th-TH';
        speechSynthesis.speak(u);
      }
    }

    let mode = 'learn', selGroup = 'syn-sun', selWordIdx = 0;
    let flashIdx = 0, flashBack = false;
    let pickQ = null, pickAnswered = false;
    let matchThemes = [], matchWords = [], matchPlaces = {}, matchSelWord = null, matchChecked = false;

    const hints = {
      learn: 'เลือกกลุ่ม → แตะคำเพื่อดูโทนการใช้และตัวอย่าง',
      flash: 'แตะการ์ดเพื่อพลิกหน้า/หลัง · หน้า=คำ หลัง=กลุ่ม+คำคู่',
      practice: 'ฝึกสั้น: เลือกคำที่พ้องความหมายกับคำที่กำหนด',
      match: 'แตะคำแล้วแตะกล่องธีม — หรือแตะกล่องก่อนแล้วเลือกคำ',
    };

    function setMode(m) {
      mode = m;
      document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('on'));
      document.getElementById('p-' + m).classList.add('on');
      document.getElementById('hintText').textContent = hints[m];
      if (m === 'learn') renderLearn();
      if (m === 'flash') { flashBack = false; renderFlash(); }
      if (m === 'practice') { if (!pickQ) nextPick(); else renderPick(); }
      if (m === 'match') { if (!matchThemes.length) resetMatch(); else renderMatch(); }
    }

    function renderLearn() {
      const el = document.getElementById('p-learn');
      const g = groupById(selGroup);
      const w = g.words[selWordIdx] || g.words[0];
      el.innerHTML =
        '<div class="grp-list">' +
        GROUPS.map((x) =>
          '<button type="button" class="grp-btn' + (x.id === selGroup ? ' on' : '') + '" data-gid="' + x.id + '">' +
          x.emoji + ' ' + x.theme + '</button>'
        ).join('') +
        '</div>' +
        '<div class="word-grid">' +
        g.words.map((word, i) =>
          '<button type="button" class="w-card' + (i === selWordIdx ? ' on' : '') + '" data-wi="' + i + '">' +
          '<div class="w">' + word.word + '</div><div class="r">อ่าน: ' + word.reading + '</div>' +
          '<span class="reg">' + word.register + '</span></button>'
        ).join('') +
        '</div>' +
        '<div class="detail">' +
        '<h3>' + g.emoji + ' ' + w.word + ' · กลุ่ม「' + g.theme + '」</h3>' +
        '<p><strong>อ่าน:</strong> ' + w.reading + ' · <strong>ระดับภาษา:</strong> ' + w.register + '</p>' +
        '<p><strong>โทนใช้:</strong> ' + w.nuance + '</p>' +
        '<p><strong>ตัวอย่าง:</strong> 「' + w.example + '」</p>' +
        '<div class="actions" style="justify-content:flex-start;margin-top:8px">' +
        '<button type="button" class="btn btn-ghost" id="btnSpeakW">🔊 อ่านคำ</button>' +
        '<button type="button" class="btn btn-ghost" id="btnSpeakEx">🔊 อ่านตัวอย่าง</button></div>' +
        '</div>' +
        '<div class="tip">💡 ' + g.tip + '</div>';
      el.querySelectorAll('[data-gid]').forEach((b) => {
        b.onclick = () => { selGroup = b.dataset.gid; selWordIdx = 0; renderLearn(); };
      });
      el.querySelectorAll('[data-wi]').forEach((b) => {
        b.onclick = () => { selWordIdx = +b.dataset.wi; renderLearn(); };
      });
      document.getElementById('btnSpeakW').onclick = () => speak(w.word);
      document.getElementById('btnSpeakEx').onclick = () => speak(w.example);
    }

    function renderFlash() {
      const el = document.getElementById('p-flash');
      const g = GROUPS[flashIdx % GROUPS.length];
      const w = g.words[0];
      const others = g.words.map((x) => x.word).join(' · ');
      el.innerHTML =
        '<div class="flash"><div class="flash-inner" id="flashCard">' +
        (flashBack
          ? '<div class="sub">กลุ่ม' + g.emoji + ' <strong>' + g.theme + '</strong></div>' +
            '<div class="big" style="font-size:1.4rem">' + others + '</div>' +
            '<div class="sub">' + g.tip + '</div><small style="font-weight:700;color:#64748b">แตะเพื่อกลับหน้า</small>'
          : '<div class="big">' + w.word + '</div>' +
            '<div class="sub">อ่าน: ' + w.reading + ' · ' + w.register + '</div>' +
            '<small style="font-weight:700;color:#64748b">แตะเพื่อพลิกหลัง</small>') +
        '</div></div>' +
        '<div class="actions">' +
        '<button type="button" class="btn btn-ghost" id="btnPrevF">← ก่อนหน้า</button>' +
        '<button type="button" class="btn btn-primary" id="btnNextF">ถัดไป →</button>' +
        '<button type="button" class="btn btn-accent" id="btnSpeakF">🔊</button></div>' +
        '<p style="text-align:center;font-weight:700;color:var(--muted)">' + ((flashIdx % GROUPS.length) + 1) + ' / ' + GROUPS.length + '</p>';
      document.getElementById('flashCard').onclick = () => { flashBack = !flashBack; renderFlash(); };
      document.getElementById('btnPrevF').onclick = () => {
        flashIdx = (flashIdx - 1 + GROUPS.length) % GROUPS.length;
        flashBack = false;
        renderFlash();
      };
      document.getElementById('btnNextF').onclick = () => {
        flashIdx = (flashIdx + 1) % GROUPS.length;
        flashBack = false;
        renderFlash();
      };
      document.getElementById('btnSpeakF').onclick = () => speak(flashBack ? g.theme : w.word);
    }

    function nextPick() {
      const g = GROUPS[(Math.random() * GROUPS.length) | 0];
      const target = g.words[(Math.random() * g.words.length) | 0];
      const correct = g.words.find((w) => w.word !== target.word) || g.words[0];
      const wrongPool = g.quizWrong.slice();
      while (wrongPool.length < 3) {
        const og = GROUPS[(Math.random() * GROUPS.length) | 0];
        if (og.id === g.id) continue;
        const ow = og.words[0].word;
        if (!wrongPool.includes(ow) && ow !== correct.word) wrongPool.push(ow);
      }
      const opts = shuffle([correct.word].concat(wrongPool.slice(0, 3)));
      pickQ = {
        prompt: 'คำไหนพ้องความหมายกับ「' + target.word + '」?',
        group: g,
        target,
        answer: correct.word,
        opts,
        explain: 'กลุ่ม「' + g.theme + '」: ' + g.words.map((w) => w.word).join(' · ') + ' — ' + g.tip,
      };
      pickAnswered = false;
      renderPick();
    }

    function renderPick() {
      const el = document.getElementById('p-practice');
      if (!pickQ) return;
      el.innerHTML =
        '<div class="q-box">' +
        '<div style="font-size:2.5rem">' + pickQ.group.emoji + '</div>' +
        '<p class="q-text">' + pickQ.prompt + '</p>' +
        '<p style="font-weight:700;color:#64748b">ระดับชั้น ' + pickQ.group.grade + '</p>' +
        '<div class="opts">' +
        pickQ.opts.map((o) => '<button type="button" class="opt" data-v="' + o + '">' + o + '</button>').join('') +
        '</div>' +
        '<p class="fb" id="pickFb"></p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" id="btnNextP">ข้อถัดไป</button></div>' +
        '</div>';
      el.querySelectorAll('.opt').forEach((b) => {
        b.onclick = () => {
          if (pickAnswered) return;
          pickAnswered = true;
          const v = b.dataset.v;
          const ok = v === pickQ.answer;
          el.querySelectorAll('.opt').forEach((o) => {
            if (o.dataset.v === pickQ.answer) o.classList.add('ok');
            else if (o === b) o.classList.add('no');
          });
          document.getElementById('pickFb').className = 'fb ' + (ok ? 'ok' : 'no');
          document.getElementById('pickFb').textContent = (ok ? '✅ ถูกต้อง! ' : '❌ คำตอบคือ「' + pickQ.answer + '」— ') + pickQ.explain;
        };
      });
      document.getElementById('btnNextP').onclick = nextPick;
    }

    function resetMatch() {
      matchThemes = shuffle(GROUPS).slice(0, 3);
      matchWords = shuffle(matchThemes.flatMap((g) =>
        g.words.map((w) => ({ word: w.word, groupId: g.id }))
      ));
      matchPlaces = {};
      matchThemes.forEach((g) => { matchPlaces[g.id] = []; });
      matchSelWord = null;
      matchChecked = false;
      renderMatch();
    }

    function renderMatch() {
      const el = document.getElementById('p-match');
      const used = new Set(Object.values(matchPlaces).flat());
      const allPlaced = matchWords.every((w) => used.has(w.word));
      el.innerHTML =
        '<div class="match-layout">' +
        '<div class="boxes">' +
        matchThemes.map((g) =>
          '<button type="button" class="box' + (matchSelWord ? ' on' : '') + '" data-box="' + g.id + '" style="text-align:left;width:100%;cursor:pointer;font-family:inherit">' +
          '<h4>' + g.emoji + ' ' + g.theme + '</h4>' +
          '<div class="chips">' +
          (matchPlaces[g.id] || []).map((word) => {
            let cls = 'chip';
            if (matchChecked) {
              const item = matchWords.find((x) => x.word === word);
              cls += item && item.groupId === g.id ? ' ok' : ' no';
            }
            return '<span class="' + cls + '">' + word + '</span>';
          }).join('') +
          '</div></button>'
        ).join('') +
        '</div>' +
        '<div>' +
        '<p style="font-weight:800;color:var(--deep);margin-bottom:8px;text-align:center">แตะคำ แล้วแตะกล่องธีม</p>' +
        '<div class="pool">' +
        matchWords.map((w) =>
          '<button type="button" class="f-btn' + (used.has(w.word) ? ' used' : '') +
          (matchSelWord === w.word ? ' sel' : '') + '" data-word="' + w.word + '">' + w.word + '</button>'
        ).join('') +
        '</div></div></div>' +
        '<p class="fb" id="matchFb">' + (allPlaced && !matchChecked ? 'วางครบแล้ว — กดตรวจคำตอบ' : '') + '</p>' +
        '<div class="actions">' +
        '<button type="button" class="btn btn-accent" id="btnCheckM"' + (allPlaced ? '' : ' disabled') + '>ตรวจคำตอบ</button>' +
        '<button type="button" class="btn btn-primary" id="btnNewM">สุ่มชุดใหม่</button></div>';
      el.querySelectorAll('[data-word]').forEach((b) => {
        b.onclick = () => {
          if (used.has(b.dataset.word) || matchChecked) return;
          matchSelWord = matchSelWord === b.dataset.word ? null : b.dataset.word;
          renderMatch();
        };
      });
      el.querySelectorAll('[data-box]').forEach((b) => {
        b.onclick = () => {
          if (!matchSelWord || matchChecked) return;
          const gid = b.dataset.box;
          Object.keys(matchPlaces).forEach((k) => {
            matchPlaces[k] = matchPlaces[k].filter((w) => w !== matchSelWord);
          });
          matchPlaces[gid].push(matchSelWord);
          matchSelWord = null;
          renderMatch();
        };
      });
      document.getElementById('btnNewM').onclick = resetMatch;
      const chk = document.getElementById('btnCheckM');
      chk.onclick = () => {
        if (!allPlaced) return;
        matchChecked = true;
        let ok = 0, total = matchWords.length;
        matchWords.forEach((w) => {
          const box = Object.keys(matchPlaces).find((k) => matchPlaces[k].includes(w.word));
          if (box === w.groupId) ok++;
        });
        renderMatch();
        const fb = document.getElementById('matchFb');
        fb.className = 'fb ' + (ok === total ? 'ok' : 'no');
        fb.textContent = ok === total
          ? '✅ จับคู่ถูกทั้ง ' + total + ' คำ!'
          : 'ได้ ' + ok + '/' + total + ' — สีเขียวถูก สีแดงลองใหม่';
      };
    }

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };
    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };

    setMode('learn');
  </script>
</body>
</html>
