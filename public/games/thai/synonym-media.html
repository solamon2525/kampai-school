  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #1e40af;
      --deep-dark: #1e3a8a;
      --line: #93c5fd;
      --muted: #475569;
      --ink: #0f172a;
      --border: #cbd5e1;
      --ok: #15803d;
      --bad: #b91c1c;
      --cream: #eff6ff;
    }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(160deg, #dbeafe, #bfdbfe);
      min-height: 100vh;
      padding: 12px;
      color: var(--ink);
    }
    .shell {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(90deg, #1e3a8a, #2563eb);
      color: #ffffff;

    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 140px; }

      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }
    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      min-width: 44px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible, .seg button:focus-visible, .grp-btn:focus-visible, .w-card:focus-visible,
    .ke-option:focus-visible, .ke-btn:focus-visible,
    .ke-match-card:focus-visible, .ke-memory-card:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .btn-primary { background: var(--deep); color: #ffffff; }
    .btn-primary:hover { background: var(--deep-dark); }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #ffffff; color: var(--deep); border: 2px solid var(--line); }
    .btn-ghost:hover { background: var(--cream); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #3b82f6;
      background: #ffffff;
    }
    .seg button {
      font-family: inherit;
      font-weight: 800;
      border: none;
      background: #ffffff;
      color: var(--deep);
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      min-height: 44px;
      min-width: 44px;
    }
    .seg button.on { background: var(--deep); color: #ffffff; }
    .hint { font-size: 0.85rem; color: var(--deep-dark); font-weight: 600; flex: 1; min-width: 120px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .panel { display: none; flex-direction: column; gap: 14px; max-width: 960px; margin: 0 auto; width: 100%; }

    .grp-btn {
      font-family: inherit;
      font-weight: 800;
      border: 2px solid var(--line);
      background: #ffffff;
      color: var(--deep);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    .grp-btn.on { background: var(--deep); color: #ffffff; border-color: var(--deep); }
    .word-grid { display: grid; gap: 10px; }
    @media (min-width: 700px) { .word-grid { grid-template-columns: repeat(3, 1fr); } }
    .w-card {
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      min-height: 44px;

    .w-card.on { border-color: var(--deep); background: var(--cream); }
    .w-card .w { font-size: 1.25rem; font-weight: 800; color: var(--deep); }
    .w-card .r { font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .w-card .reg {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      background: #dbeafe;
      color: #1e40af;
      padding: 2px 8px;
      border-radius: 999px;

    .detail { background: var(--cream); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
    .detail h3 { color: var(--deep); font-weight: 800; margin-bottom: 6px; }
    .detail p { font-weight: 600; line-height: 1.5; margin-bottom: 4px; }
    .tip { background: #ffffff; border: 2px dashed var(--line); border-radius: 12px; padding: 10px; font-weight: 700; color: #1e40af; }
    .flash { max-width: 440px; margin: 0 auto; width: 100%; perspective: 800px; }
    .flash-inner {
      min-height: 220px;
      width: 100%;
      border-radius: 20px;
      border: 3px solid var(--line);
      background: linear-gradient(160deg, #eff6ff, #ffffff);
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(30, 64, 175, 0.12);
      font-family: inherit;
    }

    .flash-inner .sub { font-weight: 700; color: #334155; line-height: 1.45; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .speech-status {
      font-size: 0.88rem;
      font-weight: 700;
      color: #78350f;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 8px 12px;
      display: none;
      max-width: 960px;
      margin: 0 auto 12px;
      width: 100%;

    .engine-card {

      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;

    .ke-quiz-card, .ke-quiz-summary { display: flex; flex-direction: column; gap: 14px; }
    .ke-quiz-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 800; }
    .ke-badge { padding: 4px 10px; border-radius: 999px; background: #dbeafe; color: var(--deep-dark); font-size: 0.85rem; }
    .ke-progress { color: var(--muted); font-size: 0.92rem; }
    .ke-prompt { font-size: 1.18rem; font-weight: 800; color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
    .ke-audio-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ke-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ke-options { grid-template-columns: 1fr 1fr; } }
    .ke-option, .ke-btn {
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .ke-option:hover { background: var(--cream); border-color: var(--deep); }
    .ke-btn {
      background: var(--deep);
      color: #ffffff;
      border-color: var(--deep);
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .ke-option.is-correct { background: #dcfce7; border-color: var(--ok); color: #14532d; }
    .ke-option.is-wrong { background: #fee2e2; border-color: var(--bad); color: #7f1d1d; }
    .ke-clue { padding: 10px 12px; border-radius: 10px; background: #fef3c7; color: #78350f; font-weight: 700; }
    .ke-feedback, .ke-match-feedback {
      min-height: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--ink);
      line-height: 1.45;
    }
    .ke-feedback.is-good { background: #dcfce7; color: #14532d; border: 1.5px solid var(--ok); }
    .ke-feedback.is-learn { background: #fef3c7; color: #78350f; border: 1.5px solid #d97706; }
    .ke-match-wrap { position: relative; display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .ke-match-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .ke-match-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .ke-match-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .ke-match-card, .ke-memory-card {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .ke-match-card:hover, .ke-memory-card:hover { border-color: var(--deep); background: var(--cream); }
    .ke-match-card.active { border-color: var(--deep); background: #dbeafe; box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.2); }
    .ke-match-card.matched, .ke-memory-card.matched { background: #dcfce7; border-color: var(--ok); color: #14532d; cursor: default; }
    .ke-match-card.error, .ke-memory-card.error { background: #fee2e2; border-color: var(--bad); color: #7f1d1d; }
    .ke-memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; }
    .ke-memory-card.flipped { background: var(--cream); border-color: var(--deep); }
    .footer { padding: 10px 16px; font-size: 0.8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
      .ke-match-grid { gap: 10px; }
      .ke-match-card { font-size: 0.88rem; padding: 8px 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .btn:active { transform: none; }
    }
  </style>
</head>

        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function speakText(text) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById('speechStatus');
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.9 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.9;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    let mode = 'learn';
    let selGroup = 'syn-sun';
    let selWordIdx = 0;
    let flashIdx = 0;
    let flashBack = false;
    let quizQuestionType = 'choice';
    let matchSubMode = 'connect';
    let quizSession = null;
    let matchSession = null;

    const hints = {
      learn: 'เลือกกลุ่ม → แตะคำเพื่อดูโทนการใช้และตัวอย่าง',
      flash: 'แตะการ์ดเพื่อพลิกหน้า/หลัง · หน้า=คำ หลัง=กลุ่ม+คำคู่',
      practice: 'ฝึกสั้น: เลือกความหมายหรือเติมคำไวพจน์ในประโยค (ไม่เก็บคะแนน)',
      match: 'จับคู่คำไวพจน์กับความหมายของกลุ่มคำ (ไม่จับเวลา · ไม่เก็บคะแนน)',
    };

    function setMode(m) {
      stopSpeech();
      mode = (m === 'flash' || m === 'practice' || m === 'match') ? m : 'learn';
      document.querySelectorAll('#modeSeg button').forEach((b) => {
        const active = b.dataset.mode === mode;
        b.classList.toggle('on', active);
        b.setAttribute('aria-pressed', String(active));
      });
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('on'));
      document.getElementById('p-' + mode).classList.add('on');
      document.getElementById('hintText').textContent = hints[mode];
      if (mode === 'learn') renderLearn();
      if (mode === 'flash') { flashBack = false; renderFlash(); }
      if (mode === 'practice' && !quizSession) mountQuiz();
      if (mode === 'match') mountMatch();
    }

    function renderLearn() {
      const el = document.getElementById('p-learn');
      const g = groupById(selGroup) || GROUPS[0];
      const w = g.words[selWordIdx] || g.words[0];
      el.innerHTML =
        '<div class="grp-list">' +
        GROUPS.map((x) =>
          '<button type="button" class="grp-btn' + (x.id === selGroup ? ' on' : '') + '" data-gid="' + x.id + '">' +
          x.emoji + ' ' + x.theme + '</button>'
        ).join('') +
        '</div>' +
        '<div class="word-grid">' +
        g.words.map((word, i) =>
          '<button type="button" class="w-card' + (i === selWordIdx ? ' on' : '') + '" data-wi="' + i + '">' +
          '<div class="w">' + word.word + '</div><div class="r">อ่าน: ' + word.reading + '</div>' +
          '<span class="reg">' + word.register + '</span></button>'
        ).join('') +
        '</div>' +
        '<div class="detail">' +
        '<h3>' + g.emoji + ' ' + w.word + ' · กลุ่ม「' + g.theme + '」</h3>' +
        '<p><strong>อ่าน:</strong> ' + w.reading + ' · <strong>ระดับภาษา:</strong> ' + w.register + '</p>' +
        '<p><strong>โทนใช้:</strong> ' + w.nuance + '</p>' +
        '<p><strong>ตัวอย่าง:</strong> 「' + w.example + '」</p>' +
        '<div class="actions" style="justify-content:flex-start;margin-top:8px">' +
        '<button type="button" class="btn btn-ghost" id="btnSpeakW">🔊 อ่านคำ</button>' +
        '<button type="button" class="btn btn-ghost" id="btnSpeakEx">🔊 อ่านตัวอย่าง</button></div>' +
        '</div>' +
        '<div class="tip">💡 ' + g.tip + '</div>';
      el.querySelectorAll('[data-gid]').forEach((b) => {
        b.onclick = () => { stopSpeech(); selGroup = b.dataset.gid; selWordIdx = 0; renderLearn(); };
      });
      el.querySelectorAll('[data-wi]').forEach((b) => {
        b.onclick = () => { stopSpeech(); selWordIdx = +b.dataset.wi; renderLearn(); };
      });
      document.getElementById('btnSpeakW').onclick = () => speakText(w.word);
      document.getElementById('btnSpeakEx').onclick = () => speakText(w.example);
    }

    function renderFlash() {
      const el = document.getElementById('p-flash');
      const g = GROUPS[flashIdx % GROUPS.length];
      const w = g.words[0];
      const others = g.words.map((x) => x.word).join(' · ');
      el.innerHTML =
        '<div class="flash"><button type="button" class="flash-inner" id="flashCard">' +
        (flashBack
          ? '<div class="sub">กลุ่ม' + g.emoji + ' <strong>' + g.theme + '</strong></div>' +
            '<div class="big" style="font-size:1.4rem">' + others + '</div>' +
            '<div class="sub">' + g.tip + '</div><small style="font-weight:700;color:#475569">แตะเพื่อกลับหน้า</small>'
          : '<div class="big">' + w.word + '</div>' +
            '<div class="sub">อ่าน: ' + w.reading + ' · ' + w.register + '</div>' +
            '<small style="font-weight:700;color:#475569">แตะเพื่อพลิกหลัง</small>') +
        '</button></div>' +
        '<div class="actions">' +
        '<button type="button" class="btn btn-ghost" id="btnPrevF">← ก่อนหน้า</button>' +
        '<button type="button" class="btn btn-primary" id="btnNextF">ถัดไป →</button>' +
        '<button type="button" class="btn btn-accent" id="btnSpeakF" aria-label="ฟังเสียงอ่าน">🔊 ฟังเสียง</button></div>' +
        '<p style="text-align:center;font-weight:700;color:var(--muted)">' + ((flashIdx % GROUPS.length) + 1) + ' / ' + GROUPS.length + '</p>';
      document.getElementById('flashCard').onclick = () => { flashBack = !flashBack; renderFlash(); };
      document.getElementById('btnPrevF').onclick = () => {
        stopSpeech();
        flashIdx = (flashIdx - 1 + GROUPS.length) % GROUPS.length;
        flashBack = false;
        renderFlash();
      };
      document.getElementById('btnNextF').onclick = () => {
        stopSpeech();
        flashIdx = (flashIdx + 1) % GROUPS.length;
        flashBack = false;
        renderFlash();
      };
      document.getElementById('btnSpeakF').onclick = () => speakText(flashBack ? (g.theme + ': ' + others) : w.word);
    }

    function updateQuizButtons() {
      const cBtn = document.getElementById('btnQuizChoice');
      const lBtn = document.getElementById('btnQuizListen');
      if (cBtn) cBtn.className = 'btn ' + (quizQuestionType === 'choice' ? 'btn-primary' : 'btn-ghost');
      if (lBtn) lBtn.className = 'btn ' + (quizQuestionType === 'listen' ? 'btn-primary' : 'btn-ghost');
    }

    function mountQuiz() {
      if (!window.KampaiEngines || !window.KampaiEngines.Quiz) return;
      updateQuizButtons();
      const opts = {
        items: ENGINE_POOL,
        mode: 'media',
        categorySlug: 'synonyms',
        roundSize: 8,
        locale: 'th-TH',
        speak: (text) => speakText(text),
        onAnswer: (res) => {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      };
      quizSession = quizQuestionType === 'listen'
        ? window.KampaiEngines.Quiz.mountListen('#quizEngineRoot', opts)
        : window.KampaiEngines.Quiz.mountChoice('#quizEngineRoot', opts);
    }

    function updateMatchButtons() {
      const cBtn = document.getElementById('btnMatchConnect');
      const mBtn = document.getElementById('btnMatchMemory');
      if (cBtn) cBtn.className = 'btn ' + (matchSubMode === 'connect' ? 'btn-primary' : 'btn-ghost');
      if (mBtn) mBtn.className = 'btn ' + (matchSubMode === 'memory' ? 'btn-primary' : 'btn-ghost');
    }

    function mountMatch() {
      if (!window.KampaiEngines || !window.KampaiEngines.ConnectMatch) return;
      updateMatchButtons();
      matchSession = window.KampaiEngines.ConnectMatch.mount('#matchEngineRoot', {
        items: ENGINE_POOL,
        pairCount: 6,
        mode: 'media',
        subMode: matchSubMode,
        locale: 'th-TH',
        onMatch: (pair) => {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try { KAMPAI.sound.correct(); } catch (_) {}
          }
          if (pair && pair.leftText) speakText(pair.leftText);
        },
      });
    }

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };
    document.getElementById('btnQuizChoice').addEventListener('click', () => {
      stopSpeech();
      quizQuestionType = 'choice';
      mountQuiz();
    });
    document.getElementById('btnQuizListen').addEventListener('click', () => {
      stopSpeech();
      quizQuestionType = 'listen';
      mountQuiz();
    });
    document.getElementById('btnQuizNew').addEventListener('click', () => {
      stopSpeech();
      mountQuiz();
    });
    document.getElementById('btnMatchConnect').addEventListener('click', () => {
      stopSpeech();
      matchSubMode = 'connect';
      mountMatch();
    });
    document.getElementById('btnMatchMemory').addEventListener('click', () => {
      stopSpeech();
      matchSubMode = 'memory';
      mountMatch();
    });
    document.getElementById('btnMatchNew').addEventListener('click', () => {
      stopSpeech();
      mountMatch();
    });
    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      selectedGroup: selGroup,
      selectedWordIndex: selWordIdx,
      flashIndex: flashIdx,
      flashBack: flashBack,
      groupCount: GROUPS.length,
      wordCount: ENGINE_POOL.length,
      quizQuestionType: quizQuestionType,
      matchSubMode: matchSubMode,
      quizState: quizSession ? quizSession.getState() : null,
      matchState: matchSession ? matchSession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });

    mountQuiz();
    mountMatch();
    setMode('learn');
  </script>
</body>
</html>
