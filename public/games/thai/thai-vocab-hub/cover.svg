<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.25"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🇹🇭</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">✍️</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ภาษาไทย ป.4</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">คลังคำศัพท์ไทย</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">ฝึกเขียนตามคำบอก พลิกการ์ดศัพท์ ทายความหมาย จับคู่คำอ่าน</text>

  <!-- Interactive card representations -->
  <g transform="translate(640,515)">
    <!-- Back card (orange) -->
    <rect x="-140" y="-45" width="220" height="100" rx="12" fill="#ea580c" stroke="#ffffff" stroke-width="2" filter="url(#sh)" transform="rotate(-8)"/>
    <text x="-30" y="5" font-size="20" font-weight="700" fill="#ffedd5" text-anchor="middle" dominant-baseline="middle" transform="rotate(-8)">คำอ่าน: [ กะ-เพรา ]</text>

    <!-- Front card (blue) -->
    <rect x="-80" y="-35" width="220" height="100" rx="12" fill="#1e40af" stroke="#ffffff" stroke-width="2" filter="url(#sh)" transform="rotate(6)"/>
    <text x="30" y="15" font-size="34" font-weight="800" fill="#fbbf24" text-anchor="middle" dominant-baseline="middle" transform="rotate(6)">กะเพรา</text>
  </g>
  <g transform="translate(640,652)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#ea580c" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#ffedd5" text-anchor="middle" dominant-baseline="middle">มักเขียนผิด · คำพ้องเสียง · ลักษณนาม · ราชาศัพท์ · สำนวนไทย</text>
  </g>
</svg>
