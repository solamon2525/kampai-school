<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Prompt','Kanit','Sarabun',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3663"/>
      <stop offset="0.6" stop-color="#0d508f"/>
      <stop offset="1" stop-color="#0c6b9e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="500" fill="url(#glow)"/>

  <!-- Bubbles -->
  <circle cx="200" cy="500" r="15" fill="#ffffff" opacity="0.12" />
  <circle cx="230" cy="450" r="8" fill="#ffffff" opacity="0.1" />
  <circle cx="1050" cy="250" r="25" fill="#ffffff" opacity="0.15" />
  <circle cx="1090" cy="180" r="12" fill="#ffffff" opacity="0.12" />
  <circle cx="640" cy="620" r="10" fill="#ffffff" opacity="0.08" />

  <!-- faint watermark Thai characters -->
  <text x="1100" y="520" font-size="450" font-weight="900" fill="#ffffff" opacity="0.03" text-anchor="middle" dominant-baseline="middle">ก</text>
  <text x="180" y="220" font-size="280" font-weight="900" fill="#ffffff" opacity="0.02" text-anchor="middle" dominant-baseline="middle">กด</text>

  <!-- fishing hook visual representation -->
  <g transform="translate(640, 0)" filter="url(#sh)">
    <!-- hook line -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ffffff" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="10 5" />
    <!-- hook -->
    <path d="M0 150 c -5 20, 20 20, 20 10 c 0 -5, -5 -10, -5 -10" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- top pill info -->
  <g transform="translate(640,110)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">🇹🇭 KAMPAI · มาตราสะกด</text>
  </g>

  <!-- title -->
  <text x="640" y="280" font-size="120" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">ตกปลามาตราตัวสะกด</text>

  <!-- subtitle -->
  <text x="640" y="375" font-size="34" font-weight="600" fill="#bae6fd" text-anchor="middle" dominant-baseline="middle">ตะลุยตกปลามาตรา กก · กน · กม · กด · กบ เพื่อเก็บคะแนน</text>

  <!-- Animated Fish representations (Simulated static SVG) -->
  <!-- Correct fish -->
  <g transform="translate(420, 520)" filter="url(#sh)">
    <rect x="-110" y="-35" width="220" height="70" rx="20" fill="#ffffff" opacity="0.15" stroke="#38bdf8" stroke-width="2" />
    <text x="-50" y="2" font-size="44" text-anchor="middle" dominant-baseline="middle">🐠</text>
    <text x="30" y="2" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">หมาก (กก)</text>
  </g>

  <!-- Wrong fish -->
  <g transform="translate(860, 520)" filter="url(#sh)">
    <rect x="-110" y="-35" width="220" height="70" rx="20" fill="#ffffff" opacity="0.08" stroke="#ef4444" stroke-width="1.5" />
    <text x="-50" y="2" font-size="44" text-anchor="middle" dominant-baseline="middle">🦈</text>
    <text x="30" y="2" font-size="32" font-weight="700" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">ลม (กน)</text>
  </g>

  <!-- bottom tip -->
  <g transform="translate(640,640)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="#38bdf8" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle" dominant-baseline="middle">🔊 ระบบเสียงสังเคราะห์ออกเสียงสะกดอัตโนมัติ 🗣️</text>
  </g>
</svg>
