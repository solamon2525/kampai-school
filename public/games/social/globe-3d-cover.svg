<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0369a1"/><stop offset="0.55" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ocean" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="0.7" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🌍</text>
  <text x="1110" y="170" font-size="190" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🧭</text>

  <g transform="translate(640,112)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e0f2fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · สังคมศึกษา ป.4–6 · 3D</text>
  </g>
  <text x="640" y="270" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">ลูกโลก 3 มิติ</text>
  <text x="640" y="352" font-size="34" font-weight="700" fill="#bae6fd" text-anchor="middle" dominant-baseline="middle">หมุนโลกรอบด้าน · ทวีปสีทองคือทวีปอะไร?</text>

  <!-- ลูกโลกการ์ตูน -->
  <g transform="translate(640,540)">
    <circle cx="0" cy="0" r="118" fill="url(#ocean)" stroke="#0f172a" stroke-width="5"/>
    <!-- ทวีป (stylized) -->
    <path d="M-70,-55 q30,-18 60,-2 q18,18 -2,34 q-30,10 -55,-2 q-18,-16 -3,-30 Z" fill="#34d399" stroke="#0f172a" stroke-width="3"/>
    <path d="M28,-30 q34,-6 44,18 q4,30 -26,40 q-30,2 -34,-26 q0,-26 16,-32 Z" fill="#FFD700" stroke="#b45309" stroke-width="5"/>
    <path d="M-30,40 q22,-6 30,16 q2,24 -20,30 q-22,0 -22,-24 q2,-18 12,-22 Z" fill="#fb923c" stroke="#0f172a" stroke-width="3"/>
    <!-- เส้นลองจิจูด/ละติจูด -->
    <ellipse cx="0" cy="0" rx="118" ry="44" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="44" ry="118" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <g transform="translate(640,672)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · ลากเพื่อหมุนโลก · 7 ทวีป</text>
  </g>
</svg>
