<style>
.ring-box{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5mm;margin:1mm 0}
.ring{border:1.6px solid var(--ws-accent);border-radius:50%;aspect-ratio:1;display:grid;place-items:center;font-size:6.5pt;font-weight:800;color:var(--ws-accent);text-align:center;padding:1mm;line-height:1.2}
.cond-row{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin-top:1mm}
.cond{border:1px dashed var(--ws-accent-2);border-radius:4px;padding:.8mm;font-size:7pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.apply-box{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:1mm;align-items:center;margin-top:1mm;font-size:6.5pt;font-weight:700}
.apply-box div{border:1px dashed var(--ws-line);border-radius:3px;min-height:7mm;padding:.4mm;text-align:center}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-10 .ring{font-size:5.5pt}
</style>
