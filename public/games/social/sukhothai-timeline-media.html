<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัยสุโขทัย — ไทม์ไลน์ — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #92400e; --line: #fde68a; --gold: #b45309; --muted: #64748b; --ok: #16a34a; --bad: #dc2626; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #fef3c7, #fde68a); min-height: 100%; padding: 12px; color: #0f172a; }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #78350f, #b45309); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fffbeb; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #fcd34d; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #92400e; font-weight: 600; flex: 1; }
    .stage { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; overflow: auto; }
    @media (min-width: 860px) { .stage { grid-template-columns: 1fr 1fr; } }
    .timeline-wrap { padding: 16px; background: #fffbeb; overflow-y: auto; }
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 4px; background: linear-gradient(180deg, #fcd34d, #b45309); border-radius: 4px; }
    .tl-item { position: relative; margin-bottom: 14px; cursor: pointer; }
    .tl-item::before { content: ''; position: absolute; left: -22px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid #d97706; transition: transform .15s, background .15s; }
    .tl-item.on::before { background: #b45309; transform: scale(1.2); }
    .tl-card { background: #fff; border: 2px solid #fde68a; border-radius: 14px; padding: 12px 14px; transition: border-color .15s, box-shadow .15s; }
    .tl-item.on .tl-card { border-color: #b45309; box-shadow: 0 4px 16px rgba(180,83,9,.15); }
    .tl-year { font-size: .8rem; font-weight: 800; color: #d97706; }
    .tl-title { font-size: 1rem; font-weight: 800; color: var(--deep); margin: 2px 0; }
    .tl-sub { font-size: .85rem; font-weight: 600; color: var(--muted); }
    .detail { padding: 16px; background: #fff; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 860px) { .detail { border-top: none; border-left: 1px solid var(--line); } }
    .hero { font-size: 3rem; text-align: center; }
    .detail-title { font-size: 1.4rem; font-weight: 800; color: var(--deep); text-align: center; }
    .detail-year { text-align: center; font-weight: 700; color: #d97706; }
    .detail-body { background: #fffbeb; border: 2px dashed #fcd34d; border-radius: 14px; padding: 14px; font-weight: 600; line-height: 1.6; }
    .facts { display: flex; flex-wrap: wrap; gap: 8px; }
    .fact-tag { background: #fef3c7; border: 2px solid #fde68a; border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: .85rem; color: #92400e; }
    .practice { display: none; flex-direction: column; gap: 14px; padding: 20px; align-items: center; grid-column: 1 / -1; }
    .practice.on { display: flex; }
    .timeline-wrap.hide, .detail.hide { display: none; }
    .pr-q { font-weight: 800; font-size: 1.1rem; color: var(--deep); text-align: center; max-width: 520px; }
    .opts { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; }
    .opt { font-family: inherit; font-weight: 700; padding: 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; text-align: left; }
    .opt.ok { background: #dcfce7; border-color: #86efac; }
    .opt.no { background: #fee2e2; border-color: #fca5a5; }
    .fb { font-weight: 800; min-height: 28px; text-align: center; }
    .footer { padding: 10px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
  
    .practice-mcq{display:none;flex-direction:column;gap:12px;max-width:520px;margin:0 auto;padding:8px 0;width:100%}
    .practice-mcq.on{display:flex}
    .practice-mcq .pq{font-weight:800;font-size:1.15rem;text-align:center;line-height:1.45}
    .practice-mcq .popts{display:flex;flex-direction:column;gap:8px}
    .practice-mcq .popt{font-family:inherit;font-weight:700;padding:12px;border:2px solid #cbd5e1;border-radius:12px;background:#fff;cursor:pointer;text-align:left}
    .practice-mcq .popt.ok{background:#dcfce7;border-color:#86efac}
    .practice-mcq .popt.no{background:#fee2e2;border-color:#fca5a5}
    .practice-mcq .pfb{font-weight:800;text-align:center;min-height:24px}

</style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>🏛️ สมัยสุโขทัย — ไทม์ไลน์และบุคคลสำคัญ</h1>
      <span class="badge">ป.4 · สังคมศึกษา</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกทำ</button>
      </span>
      <p class="hint">แตะเหตุการณ์บนไทม์ไลน์เพื่ออ่านรายละเอียด</p>
      <button type="button" class="btn btn-ghost" id="btnFs">⛶</button>
    </div>
    <div class="stage">
      <div class="timeline-wrap" id="timelineWrap">
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="detail" id="detail">
        <div class="hero" id="hero">🏛️</div>
        <h2 class="detail-title" id="dTitle">อาณาจักรสุโขทัย</h2>
        <p class="detail-year" id="dYear">พ.ศ. 1781–1988 (ค.ศ. 1238–1445)</p>
        <div class="detail-body" id="dBody">แตะเหตุการณ์ทางซ้ายเพื่อเรียนรู้ประวัติศาสตร์สุโขทัย</div>
        <div class="facts" id="dFacts"></div>
      </div>
      <div class="practice" id="practice">
        <p class="pr-q" id="prQ"></p>
        <div class="opts" id="prOpts"></div>
        <p class="fb" id="prFb"></p>
        <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
      </div>
    </div>
    <footer>ตัวชี้วัด <strong>ส 4.3 ป.4/1–3</strong> · คู่เกม <a href="/play/social-quiz">สังคมรอบรู้</a></footer>
  </div>
  <script>
    if (window.KAMPAI) window.KAMPAI.setSlug('sukhothai-timeline-media');

    const EVENTS = [
      {
        id: 'found',
        year: 'พ.ศ. 1781 (ค.ศ. 1238)',
        title: 'ก่อตั้งอาณาจักรสุโขทัย',
        sub: 'พ่อขุนไชยแสงทอง (พ่อขุนผาเมือง)',
        emoji: '🏛️',
        body: 'พ่อขุนไชยแสงทอง ร่วมกับพ่อขุนบางมูลและพ่อขุนอุกรรมขึ้นครองเมืองสุโขทัย ปลดปล่อยออกจากอำนาจขอม ถือเป็นการก่อตั้งอาณาจักรสุโขทัยอย่างเป็นทางการ',
        facts: ['เมืองหลวง: สุโขทัย', 'ปลดปล่อยจากอาคาเดีย'],
      },
      {
        id: 'ram',
        year: 'พ.ศ. 1826–1890 (ค.ศ. 1275–1347)',
        title: 'พ่อขุนรามคำแหงมหาราช',
        sub: 'กษัตริย์ผู้ยิ่งใหญ่แห่งสุโขทัย',
        emoji: '👑',
        body: 'พ่อขุนรามคำแหงมหาราช ขยายอาณาเขต สร้างความมั่นคง ทำลายล้างศัตรู ส่งเสริมพุทธศาสนา และเป็นที่เลื่องลือเรื่องการสร้างอักษรไทย (ลิลิตย่อย) ตามแผ่นจารึกศิลาจารึกที่ 1',
        facts: ['อักษรไทย', 'ศิลาจารึกที่ 1', 'ขยายอาณาเขต'],
      },
      {
        id: 'inscription',
        year: 'พ.ศ. 1835 (ค.ศ. 1292)',
        title: 'ศิลาจารึกที่ 1',
        sub: 'หลักฐานสำคัญของอารยธรรมไทย',
        emoji: '📜',
        body: 'จารึกบนหินที่วัดมหาธาตุ สุโขทัย บันทึกการปกครองของพ่อขุนรามคำแหง ระบบกฎหมาย ความเจริญของเมือง และการใช้อักษรไทย เป็นหลักฐานทางประวัติศาสตร์ที่สำคัญที่สุดแห่งหนึ่ง',
        facts: ['วัดมหาธาตุ', 'อักษรไทย', 'กฎหมายสุโขทัย'],
      },
      {
        id: 'trade',
        year: 'พ.ศ. 1850–1880',
        title: 'ความเจริญทางการค้า',
        sub: 'เมืองท่าและพ่อค้า',
        emoji: '🛶',
        body: 'สุโขทัยเป็นศูนย์กลางการค้า มีการแลกเปลี่ยนสินค้ากับต่างประเทศ ช่างฝีมือสร้างเครื่องปั้นดินเผา เครื่องเงิน และงานศิลปะที่มีชื่อเสียง',
        facts: ['การค้า', 'เครื่องปั้นดินเผา', 'ช่างฝีมือ'],
      },
      {
        id: 'religion',
        year: 'พ.ศ. 1830–1870',
        title: 'พุทธศาสนาและศิลปะ',
        sub: 'วัดและพระพุทธรู',
        emoji: '🙏',
        body: 'พุทธศาสนาเถรวาท เป็นศาสนาหลัก มีการสร้างวัดวาอาราม โบสถ์ และพระพุทธรูรูปแบบสุโขทัยที่โดดเด่น เช่น พระพุทธรูปางมารวิชัย',
        facts: ['พระพุทธรูสุโขทัย', 'วัดมหาธาตุ', 'ศิลปะไทย'],
      },
      {
        id: 'decline',
        year: 'พ.ศ. 1988 (ค.ศ. 1445)',
        title: 'การเสื่อมและยุทธศาสตร์',
        sub: 'สู่อยุธยา',
        emoji: '📉',
        body: 'อาณาจักรสุโขทัยค่อย ๆ เสื่อมลง มีการแย่งชิงอำนาจจากอาณาจักรอื่น โดยเฉพาะอยุธยา จนในที่สุดถูกรวมเข้ากับอาณาจักรอยุธยา',
        facts: ['อยุธยา', 'เสื่อมอำนาจ', 'รวมอาณาจักร'],
      },
    ];

    let selected = EVENTS[0];

    function renderTimeline() {
      document.getElementById('timeline').innerHTML = EVENTS.map(e => `
        <div class="tl-item${e.id === selected.id ? ' on' : ''}" data-id="${e.id}">
          <div class="tl-card">
            <div class="tl-year">${e.year}</div>
            <div class="tl-title">${e.emoji} ${e.title}</div>
            <div class="tl-sub">${e.sub}</div>
          </div>
        </div>`).join('');
      document.querySelectorAll('.tl-item').forEach(el => {
        el.onclick = () => {
          selected = EVENTS.find(x => x.id === el.dataset.id);
          renderTimeline();
          showDetail(selected);
        };
      });
    }

    function showDetail(e) {
      document.getElementById('hero').textContent = e.emoji;
      document.getElementById('dTitle').textContent = e.title;
      document.getElementById('dYear').textContent = e.year;
      document.getElementById('dBody').textContent = e.body;
      document.getElementById('dFacts').innerHTML = e.facts.map(f =>
        `<span class="fact-tag">${f}</span>`).join('');
    }

    const QUIZ = [
      { q: 'ใครเป็นผู้ก่อตั้งอาณาจักรสุโขทัย?', a: 'พ่อขุนไชยแสงทอง', w: ['พ่อขุนรามคำแหง', 'พระเจ้าตกษิน', 'พระนารไน'] },
      { q: 'พ่อขุนรามคำแหงมีความโดดเด่นเรื่องใด?', a: 'สร้างอักษรไทย', w: ['สร้างวัดพระแก้ว', 'สร้างกรุงรัตนโกสินทร์', 'ค้นพบอเมริกา'] },
      { q: 'ศิลาจารึกที่ 1 อยู่ที่ใด?', a: 'วัดมหาธาตุ สุโขทัย', w: ['วัดพระศรีสรรเพชญ์', 'วัดอรุณ', 'วัดโพธิ์'] },
      { q: 'อาณาจักรสุโขทัยเสื่อมลงและถูกรวมเข้ากับอาณาจักรใด?', a: 'อยุธยา', w: ['ล้านนา', 'เชียงใหม่', 'นครศรีธรรมราช'] },
      { q: 'อาณาจักรสุโขทัยก่อตั้งเมื่อ พ.ศ. ใด?', a: '1781', w: ['1350', '1238', '1890'] },
      { q: 'ศาสนาหลักในสมัยสุโขทัยคือ?', a: 'พุทธศาสนา', w: ['คริสต์ศาสนา', 'อิสลาม', 'ฮินดู'] },
    ];
    let qi = 0;

    function showQuiz() {
      const item = QUIZ[qi % QUIZ.length];
      document.getElementById('prQ').textContent = item.q;
      const opts = [item.a, ...item.w].sort(() => Math.random() - 0.5);
      document.getElementById('prOpts').innerHTML = opts.map(o =>
        `<button type="button" class="opt" data-a="${o}">${o}</button>`).join('');
      document.getElementById('prFb').textContent = '';
      document.querySelectorAll('.opt').forEach(b => {
        b.onclick = () => {
          const ok = b.dataset.a === item.a;
          b.classList.add(ok ? 'ok' : 'no');
          document.getElementById('prFb').textContent = ok ? '✓ ถูกต้อง' : `✗ คำตอบ: ${item.a}`;
          document.getElementById('prFb').style.color = ok ? '#16a34a' : '#dc2626';
          document.querySelectorAll('.opt').forEach(x => {
            x.disabled = true;
            if (x.dataset.a === item.a) x.classList.add('ok');
          });
        };
      });
    }
    document.getElementById('btnNext').onclick = () => { qi++; showQuiz(); };

    document.getElementById('modeSeg').querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        const pr = btn.dataset.mode === 'practice';
        document.getElementById('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
        document.getElementById('timelineWrap').classList.toggle('hide', pr);
        document.getElementById('detail').classList.toggle('hide', pr);
        document.getElementById('practice').classList.toggle('on', pr);
        if (pr) showQuiz();
      };
    });

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };

    renderTimeline();
    showDetail(selected);
  </script>

    <div class="practice-mcq" id="practiceMcq">
      <p class="pq"></p>
      <div class="popts"></div>
      <p class="pfb"></p>
      <button type="button" class="btn btn-primary" id="btnPracticeNext" style="align-self:center">ข้อถัดไป</button>
    </div>

<script>
(function(){
  var PRACTICE_Q = [{"q":"สุโขทัยเป็นอาณาจักรสำคัญในประวัติศาสตร์ไทยช่วงใดโดยประมาณ?","opts":["พุทธศตวรรษที่ 18–19","ปัจจุบันเท่านั้น","ยุคหินเก่า","ปี ค.ศ. 2000+"],"a":"พุทธศตวรรษที่ 18–19"},{"q":"พ่อขุนรามคำแหงเกี่ยวข้องกับสุโขทัยอย่างไร?","opts":["กษัตริย์สำคัญของสุโขทัย","นักสำรวจยุโรป","พ่อค้าชาวจีนสมัยใหม่","ครูโรงเรียน"],"a":"กษัตริย์สำคัญของสุโขทัย"},{"q":"เส้นเวลาช่วยอะไร?","opts":["เรียงเหตุการณ์ตามลำดับเวลา","วัดอุณหภูมิ","นับเงิน","วาดแผนที่ถนน"],"a":"เรียงเหตุการณ์ตามลำดับเวลา"},{"q":"เมื่ออ่านเหตุการณ์บนเส้นเวลา ควรดู…","opts":["ปี/ศักราช และคำอธิบายสั้น","สีตัวอักษรอย่างเดียว","จำนวนจุด","ชื่อไฟล์"],"a":"ปี/ศักราช และคำอธิบายสั้น"},{"q":"อักษรไทยมีตำนานเชื่อมกับยุคสุโขทัยอย่างไร?","opts":["มีการประดิษฐ์/พัฒนาระบบเขียน","ไม่มีตัวอักษร","ใช้เฉพาะตัวเลขโรมัน","ใช้เฉพาะภาพวาด"],"a":"มีการประดิษฐ์/พัฒนาระบบเขียน"},{"q":"เหตุการณ์ที่เกิดก่อนควรอยู่ทางใดของเส้นเวลา (ซ้าย→ขวา)?","opts":["ซ้าย","ขวาสุดเสมอ","ตรงกลางเท่านั้น","สุ่มตำแหน่ง"],"a":"ซ้าย"}];
  function nextPracticeMcq(){
    var item = PRACTICE_Q[(Math.random()*PRACTICE_Q.length)|0];
    var box = document.getElementById('practiceMcq');
    if(!box) return;
    box.querySelector('.pq').textContent = item.q;
    var fb = box.querySelector('.pfb'); fb.textContent=''; fb.style.color='';
    var opts = item.opts.slice().sort(function(){return Math.random()-0.5;});
    var popts = box.querySelector('.popts');
    popts.innerHTML = opts.map(function(o){return '<button type="button" class="popt" data-a="'+o+'">'+o+'</button>';}).join('');
    popts.querySelectorAll('.popt').forEach(function(btn){
      btn.onclick=function(){
        var ok = btn.getAttribute('data-a') === item.a;
        btn.classList.add(ok?'ok':'no');
        popts.querySelectorAll('.popt').forEach(function(b){
          b.disabled=true;
          if(b.getAttribute('data-a')===item.a) b.classList.add('ok');
        });
        fb.textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: '+item.a;
        fb.style.color = ok ? '#16a34a' : '#dc2626';
        if(window.KAMPAI&&KAMPAI.sound) (ok?KAMPAI.sound.correct:KAMPAI.sound.wrong)();
      };
    });
  }
  function wire(){
    var seg = document.getElementById('modeSeg') || document.querySelector('.seg') || document.querySelector('.toolbar');
    if(!seg) return;
    if(!document.querySelector('[data-mode="practice"]')){
      var b=document.createElement('button');
      b.type='button'; b.setAttribute('data-mode','practice'); b.textContent='✏️ ฝึกสั้น';
      b.style.cssText='font-family:inherit;font-weight:800;border:none;background:#fff;padding:8px 14px;cursor:pointer;border-radius:10px;margin-left:6px';
      seg.appendChild(b);
    }
    document.body.addEventListener('click', function(e){
      var btn = e.target.closest('[data-mode="practice"]');
      if(!btn) return;
      document.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.toggle('on', x===btn); });
      var pmcq=document.getElementById('practiceMcq');
      if(pmcq) pmcq.classList.add('on');
      document.querySelectorAll('.panel,.stage > div,.display-area > div').forEach(function(p){
        if(p.id==='practiceMcq') return;
        if(p.classList && p.classList.contains('practice-mcq')) return;
      });
      // hide common learn panels loosely
      document.querySelectorAll('.panel.on').forEach(function(p){ p.classList.remove('on'); });
      nextPracticeMcq();
    }, true);
    document.getElementById('btnPracticeNext')?.addEventListener('click', nextPracticeMcq);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', wire); else wire();
})();
</script>
