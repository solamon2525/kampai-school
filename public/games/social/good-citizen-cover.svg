<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3730a3"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="180" y="600" font-size="240" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🤝</text>
  <text x="1110" y="170" font-size="200" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🏛️</text>

  <g transform="translate(640,118)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">🤝 KAMPAI · สังคมศึกษา ป.4-6</text>
  </g>
  <text x="640" y="290" font-size="124" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">พลเมืองดี</text>
  <text x="640" y="378" font-size="36" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">ดูสถานการณ์ → ตัดสิน "ควรทำ / ไม่ควรทำ"</text>

  <!-- example: scenario card + judge buttons -->
  <g transform="translate(640,540)">
    <text x="-380" y="-6" font-size="92" text-anchor="middle" dominant-baseline="middle">👵</text>
    <rect x="-300" y="-58" width="118" height="116" rx="18" fill="#16a34a"/>
    <text x="-241" y="-6" font-size="48" text-anchor="middle" dominant-baseline="central">👍</text>
    <text x="-241" y="40" font-size="20" fill="#dcfce7" text-anchor="middle" font-weight="700">ควรทำ</text>
    <rect x="-174" y="-58" width="118" height="116" rx="18" fill="#e11d48"/>
    <text x="-115" y="-6" font-size="48" text-anchor="middle" dominant-baseline="central">👎</text>
    <text x="-115" y="40" font-size="18" fill="#ffe4e6" text-anchor="middle" font-weight="700">ไม่ควร</text>
    <text x="120" y="-14" font-size="26" fill="#fde68a" font-weight="700" dominant-baseline="middle">“ลุกให้ผู้สูงอายุนั่ง”</text>
    <text x="120" y="26" font-size="22" fill="#86efac" dominant-baseline="middle">✅ มีน้ำใจ เอื้อเฟื้อ</text>
  </g>
  <g transform="translate(640,668)">
    <rect x="-300" y="-24" width="600" height="48" rx="24" fill="#6366f1" opacity="0.22"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#c7d2fe" text-anchor="middle" dominant-baseline="middle">มารยาทไทย · กฎกติกา · น้ำใจ · ประชาธิปไตย · ส่วนรวม</text>
  </g>
</svg>
