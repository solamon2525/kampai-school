<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>พลเมืองดี — สื่อการสอน — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #b45309; --line: #fde68a; --good: #15803d; --bad: #b91c1c; --muted: #475569; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #fef3c7, #fde68a); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #92400e, #b45309); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 140px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .trait:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #fffbeb; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #fcd34d; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; font-size: .9rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #92400e; font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn-panel { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .learn-panel.hide { display: none; }
    .traits { display: grid; gap: 10px; }
    @media (min-width: 600px) { .traits { grid-template-columns: 1fr 1fr; } }
    .trait { background: #fffbeb; border: 2px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 44px; color: var(--ink); }
    .trait h3 { color: var(--deep); font-size: 1rem; font-weight: 800; }
    .trait p { font-weight: 600; line-height: 1.5; font-size: .95rem; }
    .trait .say-hint { font-size: .8rem; font-weight: 700; color: #92400e; }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
    .practice.on { display: flex; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; }
    .speech-status.show { display: block; }
    .ke-classify-card { background: #fffbeb; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-classify-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--deep); font-size: .95rem; }
    .ke-classify-item { text-align: center; padding: 18px 14px; background: #fff; border: 2px dashed #f59e0b; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ke-item-icon { font-size: clamp(52px, 12vw, 78px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.15rem, 2.8vw, 1.45rem); font-weight: 800; color: var(--ink); line-height: 1.4; }
    .ke-item-sub { font-size: .92rem; font-weight: 600; color: var(--muted); line-height: 1.4; }
    .ke-buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
    .ke-bucket-btn[data-bucket-id="good"] { border-color: #16a34a; background: #f0fdf4; color: #14532d; }
    .ke-bucket-btn[data-bucket-id="avoid"] { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: #fffbeb; border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .ke-classify-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
      <h1>🤝 พลเมืองดี — หน้าที่และจริยธรรม</h1>
      <span class="badge">ป.4 · สังคมศึกษา</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกแยกสถานการณ์</button>
      </span>
      <p class="hint" id="hintText">แตะคุณลักษณะพลเมืองดีเพื่อฟังคำอธิบาย</p>
      <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶</button>
    </div>
    <div class="stage">
      <div class="learn-panel" id="learn">
        <div class="traits" id="traitsGrid">
          <button type="button" class="trait" data-say="เคารพกฎระเบียบ ปฏิบัติตามกฎหมาย กฎโรงเรียน สัญญาณไฟจราจร">
            <h3>🙏 เคารพกฎระเบียบ</h3>
            <p>ปฏิบัติตามกฎหมาย กฎโรงเรียน สัญญาณไฟจราจร</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="trait" data-say="มีน้ำใจ ช่วยเหลือผู้อื่น แบ่งปัน ไม่รังแกเพื่อน">
            <h3>❤️ มีน้ำใจ</h3>
            <p>ช่วยเหลือผู้อื่น แบ่งปัน ไม่รังแกเพื่อน</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="trait" data-say="รักษาความสะอาด ทิ้งขยะถูกที่ ดูแลสาธารณสมบัติ">
            <h3>🧹 รักษาความสะอาด</h3>
            <p>ทิ้งขยะถูกที่ ดูแลสาธารณสมบัติ</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="trait" data-say="เรียนรู้ตลอดชีวิต ตั้งใจเรียน เปิดรับความรู้ใหม่">
            <h3>📚 เรียนรู้ตลอดชีวิต</h3>
            <p>ตั้งใจเรียน เปิดรับความรู้ใหม่</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="trait" data-say="รักชาติ ภูมิใจในความเป็นไทย ปกป้องสถาบัน">
            <h3>🇹🇭 รักชาติ</h3>
            <p>ภูมิใจในความเป็นไทย ปกป้องสถาบัน</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="trait" data-say="ซื่อสัตย์ ไม่โกง ไม่ขโมย พูดความจริง">
            <h3>⚖️ ซื่อสัตย์</h3>
            <p>ไม่โกง ไม่ขโมย พูดความจริง</p>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
        </div>
        <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
      </div>
      <div class="practice" id="practice">
        <div class="practice-bar">
          <span class="practice-note">แตะเลือกคำตอบหรือกดปุ่มตัวเลข 1–2 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
          <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังเสียง</button>
        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="classifyEngineRoot"></div>
      </div>
    </div>
    <footer class="footer">ตัวชี้วัด <strong>ส 2.1 ป.4/1–5</strong> · คู่เกม <a href="/play/good-citizen">พลเมืองดี (เกม)</a></footer>
  </div>
  <script>
    const MEDIA_SLUG = 'good-citizen-media';
    if (window.KAMPAI) {
      KAMPAI.setSlug(MEDIA_SLUG);
      if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
        try { KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const SCENES = [
      { icon: '🏫', text: 'เพื่อนลืมทำการบ้าน ขอให้คุณให้เขาลอกคำตอบ', choices: [
        { t: 'ให้ลอก เพราะเป็นเพื่อนกัน', ok: false, why: 'การให้ลอก = ไม่ซื่อสัตย์ ทำให้เพื่อนไม่ได้เรียนรู้' },
        { t: 'ปฏิเสธอย่างสุภาพ และชวนทบทวนด้วยกัน', ok: true, why: 'พลเมืองดีซื่อสัตย์และช่วยเหลืออย่างถูกต้อง' },
        { t: 'บอกครูทันทีโดยไม่พูดกับเพื่อน', ok: false, why: 'ควรพูดกับเพื่อนก่อนอย่างสุภาพ' },
      ]},
      { icon: '🚦', text: 'ไฟแดงติดอยู่ แต่ไม่มีรถ คุณจะทำอย่างไร?', choices: [
        { t: 'ข้ามถนนเลย เพราะไม่มีรถ', ok: false, why: 'ต้องเคารพสัญญาณไฟเสมอ เพื่อความปลอดภัย' },
        { t: 'รอไฟเขียวก่อนข้าม', ok: true, why: 'เคารพกฎระเบียบ = พลเมืองดี' },
      ]},
      { icon: '🗑️', text: 'กินขนมเสร็จ มีถังขยะอยู่ไกล', choices: [
        { t: 'ทิ้งขยะลงพื้น แล้วค่อยเก็บทีหลัง', ok: false, why: 'ทำให้สถานที่สกปรก ไม่รักษาความสะอาด' },
        { t: 'หาถังขยะหรือเก็บไว้จนเจอถัง', ok: true, why: 'รักษาความสะอาดสาธารณะ' },
      ]},
      { icon: '👴', text: 'เห็นคุณยายแบกของหนัก คุณจะทำอย่างไร?', choices: [
        { t: 'เดินผ่านไป เพราะไม่รู้จัก', ok: false, why: 'พลเมืองดีมีน้ำใจช่วยเหลือผู้อื่น' },
        { t: 'เสนอช่วยแบกของหรือพาไปหาที่นั่ง', ok: true, why: 'มีน้ำใจช่วยเหลือผู้สูงอายุ' },
      ]},
      { icon: '📖', text: 'เพื่อนชวนเล่นเกมตอนครูสอน', choices: [
        { t: 'เล่นด้วย เพราะสนุก', ok: false, why: 'ไม่เคารพครูและไม่ตั้งใจเรียน' },
        { t: 'ปฏิเสธและฟังครูสอน', ok: true, why: 'ตั้งใจเรียน = พลเมืองดี' },
      ]},
      { icon: '🎨', text: 'เพื่อนวาดภาพบนกำแพงโรงเรียน', choices: [
        { t: 'วาดด้วย เพราะสนุก', ok: false, why: 'ทำลายทรัพย์สินสาธารณะ' },
        { t: 'ห้ามเพื่อนและแจ้งครู', ok: true, why: 'ดูแลรักษาสถานที่ส่วนรวม' },
      ]},
    ];

    const BUCKETS = [
      { id: 'good', label: 'พฤติกรรมพลเมืองดี (ควรทำ)', icon: '✅' },
      { id: 'avoid', label: 'ไม่เหมาะสม (ควรหลีกเลี่ยง)', icon: '⚠️' },
    ];

    const ITEMS = [];
    SCENES.forEach((sc, si) => {
      sc.choices.forEach((c, ci) => {
        ITEMS.push({
          id: 'scene-' + si + '-' + ci,
          icon: sc.icon,
          label: c.t,
          sub: 'สถานการณ์: ' + sc.text,
          bucketId: c.ok ? 'good' : 'avoid',
          reason: c.why,
        });
      });
    });

    let mode = 'learn';
    let classifySession = null;

    function speakText(text, statusId) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.92;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function mountClassifyPractice() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: ITEMS,
        buckets: BUCKETS,
        mode: 'media',
        roundSize: 8,
        onAnswer: function (res) {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      });
    }

    function setMode(nextMode) {
      stopSpeech();
      mode = nextMode === 'practice' ? 'practice' : 'learn';
      const pr = mode === 'practice';
      document.getElementById('modeSeg').querySelectorAll('button').forEach((b) =>
        b.classList.toggle('on', b.dataset.mode === mode));
      document.getElementById('learn').classList.toggle('hide', pr);
      document.getElementById('practice').classList.toggle('on', pr);
      document.getElementById('hintText').textContent = pr
        ? 'พิจารณาการกระทำแล้วแยกให้ถูก — ไม่จับเวลา ไม่เก็บคะแนน'
        : 'แตะคุณลักษณะพลเมืองดีเพื่อฟังคำอธิบาย';
      if (pr) {
        mountClassifyPractice();
      } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
    }

    document.getElementById('modeSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-mode]');
      if (btn) setMode(btn.dataset.mode);
    });

    document.getElementById('traitsGrid').addEventListener('click', (e) => {
      const card = e.target.closest('[data-say]');
      if (card) speakText(card.dataset.say, 'speechStatusLearn');
    });

    document.getElementById('btnSpeakCurrent').onclick = () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speakText((item.sub ? item.sub + ' ' : '') + 'หากเลือกทำคือ ' + item.label, 'speechStatusPractice');
      } else {
        speakText('ฝึกแยกพฤติกรรมพลเมืองดีสำเร็จแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
      }
    };

    document.getElementById('btnBack').onclick = () => {
      stopSpeech();
      if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
      else history.back();
    };

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      totalItems: ITEMS.length,
      bucketsCount: BUCKETS.length,
      classify: classifySession ? classifySession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
