  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />

    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }

<body>
  <div class="shell" id="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>

      <span class="badge">ป.6 · สังคมศึกษา</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกแยกบทบาท</button>
      </span>
      <p class="hint" id="hintText">เลือกหัวข้อ · อ่านและฟังคำอธิบาย</p>
      <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶ เต็มจอ</button>
      <a class="btn btn-ghost" href="/games/social/economics-p6-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
    </div>
    <div class="stage" id="stage">
      <div class="learn" id="learn">
        <div class="pick" id="pick"></div>
        <div class="box" id="box"></div>
        <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
      </div>
      <div class="practice" id="practice">
        <div class="practice-bar">
          <span class="practice-note">แตะเลือกหมวดหรือกดปุ่มตัวเลข 1–3 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
          <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังเสียง</button>
        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="classifyEngineRoot"></div>
      </div>
    </div>
    <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อ ป.6 · ไม่เก็บคะแนน</div>
  </div>
  <script>
    const MEDIA_SLUG = 'economics-p6-media';
    if (window.KAMPAI) {
      KAMPAI.setSlug(MEDIA_SLUG);
      if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
        try { KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const ITEMS = [
      { emoji: '🏭', name: 'ผู้ผลิตที่รับผิดชอบ', body: 'ผลิตสินค้าปลอดภัย ไม่หลอกลวง ดูแลสิ่งแวดล้อม', tip: 'คุณภาพ + จริยธรรม', ex: 'ติดฉลากส่วนประกอบครบ', q: 'ผู้ผลิตที่รับผิดชอบควรทำอย่างไร?', a: 'ผลิตปลอดภัย/ไม่หลอกลวง' },
      { emoji: '🛒', name: 'ผู้บริโภครู้เท่าทัน', body: 'เปรียบเทียบราคา คุณภาพ อ่านฉลาก ไม่เชื่อโฆษณาเกินจริง', tip: 'สิทธิผู้บริโภค', ex: 'เช็กวันหมดอายุก่อนซื้อ', q: 'ผู้บริโภครู้เท่าทันควรทำอะไรก่อนซื้อ?', a: 'เปรียบเทียบ/อ่านฉลาก' },
      { emoji: '🌱', name: 'ใช้ทรัพยากรยั่งยืน', body: 'ใช้พอดี ลด ใช้ซ้ำ รีไซเคิล เลือกวัสดุที่เป็นมิตร', tip: 'ทรัพยากรมีจำกัด', ex: 'พกถุงผ้า ลดพลาสติก', q: 'การใช้ทรัพยากรอย่างยั่งยืนหมายถึง?', a: 'ใช้พอดีและรักษ์โลก' },
      { emoji: '🏦', name: 'ผู้ผลิต·ผู้บริโภค·ธนาคาร·รัฐ', body: 'เกี่ยวข้องกัน: ผลิต→ขาย→ซื้อ→ออม/กู้→ภาษี/บริการรัฐ', tip: 'มองเป็นระบบ', ex: 'ร้านฝากเงินธนาคาร · รัฐเก็บภาษีให้บริการ', q: 'ธนาคารเกี่ยวข้องอย่างไร?', a: 'ออม/กู้/บริการการเงิน' },
      { emoji: '🤝', name: 'รวมกลุ่มเศรษฐกิจท้องถิ่น', body: 'กลุ่มอาชีพ วิสาหกิจชุมชน สหกรณ์ ช่วยเพิ่มอำนาจต่อรอง', tip: 'ร่วมมือกันในชุมชน', ex: 'กลุ่มทอผ้าพื้นบ้าน', q: 'ตัวอย่างการรวมกลุ่มทางเศรษฐกิจ?', a: 'วิสาหกิจชุมชน/สหกรณ์' },
      { emoji: '🧭', name: 'ตัดสินใจทางเศรษฐกิจ', body: 'ชั่งน้ำหนักความต้องการ ความจำเป็น ผลกระทบระยะยาว', tip: 'คิดก่อนซื้อ', ex: 'ออมก่อนซื้อของฟุ่มเฟือย', q: 'ก่อนใช้จ่ายควรถามอะไร?', a: 'จำเป็นหรืออยากได้' },
    ];

    const BUCKETS = [
      { id: 'producer', label: 'ผู้ผลิตที่รับผิดชอบ', icon: '🏭' },
      { id: 'consumer', label: 'ผู้บริโภครู้เท่าทัน', icon: '🛒' },
      { id: 'system', label: 'ธนาคาร รัฐ และกลุ่มชุมชน', icon: '🏦' },
    ];

    const CLASSIFY_ITEMS = [
      { id: 'ec-p1', icon: '🏷️', label: 'ติดฉลากส่วนประกอบและวันหมดอายุให้ชัดเจนครบถ้วน', sub: 'การผลิตสินค้า', bucketId: 'producer', reason: 'ผู้ผลิตที่มีจริยธรรมต้องให้ข้อมูลสินค้าตามจริง ไม่หลอกลวงผู้บริโภค' },
      { id: 'ec-p2', icon: '♻️', label: 'เลือกใช้วัสดุที่เป็นมิตรต่อสิ่งแวดล้อมและบำบัดน้ำเสียก่อนปล่อย', sub: 'ความรับผิดชอบต่อสังคม', bucketId: 'producer', reason: 'ผู้ผลิตที่รับผิดชอบต้องดูแลสิ่งแวดล้อมควบคู่กับการผลิตสินค้าปลอดภัย' },
      { id: 'ec-p3', icon: '🧪', label: 'ผลิตอาหารโดยไม่ใส่สารปนเปื้อนอันตรายเพื่อลดต้นทุน', sub: 'คุณภาพและความปลอดภัย', bucketId: 'producer', reason: 'ผู้ผลิตต้องคำนึงถึงความปลอดภัยของผู้บริโภคเป็นสำคัญ' },
      { id: 'ec-c1', icon: '🔍', label: 'เปรียบเทียบราคา คุณภาพ และเช็กวันหมดอายุก่อนจ่ายเงิน', sub: 'ก่อนตัดสินใจซื้อ', bucketId: 'consumer', reason: 'เป็นหลักการของผู้บริโภครู้เท่าทันเพื่อรักษาสิทธิและคุ้มค่าเงิน' },
      { id: 'ec-c2', icon: '👜', label: 'พกถุงผ้าไปตลาดเพื่อลดขยะพลาสติกและใช้ทรัพยากรอย่างยั่งยืน', sub: 'การบริโภคอย่างยั่งยืน', bucketId: 'consumer', reason: 'ผู้บริโภคช่วยรักษาทรัพยากรด้วยการใช้พอดี ลด ใช้ซ้ำ และรีไซเคิล' },
      { id: 'ec-c3', icon: '🧭', label: 'ถามตัวเองก่อนซื้อว่าจำเป็นจริงหรือไม่ และออมเงินไว้ก่อนใช้จ่าย', sub: 'การตัดสินใจทางเศรษฐกิจ', bucketId: 'consumer', reason: 'เป็นการตัดสินใจเลือกใช้จ่ายอย่างมีเหตุผลและคำนึงถึงผลระยะยาว' },
      { id: 'ec-c4', icon: '📢', label: 'ตรวจสอบข้อเท็จจริง ไม่หลงเชื่อโฆษณาที่อ้างสรรพคุณเกินจริง', sub: 'สิทธิผู้บริโภค', bucketId: 'consumer', reason: 'ผู้บริโภครู้เท่าทันจะไม่ตกเป็นเหยื่อของการโฆษณาเกินจริง' },
      { id: 'ec-s1', icon: '🏦', label: 'รับฝากเงินจากประชาชนและปล่อยสินเชื่อให้ร้านค้าลงทุนขยายกิจการ', sub: 'กลไกการเงินในระบบเศรษฐกิจ', bucketId: 'system', reason: 'เป็นบทบาทหลักของธนาคารในการเชื่อมโยงผู้ออมและผู้ลงทุน' },
      { id: 'ec-s2', icon: '🏛️', label: 'จัดเก็บภาษีเพื่อนำไปสร้างถนน โรงเรียน และบริการสาธารณะ', sub: 'กลไกภาครัฐในระบบเศรษฐกิจ', bucketId: 'system', reason: 'รัฐบาลเก็บภาษีจากระบบเศรษฐกิจมาพัฒนาสาธารณูปโภคและสวัสดิการ' },
      { id: 'ec-s3', icon: '🤝', label: 'รวมกลุ่มทอผ้าพื้นบ้านเป็นวิสาหกิจชุมชนหรือสหกรณ์เพื่อเพิ่มอำนาจต่อรอง', sub: 'เศรษฐกิจท้องถิ่น', bucketId: 'system', reason: 'การรวมกลุ่มทางเศรษฐกิจในชุมชนช่วยให้สมาชิกพึ่งพากันและต่อรองราคาได้ดีขึ้น' },
    ];

    let cur = ITEMS[0];
    let mode = 'learn';
    let classifySession = null;

    function speakText(text, statusId) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.92;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function render() {
      document.getElementById('pick').innerHTML = ITEMS.map((x, i) =>
        '<button type="button" data-i="' + i + '" class="' + (x === cur ? 'on' : '') + '">' + (x.emoji ? x.emoji + ' ' : '') + x.name + '</button>'
      ).join('');
      document.getElementById('box').innerHTML =
        (cur.emoji ? '<div class="emo" aria-hidden="true">' + cur.emoji + '</div>' : '') +
        '<h2>' + cur.name + '</h2>' +
        '<p>' + cur.body + '</p>' +
        (cur.tip ? '<p class="box-tip">💡 ' + cur.tip + '</p>' : '') +
        (cur.ex ? '<div class="ex">ตัวอย่าง: ' + cur.ex + '</div>' : '') +
        '<button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>';
      document.getElementById('btnSpeakLearn').onclick = () => {
        speakText(cur.name + ' ' + cur.body + (cur.ex ? ' ตัวอย่างเช่น ' + cur.ex : ''), 'speechStatusLearn');
      };
    }

    function mountClassifyPractice() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: CLASSIFY_ITEMS,
        buckets: BUCKETS,
        mode: 'media',
        roundSize: 9,
        onAnswer: function (res) {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      });
    }

    function setMode(nextMode) {
      stopSpeech();
      mode = nextMode === 'practice' ? 'practice' : 'learn';
      const pr = mode === 'practice';
      document.getElementById('shell').classList.toggle('mode-practice', pr);
      document.getElementById('modeSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
      document.getElementById('hintText').textContent = pr
        ? 'จำแนกบทบาทผู้ผลิต · ผู้บริโภค · ธนาคาร/รัฐ/ชุมชน — ไม่จับเวลา ไม่เก็บคะแนน'
        : 'เลือกหัวข้อ · อ่านและฟังคำอธิบาย';
      if (pr) {
        mountClassifyPractice();
      } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
    }

    document.getElementById('pick').onclick = (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      stopSpeech();
      cur = ITEMS[+b.dataset.i];
      render();
    };

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };

    document.getElementById('btnSpeakCurrent').onclick = () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speakText(item.label + ' เป็นบทบาทของหมวดใด', 'speechStatusPractice');
      } else {
        speakText('ฝึกจำแนกบทบาททางเศรษฐกิจสำเร็จแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
      }
    };

    document.getElementById('btnBack').onclick = () => {
      stopSpeech();
      if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
      else history.back();
    };

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    render();
    setMode('learn');

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      currentTopic: cur ? cur.name : null,
      totalItems: CLASSIFY_ITEMS.length,
      bucketsCount: BUCKETS.length,
      classify: classifySession ? classifySession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
