<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/social/sukhothai-timeline.html"><meta name="curriculum-indicators" content="ส 4.3 ป.4/1, ส 4.3 ป.4/2, ส 4.3 ป.4/3"><title>ใบงานไทยสุโขทัย ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.1" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.1" rel="stylesheet"></head><body>
<header class="toolbar"><h1>🏛️ ใบงานไทยสุโขทัย</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="order">เรียงเหตุการณ์</option><option value="person">บุคคลสำคัญ</option><option value="significance">ความสำคัญ</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="10">10 ข้อ</option><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.1"></script><script>
const SUK_ITEMS=[
 {type:'order',prompt:'เรียงเหตุการณ์: ก่อตั้งเมือง → ? → มีพระรามาธิบดีที่ 1',flow:['ก่อตั้ง','?','รามาธิบดี I'],answer:'รวมอำนาจ/ขยายเมือง'},
 {type:'order',prompt:'ลำดับการปกครองสุโขทัย',flow:['อิสระ','?','อยุธยา'],answer:'เสื่อม/ถูกรวมเข้ากับอยุธยา'},
 {type:'order',prompt:'เรียง: พ่อขุน → สุโขทัย → ?',flow:['พ่อขุน','สุโขทัย','?'],answer:'อาณาจักรขยาย/ลุ่มน้ำเจ้าพระยา'},
 {type:'person',prompt:'พ่อขุนรามคำแหงมีบทบาทอย่างไร',flow:['พ่อขุน'],answer:'ก่อตั้งและรวมอำนาจเป็นราชอาณาจักรสุโขทัย'},
 {type:'person',prompt:'พระรามาธิบดีที่ 1 มีชื่อเดิมว่า',flow:['รามาธิบดี I'],answer:'พ่อขุนรามคำแหง'},
 {type:'person',prompt:'ใครเป็นผู้ก่อตั้งเมืองสุโขทัย',flow:['ผู้ก่อตั้ง'],answer:'พ่อขุนรามคำแหง (และพ่อขุนศรีอินทร)'},
 {type:'significance',prompt:'อักษรไทยเริ่มใช้ในสมัยใด',flow:['อักษรไทย'],answer:'สมัยสุโขทัย (พ.ศ. 1826)'},
 {type:'significance',prompt:'หลักประชาธิปไตยในศิลาจารึก 1 คือ',flow:['ศิลาจารึก'],answer:'เสรีภาพ/ความสุขของประชาชน (ตามจารึก)'},
 {type:'significance',prompt:'ทำไมสุโขทัยจึงสำคัญต่อประวัติศาสตร์ไทย',flow:['รากเหง้า'],answer:'เป็นราชอาณาจักรไทยรัฐแรก/ต้นกำเนิดอารยธรรมไทย'},
 {type:'significance',prompt:'ลักษณะเมืองสุโขทัยที่เห็นได้',flow:['เมือง'],answer:'มีคูเมือง กำแพง วัดโบราณ เช่น วัดมหาธาตุ'},
 {type:'person',prompt:'พ่อขุนศรีอินทรมีบทบาท',flow:['ศรีอินทร'],answer:'ร่วมก่อตั้งและปกครองช่วงแรก'},
 {type:'order',prompt:'เหตุการณ์ใดแสดงการขยายอำนาจ',flow:['สงคราม','?','รวมเมือง'],answer:'ขยายอำนาจสู่ลุ่มน้ำเจ้าพระยา'}
];
window.WORKSHEET_CONFIG={icon:'🏛️',title:'ใบงานไทยสุโขทัย',subject:'สังคมศึกษา',gradeLabel:'ป.4–6',mediaLabel:'สุโขทัย',sourceMediaUrl:'/games/social/sukhothai-timeline.html',indicators:['ส 4.3 ป.4/1','ส 4.3 ป.4/2','ส 4.3 ป.4/3'],directions:'เรียงเหตุการณ์ ระบุบุคคลสำคัญ และอธิบายความสำคัญของสุโขทัย',getItems(topic){return topic==='mixed'?SUK_ITEMS:SUK_ITEMS.filter(i=>i.type===topic);},buildSukWork(item){if(item.type==='order')return{line1:'เชื่อมเหตุการณ์: '+item.flow.join(' → '),line2:'ตอบ: '+item.answer};if(item.type==='person')return{line1:'บุคคล/บทบาท',line2:item.answer};return{line1:'ความสำคัญทางประวัติศาสตร์',line2:item.answer};},renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;const w=this.buildSukWork(item);return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="cycle-flow">'+item.flow.map((step,i)=>'<div class="cycle-step">'+e(step)+'</div>'+(i<item.flow.length-1?'<span class="cycle-arrow">→</span>':'')).join('')+'</div></div><div class="q-work-block"><div class="reason-line"><span class="work-fill">'+e(w.line1)+'</span></div><div class="reason-line"><span class="work-fill">'+e(w.line2)+'</span></div></div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.175.1"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.1"></script></body></html>
