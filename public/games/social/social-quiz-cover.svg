<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="0.55" stop-color="#5b21b6"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="180" y="600" font-size="240" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🗺️</text>
  <text x="1110" y="170" font-size="200" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🏛️</text>

  <g transform="translate(640,118)">
    <rect x="-190" y="-26" width="380" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · สังคมศึกษา</text>
  </g>
  <text x="640" y="290" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">สังคมรอบรู้</text>
  <text x="640" y="378" font-size="38" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">จังหวัดอยู่ภาคไหน? เหตุการณ์อยู่ยุคใด?</text>

  <!-- example: item + region chips -->
  <g transform="translate(640,520)">
    <text x="-300" y="0" font-size="86" text-anchor="middle" dominant-baseline="middle">🏔️</text>
    <g dominant-baseline="middle" text-anchor="middle" font-size="30" font-weight="700">
      <rect x="-160" y="-40" width="160" height="80" rx="18" fill="url(#gold)" stroke="#fff7e0" stroke-width="4"/><text x="-80" y="4" fill="#0f172a">ภาคเหนือ</text>
      <rect x="10" y="-40" width="150" height="80" rx="18" fill="#f8fafc"/><text x="85" y="4" fill="#1e293b">ภาคกลาง</text>
      <rect x="170" y="-40" width="150" height="80" rx="18" fill="#f8fafc"/><text x="245" y="4" fill="#1e293b">ภาคใต้</text>
    </g>
  </g>
  <g transform="translate(640,642)">
    <rect x="-220" y="-24" width="440" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="24" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">🔥 จังหวัด→ภาค · ยุคประวัติศาสตร์ · แข่งเร็ว · ออนไลน์</text>
  </g>
</svg>
