<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const MAP_ITEMS=[

 {type:'region',prompt:'กรุงเทพมหานครอยู่ภาคใด',place:'กรุงเทพฯ',answer:'ภาคกลาง',s1:'หากรุงเทพฯ',s2:'อยู่ตอนกลาง',s3:'ภาคกลาง'},

 {type:'direction',prompt:'ภาคใต้ของไทยอยู่ทางทิศใดของกรุงเทพฯ',place:'ภาคใต้',answer:'ทิศใต้',s1:'หาตำแหน่งกรุงเทพฯ',s2:'หาภาคใต้สัมพันธ์กัน',s3:'ทิศใต้'},
 {type:'apply',prompt:'อ่านแผนที่: จังหวัดใกล้บ้านเราอยู่ภาคใด',place:'ชุมชน',answer:'ตอบตามจังหวัดจริงของนักเรียน',s1:'ระบุจังหวัดบ้านเกิด',s2:'หาบนแผนที่',s3:'ตอบภาคจริง'},

window.WORKSHEET_CONFIG={

  getItems(topic){return topic==='mixed'?MAP_ITEMS:MAP_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const tags=item.type==='region'
      ?['1 หาตำแหน่ง','2 ดูภาค','3 ตอบ']
      :item.type==='direction'
        ?['1 เข็มทิศ','2 ทิศสัมพันธ์','3 สรุป']
        :['1 อ่านแผนที่','2 ใช้สัญลักษณ์','3 สรุป'];
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="classify-grid"><div class="classify-box">เหนือ</div><div class="classify-box">กลาง</div><div class="classify-box">อีสาน</div><div class="classify-box">ใต้</div></div><div class="q-context">'+e(item.place)+'</div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">'+tags[0]+'</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[1]+'</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">'+tags[2]+'</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
