<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>หน้าที่พลเมือง ป.ต้น — สื่อการสอน — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #1d4ed8; --line: #bfdbfe; --muted: #475569; --ok: #15803d; --bad: #b91c1c; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #bfdbfe, #e0f2fe); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #1e40af, var(--deep)); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 140px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .pick button:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; font-size: .9rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: var(--deep); font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
    .shell.mode-practice .learn { display: none; }
    .shell.mode-practice .practice { display: flex; }
    .pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick button { font-family: inherit; font-weight: 800; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: #fff; cursor: pointer; color: var(--deep); min-height: 44px; font-size: .95rem; }
    .pick button.on { background: var(--deep); color: #fff; border-color: var(--deep); }
    .box { background: #f8fafc; border: 2px solid var(--line); border-radius: 16px; padding: 18px; font-weight: 600; line-height: 1.6; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .box h2 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .emo { font-size: 3rem; line-height: 1; }
    .box-tip { color: var(--muted); font-size: .95rem; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; }
    .speech-status.show { display: block; }
    .ke-classify-card { background: #f8fafc; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-classify-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--deep); font-size: .95rem; }
    .ke-classify-item { text-align: center; padding: 18px 14px; background: #fff; border: 2px dashed #60a5fa; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ke-item-icon { font-size: clamp(52px, 12vw, 78px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.15rem, 2.8vw, 1.45rem); font-weight: 800; color: var(--ink); line-height: 1.4; }
    .ke-item-sub { font-size: .92rem; font-weight: 600; color: var(--muted); line-height: 1.4; }
    .ke-buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
    .ke-bucket-btn[data-bucket-id="good"] { border-color: #16a34a; background: #f0fdf4; color: #14532d; }
    .ke-bucket-btn[data-bucket-id="avoid"] { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: #f8fafc; border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .ke-classify-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
      <h1>🏛️ หน้าที่พลเมือง (ป.ต้น)</h1>
      <span class="badge">ป.1–3 · สังคม</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกแยกหน้าที่</button>
      </span>
      <p class="hint" id="hintText">เลือกหัวข้อหน้าที่พลเมืองเพื่ออ่านและฟังคำอธิบาย</p>
      <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶ เต็มจอ</button>
      <a class="btn btn-ghost" href="/games/social/citizen-duties-p123-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
    </div>
    <div class="stage" id="stage">
      <div class="learn" id="learn">
        <div class="pick" id="pick"></div>
        <div class="box" id="box"></div>
        <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
      </div>
      <div class="practice" id="practice">
        <div class="practice-bar">
          <span class="practice-note">แตะเลือกหมวดหรือกดปุ่มตัวเลข 1–2 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
          <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังเสียง</button>
        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="classifyEngineRoot"></div>
      </div>
    </div>
    <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
  </div>
  <script>
    const MEDIA_SLUG = 'citizen-duties-p123-media';
    if (window.KAMPAI) {
      KAMPAI.setSlug(MEDIA_SLUG);
      if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
        try { KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const ITEMS = [
      { emoji: '🇹🇭', name: 'เคารพชาติ', body: 'ยืนตรงเคารพธงชาติ ร้องเพลงชาติ', tip: 'ถอดหมวกตอนเคารพธง', q: 'ตอนเพลงชาติควรทำอย่างไร?', a: 'ยืนตรงเคารพ' },
      { emoji: '👨‍🏫', name: 'เชื่อฟังครู', body: 'ฟังคำสั่งครูในห้องและนอกห้อง', tip: 'ถามเมื่อไม่เข้าใจอย่างสุภาพ', q: 'เมื่อครูอธิบายควรทำอะไร?', a: 'ตั้งใจฟัง' },
      { emoji: '🤝', name: 'ช่วยเหลือ', body: 'ช่วยเพื่อน แบ่งปัน ไม่รังแก', tip: 'เห็นเพื่อนล้ม ช่วยพยุง', q: 'พลเมืองดีทำอย่างไรกับเพื่อน?', a: 'ช่วยเหลือ / ไม่รังแก' },
      { emoji: '🗑️', name: 'รักษาความสะอาด', body: 'ทิ้งขยะลงถัง ไม่ขีดเขียนโต๊ะ', tip: 'แยกขยะถ้ามีถังแยก', q: 'ขยะควรทิ้งที่ไหน?', a: 'ถังขยะ' },
      { emoji: '📢', name: 'ใช้สิทธิอย่างถูก', body: 'เข้าคิว พูดสุภาพ แสดงความเห็นโดยไม่ตะโกน', tip: 'ยกมือก่อนพูดในห้อง', q: 'อยากพูดในห้องควรทำอย่างไร?', a: 'ยกมือ' },
      { emoji: '🏠', name: 'หน้าที่ที่บ้าน', body: 'ช่วยงานบ้านเล็ก ๆ ตามวัย', tip: 'เก็บของเล่น กวาดบ้าน', q: 'หน้าที่ที่บ้านของเด็กตัวอย่าง?', a: 'ช่วยงานบ้าน / เก็บของ' },
    ];

    const BUCKETS = [
      { id: 'good', label: 'พลเมืองดี (ควรทำ)', icon: '✅' },
      { id: 'avoid', label: 'ไม่เหมาะสม (ควรหลีกเลี่ยง)', icon: '⚠️' },
    ];

    const CLASSIFY_ITEMS = [
      { id: 'cd-1', icon: '🇹🇭', label: 'ยืนตรงเคารพธงชาติและถอดหมวกอย่างเรียบร้อย', sub: 'หน้าที่: เคารพชาติ', bucketId: 'good', reason: 'การยืนตรงเคารพธงชาติแสดงความเคารพและความเป็นระเบียบของพลเมืองดี' },
      { id: 'cd-2', icon: '🇹🇭', label: 'วิ่งเล่นคุยเสียงดังระหว่างร้องเพลงชาติ', sub: 'หน้าที่: เคารพชาติ', bucketId: 'avoid', reason: 'ควรหยุดยืนตรงสงบนิ่งเพื่อแสดงความเคารพธงชาติ' },
      { id: 'cd-3', icon: '👨‍🏫', label: 'ตั้งใจฟังครูอธิบายและยกมือถามอย่างสุภาพ', sub: 'หน้าที่: เชื่อฟังครู', bucketId: 'good', reason: 'การตั้งใจฟังและถามอย่างสุภาพช่วยให้เข้าใจบทเรียนและเคารพผู้สอน' },
      { id: 'cd-4', icon: '👨‍🏫', label: 'พูดแทรกหรือเล่นของเล่นขณะที่ครูกำลังสอน', sub: 'หน้าที่: เชื่อฟังครู', bucketId: 'avoid', reason: 'รบกวนสมาธิของเพื่อนและไม่เคารพครูในห้องเรียน' },
      { id: 'cd-5', icon: '🤝', label: 'เห็นเพื่อนหกล้มจึงรีบช่วยพยุงและแบ่งปันน้ำใจ', sub: 'หน้าที่: ช่วยเหลือ', bucketId: 'good', reason: 'พลเมืองดีมีน้ำใจ ช่วยเหลือและไม่รังแกผู้อื่น' },
      { id: 'cd-6', icon: '🤝', label: 'หัวเราะเยาะและล้อเลียนเพื่อนที่ทำผิดพลาด', sub: 'หน้าที่: ช่วยเหลือ', bucketId: 'avoid', reason: 'การล้อเลียนทำให้เพื่อนเสียใจ พลเมืองดีควรให้กำลังใจและช่วยเหลือ' },
      { id: 'cd-7', icon: '🗑️', label: 'เก็บขยะไปทิ้งลงถังและแยกขยะตามประเภท', sub: 'หน้าที่: รักษาความสะอาด', bucketId: 'good', reason: 'ช่วยกันดูแลห้องเรียนและส่วนรวมให้สะอาดน่าอยู่' },
      { id: 'cd-8', icon: '🗑️', label: 'ขีดเขียนข้อความบนโต๊ะเรียนและทิ้งเศษกระดาษลงพื้น', sub: 'หน้าที่: รักษาความสะอาด', bucketId: 'avoid', reason: 'ทำให้ทรัพย์สินส่วนรวมสกปรกและเสียหาย' },
      { id: 'cd-9', icon: '📢', label: 'เข้าแถวต่อคิวตามลำดับและพูดจาสุภาพ', sub: 'หน้าที่: ใช้สิทธิอย่างถูก', bucketId: 'good', reason: 'การใช้สิทธิอย่างถูกต้องต้องเคารพสิทธิของผู้อื่นด้วยการเข้าคิวและพูดสุภาพ' },
      { id: 'cd-10', icon: '📢', label: 'ตะโกนแย่งพูดและแซงคิวเพื่อนที่ต่อแถวอยู่ก่อน', sub: 'หน้าที่: ใช้สิทธิอย่างถูก', bucketId: 'avoid', reason: 'การแซงคิวและตะโกนเป็นการละเมิดกติกาและสิทธิของผู้อื่น' },
      { id: 'cd-11', icon: '🏠', label: 'ช่วยเก็บของเล่นเข้าที่และช่วยกวาดบ้านตามวัย', sub: 'หน้าที่: หน้าที่ที่บ้าน', bucketId: 'good', reason: 'การช่วยงานบ้านฝึกความรับผิดชอบและแบ่งเบาภาระครอบครัว' },
      { id: 'cd-12', icon: '🏠', label: 'เล่นของเล่นเสร็จแล้วทิ้งเกลื่อนกลาดไม่ยอมเก็บ', sub: 'หน้าที่: หน้าที่ที่บ้าน', bucketId: 'avoid', reason: 'อาจทำให้คนในบ้านสะดุดล้มและขาดความรับผิดชอบในหน้าที่ของตนเอง' },
    ];

    let cur = ITEMS[0];
    let mode = 'learn';
    let classifySession = null;

    function speakText(text, statusId) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.92;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function render() {
      document.getElementById('pick').innerHTML = ITEMS.map((x, i) =>
        '<button type="button" data-i="' + i + '" class="' + (x === cur ? 'on' : '') + '">' + (x.emoji ? x.emoji + ' ' : '') + x.name + '</button>'
      ).join('');
      document.getElementById('box').innerHTML =
        (cur.emoji ? '<div class="emo" aria-hidden="true">' + cur.emoji + '</div>' : '') +
        '<h2>' + cur.name + '</h2>' +
        '<p>' + cur.body + '</p>' +
        (cur.tip ? '<p class="box-tip">💡 ' + cur.tip + '</p>' : '') +
        '<button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>';
      document.getElementById('btnSpeakLearn').onclick = () => {
        speakText(cur.name + ' ' + cur.body + (cur.tip ? ' เคล็ดลับ ' + cur.tip : ''), 'speechStatusLearn');
      };
    }

    function mountClassifyPractice() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: CLASSIFY_ITEMS,
        buckets: BUCKETS,
        mode: 'media',
        roundSize: 8,
        onAnswer: function (res) {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      });
    }

    function setMode(nextMode) {
      stopSpeech();
      mode = nextMode === 'practice' ? 'practice' : 'learn';
      const pr = mode === 'practice';
      document.getElementById('shell').classList.toggle('mode-practice', pr);
      document.getElementById('modeSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
      document.getElementById('hintText').textContent = pr
        ? 'พิจารณาการกระทำแล้วแยกให้ถูก — ไม่จับเวลา ไม่เก็บคะแนน'
        : 'เลือกหัวข้อหน้าที่พลเมืองเพื่ออ่านและฟังคำอธิบาย';
      if (pr) {
        mountClassifyPractice();
      } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
    }

    document.getElementById('pick').onclick = (e) => {
      const b = e.target.closest('[data-i]');
      if (!b) return;
      stopSpeech();
      cur = ITEMS[+b.dataset.i];
      render();
    };

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };

    document.getElementById('btnSpeakCurrent').onclick = () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speakText((item.sub ? item.sub + ' ' : '') + item.label + ' ควรทำหรือไม่เหมาะสม', 'speechStatusPractice');
      } else {
        speakText('ฝึกแยกหน้าที่พลเมืองสำเร็จแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
      }
    };

    document.getElementById('btnBack').onclick = () => {
      stopSpeech();
      if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
      else history.back();
    };

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    render();
    setMode('learn');

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      currentTopic: cur ? cur.name : null,
      totalItems: CLASSIFY_ITEMS.length,
      bucketsCount: BUCKETS.length,
      classify: classifySession ? classifySession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
