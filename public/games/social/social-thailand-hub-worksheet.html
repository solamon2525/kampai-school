const ITEMS=[{"type":"map","prompt":"จังหวัดในภาคตะวันออกเฉียงเหนือข้อใด","choices":["ขอนแก่น","เชียงใหม่","ภูเก็ต"],"answer":"ขอนแก่น"},{"type":"map","prompt":"ภาคใต้ติดทะเลสำคัญข้อใด","choices":["อันดามัน/อ่าวไทย","ทะเลสาบแคสเปียน","ทะเลเหนือ"],"answer":"อันดามัน/อ่าวไทย"},{"type":"history","prompt":"สุโขทัยมีความสำคัญอย่างไร","text":"เป็นราชอาณาจักรไทยช่วงแรก ๆ ที่สำคัญ","answer":"จุดเริ่มต้นประวัติศาสตร์ไทยสำคัญ"},{"type":"history","prompt":"เรียงยุคอย่างง่าย","text":"สุโขทัย → อยุธยา → รัตนโกสินทร์","answer":"สุโขทัย อยุธยา รัตนโกสินทร์"},{"type":"citizen","prompt":"พฤติกรรมพลเมืองดีข้อใด","choices":["ทิ้งขยะลงถัง","ขีดเขียนฝาผนัง","แย่งคิว"],"answer":"ทิ้งขยะลงถัง"},{"type":"citizen","prompt":"เมื่อพบของมีค่าในโรงเรียนควรทำอย่างไร","choices":["ส่งครู/ประกาศหาเจ้าของ","เก็บไว้เอง","ทิ้ง"],"answer":"ส่งครู/ประกาศหาเจ้าของ"},{"type":"map","prompt":"กรุงเทพฯ อยู่ในภาคใด","choices":["กลาง","เหนือ","ใต้"],"answer":"กลาง"},{"type":"map","prompt":"แม่น้ำเจ้าพระยาสำคัญอย่างไร","text":"เป็นแม่น้ำสายหลักของภาคกลาง","answer":"สายหลักภาคกลาง / คมนาคม เกษตร"},{"type":"history","prompt":"วันสำคัญทางประวัติศาสตร์ที่รู้จัก","text":"วันจักรี / วันสงกรานต์ (วัฒนธรรม)","answer":"ระบุได้อย่างน้อย 1 วันพร้อมความหมาย"},{"type":"citizen","prompt":"สิทธิและหน้าที่ของนักเรียน","text":"มีสิทธิ์เรียนและมีหน้าที่ตั้งใจเรียน","answer":"เรียนรู้อย่างตั้งใจ เคารพกฎ"},{"type":"map","prompt":"ภาคเหนือมีลักษณะภูมิประเทศเด่น","choices":["ภูเขา/หุบเขา","ทะเลทราย","ธารน้ำแข็ง"],"answer":"ภูเขา/หุบเขา"},{"type":"history","prompt":"ทำไมต้องเรียนรู้ประวัติศาสตร์ท้องถิ่น","text":"เข้าใจรากเหง้าและรักบ้านเกิด","answer":"รู้ที่มาของชุมชน/รักท้องถิ่น"},{"type":"citizen","prompt":"การอยู่ร่วมกันในห้องเรียน","choices":["รับฟังเพื่อน","เยาะเย้ย","แย่งของ"],"answer":"รับฟังเพื่อน"},{"type":"map","prompt":"ชี้จังหวัดของโรงเรียนบนแผนที่ความคิด","text":"เขียนชื่ออำเภอ/จังหวัดตนเอง","answer":"ระบุถิ่นที่อยู่ถูกต้อง"},{"type":"history","prompt":"บุคคลสำคัญในประวัติศาสตร์ไทยที่รู้จัก","text":"เช่น พ่อขุนรามคำแหง","answer":"ระบุชื่อ+ผลงานสั้น ๆ"},{"type":"citizen","prompt":"เมื่อเห็นเพื่อนถูกรังแกควรทำอย่างไร","choices":["บอกครู/ช่วยเหลืออย่างปลอดภัย","นิ่งเฉยตลอด","ร่วมรังแก"],"answer":"บอกครู/ช่วยเหลืออย่างปลอดภัย"},{"type":"map","prompt":"ทรัพยากรสำคัญของท้องถิ่นตนเอง","text":"เช่น ข้าว ยางพารา การท่องเที่ยว","answer":"ระบุทรัพยากรท้องถิ่น+เหตุผล"},{"type":"history","prompt":"เชื่อมโยงอดีต–ปัจจุบัน","text":"ตลาดเก่าของชุมชนยังมีอยู่","answer":"อธิบายสิ่งที่เปลี่ยน/คงเดิม"}];
