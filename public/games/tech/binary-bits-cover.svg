<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/><stop offset="0.55" stop-color="#2e1065"/><stop offset="1" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lit" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff7cc"/><stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="bulbglow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.8"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="600" font-size="200" opacity="0.06" text-anchor="middle" dominant-baseline="middle">💡</text>
  <text x="1130" y="170" font-size="150" opacity="0.07" text-anchor="middle" dominant-baseline="middle" fill="#a78bfa" font-weight="800">01</text>

  <g transform="translate(640,104)">
    <rect x="-240" y="-26" width="480" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เทคโนโลยี (วิทยาการคำนวณ) ป.5–6</text>
  </g>
  <text x="640" y="258" font-size="98" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">ถอดรหัสเลขฐานสอง</text>
  <text x="640" y="332" font-size="32" font-weight="700" fill="#c4b5fd" text-anchor="middle" dominant-baseline="middle">หลอดไฟ 0/1 ↔ เลขฐานสิบ — การแทนข้อมูลในคอมพิวเตอร์</text>

  <!-- หลอดบิต 1 1 0 1 = 13 -->
  <g transform="translate(640,500)" text-anchor="middle">
    <!-- bit 8 (on) -->
    <g transform="translate(-285,0)">
      <rect x="-52" y="-58" width="104" height="116" rx="16" fill="url(#lit)" stroke="#fde047" stroke-width="3" filter="url(#bulbglow)"/>
      <text x="0" y="-6" font-size="48">💡</text><text x="0" y="40" font-size="36" font-weight="800" fill="#7c2d12">1</text>
      <text x="0" y="92" font-size="30" font-weight="700" fill="#c4b5fd">8</text>
    </g>
    <!-- bit 4 (on) -->
    <g transform="translate(-95,0)">
      <rect x="-52" y="-58" width="104" height="116" rx="16" fill="url(#lit)" stroke="#fde047" stroke-width="3" filter="url(#bulbglow)"/>
      <text x="0" y="-6" font-size="48">💡</text><text x="0" y="40" font-size="36" font-weight="800" fill="#7c2d12">1</text>
      <text x="0" y="92" font-size="30" font-weight="700" fill="#c4b5fd">4</text>
    </g>
    <!-- bit 2 (off) -->
    <g transform="translate(95,0)">
      <rect x="-52" y="-58" width="104" height="116" rx="16" fill="rgba(255,255,255,0.07)" stroke="#7c3aed" stroke-width="3"/>
      <text x="0" y="-6" font-size="44" opacity="0.5">⚫</text><text x="0" y="40" font-size="36" font-weight="800" fill="#a78bfa">0</text>
      <text x="0" y="92" font-size="30" font-weight="700" fill="#a78bfa">2</text>
    </g>
    <!-- bit 1 (on) -->
    <g transform="translate(285,0)">
      <rect x="-52" y="-58" width="104" height="116" rx="16" fill="url(#lit)" stroke="#fde047" stroke-width="3" filter="url(#bulbglow)"/>
      <text x="0" y="-6" font-size="48">💡</text><text x="0" y="40" font-size="36" font-weight="800" fill="#7c2d12">1</text>
      <text x="0" y="92" font-size="30" font-weight="700" fill="#c4b5fd">1</text>
    </g>
  </g>

  <g transform="translate(640,628)">
    <rect x="-170" y="-30" width="340" height="58" rx="16" fill="#0f0a1e" opacity="0.7" stroke="#7c3aed" stroke-width="2"/>
    <text x="0" y="2" font-size="34" font-weight="800" fill="#fde047" text-anchor="middle" dominant-baseline="central" font-family="'Fredoka One',cursive">1101 = 13</text>
  </g>

  <g transform="translate(640,684)">
    <text x="0" y="2" font-size="22" font-weight="700" fill="#c4b5fd" text-anchor="middle" dominant-baseline="middle">แตะหลอดให้ผลรวมตรงเป้า · หรืออ่านบิตเลือกค่าที่ถูก</text>
  </g>
</svg>
