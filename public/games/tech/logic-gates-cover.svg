<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/><stop offset="0.55" stop-color="#022c22"/><stop offset="1" stop-color="#021410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lit" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff7cc"/><stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="bulbglow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#fbbf24" flood-opacity="0.85"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="600" font-size="190" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🔌</text>
  <text x="1130" y="170" font-size="160" opacity="0.06" text-anchor="middle" dominant-baseline="middle">💡</text>

  <g transform="translate(640,104)">
    <rect x="-240" y="-26" width="480" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เทคโนโลยี (วิทยาการคำนวณ) ป.6</text>
  </g>
  <text x="640" y="258" font-size="112" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">ตรรกะสวิตช์ไฟ</text>
  <text x="640" y="334" font-size="32" font-weight="700" fill="#6ee7b7" text-anchor="middle" dominant-baseline="middle">สวิตช์ → เกตตรรกะ → หลอดไฟ : ทำนายว่าหลอดไฟติดไหม?</text>

  <!-- วงจร: A,B → AND → 💡 -->
  <g stroke-linejoin="round">
    <!-- wires -->
    <g fill="none" stroke="#10b981" stroke-width="6" opacity="0.8">
      <path d="M 408,452 H 500 V 500 H 545"/>
      <path d="M 408,604 H 500 V 528 H 545"/>
      <path d="M 705,514 H 800"/>
    </g>
    <!-- switch A=1 (on) -->
    <g transform="translate(320,452)">
      <rect x="-88" y="-44" width="176" height="88" rx="16" fill="#fbbf24" stroke="#fde047" stroke-width="4" filter="url(#sh)"/>
      <text x="0" y="-6" font-size="38" font-weight="800" fill="#422006" text-anchor="middle" dominant-baseline="central">A = 1</text>
      <text x="0" y="26" font-size="20" font-weight="600" fill="#7c4a06" text-anchor="middle" dominant-baseline="central">เปิด</text>
    </g>
    <!-- switch B=1 (on) -->
    <g transform="translate(320,604)">
      <rect x="-88" y="-44" width="176" height="88" rx="16" fill="#fbbf24" stroke="#fde047" stroke-width="4" filter="url(#sh)"/>
      <text x="0" y="-6" font-size="38" font-weight="800" fill="#422006" text-anchor="middle" dominant-baseline="central">B = 1</text>
      <text x="0" y="26" font-size="20" font-weight="600" fill="#7c4a06" text-anchor="middle" dominant-baseline="central">เปิด</text>
    </g>
    <!-- gate AND -->
    <g transform="translate(625,514)">
      <rect x="-80" y="-52" width="160" height="104" rx="16" fill="#065f46" stroke="#34d399" stroke-width="5" filter="url(#sh)"/>
      <text x="0" y="0" font-size="46" font-weight="800" fill="#d1fae5" text-anchor="middle" dominant-baseline="central">AND</text>
    </g>
    <!-- bulb ON -->
    <g transform="translate(862,514)">
      <circle cx="0" cy="0" r="58" fill="url(#lit)" stroke="#fde047" stroke-width="5" filter="url(#bulbglow)"/>
      <text x="0" y="2" font-size="64" text-anchor="middle" dominant-baseline="central">💡</text>
    </g>
  </g>

  <g transform="translate(640,672)">
    <rect x="-330" y="-24" width="660" height="48" rx="24" fill="#10b981" opacity="0.20"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">AND · OR · NOT · XOR · NAND · NOR — อ่านวงจรแล้วทายผล</text>
  </g>
</svg>
