<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f2d1a"/><stop offset="0.55" stop-color="#1c1310"/><stop offset="1" stop-color="#0a0705"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="600" font-size="200" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🐞</text>
  <text x="1130" y="170" font-size="170" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🔍</text>

  <g transform="translate(640,104)">
    <rect x="-240" y="-26" width="480" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#fde68a" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เทคโนโลยี (วิทยาการคำนวณ) ป.4–6</text>
  </g>
  <text x="640" y="260" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">พิชิตบั๊ก</text>
  <text x="640" y="336" font-size="32" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">หาคำสั่งที่ผิด แก้ให้หุ่นถึงธง — การตรวจหาข้อผิดพลาด</text>

  <!-- ตาราง 4×4 + หุ่นชนกำแพง 💥 -->
  <g transform="translate(372,392)">
    <g stroke="#57534e" stroke-width="2">
      <rect x="0" y="0" width="320" height="320" rx="14" fill="#1c1310"/>
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
    </g>
    <!-- กำแพง -->
    <rect x="164" y="84" width="72" height="72" rx="10" fill="#7c2d12" stroke="#92400e" stroke-width="2"/>
    <text x="200" y="124" font-size="40" text-anchor="middle" dominant-baseline="central">🧱</text>
    <!-- เส้นทางบั๊ก (วิ่งไปชนกำแพง) -->
    <g fill="none" stroke="#f87171" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16" opacity="0.9">
      <path d="M40,280 L40,120 L150,120"/>
    </g>
    <!-- ธง มุมขวาบน -->
    <rect x="244" y="4" width="72" height="72" rx="10" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <text x="280" y="44" font-size="42" text-anchor="middle" dominant-baseline="central">🏁</text>
    <!-- หุ่น + ระเบิดชน -->
    <text x="170" y="120" font-size="50" text-anchor="middle" dominant-baseline="central" filter="url(#sh)">🤖</text>
    <text x="208" y="96" font-size="44" text-anchor="middle" dominant-baseline="central">💥</text>
  </g>

  <!-- โปรแกรมที่มีบั๊ก: แตะคำสั่งผิดเพื่อแก้ -->
  <g transform="translate(760,402)">
    <text x="0" y="-18" font-size="24" font-weight="700" fill="#fcd34d">โปรแกรม (มีบั๊ก)</text>
    <g font-size="40" font-weight="800" fill="#fff">
      <g><rect x="0" y="0" width="62" height="62" rx="12" fill="url(#amber)" stroke="#78350f" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">⬆️</text></g>
      <g transform="translate(74,0)"><rect width="62" height="62" rx="12" fill="#ef4444" stroke="#991b1b" stroke-width="3"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">⬇️</text><text x="31" y="-16" font-size="26" text-anchor="middle">🐞</text></g>
      <g transform="translate(148,0)"><rect width="62" height="62" rx="12" fill="url(#amber)" stroke="#78350f" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">➡️</text></g>
      <g transform="translate(222,0)"><rect width="62" height="62" rx="12" fill="url(#amber)" stroke="#78350f" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">➡️</text></g>
    </g>
    <text x="0" y="104" font-size="22" font-weight="700" fill="#fca5a5">👆 แตะคำสั่งสีแดงเพื่อหมุนแก้ทิศ</text>
  </g>

  <g transform="translate(640,676)">
    <rect x="-300" y="-24" width="600" height="48" rx="24" fill="#f59e0b" opacity="0.20"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">รันดูว่าบั๊กอยู่ไหน · แตะหมุนเปลี่ยนทิศ · แก้แล้วถึงธง</text>
  </g>
</svg>
