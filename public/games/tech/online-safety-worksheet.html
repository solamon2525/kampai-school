<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/tech/online-safety-media.html"><meta name="curriculum-indicators" content="วท 4.2 ป.4/1, วท 4.2 ป.4/2"><title>ใบงานความปลอดภัยออนไลน์ ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.181.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}

.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>

<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const ITEMS=[

 {type:'privacy',prompt:'ข้อมูลใดไม่ควรแชร์ออนไลน์',focus:'ข้อมูลส่วนตัว',answer:'ที่อยู่ เบอร์โทร รหัสผ่าน',step1:'ข้อมูลส่วนตัว',step2:'อย่าโพสต์สาธารณะ',step3:'เก็บเป็นความลับ'},
 {type:'privacy',prompt:'ถ้าคนแปลกหน้าขอรูปบ้าน ควรทำอย่างไร',focus:'ข้อมูลส่วนตัว',answer:'ไม่ส่ง และบอกผู้ใหญ่',step1:'ไม่รู้จัก',step2:'อย่าส่งรูป',step3:'บอกผู้ใหญ่'},

];
const SKILL={password:'รหัสผ่าน',privacy:'ข้อมูลส่วนตัว',link:'ลิงก์/อนุญาต'};
window.WORKSHEET_CONFIG={
  worksheetKey:'online-safety',
  icon:'🛡️',title:'ใบงานความปลอดภัยออนไลน์',subject:'เทคโนโลยี',gradeLabel:'ป.4–6',mediaLabel:'ความปลอดภัยออนไลน์',

  directions:'ติ๊กหัวข้อ → อ่านสถานการณ์ → ลงเหตุผลทีละขั้นแล้วสรุปคำตอบ',
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ รหัสผ่าน</div><div class="tick-box">□ ข้อมูลส่วนตัว</div><div class="tick-box">□ ลิงก์แปลก</div><div class="tick-box">□ ขออนุญาต</div></div>'

      +'<div class="step-row"><span class="step-tag">1 สถานการณ์</span><div class="step-body"><span class="work-fill">'+e(item.step1)+'</span></div></div>'

      +'<div class="step-row"><span class="step-tag">3 เหตุผล</span><div class="step-body"><span class="work-fill">'+e(item.step3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.181.0"></script></body></html>
