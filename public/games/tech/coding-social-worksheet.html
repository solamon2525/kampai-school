<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ระบบใบงานวิทยาการคำนวณ & สังคมศึกษาอัจฉริยะ ป.4–ป.6 — โรงเรียนบ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box} body{margin:0;background:#faf5ff;color:#0f172a;font-family:Sarabun,sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#7e22ce;color:#fff;box-shadow:0 3px 12px rgba(126,34,206,.35)}
    .toolbar h1{font-size:1rem;flex:1;margin:0;min-width:170px}
    .toolbar-ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .t-select,.t-input{font:700 .85rem Sarabun;padding:6px 10px;border-radius:8px;border:1px solid #e9d5ff;background:#fff;color:#7e22ce}
    .t-input{width:130px}
    .btn{border:0;border-radius:8px;padding:7px 11px;font:700 .88rem Sarabun;cursor:pointer;background:#fff;color:#7e22ce;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .btn.primary{background:#fbbf24;color:#78350f}.btn.green{background:#10b981;color:#fff}
    
    .pages{padding:14px}.sheet{width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;padding:5mm 6mm;box-shadow:0 5px 24px rgba(126,34,206,.15);page-break-after:always;break-after:page;display:flex;flex-direction:column;gap:2mm;position:relative}
    .sheet:last-child{page-break-after:auto}
    
    .sheet-head{border-bottom:2px solid #7e22ce;padding-bottom:2mm;padding-right:28mm;position:relative;min-height:26mm}
    .sheet-title{display:flex;align-items:center;gap:8px}.sheet-title h2{margin:0;flex:1;color:#7e22ce;font-size:15pt}.level{border:1.5px solid #e9d5ff;border-radius:999px;padding:2px 9px;font-weight:800;color:#7e22ce;font-size:8.5pt}
    .school-name{font-size:9pt;font-weight:700;color:#6b21a8;margin-top:0.5mm;display:flex;align-items:center;gap:6px}
    .school-logo-mini{width:18px;height:18px;object-fit:contain}
    
    .student{display:flex;flex-wrap:nowrap;gap:8mm;align-items:center;margin-top:2mm;font-size:10.5pt;font-weight:700;color:#1e293b}
    .student-name{flex:1;display:flex;align-items:center;gap:6px}
    .student-no{display:flex;align-items:center;gap:6px;white-space:nowrap}
    .blank{display:inline-block;border-bottom:1px solid #334155;height:5mm}
    .blank.long{flex:1;min-width:60mm}
    .blank.short{width:22mm}
    
    .directions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:9pt;font-weight:700;color:#334155;margin-top:2mm}
    .indicator{color:#7e22ce;font-weight:800;background:#faf5ff;border:1px solid #e9d5ff;border-radius:6px;padding:1px 7px;white-space:nowrap}
    
    .qr-box{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;width:25mm}
    .qr-img{width:22mm;height:22mm;border:1px solid #7e22ce;border-radius:4px;padding:1px;background:#fff}
    .qr-label{font-size:6.5pt;font-weight:700;color:#7e22ce;margin-top:1px;line-height:1.1}

    .questions{display:grid;gap:1.5mm;flex:1}
    .questions.count-10{grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:1.5mm 3mm}
    .questions.count-10 .q{padding:2mm 2.5mm;min-height:36.5mm}
    
    .q{border:1.4px solid #e9d5ff;border-radius:2.5mm;padding:2.5mm 2mm;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1mm;position:relative;break-inside:avoid;background:#faf5ff}
    .q-num{position:absolute;left:2mm;top:1.5mm;width:6.5mm;height:6.5mm;border-radius:50%;display:grid;place-items:center;background:#7e22ce;color:#fff;font-weight:800;font-size:9pt}
    .code-question{font-size:11.5pt;font-weight:800;color:#6b21a8;margin-left:7mm}

    .ans{font:700 9.5pt Sarabun,sans-serif;color:#7e22ce;margin-top:2mm;margin-left:7mm}
    .blank-sm{display:inline-block;min-width:24mm;border-bottom:1px solid #334155;height:4.5mm}
    .ta{display:none;color:#b91c1c;font-weight:800;border:1px dashed #f87171;background:#fef2f2;border-radius:4px;padding:0 4px;margin-left:4px;font-size:8.5pt}
    .show-answers .ta{display:inline}

    .parent-slip{border-top:2px dashed #7e22ce;margin-top:auto;padding-top:1.5mm;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;font-size:8pt;color:#334155}
    .parent-slip .cut-label{font-weight:800;color:#7e22ce}
    .parent-slip .teacher-label{font-weight:700;color:#7e22ce;background:#faf5ff;padding:1px 6px;border-radius:4px;border:1px solid #e9d5ff}

    .cover-sheet{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:4px double #7e22ce;padding:12mm}
    .cover-logo-img{width:100px;height:100px;object-fit:contain;margin-bottom:4mm}
    .cover-title{font-size:24pt;font-weight:800;color:#7e22ce;margin:0 0 2mm}
    .cover-sub{font-size:14pt;font-weight:700;color:#6b21a8;margin-bottom:8mm}
    .cover-box{border:2px solid #e9d5ff;background:#faf5ff;border-radius:12px;padding:6mm;width:80%;margin-bottom:8mm}

    .sheet-foot{display:flex;justify-content:space-between;align-items:center;color:#64748b;font-size:7.5pt;margin-top:0.5mm}
    .sheet-foot-teacher{font-weight:700;color:#7e22ce}
    
    @media print{
      @page{size:A4 portrait;margin:0}
      body{background:#fff}.toolbar{display:none!important}.pages{padding:0}
      .sheet{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:297mm;padding:5mm 6mm;overflow:hidden}.q{min-height:0}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>💻 ระบบใบงานวิทยาการคำนวณ & สังคมศึกษาอัจฉริยะ</h1>
    <div class="toolbar-ctrls">
      <select class="t-select" id="selStyle">
        <option value="standard">รูปแบบ: ใบงานมาตรฐาน (อัลกอริทึม & สัญลักษณ์)</option>
        <option value="booklet">รูปแบบ: รวมเล่มแบบฝึกหัดไอทีและสังคม</option>
      </select>
      <select class="t-select" id="selPageCount">
        <option value="1">สร้าง 1 หน้า</option>
        <option value="2">สร้าง 2 หน้าพร้อมกัน</option>
        <option value="3">สร้าง 3 หน้าพร้อมกัน</option>
      </select>
      <select class="t-select" id="selTopic">
        <option value="unplugged">หัวข้อ: บล็อกคำสั่ง Unplugged Coding (ป.4)</option>
        <option value="traffic">หัวข้อ: เครื่องหมายจราจรและสัญลักษณ์ในชีวิตประจำวัน (ป.5)</option>
        <option value="cyber">หัวข้อ: พลเมืองดิจิทัลและมารยาทเน็ต (ป.6)</option>
      </select>
      <input class="t-input" type="text" id="inpSchool" value="โรงเรียนบ้านคำไผ่" />
      <select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select>
      <button class="btn primary" id="btnRandom">🎲 สุ่มภารกิจใหม่</button>
      <button class="btn" id="btnAnswers">👁️ เฉลยครู</button>
      <button class="btn green" id="btnPrint">🖨️ พิมพ์ A4</button>
    </div>
  </div>
  <main class="pages" id="pages"></main>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const SCHOOL_LOGO_URL = 'https://lkpqssbqxxpasidfqhpb.supabase.co/storage/v1/object/public/school-images/logo/1778157862905_c2swwm.webp';
const MEDIA_URL = window.location.origin;
const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(MEDIA_URL);
const SUPABASE_URL = 'https://lkpqssbqxxpasidfqhpb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrcHFzc2JxeHhwYXNpZGZxaHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NjUyMjgsImV4cCI6MjA5MTI0MTIyOH0.X7YsSlrgYl9ifLWvgyZI04PtebK572pacadfNlmNO-A';

const TECH_DATA = {
  unplugged: [
    {q:'คำสั่ง ⬆️ หมายถึงอะไร?', ans:'เดินหน้า / ขึ้นบน'},
    {q:'คำสั่ง ➡️ หมายถึงอะไร?', ans:'เลี้ยวขวา'},
    {q:'คำสั่ง 🔁 Repeat 3 times หมายถึงอะไร?', ans:'ทำซ้ำ 3 รอบ'},
    {q:'จุดเริ่มต้นของการทำงานในอัลกอริทึมเรียกว่าอะไร?', ans:'Start / เริ่มต้น'}
  ],
  traffic: [
    {q:'ป้ายวงกลมสีแดงมีเครื่องหมายห้าม หมายถึงอะไร?', ans:'ป้ายบังคับ (ห้ามผ่าน/ห้ามเลี้ยว)'},
    {q:'ป้ายสามเหลี่ยมสีเหลือง หมายถึงอะไร?', ans:'ป้ายเตือน (ระวังทางโค้ง/ระวังโรงเรียน)'},
    {q:'สัญญาณไฟจราจรสีเหลือง หมายถึงอะไร?', ans:'เตรียมหยุดรถ'}
  ],
  cyber: [
    {q:'การไม่เปิดเผยรหัสผ่านให้ผู้อื่นเรียกว่าอะไร?', ans:'การรักษาความเป็นส่วนตัว (Privacy)'},
    {q:'การระแกะระกวนกันทางออนไลน์เรียกว่าอะไร?', ans:'Cyberbullying'},
    {q:'ก่อนแชร์ข่าวสารควรทำสิ่งใดเป็นอันดับแรก?', ans:'ตรวจสอบความถูกต้อง (Fact Check)'}
  ]
};

async function fetchTeachers() {
  const sel = document.getElementById('selTeacher');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/staff?select=name,position,staff_type&order=order_position.asc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        sel.innerHTML = '<option value="">-- เลือกครูผู้สอน --</option>' + 
          data.map(t => `<option value="${t.name}">${t.name} ${t.position?`(${t.position})`:''}</option>`).join('');
        return;
      }
    }
  } catch (e) {}
  sel.innerHTML = '<option value="">-- เลือกครูผู้สอน --</option><option value="ครูวิทยา">ครูวิทยา</option>';
}

function question(qi, topicItem){
  return '<article class="q"><span class="q-num">'+qi+'</span>'
    +'<div class="code-question">ภารกิจ: "'+topicItem.q+'"</div>'
    +'<div class="ans">คำตอบ: <span class="blank-sm"></span>'
    +'<span class="ta">เฉลย: '+topicItem.ans+'</span></div></article>';
}

function renderBookletCover(schoolName, teacherName){
  return '<section class="sheet cover-sheet">'
    +'<img class="cover-logo-img" src="'+SCHOOL_LOGO_URL+'" alt="ตราโรงเรียน" />'
    +'<h1 class="cover-title">'+(schoolName||'โรงเรียนบ้านคำไผ่')+'</h1>'
    +'<div class="cover-sub">แบบฝึกหัดวิทยาการคำนวณ & พลเมืองดิจิทัล ป.4–ป.6</div>'
    +'<div class="cover-box"><div style="font-size:12pt;font-weight:800;color:#7e22ce">ข้อมูลนักเรียน</div>'
    +'<div style="text-align:left;font-size:11pt;font-weight:700;margin-top:3mm;display:grid;gap:2mm">'
    +'<div>ชื่อ - นามสกุล: <span class="blank" style="min-width:100mm"></span></div>'
    +'<div>เลขที่: <span class="blank" style="min-width:30mm"></span></div>'
    +'<div>ครูผู้สอน: <span class="blank" style="min-width:80mm">'+(teacherName||'....................................')+'</span></div>'
    +'</div></div>'
    +'<footer class="sheet-foot" style="position:absolute;bottom:8mm;right:8mm">กลุ่มสาระวิทยาศาสตร์และเทคโนโลยี · โรงเรียนบ้านคำไผ่</footer></section>';
}

function renderParentSlip(teacherName){
  return '<div class="parent-slip"><span class="cut-label">✂️ แถบส่งผู้ปกครอง</span>'
    +(teacherName?`<span class="teacher-label">ครูผู้สอน: ${teacherName}</span>`:'')
    +'<span>ผลการทำแบบฝึกหัด: [  ] ผ่านเกณฑ์   [  ] ควรทบทวนเพิ่ม</span>'
    +'<span>ลงชื่อผู้ปกครอง: .......................................</span></div>';
}

function renderSingleSheet(pageIdx, totalPages, style, topicKey, schoolName, teacherName){
  const list = TECH_DATA[topicKey] || TECH_DATA.unplugged;
  let qs = ''; for(let i=1; i<=10; i++){
    const item = list[(i-1+pageIdx*2) % list.length];
    qs += question(i, item);
  }
  return '<section class="sheet"><header class="sheet-head">'
    +'<div class="qr-box"><img class="qr-img" src="'+QR_API+'" alt="QR" /><span class="qr-label">สแกนดูบทเรียน</span></div>'
    +'<div class="sheet-title"><h2>💻 ใบงานวิทยาการคำนวณ & พลเมืองดิจิทัล</h2><span class="level">ว 4.2 ป.4–6</span></div>'
    +'<div class="school-name"><img src="'+SCHOOL_LOGO_URL+'" class="school-logo-mini" /> '+schoolName+'</div>'
    +'<div class="student"><div class="student-name">ชื่อ - นามสกุล: <span class="blank long"></span></div><div class="student-no">เลขที่: <span class="blank short"></span></div></div>'
    +'<div class="directions"><span>คำชี้แจง: จงแก้ปัญหาอัลกอริทึมและตอบคำถามพลเมืองดิจิทัลให้ถูกต้อง</span><span class="indicator">ว 4.2 ป.4-6</span></div>'
    +'</header><div class="questions count-10">'+qs+'</div>'+renderParentSlip(teacherName)
    +'<footer class="sheet-foot"><span>หน้า '+pageIdx+' / '+totalPages+'</span>'+(teacherName?`<span class="sheet-foot-teacher">ครูผู้สอน: ${teacherName}</span>`:'')+'</footer></section>';
}

function render(){
  const style = document.getElementById('selStyle').value;
  const pageCount = parseInt(document.getElementById('selPageCount').value, 10);
  const topicKey = document.getElementById('selTopic').value;
  const schoolName = document.getElementById('inpSchool').value.trim();
  const teacherName = document.getElementById('selTeacher').value;

  let html = style==='booklet' ? renderBookletCover(schoolName, teacherName) : '';
  for(let p=1; p<=pageCount; p++) html += renderSingleSheet(p, pageCount, style, topicKey, schoolName, teacherName);
  document.getElementById('pages').innerHTML = html;
}

document.getElementById('btnRandom').onclick = render;
document.getElementById('selStyle').onchange = render;
document.getElementById('selPageCount').onchange = render;
document.getElementById('selTopic').onchange = render;
document.getElementById('inpSchool').oninput = render;
document.getElementById('selTeacher').onchange = render;
document.getElementById('btnAnswers').onclick = function(){
  document.body.classList.toggle('show-answers');
  this.textContent = document.body.classList.contains('show-answers') ? '🙈 ซ่อนเฉลยครู' : '👁️ เฉลยครู';
};
document.getElementById('btnPrint').onclick = () => window.print();

fetchTeachers();
render();
</script>
</body>
</html>
