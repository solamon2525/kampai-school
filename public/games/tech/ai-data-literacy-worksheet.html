<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/tech/ai-data-literacy-media.html"><meta name="curriculum-indicators" content="ว 4.2 ป.4/1,ว 4.2 ป.5/1"><title>ใบงานรู้เท่าทัน AI และข้อมูล</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>🤖 ใบงานรู้เท่าทัน AI และข้อมูล</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option><option value="2">2 หน้า</option></select><select class="t-select" id="selGrade"><option value="4">ป.4–ป.6</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'ข้อมูลนี้มาจากใคร',answer:'บอกแหล่งที่มา'},{prompt:'ก่อนแชร์คำตอบจาก AI ควรทำอะไร',answer:'ตรวจแหล่งที่มาและหลักฐาน'},{prompt:'ความเห็นต่างจากหลักฐานอย่างไร',answer:'ความเห็นคือมุมมอง หลักฐานตรวจสอบได้'},{prompt:'เขียนคำถามที่ช่วยตรวจข้อมูล',answer:'คำตอบหลากหลาย'},{prompt:'ทำไมต้องบอกที่มา',answer:'ให้ผู้อื่นตรวจสอบได้'},{prompt:'ถ้าข้อมูลสองแหล่งไม่ตรงกันควรทำอย่างไร',answer:'เปรียบเทียบหลักฐาน'},{prompt:'AI อาจตอบผิดได้หรือไม่',answer:'ได้ จึงต้องตรวจทาน'},{prompt:'เขียนวิธีคิดก่อนกดแชร์',answer:'หยุด ตรวจ แล้วจึงแชร์'},{prompt:'แหล่งข้อมูลที่น่าเชื่อถือควรมีอะไร',answer:'ผู้เขียน วันที่ และหลักฐาน'},{prompt:'สรุปกติกาการใช้ AI อย่างรับผิดชอบ',answer:'ตรวจทานและบอกที่มา'}];window.WORKSHEET_CONFIG={icon:'🤖',title:'ใบงานรู้เท่าทัน AI และข้อมูล',subject:'เทคโนโลยี',gradeLabel:'ป.4–ป.6',mediaLabel:'สื่อรู้เท่าทัน AI',sourceMediaUrl:'/games/tech/ai-data-literacy-media.html',indicators:['ว 4.2 ป.4/1','ว 4.2 ป.5/1'],directions:'อ่านสถานการณ์ แล้วเขียนหลักฐานหรือเหตุผล',getItems:()=>ITEMS,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line"><div class="prompt"><strong>'+e(item.prompt)+'</strong></div><div class="answer-line">คำตอบ <span class="blank long"></span></div><div class="reason-line">เหตุผล / หลักฐาน <span class="blank long"></span></div><div class="answer teacher-answer">เฉลย: '+e(item.answer)+'</div></div>';}};function render(){window.KampaiTopicWorksheet.render()}window.addEventListener('load',()=>{document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();});</script><script src="/games/worksheet-topic.js?v=2.0.0"></script><script src="/games/worksheet-modes.js?v=2.0.0"></script></body></html>
