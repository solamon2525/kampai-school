<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="610" font-size="200" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🤖</text>
  <text x="1130" y="160" font-size="170" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🏁</text>

  <g transform="translate(640,104)">
    <rect x="-240" y="-26" width="480" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#c7d2fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เทคโนโลยี (วิทยาการคำนวณ) ป.4–6</text>
  </g>
  <text x="640" y="262" font-size="104" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">หุ่นยนต์ทำตามคำสั่ง</text>
  <text x="640" y="338" font-size="32" font-weight="700" fill="#a5b4fc" text-anchor="middle" dominant-baseline="middle">เขียนลำดับคำสั่งให้หุ่นเดินถึงธง · คิดเชิงคำนวณ + ลูป</text>

  <!-- ตาราง 4×4 + เส้นทางหุ่น → ธง -->
  <g transform="translate(372,392)">
    <!-- cells -->
    <g stroke="#334155" stroke-width="2">
      <rect x="0" y="0" width="320" height="320" rx="14" fill="#0b1220"/>
      <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="240" x2="320" y2="240"/>
    </g>
    <!-- กำแพง -->
    <rect x="164" y="84" width="72" height="72" rx="10" fill="#7c2d12" stroke="#92400e" stroke-width="2"/>
    <text x="200" y="124" font-size="40" text-anchor="middle" dominant-baseline="central">🧱</text>
    <!-- ดาว -->
    <text x="120" y="44" font-size="40" text-anchor="middle" dominant-baseline="central">⭐</text>
    <!-- เส้นทาง (จุด start ล่างซ้าย → ขึ้น → ขวา → ขึ้น → ธงขวาบน) -->
    <g fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 16" opacity="0.85">
      <path d="M40,280 L40,120 L120,120 L120,40 L280,40"/>
    </g>
    <!-- ธง มุมขวาบน -->
    <rect x="244" y="4" width="72" height="72" rx="10" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <text x="280" y="44" font-size="42" text-anchor="middle" dominant-baseline="central">🏁</text>
    <!-- หุ่น ล่างซ้าย -->
    <text x="40" y="282" font-size="52" text-anchor="middle" dominant-baseline="central" filter="url(#sh)">🤖</text>
  </g>

  <!-- แถบคำสั่ง (โปรแกรม) ด้านขวา -->
  <g transform="translate(760,420)">
    <text x="0" y="-18" font-size="24" font-weight="700" fill="#cbd5e1">ลำดับคำสั่ง</text>
    <g font-size="40" font-weight="800" fill="#fff">
      <g><rect x="0" y="0" width="62" height="62" rx="12" fill="url(#indigo)" stroke="#312e81" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">⬆️</text></g>
      <g transform="translate(74,0)"><rect width="62" height="62" rx="12" fill="url(#indigo)" stroke="#312e81" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">➡️</text></g>
      <g transform="translate(148,0)"><rect width="62" height="62" rx="12" fill="url(#indigo)" stroke="#312e81" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">⬆️</text></g>
      <g transform="translate(222,0)"><rect width="62" height="62" rx="12" fill="url(#indigo)" stroke="#312e81" stroke-width="2"/><text x="31" y="34" text-anchor="middle" dominant-baseline="central">➡️</text></g>
    </g>
    <g transform="translate(0,86)">
      <rect x="0" y="0" width="180" height="44" rx="22" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <text x="90" y="23" font-size="22" font-weight="700" fill="#fde047" text-anchor="middle" dominant-baseline="central">🔁 ทำซ้ำ ×3</text>
      <g transform="translate(196,0)"><rect width="88" height="44" rx="22" fill="#16a34a"/><text x="44" y="23" font-size="22" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">▶️ รัน</text></g>
    </g>
  </g>

  <g transform="translate(640,676)">
    <rect x="-300" y="-24" width="600" height="48" rx="24" fill="#6366f1" opacity="0.20"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#c7d2fe" text-anchor="middle" dominant-baseline="middle">วางคำสั่ง · กดรัน · ชนแล้วแก้ใหม่ (debug) · ใช้ลูปให้สั้นลง</text>
  </g>
</svg>
