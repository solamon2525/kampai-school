<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Tech Grid Lines -->
  <line x1="0" y1="180" x2="1280" y2="180" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="0" y1="360" x2="1280" y2="360" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="0" y1="540" x2="1280" y2="540" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="320" y1="0" x2="320" y2="720" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="640" y1="0" x2="640" y2="720" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="960" y1="0" x2="960" y2="720" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Ambient Orbs -->
  <circle cx="220" cy="240" r="140" fill="#38bdf8" fill-opacity="0.15"/>
  <circle cx="1060" cy="480" r="180" fill="#f59e0b" fill-opacity="0.12"/>

  <!-- Center Card (Safe-zone: Y starts at 160, safe from top margin) -->
  <rect x="140" y="160" width="1000" height="420" rx="28" fill="#0b1329" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="3.5"/>

  <!-- Icon & Badge -->
  <text x="640" y="270" text-anchor="middle" font-size="76">🤖 🧠 🚀</text>

  <!-- Title (Safe top margin respected) -->
  <text x="640" y="375" text-anchor="middle" font-family="Sarabun, Kanit, sans-serif" font-size="52" font-weight="800" fill="#facc15">Neural Bot: สมองกลกู้จักรวาล</text>

  <!-- Subtitle -->
  <text x="640" y="445" text-anchor="middle" font-family="Sarabun, Kanit, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0">เกมสื่อการสอน AI Machine Learning · วิชาวิทยาการคำนวณ</text>

  <!-- Badges footer -->
  <rect x="420" y="490" width="440" height="44" rx="22" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="640" y="520" text-anchor="middle" font-family="Sarabun, Kanit, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">Interactive Neural Network · KampaiVersus แข่ง 2 คน</text>
</svg>
