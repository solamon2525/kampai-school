<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset="0.55" stop-color="#155e75"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="660" ry="380" fill="url(#glow)"/>
  <text x="150" y="600" font-size="200" opacity="0.06" text-anchor="middle" dominant-baseline="middle">📱</text>
  <text x="1130" y="170" font-size="170" opacity="0.06" text-anchor="middle" dominant-baseline="middle">🔒</text>

  <g transform="translate(640,104)">
    <rect x="-250" y="-26" width="500" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#cffafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เทคโนโลยี/พลเมืองดิจิทัล ป.4–6</text>
  </g>
  <text x="640" y="258" font-size="112" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">ปลอดภัยออนไลน์</text>
  <text x="640" y="334" font-size="32" font-weight="700" fill="#a5f3fc" text-anchor="middle" dominant-baseline="middle">ตัดสินสถานการณ์ออนไลน์ — ปลอดภัยหรือเสี่ยง?</text>

  <!-- โล่ป้องกัน + กุญแจ กลางจอ -->
  <g transform="translate(640,500)">
    <path d="M0,-118 L112,-78 L112,18 C112,92 60,140 0,162 C-60,140 -112,92 -112,18 L-112,-78 Z"
          fill="url(#shield)" stroke="#155e75" stroke-width="6" filter="url(#sh)"/>
    <path d="M0,-118 L112,-78 L112,18 C112,92 60,140 0,162 C-60,140 -112,92 -112,18 L-112,-78 Z"
          fill="none" stroke="#cffafe" stroke-width="2" opacity="0.6"/>
    <!-- แม่กุญแจ -->
    <g transform="translate(0,8)">
      <path d="M-30,-22 a30,30 0 0,1 60,0 v18 h-14 v-18 a16,16 0 0,0 -32,0 v18 h-14 Z" fill="#0f172a"/>
      <rect x="-40" y="-6" width="80" height="64" rx="12" fill="#0f172a"/>
      <circle cx="0" cy="20" r="11" fill="#FFD700"/>
      <rect x="-5" y="20" width="10" height="22" rx="4" fill="#FFD700"/>
    </g>
  </g>

  <!-- ปุ่มตัดสิน 👍 / 👎 -->
  <g font-size="30" font-weight="700" font-family="'Kanit',sans-serif">
    <g transform="translate(300,498)">
      <rect x="-118" y="-44" width="236" height="88" rx="20" fill="#16a34a" stroke="#15803d" stroke-width="3" filter="url(#sh)"/>
      <text x="0" y="2" fill="#fff" text-anchor="middle" dominant-baseline="central">👍 ปลอดภัย</text>
    </g>
    <g transform="translate(980,498)">
      <rect x="-118" y="-44" width="236" height="88" rx="20" fill="#e11d48" stroke="#9f1239" stroke-width="3" filter="url(#sh)"/>
      <text x="0" y="2" fill="#fff" text-anchor="middle" dominant-baseline="central">👎 เสี่ยง</text>
    </g>
  </g>

  <g transform="translate(640,676)">
    <rect x="-310" y="-24" width="620" height="48" rx="24" fill="#06b6d4" opacity="0.20"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#a5f3fc" text-anchor="middle" dominant-baseline="middle">รหัสผ่าน · ข้อมูลส่วนตัว · กลโกง · กลั่นแกล้งไซเบอร์ · เวลาหน้าจอ</text>
  </g>
</svg>
