<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/career/cooking-basics-media.html"><meta name="curriculum-indicators" content="ง 1.1 ป.4/1 · ง 1.1 ป.5/2 · ง 1.1 ป.6/2"><title>ใบงานการประกอบอาหารเบื้องต้น ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.184.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.184.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin:.8mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:1mm;font-size:7.5pt;font-weight:700;color:var(--ws-muted);display:flex;align-items:center;gap:1mm}
.tick-box .mk{font-weight:800}
.order-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(26mm,1fr));gap:1.5mm;margin:1mm 0}
.order-tile{border:1px solid var(--ws-line);border-radius:3px;padding:1.2mm 1mm;text-align:center;font-size:7.5pt;font-weight:700;line-height:1.35;display:flex;flex-direction:column;gap:.8mm;align-items:center;justify-content:space-between}
.num-box{width:8mm;height:7mm;border:1.5px solid var(--ws-accent);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10pt;font-weight:800}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
.count-5 .order-tile{min-height:14mm;font-size:8.5pt}
.count-5 .tick-box{font-size:8.5pt;padding:1.4mm}
</style>
</head><body>
<header class="toolbar"><h1>🍳 ใบงานการประกอบอาหารเบื้องต้น</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="ingredients">เลือกวัตถุดิบ</option><option value="hygiene">สุขอนามัยครัว</option><option value="cooking">ขั้นตอนทำอาหาร</option><option value="safety">ความปลอดภัย</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.184.0"></script><script>
const ITEMS=[
 {type:'ingredients',kind:'tick',prompt:'ติ๊ก ✓ หน้าผักที่ควรเลือกซื้อ และติ๊ก ✗ หน้าผักที่ไม่ควรซื้อ',options:[['ใบเขียวสด กรอบ ไม่ช้ำ',true],['ใบเหลือง เหี่ยวนิ่ม',false],['ไม่มีรอยเน่า ไม่มีกลิ่นแปลก',true],['มีรอยช้ำ น้ำเยิ้ม',false]],answer:'เลือกผักใบเขียวสด กรอบ ไม่ช้ำ ไม่เน่า'},
 {type:'ingredients',kind:'tick',prompt:'ติ๊ก ✓ หน้าไข่และเนื้อสัตว์ที่นำมาปรุงได้ และ ✗ ที่ต้องทิ้ง',options:[['ไข่เปลือกสะอาด ไม่ร้าว',true],['ไข่ร้าว มีกลิ่นเหม็น',false],['เนื้อสีสด เนื้อแน่นเด้ง',true],['เนื้อซีดคล้ำ กลิ่นเปรี้ยว',false]],answer:'ใช้ไข่ไม่ร้าว เนื้อสีสดไม่มีกลิ่นเสีย'},
 {type:'ingredients',kind:'reason',prompt:'ก่อนใช้ของจากถุง/กล่อง ทำไมต้องดูฉลากวันหมดอายุ',step1:'พลิกดูวันผลิต–วันหมดอายุ',step2:'ของหมดอายุมีเชื้อโรค เสี่ยงท้องเสีย',step3:'เลือกใช้เฉพาะของที่ยังไม่หมดอายุ',answer:'กันอาหารหมดอายุที่ทำให้ป่วยท้องเสีย'},
 {type:'hygiene',kind:'order',prompt:'เขียนเลข 1–3 เรียงลำดับก่อนลงมือทำอาหาร',steps:['ล้างมือด้วยสบู่ให้สะอาด','ล้างผัก–วัตถุดิบด้วยน้ำสะอาด','เตรียมอุปกรณ์ เขียง มีด ให้พร้อม'],display:[1,2,0],answer:'ล้างมือ → ล้างวัตถุดิบ → เตรียมอุปกรณ์'},
 {type:'hygiene',kind:'reason',prompt:'ทำไมต้องแยกเขียงของดิบกับของสุก',step1:'ใช้เขียงคนละอันสำหรับของดิบ/ของสุก',step2:'เชื้อโรคจากของดิบไม่ปนของสุก',step3:'อาหารสะอาด กินแล้วไม่ท้องเสีย',answer:'กันเชื้อโรคจากของดิบปนเปื้อนของสุก'},
 {type:'hygiene',kind:'reason',prompt:'อาหารเหลือจากมื้อนี้ ควรจัดการอย่างไร',step1:'ปิดฝาภาชนะ แช่ตู้เย็น',step2:'อากาศร้อนทำให้อาหารบูดเร็ว',step3:'เก็บกินมื้อถัดไปได้ ไม่เสียของ',answer:'ปิดฝาแช่ตู้เย็น กันบูดและไม่เสียของ'},
 {type:'cooking',kind:'order',prompt:'เขียนเลข 1–5 เรียงลำดับขั้นตอนการประกอบอาหาร',steps:['วางแผนเลือกเมนู–วัตถุดิบ','เตรียม ล้าง หั่น ตวง','ปรุงตามลำดับ ไฟพอดี','จัดเสิร์ฟใส่จานสะอาด','เก็บล้างอุปกรณ์ เช็ดครัว'],display:[2,4,0,3,1],answer:'วางแผน → เตรียม → ปรุง → จัดเสิร์ฟ → เก็บล้าง'},
 {type:'cooking',kind:'order',prompt:'เขียนเลข 1–5 เรียงลำดับการทำไข่เจียว',steps:['ตอกไข่ใส่ถ้วย ปรุงรส','ตีไข่ให้เข้ากันจนฟู','ตั้งกระทะ รอน้ำมันร้อน','เทไข่ลงทอด พลิกให้สุก','ตักพักน้ำมัน จัดใส่จาน'],display:[3,0,4,2,1],answer:'ตอกไข่ → ตีไข่ → ตั้งกระทะ → ทอด → จัดจาน'},
 {type:'cooking',kind:'reason',prompt:'ทำไมต้องวางแผนเมนูก่อนเริ่มทำอาหาร',step1:'เลือกเมนู จดวัตถุดิบที่ต้องใช้',step2:'ของครบ ไม่ต้องหยุดกลางคัน ไม่ซื้อเกิน',step3:'ทำงานเป็นระบบ เสร็จเร็ว ประหยัด',answer:'ของครบ ทำงานเป็นระบบ ประหยัดเวลาและเงิน'},
 {type:'safety',kind:'tick',prompt:'ติ๊ก ✓ ข้อที่ปลอดภัย และ ✗ ข้อที่อันตราย',options:[['หั่นผักบนเขียง งอนิ้วเก็บปลายนิ้ว',true],['เดินถือมีดชี้ไปข้างหน้า',false],['ใช้ผ้าจับของร้อนยกกระทะ',true],['จับหูหม้อร้อนด้วยมือเปล่า',false]],answer:'หั่นบนเขียง + ใช้ผ้าจับของร้อน = ปลอดภัย'},
 {type:'safety',kind:'reason',prompt:'ก่อนทอด ทำไมต้องซับวัตถุดิบให้แห้ง',step1:'ซับน้ำด้วยกระดาษ/ผ้าสะอาด',step2:'น้ำโดนน้ำมันร้อนจะกระเด็นแรง',step3:'ทอดได้ปลอดภัย ไม่โดนน้ำมันลวก',answer:'กันน้ำมันร้อนกระเด็นลวกมือ'},
 {type:'safety',kind:'order',prompt:'น้ำมันในกระทะลุกไฟ! เขียนเลข 1–3 เรียงลำดับสิ่งที่ต้องทำ',steps:['ปิดเตาไฟทันที','ใช้ฝาปิดกระทะให้ไฟดับ','เรียกผู้ใหญ่มาช่วยตรวจดู'],display:[1,2,0],answer:'ปิดเตา → ปิดฝากระทะ → เรียกผู้ใหญ่ (ห้ามราดน้ำ)'}
];
const SKILL={ingredients:'เลือกวัตถุดิบ',hygiene:'สุขอนามัยครัว',cooking:'ขั้นตอนทำอาหาร',safety:'ความปลอดภัย'};
window.WORKSHEET_CONFIG={
  worksheetKey:'cooking-basics',
  icon:'🍳',title:'ใบงานการประกอบอาหารเบื้องต้น',subject:'การงานอาชีพ',gradeLabel:'ป.4–6',mediaLabel:'อาหารและการประกอบอาหารเบื้องต้น',
  sourceMediaUrl:'/games/career/cooking-basics-media.html',indicators:['ง 1.1 ป.4/1','ง 1.1 ป.5/2','ง 1.1 ป.6/2'],
  directions:'อ่านโจทย์ → ติ๊ก ✓/✗ · เรียงลำดับ · ลงขั้นตอน–เหตุผล–ผลที่ได้ ให้ครบทุกช่อง',
  topicLabels:SKILL,
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    let body='';
    if(item.kind==='tick'){
      body='<div class="tick-grid">'+item.options.map((opt)=>
        '<div class="tick-box"><span>[&nbsp;&nbsp;]</span><span class="mk work-fill">'+(opt[1]?'✓':'✗')+'</span><span>'+e(opt[0])+'</span></div>'
      ).join('')+'</div>';
    }else if(item.kind==='order'){
      body='<div class="order-row">'+item.display.map((stepIndex)=>
        '<div class="order-tile"><span>'+e(item.steps[stepIndex])+'</span><span class="num-box"><span class="work-fill">'+(stepIndex+1)+'</span></span></div>'
      ).join('')+'</div>';
    }else{
      body='<div class="step-block">'
        +'<div class="step-row"><span class="step-tag">1 สิ่งที่ทำ</span><div class="step-body"><span class="work-fill">'+e(item.step1)+'</span></div></div>'
        +'<div class="step-row"><span class="step-tag">2 เหตุผล</span><div class="step-body"><span class="work-fill">'+e(item.step2)+'</span></div></div>'
        +'<div class="step-row"><span class="step-tag">3 ผลที่ได้</span><div class="step-body"><span class="work-fill">'+e(item.step3)+'</span></div></div>'
        +'</div>';
    }
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div></div>'
      +'<div class="q-work-block">'+body+'</div>'
      +'<div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.184.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
