<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/career/waste-sort-media.html"><meta name="curriculum-indicators" content="ง 1.1 ป.3/3, ง 1.1 ป.4/4"><title>ใบงานแยกขยะ ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.15" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.15" rel="stylesheet">
<style>
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin:1mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.8mm;font-size:7.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.crit-row{display:flex;flex-wrap:wrap;gap:1mm;font-size:6.5pt;font-weight:700;color:var(--ws-accent);margin-top:.5mm}
.crit-row span{border:1px solid var(--ws-line);border-radius:3px;padding:.3mm 1mm}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}

</style>

<script src="/games/worksheet-runtime.js?v=1.175.15"></script><script>
const WASTE_ITEMS=[

 {type:'sort',prompt:'ถุงพลาสติกสกปรกที่ใช้แล้วจัดอย่างไร',item:'ถุงสกปรก',answer:'ขยะทั่วไป (ถ้าสกปรกรีไซเคิลไม่ได้)',s1:'สกปรก',s2:'รีไซเคิลยาก',s3:'ถังทั่วไป'},

 {type:'reason',prompt:'ทำไมขยะอันตรายต้องแยกต่างหาก',item:'อันตราย',answer:'สารเคมีอาจปนเปื้อนและทำร้ายคน/สิ่งแวดล้อม',s1:'มีสารพิษ',s2:'ปนเปื้อนได้',s3:'แยกพิเศษ'},

window.WORKSHEET_CONFIG={

  directions:'สังเกตขยะ → เลือกถังด้วยเกณฑ์ → อธิบายเหตุผล',
  getItems(t){return t==='mixed'?WASTE_ITEMS:WASTE_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="q-context">'+e(item.item)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ ทั่วไป</div><div class="tick-box">□ รีไซเคิล</div><div class="tick-box">□ เปียก</div><div class="tick-box">□ อันตราย</div></div>'

      +'<div class="step-row"><span class="step-tag">1 สังเกต</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'

  }

</script><script src="/games/worksheet-topic.js?v=1.175.15"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.15"></script></body></html>
