<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/career/workplace-safety-media.html"><meta name="curriculum-indicators" content="ง 1.1 ป.1/1,ง 1.1 ป.4/1"><title>ใบงานความปลอดภัยในการทำงาน</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>🦺 ใบงานความปลอดภัยในการทำงาน</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option></select><select class="t-select" id="selGrade"><option value="1">ป.1–ป.6</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="10">10 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'ก่อนทำงานควรดูอะไร',answer:'พื้นที่และความเสี่ยง'},{prompt:'ถ้าพบเครื่องมือชำรุดควรทำอย่างไร',answer:'หยุดใช้และบอกผู้ใหญ่'},{prompt:'ทำไมต้องเลือกเครื่องมือให้เหมาะ',answer:'ลดความเสี่ยง'},{prompt:'เขียนอุปกรณ์ป้องกัน 1 อย่าง',answer:'ถุงมือ/แว่นตา'},{prompt:'หลังทำงานควรทำอะไร',answer:'เก็บและทำความสะอาด'},{prompt:'ถ้าพื้นเปียกควรทำอย่างไร',answer:'เช็ด/กั้นพื้นที่'},{prompt:'ถ้าไม่รู้วิธีใช้เครื่องมือควรทำอะไร',answer:'ถามผู้ใหญ่'},{prompt:'เหตุใดไม่ควรวิ่งขณะถือของมีคม',answer:'อาจเกิดอุบัติเหตุ'},{prompt:'เขียนกติกาความปลอดภัย 1 ข้อ',answer:'ตามนักเรียน'},{prompt:'ใครช่วยตัดสินใจเมื่อไม่แน่ใจ',answer:'ครูหรือผู้ใหญ่ที่ไว้ใจ'}];window.WORKSHEET_CONFIG={icon:'🦺',title:'ใบงานความปลอดภัยในการทำงาน',subject:'การงานอาชีพ',gradeLabel:'ป.1–ป.6',mediaLabel:'สื่อความปลอดภัยในการทำงาน',sourceMediaUrl:'/games/career/workplace-safety-media.html',indicators:['ง 1.1 ป.1/1','ง 1.1 ป.4/1'],directions:'เลือกวิธีที่ปลอดภัยและเขียนเหตุผล',getItems:()=>ITEMS,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line"><div class="prompt"><strong>'+e(item.prompt)+'</strong></div><div class="answer-line">คำตอบ <span class="blank long"></span></div><div class="reason-line">เหตุผล / วิธีป้องกัน <span class="blank long"></span></div><div class="answer teacher-answer">เฉลย: '+e(item.answer)+'</div></div>';}};function render(){window.KampaiTopicWorksheet.render()}window.addEventListener('load',()=>{document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();});</script><script src="/games/worksheet-topic.js?v=2.0.0"></script><script src="/games/worksheet-modes.js?v=2.0.0"></script></body></html>
