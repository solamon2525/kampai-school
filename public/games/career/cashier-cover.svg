<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45309"/><stop offset="0.55" stop-color="#92400e"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.08" text-anchor="middle" dominant-baseline="middle">💰</text>
  <text x="1110" y="170" font-size="180" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🛒</text>

  <g transform="translate(640,116)">
    <rect x="-200" y="-26" width="400" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#fef3c7" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · การงานอาชีพ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="122" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">ร้านค้าทอนเงิน</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#fde68a" text-anchor="middle" dominant-baseline="middle">หยอดเหรียญ/แบงก์ให้ตรงเป้า — ฝึกเป็นแม่ค้าเก่ง</text>

  <!-- เหรียญ + แบงก์ไทย -->
  <g transform="translate(640,512)" font-family="'Fredoka One','Kanit'" font-weight="800">
    <circle cx="-300" cy="0" r="48" fill="#d97706" stroke="#fde68a" stroke-width="4"/><text x="-300" y="6" font-size="30" fill="#422006" text-anchor="middle" dominant-baseline="middle">฿1</text>
    <circle cx="-180" cy="0" r="52" fill="#ca8a04" stroke="#fde68a" stroke-width="4"/><text x="-180" y="6" font-size="30" fill="#422006" text-anchor="middle" dominant-baseline="middle">฿10</text>
    <rect x="-100" y="-44" width="130" height="88" rx="12" fill="#16a34a" stroke="#bbf7d0" stroke-width="4"/><text x="-35" y="6" font-size="30" fill="#052e16" text-anchor="middle" dominant-baseline="middle">฿20</text>
    <rect x="60" y="-44" width="140" height="88" rx="12" fill="#7c3aed" stroke="#ddd6fe" stroke-width="4"/><text x="130" y="6" font-size="30" fill="#fff" text-anchor="middle" dominant-baseline="middle">฿100</text>
    <text x="265" y="6" font-size="46" text-anchor="middle" dominant-baseline="middle" font-family="'Kanit'">=฿?</text>
  </g>
  <g transform="translate(640,648)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">หยิบเงินพอดี · คิดเงินทอน · แข่งสด</text>
  </g>
</svg>
