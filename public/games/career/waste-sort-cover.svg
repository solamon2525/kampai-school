<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/><stop offset="0.55" stop-color="#064e3b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/><stop offset="0.5" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.3"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="240" opacity="0.08" text-anchor="middle" dominant-baseline="middle">♻️</text>
  <text x="1115" y="170" font-size="200" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🗑️</text>

  <g transform="translate(640,116)">
    <rect x="-200" y="-26" width="400" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">🔧 KAMPAI · การงานอาชีพ</text>
  </g>
  <text x="640" y="288" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">แยกขยะ 4 ถัง</text>
  <text x="640" y="374" font-size="38" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">ดูขยะ → ทิ้งให้ถูกถัง</text>

  <!-- 4 colored bins -->
  <g transform="translate(640,520)" text-anchor="middle" dominant-baseline="middle" font-weight="700">
    <g transform="translate(-330,0)">
      <rect x="-72" y="-58" width="144" height="116" rx="20" fill="#22c55e" filter="url(#sh)"/>
      <text x="0" y="-8" font-size="50">🗑️</text><text x="0" y="38" fill="#052e16" font-size="26">เปียก</text>
    </g>
    <g transform="translate(-110,0)">
      <rect x="-72" y="-58" width="144" height="116" rx="20" fill="#facc15" filter="url(#sh)"/>
      <text x="0" y="-8" font-size="50">🗑️</text><text x="0" y="38" fill="#422006" font-size="24">รีไซเคิล</text>
    </g>
    <g transform="translate(110,0)">
      <rect x="-72" y="-58" width="144" height="116" rx="20" fill="#3b82f6" filter="url(#sh)"/>
      <text x="0" y="-8" font-size="50">🗑️</text><text x="0" y="38" fill="#fff" font-size="26">ทั่วไป</text>
    </g>
    <g transform="translate(330,0)">
      <rect x="-72" y="-58" width="144" height="116" rx="20" fill="#ef4444" filter="url(#sh)"/>
      <text x="0" y="-8" font-size="50">🗑️</text><text x="0" y="38" fill="#fff" font-size="26">อันตราย</text>
    </g>
  </g>
  <g transform="translate(640,648)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#22c55e" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#86efac" text-anchor="middle" dominant-baseline="middle">🔥 คอมโบ · แข่งเวลา · ฝึก · ตามถังขยะมาตรฐานไทย</text>
  </g>
</svg>
