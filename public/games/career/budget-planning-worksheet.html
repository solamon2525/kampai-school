<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/career/budget-planning-media.html"><meta name="curriculum-indicators" content="ง 1.1 ป.4/1,ง 2.1 ป.5/1"><title>ใบงานวางแผนรายรับรายจ่าย</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>💰 ใบงานวางแผนรายรับรายจ่าย</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option></select><select class="t-select" id="selGrade"><option value="4">ป.4–ป.6</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="10">10 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'รายรับคืออะไร',answer:'เงินที่ได้รับ'},{prompt:'เขียนตัวอย่างรายรับ 1 อย่าง',answer:'เช่น เงินค่าขนม'},{prompt:'ยกตัวอย่างรายจ่ายจำเป็น',answer:'อาหาร/อุปกรณ์การเรียน'},{prompt:'ยกตัวอย่างสิ่งที่อยากได้',answer:'ตามนักเรียน'},{prompt:'ถ้ารายรับ 500 รายจ่าย 350 เหลือเท่าไร',answer:'150 บาท'},{prompt:'ก่อนซื้อของควรถามอะไร',answer:'จำเป็นหรืออยากได้'},{prompt:'ทำไมควรออมเงิน',answer:'เพื่อเป้าหมายในอนาคต'},{prompt:'เขียนวิธีลดรายจ่าย 1 วิธี',answer:'ตามนักเรียน'},{prompt:'ถ้าเงินไม่พอควรทำอย่างไร',answer:'ลดรายจ่ายที่ไม่จำเป็น'},{prompt:'สรุปกติกาการใช้เงิน 1 ข้อ',answer:'วางแผนก่อนใช้'}];window.WORKSHEET_CONFIG={icon:'💰',title:'ใบงานวางแผนรายรับรายจ่าย',subject:'การงานอาชีพ',gradeLabel:'ป.4–ป.6',mediaLabel:'สื่อวางแผนรายรับรายจ่าย',sourceMediaUrl:'/games/career/budget-planning-media.html',indicators:['ง 1.1 ป.4/1','ง 2.1 ป.5/1'],directions:'คำนวณเงินคงเหลือและเขียนเหตุผลการตัดสินใจ',getItems:()=>ITEMS,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line"><div class="prompt"><strong>'+e(item.prompt)+'</strong></div><div class="answer-line">คำตอบ <span class="blank long"></span></div><div class="reason-line">วิธีคิด / เหตุผล <span class="blank long"></span></div><div class="answer teacher-answer">เฉลย: '+e(item.answer)+'</div></div>';}};function render(){window.KampaiTopicWorksheet.render()}window.addEventListener('load',()=>{document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();});</script><script src="/games/worksheet-topic.js?v=2.0.0"></script><script src="/games/worksheet-modes.js?v=2.0.0"></script></body></html>
