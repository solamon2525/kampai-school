<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635"/><stop offset="0.3" stop-color="#65a30d"/><stop offset="0.7" stop-color="#4d7c0f"/><stop offset="1" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/><stop offset="1" stop-color="#4a2308"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ecfccb" stop-opacity="0.35"/><stop offset="1" stop-color="#ecfccb" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="290" rx="680" ry="380" fill="url(#glow)"/>
  <circle cx="1130" cy="150" r="70" fill="#fde047" opacity="0.85"/>
  <text x="160" y="600" font-size="190" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🌽</text>

  <!-- ป้ายหัว -->
  <g transform="translate(640,98)">
    <rect x="-280" y="-26" width="560" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ecfccb" text-anchor="middle" dominant-baseline="middle">🌿 KAMPAI · การงานอาชีพ ป.4–6 · เกษตรพอเพียง</text>
  </g>
  <!-- ชื่อเกม -->
  <text x="640" y="232" font-size="118" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">สวนผักพอเพียง</text>
  <text x="640" y="312" font-size="31" font-weight="700" fill="#ecfccb" text-anchor="middle" dominant-baseline="middle">เรียงลำดับขั้นการปลูก : เตรียมดิน → เพาะ → รดน้ำ → เก็บเกี่ยว</text>

  <!-- ลำดับขั้นการปลูก ⛏️ → 🌰 → 💧 → 🌿 → 🧺 -->
  <g transform="translate(640,500)" text-anchor="middle">
    <g font-size="60">
      <g transform="translate(-440,0)"><circle cx="0" cy="0" r="54" fill="#f7fee7" stroke="#a3e635" stroke-width="4" filter="url(#sh)"/><text x="0" y="6" dominant-baseline="central">⛏️</text><text x="0" y="84" font-size="20" font-weight="700" fill="#ecfccb">เตรียมดิน</text></g>
      <g transform="translate(-220,0)"><circle cx="0" cy="0" r="54" fill="#f7fee7" stroke="#a3e635" stroke-width="4" filter="url(#sh)"/><text x="0" y="6" dominant-baseline="central">🌰</text><text x="0" y="84" font-size="20" font-weight="700" fill="#ecfccb">เพาะเมล็ด</text></g>
      <g transform="translate(0,0)"><circle cx="0" cy="0" r="54" fill="#f7fee7" stroke="#a3e635" stroke-width="4" filter="url(#sh)"/><text x="0" y="6" dominant-baseline="central">💧</text><text x="0" y="84" font-size="20" font-weight="700" fill="#ecfccb">รดน้ำ</text></g>
      <g transform="translate(220,0)"><circle cx="0" cy="0" r="54" fill="#f7fee7" stroke="#a3e635" stroke-width="4" filter="url(#sh)"/><text x="0" y="6" dominant-baseline="central">🌿</text><text x="0" y="84" font-size="20" font-weight="700" fill="#ecfccb">ดูแล</text></g>
      <g transform="translate(440,0)"><circle cx="0" cy="0" r="54" fill="#fef9c3" stroke="#fde047" stroke-width="5" filter="url(#sh)"/><text x="0" y="6" dominant-baseline="central">🧺</text><text x="0" y="84" font-size="20" font-weight="700" fill="#fde047">เก็บเกี่ยว</text></g>
    </g>
    <g fill="#fde047" font-size="42" font-weight="800">
      <text x="-330" y="6" dominant-baseline="central">➜</text>
      <text x="-110" y="6" dominant-baseline="central">➜</text>
      <text x="110" y="6" dominant-baseline="central">➜</text>
      <text x="330" y="6" dominant-baseline="central">➜</text>
    </g>
  </g>

  <!-- แปลงดิน + ป้ายล่าง -->
  <rect x="0" y="660" width="1280" height="60" fill="url(#soil)"/>
  <g transform="translate(640,684)">
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fef9c3" text-anchor="middle" dominant-baseline="middle">🥬 🍅 🌽 🥕 8 ชนิดผัก · แข่งเร็ว / ฝึกหัด / 🌐 ออนไลน์</text>
  </g>
</svg>
