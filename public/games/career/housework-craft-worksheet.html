<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/career/housework-craft-media.html"><meta name="curriculum-indicators" content="ง 1.1 ป.1/2 · ง 1.1 ป.2/3 · ง 1.1 ป.3/3"><title>ใบงานงานบ้านและงานประดิษฐ์ ป.1–3 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.184.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.184.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:7.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.4mm;margin-bottom:1mm}
.q .q-prompt{font-size:10.5pt;font-weight:800}
.kid-note{font-size:8pt;font-weight:700;color:var(--ws-muted);margin:.6mm 0}
.choice-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;margin:1.2mm 0}
.choice-tile{border:1.5px dashed var(--ws-line);border-radius:6mm;padding:2mm 1mm;text-align:center;font-size:10pt;font-weight:800;line-height:1.35;min-height:14mm;display:flex;flex-direction:column;justify-content:center;gap:.8mm}
.choice-tile .pic{font-size:15pt;line-height:1}
.choice-tile .mark{font-size:10pt;font-weight:800}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 4mm;margin:1.2mm 0}
.match-left,.match-right{display:flex;align-items:center;gap:1.5mm;border:1px solid var(--ws-line);border-radius:3px;padding:1.2mm;font-size:9.5pt;font-weight:800;min-height:9mm}
.match-letter{flex:none;width:7mm;height:7mm;border-radius:50%;background:var(--ws-accent);color:var(--ws-paper);font-size:9pt;font-weight:800;display:flex;align-items:center;justify-content:center}
.write-box{flex:none;width:9mm;height:8mm;border:1.5px solid var(--ws-accent);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10.5pt;font-weight:800;margin-left:auto}
.order-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2mm;margin:1.2mm 0}
.order-tile{border:1px solid var(--ws-line);border-radius:3px;padding:1.5mm 1mm;text-align:center;font-size:9pt;font-weight:800;line-height:1.35;display:flex;flex-direction:column;gap:1mm;align-items:center;justify-content:space-between}
.num-box{width:9mm;height:8mm;border:1.5px solid var(--ws-accent);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11pt;font-weight:800}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .choice-tile{min-height:18mm;font-size:11pt}
.count-5 .q .q-prompt{font-size:11.5pt}
.count-5 .order-tile{min-height:16mm;font-size:10pt}
.count-10 .choice-tile{min-height:11mm;font-size:9pt}
.count-10 .choice-tile .pic{font-size:12pt}
.count-10 .kid-note{display:none}
</style>
</head><body>
<header class="toolbar"><h1>🧹 ใบงานงานบ้านและงานประดิษฐ์</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="1">ป.1</option><option value="2">ป.2</option><option value="3">ป.3</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="housework">งานบ้าน</option><option value="laundry">งานผ้า</option><option value="craft">งานประดิษฐ์</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.184.0"></script><script>
const LETTERS=['ก','ข','ค'];
const ITEMS=[
 {type:'housework',kind:'circle',prompt:'วงกลม ⭕ รอบอุปกรณ์ที่ใช้กวาดพื้น',choices:[['🧹','ไม้กวาด'],['🍳','กระทะ'],['✏️','ดินสอ']],correct:0,answer:'ไม้กวาด'},
 {type:'housework',kind:'circle',prompt:'วงกลม ⭕ รอบอุปกรณ์ที่ใช้ถูพื้น',choices:[['🪣','ถังน้ำ + ผ้าถูพื้น'],['📚','หนังสือ'],['🥄','ช้อน']],correct:0,answer:'ถังน้ำ + ผ้าถูพื้น'},
 {type:'housework',kind:'match',prompt:'จับคู่อุปกรณ์กับงาน — เขียน ก ข ค ลงในช่อง',pairs:[['🧹 ไม้กวาด','กวาดพื้น'],['🧽 ฟองน้ำ','ล้างจาน'],['🗑️ ถังขยะ','ทิ้งขยะ']],rightOrder:[1,2,0],answer:'ก→กวาดพื้น · ข→ล้างจาน · ค→ทิ้งขยะ'},
 {type:'housework',kind:'order',prompt:'เขียนเลข 1 2 3 เรียงลำดับการล้างจาน',steps:['ขูดเศษอาหารทิ้ง','ล้างด้วยน้ำยาล้างจาน','ล้างน้ำสะอาด คว่ำจาน'],display:[1,2,0],answer:'ขูดเศษอาหาร → ล้างน้ำยา → ล้างน้ำสะอาด'},
 {type:'housework',kind:'circle',prompt:'วงกลม ⭕ รอบภาพการเก็บของเล่นที่ถูกต้อง',choices:[['🧸📦','เก็บใส่กล่องให้เป็นที่'],['🧸🛏️','ซ่อนไว้ใต้เตียง'],['🧸🚪','ทิ้งไว้หน้าบ้าน']],correct:0,answer:'เก็บใส่กล่องให้เป็นที่'},
 {type:'laundry',kind:'order',prompt:'เขียนเลข 1 2 3 เรียงลำดับงานผ้า',steps:['ซักผ้า','ตากผ้า','พับผ้าเก็บเข้าตู้'],display:[2,0,1],answer:'ซักผ้า → ตากผ้า → พับผ้า'},
 {type:'laundry',kind:'order',prompt:'เขียนเลข 1 2 3 เรียงลำดับการพับเสื้อ',steps:['วางเสื้อคว่ำบนโต๊ะ','พับแขนเสื้อเข้าทั้งสองข้าง','พับครึ่งตัวเสื้อ'],display:[1,0,2],answer:'วางเสื้อ → พับแขน → พับครึ่ง'},
 {type:'laundry',kind:'circle',prompt:'วงกลม ⭕ รอบอุปกรณ์ที่ใช้ใส่ผ้ารอซัก',choices:[['🧺','ตะกร้าผ้า'],['🍽️','จานข้าว'],['🖍️','สีเทียน']],correct:0,answer:'ตะกร้าผ้า'},
 {type:'laundry',kind:'circle',prompt:'วงกลม ⭕ รอบผ้าที่ใช้เช็ดโต๊ะได้ดีที่สุด',choices:[['🫧','ผ้าชุบน้ำบิดหมาด'],['💧','ผ้าเปียกหยดน้ำ'],['🕸️','ผ้าที่สกปรก']],correct:0,answer:'ผ้าชุบน้ำบิดหมาด'},
 {type:'craft',kind:'match',prompt:'จับคู่อุปกรณ์งานประดิษฐ์กับหน้าที่ — เขียน ก ข ค ลงในช่อง',pairs:[['✂️ กรรไกร','ตัดกระดาษ'],['🧴 กาว','ติดกระดาษ'],['🖍️ สีเทียน','ระบายสี']],rightOrder:[2,0,1],answer:'ก→ตัดกระดาษ · ข→ติดกระดาษ · ค→ระบายสี'},
 {type:'craft',kind:'circle',prompt:'วงกลม ⭕ รอบวิธีส่งกรรไกรที่ปลอดภัย',choices:[['✂️🤲','ส่งด้านด้ามให้เพื่อน'],['✂️👉','หันปลายแหลมให้เพื่อน'],['✂️🎯','โยนให้เพื่อนรับ']],correct:0,answer:'ส่งด้านด้ามให้เพื่อน'},
 {type:'craft',kind:'order',prompt:'เขียนเลข 1 2 3 เรียงลำดับการทำการ์ดอวยพร',steps:['พับกระดาษครึ่งหนึ่ง','วาดรูปและระบายสี','เขียนคำอวยพรข้างใน'],display:[2,1,0],answer:'พับกระดาษ → วาดรูป → เขียนคำอวยพร'},
 {type:'craft',kind:'circle',prompt:'วงกลม ⭕ รอบสิ่งที่ต้องทำเมื่อประดิษฐ์เสร็จ',choices:[['🧹','เก็บอุปกรณ์ ทิ้งเศษกระดาษ'],['🙈','ทิ้งทุกอย่างไว้บนโต๊ะ'],['🏃','ถือกรรไกรวิ่งไปเล่น']],correct:0,answer:'เก็บอุปกรณ์ ทิ้งเศษกระดาษ'}
];
const SKILL={housework:'งานบ้าน',laundry:'งานผ้า',craft:'งานประดิษฐ์'};
window.WORKSHEET_CONFIG={
  worksheetKey:'housework-craft',
  icon:'🧹',title:'ใบงานงานบ้านและงานประดิษฐ์',subject:'การงานอาชีพ',gradeLabel:'ป.1–3',mediaLabel:'งานบ้านและงานประดิษฐ์',
  sourceMediaUrl:'/games/career/housework-craft-media.html',indicators:['ง 1.1 ป.1/2','ง 1.1 ป.2/3','ง 1.1 ป.3/3'],
  directions:'ดูภาพแต่ละข้อ → วงกลม / จับคู่เขียน ก ข ค / เขียนเลขเรียงลำดับ ด้วยตัวบรรจง',
  topicLabels:SKILL,
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    let body='';
    if(item.kind==='circle'){
      body='<div class="choice-row">'+item.choices.map((c,i)=>
        '<div class="choice-tile"><span class="pic">'+e(c[0])+'</span><span>'+e(c[1])+'</span><span class="mark work-fill">'+(i===item.correct?'⭕ ถูกต้อง':'')+'</span></div>'
      ).join('')+'</div><div class="kid-note">✏️ วงกลมได้ 1 คำตอบเท่านั้น</div>';
    }else if(item.kind==='match'){
      body='<div class="match-grid">'+item.rightOrder.map((pairIndex,row)=>
        '<div class="match-left"><span class="match-letter">'+LETTERS[row]+'</span><span>'+e(item.pairs[row][0])+'</span></div>'
        +'<div class="match-right"><span>'+e(item.pairs[pairIndex][1])+'</span><span class="write-box"><span class="work-fill">'+LETTERS[item.rightOrder.indexOf(pairIndex)]+'</span></span></div>'
      ).join('')+'</div><div class="kid-note">✏️ อ่านช่องขวา แล้วเขียนตัวอักษรของอุปกรณ์ที่ใช้</div>';
    }else{
      body='<div class="order-row">'+item.display.map((stepIndex)=>
        '<div class="order-tile"><span>'+e(item.steps[stepIndex])+'</span><span class="num-box"><span class="work-fill">'+(stepIndex+1)+'</span></span></div>'
      ).join('')+'</div><div class="kid-note">✏️ ขั้นแรกสุดเขียนเลข 1 · ขั้นสุดท้ายเขียนเลข '+item.steps.length+'</div>';
    }
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div></div>'
      +'<div class="q-work-block">'+body+'</div>'
      +'<div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.184.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
