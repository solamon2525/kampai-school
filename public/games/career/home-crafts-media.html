<!DOCTYPE html>
<html lang="th"><head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>งานบ้าน-งานประดิษฐ์ — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#c2410c;--accent:#ea580c;--line:#fed7aa;--muted:#475569;--ok:#15803d;--bad:#b91c1c;--ink:#0f172a}
    html,body{max-width:100%;overflow-x:hidden}
    body{font-family:'Sarabun',sans-serif;background:linear-gradient(145deg,#ffedd5,#fed7aa);min-height:100%;padding:12px;color:var(--ink)}
    .shell{max-width:1100px;margin:0 auto;background:#fff;border-radius:1.5rem;box-shadow:0 20px 50px rgba(15,23,42,.12);overflow:hidden;min-height:calc(100vh - 24px);display:flex;flex-direction:column}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--deep),var(--accent));color:#fff}
    header h1{font-size:1.1rem;font-weight:800;flex:1;min-width:160px}
    .badge{font-size:.75rem;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-weight:700}
    .btn{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px}
    .btn:active{transform:scale(.97)}
    .btn:focus-visible,.seg button:focus-visible,.pick button:focus-visible,.ke-bucket-btn:focus-visible,.ke-btn:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
    .btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;font-size:.85rem}
    .btn-primary{background:var(--deep);color:#fff}
    .btn-ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#fff7ed;border-bottom:1px solid var(--line);align-items:center}
    .seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
    .seg button{font-family:inherit;font-weight:800;border:none;background:#fff;color:var(--deep);padding:8px 14px;cursor:pointer;min-height:44px}
    .seg button.on{background:var(--deep);color:#fff}
    .hint{font-size:.88rem;color:var(--deep);font-weight:700;flex:1;min-width:140px}
    .stage{flex:1;padding:16px;overflow:auto}
    .footer{padding:10px 16px;font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
    .practice{display:none;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;width:100%}
    .shell.mode-practice .learn{display:none}.shell.mode-practice .practice{display:flex}
    .learn{max-width:820px;margin:0 auto}
    .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .pick button{font-family:inherit;font-weight:800;font-size:.98rem;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--deep);min-height:44px}
    .pick button.on{background:var(--deep);color:#fff}
    .box{background:#fff7ed;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:600;line-height:1.65;font-size:1.05rem}
    .box h2{color:var(--deep);margin-bottom:8px;font-size:1.4rem}
    .emo{font-size:3rem;margin-bottom:8px}
    .learn-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
    .practice-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
    .practice-note{font-size:.88rem;font-weight:700;color:var(--deep)}
    .ke-classify-card{background:#f8fafc;border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
    .ke-classify-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--deep);font-size:.95rem}
    .ke-classify-item{text-align:center;padding:18px 14px;background:#fff7ed;border:2px dashed #fb923c;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
    .ke-item-icon{font-size:clamp(56px,14vw,84px);line-height:1.05}
    .ke-item-label{font-size:clamp(1.2rem,3vw,1.55rem);font-weight:800;color:var(--ink)}
    .ke-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
    @media (max-width:420px){.ke-buckets{grid-template-columns:1fr}}
    .ke-bucket-btn{font-family:inherit;font-weight:800;font-size:.95rem;min-height:54px;padding:10px 12px;border-radius:14px;border:2px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .12s,border-color .12s,background .12s}
    .ke-bucket-btn[data-bucket-id="housework"]{border-color:#ea580c;background:#fff7ed;color:#7c2d12}
    .ke-bucket-btn[data-bucket-id="craft"]{border-color:#0284c7;background:#f0f9ff;color:#0c4a6e}
    .ke-bucket-btn[data-bucket-id="safety_hygiene"]{border-color:#16a34a;background:#f0fdf4;color:#14532d}
    .ke-bucket-btn.is-correct{outline:3px solid #15803d;background:#dcfce7;color:#14532d}
    .ke-bucket-btn.is-wrong{opacity:.65;text-decoration:line-through}
    .ke-bucket-btn:disabled{cursor:default}
    .ke-classify-feedback{padding:12px 14px;border-radius:12px;font-weight:700;line-height:1.45;background:#fff;border:1.5px solid #cbd5e1;color:var(--ink)}
    .ke-classify-feedback.is-good{background:#dcfce7;border-color:#16a34a;color:#14532d}
    .ke-classify-feedback.is-learn{background:#fef3c7;border-color:#d97706;color:#78350f}
    .ke-btn{font-family:inherit;font-weight:800;font-size:.95rem;min-height:44px;padding:10px 16px;border-radius:12px;border:none;background:var(--deep);color:#fff;cursor:pointer;align-items:center;justify-content:center;gap:6px;align-self:center}
    .ke-classify-summary{text-align:center;padding:24px 16px;background:#fff7ed;border:2px solid var(--line);border-radius:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
    .ke-classify-summary h3{color:var(--deep);font-size:1.3rem;font-weight:800}
    .speech-status{font-size:.85rem;font-weight:700;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 12px;display:none;margin-top:8px}
    .speech-status.show{display:block}
    @media (max-width:600px){body{padding:0}.shell{border-radius:0;min-height:100vh}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}.btn:active{transform:none}}
  </style>
</head><body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back()">← กลับคลังสื่อ</button>
    <h1>🧵 งานบ้านและงานประดิษฐ์</h1>
    <span class="badge">ป.1–3 · การงาน</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
    </span>
    <p class="hint" id="hintText">สื่อการสอน — ไม่เก็บคะแนน</p>
    <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/career/home-crafts-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="learn" id="learn">
      <div class="pick" id="pick"></div>
      <div class="box" id="box"></div>
      <div class="learn-actions">
        <button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>
      </div>
      <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
    </div>
    <div class="practice" id="practice">
      <div class="practice-bar">
        <span class="practice-note">แตะเลือกหมวดหรือกดปุ่มตัวเลข 1–3 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
        <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังเสียง</button>
      </div>
      <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
      <div id="classifyEngineRoot"></div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG='home-crafts-media';
if(window.KAMPAI){
  KAMPAI.setSlug(MEDIA_SLUG);
  if(KAMPAI.sound&&typeof KAMPAI.sound.mountToggles==='function'){
    try{KAMPAI.sound.mountToggles();}catch(_){}
  }
}

const ITEMS=[{"emoji":"🧹","name":"เก็บกวาด","body":"กวาด ถู เก็บของเข้าที่หลังใช้","tip":"ทำทีละมุมห้อง","q":"หลังใช้ของควรทำอะไร?","a":"เก็บเข้าที่"},{"emoji":"🧺","name":"จัดของ","body":"แยกประเภท ของเล่น หนังสือ เสื้อผ้า","tip":"กล่องป้ายชื่อช่วยจำ","q":"จัดของดีอย่างไร?","a":"แยกประเภท / มีที่เก็บ"},{"emoji":"✂️","name":"ตัดปะ","body":"ใช้กรรไกรอย่างปลอดภัย ตัดตามเส้น","tip":"ส่งกรรไกรให้จับด้าม","q":"ส่งกรรไกรอย่างไรให้ปลอดภัย?","a":"จับด้ามส่ง"},{"emoji":"🧷","name":"พับ/ติด","body":"พับกระดาษตรง ใช้กาวแตะบาง ๆ","tip":"กาวเยอะทำให้ยับ","q":"ใช้กาวอย่างไรดี?","a":"แตะบาง ๆ"},{"emoji":"♻️","name":"วัสดุเหลือใช้","body":"กล่อง นมกล่อง กระดาษใช้ซ้ำทำของเล่น","tip":"ล้างให้สะอาดก่อนใช้","q":"ทำไมใช้วัสดุเหลือใช้?","a":"ประหยัด / รักษ์โลก"},{"emoji":"🧼","name":"ล้างมือหลังงาน","body":"หลังประดิษฐ์หรือเก็บบ้านให้ล้างมือ","tip":"ใช้สบู่ถูให้ทั่ว","q":"หลังงานฝีมือควรทำอะไร?","a":"ล้างมือ"}];

const BUCKETS=[
  {id:'housework',label:'งานบ้านและจัดเก็บ',icon:'🧹'},
  {id:'craft',label:'งานประดิษฐ์',icon:'✂️'},
  {id:'safety_hygiene',label:'ปลอดภัยและสะอาด',icon:'🧼'}
];

const CLASSIFY_ITEMS=[
  {id:'sweep',icon:'🧹',label:'กวาดถูห้องหลังใช้งาน',bucketId:'housework',reason:'การกวาดถูและเก็บของเข้าที่เป็นงานบ้านดูแลห้องให้สะอาด'},
  {id:'sort_toys',icon:'🧺',label:'แยกของเล่นและหนังสือใส่กล่อง',bucketId:'housework',reason:'การแยกประเภทและติดป้ายกล่องช่วยให้จัดบ้านเป็นระเบียบ'},
  {id:'fold_clothes',icon:'👕',label:'พับเสื้อผ้าเก็บเข้าตู้ให้เรียบร้อย',bucketId:'housework',reason:'การพับและจัดเก็บเสื้อผ้าเป็นงานบ้านที่ทำได้ทุกวัน'},
  {id:'wipe_table',icon:'🧽',label:'เช็ดโต๊ะและจัดมุมห้องให้เรียบร้อย',bucketId:'housework',reason:'การเช็ดโต๊ะหลังทำกิจกรรมช่วยให้งานบ้านสะอาดน่าอยู่'},
  {id:'cut_paper',icon:'✂️',label:'ตัดกระดาษตามเส้นที่วาดไว้',bucketId:'craft',reason:'การตัดกระดาษตามเส้นเป็นขั้นตอนสำคัญของงานประดิษฐ์'},
  {id:'glue_fold',icon:'🧷',label:'พับกระดาษตรงและทากาวแตะบาง ๆ',bucketId:'craft',reason:'ทากาวแตะบาง ๆ ช่วยให้งานประดิษฐ์เรียบสวยไม่ยับ'},
  {id:'milk_carton',icon:'♻️',label:'นำกล่องนมและกระดาษใช้ซ้ำทำของเล่น',bucketId:'craft',reason:'การนำวัสดุเหลือใช้มาประดิษฐ์ช่วยประหยัดและรักษ์โลก'},
  {id:'paper_craft',icon:'📄',label:'พับและประกอบชิ้นงานกระดาษ',bucketId:'craft',reason:'การพับและติดประกอบเป็นทักษะหลักในงานประดิษฐ์'},
  {id:'pass_scissors',icon:'🤝',label:'ส่งกรรไกรโดยหันด้านด้ามให้เพื่อน',bucketId:'safety_hygiene',reason:'การจับด้ามส่งกรรไกรป้องกันปลายแหลมทิ่มตำมือเพื่อน'},
  {id:'wash_hands',icon:'🧼',label:'ล้างมือด้วยสบู่ให้ทั่วหลังทำงานเสร็จ',bucketId:'safety_hygiene',reason:'หลังเก็บบ้านหรือทำงานฝีมือต้องล้างมือให้สะอาดเสมอ'},
  {id:'wash_carton',icon:'💧',label:'ล้างกล่องนมให้สะอาดก่อนนำมาประดิษฐ์',bucketId:'safety_hygiene',reason:'การล้างวัสดุเหลือใช้ก่อนทำงานช่วยป้องกันกลิ่นและเชื้อโรค'},
  {id:'cap_glue',icon:'🔒',label:'ปิดฝากาวและเก็บอุปกรณ์มีคมเข้ากล่อง',bucketId:'safety_hygiene',reason:'การปิดฝาและเก็บของมีคมเข้าที่ช่วยป้องกันอุบัติเหตุ'}
];

let cur=ITEMS[0];
let mode='learn';
let classifySession=null;

function speakText(text,statusId){
  const clean=String(text||'').trim();
  if(!clean)return;
  const statusEl=document.getElementById(statusId||(mode==='practice'?'speechStatusPractice':'speechStatusLearn'));
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.speakSafe==='function'){
    const res=window.KampaiMediaLab.speakSafe(clean,{lang:'th-TH',rate:0.92});
    if(statusEl){
      if(res&&res.ok===false){
        statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }else{
        statusEl.textContent='';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try{
    if(window.KAMPAI?.sound?.speak){
      KAMPAI.sound.speak(clean,'th-TH',true);
      return;
    }
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='th-TH';
      u.rate=0.92;
      window.speechSynthesis.speak(u);
      return;
    }
  }catch(_){}
  if(statusEl){
    statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
    statusEl.classList.add('show');
  }
}

function stopSpeech(){
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.stopAllSpeech==='function'){
    window.KampaiMediaLab.stopAllSpeech();
  }else{
    try{window.KAMPAI?.sound?.stopSpeak?.();}catch(_){}
    try{window.speechSynthesis?.cancel?.();}catch(_){}
  }
}

function mountClassifyPractice(){
  if(!window.KampaiEngines||!window.KampaiEngines.ClassifyBucket)return;
  classifySession=window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot',{
    items:CLASSIFY_ITEMS,
    buckets:BUCKETS,
    mode:'media',
    roundSize:8,
    onAnswer:function(res){
      if(window.KAMPAI&&window.KAMPAI.sound){
        try{
          if(res.isCorrect)KAMPAI.sound.correct();
          else KAMPAI.sound.wrong();
        }catch(_){}
      }
    }
  });
}

function setMode(m){
  stopSpeech();
  mode=m==='practice'?'practice':'learn';
  document.getElementById('shell').classList.toggle('mode-practice',mode==='practice');
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));
  document.getElementById('hintText').textContent=mode==='learn'?'เลือกหัวข้ออ่าน':'แยกประเภทงานบ้าน งานประดิษฐ์ และความปลอดภัย — ไม่มีคะแนน';
  if(mode==='practice'){
    mountClassifyPractice();
  }else if(window.KampaiEngines?.ClassifyBucket?.cleanup){
    window.KampaiEngines.ClassifyBucket.cleanup();
  }
}

function render(){
  document.getElementById('pick').innerHTML=ITEMS.map((x,i)=>'<button type="button" data-i="'+i+'" class="'+(x===cur?'on':'')+'">'+(x.emoji?x.emoji+' ':'')+x.name+'</button>').join('');
  document.getElementById('box').innerHTML=(cur.emoji?'<div class="emo">'+cur.emoji+'</div>':'')+'<h2>'+cur.name+'</h2><p>'+cur.body+'</p>'+(cur.tip?'<p style="margin-top:10px;color:var(--muted)">💡 '+cur.tip+'</p>':'');
}

document.getElementById('pick').onclick=e=>{
  const b=e.target.closest('[data-i]');
  if(!b)return;
  stopSpeech();
  cur=ITEMS[+b.dataset.i];
  render();
};

document.getElementById('btnSpeakLearn').onclick=()=>{
  speakText(cur.name+' '+cur.body+' เคล็ดลับ '+cur.tip,'speechStatusLearn');
};

document.getElementById('btnSpeakCurrent').onclick=()=>{
  const item=classifySession?.currentItem?.();
  if(item){
    speakText(item.label+' จัดอยู่ในหมวดใด','speechStatusPractice');
  }else{
    speakText('ฝึกจำแนกงานบ้านและงานประดิษฐ์ครบแล้ว กดฝึกใหม่อีกครั้งได้','speechStatusPractice');
  }
};

render();
setMode('learn');
document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button[data-mode]');
  if(!b)return;
  setMode(b.dataset.mode);
};
document.getElementById('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();};

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
window.addEventListener('pagehide',stopSpeech);

window.getState=()=>Object.freeze({
  slug:MEDIA_SLUG,
  mode:mode,
  selectedTopic:cur.name,
  totalItems:CLASSIFY_ITEMS.length,
  bucketsCount:BUCKETS.length,
  classify:classifySession?classifySession.getState():null,
  reducedMotion:typeof window.matchMedia==='function'?Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches):false
});
</script>
</body></html>
