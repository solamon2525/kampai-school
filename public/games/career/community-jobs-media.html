    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }

    .btn:active { transform: scale(.97); }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--cream); border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; flex-wrap: wrap; border-radius: 12px; overflow: hidden; border: 2px solid #fbbf24; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 10px; cursor: pointer; font-size: .78rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #92400e; font-weight: 600; flex: 1; min-width: 120px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .panel { display: none; flex-direction: column; gap: 14px; max-width: 980px; margin: 0 auto; }
    .panel.on { display: flex; }
    .card-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .j-card { perspective: 800px; min-height: 150px; cursor: pointer; border: none; background: transparent; font-family: inherit; padding: 0; }
    .j-inner { position: relative; width: 100%; height: 100%; min-height: 150px; transition: transform .4s; transform-style: preserve-3d; }
    .j-card.flipped .j-inner { transform: rotateY(180deg); }
    .j-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #fff; }
    .j-back { transform: rotateY(180deg); background: var(--cream); text-align: left; align-items: flex-start; justify-content: flex-start; overflow: auto; }
    .j-face .e { font-size: 2.2rem; }
    .j-face .n { font-weight: 800; color: var(--deep); font-size: .95rem; text-align: center; }
    .j-face .s { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .j-back p { font-size: .78rem; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
    .match-layout { display: grid; gap: 12px; }
    @media (min-width: 800px) { .match-layout { grid-template-columns: 1fr 1fr; } }
    .boxes { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow: auto; }
    .box { border: 2px dashed var(--line); border-radius: 12px; padding: 8px; min-height: 56px; background: var(--cream); }
    .box.on { border-color: var(--deep); border-style: solid; }
    .box h4 { font-size: .82rem; font-weight: 800; color: var(--deep); margin-bottom: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 3px 8px; font-weight: 800; font-size: .72rem; }
    .chip.ok { border-color: #86efac; background: #dcfce7; }
    .chip.no { border-color: #fca5a5; background: #fee2e2; }

    .suggest h3 { color: var(--deep); font-weight: 800; margin-bottom: 8px; }
    .fb { text-align: center; font-weight: 800; min-height: 24px; }
    .fb.ok { color: var(--ok); }
    .fb.no { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }

    .practice-mcq .popt.no{background:#fee2e2;border-color:#fca5a5}

      { q: 'ถ้าไม่มีชาวนา/ชาวสวน นานเข้าจะเป็นอย่างไร?', ok: 'อาหารสดในชุมชนอาจขาดแคลนหรือแพงขึ้น', wrong: ['ตัดผมไม่ได้', 'ซ่อมรถง่ายขึ้น'], why: 'เกษตรกรผลิตอาหารหลักให้ชุมชน' },
      { q: 'ถ้าไม่มีหมอและพยาบาล จะเสี่ยงอย่างไร?', ok: 'ผู้ป่วยรักษาช้า โรคอาจลุกลาม', wrong: ['ตลาดปิดถาวร', 'ครูสอนไม่ได้'], why: 'สาธารณสุขรักษาชีวิตและสุขภาพ' },
      { q: 'ถ้าไม่มีช่างไฟในชุมชน?', ok: 'ไฟฟ้าชำรุดอาจเป็นอันตรายและใช้งานไม่ได้', wrong: ['นาข้าวแห้งทันที', 'นักเรียนไม่มีสมุด'], why: 'ช่างไฟช่วยให้ไฟฟ้าใช้ได้อย่างปลอดภัย' },
      { q: 'ถ้าไม่มีตำรวจ/อาสา?', ok: 'ความสงบและช่วยเหลือฉุกเฉินลดลง', wrong: ['ผลไม้หวานขึ้น', 'ตลาดมีของเยอะ'], why: 'อาชีพความปลอดภัยคุ้มครองชุมชน' },
    ];

    const INTERESTS = [
      { id: 'nature', label: '🌱 ชอบปลูกต้นไม้/สัตว์', sectors: ['เกษตร'] },
      { id: 'help', label: '🤝 ชอบช่วยเหลือคน', sectors: ['สาธารณสุข', 'ความปลอดภัย', 'บริการ'] },
      { id: 'fix', label: '🔧 ชอบซ่อมแซมของ', sectors: ['ช่าง'] },
      { id: 'sell', label: '💬 ชอบคุยขายของ', sectors: ['ค้าขาย', 'บริการ'] },
      { id: 'teach', label: '📖 ชอบสอนเพื่อน', sectors: ['การศึกษา'] },
      { id: 'protect', label: '🛡️ ชอบปกป้องความถูกต้อง', sectors: ['ความปลอดภัย'] },
    ];

    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function speak(t) {
      if (window.KAMPAI && KAMPAI.sound && KAMPAI.sound.speak) KAMPAI.sound.speak(t, 'th-TH');
      else if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'th-TH';
        speechSynthesis.speak(u);
      }
    }
    function jobById(id) { return JOBS.find((j) => j.id === id); }

    let mode = 'cards', flipped = {};
    let secSel = null, secPlaced = {}, secChecked = false;
    let whoQ = null, whoAnswered = false;
    let matterQ = null, matterAnswered = false;
    let selfPick = null;

    const hints = {
      cards: 'แตะการ์ดเพื่อพลิกดูหน้าที่ สถานที่ และเครื่องมือ',
      sector: 'แตะอาชีพ แล้วแตะกล่องภาคที่ถูกต้อง',
      who: 'จับคู่: อาชีพนี้ทำงานที่ไหน / ใช้เครื่องมืออะไร',
      matter: 'อ่านสถานการณ์ แล้วเลือกผลกระทบต่อชุมชน',
      self: 'เลือกสิ่งที่ชอบ — ดูอาชีพใกล้เคียง (ไม่มีการตัดสินถูกผิด)',
    };

    
    const PRACTICE_Q = [
  {
    "q": "ครูจัดอยู่ในภาคใด?",
    "opts": [
      "บริการ",
      "เกษตร",
      "อุตสาหกรรมหนัก",
      "ขนส่งทางน้ำ"
    ],
    "a": "บริการ"
  },
  {
    "q": "ชาวนาผลิตอะไรเป็นหลัก?",
    "opts": [
      "ข้าว/พืชผล",
      "รถยนต์",
      "ซอฟต์แวร์",
      "ไฟฟ้า"
    ],
    "a": "ข้าว/พืชผล"
  },
  {
    "q": "ถ้าชุมชนไม่มีพยาบาลจะขาดอะไร?",
    "opts": [
      "การดูแลสุขภาพ",
      "การก่อสร้างถนน",
      "การจับปลา",
      "การตัดผม"
    ],
    "a": "การดูแลสุขภาพ"
  },
  {
    "q": "ช่างซ่อมรถช่วยชุมชนด้านใด?",
    "opts": [
      "ซ่อมยานพาหนะให้ใช้ได้",
      "สอนหนังสือ",
      "ปลูกผัก",
      "รักษาฟัน"
    ],
    "a": "ซ่อมยานพาหนะให้ใช้ได้"
  },
  {
    "q": "อาชีพในภาคอุตสาหกรรมมักเกี่ยวกับ…",
    "opts": [
      "โรงงาน/ผลิตสิ่งของ",
      "ทำนา",
      "ขายของในตลาดนัดเท่านั้น",
      "สอนในโรงเรียน"
    ],
    "a": "โรงงาน/ผลิตสิ่งของ"
  },
  {
    "q": "การเลือกอาชีพควรดูอะไรเป็นหลัก?",
    "opts": [
      "ความสนใจ ทักษะ และประโยชน์ต่อชุมชน",
      "เงินอย่างเดียว",
      "ตามเพื่อนเท่านั้น",
      "อะไรก็ได้"
    ],
    "a": "ความสนใจ ทักษะ และประโยชน์ต่อชุมชน"
  }
];
    function nextPracticeMcq(){
      const item = PRACTICE_Q[(Math.random()*PRACTICE_Q.length)|0];
      const box = document.getElementById('practiceMcq');
      if(!box) return;
      box.querySelector('.pq').textContent = item.q;
      const fb = box.querySelector('.pfb');
      fb.textContent=''; fb.style.color='';
      const opts = item.opts.slice().sort(()=>Math.random()-0.5);
      const popts = box.querySelector('.popts');
      popts.innerHTML = opts.map(o=>'<button type="button" class="popt" data-a="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('');
      popts.querySelectorAll('.popt').forEach(btn=>{
        btn.onclick=()=>{
          const ok = btn.dataset.a === item.a;
          btn.classList.add(ok?'ok':'no');
          popts.querySelectorAll('.popt').forEach(b=>{
            b.disabled=true;
            if(b.dataset.a===item.a) b.classList.add('ok');
          });
          fb.textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: '+item.a;
          fb.style.color = ok ? '#16a34a' : '#dc2626';
          if(window.KAMPAI&&KAMPAI.sound) (ok?KAMPAI.sound.correct:KAMPAI.sound.wrong)();
        };
      });
    }
    document.getElementById('btnPracticeNext')?.addEventListener('click', nextPracticeMcq);

    function setMode(m) {
      mode = m;
      document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
      const pmcq = document.getElementById('practiceMcq');
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('on'));
      if (pmcq) pmcq.classList.toggle('on', m === 'practice');
      if (m === 'practice') {
        const hint = document.getElementById('hintText');
        if (hint) hint.textContent = 'เลือกคำตอบ 4 ตัวเลือก — ฝึกสั้น';
        nextPracticeMcq();
        return;
      }
      document.getElementById('p-' + m).classList.add('on');
      document.getElementById('hintText').textContent = hints[m];
      if (m === 'cards') renderCards();
      if (m === 'sector') { if (!Object.keys(secPlaced).length) resetSector(); else renderSector(); }
      if (m === 'who') { if (!whoQ) nextWho(); else renderWho(); }
      if (m === 'matter') { if (!matterQ) nextMatter(); else renderMatter(); }
      if (m === 'self') renderSelf();
    }

    function renderCards() {
      const el = document.getElementById('p-cards');
      el.innerHTML = '<div class="card-grid">' + JOBS.map((j) =>
        '<button type="button" class="j-card' + (flipped[j.id] ? ' flipped' : '') + '" data-id="' + j.id + '">' +
        '<div class="j-inner"><div class="j-face j-front"><div class="e">' + j.emoji + '</div>' +
        '<div class="n">' + j.nameTh + '</div><div class="s">' + j.sector + ' · ' + j.grade + '</div></div>' +
        '<div class="j-face j-back"><p><strong>ที่ทำงาน:</strong> ' + j.place + '</p>' +
        '<p><strong>ทำอะไร:</strong> ' + j.duty + '</p>' +
        '<p><strong>เครื่องมือ:</strong> ' + j.tools.join(', ') + '</p>' +
        '<p><strong>คุณสมบัติ:</strong> ' + j.skill + '</p></div></div></button>'
      ).join('') + '</div>';
      el.querySelectorAll('.j-card').forEach((b) => {
        b.onclick = function () {
          flipped[b.dataset.id] = !flipped[b.dataset.id];
          const j = jobById(b.dataset.id);
          if (flipped[b.dataset.id]) speak(j.nameTh + ' ' + j.duty);
          renderCards();
        };
      });
    }

    function resetSector() {
      secSel = null; secPlaced = {}; secChecked = false; renderSector();
    }

    function renderSector() {
      const el = document.getElementById('p-sector');
      const remaining = JOBS.filter((j) => !secPlaced[j.id]);
      el.innerHTML =
        '<div class="match-layout"><div class="boxes">' + SECTORS.map((s) => {
          const items = JOBS.filter((j) => secPlaced[j.id] === s);
          return '<div class="box" data-s="' + s + '"><h4>' + s + '</h4><div class="chips">' +
            items.map((j) => {
              let cls = 'chip';
              if (secChecked) cls += j.sector === s ? ' ok' : ' no';
              return '<span class="' + cls + '">' + j.emoji + ' ' + j.nameTh + '</span>';
            }).join('') + '</div></div>';
        }).join('') + '</div><div><div class="pool">' + remaining.map((j) =>
          '<button type="button" class="f-btn' + (secSel === j.id ? ' sel' : '') + '" data-id="' + j.id + '">' + j.emoji + ' ' + j.nameTh + '</button>'
        ).join('') + '</div><p class="fb" id="secFb"></p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" id="btnSecCheck">ตรวจคำตอบ</button>' +
        '<button type="button" class="btn btn-ghost" id="btnSecReset">🔄 เริ่มใหม่</button></div></div></div>';
      el.querySelectorAll('.pool .f-btn').forEach((b) => {
        b.onclick = function () { secSel = b.dataset.id; secChecked = false; renderSector(); };
      });
      el.querySelectorAll('.box').forEach((box) => {
        box.onclick = function () {
          if (!secSel || secChecked) return;
          secPlaced[secSel] = box.dataset.s;
          secSel = null;
          renderSector();
        };
      });
      document.getElementById('btnSecReset').onclick = resetSector;
      document.getElementById('btnSecCheck').onclick = function () {
        if (Object.keys(secPlaced).length < JOBS.length) {
          document.getElementById('secFb').className = 'fb no';
          document.getElementById('secFb').textContent = 'จัดให้ครบทุกอาชีพก่อน';
          return;
        }
        secChecked = true;
        let ok = 0;
        JOBS.forEach((j) => { if (secPlaced[j.id] === j.sector) ok++; });
        renderSector();
        const fb = document.getElementById('secFb');
        fb.className = 'fb ' + (ok === JOBS.length ? 'ok' : 'no');
        fb.textContent = ok === JOBS.length ? '✅ จัดกลุ่มถูกต้องทั้งหมด!' : 'ถูก ' + ok + '/' + JOBS.length;
      };
    }

    function nextWho() {
      const j = JOBS[(Math.random() * JOBS.length) | 0];
      const askPlace = Math.random() < 0.5;
      let opts;
      if (askPlace) {
        const wrong = shuffle(JOBS.filter((x) => x.id !== j.id).map((x) => x.place)).slice(0, 3);
        opts = shuffle([j.place].concat(wrong));
        whoQ = { text: j.emoji + ' ' + j.nameTh + ' ทำงานที่ไหน?', answer: j.place, opts: opts, explain: j.nameTh + ' ทำงานที่ ' + j.place };
      } else {
        const ans = j.tools[0];
        const wrong = shuffle(JOBS.filter((x) => x.id !== j.id).map((x) => x.tools[0])).slice(0, 3);
        opts = shuffle([ans].concat(wrong));
        whoQ = { text: j.emoji + ' ' + j.nameTh + ' ใช้เครื่องมือใดเป็นหลัก?', answer: ans, opts: opts, explain: j.nameTh + ' ใช้เช่น ' + j.tools.join(', ') };
      }
      whoAnswered = false;
      renderWho();
    }

    function renderWho() {
      const el = document.getElementById('p-who');
      el.innerHTML =
        '<div class="q-box"><p class="q-text">' + whoQ.text + '</p><div class="opts">' +
        whoQ.opts.map((o) => '<button type="button" class="opt" data-o="' + o + '">' + o + '</button>').join('') +
        '</div><p class="fb" id="whoFb"></p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" id="btnWhoNext">ข้อถัดไป</button></div></div>';
      el.querySelectorAll('.opt').forEach((b) => {
        b.onclick = function () {
          if (whoAnswered) return;
          whoAnswered = true;
          const ok = b.dataset.o === whoQ.answer;
          el.querySelectorAll('.opt').forEach((x) => {
            if (x.dataset.o === whoQ.answer) x.classList.add('ok');
            else if (x === b) x.classList.add('no');
          });
          const fb = document.getElementById('whoFb');
          fb.className = 'fb ' + (ok ? 'ok' : 'no');
          fb.textContent = (ok ? '✅ ' : '❌ ') + whoQ.explain;
          speak(ok ? 'ถูกต้อง' : whoQ.explain);
        };
      });
      document.getElementById('btnWhoNext').onclick = nextWho;
    }

    function nextMatter() {
      matterQ = MATTER_SCENES[(Math.random() * MATTER_SCENES.length) | 0];
      matterAnswered = false;
      renderMatter();
    }

    function renderMatter() {
      const el = document.getElementById('p-matter');
      const opts = shuffle([matterQ.ok].concat(matterQ.wrong));
      el.innerHTML =
        '<div class="q-box"><p class="q-text">' + matterQ.q + '</p><div class="opts">' +
        opts.map((o) => '<button type="button" class="opt" data-o="' + o.replace(/"/g, '&quot;') + '">' + o + '</button>').join('') +
        '</div><p class="fb" id="matFb"></p>' +
        '<div class="actions"><button type="button" class="btn btn-primary" id="btnMatNext">สถานการณ์ถัดไป</button></div></div>';
      el.querySelectorAll('.opt').forEach((b) => {
        b.onclick = function () {
          if (matterAnswered) return;
          matterAnswered = true;
          const ok = b.dataset.o === matterQ.ok;
          el.querySelectorAll('.opt').forEach((x) => {
            if (x.dataset.o === matterQ.ok) x.classList.add('ok');
            else if (x === b) x.classList.add('no');
          });
          const fb = document.getElementById('matFb');
          fb.className = 'fb ' + (ok ? 'ok' : 'no');
          fb.textContent = (ok ? '✅ ' : '❌ ') + matterQ.why;
        };
      });
      document.getElementById('btnMatNext').onclick = nextMatter;
    }

    function renderSelf() {
      const el = document.getElementById('p-self');
      let suggestHtml = '<p style="font-weight:600;color:var(--muted)">เลือกสิ่งที่ชอบทางซ้าย</p>';
      if (selfPick) {
        const int = INTERESTS.find((i) => i.id === selfPick);
        const matched = JOBS.filter((j) => int.sectors.indexOf(j.sector) >= 0);
        suggestHtml = '<h3>อาชีพที่อาจใกล้เคียงกับคุณ</h3><div class="chips" style="gap:8px">' +
          matched.map((j) => '<span class="chip">' + j.emoji + ' ' + j.nameTh + ' (' + j.sector + ')</span>').join('') +
          '</div><p style="margin-top:10px;font-weight:600;line-height:1.45">💡 ไม่มีคำตอบถูกผิด — สำรวจความสนใจแล้วค่อยเรียนรู้ทักษะทีละน้อย</p>';
      }
      el.innerHTML =
        '<div class="explore"><div class="int-q"><h3>คุณชอบทำอะไร?</h3><div class="int-opts">' +
        INTERESTS.map((i) => '<button type="button" class="' + (selfPick === i.id ? 'on' : '') + '" data-id="' + i.id + '">' + i.label + '</button>').join('') +
        '</div></div><div class="suggest">' + suggestHtml + '</div></div>';
      el.querySelectorAll('.int-opts button').forEach((b) => {
        b.onclick = function () { selfPick = b.dataset.id; speak('ลองดูอาชีพเหล่านี้'); renderSelf(); };
      });
    }

    document.getElementById('modeSeg').onclick = function (e) {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };
    document.getElementById('btnFs').onclick = function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
      else document.exitFullscreen();
    };

    setMode('cards');
  </script>
</body>
</html>
