<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>คัดแยกขยะ 4 ถัง — สื่อการสอน — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #065f46; --line: #6ee7b7; --muted: #475569; --ok: #15803d; --bad: #b91c1c; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(160deg, #ecfdf5, #a7f3d0); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #064e3b, #059669); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 140px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .bin-card:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #ecfdf5; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #34d399; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; font-size: .9rem; min-height: 44px; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #065f46; font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .bins-learn { display: grid; gap: 10px; }
    @media (min-width: 640px) { .bins-learn { grid-template-columns: 1fr 1fr; } }
    .bin-card { border-radius: 16px; padding: 14px; color: #fff; border: none; text-align: left; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 44px; }
    .bin-card.green { background: linear-gradient(160deg, #16a34a, #15803d); }
    .bin-card.yellow { background: linear-gradient(160deg, #fde047, #facc15); color: #1e293b; }
    .bin-card.blue { background: linear-gradient(160deg, #2563eb, #1d4ed8); }
    .bin-card.red { background: linear-gradient(160deg, #dc2626, #b91c1c); }
    .bin-card h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 2px; }
    .bin-card p { font-weight: 600; line-height: 1.45; font-size: .92rem; }
    .bin-card .ex { font-size: 1.4rem; letter-spacing: 4px; }
    .bin-card .say-hint { font-size: .8rem; font-weight: 700; opacity: .92; }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
    .practice.on { display: flex; }
    .learn.hide { display: none; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .ke-classify-card { background: #f8fafc; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-classify-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--deep); font-size: .95rem; }
    .ke-classify-item { text-align: center; padding: 18px 14px; background: #ecfdf5; border: 2px dashed #34d399; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ke-item-icon { font-size: clamp(56px, 14vw, 84px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 800; color: var(--ink); }
    .ke-buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
    .ke-bucket-btn[data-bucket-id="green"] { border-color: #16a34a; background: #f0fdf4; color: #14532d; }
    .ke-bucket-btn[data-bucket-id="yellow"] { border-color: #ca8a04; background: #fefce8; color: #713f12; }
    .ke-bucket-btn[data-bucket-id="blue"] { border-color: #2563eb; background: #eff6ff; color: #1e3a8a; }
    .ke-bucket-btn[data-bucket-id="red"] { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: #ecfdf5; border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .ke-classify-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; }
    .speech-status.show { display: block; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>♻️ คัดแยกขยะ 4 ถัง</h1>
      <span class="badge">ป.1–4 · การงานอาชีพ</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="practice">✏️ ฝึกแยก</button>
      </span>
      <p class="hint" id="hintText">ถังมาตรฐานไทย: เขียว · เหลือง · น้ำเงิน · แดง</p>
      <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶</button>
    </div>
    <div class="stage">
      <div class="learn" id="learn">
        <div class="bins-learn" id="binsLearn">
          <button type="button" class="bin-card green" data-say-bin="green">
            <h3>🟢 เขียว — ขยะเปียก</h3>
            <p>ย่อยสลายได้ · เศษอาหาร ใบไม้ เปลือกผลไม้</p>
            <div class="ex">🍌🥬🍂🍊</div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="bin-card yellow" data-say-bin="yellow">
            <h3>🟡 เหลือง — รีไซเคิล</h3>
            <p>นำกลับใช้ใหม่ · พลาสติกสะอาด กระดาษ แก้ว โลหะ</p>
            <div class="ex">🧴📄🍾🥫</div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="bin-card blue" data-say-bin="blue">
            <h3>🔵 น้ำเงิน — ทั่วไป</h3>
            <p>ย่อยสลายยาก · ไม่อันตราย · ซองขนม ทิชชู่ใช้แล้ว</p>
            <div class="ex">🛍️🍬🧻</div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="bin-card red" data-say-bin="red">
            <h3>🔴 แดง — อันตราย</h3>
            <p>มีสารพิษ / ของมีคม · แบตเตอรี่ หลอดไฟ ยาหมดอายุ</p>
            <div class="ex">🔋💡💊📱</div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
        </div>
        <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
      </div>
      <div class="practice" id="practice">
        <div class="practice-bar">
          <span class="practice-note">แตะเลือกถังหรือกดปุ่มตัวเลข 1–4 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
          <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังโจทย์</button>
        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="classifyEngineRoot"></div>
      </div>
    </div>
    <footer class="footer">ตัวชี้วัด <strong>ง 1.1 ป.3/3</strong> · <strong>ง 1.1 ป.4/4</strong> · คู่เกม <a href="/play/waste-sort">แยกขยะ 4 ถัง</a></footer>
  </div>
  <script>
    const MEDIA_SLUG = 'waste-sort-media';
    if (window.KAMPAI) {
      KAMPAI.setSlug(MEDIA_SLUG);
      if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
        try { KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const BINS = [
      { id: 'green', label: 'ถังเขียว · ขยะเปียก', icon: '🟢', say: 'ถังสีเขียว ขยะเปียก ย่อยสลายได้ เช่น เศษอาหาร ใบไม้ เปลือกผลไม้' },
      { id: 'yellow', label: 'ถังเหลือง · รีไซเคิล', icon: '🟡', say: 'ถังสีเหลือง ขยะรีไซเคิล นำกลับมาใช้ใหม่ได้ เช่น ขวดพลาสติกสะอาด กระดาษ ขวดแก้ว กระป๋อง' },
      { id: 'blue', label: 'ถังน้ำเงิน · ทั่วไป', icon: '🔵', say: 'ถังสีน้ำเงิน ขยะทั่วไป ย่อยสลายยากและไม่อันตราย เช่น ซองขนม ถุงพลาสติกเปื้อน ทิชชู่ใช้แล้ว' },
      { id: 'red', label: 'ถังแดง · อันตราย', icon: '🔴', say: 'ถังสีแดง ขยะอันตราย มีสารพิษหรือโลหะหนัก เช่น ถ่านไฟฉาย หลอดไฟ ยาหมดอายุ มือถือเก่า' },
    ];

    const ITEMS = [
      { id: 'banana', icon: '🍌', label: 'เปลือกกล้วย', bucketId: 'green', reason: 'เศษอาหารย่อยสลายได้ ทำปุ๋ยหมักได้' },
      { id: 'veg', icon: '🥬', label: 'เศษผัก', bucketId: 'green', reason: 'พืชผักย่อยสลายเองได้ตามธรรมชาติ' },
      { id: 'leaf', icon: '🍂', label: 'ใบไม้แห้ง', bucketId: 'green', reason: 'ใบไม้ย่อยสลายได้ ทำปุ๋ยใบไม้' },
      { id: 'rice', icon: '🍚', label: 'เศษข้าว', bucketId: 'green', reason: 'เศษอาหารเหลือ ทิ้งลงถังเปียก' },
      { id: 'bottle', icon: '🧴', label: 'ขวดพลาสติก', bucketId: 'yellow', reason: 'ล้างให้สะอาดแล้วรีไซเคิลได้' },
      { id: 'paper', icon: '📄', label: 'กระดาษ', bucketId: 'yellow', reason: 'กระดาษรีไซเคิลเป็นกระดาษใหม่ได้' },
      { id: 'glass', icon: '🍾', label: 'ขวดแก้ว', bucketId: 'yellow', reason: 'แก้วหลอมขึ้นรูปใหม่ได้' },
      { id: 'can', icon: '🥫', label: 'กระป๋องอะลูมิเนียม', bucketId: 'yellow', reason: 'โลหะนำกลับมาหลอมใช้ใหม่ได้' },
      { id: 'bag', icon: '🛍️', label: 'ถุงพลาสติกเปื้อนอาหาร', bucketId: 'blue', reason: 'เปื้อนอาหาร รีไซเคิลยาก จึงทิ้งถังทั่วไป' },
      { id: 'snack', icon: '🍬', label: 'ซองขนม', bucketId: 'blue', reason: 'ซองหลายชั้นรีไซเคิลไม่ได้' },
      { id: 'tissue', icon: '🧻', label: 'ทิชชู่ใช้แล้ว', bucketId: 'blue', reason: 'เปื้อนแล้วรีไซเคิลไม่ได้' },
      { id: 'battery', icon: '🔋', label: 'ถ่านไฟฉาย', bucketId: 'red', reason: 'มีโลหะหนัก ห้ามทิ้งปนขยะทั่วไป' },
      { id: 'bulb', icon: '💡', label: 'หลอดไฟ', bucketId: 'red', reason: 'หลอดมีสารปรอท เป็นขยะอันตราย' },
      { id: 'med', icon: '💊', label: 'ยาหมดอายุ', bucketId: 'red', reason: 'ยาเก่าปนเปื้อนสิ่งแวดล้อมได้' },
      { id: 'phone', icon: '📱', label: 'มือถือเก่า', bucketId: 'red', reason: 'ขยะอิเล็กทรอนิกส์ มีโลหะหนัก' },
    ];

    let mode = 'learn';
    let classifySession = null;

    function speakText(text, statusId) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.92;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function mountClassifyPractice() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: ITEMS,
        buckets: BINS,
        mode: 'media',
        roundSize: 8,
        onAnswer: function (res) {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      });
    }

    function setMode(nextMode) {
      stopSpeech();
      mode = nextMode === 'practice' ? 'practice' : 'learn';
      document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
      document.getElementById('learn').classList.toggle('hide', mode === 'practice');
      document.getElementById('practice').classList.toggle('on', mode === 'practice');
      document.getElementById('hintText').textContent = mode === 'learn'
        ? 'ถังมาตรฐานไทย: เขียว · เหลือง · น้ำเงิน · แดง'
        : 'ดูขยะแล้วแตะถังให้ถูก — ไม่มีคะแนน';
      if (mode === 'practice') {
        mountClassifyPractice();
      } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
    }

    document.getElementById('modeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b) return;
      setMode(b.dataset.mode);
    });

    document.getElementById('binsLearn').addEventListener('click', (e) => {
      const card = e.target.closest('[data-say-bin]');
      if (!card) return;
      const bin = BINS.find((b) => b.id === card.dataset.sayBin);
      if (bin) speakText(bin.say, 'speechStatusLearn');
    });

    document.getElementById('btnSpeakCurrent').addEventListener('click', () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speakText(item.label + ' ควรทิ้งลงถังสีใด', 'speechStatusPractice');
      } else {
        speakText('ฝึกจำแนกขยะ 4 ถังสำเร็จแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
      }
    });

    document.getElementById('btnFs').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      totalItems: ITEMS.length,
      bucketsCount: BINS.length,
      classify: classifySession ? classifySession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
