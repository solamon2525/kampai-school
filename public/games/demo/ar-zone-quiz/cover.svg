<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2416"/><stop offset="0.6" stop-color="#06100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- zone dividers -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="14 14">
    <line x1="426" y1="120" x2="426" y2="720"/><line x1="853" y1="120" x2="853" y2="720"/>
  </g>
  <!-- zone labels -->
  <g text-anchor="middle" font-family="'Fredoka One','Sarabun',sans-serif">
    <text x="213" y="610" font-size="120" fill="#fbbf24">A</text>
    <text x="640" y="610" font-size="120" fill="#34d399">B</text>
    <text x="1066" y="610" font-size="120" fill="#38bdf8">C</text>
  </g>
  <!-- chibi kid (silhouette) standing center -->
  <g transform="translate(640,470)">
    <circle cx="0" cy="-150" r="56" fill="#fcd9b6"/>
    <rect x="-46" y="-96" width="92" height="120" rx="26" fill="#1e3a8a"/>
    <rect x="-58" y="-86" width="22" height="84" rx="11" fill="#fcd9b6" transform="rotate(-18)"/>
    <rect x="36" y="-86" width="22" height="84" rx="11" fill="#fcd9b6" transform="rotate(18)"/>
    <circle cx="-18" cy="-158" r="7" fill="#222"/><circle cx="18" cy="-158" r="7" fill="#222"/>
    <path d="M -16 -136 Q 0 -124 16 -136" stroke="#222" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- motion sparkles -->
  <g fill="#fbbf24">
    <circle cx="560" cy="300" r="6" opacity="0.8"/><circle cx="720" cy="330" r="5" opacity="0.7"/>
    <circle cx="600" cy="400" r="4" opacity="0.6"/><circle cx="690" cy="260" r="5" opacity="0.7"/>
  </g>
  <!-- title -->
  <text x="640" y="110" text-anchor="middle" font-family="'Fredoka One','Sarabun',sans-serif" font-size="74" fill="#fbbf24" stroke="#06100c" stroke-width="2">AR Zone Quiz</text>
  <text x="640" y="160" text-anchor="middle" font-size="30" fill="#cbd5e1">ยืน (หรือแตะ) ซ้าย · กลาง · ขวา เลือกคำตอบ</text>
  <rect x="980" y="40" width="260" height="46" rx="23" fill="#10b981" opacity="0.9"/>
  <text x="1110" y="71" text-anchor="middle" font-size="24" fill="#06241a" font-weight="700">คณิต/ทั่วไป · ป.4-6</text>
</svg>
