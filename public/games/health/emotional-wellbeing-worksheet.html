<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/health/emotional-wellbeing-media.html"><meta name="curriculum-indicators" content="พ 4.1 ป.1/2,พ 4.1 ป.5/1"><title>ใบงานอารมณ์และการดูแลตนเอง</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>💛 ใบงานอารมณ์และการดูแลตนเอง</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option></select><select class="t-select" id="selGrade"><option value="1">ป.1–ป.6</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'เขียนชื่ออารมณ์ที่รู้จัก 1 อย่าง',answer:'ตามนักเรียน'},{prompt:'เมื่ออารมณ์แรงควรทำอะไร',answer:'หยุดพักและหายใจ'},{prompt:'ใครคือผู้ใหญ่ที่เราไว้ใจ',answer:'ตามนักเรียน'},{prompt:'ทำไมการขอความช่วยเหลือจึงสำคัญ',answer:'ไม่ต้องแก้ปัญหาคนเดียว'},{prompt:'เขียนวิธีดูแลตนเอง 1 วิธี',answer:'นอนพอ/กินอาหาร/ขยับร่างกาย'}];window.WORKSHEET_CONFIG={icon:'💛',title:'ใบงานอารมณ์และการดูแลตนเอง',subject:'สุขศึกษา',gradeLabel:'ป.1–ป.6',mediaLabel:'สื่ออารมณ์และการดูแลตนเอง',sourceMediaUrl:'/games/health/emotional-wellbeing-media.html',indicators:['พ 4.1 ป.1/2','พ 4.1 ป.5/1'],directions:'สังเกตอารมณ์และเขียนวิธีดูแลตนเองอย่างปลอดภัย',getItems:()=>ITEMS,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line"><div class="prompt"><strong>'+e(item.prompt)+'</strong></div><div class="answer-line">คำตอบ <span class="blank long"></span></div><div class="reason-line">สิ่งที่ช่วยได้ <span class="blank long"></span></div><div class="answer teacher-answer">แนวทาง: '+e(item.answer)+'</div></div>';}};function render(){window.KampaiTopicWorksheet.render()}window.addEventListener('load',()=>{document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();});</script><script src="/games/worksheet-topic.js?v=2.0.0"></script><script src="/games/worksheet-modes.js?v=2.0.0"></script></body></html>
