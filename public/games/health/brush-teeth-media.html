<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪥 แปรงฟันถูกวิธี — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #0e7490; --line: #a5f3fc; --muted: #475569; --ok: #15803d; --bad: #b91c1c; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #a5f3fc, #cffafe); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #155e75, #0e7490); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 160px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .dot:focus-visible, .pbtn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; font-size: .9rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: var(--deep); font-weight: 600; flex: 1; min-width: 140px; }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-bottom: 1px solid #fcd34d; padding: 8px 16px; display: none; }
    .speech-status.show { display: block; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }

    .layout { display: grid; gap: 14px; }
    @media (min-width: 860px) { .layout { grid-template-columns: 1fr 1fr; } }
    .visual { display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(180deg, #e0f2fe, #cffafe); border-radius: 16px; padding: 20px; }
    .emo { width: 140px; height: 140px; border-radius: 50%; background: #fff; border: 4px solid #67e8f9; display: grid; place-items: center; font-size: 4.5rem; }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .dot { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #67e8f9; background: #fff; font-weight: 800; color: var(--deep); cursor: pointer; font-family: inherit; }
    .dot.on { background: var(--deep); color: #fff; }
    .detail { display: flex; flex-direction: column; gap: 10px; }
    .num { align-self: flex-start; background: var(--deep); color: #fff; font-weight: 800; border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
    .title { font-size: 1.35rem; font-weight: 800; color: var(--deep); }
    .body { font-weight: 600; line-height: 1.55; }
    .tip { background: #fff; border: 2px dashed #67e8f9; border-radius: 12px; padding: 10px; font-weight: 600; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .practice { display: none; max-width: 560px; margin: 0 auto; flex-direction: column; gap: 12px; width: 100%; }
    .shell.mode-practice .learn { display: none; }
    .shell.mode-practice .practice { display: flex; }
    .prompt { font-weight: 800; color: var(--deep); text-align: center; background: #ecfeff; border: 2px dashed #67e8f9; border-radius: 14px; padding: 12px; }
    .pool { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 440px) { .pool { grid-template-columns: 1fr; } }
    .pbtn { font-family: inherit; font-weight: 700; border: 2px solid var(--line); border-radius: 14px; background: #fff; padding: 12px; cursor: pointer; text-align: left; min-height: 48px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
    .pbtn.done { opacity: .45; pointer-events: none; background: #dcfce7; }
    .pbtn.bad { background: #fee2e2; border-color: #fca5a5; }
    .track { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .slot { width: 44px; height: 44px; border-radius: 12px; border: 2px dashed #67e8f9; display: grid; place-items: center; font-weight: 800; color: #0e7490; }
    .slot.filled { background: #dcfce7; border-color: #86efac; color: #166534; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
    <h1>🪥 แปรงฟันถูกวิธี</h1>
    <span class="badge">ป.3 · สุขศึกษา</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
    </span>
    <p class="hint" id="hintText">เรียนทีละขั้น · กดเล่นวนได้ — ไม่เก็บคะแนน</p>
    <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/health/brush-teeth-media-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="speech-status" id="speechStatus" role="status" aria-live="polite"></div>
  <div class="stage" id="stage">
    <div class="learn" id="learn">
      <div class="layout">
        <div class="visual">
          <div class="emo" id="emo">🪥</div>
          <div class="dots" id="dots"></div>
        </div>
        <div class="detail">
          <span class="num" id="dNum">ขั้นที่ 1</span>
          <h2 class="title" id="dTitle"></h2>
          <p class="body" id="dBody"></p>
          <p class="tip" id="dTip"></p>
          <div class="actions">
            <button type="button" class="btn btn-ghost" id="btnPrev">← ก่อนหน้า</button>
            <button type="button" class="btn btn-primary" id="btnNext">ถัดไป →</button>
            <button type="button" class="btn btn-accent" id="btnPlay">▶ เล่นวน</button>
            <button type="button" class="btn btn-ghost" id="btnSpeak">🔊 ฟังขั้นนี้</button>
          </div>
        </div>
      </div>
    </div>
    <div class="practice" id="practice">
      <p class="prompt">เรียงขั้นตอนแปรงฟันให้ถูกต้อง (1 → 6)</p>
      <div class="track" id="track"></div>
      <div class="pool" id="pool"></div>
      <p id="prFb" style="font-weight:800;text-align:center;min-height:24px"></p>
      <div class="actions" style="justify-content:center">
        <button type="button" class="btn btn-ghost" id="btnSpeakOrder">🔊 ฟังคำใบ้</button>
        <button type="button" class="btn btn-ghost" id="btnResetPr">เริ่มใหม่</button>
      </div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG = 'brush-teeth-media';
if (window.KAMPAI) {
  KAMPAI.setSlug(MEDIA_SLUG);
  if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
    try { KAMPAI.sound.mountToggles(); } catch (_) {}
  }
}

const STEPS = [
  { emo: '🚰', title: 'เตรียมแปรงและน้ำ', body: 'เลือกแปรงขนนุ่ม เปียกน้ำเล็กน้อย บีบยาสีฟันขนาดเมล็ดถั่ว', tip: 'เด็กเล็กใช้ยาสีฟันผสมฟลูออไรด์ตามอายุ' },
  { emo: '😬', title: 'แปรงด้านนอก', body: 'แปรงฟันด้านที่เห็นเมื่อยิ้ม บน–ล่าง วนเบา ๆ', tip: 'อย่าแปรงแรงเกินไป อาจทำเหงือกเป็นแผล' },
  { emo: '🦷', title: 'แปรงด้านใน', body: 'เงย/ก้มแปรงด้านในใกล้ลิ้นและเพดาน', tip: 'ด้านในทำความสะอาดยาก อย่าลืม' },
  { emo: '🌽', title: 'แปรงบดเคี้ยว', body: 'ถูไปมาบนด้านบดเคี้ยวของฟันกราม', tip: 'เศษอาหารมักค้างตรงนี้' },
  { emo: '👅', title: 'แปรงลิ้นเบา ๆ', body: 'ปาดลิ้นจากโคนมาปลายเพื่อลดกลิ่นปาก', tip: 'อย่าแรงจนเจ็บ' },
  { emo: '💦', title: 'บ้วนปากและล้างแปรง', body: 'บ้วนน้ำให้สะอาด ล้างแปรงตั้งให้แห้ง', tip: 'แปรงฟันเช้า–ก่อนนอนอย่างน้อยวันละ 2 ครั้ง' }
];

const motionQuery = typeof window.matchMedia === 'function'
  ? window.matchMedia('(prefers-reduced-motion: reduce)')
  : null;

let i = 0;
let timer = null;
let mode = 'learn';
let order = [];
let pool = [];

function speakText(text) {
  const clean = String(text || '').trim();
  if (!clean) return;
  const statusEl = document.getElementById('speechStatus');
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
    const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
    if (statusEl) {
      if (res && res.ok === false) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      } else {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try {
    if (window.KAMPAI?.sound?.speak) {
      KAMPAI.sound.speak(clean, 'th-TH', true);
      return;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'th-TH';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
      return;
    }
  } catch (_) {}
  if (statusEl) {
    statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
    statusEl.classList.add('show');
  }
}

function stopSpeech() {
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
    window.KampaiMediaLab.stopAllSpeech();
  } else {
    try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
    try { window.speechSynthesis?.cancel?.(); } catch (_) {}
  }
  const statusEl = document.getElementById('speechStatus');
  if (statusEl) {
    statusEl.textContent = '';
    statusEl.classList.remove('show');
  }
}

function stopTimer() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
  const btn = document.getElementById('btnPlay');
  if (btn) btn.textContent = '▶ เล่นวน';
}

function setMode(m) {
  stopSpeech();
  stopTimer();
  mode = m === 'practice' ? 'practice' : 'learn';
  document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
  document.getElementById('shell').classList.toggle('mode-practice', mode === 'practice');
  document.getElementById('hintText').textContent = mode === 'learn'
    ? 'เรียนทีละขั้น · กดเล่นวนได้ — ไม่เก็บคะแนน'
    : 'เรียงลำดับขั้นตอนแปรงฟัน 1 → 6 — ไม่มีคะแนน';
  if (mode === 'practice') resetPractice();
}

function show() {
  const s = STEPS[i];
  document.getElementById('emo').textContent = s.emo;
  document.getElementById('dNum').textContent = 'ขั้นที่ ' + (i + 1);
  document.getElementById('dTitle').textContent = s.title;
  document.getElementById('dBody').textContent = s.body;
  document.getElementById('dTip').textContent = '💡 ' + s.tip;
  document.getElementById('dots').innerHTML = STEPS.map((_, k) =>
    '<button type="button" class="dot ' + (k === i ? 'on' : '') + '" data-i="' + k + '" aria-label="ขั้นที่ ' + (k + 1) + '">' + (k + 1) + '</button>'
  ).join('');
}

document.getElementById('dots').onclick = (e) => {
  const b = e.target.closest('.dot');
  if (!b) return;
  stopSpeech();
  i = +b.dataset.i;
  show();
};
document.getElementById('btnPrev').onclick = () => {
  stopSpeech();
  i = (i - 1 + STEPS.length) % STEPS.length;
  show();
};
document.getElementById('btnNext').onclick = () => {
  stopSpeech();
  i = (i + 1) % STEPS.length;
  show();
};
document.getElementById('btnSpeak').onclick = () => {
  const s = STEPS[i];
  speakText('ขั้นที่ ' + (i + 1) + ' ' + s.title + ' ' + s.body + ' ' + s.tip);
};
document.getElementById('btnPlay').onclick = () => {
  if (timer) {
    stopTimer();
    return;
  }
  if (motionQuery && motionQuery.matches) {
    document.getElementById('hintText').textContent = 'เปิดโหมดลดการเคลื่อนไหวอยู่ — กด “ถัดไป” เพื่อดูทีละขั้น';
    return;
  }
  document.getElementById('btnPlay').textContent = '⏸ หยุด';
  timer = setInterval(() => {
    i = (i + 1) % STEPS.length;
    show();
  }, 2200);
};

function resetPractice() {
  stopSpeech();
  order = [];
  pool = STEPS.map((s, idx) => ({ idx, label: s.title, emo: s.emo })).sort(() => Math.random() - 0.5);
  renderPractice();
  const fb = document.getElementById('prFb');
  fb.textContent = '';
  fb.style.color = '';
}

function renderPractice() {
  document.getElementById('track').innerHTML = STEPS.map((_, k) =>
    '<div class="slot ' + (order[k] != null ? 'filled' : '') + '">' + (order[k] != null ? order[k] + 1 : (k + 1)) + '</div>'
  ).join('');
  document.getElementById('pool').innerHTML = pool.map((p) =>
    '<button type="button" class="pbtn" data-i="' + p.idx + '"><span style="font-size:1.4rem">' + p.emo + '</span><span>' + p.label + '</span></button>'
  ).join('');
}

document.getElementById('pool').onclick = (e) => {
  const b = e.target.closest('.pbtn');
  if (!b) return;
  const idx = +b.dataset.i;
  const expect = order.length;
  const fb = document.getElementById('prFb');
  if (idx === expect) {
    order.push(idx);
    pool = pool.filter((p) => p.idx !== idx);
    b.classList.add('done');
    renderPractice();
    if (order.length === STEPS.length) {
      fb.textContent = '✅ เรียงถูกต้องทั้งหมด! แปรงฟันสะอาดครบ 6 ขั้น';
      fb.style.color = 'var(--ok)';
      if (window.KAMPAI && KAMPAI.sound) { try { KAMPAI.sound.correct(); } catch (_) {} }
    } else {
      fb.textContent = '✓ ถูกต้อง! ขั้นต่อไปคือขั้นที่ ' + (order.length + 1);
      fb.style.color = 'var(--ok)';
    }
  } else {
    b.classList.add('bad');
    fb.textContent = 'ยังไม่ใช่ขั้นที่ ' + (expect + 1) + ' — ลองนึกว่าต้องทำอะไรต่อ';
    fb.style.color = 'var(--bad)';
    if (window.KAMPAI && KAMPAI.sound) { try { KAMPAI.sound.wrong(); } catch (_) {} }
    setTimeout(() => b.classList.remove('bad'), 400);
  }
};

document.getElementById('btnSpeakOrder').onclick = () => {
  const expect = order.length;
  if (expect < STEPS.length) {
    speakText('กำลังหาขั้นที่ ' + (expect + 1) + ' คำใบ้: ' + STEPS[expect].body);
  } else {
    speakText('เรียงขั้นตอนแปรงฟันครบทั้ง 6 ขั้นแล้ว เก่งมากครับ');
  }
};

document.getElementById('btnResetPr').onclick = resetPractice;

document.getElementById('modeSeg').onclick = (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) setMode(b.dataset.mode);
};

document.getElementById('btnBack').onclick = () => {
  stopSpeech();
  stopTimer();
  if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
  else history.back();
};

document.getElementById('btnFs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopSpeech();
    stopTimer();
  }
});
window.addEventListener('pagehide', () => {
  stopSpeech();
  stopTimer();
});

show();
setMode('learn');

window.getState = () => Object.freeze({
  slug: MEDIA_SLUG,
  mode: mode,
  stepIndex: i,
  totalSteps: STEPS.length,
  isAutoPlaying: Boolean(timer),
  practiceOrder: order.slice(),
  reducedMotion: Boolean(motionQuery && motionQuery.matches),
});
</script>
</body>
</html>
