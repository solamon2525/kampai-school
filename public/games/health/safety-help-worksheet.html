<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/health/safety-help-media.html"><meta name="curriculum-indicators" content="พ 5.1 ป.1/1,พ 5.1 ป.4/1"><title>ใบงานความปลอดภัยและการขอความช่วยเหลือ</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>🆘 ใบงานความปลอดภัยและการขอความช่วยเหลือ</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option></select><select class="t-select" id="selGrade"><option value="1">ป.1–ป.6</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'เมื่อเห็นอันตราย ขั้นแรกควรทำอะไร',answer:'หยุดและถอยไปที่ปลอดภัย'},{prompt:'ยกตัวอย่างผู้ใหญ่ที่ไว้ใจ',answer:'ครู/ผู้ปกครอง/เจ้าหน้าที่'},{prompt:'เมื่อต้องขอความช่วยเหลือควรบอกอะไร',answer:'เหตุการณ์และสถานที่'},{prompt:'ทำไมไม่ควรกลับไปจุดอันตราย',answer:'อาจเกิดอันตรายซ้ำ'},{prompt:'เขียนประโยคขอความช่วยเหลือ',answer:'ช่วยด้วย เกิดเหตุที่...'}];window.WORKSHEET_CONFIG={icon:'🆘',title:'ใบงานความปลอดภัยและการขอความช่วยเหลือ',subject:'สุขศึกษา',gradeLabel:'ป.1–ป.6',mediaLabel:'สื่อความปลอดภัยและการขอความช่วยเหลือ',sourceMediaUrl:'/games/health/safety-help-media.html',indicators:['พ 5.1 ป.1/1','พ 5.1 ป.4/1'],directions:'เรียงขั้นตอนและเขียนข้อความขอความช่วยเหลือ',getItems:()=>ITEMS,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="work-line reason-line"><div class="prompt"><strong>'+e(item.prompt)+'</strong></div><div class="answer-line">คำตอบ <span class="blank long"></span></div><div class="reason-line">เหตุผล / สถานที่ <span class="blank long"></span></div><div class="answer teacher-answer">แนวทาง: '+e(item.answer)+'</div></div>';}};function render(){window.KampaiTopicWorksheet.render()}window.addEventListener('load',()=>{document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();});</script><script src="/games/worksheet-topic.js?v=2.0.0"></script><script src="/games/worksheet-modes.js?v=2.0.0"></script></body></html>
