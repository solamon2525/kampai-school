<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/><stop offset="0.55" stop-color="#166534"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.28"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🥗</text>
  <text x="1110" y="170" font-size="180" opacity="0.08" text-anchor="middle" dominant-baseline="middle">💪</text>

  <g transform="translate(640,116)">
    <rect x="-190" y="-26" width="380" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#dcfce7" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · สุขศึกษา ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">จัดจานสุขภาพ</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">เลือกอาหารให้ครบ 5 หมู่ — แข็งแรงสมบูรณ์</text>

  <!-- จาน + อาหาร 5 หมู่ -->
  <g transform="translate(640,512)">
    <circle cx="0" cy="0" r="118" fill="#f8fafc" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <text x="0" y="-44" font-size="52" text-anchor="middle" dominant-baseline="middle">🍗</text>
    <text x="50" y="6" font-size="52" text-anchor="middle" dominant-baseline="middle">🍚</text>
    <text x="22" y="62" font-size="52" text-anchor="middle" dominant-baseline="middle">🥦</text>
    <text x="-40" y="56" font-size="52" text-anchor="middle" dominant-baseline="middle">🍎</text>
    <text x="-52" y="-8" font-size="48" text-anchor="middle" dominant-baseline="middle">🧈</text>
  </g>
  <g transform="translate(640,648)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">โปรตีน · แป้ง · ผัก · ผลไม้ · ไขมัน · แข่งสด</text>
  </g>
</svg>
