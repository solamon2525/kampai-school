<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>กระดูก–กล้ามเนื้อควิซ — Bone Muscle Quest (kampai)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Kanit', sans-serif; color: #fff; overflow: hidden; }
body { background: linear-gradient(180deg, #0e7490, #0f172a); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#hud { display: none; align-items: center; justify-content: center; padding: 14px 18px; gap: 10px; }
#hud.on { display: flex; }
#score { font-size: 26px; font-weight: 700; color: #FFD700; background: rgba(0,0,0,.35); padding: 4px 16px; border-radius: 999px; }
#timer-wrap { height: 8px; background: rgba(255,255,255,.12); margin: 0 18px; border-radius: 999px; overflow: hidden; display: none; }
#timer-wrap.on { display: block; }
#timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg,#4ade80,#22c55e); border-radius: 999px; transition: width .1s linear; }
#timer-bar.warn { background: linear-gradient(90deg,#f87171,#ef4444); }
#play { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
#play.on { display: flex; }
#q-emoji { font-size: clamp(52px, 14vw, 88px); line-height: 1; }
#q { font-size: clamp(20px, 5.5vw, 28px); font-weight: 700; text-align: center; max-width: 460px; line-height: 1.35; }
#hint { font-size: 15px; color: #a5f3fc; }
#ans { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 420px; }
.a { font-size: clamp(18px, 5vw, 24px); font-weight: 700; padding: 16px 12px; min-height: 48px; border: none; border-radius: 16px; cursor: pointer; color: #0f172a; background: #f8fafc; box-shadow: 0 5px 0 #cbd5e1; }
.a:active { transform: translateY(4px); box-shadow: 0 1px 0 #cbd5e1; }
.a.correct { background: linear-gradient(135deg,#86efac,#22c55e); }
.a.wrong { background: linear-gradient(135deg,#fca5a5,#ef4444); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: rgba(15,23,42,.92); }
.screen.off { display: none; }
h1 { font-size: 30px; background: linear-gradient(135deg,#FFD700,#FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#final { color: #FFD700; font-size: 46px; font-weight: 700; }
.btn { padding: 14px 30px; font-family: inherit; font-size: 19px; font-weight: 600; border: none; border-radius: 999px; color: #fff; cursor: pointer; min-height: 48px; }
.btn-primary { background: linear-gradient(45deg,#22c55e,#16a34a); }
.btn-versus { background: linear-gradient(45deg,#f59e0b,#f97316); }
.btn-blue { background: linear-gradient(45deg,#3b82f6,#2563eb); }
p.sub { color: #cbd5e1; max-width: 420px; line-height: 1.45; }
</style>
</head>
<body>
<div id="app">
    <div id="hud"><div id="score">⭐ <span id="score-v">0</span></div></div>
    <div id="timer-wrap"><div id="timer-bar"></div></div>
    <div id="play">
        <div id="q-emoji">🦴</div>
        <div id="hint">นี่คืออะไร?</div>
        <div id="q">กะโหลกศีรษะ</div>
        <div id="ans"></div>
    </div>
</div>

<div id="start" class="screen">
    <h1>🦴 กระดูก–กล้ามเนื้อควิซ</h1>
    <p class="sub">ดูอวัยวะ/การกระทำ แล้วเลือกว่าเป็น <b>กระดูก · กล้ามเนื้อ · ข้อต่อ</b> ตอบให้ถูกมากที่สุดใน 50 วินาที</p>
    <button class="btn btn-primary" onclick="startSingle()">▶ เริ่มเกม (เดี่ยว)</button>
    <button class="btn btn-versus" onclick="vs.openMenu()">🏁 แข่ง 2 คน</button>
</div>

<div id="over" class="screen off">
    <h1>จบเกม!</h1><p>คะแนนของคุณ</p><div id="final">0</div>
    <div id="kampai-result"></div>
    <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
    <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
</div>

<script src="/games/kampai-sdk.js"></script>
<script>window.KAMPAI = window.KAMPAI || { isEmbed:false, ready:true, student:null, stats:null, leaderboard:[], classmates:[], onReady:function(cb){cb(this);}, setSlug:function(){return this;}, beginRound:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}}, online:{available:false} };</script>
<script src="/games/kampai-match.js"></script>
<script>window.KampaiMatch = window.KampaiMatch || { create:function(){ return { available:false, openMenu:function(){ alert('โหมดออนไลน์เล่นผ่านระบบ /play เท่านั้น'); }, report:function(){}, finish:function(){}, leave:function(){} }; } };</script>
<script src="/games/kampai-versus.js"></script>
<script>window.KampaiVersus = window.KampaiVersus || { create:function(o){ var m=(window.KampaiMatch&&window.KampaiMatch.create)?window.KampaiMatch.create(o):null; return { available:false, openMenu:function(){ if(m)m.openMenu(); }, report:function(s,i){ if(m)m.report(s,i); }, finish:function(s,i){ if(m){m.finish(s,i);return true;} return false; }, leave:function(){}, mode:null }; } };</script>

<script>
const GAME_SLUG = 'bone-muscle-quest';
const DURATION = 50;
KAMPAI.setSlug(GAME_SLUG);
const $ = (id) => document.getElementById(id);

const LABELS = { bone: '🦴 กระดูก', muscle: '💪 กล้ามเนื้อ', joint: '🔄 ข้อต่อ' };
const KINDS = ['bone', 'muscle', 'joint'];
const BANK = [
    { emoji: '💀', q: 'กะโหลกศีรษะ', ans: 'bone' },
    { emoji: '🦴', q: 'กระดูกสันหลัง', ans: 'bone' },
    { emoji: '🫁', q: 'ซี่โครง (คุ้มครองหัวใจ–ปอด)', ans: 'bone' },
    { emoji: '💪', q: 'กระดูกต้นแขน', ans: 'bone' },
    { emoji: '🦵', q: 'กระดูกโคนขา', ans: 'bone' },
    { emoji: '🦷', q: 'ฟัน (แข็งแรงสำหรับเคี้ยว)', ans: 'bone' },
    { emoji: '💪', q: 'กล้ามเนื้อต้นแขน (งอแขน)', ans: 'muscle' },
    { emoji: '🏋️', q: 'กล้ามเนื้อหน้าท้อง', ans: 'muscle' },
    { emoji: '🦵', q: 'กล้ามเนื้อต้นขา (ช่วยเดิน–วิ่ง)', ans: 'muscle' },
    { emoji: '🦶', q: 'กล้ามเนื้อน่อง (ยกส้นเท้า)', ans: 'muscle' },
    { emoji: '❤️', q: 'หัวใจ (สูบฉีดเลือด)', ans: 'muscle' },
    { emoji: '😮', q: 'กล้ามเนื้อใบหน้า (ยิ้ม–พูด)', ans: 'muscle' },
    { emoji: '➡️', q: 'แขนงอที่ข้อศอก', ans: 'joint' },
    { emoji: '🦵', q: 'ข้อเข่า (งอ–เหยียดขา)', ans: 'joint' },
    { emoji: '🔄', q: 'ข้อไหล่ (ยก–หมุนแขน)', ans: 'joint' },
    { emoji: '🤚', q: 'ข้อมือ (พลิกมือได้)', ans: 'joint' },
    { emoji: '🦴', q: 'ข้อสะโพก (รับน้ำหนักยืน)', ans: 'joint' },
    { emoji: '🦶', q: 'ข้อเท้า (ช่วยทรงตัว)', ans: 'joint' },
];

const vs = KampaiVersus.create({
    duration: DURATION,
    title: 'กระดูก–กล้ามเนื้อควิซ',
    rankBy: 'score',
    onPlay: ({ rng, player }) => startRound(rng, player),
    onEnd:  () => { locked = true; },
});

let qrand = Math.random, score = 0, correct = 0, cur = null, locked = false;
let singleMode = false, singleTimer = 0, tickId = 0, timeLeft = DURATION;
let queue = [], qi = 0;

function startSingle() {
    singleMode = true;
    startRound(Math.random, null);
    clearTimeout(singleTimer);
    clearInterval(tickId);
    timeLeft = DURATION;
    $('timer-wrap').classList.add('on');
    updateBar();
    tickId = setInterval(() => {
        timeLeft -= 0.1;
        if (timeLeft <= 0) { timeLeft = 0; updateBar(); locked = true; endGame(); return; }
        updateBar();
    }, 100);
    singleTimer = setTimeout(() => { locked = true; endGame(); }, DURATION * 1000);
}

function updateBar() {
    const bar = $('timer-bar');
    bar.style.width = ((timeLeft / DURATION) * 100) + '%';
    bar.classList.toggle('warn', timeLeft <= 10);
}

function startRound(rng, player) {
    qrand = rng || Math.random; score = 0; correct = 0; locked = false; qi = 0;
    if (player !== null) { singleMode = false; $('timer-wrap').classList.remove('on'); }
    KAMPAI.beginRound();
    KAMPAI.sound.unlock();
    $('start').classList.add('off'); $('over').classList.add('off');
    $('hud').classList.add('on'); $('play').classList.add('on');
    $('score-v').textContent = 0;
    queue = BANK.slice().sort(() => qrand() - 0.5);
    nextQ();
}

function nextQ() {
    locked = false;
    if (qi >= queue.length) { queue = BANK.slice().sort(() => qrand() - 0.5); qi = 0; }
    cur = queue[qi++];
    $('q-emoji').textContent = cur.emoji;
    $('q').textContent = cur.q;
    $('ans').innerHTML = KINDS.map((k) =>
        `<button class="a" onclick="answer('${k}',this)">${LABELS[k]}</button>`
    ).join('');
}

function answer(v, btn) {
    if (locked || !cur) return; locked = true;
    const buttons = [...$('ans').querySelectorAll('.a')];
    if (v === cur.ans) {
        btn.classList.add('correct'); correct++; score += 10;
        $('score-v').textContent = score;
        KAMPAI.sound.correct();
        vs.report(score, { correct });
        setTimeout(nextQ, 320);
    } else {
        btn.classList.add('wrong');
        buttons.forEach((b) => { if (b.textContent === LABELS[cur.ans]) b.classList.add('correct'); });
        KAMPAI.sound.wrong();
        setTimeout(nextQ, 700);
    }
}

function endGame() {
    if (vs.finish(score, { correct })) return;
    clearTimeout(singleTimer); clearInterval(tickId);
    KAMPAI.sound.gameOver();
    KAMPAI.submitScore(score, { mode: 'normal', correct });
    $('hud').classList.remove('on'); $('play').classList.remove('on'); $('timer-wrap').classList.remove('on');
    $('final').textContent = score; $('over').classList.remove('off');
}

KAMPAI.onReady(function () { KAMPAI.sound.mountToggles(); KAMPAI.sound.defaultBgm('playful'); });
</script>
</body>
</html>
