const LABEL_ITEMS=[
 {type:'read',name:'นมรสจืด',serving:'1 กล่อง',energy:120,sugar:8,fat:4,sodium:90,ask:'อาหารนี้มีน้ำตาลกี่กรัมต่อหนึ่งหน่วยบริโภค',answer:'8 กรัม'},

 {type:'read',name:'ขนมอบกรอบ',serving:'ครึ่งถุง',energy:160,sugar:5,fat:8,sodium:240,ask:'โซเดียมต่อหนึ่งหน่วยบริโภคเท่าไร',answer:'240 มิลลิกรัม'},

 {type:'calculate',name:'ซีเรียล',serving:'1 ถ้วย',energy:130,sugar:9,fat:2,sodium:150,ask:'ถ้ากิน 2 ถ้วย จะได้รับพลังงานและน้ำตาลเท่าไร',answer:'260 กิโลแคลอรี และน้ำตาล 18 กรัม'},
 {type:'calculate',name:'นมถั่วเหลือง',serving:'1 กล่อง',energy:100,sugar:6,fat:3,sodium:80,ask:'ถ้าดื่ม 2 กล่อง จะได้รับโซเดียมเท่าไร',answer:'160 มิลลิกรัม'},
 {type:'calculate',name:'คุกกี้',serving:'2 ชิ้น',energy:140,sugar:10,fat:7,sodium:120,ask:'ถ้ากิน 4 ชิ้น จะได้รับน้ำตาลเท่าไร',answer:'20 กรัม'},
 {type:'calculate',name:'มันฝรั่งอบ',serving:'ครึ่งถุง',energy:170,sugar:2,fat:9,sodium:260,ask:'ถ้ากินหมดถุง จะได้รับพลังงานเท่าไร',answer:'340 กิโลแคลอรี'},
 {type:'decide',name:'เครื่องดื่ม A',serving:'1 ขวด',energy:90,sugar:18,fat:0,sodium:35,ask:'ถ้าต้องการลดน้ำตาล ควรดื่มบ่อยหรือเป็นครั้งคราว เพราะอะไร',answer:'เป็นครั้งคราว เพราะน้ำตาล 18 กรัม'},

window.WORKSHEET_CONFIG={icon:'🏷️',title:'ใบงานอ่านฉลากโภชนาการ',subject:'สุขศึกษา',gradeLabel:'ป.4',mediaLabel:'อ่านฉลากโภชนาการ',sourceMediaUrl:'/games/health/food-label-media.html',indicators:['พ 4.1 ป.4/3'],directions:'อ่านหน่วยบริโภค คำนวณ และตัดสินใจโดยอ้างค่าจากฉลาก',getItems(topic){return topic==='mixed'?LABEL_ITEMS:LABEL_ITEMS.filter(item=>item.type===topic);},buildLabelWork(item){if(item.type==='read'){const field=item.ask.includes('น้ำตาล')?'น้ำตาล = '+item.sugar+' g':item.ask.includes('โซเดียม')?'โซเดียม = '+item.sodium+' mg':item.ask.includes('พลังงาน')?'พลังงาน = '+item.energy+' kcal':'อ่านจากตารางฉลาก';return{line1:'อ่านค่า: '+field,line2:'ตอบ: '+item.answer};}if(item.type==='calculate'){const m=item.ask.match(/(\d+)/);const n=m?parseInt(m[1],10):2;if(item.ask.includes('พลังงาน')&&item.ask.includes('น้ำตาล'))return{line1:'พลังงาน '+item.energy+'×'+n+'='+item.energy*n+' · น้ำตาล '+item.sugar+'×'+n+'='+item.sugar*n,line2:'ตอบ: '+item.answer};if(item.ask.includes('โซเดียม'))return{line1:'โซเดียม '+item.sodium+' mg × '+n+' = '+(item.sodium*n)+' mg',line2:'ตอบ: '+item.answer};if(item.ask.includes('น้ำตาล'))return{line1:'น้ำตาล '+item.sugar+' g × '+n+' = '+(item.sugar*n)+' g',line2:'ตอบ: '+item.answer};return{line1:'พลังงาน '+item.energy+'×'+n+'='+(item.energy*n)+' kcal',line2:'ตอบ: '+item.answer};}return{line1:'พิจารณา: น้ำตาล '+item.sugar+' g · โซเดียม '+item.sodium+' mg · ไขมัน '+item.fat+' g',line2:item.answer};},renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;const work=this.buildLabelWork(item);return '<div class="q-stem"><div class="q-prompt">'+e(item.ask)+'</div><table class="nutrition-label"><tr><th colspan="4">'+e(item.name)+' · หน่วยบริโภค '+e(item.serving)+'</th></tr><tr><td>พลังงาน<br>'+item.energy+' kcal</td><td>น้ำตาล<br>'+item.sugar+' g</td><td>ไขมัน<br>'+item.fat+' g</td><td>โซเดียม<br>'+item.sodium+' mg</td></tr></table><div>คำนวณ/ค่าที่ใช้ตัดสินใจ</div></div><div class="q-work-block"><div class="calc-line"><span class="work-fill">'+e(work.line1)+'</span></div><div class="calc-line"><span class="work-fill">'+e(work.line2)+'</span></div></div><div class="q-foot decision-box">คำตอบและเหตุผล: <span class="decision-fill">'+e(item.answer)+'</span></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.199.1"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.199.1"></script></body></html>
