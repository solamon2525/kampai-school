<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/><stop offset="0.55" stop-color="#061f36"/><stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="0.5" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  
  <!-- พื้นหลังธีมชีวภาพ -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  
  <!-- เม็ดเลือดแดงจางๆ ในฉากหลัง -->
  <circle cx="150" cy="200" r="30" fill="#ef4444" opacity="0.04"/>
  <circle cx="1080" cy="180" r="45" fill="#ef4444" opacity="0.03"/>
  <circle cx="1120" cy="540" r="35" fill="#ef4444" opacity="0.05"/>
  <circle cx="200" cy="550" r="25" fill="#ef4444" opacity="0.04"/>

  <!-- แถบประดับหัวบน -->
  <g transform="translate(640,116)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#dbeafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · สุขศึกษา &amp; วิทยาศาสตร์ · ป.4-ป.6</text>
  </g>
  
  <!-- ชื่อเกมหลัก -->
  <text x="640" y="278" font-size="118" font-weight="800" fill="url(#textGold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">Bio-Defense</text>
  <text x="640" y="374" font-size="44" font-weight="700" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">ศึกภูมิคุ้มกันร่างกาย</text>

  <!-- รายละเอียดไอเทมและกราฟิกตกแต่งด้านล่าง -->
  <!-- ท่อหลอดเลือดจำลอง (The Blood Vessel Path) -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#sh)">
    <path d="M 100,540 L 400,540 L 400,600 L 880,600 L 880,540 L 1180,540" fill="none" stroke="#b91c1c" stroke-width="48"/>
    <path d="M 100,540 L 400,540 L 400,600 L 880,600 L 880,540 L 1180,540" fill="none" stroke="#dc2626" stroke-width="40"/>
    <path d="M 100,540 L 400,540 L 400,600 L 880,600 L 880,540 L 1180,540" fill="none" stroke="#ef4444" stroke-width="14" stroke-dasharray="10 25"/>
  </g>

  <!-- มอนสเตอร์เชื้อโรคหลากสีกำลังเคลื่อนที่ -->
  <!-- 🦠 ไวรัสไข้หวัด -->
  <g transform="translate(180,540)" filter="url(#sh)">
    <circle cx="0" cy="0" r="38" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="2" font-size="52" text-anchor="middle" dominant-baseline="middle">🦠</text>
  </g>
  <!-- 🧫 แบคทีเรียเจ็บคอ -->
  <g transform="translate(300,540)" filter="url(#sh)">
    <circle cx="0" cy="0" r="42" fill="rgba(236,72,153,0.15)" stroke="#ec4899" stroke-width="3"/>
    <text x="0" y="3" font-size="56" text-anchor="middle" dominant-baseline="middle">🧫</text>
  </g>
  <!-- 🐛 พยาธิยักษ์ Boss -->
  <g transform="translate(1020,540)" filter="url(#sh)">
    <circle cx="0" cy="0" r="50" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="4"/>
    <text x="0" y="3" font-size="68" text-anchor="middle" dominant-baseline="middle">🐛</text>
  </g>

  <!-- ป้อมเม็ดเลือดขาว White Blood Cells วางอยู่รอบนอก -->
  <!-- 🛡️ Neutrophil Tower -->
  <g transform="translate(520,500)" filter="url(#sh)">
    <circle cx="0" cy="0" r="32" fill="#0b1220" stroke="#34d399" stroke-width="4"/>
    <line x1="0" y1="0" x2="30" y2="-15" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="2" font-size="28" text-anchor="middle" dominant-baseline="middle">🛡️</text>
  </g>
  
  <!-- 🧬 B-Cell Tower -->
  <g transform="translate(720,500)" filter="url(#sh)">
    <circle cx="0" cy="0" r="32" fill="#0b1220" stroke="#a78bfa" stroke-width="4"/>
    <line x1="0" y1="0" x2="-26" y2="-20" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="2" font-size="28" text-anchor="middle" dominant-baseline="middle">🧬</text>
  </g>
  
  <!-- 🌀 Macrophage Tower -->
  <g transform="translate(620,674)" filter="url(#sh)">
    <circle cx="0" cy="0" r="32" fill="#0b1220" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
    <text x="0" y="2" font-size="28" text-anchor="middle" dominant-baseline="middle">🌀</text>
  </g>

  <!-- คำโฆษณาแท็บล่างสุด -->
  <g transform="translate(640,668)" opacity="0.85">
    <rect x="-300" y="-22" width="600" height="44" rx="22" fill="#10b981" opacity="0.16"/>
    <text x="0" y="2" font-size="20" font-weight="700" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">ตอบควิซวิชาการชิงบัฟพลังงาน 🧠 · ยิงสโลว์ ❄️ · ท่าไม้ตายระเบิดยา 💊</text>
  </g>
</svg>
