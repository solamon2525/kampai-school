<script src="/games/worksheet-runtime.js?v=1.175.11"></script><script>
const HAND_ITEMS=[
{type:'order',prompt:'ขั้นที่ 1 ของการล้างมือคืออะไร',context:'7 ขั้นตามสื่อ',choices:['ฝ่ามือถูฝ่ามือ','ข้อมือ','ปลายนิ้ว'],answer:'ฝ่ามือถูฝ่ามือ',step1:'เริ่มทาสบู่ที่ฝ่ามือ',step2:'ถูฝ่ามือเข้าหากัน',step3:'ขั้น 1 = ฝ่ามือถูฝ่ามือ'},
{type:'order',prompt:'ขั้นที่ 2 คืออะไร',context:'หลังฝ่ามือถูฝ่ามือ',choices:['ฝ่ามือถูหลังมือ','ประสานนิ้ว','หลังนิ้ว'],answer:'ฝ่ามือถูหลังมือ',step1:'ฝ่ามือข้างหนึ่งถูหลังมืออีกข้าง',step2:'สลับมือ',step3:'ขั้น 2 = ฝ่ามือถูหลังมือ'},
{type:'order',prompt:'ขั้นที่ 3 คืออะไร',context:'หลังขั้น 2',choices:['ประสานนิ้ว','นิ้วหัวแม่มือ','ข้อมือ'],answer:'ประสานนิ้ว',step1:'ประสานนิ้วมือเข้าหากัน',step2:'ถูซอกนิ้วไปมา',step3:'ขั้น 3 = ประสานนิ้ว'},
{type:'order',prompt:'ขั้นที่ 4–7 เรียงถูกต้อง',context:'4→5→6→7',choices:['หลังนิ้ว→หัวแม่มือ→ปลายนิ้ว→ข้อมือ','ข้อมือ→ปลายนิ้ว→หลังนิ้ว→หัวแม่มือ'],answer:'หลังนิ้ว → หัวแม่มือ → ปลายนิ้ว → ข้อมือ',step1:'4 หลังนิ้ว · 5 หัวแม่มือ',step2:'6 ปลายนิ้ว · 7 ข้อมือ+ล้างน้ำ',step3:'ลำดับครบ 7 ขั้น'},
{type:'detail',prompt:'ขั้น "หลังนิ้ว" ทำอย่างไร',context:'✊ หลังนิ้ว',choices:['กำมือ เอานิ้วถูฝ่ามือ สลับมือ','ประสานนิ้วถูซอก'],answer:'กำมือ เอานิ้วมือถูฝ่ามืออีกข้าง สลับมือ',step1:'กำมือ (fist)',step2:'นิ้วถูฝ่ามืออีกข้าง',step3:'สลับมือทั้งสองข้าง'},
{type:'detail',prompt:'ขั้น "นิ้วหัวแม่มือ" ทำอย่างไร',context:'👍 หัวแม่มือ',choices:['บีบหมุนหัวแม่มือ สลับมือ','ถูปลายนิ้วลงฝ่ามือ'],answer:'บีบนิ้วหัวแม่มือของมือหนึ่งด้วยมืออีกข้าง หมุนโรล สลับมือ',step1:'หัวแม่มือจับของบ่อย',step2:'บีบ+หมุนโรล',step3:'สลับมือ'},

];
window.WORKSHEET_CONFIG={icon:'🧼',title:'ใบงานล้างมือ 7 ขั้น',subject:'สุขศึกษา',gradeLabel:'ป.1–4',mediaLabel:'ล้างมือ 7 ขั้น',sourceMediaUrl:'/games/health/handwash-media.html',indicators:['พ 4.1 ป.1/1','ว 1.2 ป.1/2'],directions:'เรียนลำดับ 7 ขั้นล้างมือจากสื่อ อธิบายวิธีทำ และเชื่อมกับการดูแลสุขภาพ',getItems(topic){return topic==='mixed'?HAND_ITEMS:HAND_ITEMS.filter(i=>i.type===topic);},renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;let stem='<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>';if(item.context)stem+='<div class="q-context">'+e(item.context)+'</div>';if(item.choices)stem+='<div class="classify-grid">'+item.choices.map(c=>'<div class="classify-box">'+e(c)+'</div>').join('')+'</div>';stem+='<div>ลงวิธีคิด 3 ขั้น</div></div>';return stem+'<div class="q-work-block"><div class="reason-line"><span class="work-fill">'+e(item.step1)+'</span></div><div class="reason-line"><span class="work-fill">'+e(item.step2)+'</span></div><div class="reason-line"><span class="work-fill">'+e(item.step3)+'</span></div></div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.175.11"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.11"></script></body></html>
