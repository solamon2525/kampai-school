<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/health/handwash-media.html"><meta name="curriculum-indicators" content="พ 4.1 ป.1/1, ว 1.2 ป.1/2"><title>ใบงานล้างมือ 7 ขั้น ป.1–4 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.13" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.13" rel="stylesheet">
<style>
.hw-flow{display:flex;flex-wrap:wrap;gap:1mm;align-items:center;justify-content:center;margin:1mm 0}
.hw-step{border:1px solid var(--ws-line);border-radius:4px;padding:.7mm 1.2mm;font-size:6.5pt;font-weight:700;min-width:12mm;text-align:center;background:var(--ws-soft)}
.hw-step.ask{border-style:dashed;border-color:var(--ws-accent-2);color:var(--ws-accent);background:var(--ws-paper)}
.hw-arrow{color:var(--ws-accent);font-weight:800}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>

<header class="toolbar"><h1>🧼 ใบงานล้างมือ 7 ขั้น</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="1">ป.1</option><option value="2">ป.2</option><option value="3">ป.3</option><option value="4">ป.4</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="order">เรียงลำดับ 7 ขั้น</option><option value="detail">รายละเอียดแต่ละขั้น</option><option value="why">ทำไมต้องทำ</option><option value="apply">นำไปใช้</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.13"></script><script>
const SEVEN=['1 ฝ่ามือ','2 หลังมือ','3 ประสานนิ้ว','4 หลังนิ้ว','5 หัวแม่มือ','6 ปลายนิ้ว','7 ข้อมือ'];
const HAND_ITEMS=[
{type:'order',prompt:'ขั้นที่ 1 ของการล้างมือคืออะไร',flow:['?','2 หลังมือ','3 ประสานนิ้ว','…'],answer:'ฝ่ามือถูฝ่ามือ',s1:'เริ่มทาสบู่',s2:'ถูฝ่ามือเข้าหากัน',s3:'ขั้น 1 = ฝ่ามือถูฝ่ามือ'},
{type:'order',prompt:'ขั้นที่ 2 คืออะไร',flow:['1 ฝ่ามือ','?','3 ประสานนิ้ว','…'],answer:'ฝ่ามือถูหลังมือ',s1:'หลังขั้นฝ่ามือ',s2:'ฝ่ามือถูหลังมือ สลับ',s3:'ขั้น 2'},
{type:'order',prompt:'ขั้นที่ 3 คืออะไร',flow:['1','2','?','4…'],answer:'ประสานนิ้ว',s1:'ถูซอกนิ้ว',s2:'ประสานนิ้วไปมา',s3:'ขั้น 3'},
{type:'order',prompt:'ขั้นที่ 4–7 เรียงถูกต้อง',flow:['4 ?','5 ?','6 ?','7 ?'],answer:'หลังนิ้ว → หัวแม่มือ → ปลายนิ้ว → ข้อมือ',s1:'4 หลังนิ้ว · 5 หัวแม่มือ',s2:'6 ปลายนิ้ว · 7 ข้อมือ',s3:'ล้างน้ำครบ'},
{type:'detail',prompt:'ขั้น "หลังนิ้ว" ทำอย่างไร',flow:['4 หลังนิ้ว'],answer:'กำมือ เอานิ้วมือถูฝ่ามืออีกข้าง สลับมือ',s1:'กำมือ',s2:'นิ้วถูฝ่ามืออีกข้าง',s3:'สลับมือ'},
{type:'detail',prompt:'ขั้น "นิ้วหัวแม่มือ" ทำอย่างไร',flow:['5 หัวแม่มือ'],answer:'บีบนิ้วหัวแม่มือ หมุนโรล สลับมือ',s1:'หัวแม่มือจับของบ่อย',s2:'บีบ+หมุน',s3:'สลับมือ'},
{type:'detail',prompt:'ขั้น "ปลายนิ้ว" ทำอย่างไร',flow:['6 ปลายนิ้ว'],answer:'ประสานนิ้ว ถูปลายลงฝ่ามือ สลับมือ',s1:'ปลายนิ้วสัมผัสมาก',s2:'ถูลงฝ่ามือ',s3:'สลับมือ'},
{type:'detail',prompt:'ขั้นสุดท้าย (ข้อมือ) ทำอย่างไร',flow:['7 ข้อมือ'],answer:'ถูรอบข้อมือทั้งสองข้าง แล้วล้างน้ำให้หมด',s1:'ข้อมือมักถูกลืม',s2:'ถูรอบข้อมือ',s3:'ล้างน้ำ ≥20 วินาที'},
{type:'why',prompt:'ทำไมต้องล้างมือก่อนกินอาหาร',flow:['ก่อนกิน'],answer:'ลดเชื้อโรคและสิ่งสกปรกที่ติดมือ',s1:'มือสัมผัสหลายอย่าง',s2:'เชื้อเข้าปากได้',s3:'7 ขั้นล้างทุกจุด'},
{type:'why',prompt:'ทำไมขั้น "ประสานนิ้ว" สำคัญ',flow:['3 ประสานนิ้ว'],answer:'ซอกนิ้วมักมีเชื้อโรค ต้องถูไปมา',s1:'ซอกนิ้วล้างยาก',s2:'ต้องถู',s3:'ไม่ข้ามขั้น'},
{type:'apply',prompt:'เมื่อไหร่ควรล้างมือ 3 กรณี',flow:['ชีวิตประจำวัน'],answer:'ก่อนกิน · หลังเข้าห้องน้ำ · หลังเล่น/สัมผัสสัตว์',s1:'เลือกกิจกรรมที่มือสกปรก',s2:'เชื่อม 7 ขั้น',s3:'ทำเป็นประจำ'},
{type:'apply',prompt:'ถ้าข้ามขั้น "ข้อมือ" จะเกิดอะไร',flow:['7 ข้อมือ'],answer:'เชื้อโรคอาจเหลือที่ข้อมือและติดสู่สิ่งอื่น',s1:'ข้อมือสัมผัสโต๊ะ/ประตู',s2:'ข้าม = ล้างไม่ครบ',s3:'ต้องครบ 7 ขั้น'}
];
function sevenFlow(flow){
  const e=window.KampaiTopicWorksheet.escapeHtml;
  if(flow && flow.length && flow.some(s=>String(s).includes('?'))){
    return '<div class="hw-flow">'+flow.map((s,i)=>'<span class="hw-step'+(String(s).includes('?')?' ask':'')+'">'+e(s)+'</span>'+(i<flow.length-1?'<span class="hw-arrow">→</span>':'')).join('')+'</div>';
  }
  return '<div class="hw-flow">'+SEVEN.map((s,i)=>'<span class="hw-step">'+e(s)+'</span>'+(i<6?'<span class="hw-arrow">→</span>':'')).join('')+'</div>';
}
window.WORKSHEET_CONFIG={
  worksheetKey:'handwash',icon:'🧼',title:'ใบงานล้างมือ 7 ขั้น',subject:'สุขศึกษา',gradeLabel:'ป.1–4',mediaLabel:'ล้างมือ 7 ขั้น',
  sourceMediaUrl:'/games/health/handwash-media.html',indicators:['พ 4.1 ป.1/1','ว 1.2 ป.1/2'],
  directions:'เรียง 7 ขั้นจากสื่อ · อธิบายวิธีทำ · เชื่อมสุขภาพ',
  getItems(t){return t==='mixed'?HAND_ITEMS:HAND_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'+sevenFlow(item.flow)+'</div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ลำดับ</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 วิธีทำ</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 ทำไม</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.13"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.13"></script></body></html>
