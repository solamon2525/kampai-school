<html lang="th">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />

    .btn:focus-visible, .seg button:focus-visible, .hs:focus-visible, .care-card:focus-visible, .popt:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

    .btn-primary { background: var(--deep); color: #fff; }
    .btn-accent { background: #fbbf24; color: #78350f; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--cream); border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; flex-wrap: wrap; border-radius: 12px; overflow: hidden; border: 2px solid #22d3ee; max-width: 100%; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 12px; cursor: pointer; font-size: .82rem; min-height: 44px; flex: 1 1 auto; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #155e75; font-weight: 600; flex: 1; min-width: 120px; }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-bottom: 1px solid #fcd34d; padding: 8px 16px; display: none; }
    .speech-status.show { display: block; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .panel { display: none; flex-direction: column; gap: 14px; max-width: 980px; margin: 0 auto; }

    .learn-layout { display: grid; gap: 14px; }
    @media (min-width: 860px) { .learn-layout { grid-template-columns: 1.05fr 1fr; } }

    .diagram { width: 100%; max-width: 280px; aspect-ratio: 3/5; position: relative; background: #fff; border-radius: 18px; border: 2px solid var(--line); overflow: hidden; }
    .body-svg { width: 100%; height: 100%; display: block; }
    .hs { position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(15,23,42,.25); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; z-index: 2; }
    .hs.bone { background: #fbbf24; }
    .hs.muscle { background: #f87171; }
    .hs.joint { background: #60a5fa; }
    .hs.on { outline: 3px solid #0891b2; outline-offset: 2px; transform: translate(-50%, -50%) scale(1.1); }
    .hs.target { animation: pulse 1s infinite; outline: 3px dashed #f59e0b; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)} 50%{box-shadow:0 0 0 8px rgba(245,158,11,0)} }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: .78rem; font-weight: 800; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .detail { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
    .detail h3 { color: var(--deep); font-weight: 800; font-size: 1.25rem; }
    .kind-tag { align-self: flex-start; font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; color: #fff; }
    .kind-tag.bone { background: #b45309; }
    .kind-tag.muscle { background: #b91c1c; }
    .kind-tag.joint { background: #1d4ed8; }
    .detail p { font-weight: 600; line-height: 1.5; }
    .facts { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .facts li { font-weight: 600; font-size: .9rem; background: var(--cream); border-radius: 8px; padding: 6px 10px; }
    .tip { background: #fffbeb; border: 2px dashed #fcd34d; border-radius: 12px; padding: 10px; font-weight: 700; color: #92400e; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

    .ke-item-sub { font-size: .92rem; font-weight: 600; color: var(--muted); }
    .ke-buckets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 560px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; }
    .ke-bucket-btn[data-bucket-id="bone"] { border-color: #d97706; background: #fffbeb; color: #78350f; }
    .ke-bucket-btn[data-bucket-id="muscle"] { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
    .ke-bucket-btn[data-bucket-id="joint"] { border-color: #0284c7; background: #f0f9ff; color: #0c4a6e; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: var(--cream); border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 680px; margin: 0 auto; width: 100%; }
    .care-grid { display: grid; gap: 10px; }
    @media (min-width: 700px) { .care-grid { grid-template-columns: 1fr 1fr; } }
    .care-card { font-family: inherit; text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; cursor: pointer; min-height: 44px; }
    .care-card .lab { font-weight: 800; color: var(--deep); margin-bottom: 4px; }
    .care-card .why { font-weight: 600; font-size: .85rem; color: var(--muted); display: none; line-height: 1.45; }
    .care-card.ok { background: #dcfce7; border-color: #86efac; }

    .fb { text-align: center; font-weight: 800; min-height: 24px; }

    .fb.no { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }

    .practice-mcq { display: none; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; padding: 8px 0; width: 100%; }

    .practice-mcq .popt.ok { background: #dcfce7; border-color: #16a34a; }
    .practice-mcq .popt.no { background: #fee2e2; border-color: #fca5a5; opacity: .75; }

    @media (max-width: 600px) {

<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
      <h1>🦴 กระดูก · กล้ามเนื้อ · ข้อ</h1>
      <span class="badge">ป.4–5 · สุขศึกษา</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">

        <button type="button" data-mode="care">💚 ดูแลร่างกาย</button>

        <button type="button" data-mode="practice">✏️ ฝึกสั้น</button>

          <button type="button" class="btn btn-ghost" id="btnPracticeSpeak">🔊 ฟังคำถาม</button>

  <script>
    const MEDIA_SLUG = 'bone-muscle-media';
    if (window.KAMPAI) {
      KAMPAI.setSlug(MEDIA_SLUG);
      if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
        try { KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const KIND_TH = { bone: 'กระดูก', muscle: 'กล้ามเนื้อ', joint: 'ข้อ' };

    const PARTS = [
      { id: 'skull', kind: 'bone', nameTh: 'กะโหลกศีรษะ', emoji: '💀', functionTh: 'คุ้มครองสมองและอวัยวะในศีรษะ', careTip: 'สวมหมวกนิรภัยเมื่อขี่จักรยานหรือเล่นกีฬาที่เสี่ยงชนหัว', hotspot: { x: 50, y: 8 }, facts: ['กระดูกหลายชิ้นเชื่อมแน่น', 'มีโพรงจมูกและเบ้าตา', 'คุ้มครองอวัยวะสำคัญ'] },
      { id: 'spine', kind: 'bone', nameTh: 'กระดูกสันหลัง', emoji: '🦴', functionTh: 'ค้ำลำตัวและปกป้องไขสันหลัง', careTip: 'นั่งหลังตรง พักยืดหลังทุก 30–45 นาที', hotspot: { x: 50, y: 38 }, facts: ['ประกอบด้วยกระดูกปล้องเรียงกัน', 'ช่วยให้หลังงอได้', 'รองรับน้ำหนักร่างกาย'] },
      { id: 'ribs', kind: 'bone', nameTh: 'ซี่โครง', emoji: '🫁', functionTh: 'ป้องกันหัวใจและปอด', careTip: 'หายใจเข้าลึก ๆ และอย่าบีบหน้าท้องแน่นเกินไปนาน ๆ', hotspot: { x: 50, y: 28 }, facts: ['โค้งรอบทรวงอก', 'เชื่อมกับกระดูกอกและสันหลัง', 'เคลื่อนตามการหายใจ'] },
      { id: 'humerus', kind: 'bone', nameTh: 'กระดูกต้นแขน', emoji: '💪', functionTh: 'เป็นแกนแขนส่วนบน ช่วยยกและหมุนแขน', careTip: 'ยกของหนักด้วยท่าถูกต้อง อย่ากระชากแขน', hotspot: { x: 28, y: 32 }, facts: ['กระดูกยาวของแขนบน', 'เชื่อมไหล่กับข้อศอก', 'กล้ามเนื้อเกาะรอบ'] },
      { id: 'femur', kind: 'bone', nameTh: 'กระดูกโคนขา', emoji: '🦵', functionTh: 'รับน้ำหนักตัวและช่วยเดิน', careTip: 'อบอุ่นกล้ามเนื้อก่อนวิ่ง/กระโดด ป้องกันบาดเจ็บ', hotspot: { x: 42, y: 62 }, facts: ['กระดูกยาวที่แข็งแรงที่สุด', 'เชื่อมข้อสะโพกกับเข่า', 'มีไขกระดูกสร้างเม็ดเลือด'] },
      { id: 'biceps', kind: 'muscle', nameTh: 'กล้ามเนื้อต้นแขน', emoji: '💪', functionTh: 'งอแขนและยกของขึ้น', careTip: 'ออกกำลังแขนสม่ำเสมอ และยืดหลังออกแรง', hotspot: { x: 22, y: 36 }, facts: ['หดตัวเมื่องอข้อศอก', 'ทำงานคู่กับกล้ามเนื้อหลังแขน', 'ต้องการโปรตีนและพักฟื้น'] },
      { id: 'abs', kind: 'muscle', nameTh: 'กล้ามเนื้อหน้าท้อง', emoji: '🏋️', functionTh: 'ช่วยทรงตัว รองรับอวัยวะในท้อง', careTip: 'ฝึกแกนกลางด้วยท่าซิทอัพ/แพลงก์อย่างปลอดภัย', hotspot: { x: 50, y: 44 }, facts: ['ช่วยหายใจและไอ', 'รองรับหลังส่วนล่าง', 'ทำงานเมื่อยกของ'] },
      { id: 'quad', kind: 'muscle', nameTh: 'กล้ามเนื้อต้นขา', emoji: '🦵', functionTh: 'เหยียดเข่า ช่วยยืน เดิน วิ่ง', careTip: 'วอร์มขาและยืดต้นขาก่อนวิ่ง', hotspot: { x: 58, y: 58 }, facts: ['กลุ่มกล้ามเนื้อใหญ่ด้านหน้าขา', 'ใช้แรงมากตอนขึ้นบันได', 'แข็งแรงช่วยปกป้องข้อเข่า'] },
      { id: 'calf', kind: 'muscle', nameTh: 'กล้ามเนื้อน่อง', emoji: '🦶', functionTh: 'ยกส้นเท้า ช่วยวิ่งและกระโดด', careTip: 'ยืดน่องหลังออกกำลัง ลดตะคริว', hotspot: { x: 48, y: 82 }, facts: ['อยู่หลังขาท่อนล่าง', 'สำคัญตอนถีบเท้า', 'มักเมื่อยเมื่อยืนนาน'] },
      { id: 'shoulder', kind: 'joint', nameTh: 'ข้อไหล่', emoji: '🔄', functionTh: 'หมุนและยกแขนได้กว้าง', careTip: 'อย่ายกของหนักเหนือหัวโดยไม่วอร์ม', hotspot: { x: 35, y: 22 }, facts: ['ข้อที่เคลื่อนไหวได้มาก', 'ง่ายต่อการเคล็ดถ้าใช้ผิดท่า', 'มีเอ็นและถุงน้ำช่วย'] },
      { id: 'elbow', kind: 'joint', nameTh: 'ข้อศอก', emoji: '➡️', functionTh: 'งอและเหยียดแขน', careTip: 'อย่าดันข้อศอกสุดแรงหรือกระแทกโต๊ะบ่อย', hotspot: { x: 18, y: 42 }, facts: ['เชื่อมกระดูกแขนสามชิ้น', 'เคลื่อนแบบบานพับเป็นหลัก', 'มีเส้นประสาทสำคัญผ่านใกล้'] },
      { id: 'knee', kind: 'joint', nameTh: 'ข้อเข่า', emoji: '🦵', functionTh: 'งอ–เหยียดขา รับน้ำหนักตอนเดิน', careTip: 'อย่ากระโดดสูงซ้ำโดยไม่พัก และนั่งไขว่ห้างนานเกินไป', hotspot: { x: 45, y: 70 }, facts: ['ข้อใหญ่รับแรงมาก', 'มีกระดูกอ่อนและเอ็นไขว้', 'บาดเจ็บได้ง่ายถ้าวอร์มไม่พอ'] },
    ];

    const SORT_BUCKETS = [
      { id: 'bone', label: 'กระดูก', icon: '🦴' },
      { id: 'muscle', label: 'กล้ามเนื้อ', icon: '💪' },
      { id: 'joint', label: 'ข้อ', icon: '🔄' },
    ];

    const SORT_ITEMS = PARTS.map((p) => ({
      id: p.id,
      icon: p.emoji,
      label: p.nameTh,
      sub: p.functionTh,
      bucketId: p.kind,
      reason: p.nameTh + ' เป็น' + KIND_TH[p.kind] + ' — ' + p.functionTh,
    }));

    const HABITS = [
      { id: 'h1', label: 'ดื่มนม/กินอาหารแคลเซียม', good: true, why: 'แคลเซียมช่วยสร้างและรักษาความแข็งแรงของกระดูก' },
      { id: 'h2', label: 'ออกกำลังกายอย่างสม่ำเสมอ', good: true, why: 'กล้ามเนื้อและกระดูกแข็งแรงเมื่อได้ใช้แรงอย่างเหมาะสม' },
      { id: 'h3', label: 'ยืดเหยียดก่อน–หลังออกกำลัง', good: true, why: 'ลดการบาดเจ็บของกล้ามเนื้อและข้อ' },
      { id: 'h4', label: 'นั่งหลังตรง ไม่โก่งหลัง', good: true, why: 'ลดการกดกระดูกสันหลังและปวดหลังเรื้อรัง' },
      { id: 'h5', label: 'พักเมื่อรู้สึกเจ็บหรือล้า', good: true, why: 'ร่างกายต้องการเวลาฟื้นตัว อย่าฝืนต่อ' },
      { id: 'h6', label: 'นั่งงอหลังนาน ๆ หน้าจอ', good: false, why: 'ท่าก้มหลังนานทำให้กล้ามเนื้อและกระดูกสันหลังเครียด' },
      { id: 'h7', label: 'ยกของหนักผิดท่า (โก่งหลัง)', good: false, why: 'แรงตกที่หลังส่วนล่าง เสี่ยงเคล็ดหรือบาดเจ็บ' },
      { id: 'h8', label: 'ไม่วอร์มก่อนวิ่ง/กระโดด', good: false, why: 'กล้ามเนื้อและข้อยังไม่พร้อม บาดเจ็บง่าย' },
      { id: 'h9', label: 'กระโดดสูงซ้ำโดยไม่พัก', good: false, why: 'ข้อเข่าและน่องรับแรงสะสมเกิน เสี่ยงอักเสบ' },
    ];

    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(t) {
      const clean = String(t || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById('speechStatus');
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI && KAMPAI.sound && KAMPAI.sound.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
      const statusEl = document.getElementById('speechStatus');
      if (statusEl) {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }

    function ding(ok) {
      if (window.KAMPAI && KAMPAI.sound) {
        try { ok ? KAMPAI.sound.correct() : KAMPAI.sound.wrong(); } catch (_) {}
      }
    }

    function partById(id) { return PARTS.find((p) => p.id === id); }

    let mode = 'learn';
    let selId = 'skull';
    let classifySession = null;
    let careDone = {};
    let guessTarget = null;
    let guessFb = '';
    let practiceIdx = 0;

    const hints = {
      learn: 'แตะจุดบนแผนภาพเพื่อดูชื่อ หน้าที่ และเคล็ดดูแล',
      sort: 'แยกส่วนร่างกายเป็น กระดูก / กล้ามเนื้อ / ข้อ — ไม่เก็บคะแนน',
      care: 'แตะพฤติกรรมแล้วดูว่าดีหรือไม่ดี พร้อมเหตุผล',
      guess: 'อ่านคำถาม แล้วแตะจุดบนแผนภาพให้ถูกตำแหน่ง',
    };

    const PRACTICE_Q = [
      { q: 'กระดูกทำหน้าที่หลักอะไร?', opts: ['ค้ำจุนและป้องกันอวัยวะ', 'ย่อยอาหาร', 'สูบฉีดเลือด', 'กรองอากาศ'], a: 'ค้ำจุนและป้องกันอวัยวะ', explain: 'กระดูกเป็นโครงค้ำจุนร่างกายและช่วยป้องกันอวัยวะสำคัญภายใน' },
      { q: 'กล้ามเนื้อช่วยให้ร่างกาย…', opts: ['เคลื่อนไหว', 'สร้างเม็ดเลือดแดงอย่างเดียว', 'เก็บแคลเซียมในฟัน', 'หายใจแทนปอด'], a: 'เคลื่อนไหว', explain: 'กล้ามเนื้อหดและคลายตัว ดึงกระดูกให้ขยับเคลื่อนไหวได้' },
      { q: 'การดูแลกระดูกดีคือ…', opts: ['ดื่มนม/อาหารแคลเซียม + ออกกำลัง', 'ไม่เคยเดิน', 'นั่งหลังคดงอทั้งวัน', 'ไม่โดนแสงแดดเลย'], a: 'ดื่มนม/อาหารแคลเซียม + ออกกำลัง', explain: 'แคลเซียมและการออกกำลังกายช่วยเสริมสร้างมวลกระดูกให้แข็งแรง' },
      { q: 'ยืดเหยียดก่อนออกกำลังช่วย…', opts: ['ลดการบาดเจ็บของกล้ามเนื้อ', 'ทำให้กระดูกหักง่าย', 'หยุดการหายใจ', 'เพิ่มไขมันทันที'], a: 'ลดการบาดเจ็บของกล้ามเนื้อ', explain: 'การอบอุ่นร่างกายและยืดเหยียดช่วยให้กล้ามเนื้อและข้อพร้อมใช้งาน' },
      { q: 'กะโหลกศีรษะป้องกันอวัยวะใด?', opts: ['สมอง', 'หัวใจ', 'ตับ', 'ไต'], a: 'สมอง', explain: 'กะโหลกศีรษะเป็นกระดูกแข็งห่อหุ้มและป้องกันสมอง' },
      { q: 'ยกของถูกวิธีควร…', opts: ['งอเข่า หลังตรง', 'ก้มหลังอย่างเดียว', 'บิดตัวขณะยกหนัก', 'กลั้นหายใจนาน ๆ'], a: 'งอเข่า หลังตรง', explain: 'งอเข่าและรักษาหลังตรงช่วยลดแรงกดที่กระดูกสันหลังส่วนล่าง' },
    ];

    function nextPracticeMcq() {
      stopSpeech();
      practiceIdx = (Math.random() * PRACTICE_Q.length) | 0;
      const item = PRACTICE_Q[practiceIdx];
      const box = document.getElementById('practiceMcq');
      if (!box) return;
      box.querySelector('.pq').textContent = item.q;
      const fb = box.querySelector('.pfb');
      fb.textContent = '';
      fb.style.color = '';
      const opts = shuffle(item.opts);
      const popts = box.querySelector('.popts');
      popts.innerHTML = opts.map((o) => '<button type="button" class="popt" data-a="' + o.replace(/"/g, '&quot;') + '">' + o + '</button>').join('');
      popts.querySelectorAll('.popt').forEach((btn) => {
        btn.onclick = () => {
          const ok = btn.dataset.a === item.a;
          if (ok) {
            btn.classList.add('ok');
            popts.querySelectorAll('.popt').forEach((b) => { b.disabled = true; });
            fb.textContent = '✓ ถูกต้อง! ' + item.explain;
            fb.style.color = 'var(--ok)';
            ding(true);
          } else {
            btn.classList.add('no');
            btn.disabled = true;
            fb.textContent = 'ยังไม่ตรง — ลองนึกถึงหน้าที่ของกระดูก กล้ามเนื้อ และข้อ แล้วเลือกใหม่';
            fb.style.color = 'var(--bad)';
            ding(false);
          }
        };
      });
    }
    document.getElementById('btnPracticeNext')?.addEventListener('click', nextPracticeMcq);
    document.getElementById('btnPracticeSpeak')?.addEventListener('click', () => {
      const item = PRACTICE_Q[practiceIdx];
      if (item) speak(item.q);
    });

    function mountSortClassify() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: SORT_ITEMS,
        buckets: SORT_BUCKETS,
        mode: 'media',
        roundSize: SORT_ITEMS.length,
        onAnswer: function (res) {
          ding(res.isCorrect);
        },
      });
    }

    document.getElementById('btnSpeakSort').addEventListener('click', () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speak(item.label + ' จัดอยู่ในกลุ่ม กระดูก กล้ามเนื้อ หรือข้อ');
      } else {
        speak('แยกประเภทกระดูก กล้ามเนื้อ และข้อครบแล้ว กดฝึกใหม่อีกครั้งได้');
      }
    });

    function setMode(m) {
      stopSpeech();
      if (m !== 'sort' && window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
      mode = m;
      document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
      const pmcq = document.getElementById('practiceMcq');
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('on'));
      if (pmcq) pmcq.classList.toggle('on', m === 'practice');
      if (m === 'practice') {
        const hint = document.getElementById('hintText');
        if (hint) hint.textContent = 'เลือกคำตอบ 4 ตัวเลือก — ฝึกสั้น';
        nextPracticeMcq();
        return;
      }
      document.getElementById('p-' + m).classList.add('on');
      document.getElementById('hintText').textContent = hints[m];
      if (m === 'learn') renderLearn();
      if (m === 'sort') mountSortClassify();
      if (m === 'care') renderCare();
      if (m === 'guess') { if (!guessTarget) nextGuess(); else renderGuess(); }
    }

    function bodyOutline() {
      return '<svg class="body-svg" viewBox="0 0 200 340" aria-hidden="true">' +
        '<ellipse cx="100" cy="38" rx="28" ry="32" fill="#fecdd3"/>' +
        '<rect x="72" y="68" width="56" height="90" rx="24" fill="#fda4af"/>' +
        '<rect x="28" y="78" width="44" height="18" rx="9" fill="#fb7185"/>' +
        '<rect x="128" y="78" width="44" height="18" rx="9" fill="#fb7185"/>' +
        '<rect x="22" y="92" width="18" height="70" rx="9" fill="#fda4af"/>' +
        '<rect x="160" y="92" width="18" height="70" rx="9" fill="#fda4af"/>' +
        '<rect x="78" y="150" width="20" height="100" rx="10" fill="#fb7185"/>' +
        '<rect x="102" y="150" width="20" height="100" rx="10" fill="#fb7185"/>' +
        '<ellipse cx="88" cy="260" rx="14" ry="10" fill="#f9a8d4"/>' +
        '<ellipse cx="112" cy="260" rx="14" ry="10" fill="#f9a8d4"/>' +
        '</svg>';
    }

    function renderHotspots(containerId, onPick, highlightId, targetId) {
      const wrap = document.getElementById(containerId);
      wrap.innerHTML = bodyOutline() + PARTS.map((p) => {
        let cls = 'hs ' + p.kind;
        if (highlightId === p.id) cls += ' on';
        if (targetId === p.id) cls += ' target';
        return '<button type="button" class="' + cls + '" data-id="' + p.id + '" style="left:' + p.hotspot.x + '%;top:' + p.hotspot.y + '%" title="' + p.nameTh + '" aria-label="' + p.nameTh + '">' + p.emoji + '</button>';
      }).join('');
      wrap.querySelectorAll('.hs').forEach((btn) => {
        btn.onclick = function () { onPick(btn.dataset.id); };
      });
    }

    function detailHtml(p) {
      if (!p) return '<p style="color:var(--muted);font-weight:700;text-align:center;margin:auto 0">แตะจุดบนแผนภาพเพื่ออ่านรายละเอียด</p>';
      return '<span class="kind-tag ' + p.kind + '">' + KIND_TH[p.kind] + '</span>' +
        '<h3>' + p.emoji + ' ' + p.nameTh + '</h3>' +
        '<p><strong>หน้าที่:</strong> ' + p.functionTh + '</p>' +
        '<ul class="facts">' + p.facts.map((f) => '<li>• ' + f + '</li>').join('') + '</ul>' +
        '<p class="tip">💡 ดูแล: ' + p.careTip + '</p>' +
        '<button type="button" class="btn btn-ghost" id="btnSpeak" style="align-self:flex-start">🔊 อ่านชื่อและหน้าที่</button>';
    }

    function onLearnPick(id) {
      selId = id;
      renderLearn();
      const part = partById(id);
      if (part) speak(part.nameTh + ' ' + part.functionTh);
    }

    function renderLearn() {
      const el = document.getElementById('p-learn');
      const p = partById(selId);
      el.innerHTML =
        '<div class="learn-layout">' +
        '<div class="diagram-wrap"><div class="diagram" id="learnDiagram"></div>' +
        '<div class="legend"><span><i class="dot" style="background:#fbbf24"></i>กระดูก</span>' +
        '<span><i class="dot" style="background:#f87171"></i>กล้ามเนื้อ</span>' +
        '<span><i class="dot" style="background:#60a5fa"></i>ข้อ</span></div></div>' +
        '<div class="detail" id="learnDetail">' + detailHtml(p) + '</div></div>';
      renderHotspots('learnDiagram', onLearnPick, selId, null);
      const sp = document.getElementById('btnSpeak');
      if (sp && p) sp.onclick = function () { speak(p.nameTh + ' ' + p.functionTh + ' ' + p.careTip); };
    }

    function renderCare() {
      const el = document.getElementById('p-care');
      el.innerHTML =
        '<p style="text-align:center;font-weight:800;color:var(--deep)">แตะแต่ละข้อ แล้วดูว่าพฤติกรรมนี้ดีหรือไม่ดี</p>' +
        '<div class="care-grid">' + HABITS.map((h) => {
          const done = careDone[h.id];
          let cls = 'care-card';
          if (done) cls += h.good ? ' ok' : ' no';
          return '<button type="button" class="' + cls + '" data-id="' + h.id + '"><div class="lab">' +
            (done ? (h.good ? '✅ ' : '❌ ') : '❓ ') + h.label + '</div>' +
            '<div class="why">' + h.why + '</div></button>';
        }).join('') + '</div>' +
        '<div class="actions"><button type="button" class="btn btn-ghost" id="btnCareReset">🔄 เคลียร์คำตอบ</button></div>';
      el.querySelectorAll('.care-card').forEach((b) => {
        b.onclick = function () {
          careDone[b.dataset.id] = true;
          const h = HABITS.find((x) => x.id === b.dataset.id);
          if (h) speak(h.good ? 'ดีครับ ' + h.why : 'ไม่ดีครับ ' + h.why);
          renderCare();
        };
      });
      document.getElementById('btnCareReset').onclick = function () { stopSpeech(); careDone = {}; renderCare(); };
    }

    function nextGuess() {
      stopSpeech();
      guessTarget = PARTS[(Math.random() * PARTS.length) | 0];
      guessFb = '';
      renderGuess();
    }

    function renderGuess() {
      const el = document.getElementById('p-guess');
      el.innerHTML =
        '<div class="q-box">' +
        '<p class="q-text">🎯 "' + guessTarget.nameTh + '" อยู่ตรงไหน?</p>' +
        '<p style="font-weight:700;color:var(--muted)">แตะจุดบนแผนภาพ</p>' +
        '<div class="diagram-wrap" style="width:100%;max-width:320px"><div class="diagram" id="guessDiagram"></div></div>' +
        '<p class="fb' + (guessFb ? (guessFb.indexOf('✅') === 0 ? ' ok' : ' no') : '') + '" id="guessFb">' + guessFb + '</p>' +
        '<div class="actions"><button type="button" class="btn btn-ghost" id="btnGuessSpeak">🔊 ฟังโจทย์</button><button type="button" class="btn btn-primary" id="btnGuessNext">คำถามถัดไป</button></div></div>';
      renderHotspots('guessDiagram', function (id) {
        const p = partById(id);
        if (id === guessTarget.id) {
          guessFb = '✅ ถูกต้อง! ' + p.nameTh + ' เป็น' + KIND_TH[p.kind];
          ding(true);
          speak('ถูกต้อง ' + p.nameTh);
        } else {
          guessFb = '❌ นั่นคือ ' + p.nameTh + ' — ลองใหม่';
          ding(false);
          speak('ยังไม่ใช่ ลองใหม่อีกครั้ง');
        }
        renderGuess();
      }, null, null);
      document.getElementById('btnGuessNext').onclick = nextGuess;
      document.getElementById('btnGuessSpeak').onclick = () => {
        if (guessTarget) speak(guessTarget.nameTh + ' อยู่ตรงไหน แตะจุดบนแผนภาพ');
      };
    }

    document.getElementById('modeSeg').onclick = function (e) {
      const b = e.target.closest('button[data-mode]');
      if (b) setMode(b.dataset.mode);
    };
    document.getElementById('btnBack').onclick = function () {
      stopSpeech();
      if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
      else history.back();
    };
    document.getElementById('btnFs').onclick = function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    setMode('learn');

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      selId: selId,
      classify: classifySession ? classifySession.getState() : null,
      careDoneCount: Object.keys(careDone).length,
      guessTarget: guessTarget ? guessTarget.id : null,
      practiceIndex: practiceIdx,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
