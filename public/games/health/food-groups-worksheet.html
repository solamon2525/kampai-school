<!DOCTYPE html><html lang="th"><head>

<style>
.tick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1mm;margin:1mm 0}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.6mm;font-size:6.5pt;font-weight:700;text-align:center;color:var(--ws-muted)}
.plate-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1mm;margin-top:1mm}
.plate-slot{border:1.4px dashed var(--ws-accent);border-radius:3px;min-height:9mm;font-size:6.5pt;font-weight:700;text-align:center;padding:.5mm;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-10 .tick-grid{grid-template-columns:1fr 1fr 1fr}
</style>

const FOOD_ITEMS=[

window.WORKSHEET_CONFIG={

  getItems(t){return t==='mixed'?FOOD_ITEMS:FOOD_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const plate=item.type==='plan'?'<div class="plate-grid"><div class="plate-slot">1 แป้ง<br>□</div><div class="plate-slot">2 โปรตีน<br>□</div><div class="plate-slot">3 ผัก<br>□</div><div class="plate-slot">4 ผลไม้<br>□</div><div class="plate-slot">5 นม<br>□</div></div>':'';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="q-context">'+e(item.food)+'</div>'
      +'<div class="tick-grid"><div class="tick-box">□ 1 แป้ง</div><div class="tick-box">□ 2 โปรตีน</div><div class="tick-box">□ 3 ผัก</div><div class="tick-box">□ 4 ผลไม้</div><div class="tick-box">□ 5 นม</div></div>'

      +'<div class="step-row"><span class="step-tag">2 จัดหมู่</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'

</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.184.0"></script></body></html>
