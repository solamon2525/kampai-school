<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Kanit','Sarabun',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- ฟองสบู่ลอย -->
  <circle cx="150" cy="140" r="60" fill="url(#bubble)"/>
  <circle cx="1110" cy="180" r="80" fill="url(#bubble)"/>
  <circle cx="1180" cy="520" r="46" fill="url(#bubble)"/>
  <circle cx="90" cy="560" r="54" fill="url(#bubble)"/>
  <circle cx="1010" cy="610" r="34" fill="url(#bubble)"/>
  <!-- ป้ายวิชา -->
  <rect x="60" y="58" rx="26" ry="26" width="340" height="56" fill="#0f172a" opacity="0.55"/>
  <text x="84" y="96" font-size="30" font-weight="700" fill="#e0f2fe">สุขศึกษา · ป.4-6</text>
  <!-- ชื่อเกม -->
  <text x="640" y="250" text-anchor="middle" font-size="120" font-weight="700" fill="url(#title)" stroke="#0c4a6e" stroke-width="3">ล้างมือ 7 ขั้น</text>
  <text x="640" y="320" text-anchor="middle" font-size="40" font-weight="600" fill="#ecfeff">เรียงลำดับขั้นตอนล้างมือให้สะอาด!</text>
  <!-- การ์ด 7 ขั้นเรียงแถว -->
  <g>
    <g transform="translate(170,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/><rect x="0" y="0" width="130" height="150" rx="20" fill="none"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">1</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">🤲</text>
    </g>
    <g transform="translate(320,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">2</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">🖐️</text>
    </g>
    <g transform="translate(470,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">3</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">🙏</text>
    </g>
    <g transform="translate(620,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">4</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">✊</text>
    </g>
    <g transform="translate(770,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">5</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">👍</text>
    </g>
    <g transform="translate(920,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">6</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">👆</text>
    </g>
    <g transform="translate(1070,400)">
      <rect width="130" height="150" rx="20" fill="#f8fafc"/>
      <circle cx="22" cy="22" r="20" fill="#0f172a"/><text x="22" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fde047">7</text>
      <text x="65" y="95" text-anchor="middle" font-size="58">🔄</text>
    </g>
  </g>
  <text x="640" y="635" text-anchor="middle" font-size="34" font-weight="600" fill="#0f172a" opacity="0.65">🧼 แตะการ์ดทีละใบ 1 → 7 ให้ครบ</text>
</svg>
