<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/decimal-media.html"><meta name="curriculum-indicators" content="ค 1.1 ป.4/5, ค 1.1 ป.4/6"><title>ใบงานทศนิยม ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.14" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.14" rel="stylesheet">
<style>
.pv-table{width:100%;border-collapse:collapse;font-size:8pt;margin:1mm 0;text-align:center}
.pv-table th,.pv-table td{border:1px solid var(--ws-line);padding:.7mm 1mm;min-width:8mm}
.pv-table th{background:var(--ws-soft);font-weight:800;color:var(--ws-accent)}
.pv-blank{min-height:5.5mm;display:block}
.dec-stack{display:inline-grid;grid-template-columns:auto;gap:.6mm;font-weight:800;font-size:11pt;color:var(--ws-ink);margin:1mm auto;justify-items:end;font-variant-numeric:tabular-nums}
.dec-stack .op{justify-self:start;color:var(--ws-accent-2)}
.dec-line{border-top:1.6px solid var(--ws-ink);min-width:28mm;min-height:5.5mm}
.step-block{display:flex;flex-direction:column;gap:1.3mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:2mm;align-items:end;min-height:7.2mm}
.step-tag{font-size:7pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:4px;padding:1mm;text-align:center;line-height:1.15}
.step-body{min-height:6.2mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;padding-bottom:.4mm;font-weight:700;font-size:8.5pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:9mm}
.count-10 .pv-table{font-size:7pt}
</style>
</head><body>
<header class="toolbar"><h1>🔢 ใบงานทศนิยม</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="read">อ่านค่า</option><option value="compare">เปรียบเทียบ</option><option value="add">บวก–ลบ</option><option value="apply">ประยุกต์ใช้</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.14"></script><script>
const DECIMAL_ITEMS=[
 {type:'read',prompt:'เขียนค่าทศนิยมเป็นตัวเลข',word:'สองจุดห้า',value:'2.5',answer:'2.5'},
 {type:'read',prompt:'อ่านค่าทศนิยมเป็นคำไทย',word:'3.75',value:'3.75',answer:'สามจุดเจ็ดห้า'},
 {type:'read',prompt:'ระบุค่าประจำหลักของ 4.08',word:'4.08',value:'4.08',answer:'หลักหน่วย=4 · หลักส่วนสิบ=0 · หลักส่วนร้อย=8'},
 {type:'compare',prompt:'ใส่ > < = ให้ถูกต้อง',word:'2.5 ___ 2.50',value:'2.5 vs 2.50',answer:'='},
 {type:'compare',prompt:'เรียงจากน้อยไปมาก',word:'1.2 , 1.05 , 1.20',value:'สามค่า',answer:'1.05 < 1.2 = 1.20'},
 {type:'compare',prompt:'ค่าใดมากกว่า',word:'0.9 หรือ 0.89',value:'0.9 vs 0.89',answer:'0.9'},
 {type:'add',prompt:'คำนวณผลบวก (จัดจุดทศนิยมให้ตรง)',word:'2.3 + 1.4',value:'2.3+1.4',a:'2.3',b:'1.4',op:'+',answer:'3.7'},
 {type:'add',prompt:'คำนวณผลลบ (จัดจุดทศนิยมให้ตรง)',word:'5.6 − 2.15',value:'5.6-2.15',a:'5.60',b:'2.15',op:'−',answer:'3.45'},
 {type:'add',prompt:'หาเงินทอน',word:'มี 10 บาท ซื้อของ 7.25 บาท',value:'10-7.25',a:'10.00',b:'7.25',op:'−',answer:'2.75 บาท'},
 {type:'apply',prompt:'วัดความยาวได้ 3.5 ซม. อีก 0.8 ซม. รวมเท่าไร',word:'3.5+0.8',value:'ความยาว',a:'3.5',b:'0.8',op:'+',answer:'4.3 ซม.'},
 {type:'apply',prompt:'น้ำหนัก 2.25 กก. กับ 2.3 กก. หนักกว่ากันเท่าไร',word:'2.3-2.25',value:'กก.',a:'2.30',b:'2.25',op:'−',answer:'2.3 กก. หนักกว่า 0.05 กก.'},
 {type:'apply',prompt:'ถ้า 1 แท่ง = 0.1 มี 12 แท่ง รวมเท่าไร',word:'12×0.1',value:'แท่ง',answer:'1.2'}
];

function placeValueTable(value,e){
  const s=String(value);
  const parts=s.split('.');
  const whole=parts[0]||'0';
  const frac=(parts[1]||'').padEnd(2,' ');
  const tens=whole.length>1?whole[whole.length-2]:'—';
  const ones=whole[whole.length-1]||'0';
  const t=frac[0]&&frac[0]!==' '?frac[0]:'—';
  const h=frac[1]&&frac[1]!==' '?frac[1]:'—';
  return '<table class="pv-table"><tr><th>สิบ</th><th>หน่วย</th><th>.</th><th>ส่วนสิบ</th><th>ส่วนร้อย</th></tr>'
    +'<tr><td>'+e(tens)+'</td><td>'+e(ones)+'</td><td>.</td><td>'+e(t)+'</td><td>'+e(h)+'</td></tr>'
    +'<tr><td colspan="5"><span class="pv-blank"></span></td></tr></table>';
}

function stackHtml(item,e){
  if(!item.a||!item.b)return '';
  return '<div class="dec-stack" aria-label="ตั้งบวกลบทศนิยม">'
    +'<span>'+e(item.a)+'</span>'
    +'<span><span class="op">'+e(item.op||'+')+'</span> '+e(item.b)+'</span>'
    +'<span class="dec-line"></span></div>';
}

window.WORKSHEET_CONFIG={
  worksheetKey:'decimal',
  icon:'🔢',title:'ใบงานทศนิยม',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'ทศนิยม',
  sourceMediaUrl:'/games/math/decimal-media.html',
  indicators:['ค 1.1 ป.4/5','ค 1.1 ป.4/6'],
  directions:'อ่านค่าประจำหลัก · เทียบจุดทศนิยม · จัดแนวบวกลบ · ใช้ในชีวิตจริง',
  getItems(topic){return topic==='mixed'?DECIMAL_ITEMS:DECIMAL_ITEMS.filter(i=>i.type===topic);},
  buildSteps(item){
    if(item.type==='read'){
      if(String(item.word).includes('.'))return{s1:'แยกหลักของ '+item.word,s2:'อ่าน/ระบุค่าประจำหลัก',s3:item.answer};
      return{s1:'อ่านคำ: '+item.word,s2:'เขียนเป็นตัวเลขทศนิยม',s3:item.answer};
    }
    if(item.type==='compare')return{s1:'จัดจุดทศนิยมให้ตรงกัน',s2:'เทียบทีละหลักจากซ้าย',s3:item.answer};
    if(item.type==='add')return{s1:'จัดจุดทศนิยมให้ตรงแนว',s2:'บวก/ลบทีละหลัก',s3:item.answer};
    return{s1:'แปลงโจทย์เป็นทศนิยม: '+item.word,s2:'คำนวณ',s3:item.answer};
  },
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const w=this.buildSteps(item);
    let visual='';
    if(item.type==='read'&&String(item.value).includes('.'))visual=placeValueTable(item.value,e);
    else if(item.a&&item.b)visual=stackHtml(item,e);
    else visual='<table class="mini-table"><tr><th>โจทย์</th><th>ข้อมูล</th></tr><tr><td>'+e(item.word)+'</td><td>'+e(item.value)+'</td></tr></table>';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'+visual+'</div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 จัดหลัก</span><div class="step-body"><span class="work-fill">'+e(w.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 คำนวณ</span><div class="step-body"><span class="work-fill">'+e(w.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(w.s3)+'</span></div></div>'
      +'</div>'
      +'<div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.14"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.14"></script></body></html>
