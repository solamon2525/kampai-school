<!DOCTYPE html>
<html lang="th">
<head>

  <title>ใบงานการหารสั้น ป.4–6 — โรงเรียนบ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet" />
  <style>
    :root{

    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--sd-bg);color:var(--sd-ink);font-family:Sarabun,sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--sd-green);color:var(--sd-paper);box-shadow:0 3px 12px rgba(6,95,70,.35)}

    .t-select,.t-input{font:700 .84rem Sarabun;padding:6px 9px;border-radius:8px;border:1px solid #6ee7b7;background:var(--sd-paper);color:var(--sd-green)}
    .t-input{width:132px}
    .btn{border:0;border-radius:8px;padding:7px 11px;font:700 .86rem Sarabun;cursor:pointer;background:var(--sd-paper);color:var(--sd-green);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .btn:focus-visible,.t-select:focus-visible,.t-input:focus-visible{outline:3px solid var(--sd-gold);outline-offset:2px}.btn:disabled{opacity:.45;cursor:not-allowed}
    .btn.primary{background:var(--sd-gold);color:#78350f}.btn.green{background:#10b981;color:var(--sd-paper)}.btn.accent{background:var(--sd-blue);color:var(--sd-paper)}
    .pages{padding:14px;overflow-x:auto}

    .sheet:last-child{page-break-after:auto}
    .sheet-head{border-bottom:2px solid var(--sd-accent);padding-bottom:2mm;padding-right:28mm;position:relative;min-height:28mm}
    .sheet-title{display:flex;align-items:center;gap:8px}.sheet-title h2{margin:0;flex:1;color:var(--sd-green);font-size:15pt}.level{border:1.5px solid #6ee7b7;border-radius:999px;padding:2px 9px;font-weight:800;color:var(--sd-green);font-size:8.5pt;white-space:nowrap}

    .student{display:flex;flex-wrap:nowrap;gap:8mm;align-items:center;margin-top:2mm;font-size:10.5pt;font-weight:700;color:var(--sd-navy)}
    .student-name{flex:1;display:flex;align-items:center;gap:6px}.student-no{display:flex;align-items:center;gap:6px;white-space:nowrap}.blank{display:inline-block;border-bottom:1px solid var(--sd-line);height:5mm}.student-name .blank{flex:1;min-width:60mm}.student-no .blank{width:22mm}
    .directions{display:flex;align-items:center;gap:6px;font-size:8.4pt;font-weight:700;color:var(--sd-line);margin-top:1.5mm;line-height:1.25}.directions strong{color:var(--sd-green)}

    .questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.6mm;flex:1;min-height:0}
    .questions.count-8{grid-template-rows:repeat(4,minmax(0,1fr))}.questions.count-6{grid-template-rows:repeat(3,minmax(0,1fr))}.questions.count-5,.questions.worksheet-mode-five{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(5,minmax(0,1fr));gap:2.2mm}

    .q-num{position:absolute;left:2mm;top:1.8mm;width:6.5mm;height:6.5mm;border-radius:50%;display:grid;place-items:center;background:var(--sd-accent);color:var(--sd-paper);font-weight:800;font-size:9pt}.q-rating{position:absolute;right:2mm;top:1.4mm;font-size:6.7pt;color:var(--sd-muted);font-weight:700}
    .q-prompt{font-size:9.2pt;font-weight:800;color:var(--sd-navy);line-height:1.1;min-height:4.5mm}
    .q-board{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:4.8mm}
    .short-division{--sd-cell:12mm;--sd-divisor:12mm;display:flex;align-items:flex-start;color:var(--sd-navy);font-weight:800;max-width:100%}
    .sd-divisor{width:var(--sd-divisor);height:9mm;display:grid;place-items:center;font-size:14pt;flex:0 0 auto}.sd-bracket{height:9mm;display:grid;place-items:center;font-size:19pt;line-height:1;width:4.5mm;flex:0 0 auto}
    .sd-digits{display:flex;flex-direction:column;min-width:0}.sd-dividend,.sd-quotient{display:grid;grid-template-columns:repeat(var(--digits),var(--sd-cell))}.sd-dividend{border-bottom:2px solid var(--sd-accent)}
    .sd-digit{height:9mm;display:grid;place-items:center;position:relative;font-size:14pt;border-right:1px dashed var(--sd-mint)}.sd-digit:last-child{border-right:0}
    .sd-carry-slot{position:absolute;left:-3.2mm;top:-4.3mm;min-width:5.8mm;height:4.7mm;padding:0 .5mm;border:1px dotted var(--sd-muted);border-radius:3px;background:var(--sd-paper);display:grid;place-items:center;font-size:8.5pt;line-height:1;color:var(--sd-red)}
    .sd-quotient-cell{height:8mm;display:grid;place-items:center;border-bottom:1px dashed var(--sd-accent);font-size:13pt;color:var(--sd-red)}.sd-quotient-cell.skip{border-bottom-color:transparent}
    .sd-remainder-work{align-self:flex-start;margin-left:calc(var(--sd-divisor) + 4.5mm);margin-top:1mm;display:flex;align-items:center;gap:1.5mm;font-size:8.5pt;color:var(--sd-green);white-space:nowrap}.sd-remainder-work .sd-answer-line{min-width:14mm}
    .sd-answer{visibility:hidden}.show-answers .sd-answer,.q.reveal-answer .sd-answer{visibility:visible}.show-answers .sd-quotient-cell:not(.skip),.q.reveal-answer .sd-quotient-cell:not(.skip){background:var(--sd-answer-bg)}
    .sd-meta{display:grid;grid-template-columns:minmax(0,1fr);gap:2mm;align-items:start;font-size:9pt;font-weight:800;color:var(--sd-green);min-height:11mm}
    .sd-check{display:flex;align-items:flex-end;gap:1.2mm;white-space:nowrap;min-width:0;font-size:8.5pt}.sd-check-slot{display:inline-grid;place-items:center;min-width:11mm;height:5.5mm;border-bottom:1px dotted var(--sd-line);color:var(--sd-red);padding:0 .5mm}.sd-check-slot.wide{min-width:16mm}.sd-check-slot.small{min-width:6mm}
    .sd-final{white-space:nowrap;color:var(--sd-green);display:flex;align-items:flex-end;gap:1.8mm;font-size:9.5pt;justify-self:start}.sd-answer-line{display:inline-grid;place-items:center;min-width:15mm;height:5.5mm;border-bottom:1px solid var(--sd-line);color:var(--sd-red);margin-left:1mm}.sd-remainder-slot{min-width:12mm;margin-left:0}
    .q.reveal-current{outline:2px solid var(--sd-blue);outline-offset:1px}
    .parent-slip{border-top:2px dashed var(--sd-accent);margin-top:auto;padding-top:1.5mm;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;font-size:8pt;color:var(--sd-line)}.parent-slip .cut-label{font-weight:800;color:var(--sd-accent)}.parent-slip .teacher-label{font-weight:700;color:var(--sd-green);background:var(--sd-soft);padding:1px 6px;border-radius:4px;border:1px solid var(--sd-mint)}
    .sheet-foot{display:flex;justify-content:space-between;align-items:center;color:var(--sd-muted);font-size:7.5pt;margin-top:.5mm}.sheet-foot-teacher{font-weight:700;color:var(--sd-accent)}
    .cover-sheet{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:4px double var(--sd-accent);padding:12mm}.cover-logo-img{width:100px;height:100px;object-fit:contain;margin-bottom:4mm;filter:drop-shadow(0 4px 12px rgba(4,120,87,.2))}.cover-title{font-size:24pt;font-weight:800;color:var(--sd-green);margin:0 0 2mm}.cover-sub{font-size:14pt;font-weight:700;color:var(--sd-accent);margin-bottom:8mm}.cover-box{border:2px solid var(--sd-mint);background:var(--sd-soft);border-radius:12px;padding:6mm;width:80%;margin-bottom:8mm}.stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;width:100%;margin-top:6mm}.stamp-card{border:1.5px dashed var(--sd-accent);border-radius:8px;padding:4mm;min-height:22mm;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5pt;font-weight:700;color:var(--sd-accent);background:var(--sd-paper)}
    .count-8 .q{padding-top:1mm;padding-bottom:.8mm;gap:.3mm}.count-8 .q-board{padding-top:4mm}.count-8 .q-prompt{font-size:8.5pt}.count-8 .sd-meta{font-size:7.2pt}.count-8 .sd-check-slot{height:4.4mm}.count-8 .sd-answer-line{height:4.4mm}.count-8 .sd-remainder-slot{min-width:10mm}
    .count-6 .sd-meta,.count-5 .sd-meta,.worksheet-mode-five .sd-meta{gap:1.5mm}.count-6 .sd-final,.count-5 .sd-final,.worksheet-mode-five .sd-final{justify-self:start}.count-6 .sd-check-slot.wide,.count-5 .sd-check-slot.wide,.worksheet-mode-five .sd-check-slot.wide{min-width:20mm}
    .count-5 .q-board,.worksheet-mode-five .q-board{justify-content:flex-start;padding-left:25mm}.count-5 .sd-meta,.worksheet-mode-five .sd-meta{font-size:9pt}.count-5 .q-prompt,.worksheet-mode-five .q-prompt{font-size:10pt}
    @media(max-width:980px){.toolbar{align-items:flex-start}.toolbar h1{flex-basis:100%}.pages{padding:6px}}
    @media print{@page{size:A4 portrait;margin:0}body{background:var(--sd-paper)}.toolbar{display:none!important}.pages{padding:0;overflow:visible}.sheet{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:297mm;max-height:297mm;padding:5mm 6mm}.q{min-height:0}}
  </style>

<body>
  <header class="toolbar"><h1>➗ ใบงานการหารสั้นทีละหลัก</h1><div class="toolbar-ctrls">
    <select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">รูปแบบ: มาตรฐาน</option><option value="progressive">รูปแบบ: บันไดระดับ</option><option value="booklet">รูปแบบ: รวมเล่ม</option></select>
    <select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option><option value="5">5 หน้า</option></select>
    <select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4" selected>ป.4 · 2–3 หลัก ÷ 1 หลัก</option><option value="5">ป.5 · 3–4 หลัก ÷ 1–2 หลัก</option><option value="6">ป.6 · 4–6 หลัก ÷ 1–2 หลัก</option><option value="custom">⚙️ กำหนดจำนวนหลักเอง</option></select>
    <select class="t-select" id="selRemainder" aria-label="รูปแบบเศษ"><option value="mixed" selected>คำตอบ: ผสมลงตัวและมีเศษ</option><option value="exact">คำตอบ: หารลงตัว</option><option value="remainder">คำตอบ: มีเศษทุกข้อ</option></select>
    <select class="t-select" id="selDivisorDigits" aria-label="จำนวนหลักตัวหาร" hidden><option value="1">ตัวหาร 1 หลัก</option><option value="2">ตัวหาร 2 หลัก</option><option value="mix" selected>ตัวหาร 1–2 หลัก</option></select>
    <select class="t-select" id="selDividendDigits" aria-label="จำนวนหลักตัวตั้ง" hidden><option value="2">ตัวตั้ง 2 หลัก</option><option value="3">ตัวตั้ง 3 หลัก</option><option value="4" selected>ตัวตั้ง 4 หลัก</option><option value="5">ตัวตั้ง 5 หลัก</option><option value="6">ตัวตั้ง 6 หลัก</option></select>
    <select id="selCount" data-fixed-count="6" aria-label="จำนวนข้อต่อหน้า" hidden><option value="5">5 ข้อ</option><option value="6">6 ข้อ</option><option value="8">8 ข้อ</option></select>
    <input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน" /><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select>
    <button class="btn primary" id="btnRandom" type="button">🎲 สุ่มชุดใหม่</button><span class="btn accent" id="answerStepLabel" aria-live="polite">เฉลย: ปิด</span><button class="btn" id="btnAnswerPrev" type="button">◀ ข้อก่อน</button><button class="btn" id="btnAnswerNext" type="button">▶ เฉลยข้อถัดไป</button><button class="btn" id="btnAnswers" type="button">👁 ทั้งหมด</button><button class="btn green" id="btnPrint" type="button">🖨 พิมพ์ A4</button>
  </div></header>
  <main class="pages" id="pages"></main>
  <script src="/games/worksheet-runtime.js?v=2.0.0"></script>
  <script>
    const WORKSHEET_KEY='short-division',SET_TITLE_PREFIX='ใบงานหารสั้น';
    const SCHOOL_LOGO_URL='https://lkpqssbqxxpasidfqhpb.supabase.co/storage/v1/object/public/school-images/logo/1778157862905_c2swwm.webp',MEDIA_PATH='/games/math/short-division-thinking-media.html',QR_API='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(location.origin+MEDIA_PATH);
    let renderSeed=Date.now(),rng=null,setsUi=null,revealCount=0;const usedProblems=new Set();
    function ensureRng(){rng=window.KampaiWorksheetSets?window.KampaiWorksheetSets.createRng(renderSeed):null}const R=(a,b)=>rng?rng.randomInt(a,b):a+Math.floor(Math.random()*(b-a+1));
    const esc=(value)=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    function digitRange(digits){return{min:digits===1?2:10**(digits-1),max:10**digits-1}}
    function gradeSpec(grade){
      if(grade==='4')return{minDigits:2,maxDigits:3,divisor:'1',label:'ป.4',indicator:'ค 1.1 ป.4/9'};
      if(grade==='5')return{minDigits:3,maxDigits:4,divisor:'mix',label:'ป.5',indicator:'ค 1.1 ป.5/7'};
      if(grade==='6')return{minDigits:4,maxDigits:6,divisor:'mix',label:'ป.6',indicator:'ค 1.1 ป.6/7'};
      const digits=Number(document.getElementById('selDividendDigits').value)||4;return{minDigits:digits,maxDigits:digits,divisor:document.getElementById('selDivisorDigits').value||'mix',label:'กำหนดเอง',indicator:'ค 1.1 ป.4/9 · ป.5/7 · ป.6/7'};
    }
    function chooseDigits(spec,index,count,progressive){if(spec.minDigits===spec.maxDigits)return spec.minDigits;if(progressive)return spec.minDigits+Math.min(spec.maxDigits-spec.minDigits,Math.floor(index*(spec.maxDigits-spec.minDigits+1)/Math.max(1,count)));return R(spec.minDigits,spec.maxDigits)}
    function chooseDivisor(mode,index,count,progressive){let useTwo=mode==='2';if(mode==='mix')useTwo=progressive?index>=Math.ceil(count/2):R(0,1)===1;return useTwo?R(10,99):R(2,9)}
    function traceShortDivision(dividend,divisor){
      const digits=String(dividend).split('').map(Number),quotientByColumn=Array(digits.length).fill(''),carryByColumn=Array(digits.length).fill(null),steps=[];let remainder=0,started=false;
      digits.forEach((digit,index)=>{const carryIn=remainder;if(index>0&&carryIn>0)carryByColumn[index]=carryIn;const partial=carryIn*10+digit;if(!started&&partial<divisor&&index<digits.length-1){remainder=partial;steps.push({index,partial,quotientDigit:null,remainder});return}started=true;const quotientDigit=Math.floor(partial/divisor);remainder=partial%divisor;quotientByColumn[index]=String(quotientDigit);steps.push({index,partial,quotientDigit,remainder})});
      return{digits,quotient:Math.floor(dividend/divisor),remainder,quotientByColumn,carryByColumn,steps};
    }
    function validateProblem(problem){return problem.divisor*problem.quotient+problem.remainder===problem.dividend&&problem.remainder>=0&&problem.remainder<problem.divisor}
    function buildProblem(spec,digits,kind,index,count,progressive){
      const range=digitRange(digits);for(let attempt=0;attempt<300;attempt++){const divisor=chooseDivisor(spec.divisor,index,count,progressive),remainder=kind==='remainder'?R(1,divisor-1):0,minQ=Math.max(1,Math.ceil((range.min-remainder)/divisor)),maxQ=Math.floor((range.max-remainder)/divisor);if(maxQ<minQ)continue;const quotient=R(minQ,maxQ),dividend=divisor*quotient+remainder,key=dividend+'÷'+divisor,problem={dividend,divisor,quotient,remainder,kind,trace:traceShortDivision(dividend,divisor)};if(!usedProblems.has(key)&&validateProblem(problem)){usedProblems.add(key);return problem}}throw new Error('ไม่สามารถสร้างโจทย์หารสั้นที่ไม่ซ้ำได้');
    }
    function getWorksheetCount(){const useMode=document.getElementById('selUseMode')?.value||'standard';if(useMode!=='standard')return 5;const grade=document.getElementById('selGrade').value,remainderMode=document.getElementById('selRemainder').value,customEasy=grade==='custom'&&document.getElementById('selDivisorDigits').value==='1'&&Number(document.getElementById('selDividendDigits').value)<=3;return remainderMode==='exact'&&(grade==='4'||customEasy)?8:6}
    function syncCount(){const count=getWorksheetCount(),select=document.getElementById('selCount');select.value=String(count);select.dataset.fixedCount=String(count);return count}
    function syncCustomControls(){const custom=document.getElementById('selGrade').value==='custom';document.getElementById('selDivisorDigits').hidden=!custom;document.getElementById('selDividendDigits').hidden=!custom}
    function problemKind(mode,index,mixOffset){return mode==='mixed'?((index+mixOffset)%2?'remainder':'exact'):mode}function answerSpan(value){return'<span class="sd-answer">'+esc(value)+'</span>'}
    function renderQuestion(problem,number,showRating){
      const trace=problem.trace,digits=trace.digits,cell=digits.length>=5?'10.5mm':'12mm',divisorWidth=String(problem.divisor).length===2?'14mm':'11mm',dividendCells=digits.map((digit,index)=>'<span class="sd-digit">'+(index?'<span class="sd-carry-slot">'+answerSpan(trace.carryByColumn[index]??'')+'</span>':'')+digit+'</span>').join(''),quotientCells=trace.quotientByColumn.map(value=>'<span class="sd-quotient-cell'+(value===''?' skip':'')+'">'+answerSpan(value)+'</span>').join(''),remainderAnswer=problem.remainder>0?' เศษ <span class="sd-answer-line sd-remainder-slot">'+answerSpan(problem.remainder)+'</span>':'';
      return'<article class="q" data-dividend="'+problem.dividend+'" data-divisor="'+problem.divisor+'" data-quotient="'+problem.quotient+'" data-remainder="'+problem.remainder+'"><span class="q-num">'+number+'</span>'+(showRating?'<span class="q-rating">[ ] ⭐3 [ ] ⭐2 [ ] ⭐1</span>':'')+'<div class="q-prompt">'+problem.dividend+' ÷ '+problem.divisor+' = ______</div><div class="q-board"><div class="short-division" style="--digits:'+digits.length+';--sd-cell:'+cell+';--sd-divisor:'+divisorWidth+'" aria-label="ตั้งหารสั้น '+problem.dividend+' หารด้วย '+problem.divisor+'"><span class="sd-divisor">'+problem.divisor+'</span><span class="sd-bracket">)</span><div class="sd-digits"><div class="sd-dividend">'+dividendCells+'</div><div class="sd-quotient">'+quotientCells+'</div></div></div><div class="sd-remainder-work">เศษสุดท้าย = <span class="sd-answer-line">'+answerSpan(problem.remainder)+'</span></div></div><div class="sd-meta"><div class="sd-check">ตรวจ: '+problem.divisor+' × <span class="sd-check-slot">'+answerSpan(problem.quotient)+'</span> + <span class="sd-check-slot small">'+answerSpan(problem.remainder)+'</span> = <span class="sd-check-slot wide">'+answerSpan(problem.dividend)+'</span></div><div class="sd-final">ตอบ <span class="sd-answer-line">'+answerSpan(problem.quotient)+'</span>'+remainderAnswer+'</div></div></article>';
    }
    function renderParentSlip(teacher){return'<div class="parent-slip"><span class="cut-label">✂️ แถบส่งผู้ปกครอง</span>'+(teacher?'<span class="teacher-label">ครูผู้สอน: '+esc(teacher)+'</span>':'')+'<span>ผลการทำแบบฝึกหัด: [ ] ผ่านเกณฑ์ [ ] ควรทบทวน</span><span>ลงชื่อผู้ปกครอง: .......................................</span></div>'}
    function renderBookletCover(school,teacher){return'<section class="sheet cover-sheet"><img class="cover-logo-img" src="'+SCHOOL_LOGO_URL+'" alt="ตราโรงเรียน"><h1 class="cover-title">'+esc(school||'โรงเรียนบ้านคำไผ่')+'</h1><div class="cover-sub">แบบฝึกทักษะการหารสั้นทีละหลัก ป.4–ป.6</div><div class="cover-box"><strong>ข้อมูลนักเรียน</strong><div style="text-align:left;font-size:11pt;font-weight:700;margin-top:3mm;display:grid;gap:3mm"><div>ชื่อ–นามสกุล: <span class="blank" style="min-width:100mm"></span></div><div>เลขที่: <span class="blank" style="min-width:30mm"></span></div><div>ครูผู้สอน: '+esc(teacher||'....................................')+'</div></div></div><div class="stamp-grid">'+Array.from({length:8},(_,i)=>'<div class="stamp-card">ชุดที่ '+(i+1)+'<br>⭐ ⭐ ⭐</div>').join('')+'</div><footer class="sheet-foot" style="position:absolute;bottom:8mm;right:8mm">กลุ่มสาระการเรียนรู้คณิตศาสตร์</footer></section>'}
    function renderSheet(page,total,count,spec,style,remainderMode,school,teacher,globalStart,mixOffset){let questions='';for(let index=0;index<count;index++){const globalIndex=globalStart+index,digits=chooseDigits(spec,index,count,style==='progressive'),kind=problemKind(remainderMode,globalIndex,mixOffset);questions+=renderQuestion(buildProblem(spec,digits,kind,index,count,style==='progressive'),index+1,style==='progressive')}return'<section class="sheet"><header class="sheet-head"><div class="qr-box"><img class="qr-img" src="'+QR_API+'" alt="QR สื่อหารสั้น"><span class="qr-label">สแกนดูวิธีหารสั้น</span></div><div class="sheet-title"><h2>➗ ใบงานการหารสั้น — '+spec.label+'</h2><span class="level">'+spec.indicator+'</span></div><div class="school-name"><img src="'+SCHOOL_LOGO_URL+'" class="school-logo-mini" alt=""> '+esc(school)+'</div><div class="student"><div class="student-name"><span class="lbl">ชื่อ–นามสกุล</span><span class="blank"></span></div><div class="student-no"><span class="lbl">เลขที่</span><span class="blank"></span></div></div><div class="directions"><strong>คำชี้แจง:</strong> หารจากซ้าย เขียนผลหารใต้หลัก นำเศษไปทดหน้าหลักถัดไป แล้วตรวจด้วยคูณ</div></header><div class="step-strip"><span>1 หารจากซ้าย</span><span>2 เขียนผลหาร</span><span>3 เศษไปทดหลักถัดไป</span><span>4 ตรวจด้วยคูณ</span></div><div class="questions count-'+count+'">'+questions+'</div>'+renderParentSlip(teacher)+'<footer class="sheet-foot"><span>หน้า '+page+' / '+total+'</span>'+(teacher?'<span class="sheet-foot-teacher">ครูผู้สอน: '+esc(teacher)+'</span>':'')+'</footer></section>'}
    function currentConfig(){return{style:document.getElementById('selStyle').value,pageCount:document.getElementById('selPageCount').value,grade:document.getElementById('selGrade').value,remainderMode:document.getElementById('selRemainder').value,divisorDigits:document.getElementById('selDivisorDigits').value,dividendDigits:document.getElementById('selDividendDigits').value,count:getWorksheetCount(),schoolName:document.getElementById('inpSchool').value,teacherName:document.getElementById('selTeacher').value,useMode:document.getElementById('selUseMode')?.value||'standard'} }
    function applyConfig(config){if(!config)return;const map={style:'selStyle',pageCount:'selPageCount',grade:'selGrade',remainderMode:'selRemainder',divisorDigits:'selDivisorDigits',dividendDigits:'selDividendDigits',schoolName:'inpSchool',teacherName:'selTeacher',useMode:'selUseMode'};Object.entries(map).forEach(([key,id])=>{const el=document.getElementById(id);if(el&&config[key]!=null)el.value=String(config[key])});syncCustomControls();syncCount()}
    function getQuestions(){return Array.from(document.querySelectorAll('#pages .q'))}
    function syncAnswerReveal(){document.body.classList.remove('show-answers');const questions=getQuestions(),total=questions.length;questions.forEach((q,index)=>{q.classList.toggle('reveal-answer',index<revealCount);q.classList.toggle('reveal-current',revealCount>0&&index===revealCount-1)});const label=document.getElementById('answerStepLabel'),all=document.getElementById('btnAnswers');if(!total||revealCount<=0){label.textContent='เฉลย: ปิด';all.textContent='👁 ทั้งหมด'}else if(revealCount>=total){label.textContent='เฉลย: ครบ '+total+' ข้อ';all.textContent='🙈 ซ่อนทั้งหมด'}else{label.textContent='เฉลยข้อ '+revealCount+' / '+total;all.textContent='👁 ทั้งหมด'}document.getElementById('btnAnswerPrev').disabled=revealCount<=0;document.getElementById('btnAnswerNext').disabled=revealCount>=total}
    function render(){ensureRng();usedProblems.clear();syncCustomControls();const count=syncCount(),style=document.getElementById('selStyle').value,pageCount=Number(document.getElementById('selPageCount').value),spec=gradeSpec(document.getElementById('selGrade').value),remainderMode=document.getElementById('selRemainder').value,school=document.getElementById('inpSchool').value.trim(),teacher=document.getElementById('selTeacher').value,mixOffset=R(0,1);let html=style==='booklet'?renderBookletCover(school,teacher):'';for(let page=1;page<=pageCount;page++)html+=renderSheet(page,pageCount,count,spec,style,remainderMode,school,teacher,(page-1)*count,mixOffset);document.getElementById('pages').innerHTML=html;revealCount=0;syncAnswerReveal();window.KampaiWorksheetSets?.writeUrl({seed:renderSeed,setId:setsUi?.getCurrentSetId?.()||undefined})}
    function randomize(){renderSeed=window.KampaiWorksheetSets?window.KampaiWorksheetSets.newSeed():Date.now()+Math.floor(Math.random()*100000);window.KampaiWorksheetSets?.writeUrl({seed:renderSeed,clearSet:true});setsUi?.setCurrentSetId?.('');render();setsUi?.refreshSuggestedTitle?.(true)}
    function applySetState(state){if(state?.config)applyConfig(state.config);if(state?.seed!=null)renderSeed=Number(state.seed);if(state?.setId)setsUi?.setCurrentSetId?.(state.setId);render()}
    async function bootSets(){try{const Sets=await window.KampaiWorksheet.loadSetsModule(),fromUrl=Sets.getConfigFromUrl();renderSeed=fromUrl.seed!=null?Number(fromUrl.seed):Sets.newSeed();setsUi=Sets.mountToolbar({worksheetKey:WORKSHEET_KEY,titlePrefix:SET_TITLE_PREFIX,initialSetId:fromUrl.setId||'',getState:()=>({seed:renderSeed,config:currentConfig(),title:document.getElementById('kampaiSetTitle')?.value||''}),applyState:applySetState});if(fromUrl.setId){const row=await Sets.load(fromUrl.setId);if(row){applyConfig(row.config||{});renderSeed=Number(row.seed);setsUi?.markTitleLoaded?.(row.title||'');setsUi?.setCurrentSetId?.(row.id);render();setsUi?.setMessage?.('โหลดชุด: '+(row.title||row.id.slice(0,8)));return}}render();setsUi?.refreshSuggestedTitle?.(false)}catch(error){console.warn('worksheet sets unavailable',error);render()}}
    document.getElementById('btnRandom').onclick=randomize;document.getElementById('btnAnswerNext').onclick=()=>{if(revealCount<getQuestions().length)revealCount++;syncAnswerReveal()};document.getElementById('btnAnswerPrev').onclick=()=>{if(revealCount>0)revealCount--;syncAnswerReveal()};document.getElementById('btnAnswers').onclick=()=>{const total=getQuestions().length;revealCount=revealCount>=total?0:total;syncAnswerReveal()};document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();
    ['selStyle','selPageCount','selGrade','selRemainder','selDivisorDigits','selDividendDigits','selTeacher'].forEach(id=>document.getElementById(id).onchange=()=>{syncCustomControls();render();setsUi?.refreshSuggestedTitle?.(true)});document.getElementById('inpSchool').oninput=render;
    document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select'))return;if(event.key==='ArrowRight'||event.key==='n'||event.key==='N'){event.preventDefault();if(revealCount<getQuestions().length)revealCount++;syncAnswerReveal()}if(event.key==='ArrowLeft'||event.key==='b'||event.key==='B'){event.preventDefault();if(revealCount>0)revealCount--;syncAnswerReveal()}});
    window.ShortDivisionWorksheet=Object.freeze({traceShortDivision,validateProblem,getWorksheetCount,currentConfig});window.render=render;window.randomize=randomize;window.KampaiWorksheet.loadTeachers();bootSets();
  </script>
  <script src="/games/worksheet-modes.js?v=2.0.0"></script>
