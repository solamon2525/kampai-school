/** Build short-division digit/carry/quotient columns (media-aligned algorithm). */
function shortDivisionTrace(dividend, divisor) {
  const dividendDigits = String(dividend).split('').map(Number);
  const N = dividendDigits.length;
  const D = String(divisor).length;
  const quotientDigits = [];
  const carryOnDigit = Array(N).fill(null); // carry shown on dividend digit i (from previous rem)
  let tempRem = 0;
  let hasStarted = false;
  for (let i = 0; i < N; i++) {
    const digit = dividendDigits[i];
    const currentNumber = tempRem * 10 + digit;
    if (currentNumber < divisor && i < N - 1 && !hasStarted) {
      if (i + 1 < N) carryOnDigit[i + 1] = currentNumber;
      quotientDigits.push(null); // leading skip — no quotient digit yet (media skips writing 0 until start)
      tempRem = currentNumber;
      continue;
    }
    hasStarted = true;
    const q = Math.floor(currentNumber / divisor);
    const rem = currentNumber % divisor;
    quotientDigits.push(q);
    if (rem > 0 && i < N - 1) carryOnDigit[i + 1] = rem;
    tempRem = rem;
  }
  // Align quotient under dividend: skipped leading slots stay empty; pad left if media style wrote only after start
  // Media writes quotient only when hasStarted — leading nulls become blank cells (student may write 0 or leave blank).
  const finalQuotient = Math.floor(dividend / divisor);
  const finalRemainder = dividend % divisor;
  return {
    dividendDigits,
    divisorDigits: String(divisor).split(''),
    D, N,
    quotientDigits,
    carryOnDigit,
    finalQuotient,
    finalRemainder,
    ansText: finalRemainder > 0 ? (finalQuotient + ' เศษ ' + finalRemainder) : String(finalQuotient),
  };
}

function buildShortDivisionBoard(item) {
  const e = window.KampaiTopicWorksheet.escapeHtml;
  const t = shortDivisionTrace(item.dividend, item.divisor);
  const W = t.D + 1 + t.N + (t.finalRemainder > 0 ? 1 : 0);
  const cells = [];
  // Row 0: divisor + ) + dividend (+ carry blanks on digits that receive carry)
  for (let c = 0; c < t.D; c++) {
    cells.push({ r: 0, c, html: '<span class="sd-cell sd-divisor">' + e(t.divisorDigits[c]) + '</span>' });
  }
  cells.push({ r: 0, c: t.D, html: '<span class="sd-cell sd-bracket">)</span>' });
  for (let i = 0; i < t.N; i++) {
    const carry = t.carryOnDigit[i];
    let carryHtml = '';
    if (carry != null) {
      carryHtml = '<span class="sd-carry is-blank">' + e(String(carry)) + '</span>';
    }
    cells.push({
      r: 0,
      c: t.D + 1 + i,
      html: '<span class="sd-cell sd-dividend">' + carryHtml + e(String(t.dividendDigits[i])) + '</span>',
    });
  }
  // Row 1: quotient blanks under dividend columns
  for (let i = 0; i < t.N; i++) {
    const q = t.quotientDigits[i];
    const fill = q == null ? '' : String(q);
    cells.push({
      r: 1,
      c: t.D + 1 + i,
      html: '<span class="sd-cell sd-quotient"><span class="sd-qblank" aria-hidden="true"></span><span class="sd-qfill">' + e(fill) + '</span></span>',
    });
  }
  if (t.finalRemainder > 0) {
    cells.push({
      r: 1,
      c: t.D + 1 + t.N,
      html: '<span class="sd-cell sd-rem">เศษ ' + e(String(t.finalRemainder)) + '</span>',
    });
  }
  const grid = cells.map(function (cell) {
    return '<span style="grid-row:' + (cell.r + 1) + ';grid-column:' + (cell.c + 1) + '">' + cell.html + '</span>';
  }).join('');
  return '<div class="sd-board" style="grid-template-columns:repeat(' + W + ',var(--sd-cell))" role="img" aria-label="ตั้งหารสั้น ' + e(String(item.dividend)) + ' หารด้วย ' + e(String(item.divisor)) + '">' + grid + '</div>';
}

  directions: 'ตั้งหารสั้นเหมือนสื่อ: ตัวหาร ) ตัวตั้ง · เขียนผลหารใต้เส้น · ทดเศษตัวเล็กหน้าหลักถัดไป · ตรวจด้วยคูณย้อน',
  getItems(t) { return t === 'mixed' ? SD_ITEMS : SD_ITEMS.filter(i => i.type === t); },
  renderQuestion(item) {
    const e = window.KampaiTopicWorksheet.escapeHtml;
    const board = buildShortDivisionBoard(item);
    const stem = '<div class="q-stem"><div class="sd-prompt-row"><div class="q-prompt">' + e(item.prompt) + '</div>'
      + '<span class="sd-hint">' + e(String(item.dividend)) + ' ÷ ' + e(String(item.divisor)) + '</span></div>'
      + board
      + '<div class="sd-hint" style="margin-top:1.5mm">เขียนตัวทด (เศษ) ตัวเล็กหน้าหลักถัดไป · เขียนผลหารใต้เส้นทีละหลัก</div></div>';
    return stem
      + '<div class="q-foot"><div class="answer-line">สรุปคำตอบ <span class="answer-fill">' + e(item.answer) + '</span></div></div>';
  },
};
