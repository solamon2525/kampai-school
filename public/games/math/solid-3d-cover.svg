<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🧊</text>
  <text x="1110" y="170" font-size="190" opacity="0.07" text-anchor="middle" dominant-baseline="middle">📐</text>

  <g transform="translate(640,116)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#dbeafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6 · 3D</text>
  </g>
  <text x="640" y="288" font-size="118" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">สำรวจทรง 3 มิติ</text>
  <text x="640" y="374" font-size="34" font-weight="700" fill="#bfdbfe" text-anchor="middle" dominant-baseline="middle">หมุนดูรอบด้าน · ทายชื่อทรง · นับหน้า–ขอบ–มุม</text>

  <!-- ทรง 3 มิติ isometric -->
  <g stroke="#0f172a" stroke-width="3" stroke-linejoin="round">
    <!-- ลูกบาศก์ -->
    <g transform="translate(360,540)">
      <polygon points="0,-60 70,-95 140,-60 70,-25" fill="#93c5fd"/>
      <polygon points="0,-60 0,40 70,75 70,-25" fill="#3b82f6"/>
      <polygon points="140,-60 140,40 70,75 70,-25" fill="#2563eb"/>
    </g>
    <!-- พีระมิด -->
    <g transform="translate(620,540)">
      <polygon points="70,-110 0,40 70,75" fill="#fbbf24"/>
      <polygon points="70,-110 140,40 70,75" fill="#f59e0b"/>
      <polygon points="0,40 70,75 140,40" fill="#d97706"/>
    </g>
    <!-- ทรงกระบอก -->
    <g transform="translate(880,540)">
      <rect x="0" y="-70" width="120" height="130" fill="#f87171"/>
      <ellipse cx="60" cy="60" rx="60" ry="22" fill="#ef4444"/>
      <ellipse cx="60" cy="-70" rx="60" ry="22" fill="#fca5a5"/>
    </g>
  </g>

  <g transform="translate(640,668)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · ลากเพื่อหมุน · แข่งเวลา</text>
  </g>
</svg>
