<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern in background -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <path d="M 0,90 L 1280,90 M 0,180 L 1280,180 M 0,270 L 1280,270 M 0,360 L 1280,360 M 0,450 L 1280,450 M 0,540 L 1280,540 M 0,630 L 1280,630" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- Decorative Carnival Tent Silhouette or Abstract Shapes -->
  <circle cx="640" cy="720" r="450" fill="#047857" opacity="0.3" />
  <circle cx="1100" cy="100" r="250" fill="#0f766e" opacity="0.3" filter="blur(20px)" />
  <circle cx="150" cy="550" r="180" fill="#10b981" opacity="0.2" filter="blur(15px)" />

  <!-- Neon Glowing Multiplication Sign (X) -->
  <g transform="translate(640, 240) rotate(45)" filter="url(#glow)">
    <rect x="-110" y="-30" width="220" height="60" rx="15" fill="#fbbf24" filter="url(#shadow)" />
    <rect x="-30" y="-110" width="60" height="220" rx="15" fill="#fbbf24" filter="url(#shadow)" />
    <rect x="-100" y="-20" width="200" height="40" rx="10" fill="#f59e0b" />
    <rect x="-20" y="-100" width="40" height="200" rx="10" fill="#f59e0b" />
  </g>

  <!-- Floating Cute Mathematical Objects -->
  <!-- Orange -->
  <g transform="translate(250, 220) scale(1.6)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="30" fill="#f97316" />
    <circle cx="0" cy="0" r="27" fill="#fb923c" />
    <path d="M -10,-10 C -5,-25 15,-25 20,-10" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" />
    <path d="M 12,-16 L 22,-24" fill="none" stroke="#15803d" stroke-width="4" />
    <text x="-12" y="8" font-size="10" fill="#ffffff" opacity="0.7">🍊</text>
  </g>
  
  <!-- Carrot -->
  <g transform="translate(1000, 240) scale(1.6) rotate(15)" filter="url(#shadow)">
    <text x="0" y="0" font-size="40">🥕</text>
  </g>

  <!-- Diamonds -->
  <g transform="translate(380, 420) scale(1.4) rotate(-10)" filter="url(#shadow)">
    <text x="0" y="0" font-size="36">💎</text>
  </g>
  <g transform="translate(860, 400) scale(1.4) rotate(10)" filter="url(#shadow)">
    <text x="0" y="0" font-size="36">💎</text>
  </g>

  <!-- Stars -->
  <text x="500" y="100" font-size="40" fill="#facc15" filter="url(#glow)">⭐</text>
  <text x="760" y="120" font-size="32" fill="#facc15" filter="url(#glow)">⭐</text>
  <text x="180" y="380" font-size="28" fill="#facc15" opacity="0.8">⭐</text>
  <text x="1080" y="420" font-size="28" fill="#facc15" opacity="0.8">⭐</text>

  <!-- Floating Mathematical Equation -->
  <g transform="translate(150, 120) rotate(-5)">
    <rect x="-10" y="-30" width="200" height="50" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="90" y="3" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3 × 4 = 12</text>
  </g>
  <g transform="translate(1050, 520) rotate(5)">
    <rect x="-10" y="-30" width="220" height="50" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <text x="100" y="3" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">10 × 12 = 120</text>
  </g>

  <!-- Main Game Titles (Thai & English) -->
  <g transform="translate(640, 540)" filter="url(#shadow)">
    <text x="0" y="0" font-family="sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">อาณาจักรคณิตคิดสนุก</text>
    <text x="0" y="55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fef08a" text-anchor="middle" opacity="0.9" letter-spacing="1">ดินแดนแห่งการคูณมหัศจรรย์ 🎪✨</text>
    <text x="0" y="90" font-family="sans-serif" font-size="14" font-weight="normal" fill="#e2e8f0" text-anchor="middle" opacity="0.7" letter-spacing="4">MULTIPLICATION KINGDOM</text>
  </g>

</svg>
