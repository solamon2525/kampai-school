<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/divide-by-2-thinking-media.html"><meta name="curriculum-indicators" content="ค 1.1 ป.2/5, ค 1.1 ป.3/6, ค 1.1 ป.4/9"><title>ใบงานหาร 2 ในใจ ป.2–4 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.199.1" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.199.1" rel="stylesheet">

</head><body>
<header class="toolbar"><h1>➗ ใบงานหาร 2 ในใจ</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="2">ป.2</option><option value="3">ป.3</option><option value="4">ป.4</option></select><select class="t-select" id="selTopic" aria-label="ระดับความยาก"><option value="mixed">ผสมทุกระดับ</option><option value="d1">1 หลัก (4, 6, 8, 10...)</option><option value="d2">2 หลัก (48, 60, 88...)</option><option value="d3">3 หลัก (150, 160, 480...)</option><option value="d4">4–6 หลัก (1,200, 48,000...)</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="10">10 ข้อ</option><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.199.1"></script><script>
(function(){
  function fmt(n){return Number(n).toLocaleString('th-TH');}
  function makeItem(n){
    var ans = n / 2;
    var nStr = fmt(n);
    var ansStr = fmt(ans);
    var type = n <= 20 ? 'd1' : n < 100 ? 'd2' : n < 1000 ? 'd3' : 'd4';
    return {
      type: type,
      dividend: n,
      answer: ans,
      prompt: nStr + ' ÷ 2 = ?',
      step1: ansStr + ' + ' + ansStr + ' = ' + nStr,
      step2: ansStr + ' × 2 = ' + nStr
    };
  }

  var D1_NUMS = [4, 6, 8, 10, 12, 14, 16, 18, 20];
  var D2_NUMS = [22, 24, 26, 28, 30, 32, 34, 36, 38, 40, 42, 44, 46, 48, 50, 52, 54, 56, 58, 60, 62, 64, 66, 68, 70, 72, 74, 76, 78, 80, 82, 84, 86, 88, 90, 92, 94, 96, 98];
  var D3_NUMS = [100, 120, 140, 150, 160, 180, 200, 220, 240, 250, 260, 280, 300, 320, 340, 360, 380, 400, 420, 440, 450, 480, 500, 520, 540, 560, 580, 600, 620, 640, 660, 680, 700, 720, 740, 750, 780, 800, 840, 860, 880, 900, 920, 940, 960, 980];
  var D4_NUMS = [1200, 1400, 1600, 1800, 2400, 3200, 3600, 4800, 5000, 6000, 6400, 8000, 8800, 10000, 12000, 14000, 15000, 16000, 18000, 24000, 36000, 48000, 50000, 60000, 80000, 120000, 150000, 160000, 240000, 360000, 480000, 500000, 600000, 800000];

  var POOL_D1 = D1_NUMS.map(makeItem);
  var POOL_D2 = D2_NUMS.map(makeItem);
  var POOL_D3 = D3_NUMS.map(makeItem);
  var POOL_D4 = D4_NUMS.map(makeItem);
  var ALL_ITEMS = POOL_D1.concat(POOL_D2, POOL_D3, POOL_D4);

  window.WORKSHEET_CONFIG = {
    icon: '➗',
    title: 'ใบงานหาร 2 ในใจ',
    subject: 'คณิตศาสตร์',
    gradeLabel: 'ป.2–4',
    mediaLabel: 'หาร 2 ในใจ',
    sourceMediaUrl:'/games/math/divide-by-2-thinking-media.html',
    indicators: ['ค 1.1 ป.2/5', 'ค 1.1 ป.3/6', 'ค 1.1 ป.4/9'],
    directions: 'หาร 2 ในใจ = แบ่งครึ่ง · คิด ? + ? = ตัวตั้ง · ตรวจด้วยคำตอบ × 2',
    getItems: function(topic) {
      if (!topic || topic === 'mixed') return ALL_ITEMS;
      if (topic === 'd1') return POOL_D1;
      if (topic === 'd2') return POOL_D2;
      if (topic === 'd3') return POOL_D3;
      if (topic === 'd4') return POOL_D4;
      return ALL_ITEMS.filter(function(item) { return item.type === topic; });
    },
    renderQuestion: function(item) {
      var e = window.KampaiTopicWorksheet.escapeHtml;
      var fmtNum = window.KampaiTopicWorksheet.escapeHtml;
      return '<div class="q-stem"><div class="eq-big">' + e(fmt(item.dividend)) + ' <span class="op">÷ 2</span> = ?</div></div>'
        + '<div class="q-work-block">'
        + '<div class="calc-line"><span class="work-label">แบ่งครึ่ง:</span> <span class="work-fill">' + e(item.step1) + '</span></div>'
        + '<div class="calc-line"><span class="work-label">ตรวจคำตอบ:</span> <span class="work-fill">' + e(item.step2) + '</span></div>'
        + '</div>'
        + '<div class="q-foot"><div class="answer-line">คำตอบ <span class="answer-fill">' + e(fmt(item.answer)) + '</span></div></div>';
    }
  };
})();
</script><script src="/games/worksheet-topic.js?v=1.199.1"></script><script>
function render(){window.KampaiTopicWorksheet.render();}
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick=function(){document.body.classList.toggle('show-answers');};
document.getElementById('btnPrint').onclick=function(){window.KampaiWorksheet.printA4();};
window.KampaiWorksheet.loadTeachers();
render();
</script><script src="/games/worksheet-modes.js?v=1.199.1"></script></body></html>
