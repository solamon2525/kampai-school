const FH_TOPICS=['improper_mixed','shade','read','compare','add','subtract','whole','mixed_add','mixed_sub'],FH_VISUAL_TOPICS=new Set(['improper_mixed','shade','read','compare']),FH_LEVEL_DENOMS={easy:[2,3,4,5],mid:[2,3,4,5,6,8],hard:[2,3,4,5,6,7,8,10,12]};
function fhGcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const next=a%b;a=b;b=next}return a||1}function fhSimplify(n,d){const g=fhGcd(n,d);return[n/g,d/g]}function fhMixed(total,d){const whole=Math.floor(total/d),remainder=total%d;if(!remainder)return String(whole);const simple=fhSimplify(remainder,d);return(whole?whole+' ':'')+simple[0]+'/'+simple[1]}function fhHash(text){let hash=2166136261;for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619)}return hash>>>0}function fhItem(type,params){return{type,key:type+'|'+params.join('|'),...params.reduce((out,value,index)=>(out['p'+index]=value,out),{})}}
function fhBuildTopic(type,level){const denoms=FH_LEVEL_DENOMS[level]||FH_LEVEL_DENOMS.mid,items=[];for(const d of denoms){if(type==='shade'||type==='read'){for(let n=1;n<2*d;n++)items.push(fhItem(type,[n,d]));continue}if(type==='compare'){for(let a=1;a<2*d;a++)for(let b=a+1;b<2*d;b++)items.push(fhItem(type,[a,b,d]));continue}if(type==='add'){for(let a=1;a<d;a++)for(let b=1;b<d;b++)items.push(fhItem(type,[a,b,d]));continue}if(type==='subtract'){for(let a=2;a<2*d;a++)for(let b=1;b<a;b++)items.push(fhItem(type,[a,b,d]));continue}if(type==='whole'){for(let whole=1;whole<=4;whole++)for(let n=1;n<d;n++)items.push(fhItem(type,[whole,n,d]));continue}if(type==='mixed_add'){for(let w1=1;w1<=3;w1++)for(let w2=1;w2<=2;w2++)for(let n1=1;n1<d;n1++)for(let n2=n1;n2<d;n2++)items.push(fhItem(type,[w1,n1,w2,n2,d]));continue}for(let w1=2;w1<=5;w1++)for(let w2=1;w2<w1;w2++)for(let n1=0;n1<d;n1++)for(let n2=1;n2<d;n2++){const left=w1*d+n1,right=w2*d+n2;if(left>right)items.push(fhItem(type,[w1,n1,w2,n2,d]))}}return items.sort((a,b)=>fhHash(a.key+'|'+level)-fhHash(b.key+'|'+level)).slice(0,144)}
function fhBuildPool(topic){const level=document.getElementById('selLevel')?.value||'mid';return(topic==='mixed'?FH_TOPICS:[topic]).flatMap(type=>fhBuildTopic(type,level))}
function fhBarSvg(n,d,mode,compact){const bars=Math.max(1,Math.ceil(n/d)),parts=[];for(let bar=0;bar<bars;bar++){const cells=[];for(let i=0;i<d;i++){const active=bar*d+i<n,klass='fraction-segment'+(active&&mode==='given'?' given-fill':'')+(active&&mode==='solution'?' solution-fill':'');cells.push('<rect class="'+klass+'" x="'+(i*360/d)+'" y="2" width="'+(360/d)+'" height="38"/>')}parts.push('<svg class="fraction-svg'+(compact?' compact':'')+'" viewBox="0 0 360 42" role="img" aria-label="แท่งเศษส่วน '+n+' ส่วนจากส่วนละ '+d+'"><defs><pattern id="fh-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#475569" stroke-width="1.4"/></pattern></defs>'+cells.join('')+'</svg>')}return'<div class="fraction-visual">'+parts.join('')+'</div>'}function fhFrac(n,d){return n+'/'+d}
function fhAnswer(p){if(p.type==='shade'||p.type==='read')return fhFrac(p.p0,p.p1);if(p.type==='compare')return p.p0+'/'+p.p2+' < '+p.p1+'/'+p.p2;if(p.type==='add')return fhMixed(p.p0+p.p1,p.p2);if(p.type==='subtract')return fhMixed(p.p0-p.p1,p.p2);if(p.type==='whole')return p.p0+' '+p.p1+'/'+p.p2;const d=p.p4,left=p.p0*d+p.p1,right=p.p2*d+p.p3,total=p.type==='mixed_add'?left+right:left-right;return fhMixed(total,d)}
function fhFracHtml(n,d){return'<span class="frac-stack" data-fraction="'+n+'/'+d+'"><span class="frac-num">'+n+'</span><span class="frac-den">'+d+'</span></span>'}function fhMixedHtml(whole,n,d){if(!whole)return fhFracHtml(n,d);return'<span class="mixed-number" data-mixed-number="'+whole+' '+n+'/'+d+'" aria-label="'+whole+' เศษ '+n+' ส่วน '+d+'"><span class="whole-num">'+whole+'</span>'+fhFracHtml(n,d)+'</span>'}function fhValueHtml(value){const text=String(value),parts=text.split(' '),fraction=parts.at(-1);if(fraction.includes('/')){const[n,d]=fraction.split('/');return fhMixedHtml(parts.length>1?parts[0]:'',n,d)}return'<span class="whole-num">'+text+'</span>'}function fhSlot(value,short=false){return'<span class="answer-slot'+(short?' short':'')+'">'+fhValueHtml(value)+'</span>'}function fhFinal(item){return'<div class="fraction-final">ตอบ <span class="answer-fill">'+fhValueHtml(fhAnswer(item))+'</span></div>'}function fhOperand(whole,n,d){return n?fhMixedHtml(whole,n,d):fhValueHtml(whole)}function fhArithmeticSteps(a,b,d,op,raw){const simple=fhSimplify(raw,d),g=fhGcd(raw,d),rows=['<div class="calc-step"><span class="step-no">①</span> รวมตัวเศษ '+a+' '+op+' '+b+' = '+fhSlot(raw,true)+' · คงตัวส่วน '+fhSlot(d,true)+'</div>','<div class="calc-step"><span class="step-no">②</span> จึงได้ '+fhSlot(fhFrac(raw,d))+'</div>'];if(g>1){const reduced=simple[0]===simple[1]?1:fhFrac(simple[0],simple[1]);rows.push('<div class="calc-step"><span class="step-no">③</span> หารทั้งเศษและส่วนด้วย '+fhSlot(g,true)+' ได้ '+fhSlot(reduced)+'</div>')}else rows.push('<div class="calc-step"><span class="step-no">③</span> เป็นเศษส่วนอย่างต่ำแล้ว</div>');if(simple[0]>simple[1]){const whole=Math.floor(simple[0]/simple[1]),remainder=simple[0]%simple[1];rows.push('<div class="calc-step"><span class="step-no">④</span> '+simple[0]+' ÷ '+simple[1]+' = '+fhSlot(whole,true)+' เศษ '+fhSlot(remainder,true)+'</div>')}else if(simple[0]===simple[1])rows.push('<div class="calc-step"><span class="step-no">④</span> แปลงเป็นจำนวนเต็ม '+fhSlot(1,true)+'</div>');return'<div class="calc-steps">'+rows.join('')+'</div>'}
function fhRenderQuestion(item){const final=fhFinal(item);if(item.type==='shade')return'<div class="fraction-task"><div class="fraction-prompt">ระบาย '+fhFracHtml(item.p0,item.p1)+' ของแท่งให้ถูกต้อง</div>'+fhBarSvg(item.p0,item.p1,'solution',false)+'<div class="fraction-blanks">ระบาย '+fhSlot(item.p0,true)+' ส่วน จาก '+fhSlot(item.p1,true)+' ส่วนต่อหนึ่งหน่วย</div>'+final+'</div>';if(item.type==='read')return'<div class="fraction-task"><div class="fraction-prompt">ดูภาพแล้วเติมคำตอบ</div>'+fhBarSvg(item.p0,item.p1,'given',false)+'<div class="fraction-blanks">ตัวเศษ '+fhSlot(item.p0,true)+' ตัวส่วน '+fhSlot(item.p1,true)+'</div>'+final+'</div>';if(item.type==='compare')return'<div class="fraction-task"><div class="fraction-prompt">เติม &gt; &lt; หรือ =</div><div class="fraction-visuals two">'+fhBarSvg(item.p0,item.p2,'given',true)+fhBarSvg(item.p1,item.p2,'given',true)+'</div><div class="fraction-equation">'+fhFracHtml(item.p0,item.p2)+fhSlot('&lt;',true)+fhFracHtml(item.p1,item.p2)+'</div>'+final+'</div>';if(item.type==='whole')return'<div class="fraction-task"><div class="fraction-prompt">เติมจำนวนคละจากจำนวนเต็มและเศษส่วน</div><div class="fraction-equation">'+item.p0+' + '+fhFracHtml(item.p1,item.p2)+' = ?</div>'+fhBarSvg(item.p1,item.p2,'given',true)+'<div class="fraction-work"><span>จำนวนเต็ม '+fhSlot(item.p0,true)+'</span><span>ส่วนเศษ '+fhSlot(fhFrac(item.p1,item.p2))+'</span></div>'+final+'</div>';if(item.type==='add'||item.type==='subtract'){const op=item.type==='add'?'+':'−',raw=item.type==='add'?item.p0+item.p1:item.p0-item.p1;return'<div class="fraction-task"><div class="fraction-prompt">'+(item.type==='add'?'บวก':'ลบ')+'เศษส่วนตัวส่วนเท่ากัน</div><div class="fraction-equation">'+fhFracHtml(item.p0,item.p2)+' '+op+' '+fhFracHtml(item.p1,item.p2)+' = ?</div>'+fhArithmeticSteps(item.p0,item.p1,item.p2,op,raw)+final+'</div>'}const d=item.p4,op=item.type==='mixed_add'?'+':'−',isAdd=item.type==='mixed_add',borrow=!isAdd&&item.p1<item.p3?1:0,whole=isAdd?item.p0+item.p2:item.p0-item.p2-borrow,numerator=isAdd?item.p1+item.p3:item.p1+borrow*d-item.p3,carry=isAdd?Math.floor(numerator/d):borrow;return'<div class="fraction-task"><div class="fraction-prompt">'+(isAdd?'บวก':'ลบ')+'จำนวนคละ</div><div class="fraction-equation">'+fhOperand(item.p0,item.p1,d)+' '+op+' '+fhOperand(item.p2,item.p3,d)+' = ?</div><div class="fraction-work"><span>จำนวนเต็ม = '+fhSlot(whole,true)+'</span><span>ส่วนเศษ = '+fhSlot(fhFrac(numerator,d))+'</span></div><div class="fraction-blanks">'+(isAdd?'ทด':'ยืม')+' '+fhSlot(carry,true)+' หน่วย</div>'+final+'</div>'}
function fhSelectPages({fullPool,selectedPool,count,pageCount,shuffle,nextRandom}){const topic=document.getElementById('selTopic')?.value||'mixed',used=new Set(),pages=[];if(topic==='mixed'){const groups=Object.fromEntries(FH_TOPICS.map(type=>[type,shuffle(fullPool.filter(item=>item.type===type))])),cursors=Object.fromEntries(FH_TOPICS.map(type=>[type,0])),start=Math.floor(nextRandom()*FH_TOPICS.length);for(let page=0;page<pageCount;page++){const items=[];for(let i=0;i<count;i++){const type=FH_TOPICS[(start+page*count+i)%FH_TOPICS.length],item=groups[type][cursors[type]++];if(!item||used.has(item.key))throw new Error('คลังโจทย์เศษส่วนผสมไม่พอสำหรับชุดที่เลือก');used.add(item.key);items.push(item)}pages.push(shuffle(items))}return pages}const selectedKeys=new Set(selectedPool.map(item=>item.key)),pool=[...shuffle(selectedPool),...shuffle(fullPool.filter(item=>!selectedKeys.has(item.key)))];for(let page=0;page<pageCount;page++){const items=[];for(const item of pool){if(items.length>=count)break;if(used.has(item.key))continue;used.add(item.key);items.push(item)}if(items.length!==count)throw new Error('คลังโจทย์เศษส่วนไม่พอสำหรับชุดที่เลือก');pages.push(items)}return pages}function fhSyncCount(){const topic=document.getElementById('selTopic')?.value||'mixed',count=topic==='mixed'||FH_VISUAL_TOPICS.has(topic)?6:8,select=document.getElementById('selCount');select.value=String(count);select.dataset.fixedCount=String(count);return count}
const fhBuildTopicBase=fhBuildTopic,fhAnswerBase=fhAnswer,fhRenderQuestionBase=fhRenderQuestion;
function fhImproperData(item){const numerator=item.p0,denominator=item.p1,whole=Math.floor(numerator/denominator),remainder=numerator%denominator,simple=fhSimplify(remainder,denominator);return{numerator,denominator,whole,remainder,divisor:fhGcd(remainder,denominator),simpleNumerator:simple[0],simpleDenominator:simple[1],answer:whole+' '+simple[0]+'/'+simple[1]}}
fhBuildTopic=function(type,level){if(type!=='improper_mixed')return fhBuildTopicBase(type,level);const denoms=FH_LEVEL_DENOMS[level]||FH_LEVEL_DENOMS.mid,items=[],minWhole=level==='hard'?2:1,maxWhole=level==='easy'?2:level==='hard'?5:3;for(const d of denoms)for(let whole=minWhole;whole<=maxWhole;whole++)for(let remainder=1;remainder<d;remainder++){const divisor=fhGcd(remainder,d);if(level==='easy'&&divisor!==1)continue;items.push(fhItem(type,[whole*d+remainder,d]))}return items.sort((a,b)=>fhHash(a.key+'|'+level)-fhHash(b.key+'|'+level)).slice(0,144)};
fhAnswer=function(item){return item.type==='improper_mixed'?fhImproperData(item).answer:fhAnswerBase(item)};
fhRenderQuestion=function(item){if(item.type!=='improper_mixed')return fhRenderQuestionBase(item);const data=fhImproperData(item),visual=fhBarSvg(data.numerator,data.denominator,'given',true).replace('class="fraction-visual"','class="fraction-visual convert-visual"'),rows=['<div class="calc-step"><span class="step-no">①</span> '+data.numerator+' ÷ '+data.denominator+' = '+fhSlot(data.whole,true)+' เศษ '+fhSlot(data.remainder,true)+'</div>','<div class="calc-step"><span class="step-no">②</span> จำนวนเต็ม '+fhSlot(data.whole,true)+' · ตัวเศษ '+fhSlot(data.remainder,true)+' · ตัวส่วน '+fhSlot(data.denominator,true)+'</div>'];if(data.divisor>1)rows.push('<div class="calc-step"><span class="step-no">③</span> ย่อ '+fhFracHtml(data.remainder,data.denominator)+' ÷ '+fhSlot(data.divisor,true)+' = '+fhSlot(fhFrac(data.simpleNumerator,data.simpleDenominator))+'</div>');else rows.push('<div class="calc-step"><span class="step-no">③</span> ส่วนเศษเป็นเศษส่วนอย่างต่ำแล้ว</div>');rows.push('<div class="calc-step"><span class="step-no">④</span> เขียนจำนวนคละ '+fhSlot(data.answer)+'</div>');return'<div class="fraction-task"><div class="fraction-prompt">แปลงเศษเกินเป็นจำนวนคละ</div><div class="fraction-equation">'+fhFracHtml(data.numerator,data.denominator)+' = ?</div>'+visual+'<div class="calc-steps">'+rows.join('')+'</div>'+fhFinal(item)+'</div>'};
