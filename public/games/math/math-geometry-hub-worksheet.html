<!DOCTYPE html>

<header class="toolbar"><h1>📐 ใบงานคลังเรขาคณิต</h1><div class="toolbar-ctrls">

  <select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4–ป.5</option></select>
  <select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="angle">มุม</option><option value="perimeter">เส้นรอบรูป</option><option value="area">พื้นที่</option><option value="shapes">รูปเรขา 2D</option></select>

  <button class="btn" id="btnAnswers">👁 เฉลยครู</button>
  <button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button>
</div></header>
<main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.172.0"></script>
<script>
const ITEMS=[{"type":"angle","prompt":"จำแนกชนิดมุม","degrees":"35°","answer":"มุมแหลม"},{"type":"angle","prompt":"จำแนกชนิดมุม","degrees":"90°","answer":"มุมฉาก"},{"type":"angle","prompt":"จำแนกชนิดมุม","degrees":"135°","answer":"มุมป้าน"},{"type":"angle","prompt":"จำแนกชนิดมุม","degrees":"180°","answer":"มุมตรง"},{"type":"perimeter","prompt":"หาเส้นรอบรูปสี่เหลี่ยมผืนผ้า","w":8,"h":3,"answer":"22 หน่วย"},{"type":"perimeter","prompt":"หาเส้นรอบรูปสี่เหลี่ยมจัตุรัส","w":6,"h":6,"answer":"24 หน่วย"},{"type":"perimeter","prompt":"หาเส้นรอบรูปสี่เหลี่ยมผืนผ้า","w":12,"h":5,"answer":"34 หน่วย"},{"type":"perimeter","prompt":"เขียนสูตรแล้วแทนค่า","w":9,"h":4,"answer":"2(9+4)=26"},{"type":"area","prompt":"หาพื้นที่สี่เหลี่ยมผืนผ้า","w":7,"h":4,"answer":"28 ตารางหน่วย"},{"type":"area","prompt":"หาพื้นที่สี่เหลี่ยมจัตุรัส","w":5,"h":5,"answer":"25 ตารางหน่วย"},{"type":"area","prompt":"หาพื้นที่สี่เหลี่ยมผืนผ้า","w":10,"h":6,"answer":"60 ตารางหน่วย"},{"type":"area","prompt":"เขียนสูตร กว้าง×ยาว","w":11,"h":3,"answer":"11×3=33"},{"type":"shapes","prompt":"บอกจำนวนด้านและมุม","shape":"สามเหลี่ยม","answer":"3 ด้าน 3 มุม"},{"type":"shapes","prompt":"บอกจำนวนด้านและมุม","shape":"สี่เหลี่ยมผืนผ้า","answer":"4 ด้าน 4 มุมฉาก"},{"type":"shapes","prompt":"บอกลักษณะพิเศษ","shape":"สี่เหลี่ยมจัตุรัส","answer":"ด้านเท่า มุมฉากทั้ง 4"},{"type":"shapes","prompt":"บอกลักษณะพิเศษ","shape":"วงกลม","answer":"ไม่มีมุม · มีรัศมี/เส้นผ่านศูนย์กลาง"},{"type":"angle","prompt":"ประมาณชนิดมุมจากคำอธิบาย","degrees":"มุมเปิดประตูเล็กน้อย","answer":"มุมแหลม"},{"type":"area","prompt":"ตรวจด้วยการคูณย้อนกลับ","w":8,"h":2,"answer":"16 · ตรวจ 16÷8=2"}];
window.WORKSHEET_CONFIG={
  icon:'📐',title:'ใบงานคลังเรขาคณิต',subject:'คณิตศาสตร์',gradeLabel:'ป.4–ป.5',
  mediaLabel:'คลังเรขาคณิต',sourceMediaUrl:'/games/math/math-geometry-hub/index.html',
  indicators:["ค 2.2 ป.4/1","ค 2.2 ป.4/2"],
  directions:"จำแนกมุม คำนวณเส้นรอบรูป/พื้นที่ และบอกลักษณะรูปเรขา",
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(item=>item.type===topic);},
  renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;
    if(item.type==='angle'){
      return '<div class="q-prompt">'+e(item.prompt)+' · '+e(item.degrees)+'</div>'
        +'<div class="classify-grid geometry-hub-grid angle-type-grid">'
        +'<div class="classify-box">[ ] มุมแหลม</div><div class="classify-box">[ ] มุมฉาก</div>'
        +'<div class="classify-box">[ ] มุมป้าน</div><div class="classify-box">[ ] มุมตรง</div></div>'
        +'<div class="reason-line"></div>'
        +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';
    }
    if(item.type==='perimeter'){
      return '<div class="q-prompt">'+e(item.prompt)+'</div>'
        +'<div class="q-context">กว้าง '+item.w+' · ยาว '+item.h+'</div>'
        +'<div class="decision-box geometry-hub-grid">สูตรเส้นรอบรูป: ____________________</div>'
        +'<div class="calc-line"></div><div class="work-line"></div><div class="reason-line"></div>'
        +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';
    }
    if(item.type==='area'){
      return '<div class="q-prompt">'+e(item.prompt)+'</div>'
        +'<div class="q-context">กว้าง '+item.w+' · ยาว '+item.h+'</div>'
        +'<div class="decision-box geometry-hub-grid">สูตรพื้นที่: กว้าง × ยาว = ________</div>'
        +'<div class="calc-line"></div><div class="work-line"></div><div class="reason-line"></div>'
        +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';
    }
    return '<div class="q-prompt">'+e(item.prompt)+' · '+e(item.shape)+'</div>'
      +'<div class="classify-grid geometry-hub-grid">'
      +'<div class="classify-box">ด้าน: ____</div><div class="classify-box">มุม: ____</div>'
      +'<div class="classify-box">ลักษณะ: ________</div><div class="classify-box">ตัวอย่างในชีวิต: ________</div></div>'
      +'<div class="reason-line"></div>'
      +'<span class="teacher-answer">เฉลย: '+e(item.answer)+'</span>';}
};
</script>
<script src="/games/worksheet-topic.js?v=1.172.0"></script>
<script>
function render(){window.KampaiTopicWorksheet.render();}
document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;
document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');
document.getElementById('btnPrint').onclick=()=>window.print();
window.KampaiWorksheet.loadTeachers();
render();
</script>
<script src="/games/worksheet-modes.js?v=1.172.0"></script>
