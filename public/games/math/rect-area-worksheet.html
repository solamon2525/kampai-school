abel{font:700 .82rem Sarabun,sans-serif;padding:6px 8px;border-radius:8px;background:#0369a1;color:#fff;min-width:7.5rem;text-align:center}.sheet-foot{text-align:right;color:#64748b;font-size:8pt}

<body>

    <div class="toolbar-ctrls">
      <select class="t-select" id="selStyle" hidden><option value="standard">รูปแบบมาตรฐาน</option></select>

      </select>
      <select class="t-select" id="selTopic" aria-label="หัวข้อรูปทรง">
        <option value="all" selected>หัวข้อ: รวมรูปทรงทั้งหมด</option>
        <option value="square">สี่เหลี่ยมจัตุรัส</option>

        <option value="parallelogram">สี่เหลี่ยมด้านขนาน</option>
        <option value="rhombus">สี่เหลี่ยมขนมเปียกปูน</option>
        <option value="trapezoid">สี่เหลี่ยมคางหมู</option>
        <option value="kite">รูปว่าว</option>
        <option value="circle">วงกลม</option>

      <span class="answer-step-label" id="answerStepLabel" aria-live="polite">เฉลย: ปิด</span>

  <main class="pages" id="pages"></main>
  <script src="/games/worksheet-runtime.js?v=1.175.2"></script>
  <script>
    const PI=3.14;
    const WORKSHEET_KEY='rect-area';
    const SET_TITLE_PREFIX='พื้นที่เรขาคณิต';
    const TOPIC_SHORT={
      all:'ทุกรูป',
      square:'จัตุรัส',
      rectangle:'ผืนผ้า',
      triangle:'สามเหลี่ยม',
      parallelogram:'ด้านขนาน',
      rhombus:'ขนมเปียกปูน',
      trapezoid:'คางหมู',
      kite:'รูปว่าว',
      circle:'วงกลม',
      semicircle:'ครึ่งวงกลม',
      quarter:'¼ วงกลม',
      composite:'รูปประกอบ',
    };
    const SHAPES=[
      {id:'square',icon:'⬜',name:'สี่เหลี่ยมจัตุรัส',grade:'ป.4',formula:'ด้าน × ด้าน',keys:['side'],calc:p=>p.side*p.side},
      {id:'rectangle',icon:'▭',name:'สี่เหลี่ยมผืนผ้า',grade:'ป.4',formula:'กว้าง × ยาว',keys:['width','height'],calc:p=>p.width*p.height},
      {id:'triangle',icon:'🔺',name:'สามเหลี่ยม',grade:'ป.5',formula:'½ × ฐาน × สูง',keys:['base','height'],calc:p=>p.base*p.height/2},
      {id:'parallelogram',icon:'▱',name:'สี่เหลี่ยมด้านขนาน',grade:'ป.5',formula:'ฐาน × สูง',keys:['base','height'],calc:p=>p.base*p.height},
      {id:'rhombus',icon:'◇',name:'สี่เหลี่ยมขนมเปียกปูน',grade:'ป.5',formula:'½ × ทแยงมุม 1 × ทแยงมุม 2',keys:['d1','d2'],calc:p=>p.d1*p.d2/2},
      {id:'trapezoid',icon:'⏢',name:'สี่เหลี่ยมคางหมู',grade:'ป.6',formula:'½ × (คู่ขนาน 1 + คู่ขนาน 2) × สูง',keys:['top','bottom','height'],calc:p=>(p.top+p.bottom)*p.height/2},
      {id:'kite',icon:'🪁',name:'รูปว่าว',grade:'ป.6',formula:'½ × ทแยงมุม 1 × ทแยงมุม 2',keys:['d1','d2'],calc:p=>p.d1*p.d2/2},
      {id:'circle',icon:'⚪',name:'วงกลม',grade:'ป.6',formula:'π × รัศมี² (π≈3.14)',keys:['radius'],calc:p=>PI*p.radius*p.radius},
      {id:'semicircle',icon:'◒',name:'ครึ่งวงกลม',grade:'ป.6',formula:'½ × π × รัศมี²',keys:['radius'],calc:p=>PI*p.radius*p.radius/2},
      {id:'quarter',icon:'◔',name:'หนึ่งในสี่วงกลม',grade:'ป.6',formula:'¼ × π × รัศมี²',keys:['radius'],calc:p=>PI*p.radius*p.radius/4},
      {id:'composite',icon:'🧩',name:'รูปประกอบแบบตัดออก',grade:'ป.6',formula:'พื้นที่รูปใหญ่ − พื้นที่ส่วนที่ตัด',keys:['width','height','cutW','cutH'],calc:p=>p.width*p.height-p.cutW*p.cutH},
    ];
    const label={side:'ด้าน',width:'กว้าง',height:'สูง',base:'ฐาน',d1:'ทแยงมุม 1',d2:'ทแยงมุม 2',top:'คู่ขนาน 1',bottom:'คู่ขนาน 2',radius:'รัศมี',cutW:'ส่วนตัดกว้าง',cutH:'ส่วนตัดสูง'};
    let renderSeed=Date.now();
    let rng=null;
    let setsUi=null;
    function topicShortLabel(topicId){
      if(TOPIC_SHORT[topicId])return TOPIC_SHORT[topicId];
      const shape=SHAPES.find((s)=>s.id===topicId);
      return shape?shape.name:'ทุกรูป';
    }
    function suggestSetTitle(ctx){
      const topic=document.getElementById('selTopic')?.value||'all';
      const pages=Math.max(1,Number(document.getElementById('selPageCount')?.value||1)||1);
      const labelText=topicShortLabel(topic);
      const rows=ctx?.rows||[];
      let maxN=0;
      let count=0;
      rows.forEach((row)=>{
        if(String(row?.config?.topic??'')!==topic)return;
        if(Number(row?.config?.pageCount||0)!==pages)return;
        count+=1;
        const match=String(row.title||'').match(/ชุด\s*(\d+)/);
        if(match)maxN=Math.max(maxN,Number(match[1])||0);
      });
      const n=Math.max(maxN,count)+1;
      return SET_TITLE_PREFIX+' - '+labelText+' · '+pages+' หน้า · ชุด '+n;
    }
    function ensureRng(){
      if(window.KampaiWorksheetSets) rng=window.KampaiWorksheetSets.createRng(renderSeed);
      else rng=null;
    }
    const r=(a,b)=>rng?rng.randomInt(a,b):(a+Math.floor(Math.random()*(b-a+1)));
    const fmt=n=>Math.round(n*100)/100;
    /** ค่าลายนิ้วมือของโจทย์ — ใช้กันซ้ำในหน้าเดียวกัน */
    function fingerprint(s,p){
      return s.id+':'+s.keys.map((k)=>k+'='+p[k]).join('|');
    }
    /**
     * สุ่มค่าโจทย์แบบประถม: จำนวนเต็มเท่านั้น
     * (ไม่ใช้รัศมีทศนิยม — π×r² ด้วย .5 ทำให้ได้ทศนิยมยาวเกินระดับ ป.4–6)
     * ขยายช่วงเลขให้พอสำหรับ 10 ข้อไม่ซ้ำ
     */
    function rawValues(s){
      let p={};
      if(s.id==='square'){
        p.side=r(3,18);
      }else if(s.id==='rectangle'){
        p.width=r(3,16);
        p.height=r(2,14);
        if(p.height===p.width)p.height=p.width===14?p.width-1:p.width+1;
      }else if(s.id==='triangle'||s.id==='parallelogram'){
        p.base=r(3,16);
        p.height=r(2,14);
        if(s.id==='triangle'&&(p.base*p.height)%2)p.height+=1;
      }else if(s.id==='rhombus'||s.id==='kite'){
        p.d1=r(4,16);
        p.d2=r(3,14);
        if(p.d1===p.d2)p.d2=p.d1===14?p.d1-1:p.d1+1;
        if((p.d1*p.d2)%2)p.d2+=1;
      }else if(s.id==='trapezoid'){
        p.top=r(2,10);
        p.bottom=r(p.top+1,16);
        p.height=r(2,12);
        if(((p.top+p.bottom)*p.height)%2)p.height+=1;
      }else if(s.id==='circle'||s.id==='semicircle'||s.id==='quarter'){
        // รัศมีจำนวนเต็ม 2–15 (14 ค่า) พอสำหรับ 10 ข้อไม่ซ้ำ โดยไม่ต้องใช้ทศนิยม
        p.radius=r(2,15);
      }else if(s.id==='composite'){
        p.width=r(8,16);
        p.height=r(7,14);
        p.cutW=r(2,p.width-3);
        p.cutH=r(2,p.height-3);
      }else{
        s.keys.forEach((k)=>{p[k]=r(2,14);});
      }
      return p;
    }
    function values(s,used){
      const seen=used||new Set();
      for(let attempt=0;attempt<48;attempt+=1){
        const p=rawValues(s);
        const fp=fingerprint(s,p);
        if(!seen.has(fp)){
          seen.add(fp);
          return p;
        }
      }
      // สำรอง: ดันค่าหลักให้ต่างจากที่เคยใช้ (กรณีชุดเกือบเต็ม)
      const p=rawValues(s);
      const key=s.keys[0];
      for(let bump=1;bump<=20;bump+=1){
        p[key]=(Number(p[key])||2)+bump;
        const fp=fingerprint(s,p);
        if(!seen.has(fp)){
          seen.add(fp);
          return p;
        }
      }
      seen.add(fingerprint(s,p));
      return p;
    }
    function currentConfig(){
      return{
        pageCount:document.getElementById('selPageCount').value,
        topic:document.getElementById('selTopic').value,
        style:document.getElementById('selStyle')?.value||'standard',
        useMode:document.getElementById('selUseMode')?.value||'standard',
      };
    }
    function applyConfig(cfg){
      if(!cfg)return;
      if(cfg.pageCount!=null)document.getElementById('selPageCount').value=String(cfg.pageCount);
      if(cfg.topic!=null)document.getElementById('selTopic').value=String(cfg.topic);
      if(cfg.style!=null&&document.getElementById('selStyle'))document.getElementById('selStyle').value=String(cfg.style);
      if(cfg.useMode!=null&&document.getElementById('selUseMode'))document.getElementById('selUseMode').value=String(cfg.useMode);
    }
    function svg(s,p){
      let body='';
      if(s.id==='square')body='<rect class="shape" x="25" y="15" width="80" height="80"/><text class="label" x="65" y="110" text-anchor="middle">ด้าน = '+p.side+'</text>';
      else if(s.id==='rectangle')body='<rect class="shape" x="12" y="25" width="106" height="65"/><text class="label" x="65" y="105" text-anchor="middle">กว้าง = '+p.width+'</text><text class="label" x="2" y="60">สูง = '+p.height+'</text>';
      else if(s.id==='triangle')body='<polygon class="shape" points="10,95 120,95 82,12"/><line class="measure" x1="82" y1="12" x2="82" y2="95"/><text class="label" x="65" y="110" text-anchor="middle">ฐาน = '+p.base+'</text><text class="label" x="86" y="55">สูง = '+p.height+'</text>';
      else if(s.id==='parallelogram')body='<polygon class="shape" points="35,18 120,18 95,95 10,95"/><line class="measure" x1="35" y1="18" x2="35" y2="95"/><text class="label" x="64" y="110" text-anchor="middle">ฐาน = '+p.base+'</text><text class="label" x="38" y="58">สูง = '+p.height+'</text>';
      else if(s.id==='rhombus'||s.id==='kite')body='<polygon class="shape" points="65,7 120,55 65,108 10,55"/><line class="measure" x1="10" y1="55" x2="120" y2="55"/><line class="measure" x1="65" y1="7" x2="65" y2="108"/><text class="label" x="67" y="18">ทแยง 1 = '+p.d1+'</text><text class="label" x="94" y="51">ทแยง 2 = '+p.d2+'</text>';
      else if(s.id==='trapezoid')body='<polygon class="shape" points="38,18 94,18 120,95 10,95"/><line class="measure" x1="38" y1="18" x2="38" y2="95"/><text class="label" x="66" y="14" text-anchor="middle">คู่ขนาน 1 = '+p.top+'</text><text class="label" x="65" y="108" text-anchor="middle">คู่ขนาน 2 = '+p.bottom+'</text><text class="label" x="41" y="59">สูง = '+p.height+'</text>';
      else if(s.id==='circle')body='<circle class="shape" cx="65" cy="57" r="45"/><line class="measure" x1="65" y1="57" x2="110" y2="57"/><text class="label" x="82" y="52">รัศมี = '+p.radius+'</text>';
      else if(s.id==='semicircle')body='<path class="shape" d="M12 90 A53 53 0 0 1 118 90 Z"/><line class="measure" x1="65" y1="90" x2="118" y2="90"/><text class="label" x="86" y="84">รัศมี = '+p.radius+'</text>';
      else if(s.id==='quarter')body='<path class="shape" d="M18 100 V18 A82 82 0 0 1 100 100 Z"/><line class="measure" x1="18" y1="100" x2="100" y2="100"/><text class="label" x="55" y="94">รัศมี = '+p.radius+'</text>';
      else body='<path class="shape" d="M10 12 H120 V100 H76 V65 H10 Z"/><rect class="cut" x="76" y="65" width="44" height="35"/><text class="label" x="65" y="110" text-anchor="middle">กว้าง = '+p.width+'</text><text class="label" x="2" y="56">สูง = '+p.height+'</text><text class="label" x="78" y="62">ตัด '+p.cutW+'×'+p.cutH+'</text>';
      return '<svg class="mini" viewBox="0 0 130 115" role="img" aria-label="'+s.name+'">'+body+'</svg>';
    }
    function buildWorkSolution(s,p){
      const answer=fmt(s.calc(p));
      switch(s.id){
        case 'square':return{line1:s.formula+' = '+p.side+' × '+p.side,line2:'= '+answer,answer};
        case 'rectangle':return{line1:s.formula+' = '+p.width+' × '+p.height,line2:'= '+answer,answer};
        case 'triangle':{const prod=p.base*p.height;return{line1:'½ × '+p.base+' × '+p.height+' = ½ × '+prod,line2:'= '+prod+' ÷ 2 = '+answer,answer};}
        case 'parallelogram':return{line1:s.formula+' = '+p.base+' × '+p.height,line2:'= '+answer,answer};
        case 'rhombus':
        case 'kite':{const prod=p.d1*p.d2;return{line1:'½ × '+p.d1+' × '+p.d2+' = ½ × '+prod,line2:'= '+prod+' ÷ 2 = '+answer,answer};}
        case 'trapezoid':{const sum=p.top+p.bottom,prod=sum*p.height;return{line1:'½ × ('+p.top+' + '+p.bottom+') × '+p.height+' = ½ × '+sum+' × '+p.height,line2:'= ½ × '+prod+' = '+prod+' ÷ 2 = '+answer,answer};}
        case 'circle':{const sq=p.radius*p.radius;return{line1:'3.14 × '+p.radius+' × '+p.radius+' = 3.14 × '+sq,line2:'= '+answer,answer};}
        case 'semicircle':{const full=fmt(PI*p.radius*p.radius);return{line1:'½ × 3.14 × '+p.radius+'² = ½ × '+full,line2:'= '+full+' ÷ 2 = '+answer,answer};}
        case 'quarter':{const full=fmt(PI*p.radius*p.radius);return{line1:'¼ × 3.14 × '+p.radius+'² = ¼ × '+full,line2:'= '+full+' ÷ 4 = '+answer,answer};}
        case 'composite':{const big=p.width*p.height,cut=p.cutW*p.cutH;return{line1:'('+p.width+'×'+p.height+') − ('+p.cutW+'×'+p.cutH+') = '+big+' − '+cut,line2:'= '+answer,answer};}
        default:return{line1:s.formula,line2:'= '+answer,answer};
      }
    }
    function question(s,p,i){
      const work=buildWorkSolution(s,p);
      const data=s.keys.map(k=>label[k]+' = '+p[k]).join(', ');
      return '<article class="q"><span class="q-num">'+i+'</span>'+svg(s,p)+'<div class="q-body"><div class="q-text">กำหนดให้ '+data+' จงหาพื้นที่</div><div class="work-block"><div class="work-line"><span class="work-fill">'+work.line1+'</span></div><div class="work-line"><span class="work-fill">'+work.line2+'</span></div></div><div class="answer-line"><span class="answer-label">ตอบ</span><span class="answer-fill">'+work.answer+'</span><span class="answer-unit">ตารางหน่วย</span></div></div></article>';
    }
    let revealCount=0;
    function getQuestions(){return Array.from(document.querySelectorAll('#pages .q'))}
    function syncAnswerReveal(){
      document.body.classList.remove('show-answers');
      const qs=getQuestions();
      const total=qs.length;
      qs.forEach((q,index)=>{
        q.classList.toggle('reveal-answer',index<revealCount);
        q.classList.toggle('reveal-current',revealCount>0&&index===revealCount-1);
      });
      const label=document.getElementById('answerStepLabel');
      const btnAll=document.getElementById('btnAnswers');
      if(!total){label.textContent='เฉลย: ปิด';btnAll.textContent='👁 ทั้งหมด';return}
      if(revealCount<=0){label.textContent='เฉลย: ปิด';btnAll.textContent='👁 ทั้งหมด'}
      else if(revealCount>=total){label.textContent='เฉลย: ครบ '+total+' ข้อ';btnAll.textContent='🙈 ซ่อนทั้งหมด'}
      else{label.textContent='เฉลยข้อ '+revealCount+' / '+total;btnAll.textContent='👁 ทั้งหมด'}
      document.getElementById('btnAnswerPrev').disabled=revealCount<=0;
      document.getElementById('btnAnswerNext').disabled=revealCount>=total;
    }
    function revealNext(){const total=getQuestions().length;if(revealCount<total)revealCount+=1;syncAnswerReveal()}
    function revealPrev(){if(revealCount>0)revealCount-=1;syncAnswerReveal()}
    function toggleAllAnswers(){
      const total=getQuestions().length;
      revealCount=revealCount>=total?0:total;
      syncAnswerReveal();
    }
    function render(){
      ensureRng();
      const pageCount=parseInt(document.getElementById('selPageCount').value,10);
      const topic=document.getElementById('selTopic').value;
      const mode=document.getElementById('selUseMode')?.value||'standard';
      const selected=topic==='all'?SHAPES:SHAPES.filter(s=>s.id===topic);
      const source=selected.length?selected:SHAPES;
      const repeatOne=mode!=='standard'&&topic==='all';
      const pageShapes=Array.from({length:pageCount},(_,index)=>repeatOne?source[0]:source[index%source.length]);
      document.getElementById('pages').innerHTML=pageShapes.map((s,page)=>{
        const used=new Set();
        let qs='';for(let i=1;i<=10;i++)qs+=question(s,values(s,used),i);
        return '<section class="sheet"><header class="sheet-head"><div class="sheet-title"><h2>'+s.icon+' ใบงานพื้นที่'+s.name+'</h2><span class="level">'+s.grade+'</span></div><div class="student"><div class="field field-name"><span class="lbl">ชื่อ</span><span class="blank"></span></div><div class="field field-class"><span class="lbl">ชั้น</span><span class="blank"></span></div><div class="field field-no"><span class="lbl">เลขที่</span><span class="blank"></span></div></div><div class="directions"><span>คำชี้แจง: แสดงวิธีคำนวณและเติมคำตอบให้ครบ</span><span class="formula">สูตร: '+s.formula+'</span></div></header><div class="questions">'+qs+'</div><footer class="sheet-foot">หน้า '+(page+1)+' / '+pageShapes.length+' · ห้องทดลองพื้นที่รูปเรขาคณิต</footer></section>';
      }).join('');
      revealCount=0;
      syncAnswerReveal();
      if(window.KampaiWorksheetSets){
        window.KampaiWorksheetSets.writeUrl({seed:renderSeed,setId:setsUi?.getCurrentSetId?.()||undefined});
      }
    }
    function randomize(){
      if(window.KampaiWorksheetSets){
        renderSeed=window.KampaiWorksheetSets.newSeed();
        window.KampaiWorksheetSets.writeUrl({seed:renderSeed,clearSet:true});
      }else{
        renderSeed=Date.now()+Math.floor(Math.random()*100000);
      }
      if(setsUi?.setCurrentSetId)setsUi.setCurrentSetId('');
      render();
      if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
    }
    function applySetState(state){
      if(state?.config)applyConfig(state.config);
      if(state?.seed!=null)renderSeed=Number(state.seed);
      if(state?.setId&&setsUi?.setCurrentSetId)setsUi.setCurrentSetId(state.setId);
      render();
    }
    async function bootSets(){
      try{
        const Sets=await window.KampaiWorksheet.loadSetsModule();
        const fromUrl=Sets.getConfigFromUrl();
        if(fromUrl.seed!=null)renderSeed=Number(fromUrl.seed);
        else renderSeed=Sets.newSeed();
        setsUi=Sets.mountToolbar({
          worksheetKey:WORKSHEET_KEY,
          initialSetId:fromUrl.setId||'',
          suggestTitle:suggestSetTitle,
          getState:()=>({
            seed:renderSeed,
            config:currentConfig(),
            title:document.getElementById('kampaiSetTitle')?.value||suggestSetTitle({rows:[]}),
          }),
          applyState:applySetState,
        });
        if(fromUrl.setId){
          const row=await Sets.load(fromUrl.setId);
          if(row){
            applyConfig(row.config||{});
            renderSeed=Number(row.seed);
            if(setsUi?.markTitleLoaded)setsUi.markTitleLoaded(row.title||'');
            else{
              const titleInput=document.getElementById('kampaiSetTitle');
              if(titleInput&&row.title)titleInput.value=row.title;
            }
            if(setsUi?.setCurrentSetId)setsUi.setCurrentSetId(row.id);
            render();
            if(setsUi?.setMessage)setsUi.setMessage('โหลดชุด: '+(row.title||row.id.slice(0,8)));
            return;
          }
        }
        render();
        if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(false);
      }catch(error){
        console.warn('worksheet sets unavailable',error);
        render();
      }
    }
    document.getElementById('btnBack').onclick=()=>location.href='/games/math/rect-area-media.html';
    document.getElementById('btnRandom').onclick=randomize;
    document.getElementById('selPageCount').onchange=()=>{
      render();
      if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
    };
    document.getElementById('selTopic').onchange=()=>{
      render();
      if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
    };
    document.getElementById('btnAnswerNext').onclick=revealNext;
    document.getElementById('btnAnswerPrev').onclick=revealPrev;
    document.getElementById('btnAnswers').onclick=toggleAllAnswers;
    document.getElementById('btnPrint').onclick=()=>window.print();
    document.addEventListener('keydown',(event)=>{
      if(event.target.matches('input,textarea,select'))return;
      if(event.key==='ArrowRight'||event.key==='n'||event.key==='N'){event.preventDefault();revealNext()}
      if(event.key==='ArrowLeft'||event.key==='b'||event.key==='B'){event.preventDefault();revealPrev()}
    });
    bootSets();
  </script>
<script src="/games/worksheet-modes.js?v=1.175.2"></script>
</body>
