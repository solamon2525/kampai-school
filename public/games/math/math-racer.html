<!DOCTYPE html>
<html lang="th">
<head>
    <script src="/games/kampai-sdk.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High View Racing - AI Lane Change</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        canvas {
            background-color: #333;
            display: block;
            border-radius: 4px;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #top-ui {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            pointer-events: auto;
            width: 100%;
            box-sizing: border-box;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            min-width: 80px;
        }

        #p1-score-box { border-left: 4px solid #ff4444; }
        #p2-score-box { border-left: 4px solid #4488ff; display: none; } 

        .score-label { font-size: 12px; color: #aaa; margin-bottom: 2px; }
        .score-val { font-size: 24px; }
        
        #question-box {
            background: rgba(255, 255, 255, 0.95);
            color: #111;
            padding: 5px 25px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 10px;
            border: 4px solid #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            text-align: center;
            margin: 0 15px;
            pointer-events: auto;
            min-width: 150px;
        }

        #mute-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-size: 20px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            height: fit-content;
            align-self: center;
        }
        #mute-btn:hover { background: rgba(0,0,0,0.8); }

        .status-board { font-size: 14px; display: flex; gap: 5px; margin-top: 5px; min-height: 20px;}

        .status-icon {
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            font-size: 12px;
        }
        
        .status-icon.active { display: flex; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #warning-msg {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: #ff3333;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px red;
            display: none;
            animation: blink 0.5s infinite;
            z-index: 5;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
        }

        h1 { margin: 0 0 10px 0; font-size: 36px; color: #ffcc00; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        h2 { font-size: 16px; color: #aaa; margin-bottom: 20px; font-weight: normal; }
        p { font-size: 18px; color: #ccc; margin-bottom: 30px; }

        .mode-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        button.action-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
            min-width: 160px;
        }
        button.action-btn.blue {
            background: #4488ff;
            box-shadow: 0 4px 15px rgba(68, 136, 255, 0.4);
        }

        button.action-btn:active { transform: scale(0.95); }
        button.action-btn:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }
        
        .controls-hint { 
            margin-top: 20px; 
            font-size: 14px; 
            color: #888; 
            text-align: center;
            line-height: 1.6;
        }
        .key {
            background: #444;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            border-bottom: 2px solid #222;
            display: inline-block;
            min-width: 16px;
            text-align: center;
        }
    </style>
</head>

        <div style="margin-bottom: 20px;">

                <span id="upload-text">📷 ใช้ภาพรถของคุณเอง (อัปโหลด)</span>

            </label>

            <span style="color:#66aaff">P2:</span> <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> Keys

            <button class="action-btn" onclick="if(window.KAMPAI)window.KAMPAI.goHome()" style="background:#555; box-shadow:0 4px 15px rgba(80,80,80,0.4);">EXIT (ออก)</button>

<script>
window.KAMPAI = window.KAMPAI || { isEmbed:false, isTouch:false, ready:true, student:null, stats:null, leaderboard:[], input:{up:false,down:false,left:false,right:false,a:false,b:false}, onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, exit:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},speak:function(){},stopSpeak:function(){},fxFlash:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}} };
const GAME_SLUG = 'math-racer';
if (window.KAMPAI) {
    window.KAMPAI.setSlug(GAME_SLUG);
}

let customCarImage = null;

document.addEventListener('DOMContentLoaded', () => {
    const uploadInput = document.getElementById('car-upload');
    const uploadText = document.getElementById('upload-text');
    const uploadLabel = document.getElementById('upload-label');
    
    if (uploadInput) {
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        customCarImage = img;
                        uploadText.innerText = '✅ โหลดภาพรถสำเร็จแล้ว!';
                        uploadLabel.style.background = '#2ecc71';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    }
});

class SoundManager {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.muted = false;
        this.masterGain = this.ctx.createGain();
        this.masterGain.connect(this.ctx.destination);
        this.bgmGain = this.ctx.createGain();
        this.bgmGain.gain.value = 0.4; 
        this.bgmGain.connect(this.masterGain);
        this.isPlayingMusic = false;
        this.tempo = 130;
    }

    toggleMute() {
        this.muted = !this.muted;
        if(this.muted) {
            this.masterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
            return "🔇";
        } else {
            this.masterGain.gain.setTargetAtTime(1, this.ctx.currentTime, 0.1);
            return "🔊";
        }
    }

    resume() { if (this.ctx.state === 'suspended') this.ctx.resume(); }

    startBGM() {
        if (this.isPlayingMusic) return;
        this.isPlayingMusic = true;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
        this.beatCount = 0;
        this.scheduler();
    }

    stopBGM() {
        this.isPlayingMusic = false;
        if (this.timerID) clearTimeout(this.timerID);
    }

    scheduler() {
        if (!this.isPlayingMusic) return;
        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
            this.playBeat(this.nextNoteTime, this.beatCount);
            this.nextNoteTime += 0.25 * (60.0 / this.tempo); 
            this.beatCount++;
        }
        this.timerID = setTimeout(() => this.scheduler(), 25);
    }

    playBeat(time, beat) {
        if (this.muted) return;
        const step = beat % 16;
        if (step % 4 === 0) this.synthKick(time);
        if (step % 2 !== 0) this.synthHiHat(time, step % 4 === 2 ? 0.3 : 0.1);
        let freq = 110; 
        if (step < 4) freq = 65.41; else if (step < 8) freq = 98.00; 
        else if (step < 12) freq = 58.27; else freq = 87.31; 
        if (step % 2 === 0) this.synthBass(time, freq);
    }

    synthKick(time) {
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.bgmGain);
        osc.frequency.setValueAtTime(150, time); osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        gain.gain.setValueAtTime(1, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        osc.start(time); osc.stop(time + 0.5);
    }
    synthHiHat(time, vol) {
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
        const data = buffer.getChannelData(0); for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 5000;
        const gain = this.ctx.createGain(); gain.gain.setValueAtTime(vol, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        noise.connect(filter); filter.connect(gain); gain.connect(this.bgmGain); noise.start(time);
    }
    synthBass(time, freq) {
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
        osc.type = 'sawtooth'; osc.frequency.value = freq;
        filter.type = 'lowpass'; filter.frequency.setValueAtTime(freq*2, time); 
        filter.frequency.linearRampToValueAtTime(freq*0.5, time+0.2);
        gain.gain.setValueAtTime(0.5, time); gain.gain.linearRampToValueAtTime(0, time+0.2);
        osc.connect(filter); filter.connect(gain); gain.connect(this.bgmGain); osc.start(time); osc.stop(time+0.2);
    }

    playCoin() { this.playTone('sine', 1200, 2000, 0.1); }
    playCrash() { this.playNoise(1000, 100, 0.5); }
    playShield() { this.playTone('triangle', 200, 600, 0.3, 'linear'); }
    playBoost() { this.playTone('sawtooth', 100, 300, 0.5, 'linear'); }
    playShieldBreak() { this.playTone('square', 150, 50, 0.2); }
    playHorn() { this.playTone('sawtooth', 150, 150, 0.6, 'linear'); } 

    playTone(type, fStart, fEnd, duration, rampType='exponential') {
        if (this.muted) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.masterGain);
        osc.type = type; osc.frequency.setValueAtTime(fStart, t);
        if(rampType==='linear') osc.frequency.linearRampToValueAtTime(fEnd, t+duration);
        else osc.frequency.exponentialRampToValueAtTime(fEnd, t+duration);
        gain.gain.setValueAtTime(0.1, t);
        if(rampType==='linear') gain.gain.linearRampToValueAtTime(0.01, t+duration);
        else gain.gain.exponentialRampToValueAtTime(0.01, t+duration);
        osc.start(t); osc.stop(t+duration);
    }
    playNoise(fStart, fEnd, duration) {
        if (this.muted) return;
        const t = this.ctx.currentTime;
        const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate*duration, this.ctx.sampleRate);
        const data = buffer.getChannelData(0); for(let i=0; i<data.length; i++) data[i] = Math.random()*2-1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
        filter.frequency.setValueAtTime(fStart, t); filter.frequency.exponentialRampToValueAtTime(fEnd, t+duration);
        const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t+duration);
        noise.connect(filter); filter.connect(gain); gain.connect(this.masterGain); noise.start(t);
    }
}

class InputHandler {
    constructor() {
        this.keys = { 
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false, 
            KeyA: false, KeyD: false, KeyW: false, KeyS: false             
        };
        window.addEventListener('keydown', (e) => { if(this.keys.hasOwnProperty(e.code)) this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { if(this.keys.hasOwnProperty(e.code)) this.keys[e.code] = false; });
        
        this.touchX = null;
        window.addEventListener('touchstart', (e) => { this.touchX = e.touches[0].clientX; });
        window.addEventListener('touchmove', (e) => { this.touchX = e.touches[0].clientX; });
        window.addEventListener('touchend', () => { this.touchX = null; });
    }

    getP1Input() {
        let x = 0;
        if (this.keys.ArrowLeft) x = -1;
        if (this.keys.ArrowRight) x = 1;
        if (this.touchX !== null) x = this.touchX < window.innerWidth / 2 ? -1 : 1;
        
        let y = 0;
        if (this.keys.ArrowUp) y = -1;
        if (this.keys.ArrowDown) y = 1;
        
        return { x, y };
    }

    getP2Input() {
        let x = 0;
        if (this.keys.KeyA) x = -1;
        if (this.keys.KeyD) x = 1;
        
        let y = 0;
        if (this.keys.KeyW) y = -1;
        if (this.keys.KeyS) y = 1;
        
        return { x, y };
    }
}

class Road {
    constructor(canvasWidth, canvasHeight) {
        this.width = canvasWidth;
        this.height = canvasHeight;
        this.lineOffset = 0;
        this.roadWidth = 320; 
        this.speed = 10;
    }

    update(speedMultiplier) {
        this.lineOffset += this.speed * speedMultiplier;
        if (this.lineOffset >= 40) this.lineOffset = 0;
    }

    draw(ctx) {
        ctx.fillStyle = "#2d5a27";
        ctx.fillRect(0, 0, this.width, this.height);

        const roadX = (this.width - this.roadWidth) / 2;

        ctx.fillStyle = "#555";
        ctx.fillRect(roadX - 10, 0, this.roadWidth + 20, this.height);

        ctx.fillStyle = "#3a3a3a";
        ctx.fillRect(roadX, 0, this.roadWidth, this.height);

        ctx.fillStyle = "#fff";
        ctx.fillRect(roadX, 0, 4, this.height);
        ctx.fillRect(roadX + this.roadWidth - 4, 0, 4, this.height);

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.setLineDash([20, 30]);
        ctx.lineDashOffset = -this.lineOffset;
        ctx.beginPath();
        ctx.moveTo(this.width / 2, -50);
        ctx.lineTo(this.width / 2, this.height + 50);
        ctx.stroke();
    }
}

class PlayerCar {
    constructor(id, roadCenter, yPosition, colorType) {
        this.id = id; 
        this.width = 30; 
        this.height = 50;
        this.x = roadCenter - this.width / 2;
        
        if (id === 'p1') this.x += 30;
        if (id === 'p2') this.x -= 30;

        this.y = yPosition;
        this.baseSpeed = 6;
        this.roadWidth = 320;
        
        this.colorType = colorType; 
        
        this.isDead = false;
        this.score = 0;
        this.hasShield = false;
        this.isBoosting = false;
        this.boostTimer = 0;
    }

    update(input, canvasWidth, canvasHeight, deltaTime) {
        if (this.isDead) return;

        let speed = this.baseSpeed;
        if (this.isBoosting) speed *= 1.5;

        this.x += input.x * speed;
        const roadLeft = (canvasWidth - this.roadWidth) / 2;
        const roadRight = (canvasWidth + this.roadWidth) / 2;
        if (this.x < roadLeft + 5) this.x = roadLeft + 5;
        if (this.x + this.width > roadRight - 5) this.x = roadRight - this.width - 5;

        this.y += input.y * speed;
        if (this.y < 80) this.y = 80;
        if (this.y > canvasHeight - this.height - 10) this.y = canvasHeight - this.height - 10;

        if (this.isBoosting) {
            this.boostTimer -= deltaTime;
            if (this.boostTimer <= 0) {
                this.isBoosting = false;
                this.updateStatusIcon('boost', false);
            }
        }
    }

    activateBoost() {
        this.isBoosting = true;
        this.boostTimer = 3000;
        this.updateStatusIcon('boost', true);
    }

    activateShield() {
        this.hasShield = true;
        this.updateStatusIcon('shield', true);
    }

    breakShield() {
        this.hasShield = false;
        this.updateStatusIcon('shield', false);
    }

    updateStatusIcon(type, active) {
        const el = document.getElementById(`status-${type}-${this.id}`);
        if(el) {
            if(active) el.classList.add('active');
            else el.classList.remove('active');
        }
    }

    die() {
        this.isDead = true;
    }

    draw(ctx) {
        if (this.isDead) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.ellipse(this.width/2, this.height/2 + 4, this.width/2 + 4, this.height/2 + 2, 0, 0, Math.PI * 2);
        ctx.fill();

        if (this.hasShield) {
            ctx.strokeStyle = this.colorType === 'red' ? "#ffaaaa" : "#aaffff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.width/2, this.height/2, 40, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = this.colorType === 'red' ? "rgba(255, 0, 0, 0.15)" : "rgba(0, 255, 255, 0.15)";
            ctx.fill();
        }

        if (this.isBoosting) {
            ctx.fillStyle = "#FF4500";
            ctx.fillRect(6, this.height, 4, 15 + Math.random() * 15);
            ctx.fillRect(this.width - 10, this.height, 4, 15 + Math.random() * 15);
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(7, this.height, 2, 8 + Math.random() * 10);
            ctx.fillRect(this.width - 9, this.height, 2, 8 + Math.random() * 10);
        }

        if (customCarImage && this.id === 'p1') {
            ctx.drawImage(customCarImage, 0, 0, this.width, this.height);
        } else {
            ctx.fillStyle = "#1a1a1a";
            const tW = 5, tH = 12;
            ctx.beginPath();
            ctx.roundRect(-3, 10, tW, tH, 2);
            ctx.roundRect(this.width - 2, 10, tW, tH, 2);
            ctx.roundRect(-3, this.height - 18, tW, tH, 2);
            ctx.roundRect(this.width - 2, this.height - 18, tW, tH, 2);
            ctx.fill();

            const bodyColor = this.colorType === 'red' ? "#ef4444" : "#29b6f6";
            const darkBodyColor = this.colorType === 'red' ? "#c62828" : "#0277bd";
            
            ctx.fillStyle = bodyColor;
            ctx.strokeStyle = darkBodyColor;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(4, 0);
            ctx.lineTo(this.width - 4, 0);
            ctx.quadraticCurveTo(this.width, 0, this.width, 6);
            ctx.lineTo(this.width, this.height - 6);
            ctx.quadraticCurveTo(this.width, this.height, this.width - 4, this.height);
            ctx.lineTo(4, this.height);
            ctx.quadraticCurveTo(0, this.height, 0, this.height - 6);
            ctx.lineTo(0, 6);
            ctx.quadraticCurveTo(0, 0, 4, 0);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(this.width * 0.25, 0, this.width * 0.18, this.height);
            ctx.fillRect(this.width * 0.57, 0, this.width * 0.18, this.height);

            ctx.fillStyle = "#2c3e50";
            ctx.beginPath();
            ctx.moveTo(2, 14);
            ctx.quadraticCurveTo(this.width / 2, 9, this.width - 2, 14);
            ctx.lineTo(this.width - 4, 22);
            ctx.quadraticCurveTo(this.width / 2, 24, 4, 22);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.beginPath();
            ctx.moveTo(4, 14);
            ctx.lineTo(this.width / 2, 12);
            ctx.lineTo(this.width / 2 - 2, 20);
            ctx.lineTo(6, 20);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#2c3e50";
            ctx.beginPath();
            ctx.moveTo(4, this.height - 14);
            ctx.quadraticCurveTo(this.width / 2, this.height - 17, this.width - 4, this.height - 14);
            ctx.lineTo(this.width - 5, this.height - 7);
            ctx.quadraticCurveTo(this.width / 2, this.height - 5, 5, this.height - 7);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(-2, 18, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(this.width + 2, 18, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#e0f7fa";
            ctx.beginPath();
            ctx.ellipse(6, 4, 3, 2, Math.PI/8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.width - 6, 4, 3, 2, -Math.PI/8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff8f00";
            ctx.beginPath();
            ctx.ellipse(7, this.height - 3, 4, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.width - 7, this.height - 3, 4, 1.5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

/**
 * 4. Obstacle (AI Lane Change + Blinkers)
 */
class Obstacle {
    constructor(canvasWidth, speed) {
        this.width = 24; this.height = 42;
        this.roadWidth = 320;
        this.roadLeft = (canvasWidth - this.roadWidth) / 2;
        
        this.laneCount = 5;
        this.laneWidth = this.roadWidth / this.laneCount;
        this.currentLane = Math.floor(Math.random() * this.laneCount);
        
        this.x = this.roadLeft + (this.currentLane * this.laneWidth) + (this.laneWidth - this.width)/2;
        this.targetX = this.x;
        
        this.y = -100;
        this.speed = speed;
        this.markedForDeletion = false;
        
        const colors = ["#3498db", "#2ecc71", "#9b59b6", "#95a5a6"];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        this.isChangingLane = false;
        this.blinkTimer = 0; 
    }

    update(speedMultiplier) {
        this.y += this.speed * speedMultiplier;
        if (this.y > window.innerHeight + 50) this.markedForDeletion = true;

        if (!this.isChangingLane && Math.abs(this.x - this.targetX) < 1) {
            if (Math.random() < 0.002) { 
                const direction = Math.random() < 0.5 ? -1 : 1; 
                const nextLane = this.currentLane + direction;
                
                if (nextLane >= 0 && nextLane < this.laneCount) {
                    this.currentLane = nextLane;
                    this.targetX = this.roadLeft + (this.currentLane * this.laneWidth) + (this.laneWidth - this.width)/2;
                    this.isChangingLane = true;
                    this.blinkDirection = direction; 
                }
            }
        }

        if (this.isChangingLane) {
            const dx = this.targetX - this.x;
            this.x += dx * 0.05; 
            if (Math.abs(dx) < 0.5) {
                this.x = this.targetX;
                this.isChangingLane = false;
            }
            this.blinkTimer++;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(2, 4, this.width, this.height); 
        ctx.fillStyle = "#111"; 
        ctx.fillRect(-1, 8, 3, 7); ctx.fillRect(this.width-2, 8, 3, 7);
        ctx.fillRect(-1, this.height-12, 3, 7); ctx.fillRect(this.width-2, this.height-12, 3, 7);
        ctx.fillStyle = this.color; 
        ctx.beginPath(); ctx.roundRect(0, 0, this.width, this.height, 4); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(3, 10, this.width - 6, 20); 
        ctx.fillStyle = "#aab7b8"; ctx.fillRect(4, 26, this.width - 8, 4); 
        ctx.fillRect(4, 10, this.width - 8, 5); 
        ctx.fillStyle = "#e74c3c"; 
        ctx.fillRect(2, this.height-3, 6, 3); 
        ctx.fillRect(this.width-8, this.height-3, 6, 3); 

        if (this.isChangingLane) {
            if (Math.floor(this.blinkTimer / 10) % 2 === 0) {
                ctx.fillStyle = "#ffcc00"; 
                if (this.blinkDirection === -1) {
                    ctx.fillRect(0, this.height-4, 4, 4);
                } else {
                    ctx.fillRect(this.width-4, this.height-4, 4, 4);
                }
            }
        }

        ctx.restore();
    }
}

/**
 * 4.5 Truck (รถบรรทุกยักษ์)
 */
class Truck {
    constructor(canvasWidth, speed) {
        this.width = 70; 
        this.height = 160; 
        this.roadWidth = 320;
        this.roadLeft = (canvasWidth - this.roadWidth) / 2;
        
        this.x = (canvasWidth / 2) - (this.width / 2);
        this.y = -250;
        
        this.speed = speed * 0.75; 
        this.markedForDeletion = false;
        this.color = "#8e44ad"; 
        this.type = "TRUCK";
    }

    update(speedMultiplier) {
        this.y += this.speed * speedMultiplier;
        if (this.y > window.innerHeight + 50) this.markedForDeletion = true;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(4, 4, this.width, this.height);

        ctx.fillStyle = "#555"; 
        ctx.fillRect(0, 0, this.width, this.height - 30);
        
        ctx.fillStyle = "#444";
        for(let i=10; i<this.height-30; i+=20) {
            ctx.fillRect(2, i, this.width-4, 2);
        }

        ctx.fillStyle = this.color;
        ctx.fillRect(2, 0, this.width-4, 30); 

        ctx.fillStyle = "#c0392b";
        ctx.fillRect(2, this.height - 35, 10, 5);
        ctx.fillRect(this.width - 12, this.height - 35, 10, 5);

        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(this.width/2 - 10, this.height - 35, 20, 5);
        
        ctx.fillStyle = "#111";
        const w = 6; const h = 12;
        ctx.fillRect(-2, this.height - 20, w, h); ctx.fillRect(this.width-4, this.height - 20, w, h);
        ctx.fillRect(-2, this.height - 40, w, h); ctx.fillRect(this.width-4, this.height - 40, w, h);
        ctx.fillRect(-2, 10, w, h); ctx.fillRect(this.width-4, 10, w, h);

        ctx.restore();
    }
}

/**
 * 5. AnswerItem
 */
class AnswerItem {
    constructor(canvasWidth, speed, value, isCorrect, laneIndex, startY) {
        this.width = 36; 
        this.height = 36;
        this.value = value;
        this.isCorrect = isCorrect;
        
        const roadWidth = 320;
        const laneCount = 5;
        const laneWidth = roadWidth / laneCount;
        const roadLeft = (canvasWidth - roadWidth) / 2;
        
        this.x = roadLeft + (laneIndex * laneWidth) + (laneWidth - this.width) / 2;
        this.y = startY || -100; 
        this.speed = speed;
        this.markedForDeletion = false;

        this.color = '#FFD700'; 
    }

    update(speedMultiplier) {
        this.y += this.speed * speedMultiplier;
        if (this.y > window.innerHeight + 50) this.markedForDeletion = true;
    }

    draw(ctx) {
        ctx.fillStyle = this.color; 
        ctx.shadowColor = this.color; 
        ctx.shadowBlur = 10;
        
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.width, this.height, 5);
        ctx.fill(); 
        ctx.shadowBlur = 0;
        
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#000"; 
        ctx.font = "bold 18px Arial"; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        ctx.fillText(this.value, this.x + this.width/2, this.y + this.height/2);
    }
}

/**
 * 6. Game Logic
 */
class Game {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        
        this.sound = new SoundManager();
        this.input = new InputHandler();
        this.road = new Road(this.canvas.width, this.canvas.height);
        
        this.players = [];
        this.obstacles = [];
        this.items = []; 
        this.gameSpeed = 5;
        this.isRunning = false;
        this.playerMode = 1; 
        this.currentMathProblem = null;
        
        this.truckTimer = 0;
        this.truckInterval = 30000; 

        this.resize();
        window.addEventListener('resize', () => this.resize());

        document.getElementById('mute-btn').addEventListener('click', (e) => {
            const icon = this.sound.toggleMute(); e.target.innerText = icon; e.target.blur(); 
        });
        document.getElementById('btn-1p').addEventListener('click', () => this.start(1));
        document.getElementById('btn-2p').addEventListener('click', () => this.start(2));
        document.getElementById('restart-btn').addEventListener('click', () => {
             document.getElementById('game-over-screen').classList.add('hidden');
             document.getElementById('start-screen').classList.remove('hidden');
        });
    }

    resize() {
        this.canvas.width = window.innerWidth > 600 ? 500 : window.innerWidth;
        this.canvas.height = window.innerHeight;
        if(this.road) {
            this.road.width = this.canvas.width;
            this.road.height = this.canvas.height;
        }
        this.resetPositions();
    }

    resetPositions() {
        this.players.forEach(p => {
             p.x = (this.canvas.width / 2) - (p.width/2);
             if (p.id === 'p1') p.x += 30;
             if (p.id === 'p2') p.x -= 30;
             p.y = this.canvas.height - 60;
        });
    }

    start(mode) {
        this.playerMode = mode;
        this.sound.resume();
        this.sound.startBGM();

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('p2-score-box').style.display = (mode === 2) ? 'flex' : 'none';
        document.getElementById('question-box').classList.remove('hidden');

        this.players = [];
        
        const p1 = new PlayerCar('p1', this.canvas.width / 2, this.canvas.height - 60, 'red');
        this.players.push(p1);

        if (mode === 2) {
            const p2 = new PlayerCar('p2', this.canvas.width / 2, this.canvas.height - 60, 'blue');
            this.players.push(p2);
        }

        this.resetGameData();
        this.generateMathProblem();

        this.isRunning = true;
        this.lastTime = performance.now();
        requestAnimationFrame((ts) => this.animate(ts));
    }

    generateMathProblem() {
        const isMultiplication = Math.random() > 0.5;
        let num1, num2, answer, questionStr;
        
        if (isMultiplication) {
            num1 = Math.floor(Math.random() * 11) + 2; 
            num2 = Math.floor(Math.random() * 11) + 2; 
            answer = num1 * num2;
            questionStr = `${num1} × ${num2}`;
        } else {
            num2 = Math.floor(Math.random() * 11) + 2; 
            answer = Math.floor(Math.random() * 11) + 2; 
            num1 = answer * num2;
            questionStr = `${num1} ÷ ${num2}`;
        }
        
        this.currentMathProblem = { question: questionStr, answer: answer };
        document.getElementById('question-box').innerText = `${questionStr} = ?`;
    }

    spawnAnswerWave() {
        if (!this.currentMathProblem) return;

        const lanes = [0, 1, 2, 3, 4];
        for (let i = lanes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
        }
        const selectedLanes = lanes.slice(0, 3);
        
        const startYOffsets = [-100, -250, -400];
        for (let i = startYOffsets.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [startYOffsets[i], startYOffsets[j]] = [startYOffsets[j], startYOffsets[i]];
        }
        
        const correctLaneIndex = Math.floor(Math.random() * 3);
        
        for (let i = 0; i < 3; i++) {
            let val;
            let isCorrect = (i === correctLaneIndex);
            
            if (isCorrect) {
                val = this.currentMathProblem.answer;
            } else {
                let offset = Math.floor(Math.random() * 10) + 1;
                offset *= Math.random() > 0.5 ? 1 : -1;
                val = this.currentMathProblem.answer + offset;
                if (val <= 0) val = Math.floor(Math.random() * 10) + 1; 
            }
            
            this.items.push(new AnswerItem(this.canvas.width, this.gameSpeed, val, isCorrect, selectedLanes[i], startYOffsets[i]));
        }
    }

    resetGameData() {
        this.gameSpeed = 5;
        this.obstacles = [];
        this.items = [];
        this.truckTimer = 0; 
        this.resetPositions();
        
        document.getElementById('score-board-p1').innerText = "0";
        document.getElementById('score-board-p2').innerText = "0";
    }

    gameOver() {
        this.isRunning = false;
        this.sound.stopBGM();
        this.sound.playCrash();
        
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('question-box').classList.add('hidden');
        
        const s1 = this.players[0].score;
        document.getElementById('final-score-p1').innerText = Math.floor(s1);

        let winnerText = "";
        
        if (this.playerMode === 2) {
            const s2 = this.players[1].score;
            document.getElementById('final-p2-line').style.display = 'block';
            document.getElementById('final-score-p2').innerText = Math.floor(s2);

            if (Math.floor(s1) > Math.floor(s2)) winnerText = "P1 WINS!";
            else if (Math.floor(s2) > Math.floor(s1)) winnerText = "P2 WINS!";
            else winnerText = "DRAW!";
        } else {
            document.getElementById('final-p2-line').style.display = 'none';
        }
        
        document.getElementById('winner-text').innerText = winnerText;

        // Submit score to KAMPAI
        if (window.KAMPAI) {
            let finalScore = s1;
            if (this.playerMode === 2 && this.players[1].score > s1) {
                finalScore = this.players[1].score;
            }
            window.KAMPAI.submitScore(Math.floor(finalScore), {
                mode: 'normal'
            });
        }
    }

    checkCollision(rect1, rect2) {
        const padding = 4;
        return (
            rect1.x + padding < rect2.x + rect2.width - padding &&
            rect1.x + rect1.width - padding > rect2.x + padding &&
            rect1.y + padding < rect2.y + rect2.height - padding &&
            rect1.height + rect1.y - padding > rect2.y + padding
        );
    }

    animate(timeStamp) {
        if (!this.isRunning) return;

        const deltaTime = timeStamp - this.lastTime;
        this.lastTime = timeStamp;

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        let maxBoost = 1.0; 

        this.road.update(maxBoost);
        this.road.draw(this.ctx);

        this.truckTimer += deltaTime;
        if (this.truckTimer >= this.truckInterval) {
            this.obstacles.push(new Truck(this.canvas.width, this.gameSpeed));
            this.truckTimer = 0; 
            
            const warnEl = document.getElementById('warning-msg');
            if (warnEl) {
                warnEl.style.display = 'block';
                this.sound.playHorn();
                setTimeout(() => { warnEl.style.display = 'none'; }, 2000); 
            }
        }

        let activePlayers = 0;
        this.players.forEach(p => {
            if (!p.isDead) {
                activePlayers++;
                const input = (p.id === 'p1') ? this.input.getP1Input() : this.input.getP2Input();
                p.update(input, this.canvas.width, this.canvas.height, deltaTime);
                p.draw(this.ctx);
                
                p.score += 0.1 * maxBoost;
                document.getElementById(`score-board-${p.id}`).innerText = Math.floor(p.score);
            }
        });

        if (activePlayers === 0) {
            this.gameOver();
            return;
        }

        this.spawnTimer = (this.spawnTimer || 0) + deltaTime * maxBoost;
        if (this.spawnTimer > 1500) { 
            const hasAnswers = this.items.length > 0;
            
            if (!hasAnswers || Math.random() < 0.4) {
                this.spawnAnswerWave();
                this.spawnTimer = -500; 
            } else {
                this.obstacles.push(new Obstacle(this.canvas.width, this.gameSpeed));
                this.spawnTimer = 0;
            }
            
            if (this.gameSpeed < 12) this.gameSpeed += 0.05;
        }

        this.items.forEach(item => {
            item.update(maxBoost);
            item.draw(this.ctx);
            
            this.players.forEach(p => {
                if (!p.isDead && !item.markedForDeletion && this.checkCollision(p, item)) {
                    if (item.isCorrect) {
                        p.score += 50;
                        this.sound.playCoin();
                        this.generateMathProblem(); 
                        this.items.forEach(i => i.markedForDeletion = true); 
                    } else {
                        p.die();
                        this.sound.playCrash();
                    }
                }
            });
        });
        this.items = this.items.filter(i => !i.markedForDeletion);

        this.obstacles.forEach(obs => {
            obs.update(maxBoost);
            obs.draw(this.ctx);

            this.players.forEach(p => {
                if (!p.isDead && !obs.markedForDeletion && this.checkCollision(p, obs)) {
                    p.die();
                    this.sound.playCrash();
                }
            });
        });
        this.obstacles = this.obstacles.filter(o => !o.markedForDeletion);

        requestAnimationFrame((ts) => this.animate(ts));
    }
}

const game = new Game('gameCanvas');
