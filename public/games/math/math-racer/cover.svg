<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.6" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <!-- Speed / Motion lines -->
    <linearGradient id="speedLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome/Steel Title Gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.5" stop-color="#ffa751"/>
      <stop offset="1" stop-color="#ff3300"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Speed motion effects in background -->
  <g opacity="0.15">
    <rect x="100" y="80" width="300" height="4" fill="#fff"/>
    <rect x="800" y="150" width="400" height="4" fill="#fff"/>
    <rect x="50" y="250" width="200" height="4" fill="#fff"/>
    <rect x="950" y="480" width="250" height="4" fill="#fff"/>
    <rect x="150" y="600" width="350" height="4" fill="#fff"/>
  </g>

  <!-- 3D-Like Perspective Racing Tracks -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.25">
    <!-- Left Boundary -->
    <line x1="640" y1="360" x2="-200" y2="720"/>
    <!-- Lanes -->
    <line x1="640" y1="360" x2="150" y2="720" stroke-dasharray="15,20"/>
    <line x1="640" y1="360" x2="500" y2="720" stroke-dasharray="15,20"/>
    <line x1="640" y1="360" x2="780" y2="720" stroke-dasharray="15,20"/>
    <line x1="640" y1="360" x2="1130" y2="720" stroke-dasharray="15,20"/>
    <!-- Right Boundary -->
    <line x1="640" y1="360" x2="1480" y2="720"/>
  </g>

  <!-- Red Racer (P1) -->
  <g transform="translate(360, 520) rotate(-10)" filter="url(#shadow)">
    <!-- Shadow -->
    <rect x="-25" y="-5" width="50" height="90" rx="8" fill="rgba(0,0,0,0.5)"/>
    <!-- Wheels -->
    <rect x="-30" y="10" width="10" height="20" rx="3" fill="#111"/>
    <rect x="20" y="10" width="10" height="20" rx="3" fill="#111"/>
    <rect x="-30" y="55" width="10" height="20" rx="3" fill="#111"/>
    <rect x="20" y="55" width="10" height="20" rx="3" fill="#111"/>
    <!-- Body -->
    <rect x="-22" y="0" width="44" height="80" rx="12" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <!-- Cabin Glass -->
    <path d="M-12,25 L12,25 L8,42 L-8,42 Z" fill="#1e293b"/>
    <!-- Stripes -->
    <rect x="-3" y="0" width="6" height="80" fill="#ffffff"/>
    <!-- Spoiler -->
    <rect x="-28" y="72" width="56" height="8" rx="2" fill="#b91c1c"/>
  </g>

  <!-- Blue Racer (P2) -->
  <g transform="translate(860, 500) rotate(8)" filter="url(#shadow)">
    <!-- Shadow -->
    <rect x="-25" y="-5" width="50" height="90" rx="8" fill="rgba(0,0,0,0.5)"/>
    <!-- Wheels -->
    <rect x="-30" y="10" width="10" height="20" rx="3" fill="#111"/>
    <rect x="20" y="10" width="10" height="20" rx="3" fill="#111"/>
    <rect x="-30" y="55" width="10" height="20" rx="3" fill="#111"/>
    <rect x="20" y="55" width="10" height="20" rx="3" fill="#111"/>
    <!-- Body -->
    <rect x="-22" y="0" width="44" height="80" rx="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Cabin Glass -->
    <path d="M-12,25 L12,25 L8,42 L-8,42 Z" fill="#1e293b"/>
    <!-- Stripes -->
    <rect x="-3" y="0" width="6" height="80" fill="#ffffff"/>
    <!-- Spoiler -->
    <rect x="-28" y="72" width="56" height="8" rx="2" fill="#1d4ed8"/>
  </g>

  <!-- Yellow Answer Chips in Lanes -->
  <!-- Chip 1 (Incorrect) -->
  <g transform="translate(190, 420)" filter="url(#shadow)">
    <rect x="-40" y="-25" width="80" height="50" rx="12" fill="#4b5563" stroke="#9ca3af" stroke-width="2"/>
    <text x="0" y="2" font-size="24" font-weight="700" fill="#f3f4f6" text-anchor="middle" dominant-baseline="middle">18</text>
  </g>

  <!-- Chip 2 (Correct target for Red Racer) -->
  <g transform="translate(480, 390)" filter="url(#shadow)">
    <rect x="-45" y="-28" width="90" height="56" rx="14" fill="#fbbf24" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="2" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">20</text>
  </g>

  <!-- Chip 3 (Incorrect) -->
  <g transform="translate(740, 390)" filter="url(#shadow)">
    <rect x="-40" y="-25" width="80" height="50" rx="12" fill="#4b5563" stroke="#9ca3af" stroke-width="2"/>
    <text x="0" y="2" font-size="24" font-weight="700" fill="#f3f4f6" text-anchor="middle" dominant-baseline="middle">25</text>
  </g>

  <!-- Top Pill -->
  <g transform="translate(640, 110)">
    <rect x="-200" y="-25" width="400" height="50" rx="25" fill="#ffffff" opacity="0.1"/>
    <text x="0" y="2" font-size="22" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · MULTIPLAYER RACING</text>
  </g>

  <!-- Game Title -->
  <text x="640" y="250" font-size="130" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)" letter-spacing="4" font-style="italic">MATH RACER</text>

  <!-- Subtitle -->
  <text x="640" y="340" font-size="34" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">ซิ่งเปลี่ยนเลน ล่าคำตอบที่ถูกต้อง!</text>

  <!-- Middle math display banner -->
  <g transform="translate(640, 440)" filter="url(#shadow)">
    <rect x="-280" y="-30" width="560" height="60" rx="30" fill="rgba(0,0,0,0.8)" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="0" y="2" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">โจทย์คณิต: 5 × 4 = ?</text>
  </g>

  <!-- Bottom ribbons -->
  <g transform="translate(640, 650)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#ef4444" opacity="0.2"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fca5a5" text-anchor="middle" dominant-baseline="middle">🔥 ซิ่งผ่านด่านอุปสรรค AI ชิงความเป็นที่หนึ่ง!</text>
  </g>
</svg>
