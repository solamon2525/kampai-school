function renderDecimalQuestion(item, index, ctx) {
  const e = window.KampaiTopicWorksheet.escapeHtml;
  const gradeBadge = 'ป.' + item.grade;
  const typeMap = {
    read: 'ค่าประจำหลัก',
    compare: 'เปรียบเทียบ',
    addsub: 'บวกลบ',
    money: 'เงินบาท/สตางค์',
    fraction: 'เศษส่วน'
  };
  const typeBadge = typeMap[item.type] || item.type;

  // Domain 1: Place Value & Reading with PV Grid
  if (item.type === 'read' && item.pv) {
    const pv = item.pv;
    return '<div class="q-stem">'
      + '<span class="skill-tag">' + e(gradeBadge + ' · ' + typeBadge) + '</span>'
      + '<div class="q-prompt">' + e(item.prompt) + '</div>'
      + '<div class="q-context">' + e(item.val) + '</div>'
      + '</div>'
      + '<div class="q-work-block">'
      + '<table class="pv-table"><tr>'
      + '<th style="width:18%">สิบ</th><th style="width:18%">หน่วย</th><th style="width:6%">.</th><th style="width:19%">ส่วนสิบ</th><th style="width:19%">ส่วนร้อย</th><th style="width:20%">ส่วนพัน</th></tr><tr>'
      + '<td><span class="pv-fill">' + e(pv.tens || '-') + '</span></td>'
      + '<td><span class="pv-fill">' + e(pv.ones || '0') + '</span></td>'
      + '<td><strong>.</strong></td>'
      + '<td><span class="pv-fill">' + e(pv.tenths || '0') + '</span></td>'
      + '<td><span class="pv-fill">' + e(pv.hundredths || '0') + '</span></td>'
      + '<td><span class="pv-fill">' + e(pv.thousandths || '-') + '</span></td>'
      + '</tr></table>'
      + '<div class="calc-line"><span class="work-fill">' + e(item.step1) + '</span></div>'
      + '</div>'
      + '<div class="q-foot"><div class="answer-line"><span>คำตอบ:</span><span class="answer-fill">' + e(item.answer) + '</span></div></div>';
  }

  // Domain 2: Comparison & Ordering
  if (item.type === 'compare') {
    let workHtml = '';
    if (item.checkSymbol) {
      workHtml = '<div class="choice-row" style="margin:1mm 0">'
        + '<span class="check">[ <span class="check-fill">' + (item.checkSymbol === '>' ? '✓' : '&nbsp;') + '</span> ] &gt; (มากกว่า)</span>'
        + '<span class="check">[ <span class="check-fill">' + (item.checkSymbol === '<' ? '✓' : '&nbsp;') + '</span> ] &lt; (น้อยกว่า)</span>'
        + '<span class="check">[ <span class="check-fill">' + (item.checkSymbol === '=' ? '✓' : '&nbsp;') + '</span> ] = (เท่ากับ)</span>'
        + '</div>'
        + '<div class="reason-line"><span class="work-fill">' + e(item.step1) + '</span></div>';
    } else {
      workHtml = '<div class="calc-line"><span class="work-fill">' + e(item.step1) + '</span></div>'
        + '<div class="reason-line"><span class="work-fill">' + e(item.step2 || '') + '</span></div>';
    }
    return '<div class="q-stem">'
      + '<span class="skill-tag">' + e(gradeBadge + ' · ' + typeBadge) + '</span>'
      + '<div class="q-prompt">' + e(item.prompt) + '</div>'
      + '<div class="q-context">' + e(item.val) + '</div>'
      + '</div>'
      + '<div class="q-work-block">' + workHtml + '</div>'
      + '<div class="q-foot"><div class="answer-line"><span>ผลลัพธ์:</span><span class="answer-fill">' + e(item.answer) + '</span></div></div>';
  }

  // Domain 3, 4, 5: Operations, Money, Fractions
  const context = item.expr || item.val || '';
  return '<div class="q-stem">'
    + '<span class="skill-tag">' + e(gradeBadge + ' · ' + typeBadge) + '</span>'
    + '<div class="q-prompt">' + e(item.prompt) + '</div>'
    + (context ? '<div class="q-context">' + e(context) + '</div>' : '')
    + '</div>'
    + '<div class="q-work-block">'
    + '<div class="calc-line"><span class="work-fill">' + e(item.step1) + '</span></div>'
    + '<div class="reason-line"><span class="work-fill">' + e(item.step2) + '</span></div>'
    + '</div>'
    + '<div class="q-foot"><div class="answer-line"><span>คำตอบ:</span><span class="answer-fill">' + e(item.answer) + '</span></div></div>';
}

window.WORKSHEET_CONFIG = {
  icon: '🔢',
  title: 'ใบงานคลังทศนิยม',
  subject: 'คณิตศาสตร์',
  worksheetKey: 'math-decimal-hub',
  sourceMediaUrl:'/games/math/math-decimal-hub/index.html',
  mediaLabel: 'คลังทศนิยม ป.4–ป.5',

  get gradeLabel() {
    const sel = document.getElementById('selGrade');
    const val = sel ? sel.value : '4';
    if (val === '4') return 'ป.4';
    if (val === '5') return 'ป.5';
    return 'ป.4–ป.5';
  },

  get indicators() {
    const sel = document.getElementById('selGrade');
    const val = sel ? sel.value : '4';
    if (val === '4') return ['ค 1.1 ป.4/5', 'ค 1.1 ป.4/6', 'ค 1.1 ป.4/15'];
    if (val === '5') return ['ค 1.1 ป.5/1', 'ค 1.1 ป.5/8'];
    return ['ค 1.1 ป.4/5', 'ค 1.1 ป.4/6', 'ค 1.1 ป.5/1'];
  },

  directions: 'อ่านค่าประจำหลัก เปรียบเทียบ บวกลบ และแก้โจทย์เงินบาท/สตางค์ พร้อมแสดงกระบวนการคิด',

  topicLabels: {
    mixed: 'ผสมทุกทักษะ',
    read: 'ค่าประจำหลัก',
    compare: 'เปรียบเทียบ',
    addsub: 'บวกลบ',
    money: 'เงินบาทสตางค์',
    fraction: 'เศษส่วนทศนิยม'
  },

  getItems(topic) {
    const gradeVal = document.getElementById('selGrade')?.value || 'all';
    let pool = ITEMS;
    if (gradeVal === '4') pool = ITEMS.filter(item => item.grade === 4);
    else if (gradeVal === '5') pool = ITEMS.filter(item => item.grade === 5);

    if (!topic || topic === 'mixed') return pool;
    const filtered = pool.filter(item => item.type === topic);
    return filtered.length > 0 ? filtered : ITEMS.filter(item => item.type === topic);
  },

  renderQuestion(item, index, ctx) {
    return renderDecimalQuestion(item, index, ctx);
  }
};
