    <main class="main">

  <script>
    (function () {
      var MEDIA_SLUG = 'math-24-thinking-media';
      if (window.KAMPAI) {
        try { window.KAMPAI.setSlug(MEDIA_SLUG); } catch (e) {}
      }

      var inputs = [
        document.getElementById('n1'),
        document.getElementById('n2'),
        document.getElementById('n3'),
        document.getElementById('n4'),
      ];
      var cardsRow = document.getElementById('cardsRow');
      var placeholder = document.getElementById('placeholder');
      var errorBox = document.getElementById('errorBox');
      var answerWrap = document.getElementById('answerWrap');
      var exprLine = document.getElementById('exprLine');
      var stepsList = document.getElementById('stepsList');

      var operators = {
        '+': function (a, b) { return a + b; },
        '-': function (a, b) { return a - b; },
        '*': function (a, b) { return a * b; },
        '/': function (a, b) {
          if (b === 0 || !Number.isInteger(a) || !Number.isInteger(b) || a % b !== 0) return null;
          return a / b;
        },
      };
      var opSyms = ['+', '-', '*', '/'];
      var EPS = 0.0001;

      function opLabel(sym) {
        if (sym === '+') return '+';
        if (sym === '-') return '−';
        if (sym === '*') return '×';
        if (sym === '/') return '÷';
        return sym;
      }

      function fmt(n) {
        if (n === null || n === undefined || isNaN(n)) return '?';
        if (Math.abs(n - Math.round(n)) < EPS) return String(Math.round(n));
        return Number(n.toFixed(2)).toString();
      }

      function isCloseTo24(val) {
        return val !== null && !isNaN(val) && Math.abs(val - 24) < EPS;
      }

      function permute(arr) {
        var res = [];
        function dfs(curr, remaining) {
          if (remaining.length === 0) { res.push(curr); return; }
          for (var i = 0; i < remaining.length; i++) {
            dfs(curr.concat([remaining[i]]), remaining.slice(0, i).concat(remaining.slice(i + 1)));
          }
        }
        dfs([], arr);
        return res;
      }

      function stepThink(html) {
        return { html: html, sub: '' };
      }

      function stepCalc(left, op, right, result, after) {
        return {
          html: 'คำนวณ <span class="keyword">' + fmt(left) + ' ' + opLabel(op) + ' ' + fmt(right) + ' = ' + fmt(result) + '</span>',
          sub: after || '',
        };
      }

      function stepDone() {
        return { html: '<strong>ได้ 24 แล้ว!</strong> เป้าหมายสำเร็จ ✓', sub: 'ตรวจสอบว่าทุกตัวเลขถูกใช้ครบและได้ผลลัพธ์ 24' };
      }

      function buildSolution(steps, expression) {
        return { steps: steps, expression: expression };
      }

      function tryAllTrees(a, b, c, d, op1, op2, op3) {
        var r1, r2, r3;

        r1 = operators[op1](a, b);
        if (r1 !== null) {
          r2 = operators[op2](r1, c);
          if (r2 !== null) {
            r3 = operators[op3](r2, d);
            if (isCloseTo24(r3)) {
              return buildSolution([
                stepThink('เริ่มจากตัวเลข <span class="keyword">' + [a, b, c, d].join(', ') + '</span>'),
                stepCalc(a, op1, b, r1, 'เหลือตัวเลข: ' + fmt(r1) + ', ' + c + ', ' + d),
                stepCalc(r1, op2, c, r2, 'เหลือตัวเลข: ' + fmt(r2) + ', ' + d),
                stepCalc(r2, op3, d, r3, 'เหลือตัวเลขเดียว'),
                stepDone(),
              ], '(((' + a + ' ' + op1 + ' ' + b + ') ' + op2 + ' ' + c + ') ' + op3 + ' ' + d + ')');
            }
          }
        }

        r1 = operators[op2](b, c);
        if (r1 !== null) {
          r2 = operators[op1](a, r1);
          if (r2 !== null) {
            r3 = operators[op3](r2, d);
            if (isCloseTo24(r3)) {
              return buildSolution([
                stepThink('เริ่มจากตัวเลข <span class="keyword">' + [a, b, c, d].join(', ') + '</span>'),
                stepCalc(b, op2, c, r1, 'ได้ค่ากลาง ' + fmt(r1) + ' จาก ' + b + ' กับ ' + c),
                stepCalc(a, op1, r1, r2, 'นำ ' + a + ' มาคำนวณกับผลกลาง → เหลือ ' + fmt(r2) + ', ' + d),
                stepCalc(r2, op3, d, r3, 'เหลือตัวเลขเดียว'),
                stepDone(),
              ], '((' + a + ' ' + op1 + ' (' + b + ' ' + op2 + ' ' + c + ')) ' + op3 + ' ' + d + ')');
            }
          }
        }

        r1 = operators[op2](b, c);
        if (r1 !== null) {
          r2 = operators[op3](r1, d);
          if (r2 !== null) {
            r3 = operators[op1](a, r2);
            if (isCloseTo24(r3)) {
              return buildSolution([
                stepThink('เริ่มจากตัวเลข <span class="keyword">' + [a, b, c, d].join(', ') + '</span>'),
                stepCalc(b, op2, c, r1, 'คำนวณคู่กลางก่อน'),
                stepCalc(r1, op3, d, r2, 'ต่อด้วยตัวที่ ' + d + ' → ได้ ' + fmt(r2)),
                stepCalc(a, op1, r2, r3, 'นำ ' + a + ' มารวมผลลัพธ์สุดท้าย'),
                stepDone(),
              ], '(' + a + ' ' + op1 + ' ((' + b + ' ' + op2 + ' ' + c + ') ' + op3 + ' ' + d + '))');
            }
          }
        }

        r1 = operators[op3](c, d);
        if (r1 !== null) {
          r2 = operators[op2](b, r1);
          if (r2 !== null) {
            r3 = operators[op1](a, r2);
            if (isCloseTo24(r3)) {
              return buildSolution([
                stepThink('เริ่มจากตัวเลข <span class="keyword">' + [a, b, c, d].join(', ') + '</span>'),
                stepCalc(c, op3, d, r1, 'เริ่มจากคู่ท้าย ' + c + ' กับ ' + d),
                stepCalc(b, op2, r1, r2, 'นำผลลัพธ์มาคำนวณกับ ' + b),
                stepCalc(a, op1, r2, r3, 'รวมกับตัวสุดท้าย ' + a),
                stepDone(),
              ], '(' + a + ' ' + op1 + ' (' + b + ' ' + op2 + ' (' + c + ' ' + op3 + ' ' + d + ')))');
            }
          }
        }

        r1 = operators[op1](a, b);
        r2 = operators[op3](c, d);
        if (r1 !== null && r2 !== null) {
          r3 = operators[op2](r1, r2);
          if (isCloseTo24(r3)) {
            return buildSolution([
              stepThink('เริ่มจากตัวเลข <span class="keyword">' + [a, b, c, d].join(', ') + '</span>'),
              stepCalc(a, op1, b, r1, 'แยกคิดสองคู่: คู่ซ้าย = ' + fmt(r1)),
              stepCalc(c, op3, d, r2, 'คู่ขวา = ' + fmt(r2)),
              stepCalc(r1, op2, r2, r3, 'นำผลสองคู่มารวมกัน'),
              stepDone(),
            ], '((' + a + ' ' + op1 + ' ' + b + ') ' + op2 + ' (' + c + ' ' + op3 + ' ' + d + '))');
          }
        }

        return null;
      }

      function solve24WithSteps(numbers) {
        var perms = permute(numbers);
        var i, j, k, p, op1, op2, op3, found;
        for (i = 0; i < perms.length; i++) {
          p = perms[i];
          for (j = 0; j < opSyms.length; j++) {
            for (k = 0; k < opSyms.length; k++) {
              for (var m = 0; m < opSyms.length; m++) {
                op1 = opSyms[j];
                op2 = opSyms[k];
                op3 = opSyms[m];
                found = tryAllTrees(p[0], p[1], p[2], p[3], op1, op2, op3);
                if (found) return found;
              }
            }
          }
        }
        return null;
      }

      function generateSolvableSet() {
        var nums, sol, signature, attempt = 0;
        var previous = '';
        try { previous = localStorage.getItem('kampai-math24-last-set') || ''; } catch (e) {}
        while (attempt < 500) {
          nums = [
            Math.floor(Math.random() * 13) + 1,
            Math.floor(Math.random() * 13) + 1,
            Math.floor(Math.random() * 13) + 1,
            Math.floor(Math.random() * 13) + 1,
          ];
          signature = nums.slice().sort(function (a, b) { return a - b; }).join('-');
          sol = solve24WithSteps(nums);
          if (sol && signature !== previous) {
            try { localStorage.setItem('kampai-math24-last-set', signature); } catch (e) {}
            return { nums: nums, sol: sol };
          }
          attempt++;
        }
        return { nums: [3, 8, 3, 3], sol: solve24WithSteps([3, 8, 3, 3]) };
      }

      function readNumbers() {
        var nums = [];
        for (var i = 0; i < inputs.length; i++) {
          var v = parseInt(inputs[i].value, 10);
          if (isNaN(v) || v < 1 || v > 13) return null;
          nums.push(v);
        }
        return nums;
      }

      function renderCards(nums) {
        cardsRow.innerHTML = '';
        for (var i = 0; i < nums.length; i++) {
          var el = document.createElement('div');
          el.className = 'num-card';
          el.textContent = String(nums[i]);
          cardsRow.appendChild(el);
        }
      }

      function hideAnswer() {
        answerWrap.classList.remove('show');
        errorBox.classList.remove('show');
        placeholder.style.display = 'block';
      }

      function syncCards() {
        var nums = readNumbers();
        if (!nums) {
          cardsRow.innerHTML = '';
          hideAnswer();
          return;
        }
        renderCards(nums);
        hideAnswer();
      }

      function renderSteps(solution) {
        stepsList.innerHTML = '';
        for (var i = 0; i < solution.steps.length; i++) {
          var li = document.createElement('li');
          li.innerHTML = solution.steps[i].html;
          if (solution.steps[i].sub) {
            var sub = document.createElement('span');
            sub.className = 'sub';
            sub.textContent = solution.steps[i].sub;
            li.appendChild(sub);
          }
          stepsList.appendChild(li);
        }
        exprLine.textContent = 'สมการ: ' + solution.expression.replace(/\*/g, '×').replace(/\//g, '÷');
      }

      function reveal() {
        var nums = readNumbers();
        if (!nums) {
          errorBox.textContent = 'กรุณากรอกตัวเลข 1–13 ครบทั้ง 4 ช่อง';
          errorBox.classList.add('show');
          answerWrap.classList.remove('show');
          placeholder.style.display = 'none';
          return;
        }
        renderCards(nums);
        var solution = solve24WithSteps(nums);
        if (!solution) {
          errorBox.textContent = 'ชุดตัวเลขนี้ทำ 24 ไม่ได้ — ลองกด “สุ่มชุดที่ทำได้”';
          errorBox.classList.add('show');
          answerWrap.classList.remove('show');
          placeholder.style.display = 'none';
          return;
        }
        errorBox.classList.remove('show');
        placeholder.style.display = 'none';
        renderSteps(solution);
        answerWrap.classList.add('show');
        window._lastSolution = solution;
      }

      function speakSteps() {
        if (!window._lastSolution || !window.KAMPAI || !KAMPAI.sound || !KAMPAI.sound.speak) return;
        var parts = [];
        for (var i = 0; i < window._lastSolution.steps.length; i++) {
          var t = window._lastSolution.steps[i].html.replace(/<[^>]+>/g, '');
          if (window._lastSolution.steps[i].sub) t += ' ' + window._lastSolution.steps[i].sub;
          parts.push(t);
        }
        KAMPAI.sound.speak(parts.join(' ขั้นต่อไป '), 'th-TH');
      }

      function randomize() {
        var data = generateSolvableSet();
        inputs[0].value = String(data.nums[0]);
        inputs[1].value = String(data.nums[1]);
        inputs[2].value = String(data.nums[2]);
        inputs[3].value = String(data.nums[3]);
        renderCards(data.nums);
        hideAnswer();
      }

      document.getElementById('btnBack').onclick = function () {
        if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
        else history.back();
      };
      document.getElementById('btnReveal').onclick = reveal;
      document.getElementById('btnHide').onclick = hideAnswer;
      document.getElementById('btnRandom').onclick = randomize;
      document.getElementById('btnSpeak').onclick = speakSteps;
      inputs.forEach(function (inp) { inp.addEventListener('input', syncCards); });

      function shuffleArr(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }

      function uniquePositiveOpts(correct, candidates) {
        var seen = {};
        seen[correct] = true;
        var opts = [correct];
        for (var i = 0; i < candidates.length && opts.length < 4; i++) {
          var v = candidates[i];
          if (v > 0 && !seen[v]) {
            seen[v] = true;
            opts.push(v);
          }
        }
        var n = 1;
        while (opts.length < 4) {
          var fill = correct + n;
          if (fill > 0 && !seen[fill]) {
            seen[fill] = true;
            opts.push(fill);
          }
          n++;
          if (n > 200) break;
        }
        return shuffleArr(opts);
      }

      function randRange(lo, hi) {
        return lo + Math.floor(Math.random() * (hi - lo + 1));
      }

      function nextPractice() {
        var pq = document.getElementById('pq');
        var popts = document.getElementById('popts');
        var pfb = document.getElementById('pfb');
        pfb.textContent = '';
        pfb.style.color = '';
        var type = Math.floor(Math.random() * 2);

        if (type === 0) {
          var a = randRange(2, 8);
          var b = randRange(2, 8);
          var c = randRange(2, 6);
          var variants = [
            { q: a + ' + ' + b + ' × ' + c + ' = ?', ans: a + b * c, cand: [a * b + c, (a + b) * c, a + b + c, a * b * c] },
            { q: a + ' × ' + b + ' − ' + c + ' = ?', ans: a * b - c, cand: [a * (b - c), a + b - c, a * b + c, a + b * c] },
            { q: '(' + a + ' + ' + b + ') × ' + c + ' = ?', ans: (a + b) * c, cand: [a + b * c, a * b * c, a + b + c, a * c + b] },
            { q: a + ' × ' + b + ' + ' + c + ' = ?', ans: a * b + c, cand: [a * (b + c), (a + b) * c, a + b + c, a * b - c] },
          ];
          var pick = variants[Math.floor(Math.random() * variants.length)];
          if (pick.ans <= 0) pick = variants[0];
          var numOpts = uniquePositiveOpts(pick.ans, pick.cand);
          pq.textContent = pick.q;
          popts.innerHTML = numOpts.map(function (o) {
            return '<button type="button" class="opt" data-a="' + o + '">' + o + '</button>';
          }).join('');
          popts.querySelectorAll('.opt').forEach(function (btn) {
            btn.onclick = function () {
              var ok = Number(btn.dataset.a) === pick.ans;
              btn.classList.add(ok ? 'ok' : 'no');
              popts.querySelectorAll('.opt').forEach(function (b) {
                b.disabled = true;
                if (Number(b.dataset.a) === pick.ans) b.classList.add('ok');
              });
              pfb.textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: ' + pick.ans;
              pfb.style.color = ok ? '#16a34a' : '#dc2626';
            };
          });
          return;
        }

        var puzzles = [
          { nums: '8, 3, 1, 1', correct: '8 × 3 × 1 × 1', wrong: ['8 + 3 + 1 + 1', '8 × 3 + 1 − 1', '(8 + 3) × 1 + 1'] },
          { nums: '6, 4, 2, 2', correct: '6 × 4 × 2 ÷ 2', wrong: ['6 + 4 + 2 + 2', '6 × 4 − 2 × 2', '(6 + 4) × 2 ÷ 2'] },
          { nums: '6, 4, 1, 1', correct: '6 × 4 × 1 × 1', wrong: ['6 + 4 + 1 + 1', '6 × 4 − 1 − 1', '(6 + 4) × 1 + 1'] },
          { nums: '8, 6, 1, 3', correct: '8 × 6 ÷ (3 − 1)', wrong: ['8 + 6 + 1 + 3', '8 × 6 − 3 × 1', '(8 + 6) × 1 + 3'] },
          { nums: '9, 3, 2, 1', correct: '9 × 3 − 2 − 1', wrong: ['9 + 3 + 2 + 1', '9 × 3 ÷ 2 × 1', '(9 + 3) × 2 − 1'] },
          { nums: '4, 3, 2, 1', correct: '4 × 3 × 2 × 1', wrong: ['4 + 3 + 2 + 1', '4 × 3 + 2 × 1', '(4 + 3) × 2 + 1'] },
        ];
        var pz = puzzles[Math.floor(Math.random() * puzzles.length)];
        var exprOpts = shuffleArr([pz.correct].concat(pz.wrong));
        pq.textContent = 'ตัวเลข ' + pz.nums + ' — ข้อใดใช้ครบ 4 ตัวแล้วได้ 24?';
        popts.innerHTML = exprOpts.map(function (o, i) {
          return '<button type="button" class="opt" data-i="' + i + '" data-ok="' + (o === pz.correct ? '1' : '0') + '">' + o + '</button>';
        }).join('');
        popts.querySelectorAll('.opt').forEach(function (btn) {
          btn.onclick = function () {
            var ok = btn.dataset.ok === '1';
            btn.classList.add(ok ? 'ok' : 'no');
            popts.querySelectorAll('.opt').forEach(function (b) {
              b.disabled = true;
              if (b.dataset.ok === '1') b.classList.add('ok');
            });
            pfb.textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: ' + pz.correct;
            pfb.style.color = ok ? '#16a34a' : '#dc2626';
          };
        });
      }

      document.getElementById('btnPracticeNext').onclick = nextPractice;
      document.getElementById('modeSeg').querySelectorAll('button').forEach(function (btn) {
        btn.onclick = function () {
          var practice = btn.dataset.mode === 'practice';
          document.getElementById('modeSeg').querySelectorAll('button').forEach(function (b) {
            b.classList.toggle('on', b === btn);
          });
          document.querySelector('.shell').classList.toggle('practice-on', practice);
          if (practice) nextPractice();
        };
      });

      randomize();
    })();
  </script>
</body>
</html>
