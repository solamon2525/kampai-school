<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#064e3b"/><stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.25"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">💰</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🪙</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.1–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">แลกเหรียญ</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">ฝึกทักษะคำนวณและทอนเงินในร้านค้าสหกรณ์โรงเรียน</text>

  <!-- Money Stack preview -->
  <g transform="translate(640,515)">
    <!-- Banknote stack (50, 100) -->
    <rect x="-180" y="-40" width="140" height="80" rx="6" fill="#be123c" stroke="#ffffff" stroke-width="2" filter="url(#sh)" transform="rotate(-15)"/>
    <text x="-110" y="0" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="rotate(-15)">฿100</text>

    <rect x="-100" y="-30" width="140" height="80" rx="6" fill="#1d4ed8" stroke="#ffffff" stroke-width="2" filter="url(#sh)" transform="rotate(5)"/>
    <text x="-30" y="10" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="rotate(5)">฿50</text>

    <!-- Thai Coins -->
    <!-- 10 Baht coin -->
    <circle cx="80" cy="20" r="32" fill="#d97706" stroke="#94a3b8" stroke-width="5" filter="url(#sh)"/>
    <text x="80" y="22" font-size="18" font-weight="800" fill="#451a03" text-anchor="middle" dominant-baseline="middle">10</text>

    <!-- 5 Baht coin -->
    <circle cx="160" cy="-10" r="28" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3" filter="url(#sh)"/>
    <text x="160" y="-8" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">5</text>
  </g>
  <g transform="translate(640,652)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#10b981" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">ทอนเงิน · แลกธนบัตร 20/50/100/500 · เหรียญ 1/2/5/10</text>
  </g>
</svg>
