<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/math-24-thinking-media.html"><meta name="curriculum-indicators" content="ค 1.1 ป.4/10, ค 1.1 ป.4/12"><title>ใบงานเกม 24 วิธีคิดทีละขั้น ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.199.2" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.199.2" rel="stylesheet"></head><body>
<header class="toolbar"><h1>🧮 ใบงานเกม 24 วิธีคิดทีละขั้น</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="plan">วางแผนหา 24</option><option value="compute">คำนวณทีละขั้น</option><option value="check">ตรวจคำตอบ</option><option value="strategy">กลยุทธ์</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="10">10 ข้อ</option><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.199.2"></script><script>
const MATH24_TYPES=['compute','plan','check','strategy'];

function math24Hash(text){let hash=2166136261;for(let index=0;index<text.length;index+=1){hash^=text.charCodeAt(index);hash=Math.imul(hash,16777619)}return hash>>>0}
function math24Node(value,expression,steps,hasDivision){return{value,expression,steps,hasDivision}}
function math24Combine(left,right){
  const results=[];
  const add=(a,b,operator,value,hasDivision=false)=>{const expression='('+a.expression+operator+b.expression+')';const step=a.value+' '+operator+' '+b.value+' = '+value;results.push(math24Node(value,expression,[...a.steps,...b.steps,step],a.hasDivision||b.hasDivision||hasDivision))};
  add(left,right,'+',left.value+right.value);
  if(left.value!==1&&right.value!==1)add(left,right,'×',left.value*right.value);
  if(left.value>right.value)add(left,right,'−',left.value-right.value);
  if(right.value>left.value)add(right,left,'−',right.value-left.value);
  if(right.value!==1&&left.value!==right.value&&left.value%right.value===0)add(left,right,'÷',left.value/right.value,true);
  if(left.value!==1&&right.value!==left.value&&right.value%left.value===0)add(right,left,'÷',right.value/left.value,true);
  return results;
}
function math24Solve(numbers,wantDivision){
  const initial=numbers.map(number=>math24Node(number,String(number),[],false));
  const visited=new Set();
  function search(nodes){
    const signature=nodes.map(node=>node.value+':'+Number(node.hasDivision)).sort().join('|');
    if(visited.has(signature))return null;
    visited.add(signature);
    if(nodes.length===1)return nodes[0].value===24&&nodes[0].hasDivision===wantDivision?nodes[0]:null;
    for(let leftIndex=0;leftIndex<nodes.length;leftIndex+=1)for(let rightIndex=leftIndex+1;rightIndex<nodes.length;rightIndex+=1){
      const rest=nodes.filter((_,index)=>index!==leftIndex&&index!==rightIndex);
      for(const combined of math24Combine(nodes[leftIndex],nodes[rightIndex])){const found=search([...rest,combined]);if(found)return found}
    }
    return null;
  }
  return search(initial);
}
function math24Candidate(numbers,solution){const key=[...numbers].sort((a,b)=>a-b).join(',');return{key,nums:numbers.join(' '),prompt:'หา 24 จาก '+numbers.join(', '),answer:solution.expression.slice(1,-1)+' = 24',step1:solution.steps[0],step2:solution.steps[1],step3:solution.steps[2],hasDivision:solution.hasDivision,hasOne:numbers.includes(1)}}
function buildMath24Items(){
  const division=[];const plain=[];
  for(let a=1;a<=9;a+=1)for(let b=a;b<=9;b+=1)for(let c=b;c<=9;c+=1)for(let d=c;d<=9;d+=1){const numbers=[a,b,c,d];const divisionSolution=math24Solve(numbers,true);const plainSolution=math24Solve(numbers,false);if(divisionSolution)division.push(math24Candidate(numbers,divisionSolution));if(plainSolution)plain.push(math24Candidate(numbers,plainSolution))}
  const rank=list=>list.sort((left,right)=>math24Hash(left.key+'|'+Number(left.hasDivision))-math24Hash(right.key+'|'+Number(right.hasDivision)));rank(division);rank(plain);
  const used=new Set();
  const take=(list,wantsOne)=>{const item=list.find(candidate=>candidate.hasOne===wantsOne&&!used.has(candidate.key));if(!item)throw new Error('คลังเกม 24 ไม่พอสำหรับเงื่อนไขความหลากหลาย');used.add(item.key);return item};
  const items=[];
  for(const type of MATH24_TYPES){const topicItems=[];topicItems.push({...take(division,true),type});for(let index=0;index<8;index+=1)topicItems.push({...take(division,false),type});for(let index=0;index<2;index+=1)topicItems.push({...take(plain,true),type});for(let index=0;index<19;index+=1)topicItems.push({...take(plain,false),type});topicItems.sort((left,right)=>math24Hash(left.key+'|'+type)-math24Hash(right.key+'|'+type));items.push(...topicItems)}
  return items;
}
const MATH24_ITEMS=buildMath24Items();
function selectMath24Pages({fullPool,selectedPool,count,pageCount,shuffle,nextRandom}){
  const selectedKeys=new Set(selectedPool.map(item=>item.key));const pool=[...shuffle(selectedPool),...shuffle(fullPool.filter(item=>!selectedKeys.has(item.key)))];const used=new Set();const pages=[];
  const take=(predicate,amount,oneLimit,state)=>{const picked=[];for(const item of pool){if(picked.length>=amount)break;if(used.has(item.key)||!predicate(item))continue;if(item.hasOne&&state.ones>=oneLimit)continue;picked.push(item);used.add(item.key);if(item.hasOne)state.ones+=1}return picked};
  for(let pageIndex=0;pageIndex<pageCount;pageIndex+=1){const oneLimit=count===10?2:1;const divisionTarget=count===10?2+(nextRandom()<0.5?1:0):1+(nextRandom()<0.35?1:0);const state={ones:0};const page=[...take(item=>item.hasDivision,divisionTarget,oneLimit,state)];page.push(...take(item=>!item.hasDivision,count-page.length,oneLimit,state));if(page.length<count)page.push(...take(()=>true,count-page.length,oneLimit,state));if(page.length!==count)throw new Error('เลือกโจทย์เกม 24 ได้ไม่ครบตามจำนวนที่กำหนด');pages.push(shuffle(page))}
  return pages;
}
window.__MATH24_BANK_STATS={total:MATH24_ITEMS.length,withOne:MATH24_ITEMS.filter(item=>item.hasOne).length,division:MATH24_ITEMS.filter(item=>item.hasDivision).length};
window.WORKSHEET_CONFIG={icon:'🧮',title:'ใบงานเกม 24 วิธีคิดทีละขั้น',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'เกม 24 วิธีคิด',sourceMediaUrl:'/games/math/math-24-thinking-media.html',indicators:['ค 1.1 ป.4/10','ค 1.1 ป.4/12'],directions:'ใช้เลข 4 ตัวให้ครบ วางแผน คำนวณทีละขั้น และตรวจว่าได้ 24 โดยการหารต้องลงตัวทุกขั้น',getItems(topic){return topic==='mixed'?MATH24_ITEMS:MATH24_ITEMS.filter(item=>item.type===topic);},selectAllPageItems:selectMath24Pages,renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><table class="mini-table"><tr><th>เลขที่ใช้</th><th>เป้า</th></tr><tr><td>'+e(item.nums)+'</td><td>24</td></tr></table><div>ลงวิธีคิดทีละขั้น (ใช้ครบ 4 ตัว)</div></div><div class="q-work-block"><div class="calc-line"><span class="work-fill">'+e(item.step1)+'</span></div><div class="calc-line"><span class="work-fill">'+e(item.step2)+'</span></div></div><div class="q-foot"><div class="answer-line">สรุป <span class="answer-fill">'+e(item.answer)+'</span></div></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.199.2"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnPrint').onclick=()=>window.KampaiWorksheet.printA4();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.199.2"></script></body></html>
