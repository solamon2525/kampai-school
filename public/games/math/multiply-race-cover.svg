<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="620" ry="360" fill="url(#glow)"/>

  <!-- faint watermark × -->
  <text x="1080" y="640" font-size="640" font-weight="800" fill="#ffffff" opacity="0.05" text-anchor="middle" dominant-baseline="middle">×</text>
  <text x="200" y="120" font-size="320" font-weight="800" fill="#ffffff" opacity="0.04" text-anchor="middle" dominant-baseline="middle">×</text>

  <!-- lightning bolts (speed) -->
  <path d="M150 250 l60 0 -34 70 56 0 -96 150 26 -104 -52 0 z" fill="url(#gold)" opacity="0.9" filter="url(#sh)"/>
  <path d="M1130 250 l60 0 -34 70 56 0 -96 150 26 -104 -52 0 z" fill="url(#gold)" opacity="0.9" filter="url(#sh)"/>

  <!-- top pill -->
  <g transform="translate(640,120)">
    <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เกมคณิต</text>
  </g>

  <!-- title -->
  <text x="640" y="300" font-size="150" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">แข่งสูตรคูณ</text>

  <!-- subtitle -->
  <text x="640" y="392" font-size="40" font-weight="600" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">ตอบให้ไว · แม่สูตรคูณ 2–12</text>

  <!-- equation + answer chips -->
  <g transform="translate(640,520)" font-weight="800">
    <text x="-300" y="0" font-size="76" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">7 × 8 =</text>
    <!-- chips -->
    <g dominant-baseline="middle" text-anchor="middle" font-size="48">
      <rect x="-110" y="-44" width="130" height="88" rx="20" fill="#f8fafc"/>
      <text x="-45" y="4" fill="#1e293b">54</text>
      <rect x="40" y="-44" width="130" height="88" rx="20" fill="url(#gold)" stroke="#fff7e0" stroke-width="4"/>
      <text x="105" y="4" fill="#0f172a">56</text>
      <rect x="190" y="-44" width="130" height="88" rx="20" fill="#f8fafc"/>
      <text x="255" y="4" fill="#1e293b">48</text>
    </g>
  </g>

  <!-- combo ribbon bottom -->
  <g transform="translate(640,640)">
    <rect x="-150" y="-24" width="300" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="26" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">🔥 ยิ่งต่อเนื่อง ยิ่งได้คะแนนคูณ</text>
  </g>
</svg>
