<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bubbleGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  
  <!-- พื้นหลัง -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  
  <!-- ของตกแต่งฉากหลังจางๆ -->
  <text x="150" y="200" font-size="120" opacity="0.05" text-anchor="middle" dominant-baseline="middle">➕</text>
  <text x="1130" y="550" font-size="120" opacity="0.05" text-anchor="middle" dominant-baseline="middle">✖️</text>
  <text x="1050" y="200" font-size="140" opacity="0.05" text-anchor="middle" dominant-baseline="middle">❓</text>
  <text x="200" y="520" font-size="140" opacity="0.05" text-anchor="middle" dominant-baseline="middle">🧠</text>

  <!-- แท็กด้านบน -->
  <g transform="translate(640,116)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#dbeafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · เกมคณิตศาสตร์ · ป.1–ป.6</text>
  </g>
  
  <!-- ชื่อเกม -->
  <text x="640" y="278" font-size="114" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">คณิตคิดเร็วตกใส่ตะกร้า</text>
  <text x="640" y="368" font-size="34" font-weight="700" fill="#93c5fd" text-anchor="middle" dominant-baseline="middle">รับเลขคำตอบที่ถูกต้องเพื่อสะสมคอมโบสูงสุด และแข่งชิงอันดับ!</text>

  <!-- ฟองสบู่ตัวเลขหลากสี -->
  <!-- ฟองสบู่ 1 (ตัวเลขถูก 15) -->
  <g transform="translate(380,510)" filter="url(#sh)">
    <circle cx="0" cy="0" r="54" fill="url(#bubbleGold)" stroke="#ffffff" stroke-width="4"/>
    <circle cx="-16" cy="-16" r="10" fill="#ffffff" opacity="0.4"/>
    <text x="0" y="4" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">15</text>
  </g>
  
  <!-- ฟองสบู่ 2 (ตัวเลขผิด 9) -->
  <g transform="translate(900,480)" filter="url(#sh)">
    <circle cx="0" cy="0" r="46" fill="url(#bubbleBlue)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-14" cy="-14" r="8" fill="#ffffff" opacity="0.4"/>
    <text x="0" y="3" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">9</text>
  </g>

  <!-- ตะกร้าและไอเทมเด่นตรงกลาง -->
  <g transform="translate(640,560)">
    <!-- เอฟเฟกต์ไฟคอมโบ -->
    <path d="M-80,-20 Q-100,-70 -50,-80 Q-40,-50 -20,-70 Q0,-100 20,-70 Q40,-50 50,-80 Q100,-70 80,-20 Z" fill="#f97316" opacity="0.45"/>
    <path d="M-50,-20 Q-70,-60 -30,-65 Q-20,-45 0,-60 Q20,-45 30,-65 Q70,-60 50,-20 Z" fill="#eab308" opacity="0.65"/>
    
    <!-- เกราะแก้วโล่สีเขียว -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="16 12" opacity="0.6"/>
    
    <!-- ไอคอนตะกร้าใหญ่ -->
    <text x="0" y="10" font-size="110" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">🧺</text>
  </g>
  
  <!-- ตกแต่งไอเทมข้างๆ -->
  <!-- ❄️ แช่แข็ง -->
  <text x="240" y="370" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">❄️</text>
  <!-- 🛡️ โล่ -->
  <text x="210" y="550" font-size="68" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">🛡️</text>
  <!-- 🧲 แม่เหล็ก -->
  <text x="1070" y="370" font-size="64" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">🧲</text>
  <!-- 💣 ระเบิด -->
  <text x="1050" y="550" font-size="68" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)">💣</text>

  <!-- ข้อความด้านล่างสุด -->
  <g transform="translate(640,668)">
    <rect x="-260" y="-24" width="520" height="48" rx="24" fill="#fb923c" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fde047" text-anchor="middle" dominant-baseline="middle">ไอเทมพิเศษ ❄️🛡️🧲✨ · อ่านออกเสียงโจทย์ภาษาไทย · แข่งสดออนไลน์</text>
  </g>
</svg>
