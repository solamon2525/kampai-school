<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08071a"/>
      <stop offset="0.6" stop-color="#0f0c31"/>
      <stop offset="1" stop-color="#1b002c"/>
    </linearGradient>

    <!-- Gold/Yellow Retro Metal Gradient for Title -->
    <linearGradient id="retroGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.25" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#ff8c00"/>
      <stop offset="0.75" stop-color="#ff4500"/>
      <stop offset="1" stop-color="#8b0000"/>
    </linearGradient>

    <!-- Cyan Laser Glow -->
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Pink Glow -->
    <linearGradient id="magentaGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff007f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff007f" stop-opacity="1"/>
      <stop offset="1" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="neonCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Space -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Grid lines (Perspective Synthwave) -->
  <g stroke="rgba(0, 255, 255, 0.12)" stroke-width="1.5">
    <!-- Horizontal lines -->
    <line x1="0" y1="520" x2="1280" y2="520"/>
    <line x1="0" y1="550" x2="1280" y2="550"/>
    <line x1="0" y1="590" x2="1280" y2="590"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="0" y1="700" x2="1280" y2="700"/>
    <!-- Vertical perspective lines -->
    <line x1="640" y1="500" x2="640" y2="720"/>
    <line x1="640" y1="500" x2="440" y2="720"/>
    <line x1="640" y1="500" x2="240" y2="720"/>
    <line x1="640" y1="500" x2="0" y2="720"/>
    <line x1="640" y1="500" x2="840" y2="720"/>
    <line x1="640" y1="500" x2="1040" y2="720"/>
    <line x1="640" y1="500" x2="1280" y2="720"/>
  </g>

  <!-- Stars / Particle field -->
  <g fill="#ffffff">
    <circle cx="200" cy="150" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="280" r="2.5" opacity="0.6"/>
    <circle cx="150" cy="420" r="1" opacity="0.7"/>
    <circle cx="1050" cy="130" r="2" opacity="0.9"/>
    <circle cx="1150" cy="310" r="1.5" opacity="0.5"/>
    <circle cx="1120" cy="450" r="3" opacity="0.7" fill="#ff007f"/>
    <circle cx="950" cy="220" r="2" opacity="0.8" fill="#00ffff"/>
    <circle cx="380" cy="110" r="2" opacity="0.4"/>
    <circle cx="850" cy="420" r="1" opacity="0.5"/>
    <circle cx="50" cy="80" r="1.5" opacity="0.6"/>
  </g>

  <!-- Laser Beam P1 (Left Side) -->
  <line x1="320" y1="650" x2="320" y2="350" stroke="url(#cyanGlow)" stroke-width="8" filter="url(#neonCyan)"/>
  <!-- Laser Beam P2 (Right Side) -->
  <line x1="960" y1="650" x2="960" y2="280" stroke="url(#magentaGlow)" stroke-width="8" filter="url(#neonPink)"/>

  <!-- Asteroid 1 (Correct Answer Target) -->
  <g transform="translate(320, 260)" filter="url(#shadow)">
    <!-- Asteroid Body -->
    <path d="M-50,-20 L-20,-45 L30,-40 L50,-10 L35,40 L-10,35 L-45,15 Z" fill="#3a3852" stroke="#5d5a7d" stroke-width="3"/>
    <!-- Text container -->
    <rect x="-35" y="-14" width="70" height="28" rx="8" fill="rgba(0,0,0,0.6)"/>
    <!-- Formula answer -->
    <text x="0" y="2" font-size="20" font-weight="700" fill="#00ffff" text-anchor="middle" dominant-baseline="middle" font-family="'Press Start 2P', monospace">42</text>
  </g>

  <!-- Asteroid 2 (Wrong Answer Target) -->
  <g transform="translate(960, 200)" filter="url(#shadow)">
    <path d="M-40,-30 L10,-45 L45,-20 L35,30 L-15,40 L-45,10 Z" fill="#3c2f42" stroke="#5e4966" stroke-width="3"/>
    <rect x="-35" y="-14" width="70" height="28" rx="8" fill="rgba(0,0,0,0.6)"/>
    <text x="0" y="2" font-size="20" font-weight="700" fill="#ff3366" text-anchor="middle" dominant-baseline="middle" font-family="'Press Start 2P', monospace">35</text>
  </g>

  <!-- Player 1 Space Ship (Cyan) -->
  <g transform="translate(320, 600)" filter="url(#shadow)">
    <!-- Engine Fire -->
    <polygon points="-8,40 8,40 0,60" fill="#ffa500"/>
    <!-- Wings/Base -->
    <polygon points="0,0 -30,30 30,30" fill="#00bfff"/>
    <!-- Details -->
    <polygon points="0,-15 -15,15 15,15" fill="#00ffff"/>
  </g>

  <!-- Player 2 Space Ship (Magenta) -->
  <g transform="translate(960, 600)" filter="url(#shadow)">
    <!-- Engine Fire -->
    <polygon points="-8,40 8,40 0,60" fill="#ffa500"/>
    <!-- Wings/Base -->
    <polygon points="0,0 -30,30 30,30" fill="#c71585"/>
    <!-- Details -->
    <polygon points="0,-15 -15,15 15,15" fill="#ff007f"/>
  </g>

  <!-- Top Pill Info -->
  <g transform="translate(640, 100)">
    <rect x="-220" y="-28" width="440" height="56" rx="28" fill="#ffffff" opacity="0.1"/>
    <text x="0" y="2" font-size="24" font-weight="600" fill="#00ffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">🎮 KAMPAI SCHOOL · MULTIPLAYER GAME</text>
  </g>

  <!-- Super Math-Blaster Retro Title -->
  <text x="640" y="260" font-size="120" font-weight="900" fill="url(#retroGold)" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)" letter-spacing="4" font-style="italic">MATH-BLASTER</text>

  <!-- Subtitle -->
  <text x="640" y="360" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">GALACTIC DUEL • ศึกดวลเลขคณิตอวกาศ</text>

  <!-- Equation banner -->
  <g transform="translate(640, 450)" filter="url(#shadow)">
    <rect x="-320" y="-35" width="640" height="70" rx="35" fill="rgba(0, 0, 0, 0.75)" stroke="#00ffff" stroke-width="3"/>
    <text x="0" y="3" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">โจทย์คณิต: 6 × 7 = ?</text>
  </g>

  <!-- Bottom Ribbon text -->
  <g transform="translate(640, 650)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#ff007f" opacity="0.2"/>
    <text x="0" y="2" font-size="22" font-weight="600" fill="#ff9fc3" text-anchor="middle" dominant-baseline="middle">🛸 โหมดเล่นคนเดียว หรือเล่นคู่ประสานพลังยิงบอส 🛸</text>
  </g>
</svg>
