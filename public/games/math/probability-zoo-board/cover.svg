<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Path Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Board Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Perimeter Border Path Simulation -->
  <g fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2">
    <rect x="20" y="20" width="1240" height="680" rx="15" />
    <rect x="140" y="140" width="1000" height="440" rx="10" stroke="#334155" stroke-width="4" />
  </g>

  <!-- Central Zoo Artwork Base -->
  <g transform="translate(640, 340)">
    <!-- Sunny sky aura -->
    <circle cx="0" cy="0" r="220" fill="rgba(251, 191, 36, 0.1)" filter="url(#glow)" />
    
    <!-- Cartoon Animals Silhouettes / Vectors -->
    <!-- Elephant (Left) -->
    <path d="M -180,50 c -20,-10 -40,-5 -50,15 c -5,10 -3,25 5,30 c 15,10 30,0 35,-15" fill="#64748b" stroke="#334155" stroke-width="3" />
    <circle cx="-160" cy="30" r="45" fill="#64748b" />
    <rect x="-185" y="30" width="40" height="70" fill="#64748b" rx="10" />
    <!-- Lion (Right) -->
    <circle cx="160" cy="40" r="50" fill="#f97316" /> <!-- Mane -->
    <circle cx="160" cy="40" r="38" fill="#fde047" /> <!-- Face -->
    <circle cx="145" cy="35" r="5" fill="#000" />
    <circle cx="175" cy="35" r="5" fill="#000" />
    <!-- Giraffe Neck (Center) -->
    <rect x="-30" y="-140" width="30" height="180" fill="#fbbf24" rx="10" />
    <circle cx="-15" cy="-140" r="25" fill="#fbbf24" />
    <!-- Giraffe spots -->
    <circle cx="-20" cy="-60" r="8" fill="#b45309" />
    <circle cx="-10" cy="-100" r="10" fill="#b45309" />
    <circle cx="-15" cy="-20" r="9" fill="#b45309" />
  </g>

  <!-- Probability Symbols -->
  <!-- 3D Rolling Dice (Top-Left) -->
  <g transform="translate(250, 160) rotate(15)">
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#fff" stroke="#000" stroke-width="4" />
    <circle cx="-20" cy="-20" r="8" fill="#000" />
    <circle cx="20" cy="20" r="8" fill="#000" />
    <circle cx="0" cy="0" r="8" fill="#000" />
  </g>

  <!-- Spin Wheel (Bottom-Right) -->
  <g transform="translate(1030, 520)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ca8a04" stroke-width="6" />
    <path d="M 0,0 L 56,-56 A 80,80 0 0,1 80,0 Z" fill="#2563eb" />
    <path d="M 0,0 L 80,0 A 80,80 0 0,1 0,80 Z" fill="#16a34a" />
    <path d="M 0,0 L 0,80 A 80,80 0 0,1 -80,0 Z" fill="#dc2626" />
    <path d="M 0,0 L -80,0 A 80,80 0 0,1 56,-56 Z" fill="#ca8a04" />
    <!-- Center needle -->
    <polygon points="0,-10 -5,25 5,25" fill="#fff" stroke="#000" stroke-width="2" transform="rotate(30)" />
    <circle cx="0" cy="0" r="10" fill="#fff" stroke="#000" stroke-width="2" />
  </g>

  <!-- Path Tiles Highlights -->
  <g stroke="#fff" stroke-width="2">
    <!-- START (Bottom-Left) -->
    <rect x="50" y="530" width="100" height="100" rx="8" fill="#2563eb" />
    <text x="100" y="590" font-family="sans-serif" font-weight="bold" font-size="18" fill="#fff" text-anchor="middle">START</text>

    <!-- Quiz Tile (Top-Center) -->
    <rect x="590" y="30" width="100" height="100" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="3" />
    <text x="640" y="75" font-family="sans-serif" font-weight="black" font-size="28" fill="#93c5fd" text-anchor="middle">?</text>
    <text x="640" y="110" font-family="sans-serif" font-weight="bold" font-size="14" fill="#93c5fd" text-anchor="middle">QUIZ</text>

    <!-- FINISH (Bottom-Right) -->
    <rect x="1130" y="530" width="100" height="100" rx="8" fill="url(#tileGrad)" stroke="#eab308" stroke-width="3" />
    <text x="1180" y="590" font-family="sans-serif" font-weight="bold" font-size="18" fill="#fff" text-anchor="middle">FINISH</text>
  </g>

  <!-- Typography Title -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="640" y="320" font-family="sans-serif" font-weight="900" font-size="82" fill="#fbbf24" stroke="#000" stroke-width="3">PROBABILITY ZOO</text>
    <text x="640" y="380" font-family="sans-serif" font-weight="bold" font-size="26" fill="#38bdf8" letter-spacing="4">บอร์ดเกมคณิตศาสตร์เรื่องความน่าจะเป็น</text>
  </g>

  <!-- Player Pawns -->
  <circle cx="100" cy="580" r="14" fill="#ef4444" stroke="#fff" stroke-width="2" />
  <circle cx="1180" cy="580" r="14" fill="#3b82f6" stroke="#fff" stroke-width="2" />
</svg>
