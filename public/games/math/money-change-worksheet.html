<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/money-change-media.html"><meta name="curriculum-indicators" content="ค 1.1 ป.2/2, ค 1.1 ป.3/1"><title>ใบงานเงินทอน ป.1–3 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.181.0" rel="stylesheet">
<style>
.skill-tag{display:inline-block;font-size:6.5pt;font-weight:800;color:var(--ws-accent);border:1px solid var(--ws-accent);border-radius:3px;padding:.2mm 1.2mm;margin-bottom:.8mm}
.money-box{border:1px solid var(--ws-line);border-radius:3px;padding:1mm;margin:.8mm 0;font-size:8pt;font-weight:800;color:var(--ws-accent);text-align:center}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:22mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-5 .money-box{font-size:10pt;padding:1.5mm}
</style>
</head><body>
<header class="toolbar"><h1>🪙 ใบงานเงินทอน</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="1">ป.1</option><option value="2">ป.2</option><option value="3">ป.3</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="easy">ทอนง่าย</option><option value="mid">ทอนปานกลาง</option><option value="formula">สูตร</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const ITEMS=[
 {type:'easy',prompt:'ซื้อของราคา 7 บาท จ่าย 10 บาท ทอนกี่บาท',pay:10,price:7,answer:'3 บาท',step1:'10 − 7',step2:'คิดลบ',step3:'3'},
 {type:'easy',prompt:'ซื้อของราคา 15 บาท จ่าย 20 บาท ทอนกี่บาท',pay:20,price:15,answer:'5 บาท',step1:'20 − 15',step2:'คิดลบ',step3:'5'},
 {type:'easy',prompt:'ซื้อของราคา 8 บาท จ่าย 10 บาท ทอนกี่บาท',pay:10,price:8,answer:'2 บาท',step1:'10 − 8',step2:'คิดลบ',step3:'2'},
 {type:'mid',prompt:'ซื้อของราคา 25 บาท จ่าย 50 บาท ทอนกี่บาท',pay:50,price:25,answer:'25 บาท',step1:'50 − 25',step2:'คิดลบ',step3:'25'},
 {type:'mid',prompt:'ซื้อของราคา 35 บาท จ่าย 50 บาท ทอนกี่บาท',pay:50,price:35,answer:'15 บาท',step1:'50 − 35',step2:'คิดลบ',step3:'15'},
 {type:'mid',prompt:'ซื้อของราคา 40 บาท จ่าย 100 บาท ทอนกี่บาท',pay:100,price:40,answer:'60 บาท',step1:'100 − 40',step2:'คิดลบ',step3:'60'},
 {type:'mid',prompt:'ซื้อของราคา 12 บาท จ่าย 20 บาท ทอนกี่บาท',pay:20,price:12,answer:'8 บาท',step1:'20 − 12',step2:'คิดลบ',step3:'8'},
 {type:'formula',prompt:'สูตรเงินทอนคืออะไร',pay:'จ่าย',price:'ราคา',answer:'เงินที่จ่าย − ราคาของ',step1:'เงินที่จ่าย',step2:'ลบราคาของ',step3:'ได้เงินทอน'},
 {type:'formula',prompt:'ถ้าจ่ายน้อยกว่าราคา จะทอนได้หรือไม่',pay:'น้อย',price:'มาก',answer:'ไม่ได้ ต้องจ่ายเพิ่ม',step1:'จ่าย < ราคา',step2:'เงินไม่พอ',step3:'จ่ายเพิ่ม'},
 {type:'easy',prompt:'ซื้อของราคา 3 บาท จ่าย 5 บาท ทอนกี่บาท',pay:5,price:3,answer:'2 บาท',step1:'5 − 3',step2:'คิดลบ',step3:'2'}
];
const SKILL={easy:'ทอนง่าย',mid:'ทอนปานกลาง',formula:'สูตร'};
window.WORKSHEET_CONFIG={
  worksheetKey:'money-change',
  icon:'🪙',title:'ใบงานเงินทอน',subject:'คณิตศาสตร์',gradeLabel:'ป.1–3',mediaLabel:'เงินทอน',
  sourceMediaUrl:'/games/math/money-change-media.html',indicators:['ค 1.1 ป.2/2','ค 1.1 ป.3/1'],
  directions:'ดูราคาและเงินที่จ่าย → ลบทีละขั้น → เขียนเงินทอน',
  getItems(topic){return topic==='mixed'?ITEMS:ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><span class="skill-tag">'+e(SKILL[item.type]||item.type)+'</span><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="money-box">จ่าย '+e(String(item.pay))+(typeof item.pay==='number'?' บาท':'')+' · ราคา '+e(String(item.price))+(typeof item.price==='number'?' บาท':'')+'</div>'
      +'</div><div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ตั้งโจทย์</span><div class="step-body"><span class="work-fill">'+e(item.step1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 คำนวณ</span><div class="step-body"><span class="work-fill">'+e(item.step2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 เงินทอน</span><div class="step-body"><span class="work-fill">'+e(item.step3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.181.0"></script></body></html>
