<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Math Jumper cover</title>
  <desc id="desc">A colorful math platform jumping game cover with arithmetic symbols and sky platforms.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46b7f6"/>
      <stop offset="0.55" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#fff3bd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe873"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#145172" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1080" cy="130" r="82" fill="#fff6a8" opacity="0.95"/>
  <g fill="#ffffff" opacity="0.78">
    <ellipse cx="170" cy="142" rx="92" ry="34"/>
    <ellipse cx="230" cy="130" rx="70" ry="42"/>
    <ellipse cx="292" cy="150" rx="96" ry="33"/>
    <ellipse cx="920" cy="238" rx="88" ry="32"/>
    <ellipse cx="982" cy="224" rx="64" ry="40"/>
    <ellipse cx="1040" cy="244" rx="92" ry="30"/>
  </g>

  <g opacity="0.23" font-family="Arial, sans-serif" font-weight="800" fill="#0f4c81">
    <text x="88" y="330" font-size="86" transform="rotate(-13 88 330)">+</text>
    <text x="1010" y="385" font-size="96" transform="rotate(12 1010 385)">÷</text>
    <text x="760" y="152" font-size="74" transform="rotate(-9 760 152)">×</text>
    <text x="103" y="590" font-size="80" transform="rotate(10 103 590)">= ?</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="190" y="548" width="260" height="50" rx="18" fill="#7ee083" stroke="#1f8f47" stroke-width="7"/>
    <rect x="470" y="446" width="250" height="50" rx="18" fill="#ffd166" stroke="#d97706" stroke-width="7"/>
    <rect x="760" y="342" width="250" height="50" rx="18" fill="#fca5a5" stroke="#dc2626" stroke-width="7"/>
    <rect x="905" y="565" width="230" height="50" rx="18" fill="#c4b5fd" stroke="#7c3aed" stroke-width="7"/>
  </g>

  <g transform="translate(536 240)" filter="url(#shadow)">
    <path d="M86 12c37 0 67 29 67 66 0 31-21 57-49 64l18 58H51l18-58C40 135 19 109 19 78c0-37 30-66 67-66z" fill="#ef4444"/>
    <circle cx="63" cy="72" r="9" fill="#111827"/>
    <circle cx="109" cy="72" r="9" fill="#111827"/>
    <path d="M68 101c15 12 31 12 47 0" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <path d="M28 97L-24 135l50 8z" fill="#f59e0b"/>
    <path d="M144 96l60 34-56 13z" fill="#f59e0b"/>
    <rect x="48" y="190" width="26" height="72" rx="12" fill="#1f2937"/>
    <rect x="100" y="190" width="26" height="72" rx="12" fill="#1f2937"/>
    <path d="M67 198c10 18 29 18 40 0" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="112" y="72" width="620" height="146" rx="34" fill="#ffffff" opacity="0.95"/>
    <text x="146" y="156" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#123047">Math Jumper</text>
    <text x="150" y="198" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f97316">Jump to the correct answer</text>
  </g>

  <g transform="translate(844 96)" filter="url(#shadow)">
    <rect width="270" height="130" rx="28" fill="url(#gold)" stroke="#ffffff" stroke-width="8"/>
    <text x="135" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="#7c2d12">8 × ? = 56</text>
  </g>
</svg>
