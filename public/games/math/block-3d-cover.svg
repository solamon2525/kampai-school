<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/><stop offset="0.55" stop-color="#065f46"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🧱</text>
  <text x="1110" y="170" font-size="180" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🔢</text>

  <g transform="translate(640,112)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#d1fae5" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6 · 3D</text>
  </g>
  <text x="640" y="272" font-size="118" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">บล็อก 3 มิติ</text>
  <text x="640" y="352" font-size="33" font-weight="700" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">นับลูกบาศก์ (ปริมาตร) · อ่านเศษส่วนจากบล็อก</text>

  <!-- กองลูกบาศก์ isometric (3x2x2) -->
  <g transform="translate(430,520)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round">
    <g id="cube"></g>
  </g>
  <!-- วาดกองลูกบาศก์ด้วยมือ (ภาพรวม) -->
  <g transform="translate(430,470)" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round">
    <!-- แถวล่าง 3 ก้อน -->
    <g>
      <!-- ก้อนชุดหน้า -->
      <g transform="translate(0,40)"><polygon points="0,0 36,-20 72,0 36,20" fill="#7dd3fc"/><polygon points="0,0 0,40 36,60 36,20" fill="#38bdf8"/><polygon points="72,0 72,40 36,60 36,20" fill="#0ea5e9"/></g>
      <g transform="translate(60,40)"><polygon points="0,0 36,-20 72,0 36,20" fill="#7dd3fc"/><polygon points="0,0 0,40 36,60 36,20" fill="#38bdf8"/><polygon points="72,0 72,40 36,60 36,20" fill="#0ea5e9"/></g>
      <g transform="translate(120,40)"><polygon points="0,0 36,-20 72,0 36,20" fill="#7dd3fc"/><polygon points="0,0 0,40 36,60 36,20" fill="#38bdf8"/><polygon points="72,0 72,40 36,60 36,20" fill="#0ea5e9"/></g>
      <!-- ชั้นบน -->
      <g transform="translate(30,0)"><polygon points="0,0 36,-20 72,0 36,20" fill="#bae6fd"/><polygon points="0,0 0,40 36,60 36,20" fill="#7dd3fc"/><polygon points="72,0 72,40 36,60 36,20" fill="#38bdf8"/></g>
      <g transform="translate(90,0)"><polygon points="0,0 36,-20 72,0 36,20" fill="#bae6fd"/><polygon points="0,0 0,40 36,60 36,20" fill="#7dd3fc"/><polygon points="72,0 72,40 36,60 36,20" fill="#38bdf8"/></g>
    </g>
  </g>
  <!-- แถบเศษส่วน 3/5 -->
  <g transform="translate(760,500)" stroke="#0f172a" stroke-width="2.5">
    <rect x="0" y="0" width="56" height="56" fill="#FFD700"/>
    <rect x="56" y="0" width="56" height="56" fill="#FFD700"/>
    <rect x="112" y="0" width="56" height="56" fill="#FFD700"/>
    <rect x="168" y="0" width="56" height="56" fill="#cbd5e1"/>
    <rect x="224" y="0" width="56" height="56" fill="#cbd5e1"/>
    <text x="140" y="100" font-size="40" font-weight="800" fill="#FFD700" text-anchor="middle" stroke="none">= 3/5</text>
  </g>

  <g transform="translate(640,672)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · ลากเพื่อหมุน · ปริมาตร+เศษส่วน</text>
  </g>
</svg>
