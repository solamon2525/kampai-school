<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="0.55" stop-color="#312e81"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.30"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.07" text-anchor="middle" dominant-baseline="middle">📦</text>
  <text x="1110" y="170" font-size="190" opacity="0.07" text-anchor="middle" dominant-baseline="middle">📐</text>

  <g transform="translate(640,112)">
    <rect x="-210" y="-26" width="420" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6 · 3D</text>
  </g>
  <text x="640" y="272" font-size="116" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">รูปคลี่ → ทรง</text>
  <text x="640" y="352" font-size="33" font-weight="700" fill="#c7d2fe" text-anchor="middle" dominant-baseline="middle">หมุนดูทรง 3 มิติ · เลือกรูปคลี่ที่พับได้ทรงนั้น</text>

  <!-- รูปคลี่ลูกบาศก์ (กากบาท) → ลูกบาศก์ 3D + ลูกศร -->
  <g stroke="#0f172a" stroke-width="3" stroke-linejoin="round">
    <!-- net กากบาท -->
    <g transform="translate(360,470)" fill="#fcd34d">
      <rect x="-22" y="-66" width="44" height="44"/><rect x="-22" y="-22" width="44" height="44"/>
      <rect x="-22" y="22" width="44" height="44"/><rect x="-22" y="66" width="44" height="44"/>
      <rect x="-66" y="-22" width="44" height="44"/><rect x="22" y="-22" width="44" height="44"/>
    </g>
    <!-- ลูกศรพับ -->
    <g transform="translate(610,510)" fill="#fbbf24" stroke="none">
      <path d="M0,-22 L60,-22 L60,-42 L110,-8 L60,26 L60,6 L0,6 Z"/>
    </g>
    <!-- ลูกบาศก์ 3D -->
    <g transform="translate(820,470)">
      <polygon points="0,-50 64,-86 128,-50 64,-14" fill="#93c5fd"/>
      <polygon points="0,-50 0,52 64,88 64,-14" fill="#3b82f6"/>
      <polygon points="128,-50 128,52 64,88 64,-14" fill="#2563eb"/>
    </g>
  </g>

  <g transform="translate(640,672)">
    <rect x="-250" y="-24" width="500" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · ลากเพื่อหมุน · จับคู่รูปคลี่</text>
  </g>
</svg>
