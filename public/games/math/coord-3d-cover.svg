<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75"/><stop offset="0.55" stop-color="#0e4a5e"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="0.4" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.07" text-anchor="middle" dominant-baseline="middle">📍</text>
  <text x="1110" y="170" font-size="180" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🧊</text>

  <g transform="translate(640,112)">
    <rect x="-220" y="-26" width="440" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#cffafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6 · 3D</text>
  </g>
  <text x="640" y="272" font-size="118" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">พิกัด 3 มิติ</text>
  <text x="640" y="352" font-size="33" font-weight="700" fill="#a5f3fc" text-anchor="middle" dominant-baseline="middle">อ่านพิกัด (x, y, z) บนแกน X · Y · Z</text>

  <!-- แกน 3 มิติ isometric + จุดเป้าหมาย -->
  <g transform="translate(490,560)" stroke-linejoin="round" stroke-linecap="round">
    <!-- พื้นตาราง XZ -->
    <g stroke="#155e75" stroke-width="2" opacity="0.55" fill="none">
      <polygon points="0,0 300,0 220,-130 -80,-130" fill="#0e7490" opacity="0.25"/>
      <line x1="-80" y1="-130" x2="220" y2="-130"/><line x1="-53" y1="-87" x2="247" y2="-87"/><line x1="-27" y1="-43" x2="273" y2="-43"/>
      <line x1="0" y1="0" x2="-80" y2="-130"/><line x1="100" y1="0" x2="20" y2="-130"/><line x1="200" y1="0" x2="120" y2="-130"/><line x1="300" y1="0" x2="220" y2="-130"/>
    </g>
    <!-- แกน X (แดง) -->
    <line x1="0" y1="0" x2="320" y2="0" stroke="#f87171" stroke-width="6"/>
    <polygon points="320,0 300,-9 300,9" fill="#f87171"/>
    <text x="334" y="6" font-size="34" font-weight="800" fill="#fca5a5">X</text>
    <!-- แกน Z (เขียว) ลึก -->
    <line x1="0" y1="0" x2="-104" y2="-170" stroke="#4ade80" stroke-width="6"/>
    <polygon points="-104,-170 -88,-156 -110,-150" fill="#4ade80"/>
    <text x="-128" y="-176" font-size="34" font-weight="800" fill="#86efac">Z</text>
    <!-- แกน Y (เหลือง) ขึ้น -->
    <line x1="0" y1="0" x2="0" y2="-300" stroke="#fbbf24" stroke-width="6"/>
    <polygon points="0,-300 -9,-280 9,-280" fill="#fbbf24"/>
    <text x="-10" y="-318" font-size="34" font-weight="800" fill="#fcd34d">Y</text>

    <!-- จุด (2, 3, 1) -->
    <g transform="translate(160,-180)">
      <line x1="0" y1="0" x2="0" y2="123" stroke="#FFD700" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
      <circle cx="0" cy="0" r="22" fill="url(#pt)" stroke="#0f172a" stroke-width="3" filter="url(#sh)"/>
      <g transform="translate(28,-30)">
        <rect x="0" y="-26" width="156" height="50" rx="14" fill="#0f172a" opacity="0.85"/>
        <text x="78" y="2" font-size="30" font-weight="800" fill="#FFD700" text-anchor="middle" dominant-baseline="middle">(2, 3, 1)</text>
      </g>
    </g>
  </g>

  <g transform="translate(640,672)">
    <rect x="-270" y="-24" width="540" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เกม 3 มิติ (Three.js) · ลากเพื่อหมุน · อ่าน/เลือกพิกัด (MCQ)</text>
  </g>
</svg>
