<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/angle-media.html"><meta name="curriculum-indicators" content="ค 2.2 ป.4/1, ค 2.2 ป.4/2"><title>ใบงานมุม ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.4" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.4" rel="stylesheet"></head><body>
<header class="toolbar"><h1>📐 ใบงานมุม</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="classify">จำแนกชนิดมุม</option><option value="measure">วัด/อ่านค่า</option><option value="apply">ประยุกต์ใช้</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="10">10 ข้อ</option><option value="5">5 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.4"></script><script>
const ANGLE_ITEMS=[
 {type:'classify',prompt:'จำแนกชนิดมุม',deg:35,answer:'มุมแหลม (< 90°)'},
 {type:'classify',prompt:'จำแนกชนิดมุม',deg:90,answer:'มุมฉาก (= 90°)'},
 {type:'classify',prompt:'จำแนกชนิดมุม',deg:110,answer:'มุมป้าน (> 90° แต่ < 180°)'},
 {type:'classify',prompt:'จำแนกชนิดมุม',deg:180,answer:'มุมตรง (= 180°)'},
 {type:'measure',prompt:'อ่านขนาดมุมจากโพรแทรกเตอร์',deg:45,answer:'45°'},
 {type:'measure',prompt:'มุมนี้มีขนาดเท่าไร',deg:120,answer:'120°'},
 {type:'measure',prompt:'มุมที่โคจรเคลื่อนที่จาก 0° ไปถึงเส้นนี้',deg:75,answer:'75°'},
 {type:'apply',prompt:'มุมใดเป็นมุมฉากในห้องเรียน',deg:90,answer:'มุมหน้าต่าง/มุมโต๊ะ'},
 {type:'apply',prompt:'ถ้ามุม A = 30° และมุม B = 60° รวมเป็นมุมฉากหรือไม่',deg:90,answer:'ใช่ 30°+60°=90°'},
 {type:'apply',prompt:'มุม 95° ควรจำแนกเป็น',deg:95,answer:'มุมป้าน'},
 {type:'apply',prompt:'เขียนเหตุผลว่าทำไม 89° จึงเป็นมุมแหลม',deg:89,answer:'เพราะน้อยกว่า 90°'},
 {type:'apply',prompt:'มุมสามเหลี่ยมหนึ่งมุม 40° อีกมุม 50° มุมที่สามเท่าไร',deg:90,answer:'90° (180°−40°−50°)'}
];
window.WORKSHEET_CONFIG={icon:'📐',title:'ใบงานมุม',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'มุม',sourceMediaUrl:'/games/math/angle-media.html',indicators:['ค 2.2 ป.4/1','ค 2.2 ป.4/2'],directions:'จำแนกมุมแหลม ฉาก ป้าน อ่านค่า และใช้เหตุผล',getItems(topic){return topic==='mixed'?ANGLE_ITEMS:ANGLE_ITEMS.filter(i=>i.type===topic);},buildAngleWork(item){if(item.type==='classify'){const d=item.deg;if(d<90)return{line1:''+d+'° < 90° → มุมแหลม',line2:item.answer};if(d===90)return{line1:d+'° = 90° → มุมฉาก',line2:item.answer};if(d<180)return{line1:d+'° > 90° และ < 180° → มุมป้าน',line2:item.answer};return{line1:d+'° = 180° → มุมตรง',line2:item.answer};}if(item.type==='measure')return{line1:'อ่านจากโพรแทรกเตอร์ที่ '+item.deg+'°',line2:'ตอบ: '+item.answer};return{line1:'ใช้ความรู้มุม '+item.deg+'°',line2:item.answer};},renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;const w=this.buildAngleWork(item);return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="classify-grid"><div class="classify-box">มุม '+item.deg+'°</div><div class="classify-box">แหลม / ฉาก / ป้าน / ตรง</div></div><div>ลงเหตุผล</div></div><div class="q-work-block"><div class="calc-line"><span class="work-fill">'+e(w.line1)+'</span></div><div class="calc-line"><span class="work-fill">'+e(w.line2)+'</span></div></div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.175.4"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.4"></script></body></html>
