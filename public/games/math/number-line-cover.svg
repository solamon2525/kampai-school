<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="0.55" stop-color="#1e40af"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.30"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">📏</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎯</text>

  <g transform="translate(640,116)">
    <rect x="-190" y="-26" width="380" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#dbeafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6</text>
  </g>
  <text x="640" y="282" font-size="116" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">เส้นจำนวนแม่นเป้า</text>
  <text x="640" y="368" font-size="36" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">ลากหมุดให้ตรงค่าเป้า — ยิ่งแม่น ยิ่งได้คะแนน</text>

  <!-- number line motif -->
  <g transform="translate(640,512)">
    <rect x="-470" y="-5" width="940" height="10" rx="5" fill="rgba(255,255,255,0.85)"/>
    <rect x="-470" y="-22" width="6" height="44" rx="3" fill="#fff"/>
    <rect x="464" y="-22" width="6" height="44" rx="3" fill="#fff"/>
    <text x="-470" y="58" font-size="26" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="467" y="58" font-size="26" fill="#cbd5e1" text-anchor="middle">10</text>
    <!-- เป้า (เขียว) -->
    <rect x="143" y="-30" width="6" height="60" rx="3" fill="#4ade80"/>
    <text x="146" y="-44" font-size="24" fill="#86efac" text-anchor="middle" font-weight="700">3.7</text>
    <!-- หมุด -->
    <circle cx="120" cy="0" r="26" fill="url(#gold)" stroke="#fff" stroke-width="5"/>
  </g>
  <g transform="translate(640,642)">
    <rect x="-230" y="-24" width="460" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">ทศนิยม · เศษส่วน · จำนวนใหญ่ · จำนวนลบ · แข่งสด</text>
  </g>
</svg>
