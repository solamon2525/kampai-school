<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#0c4a6e"/><stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">📏</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">⚖️</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · คณิตศาสตร์ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">วัดและเปรียบเทียบ</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">ฝึกลากทาบไม้บรรทัด ชั่งน้ำหนักตราชั่ง อ่านปริมาตรกระบอกตวง</text>

  <!-- Interactive ruler, scale, beaker icons -->
  <g transform="translate(640,515)">
    <!-- Ruler representation -->
    <rect x="-240" y="-20" width="180" height="40" rx="4" fill="rgba(253, 224, 71, 0.9)" stroke="#eab308" stroke-width="2"/>
    <line x1="-220" y1="-20" x2="-220" y2="-5" stroke="#0f172a" stroke-width="2"/>
    <line x1="-200" y1="-20" x2="-200" y2="-10" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="-180" y1="-20" x2="-180" y2="-5" stroke="#0f172a" stroke-width="2"/>
    <line x1="-160" y1="-20" x2="-160" y2="-10" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="-140" y1="-20" x2="-140" y2="-5" stroke="#0f172a" stroke-width="2"/>
    <line x1="-120" y1="-20" x2="-120" y2="-10" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="-100" y1="-20" x2="-100" y2="-5" stroke="#0f172a" stroke-width="2"/>
    <line x1="-80" y1="-20" x2="-80" y2="-10" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Scale balance representation -->
    <circle cx="0" cy="0" r="44" fill="#f8fafc" stroke="#38bdf8" stroke-width="6" filter="url(#sh)"/>
    <line x1="0" y1="0" x2="25" y2="-25" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#1e293b"/>

    <!-- Graduated cylinder representation -->
    <rect x="150" y="-35" width="45" height="70" fill="rgba(236, 72, 153, 0.75)" rx="2"/>
    <path d="M 145,-45 L 145,35 L 200,35 L 200,-45" fill="none" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="145" y1="-15" x2="160" y2="-15" stroke="#ffffff" stroke-width="2"/>
    <line x1="145" y1="10" x2="160" y2="10" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g transform="translate(640,652)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#0ea5e9" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#bae6fd" text-anchor="middle" dominant-baseline="middle">ความยาว (เซนติเมตร) · น้ำหนัก (กิโลกรัม) · ปริมาตร (มิลลิลิตร)</text>
  </g>
</svg>
