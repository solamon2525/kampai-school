<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/fraction-pieces.html"><meta name="curriculum-indicators" content="ค 1.1 ป.4/3, ค 1.1 ป.4/4"><title>ใบงานเศษส่วน ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.14" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.14" rel="stylesheet">
<style>
.frac-board{display:flex;gap:3mm;align-items:center;margin:1mm 0;flex-wrap:wrap}
.frac-bar{display:flex;border:1.5px solid var(--ws-ink);border-radius:3px;overflow:hidden;height:8mm;min-width:28mm}
.frac-bar i{flex:1;border-right:1px solid var(--ws-line);background:transparent}.frac-bar i:last-child{border-right:0}.frac-bar i.on{background:var(--ws-accent)}
.frac-sym{font-size:13pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill,.q.reveal-answer .work-fill{color:var(--ws-danger)}
.count-5 .frac-bar{height:10mm}.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>🍰 ใบงานเศษส่วน</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="shade">แทนค่าเศษส่วน</option><option value="compare">เปรียบเทียบ</option><option value="equivalent">เท่ากัน</option><option value="add">บวกเศษส่วน</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.14"></script><script>
function parseFrac(s){const m=String(s).match(/(\d+)\s*\/\s*(\d+)/);return m?{n:+m[1],d:+m[2]}:null;}
function bar(n,d){return '<div class="frac-bar" aria-hidden="true">'+Array.from({length:d},(_,i)=>'<i class="'+(i<n?'on':'')+'"></i>').join('')+'</div>';}
const FRACTION_ITEMS=[
 {type:'shade',prompt:'เศษส่วนใดแทนแท่งที่ทึบ 2 จาก 4 ช่อง',frac:'2/4',answer:'2/4 หรือ 1/2',s1:'ทึบ 2 จาก 4',s2:'เศษ/ส่วน = 2/4',s3:'2/4 = 1/2'},
 {type:'shade',prompt:'เขียนเศษส่วนที่แทน 3 ชิ้นจาก 8 ชิ้น',frac:'3/8',answer:'3/8',s1:'ทึบ 3',s2:'เต็ม 8',s3:'3/8'},
 {type:'shade',prompt:'ถ้าเต็ม 1 แผ่น มี 6 ช่อง ทึบ 1 ช่อง คือ',frac:'1/6',answer:'1/6',s1:'ทึบ 1',s2:'เต็ม 6',s3:'1/6'},
 {type:'compare',prompt:'ใส่ > < = : 3/4 ___ 2/4',frac:'3/4 vs 2/4',answer:'>',s1:'ส่วนเท่ากัน',s2:'เทียบเศษ 3 กับ 2',s3:'>'},
 {type:'compare',prompt:'เศษส่วนใดมากกว่า 5/8 หรือ 3/8',frac:'5/8 vs 3/8',answer:'5/8',s1:'ส่วนเท่า = 8',s2:'5 > 3',s3:'5/8'},
 {type:'compare',prompt:'เรียงจากน้อยไปมาก: 1/2 , 1/4 , 3/4',frac:'1/2 · 1/4 · 3/4',answer:'1/4 < 1/2 < 3/4',s1:'ดูแถบแต่ละค่า',s2:'เรียงขนาดชิ้น',s3:'1/4 < 1/2 < 3/4'},
 {type:'equivalent',prompt:'เศษส่วนใดเท่ากับ 1/2',frac:'2/4',answer:'2/4 = 1/2',s1:'ขยาย 1/2 ×2',s2:'ได้ 2/4',s3:'เท่ากัน'},
 {type:'equivalent',prompt:'3/6 เท่ากับเศษส่วนใด',frac:'3/6',answer:'1/2',s1:'หารทั้งคู่ด้วย 3',s2:'3÷3=1 · 6÷3=2',s3:'1/2'},
 {type:'add',prompt:'1/4 + 1/4 =',frac:'1/4+1/4',answer:'2/4 = 1/2',s1:'ส่วนเท่า → บวกเศษ',s2:'1+1=2',s3:'2/4 = 1/2'},
 {type:'add',prompt:'1/8 + 3/8 =',frac:'1/8+3/8',answer:'4/8 = 1/2',s1:'ส่วนเท่า',s2:'1+3=4',s3:'4/8 = 1/2'},
 {type:'add',prompt:'2/5 + 1/5 =',frac:'2/5+1/5',answer:'3/5',s1:'ส่วนเท่า',s2:'2+1=3',s3:'3/5'},
 {type:'add',prompt:'1/3 + 1/3 =',frac:'1/3+1/3',answer:'2/3',s1:'ส่วนเท่า',s2:'1+1=2',s3:'2/3'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'fraction-pieces',icon:'🍰',title:'ใบงานเศษส่วน',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'เศษส่วนชิ้น',
  sourceMediaUrl:'/games/math/fraction-pieces.html',indicators:['ค 1.1 ป.4/3','ค 1.1 ป.4/4'],
  directions:'ดูแถบเศษส่วน · เปรียบเทียบ · ย่อขยาย · บวกส่วนเท่า',
  getItems(topic){return topic==='mixed'?FRACTION_ITEMS:FRACTION_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const parts=String(item.frac).split(/\s*(?:vs|\+|·)\s*/);
    let board='<div class="frac-board">';
    parts.forEach((p,idx)=>{
      const f=parseFrac(p);
      if(!f)return;
      if(idx)board+='<span class="frac-sym">'+(item.type==='add'?'+':item.type==='compare'?'vs':'=')+'</span>';
      board+='<span class="frac-sym">'+e(f.n+'/'+f.d)+'</span>'+bar(f.n,f.d);
    });
    board+='</div>';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'+board
      +'<div class="q-context">เศษส่วน: '+e(item.frac)+'</div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดู</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 คิด</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.14"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.14"></script></body></html>
