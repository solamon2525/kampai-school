<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math-Man Co-op: ศึกวงกตคณิตศาสตร์คู่หูกู้โลก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen w-screen flex flex-col items-center justify-start p-1 sm:p-2 bg-[#0f172a] text-white overflow-hidden select-none touch-action-none">

    <!-- Header & UI -->
    <div id="header-ui" class="w-full flex justify-between items-center mb-1 px-1 sm:px-2 mt-1">
        <div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-sky-400 leading-none">
                Math-Man Co-op
            </h1>
            <p id="controls-desc" class="text-slate-400 text-[10px] sm:text-xs mt-1">P1 (🟡): ลูกศร | P2 (🔵): WASD</p>
        </div>
        
        <div id="equationBox" class="bg-slate-800 border-2 border-sky-400 rounded-lg px-2 sm:px-6 py-1.5 text-center shadow-lg shadow-sky-500/30 flex-1 mx-2 sm:mx-6 relative max-w-md transition-all">
            <div class="text-[10px] sm:text-xs text-sky-300 leading-tight mb-1 sm:mb-2">จงหาคำตอบของสมการนี้</div>
            
            <div id="equationDisplay" class="font-arcade text-[10px] sm:text-base text-white leading-none pb-1 sm:pb-2 mt-0.5 tracking-wider">รอผู้เล่น...</div>
            
            <!-- Combo Badge -->
            <div id="comboDisplay" class="absolute -top-3 -right-2 sm:-right-6 bg-slate-900 border-2 border-orange-500 text-orange-400 font-extrabold text-[10px] sm:text-sm px-2 py-0.5 rounded-full hidden text-shadow-fire transform rotate-12 z-20 shadow-lg shadow-orange-500/50">
                🔥 Combo x3!
            </div>

            <!-- Timer Bar -->
            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden mt-0.5">
                <div id="timerBar" class="bg-green-400 h-full w-full"></div>
            </div>
        </div>

        <div class="text-right">
            <div class="text-sm sm:text-lg font-bold text-yellow-400 leading-none mb-1 flex justify-end gap-1">
                คะแนน: <div id="scoreDisplay" class="inline-block w-8 text-right">0</div>
            </div>
            <div class="flex flex-col sm:flex-row gap-1 sm:gap-2 justify-end">
                <div id="p1LivesContainer" class="text-[10px] sm:text-xs font-bold text-yellow-400 leading-none tracking-widest bg-slate-800 px-1.5 py-1 rounded border border-yellow-500/50">
                    P1 <span id="p1LivesDisplay">❤️❤️❤️</span>
                </div>
                <div id="p2LivesContainer" class="text-[10px] sm:text-xs font-bold text-sky-400 leading-none tracking-widest bg-slate-800 px-1.5 py-1 rounded border border-sky-500/50">
                    P2 <span id="p2LivesDisplay">❤️❤️❤️</span>
                </div>
            </div>
        </div>
    </div>

    <!-- BGM Control Button -->
    <button id="music-btn" class="fixed top-20 left-2 sm:left-4 bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-white rounded-full w-10 h-10 flex items-center justify-center text-sm z-30 shadow-md" onclick="toggleMusic()">
        🔊
    </button>

    <!-- Game Area -->
    <div class="relative w-full flex-1 flex items-center justify-center">
        <canvas id="gameCanvas"></canvas>

        <!-- Blocker / Start Screen -->
        <div id="blocker" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center transition-opacity duration-300 z-50 p-6 text-center">
            <h2 class="text-4xl sm:text-5xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-400 to-sky-400 drop-shadow-lg">
                MATH-MAN CO-OP
            </h2>
            <p class="text-slate-400 mb-6 text-sm sm:text-base">ศึกวงกตคณิตศาสตร์คู่หูกู้โลก</p>
            
            <!-- Player Avatar Chip -->
            <div id="player-chip" style="display: none;" class="mb-4"></div>

            <!-- Student Statistics -->
            <div id="my-stats" class="flex gap-4 mb-6">
                <div class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2 text-center min-w-[110px]">
                    <span class="block text-2xl font-bold text-yellow-400" id="ms-best">0</span>
                    <span class="text-[10px] text-slate-500">คะแนนสูงสุด</span>
                </div>
                <div class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-2 text-center min-w-[110px]">
                    <span class="block text-2xl font-bold text-sky-400" id="ms-plays">0</span>
                    <span class="text-[10px] text-slate-500">จำนวนครั้งที่เล่น</span>
                </div>
            </div>

            <!-- Leaderboard -->
            <div class="w-full max-w-sm bg-slate-900/80 border border-slate-800 rounded-xl p-4 mb-6 shadow-inner">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">🏆 อันดับคะแนนประดับวงกต</h3>
                <ul id="score-list" class="space-y-1.5 text-xs text-left">
                    <li class="text-center text-slate-500 italic">กำลังโหลดอันดับผู้พิทักษ์...</li>
                </ul>
            </div>

            <!-- Menu buttons -->
            <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                <button onclick="startGame('single')" class="px-5 py-3 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-white font-bold text-sm sm:text-base rounded-xl shadow-lg shadow-yellow-500/20 transform active:scale-95 transition-all">
                    👤 เล่นคนเดียว
                </button>
                <button onclick="startGame('coop')" class="px-5 py-3 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-sm sm:text-base rounded-xl shadow-lg shadow-sky-500/20 transform active:scale-95 transition-all">
                    👥 เล่นสองคน (Co-op)
                </button>
                <button onclick="vs.openMenu()" class="px-5 py-3 bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-400 hover:to-red-500 text-white font-bold text-sm sm:text-base rounded-xl shadow-lg shadow-orange-500/20 transform active:scale-95 transition-all">
                    ⚔️ แข่ง 2 คน
                </button>
            </div>
        </div>

        <!-- Dialog Box for Game Over / Finish -->
        <div id="msg-box" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900/95 border-2 border-sky-500/80 p-6 sm:p-8 rounded-2xl text-center shadow-2xl shadow-sky-500/20 max-w-sm w-11/12 hidden z-40 backdrop-blur-md">
            <h2 id="msg-title" class="text-3xl font-black mb-2 text-sky-400">จบเกม!</h2>
            <div id="msg-desc" class="text-sm sm:text-base text-slate-300 space-y-2 mb-6"></div>

            <div class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-3 mb-6">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🏆 ตารางคะแนนการประลอง</h3>
                <ul id="score-list-gameover" class="space-y-1 text-xs text-left">
                    <li class="text-center text-slate-600 italic">—</li>
                </ul>
            </div>

            <div class="flex gap-3 justify-center">
                <button onclick="location.reload()" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl text-sm transition-all shadow-md shadow-sky-600/20 active:translate-y-1">
                    🔄 เล่นอีกครั้ง
                </button>
                <button onclick="KAMPAI.goHome()" class="px-6 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-sm transition-all shadow-md active:translate-y-1">
                    🎮 กลับหน้าหลัก
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ KAMPAI SDK ═══ -->
    <script src="/games/kampai-sdk.js"></script>
    <script>
    window.KAMPAI = window.KAMPAI || { 
        isEmbed: false, isTouch: false, ready: true, student: null, stats: null, leaderboard: [], 
        onReady: function(cb) { cb(this); }, setSlug: function() { return this; }, 
        submitScore: function() { return false; }, goHome: function() { location.href = '/'; }, 
        sound: { 
            correct: function() {}, wrong: function() {}, timeUp: function() {}, gameOver: function() {}, 
            speak: function() {}, stopSpeak: function() {}, defaultBgm: function() {}, 
            bgmStart: function() {}, bgmStop: function() {}, unlock: function() {} 
        } 
    };
    </script>
    <script src="/games/kampai-match.js"></script>
    <script>
    window.KampaiMatch = window.KampaiMatch || { 
        create: function() { 
            return { available: false, openMenu: function() {}, report: function() {}, finish: function() {}, leave: function() {} }; 
        } 
    };
    </script>
    <script src="/games/kampai-versus.js"></script>
    <script>
    window.KampaiVersus = window.KampaiVersus || { 
        create: function() { 
            return { available: false, openMenu: function() { alert('ระบบประลอง 2 คนเล่นผ่านพอร์ทัลเท่านั้น'); } }; 
        } 
    };
    </script>

    <!-- Game Scripts -->
    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
