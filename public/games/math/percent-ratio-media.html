  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#1d4ed8;--line:#bfdbfe;--muted:#475569;--ink:#0f172a;--ok:#15803d;--bad:#b91c1c}

    .btn{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px}
    .btn:active{transform:scale(.97)}
    .btn:focus-visible,.seg button:focus-visible,.pick button:focus-visible,.choice:focus-visible,.ke-bucket-btn:focus-visible,.ke-btn:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}

    .btn-primary{background:var(--deep);color:#fff}
    .btn-ghost{background:#fff;color:var(--deep);border:2px solid var(--line)}

    .shell.mode-practice .learn,.shell.mode-classify .learn{display:none}

    .choice.ok{background:#dcfce7;border-color:#16a34a;color:#14532d}.choice.no{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
    .choice:disabled{cursor:default}
    .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .pick button{font-family:inherit;font-weight:800;font-size:1rem;min-height:44px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--deep)}
    .pick button.on{background:var(--deep);color:#fff}
    .box{background:#f8fafc;border:2px solid var(--line);border-radius:16px;padding:18px;font-weight:700;line-height:1.7;font-size:1.1rem}
    .box h2{color:var(--deep);margin-bottom:8px;font-size:1.45rem}
    .emo{font-size:3.2rem;margin-bottom:8px}

    .speech-status{font-size:.85rem;font-weight:700;color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 12px;display:none;margin-top:10px}
    .speech-status.show{display:block}
    .ke-classify-card{background:#f8fafc;border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
    .ke-classify-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--deep);font-size:.95rem}
    .ke-classify-item{text-align:center;padding:18px 14px;background:#eff6ff;border:2px dashed #60a5fa;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
    .ke-item-icon{font-size:clamp(44px,11vw,68px);line-height:1.05}
    .ke-item-label{font-size:clamp(1.25rem,3vw,1.65rem);font-weight:800;color:var(--deep);line-height:1.35}
    .ke-item-sub{font-size:.92rem;font-weight:600;color:var(--muted)}
    .ke-buckets{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:580px){.ke-buckets{grid-template-columns:repeat(3,1fr)}}
    .ke-bucket-btn{font-family:inherit;font-weight:800;font-size:.95rem;min-height:54px;padding:10px 12px;border-radius:14px;border:2px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .12s,border-color .12s,background .12s}
    .ke-bucket-btn[data-bucket-id="eq-25"]{border-color:#d97706;background:#fffbeb;color:#78350f}
    .ke-bucket-btn[data-bucket-id="eq-50"]{border-color:#2563eb;background:#eff6ff;color:#1e3a8a}
    .ke-bucket-btn[data-bucket-id="eq-75"]{border-color:#16a34a;background:#f0fdf4;color:#14532d}
    .ke-bucket-btn.is-correct{outline:3px solid #15803d;background:#dcfce7;color:#14532d}
    .ke-bucket-btn.is-wrong{opacity:.65;text-decoration:line-through}
    .ke-bucket-btn:disabled{cursor:default}
    .ke-classify-feedback{padding:12px 14px;border-radius:12px;font-weight:700;line-height:1.45;background:#fff;border:1.5px solid #cbd5e1;color:var(--ink)}
    .ke-classify-feedback.is-good{background:#dcfce7;border-color:#16a34a;color:#14532d}
    .ke-classify-feedback.is-learn{background:#fef3c7;border-color:#d97706;color:#78350f}
    .ke-btn{font-family:inherit;font-weight:800;font-size:.95rem;min-height:44px;padding:10px 16px;border-radius:12px;border:none;background:var(--deep);color:#fff;cursor:pointer;align-items:center;justify-content:center;gap:6px;align-self:center}
    .ke-classify-summary{text-align:center;padding:24px 16px;background:#eff6ff;border:2px solid var(--line);border-radius:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
    .ke-classify-summary h3{color:var(--deep);font-size:1.3rem;font-weight:800}
    @media(max-width:600px){body{padding:0}.shell{border-radius:0;min-height:100vh}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}
      .btn:active{transform:none}
    }
  </style>
</head><body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
    <h1>📊 ร้อยละ · อัตราส่วน ป.6</h1>
    <span class="badge">ป.6 · คณิตศาสตร์</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
      <button type="button" data-mode="classify">🗂️ แยกค่าร้อยละ</button>
    </span>
    <p class="hint" id="hintText">สื่อ ป.6 — ไม่เก็บคะแนน</p>
    <button type="button" class="btn btn-ghost" id="btnFs">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/math/percent-ratio-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="learn" id="learn">
      <div class="pick" id="pick"></div>
      <div class="box" id="box"></div>
      <div class="practice-bar" style="margin-top:12px">
        <span class="practice-note">แตะหัวข้อด้านบนเพื่ออ่าน หรือกดฟังเสียง</span>
        <button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>
      </div>
      <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
    </div>
    <div class="practice" id="practice">
      <div class="practice-bar">
        <span class="practice-note">เลือกคำตอบที่ถูกต้อง (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
        <button type="button" class="btn btn-ghost" id="btnSpeakPractice">🔊 ฟังโจทย์</button>
      </div>
      <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
      <p style="font-weight:800;font-size:1.15rem;color:var(--deep)" id="prQ"></p>
      <div id="prChoices" style="display:grid;gap:8px"></div>
      <p id="prFb" style="font-weight:800;min-height:24px"></p>
      <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
    </div>
    <div class="classify" id="classify">
      <div class="practice-bar">
        <span class="practice-note">แตะเลือกกลุ่มที่สมมูลกัน หรือกดปุ่มตัวเลข 1–3 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
        <button type="button" class="btn btn-ghost" id="btnSpeakClassify">🔊 ฟังโจทย์</button>
      </div>
      <div class="speech-status" id="speechStatusClassify" role="status" aria-live="polite"></div>
      <div id="classifyEngineRoot"></div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อ ป.6 · Phase 13 · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG='percent-ratio-media';
if(window.KAMPAI){KAMPAI.setSlug(MEDIA_SLUG);if(KAMPAI.sound&&KAMPAI.sound.mountToggles)try{KAMPAI.sound.mountToggles();}catch(_){}}
const ITEMS=[{"emoji":"⚖️","name":"อัตราส่วน","body":"อัตราส่วนเปรียบเทียบปริมาณ 2 ปริมาณ เช่น นักเรียนชาย:หญิง = 3:2","tip":"เขียน a:b หรือ a/b","ex":"ตัวอย่าง: ไข่ 5 ฟองต่อแป้ง 2 ถ้วย → 5:2","q":"อัตราส่วนใช้เปรียบเทียบกี่ปริมาณเป็นหลัก?","a":"2 ปริมาณ"},{"emoji":"🔁","name":"อัตราส่วนเท่ากัน","body":"คูณหรือหารทั้งสองข้างด้วยจำนวนเดียวกันได้อัตราส่วนเท่ากัน","tip":"2:3 = 4:6 = 6:9","ex":"ตรวจ: 2×3=6 และ 3×3=9 → 2:3 = 6:9","q":"2:3 เท่ากับข้อใด?","a":"4:6"},{"emoji":"%","name":"ร้อยละคืออะไร","body":"ร้อยละ (เปอร์เซ็นต์) คือส่วนของร้อย เช่น 25% = 25 ใน 100","tip":"เปลี่ยนเศษส่วนเป็น % โดยทำให้ส่วนเป็น 100","ex":"1/4 = 25/100 = 25%","q":"25% หมายถึงกี่ส่วนในร้อย?","a":"25"},{"emoji":"🧮","name":"หาค่าของร้อยละ","body":"หา a% ของ N → (a/100)×N","tip":"20% ของ 50 = 10","ex":"ลดราคา 10% จาก 200 บาท = ลด 20 บาท","q":"20% ของ 50 เท่ากับเท่าใด?","a":"10"},{"emoji":"📝","name":"โจทย์อัตราส่วน","body":"ตั้งอัตราส่วนจากข้อความ แล้วหาค่าที่หายไปด้วยอัตราส่วนเท่ากัน","tip":"เขียนสัดส่วน a/b = c/d","ex":"น้ำตาล:แป้ง = 2:5 ถ้าน้ำตาล 6 ช้อน แป้งกี่ช้อน? → 15","q":"น้ำตาล:แป้ง=2:5 น้ำตาล 6 → แป้ง?","a":"15"},{"emoji":"📈","name":"โจทย์ร้อยละ","body":"อ่านโจทย์หาส่วนเต็ม ส่วนที่สนใจ หรือร้อยละที่หายไป","tip":"ระบุว่าอะไรคือ 100%","ex":"สอบได้ 36 จาก 40 → (36/40)×100 = 90%","q":"ได้ 36 จาก 40 คิดเป็นกี่เปอร์เซ็นต์?","a":"90%"}];

const CLASSIFY_BUCKETS=[
  {id:'eq-25',label:'เท่ากับ 25% (1 : 4 หรือ 1/4)',icon:'¼'},
  {id:'eq-50',label:'เท่ากับ 50% (1 : 2 หรือ 1/2)',icon:'½'},
  {id:'eq-75',label:'เท่ากับ 75% (3 : 4 หรือ 3/4)',icon:'¾'}
];

const CLASSIFY_ITEMS=[
  {id:'pr-25-frac',icon:'🍰',label:'1/4',sub:'เศษส่วนของจำนวนเต็ม',bucketId:'eq-25',reason:'(1 ÷ 4) × 100 = 25%'},
  {id:'pr-25-ratio',icon:'⚖️',label:'2 : 8',sub:'อัตราส่วนที่ย่อได้',bucketId:'eq-25',reason:'หารทั้งสองข้างด้วย 2 ได้ 1 : 4 เท่ากับ 25%'},
  {id:'pr-25-per',icon:'💯',label:'25 ใน 100',sub:'ความหมายของร้อยละ',bucketId:'eq-25',reason:'25 ส่วนจาก 100 ส่วน เท่ากับ 25%'},
  {id:'pr-25-sale',icon:'🏷️',label:'ลด 50 จากราคา 200 บาท',sub:'โจทย์ร้อยละในชีวิตประจำวัน',bucketId:'eq-25',reason:'(50 ÷ 200) × 100 = 25%'},
  {id:'pr-50-frac',icon:'🍰',label:'1/2',sub:'เศษส่วนครึ่งหนึ่ง',bucketId:'eq-50',reason:'1 ใน 2 เท่ากับ 50 ใน 100 หรือ 50%'},
  {id:'pr-50-ratio',icon:'⚖️',label:'3 : 6',sub:'อัตราส่วนที่ย่อได้',bucketId:'eq-50',reason:'หารทั้งสองข้างด้วย 3 ได้ 1 : 2 เท่ากับ 50%'},
  {id:'pr-50-per',icon:'💯',label:'50 ใน 100',sub:'ความหมายของร้อยละ',bucketId:'eq-50',reason:'50 ส่วนจาก 100 ส่วน เท่ากับ 50%'},
  {id:'pr-50-score',icon:'📝',label:'สอบได้ 20 จาก 40 คะแนน',sub:'โจทย์ร้อยละ',bucketId:'eq-50',reason:'(20 ÷ 40) × 100 = 50%'},
  {id:'pr-75-frac',icon:'🍰',label:'3/4',sub:'สามในสี่ส่วน',bucketId:'eq-75',reason:'(3 ÷ 4) × 100 = 75%'},
  {id:'pr-75-ratio',icon:'⚖️',label:'6 : 8',sub:'อัตราส่วนที่ย่อได้',bucketId:'eq-75',reason:'หารทั้งสองข้างด้วย 2 ได้ 3 : 4 เท่ากับ 75%'},
  {id:'pr-75-per',icon:'💯',label:'75 ใน 100',sub:'ความหมายของร้อยละ',bucketId:'eq-75',reason:'75 ส่วนจาก 100 ส่วน เท่ากับ 75%'},
  {id:'pr-75-score',icon:'📈',label:'ทำถูก 15 จาก 20 ข้อ',sub:'โจทย์ร้อยละ',bucketId:'eq-75',reason:'(15 ÷ 20) × 100 = 75%'}
];

let cur=ITEMS[0];
let mode='learn';
let currentPr=null;
let classifySession=null;

function speakText(text,statusId){
  const clean=String(text||'').trim();
  if(!clean)return;
  const fallbackId=mode==='classify'?'speechStatusClassify':(mode==='practice'?'speechStatusPractice':'speechStatusLearn');
  const statusEl=document.getElementById(statusId||fallbackId);
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.speakSafe==='function'){
    const res=window.KampaiMediaLab.speakSafe(clean,{lang:'th-TH',rate:0.92});
    if(statusEl){
      if(res&&res.ok===false){
        statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }else{
        statusEl.textContent='';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try{
    if(window.KAMPAI?.sound?.speak){KAMPAI.sound.speak(clean,'th-TH',true);return;}
    if('speechSynthesis'in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='th-TH';u.rate=0.92;
      window.speechSynthesis.speak(u);
      return;
    }
  }catch(_){}
  if(statusEl){
    statusEl.textContent='อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
    statusEl.classList.add('show');
  }
}

function stopSpeech(){
  if(window.KampaiMediaLab&&typeof window.KampaiMediaLab.stopAllSpeech==='function'){
    window.KampaiMediaLab.stopAllSpeech();
  }else{
    try{window.KAMPAI?.sound?.stopSpeak?.();}catch(_){}
    try{window.speechSynthesis?.cancel?.();}catch(_){}
  }
}

function mountClassifyPractice(){
  if(!window.KampaiEngines||!window.KampaiEngines.ClassifyBucket)return;
  classifySession=window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot',{
    items:CLASSIFY_ITEMS,
    buckets:CLASSIFY_BUCKETS,
    mode:'media',
    roundSize:8,
    onAnswer:function(res){
      if(window.KAMPAI&&window.KAMPAI.sound){
        try{if(res.isCorrect)KAMPAI.sound.correct();else KAMPAI.sound.wrong();}catch(_){}
      }
    }
  });
}

function setMode(m){
  stopSpeech();
  mode=m==='practice'?'practice':(m==='classify'?'classify':'learn');
  const shell=document.getElementById('shell');
  shell.classList.toggle('mode-practice',mode==='practice');
  shell.classList.toggle('mode-classify',mode==='classify');
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));
  document.getElementById('hintText').textContent=
    mode==='learn'?'เลือกหัวข้อ · อ่านให้เข้าใจ':
    mode==='practice'?'ตอบคำถาม':
    'จำแนกอัตราส่วนและร้อยละที่สมมูลกัน — ไม่จับเวลา ไม่เก็บคะแนน';
  if(mode==='practice'){
    if(window.KampaiEngines?.ClassifyBucket?.cleanup)window.KampaiEngines.ClassifyBucket.cleanup();
    nextPr();
  }else if(mode==='classify'){
    mountClassifyPractice();
  }else if(window.KampaiEngines?.ClassifyBucket?.cleanup){
    window.KampaiEngines.ClassifyBucket.cleanup();
  }
}

function render(){
  document.getElementById('pick').innerHTML=ITEMS.map((x,i)=>'<button type="button" data-i="'+i+'" class="'+(x===cur?'on':'')+'">'+(x.emoji?x.emoji+' ':'')+x.name+'</button>').join('');
  document.getElementById('box').innerHTML=(cur.emoji?'<div class="emo">'+cur.emoji+'</div>':'')+'<h2>'+cur.name+'</h2><p>'+cur.body+'</p>'+(cur.tip?'<p style="margin-top:10px;color:var(--muted);font-size:1rem">💡 '+cur.tip+'</p>':'')+(cur.ex?'<div class="ex">'+cur.ex+'</div>':'');
}

document.getElementById('pick').onclick=e=>{
  const b=e.target.closest('[data-i]');if(!b)return;
  stopSpeech();
  cur=ITEMS[+b.dataset.i];
  render();
};

function nextPr(){
  const a=ITEMS[Math.floor(Math.random()*ITEMS.length)];
  currentPr=a;
  document.getElementById('prQ').textContent=a.q;
  document.getElementById('prFb').textContent='';
  const opts=new Set([a.a]);while(opts.size<4)opts.add(ITEMS[Math.floor(Math.random()*ITEMS.length)].a);
  const box=document.getElementById('prChoices');
  box.innerHTML=[...opts].sort(()=>Math.random()-0.5).map(o=>'<button type="button" class="choice">'+o+'</button>').join('');
  box.onclick=e=>{
    const b=e.target.closest('.choice');if(!b||b.disabled)return;
    const ok=b.textContent===a.a;
    b.classList.add(ok?'ok':'no');
    box.querySelectorAll('.choice').forEach(btn=>{
      btn.disabled=true;
      if(btn.textContent===a.a)btn.classList.add('ok');
    });
    document.getElementById('prFb').textContent=ok?'✅ เก่งมาก!':'เฉลย: '+a.a;
    document.getElementById('prFb').style.color=ok?'var(--ok)':'var(--bad)';
    if(window.KAMPAI?.sound)try{(ok?KAMPAI.sound.correct:KAMPAI.sound.wrong)();}catch(_){}
  };
}

document.getElementById('btnBack').onclick=()=>{stopSpeech();if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();};
document.getElementById('btnNext').onclick=nextPr;
document.getElementById('modeSeg').onclick=e=>{
  const b=e.target.closest('button[data-mode]');if(!b)return;
  setMode(b.dataset.mode);
};
document.getElementById('btnSpeakLearn').onclick=()=>{
  speakText(cur.name+' '+cur.body+(cur.ex?' '+cur.ex:''),'speechStatusLearn');
};
document.getElementById('btnSpeakPractice').onclick=()=>{
  speakText(currentPr?.q||document.getElementById('prQ').textContent,'speechStatusPractice');
};
document.getElementById('btnSpeakClassify').onclick=()=>{
  const item=classifySession?.currentItem?.();
  if(item){
    speakText(item.label+' มีค่าเท่ากับร้อยละใด','speechStatusClassify');
  }else{
    speakText('ฝึกจำแนกค่าร้อยละและอัตราส่วนสำเร็จแล้ว กดฝึกใหม่อีกครั้งได้','speechStatusClassify');
  }
};
document.getElementById('btnFs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();};

document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
window.addEventListener('pagehide',stopSpeech);

window.getState=()=>Object.freeze({
  slug:MEDIA_SLUG,
  mode:mode,
  selectedTopic:cur?cur.name:null,
  totalTopics:ITEMS.length,
  totalClassifyItems:CLASSIFY_ITEMS.length,
  bucketsCount:CLASSIFY_BUCKETS.length,
  classify:classifySession?classifySession.getState():null,
  reducedMotion:typeof window.matchMedia==='function'?Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches):false
});

render();setMode('learn');
</script>
</body></html>
