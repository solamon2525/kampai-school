<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/bar-chart-media.html"><meta name="curriculum-indicators" content="ค 3.1 ป.4/1"><title>ใบงานแผนภูมิแท่ง ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.181.0" rel="stylesheet">
<style>
.bar-board{display:flex;align-items:flex-end;gap:2.5mm;height:22mm;border-left:1.5px solid var(--ws-ink);border-bottom:1.5px solid var(--ws-ink);padding:0 2mm;margin:1.5mm 0}
.bar-board .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.5mm;height:100%}
.bar-board .col b{display:block;width:100%;max-width:8mm;background:var(--ws-accent);border-radius:2px 2px 0 0;min-height:1mm}
.bar-board .col span{font-size:6pt;font-weight:800;color:var(--ws-muted);text-align:center;line-height:1.1}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill,.q.reveal-answer .work-fill{color:var(--ws-danger)}
.count-5 .bar-board{height:28mm}.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>📊 ใบงานแผนภูมิแท่ง</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="read">อ่านค่า</option><option value="compare">เปรียบเทียบ</option><option value="total">หาผลรวม</option><option value="scale">กำหนดสเกล</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const BAR_ITEMS=[
{type:'read',labels:['มะม่วง','กล้วย','ส้ม'],values:[6,9,4],prompt:'ผลไม้ชนิดใดมีจำนวนมากที่สุด',answer:'กล้วย 9 ผล',s1:'อ่านค่าจากตาราง/แท่ง',s2:'9 มากสุด',s3:'กล้วย'},
{type:'read',labels:['แดง','ฟ้า','เขียว'],values:[8,5,7],prompt:'สีใดน้อยที่สุด',answer:'ฟ้า 5',s1:'เปรียบ 8,5,7',s2:'5 น้อยสุด',s3:'สีฟ้า'},
{type:'compare',labels:['จันทร์','อังคาร','พุธ'],values:[5,8,6],prompt:'อังคารมากกว่าจันทร์เท่าไร',answer:'3 (8−5)',s1:'อังคาร=8 จันทร์=5',s2:'8−5=3',s3:'มากกว่า 3'},
{type:'compare',labels:['A','B','C'],values:[12,10,14],prompt:'C มากกว่า B เท่าไร',answer:'4 (14−10)',s1:'C=14 B=10',s2:'14−10=4',s3:'ต่าง 4'},
{type:'total',labels:['ป.4/1','ป.4/2','ป.4/3'],values:[12,10,14],prompt:'รวมทั้งสามห้อง',answer:'36',s1:'12+10+14',s2:'=36',s3:'36 คน'},
{type:'total',labels:['ข้าว','นม','ไข่'],values:[10,6,8],prompt:'รวมทั้งสาม',answer:'24',s1:'10+6+8',s2:'=24',s3:'24'},
{type:'scale',labels:['A','B','C'],values:[4,6,10],prompt:'สเกลครั้งละ 2 แท่งสูง 10 หมายถึง',answer:'10 หน่วย',s1:'สเกล = 2 / ช่อง',s2:'ความสูงแท่ง = 10',s3:'10 หน่วย'},
{type:'scale',labels:['X','Y'],values:[3,5],prompt:'สเกล 1 อ่าน Y',answer:'5',s1:'สเกล 1 / ช่อง',s2:'Y สูง 5',s3:'5 หน่วย'},
{type:'read',labels:['Q1','Q2','Q3','Q4'],values:[15,12,18,9],prompt:'ไตรมาสน้อยสุด',answer:'Q4=9',s1:'อ่านค่าทั้งสี่',s2:'9 น้อยสุด',s3:'Q4'},
{type:'compare',labels:['เหนือ','กลาง','ใต้'],values:[7,11,8],prompt:'เรียงมาก→น้อย',answer:'กลาง 11 · ใต้ 8 · เหนือ 7',s1:'11>8>7',s2:'เรียงลำดับ',s3:'กลาง ใต้ เหนือ'},
{type:'total',labels:['A','B'],values:[25,17],prompt:'รวม A+B',answer:'42',s1:'25+17',s2:'=42',s3:'42'},
{type:'scale',labels:['P','Q'],values:[6,9],prompt:'แกนเริ่ม 0 สเกล 3 แท่ง Q=9',answer:'9 หน่วย',s1:'ดูแกนและสเกล',s2:'Q=9',s3:'9'}
];
function bars(labels,values){
  const max=Math.max(...values,1);
  return '<div class="bar-board" aria-hidden="true">'+labels.map((l,i)=>'<div class="col"><b style="height:'+Math.max(8,(values[i]/max)*100)+'%"></b><span>'+l+'</span></div>').join('')+'</div>';
}
window.WORKSHEET_CONFIG={
  worksheetKey:'bar-chart',icon:'📊',title:'ใบงานแผนภูมิแท่ง',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'แผนภูมิแท่ง',
  sourceMediaUrl:'/games/math/bar-chart-media.html',indicators:['ค 3.1 ป.4/1'],
  directions:'อ่านตาราง+แท่ง · เปรียบเทียบ · หาผลรวม · กำหนดสเกล',
  getItems(t){return t==='mixed'?BAR_ITEMS:BAR_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<table class="mini-table"><tr><th>รายการ</th><th>จำนวน</th></tr>'
      +item.labels.map((l,i)=>'<tr><td>'+e(l)+'</td><td>'+item.values[i]+'</td></tr>').join('')+'</table>'
      +bars(item.labels,item.values)
      +'<div class="scale-box">สเกล: ____________________</div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 อ่าน</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 คิด</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.181.0"></script></body></html>
