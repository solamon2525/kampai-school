<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Fredoka One','Kanit','Sarabun',sans-serif">
  <defs>
    <!-- Gold Gradient for retro title -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Shadow filter for retro pop-out look -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>

    <!-- Block shadow -->
    <filter id="blk-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Sky (Classic Mario Sky Blue) -->
  <rect width="1280" height="720" fill="#5c94fc"/>

  <!-- Fluffy Cloud 1 -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="150" cy="180" r="45"/>
    <circle cx="190" cy="160" r="55"/>
    <circle cx="240" cy="180" r="40"/>
    <rect x="150" y="180" width="90" height="45"/>
  </g>

  <!-- Fluffy Cloud 2 -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="1020" cy="140" r="35"/>
    <circle cx="1055" cy="120" r="45"/>
    <circle cx="1100" cy="140" r="30"/>
    <rect x="1020" y="140" width="80" height="35"/>
  </g>

  <!-- Darker Green Hills (Background) -->
  <path d="M-20 720 C100 480 300 480 420 720" fill="#008a00"/>
  <path d="M820 720 C960 420 1180 420 1300 720" fill="#008a00"/>
  
  <!-- Lighter Green Hills (Foreground) -->
  <path d="M220 720 C420 460 700 460 900 720" fill="#00a800"/>
  <path d="M-80 720 C20 520 220 520 320 720" fill="#00a800"/>
  <path d="M720 720 C880 500 1100 500 1200 720" fill="#00a800"/>

  <!-- 3 Grass platform lanes (Mario brick style) -->
  <!-- Lane 0 -->
  <g transform="translate(0, 420)">
    <rect x="0" y="0" width="1280" height="25" fill="#e45c10" stroke="#000000" stroke-width="4"/>
    <rect x="0" y="-8" width="1280" height="8" fill="#00a800" stroke="#000000" stroke-width="4"/>
    <line x1="160" y1="0" x2="160" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="320" y1="0" x2="320" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="480" y1="0" x2="480" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="640" y1="0" x2="640" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="800" y1="0" x2="800" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="960" y1="0" x2="960" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="1120" y1="0" x2="1120" y2="25" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Lane 1 -->
  <g transform="translate(0, 520)">
    <rect x="0" y="0" width="1280" height="25" fill="#e45c10" stroke="#000000" stroke-width="4"/>
    <rect x="0" y="-8" width="1280" height="8" fill="#00a800" stroke="#000000" stroke-width="4"/>
    <line x1="80" y1="0" x2="80" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="240" y1="0" x2="240" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="400" y1="0" x2="400" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="560" y1="0" x2="560" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="720" y1="0" x2="720" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="880" y1="0" x2="880" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="1040" y1="0" x2="1040" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="1200" y1="0" x2="1200" y2="25" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Lane 2 -->
  <g transform="translate(0, 620)">
    <rect x="0" y="0" width="1280" height="25" fill="#e45c10" stroke="#000000" stroke-width="4"/>
    <rect x="0" y="-8" width="1280" height="8" fill="#00a800" stroke="#000000" stroke-width="4"/>
    <line x1="160" y1="0" x2="160" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="320" y1="0" x2="320" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="480" y1="0" x2="480" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="640" y1="0" x2="640" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="800" y1="0" x2="800" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="960" y1="0" x2="960" y2="25" stroke="#000000" stroke-width="4"/>
    <line x1="1120" y1="0" x2="1120" y2="25" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Chibi P1 Player (Red Cap) Running on Lane 1 -->
  <g transform="translate(240, 480) scale(1.6)" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs -->
    <line x1="-6" y1="8" x2="-14" y2="22"/>
    <line x1="6" y1="8" x2="12" y2="22"/>
    <!-- Shoes -->
    <circle cx="-14" cy="22" r="5" fill="#8b5a2b" stroke="none"/>
    <circle cx="12" cy="22" r="5" fill="#8b5a2b" stroke="none"/>
    <!-- Overalls Body -->
    <rect x="-12" y="-12" width="24" height="22" fill="#2b5c8f"/>
    <!-- Golden buttons -->
    <circle cx="-6" cy="-6" r="2.5" fill="#FFD700" stroke="none"/>
    <circle cx="6" cy="-6" r="2.5" fill="#FFD700" stroke="none"/>
    <!-- Shirt sleeves -->
    <rect x="-16" y="-10" width="4" height="12" fill="#FF4136"/>
    <rect x="12" y="-10" width="4" height="12" fill="#FF4136"/>
    <!-- Head -->
    <circle cx="0" cy="-23" r="11" fill="#ffdbac"/>
    <!-- Cap -->
    <path d="M-11 -29 A11 11 0 0 1 11 -29 Z" fill="#FF4136"/>
    <rect x="0" y="-31" width="16" height="4" fill="#FF4136"/>
    <!-- Eyes -->
    <circle cx="5" cy="-24" r="2" fill="#000000" stroke="none"/>
    <!-- Moustache -->
    <rect x="4" y="-20" width="8" height="3.5" fill="#3a200a" stroke="none"/>
  </g>

  <!-- Chibi P2 Player (Green Cap) Running on Lane 2 -->
  <g transform="translate(420, 580) scale(1.6)" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs -->
    <line x1="-6" y1="8" x2="4" y2="22"/>
    <line x1="6" y1="8" x2="-6" y2="22"/>
    <!-- Shoes -->
    <circle cx="4" cy="22" r="5" fill="#8b5a2b" stroke="none"/>
    <circle cx="-6" cy="22" r="5" fill="#8b5a2b" stroke="none"/>
    <!-- Overalls Body -->
    <rect x="-12" y="-12" width="24" height="22" fill="#006400"/>
    <!-- Golden buttons -->
    <circle cx="-6" cy="-6" r="2.5" fill="#FFD700" stroke="none"/>
    <circle cx="6" cy="-6" r="2.5" fill="#FFD700" stroke="none"/>
    <!-- Shirt sleeves -->
    <rect x="-16" y="-10" width="4" height="12" fill="#2ecc70"/>
    <rect x="12" y="-10" width="4" height="12" fill="#2ecc70"/>
    <!-- Head -->
    <circle cx="0" cy="-23" r="11" fill="#ffdbac"/>
    <!-- Cap -->
    <path d="M-11 -29 A11 11 0 0 1 11 -29 Z" fill="#2ecc70"/>
    <rect x="0" y="-31" width="16" height="4" fill="#2ecc70"/>
    <!-- Eyes -->
    <circle cx="5" cy="-24" r="2" fill="#000000" stroke="none"/>
    <!-- Moustache -->
    <rect x="4" y="-20" width="8" height="3.5" fill="#3a200a" stroke="none"/>
  </g>

  <!-- Floating Question Blocks (Choices) -->
  <!-- Block 1 (Correct) -->
  <g transform="translate(850, 480) scale(1.4)" filter="url(#blk-sh)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#fcb42c" stroke="#000000" stroke-width="4"/>
    <rect x="-19" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="-19" y="15" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="15" width="4" height="4" fill="#b87c04"/>
    <text x="0" y="0" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" dominant-baseline="middle">24</text>
  </g>

  <!-- Block 2 (Wrong) -->
  <g transform="translate(980, 580) scale(1.4)" filter="url(#blk-sh)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#fcb42c" stroke="#000000" stroke-width="4"/>
    <rect x="-19" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="-19" y="15" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="15" width="4" height="4" fill="#b87c04"/>
    <text x="0" y="0" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" dominant-baseline="middle">14</text>
  </g>

  <!-- Block 3 (Wrong) -->
  <g transform="translate(940, 380) scale(1.4)" filter="url(#blk-sh)">
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="#fcb42c" stroke="#000000" stroke-width="4"/>
    <rect x="-19" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="-19" width="4" height="4" fill="#b87c04"/>
    <rect x="-19" y="15" width="4" height="4" fill="#b87c04"/>
    <rect x="15" y="15" width="4" height="4" fill="#b87c04"/>
    <text x="0" y="0" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" dominant-baseline="middle">42</text>
  </g>

  <!-- Floating Coins -->
  <g fill="#FFD700" stroke="#000000" stroke-width="2">
    <circle cx="740" cy="460" r="8"/>
    <circle cx="780" cy="450" r="8"/>
    <circle cx="820" cy="470" r="8"/>
  </g>

  <!-- Title & Subtitle Header -->
  <!-- Top Banner / Badge -->
  <g transform="translate(640, 85)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#FFCC80" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">🎮 เกมคณิตศาสตร์สุดมันส์ ป.4-ป.5</text>
  </g>

  <!-- Math Runner Title -->
  <text x="640" y="195" font-size="108" font-weight="900" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">MATH RUNNER</text>
  <text x="640" y="275" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">วิ่งสู้ฟัดคว้าสูตรคูณ 🧱</text>

  <!-- Footer Banner -->
  <g transform="translate(640, 672)">
    <rect x="-350" y="-24" width="700" height="48" rx="24" fill="#2ecc71" opacity="0.2"/>
    <text x="0" y="2" font-size="20" font-weight="700" fill="#a3e635" text-anchor="middle" dominant-baseline="middle">👤 เล่นเดี่ยว · 👥 เล่นสองคนบนเครื่องเดียว · 🌐 แข่งขันออนไลน์</text>
  </g>
</svg>
