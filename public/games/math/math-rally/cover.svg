<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" font-family="Kanit, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <!-- ถนน 2 เลน -->
  <rect x="0" y="95" width="400" height="100" fill="#334155"/>
  <line x1="0" y1="145" x2="400" y2="145" stroke="#facc15" stroke-width="3" stroke-dasharray="18 14" opacity="0.7"/>
  <!-- เส้นชัย -->
  <g transform="translate(360,95)">
    <rect width="14" height="100" fill="#fff"/>
    <rect y="0" width="7" height="10" fill="#1f2937"/><rect x="7" y="10" width="7" height="10" fill="#1f2937"/>
    <rect y="20" width="7" height="10" fill="#1f2937"/><rect x="7" y="30" width="7" height="10" fill="#1f2937"/>
    <rect y="40" width="7" height="10" fill="#1f2937"/><rect x="7" y="50" width="7" height="10" fill="#1f2937"/>
    <rect y="60" width="7" height="10" fill="#1f2937"/><rect x="7" y="70" width="7" height="10" fill="#1f2937"/>
    <rect y="80" width="7" height="10" fill="#1f2937"/><rect x="7" y="90" width="7" height="10" fill="#1f2937"/>
  </g>
  <!-- รถ -->
  <text x="210" y="135" font-size="38">🚙</text>
  <text x="250" y="185" font-size="42">🏎️</text>
  <text x="300" y="182" font-size="24">💨</text>
  <!-- ไอเทม -->
  <text x="320" y="132" font-size="22">🎁</text>
  <!-- โจทย์ -->
  <text x="20" y="58" font-size="40" font-weight="700" fill="#FFD700">7 × 8 = ?</text>
  <text x="22" y="84" font-size="15" fill="#cbd5e1">ตอบถูก รถพุ่ง! ถึงเส้นชัยก่อนชนะ</text>
  <!-- ชื่อเกม -->
  <text x="20" y="215" font-size="20" font-weight="700" fill="#fff">🏎️ รถซิ่งสูตรคูณ</text>
</svg>
