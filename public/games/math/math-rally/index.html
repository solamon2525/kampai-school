<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏎️ รถซิ่งคณิตศาสตร์ — Math Rally (kampai)</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  KAMPAI-SCHOOL · เกม "รถซิ่งคณิตศาสตร์" (math-rally)
  Racing duel 2 เลน: ตอบคำถามคณิตศาสตร์ถูก → รถพุ่ง · ผิด → รถช้า · ถึงเส้นชัยก่อนชนะ
  โหมด: 🤖 แข่งกับคอม (3 ระดับ) · 🌐 ออนไลน์ (kampai-match — ถึงเส้นชัยก่อนจบรอบ)
  ไอเทมบนถนน: 🚀 นิโทร · 🛡️ โล่ · ⭐ ดาวคะแนน×2 · 🐢 เต่า (vs คอมเท่านั้น)
  ตอบ: แตะ/คลิก หรือคีย์ลูกศร ↑←→↓ ตาม layout เพชร (+ เลข 1-4)
  โครงโฟลเดอร์ 5 ไฟล์ตาม GAME.md — config.js / data.js / game.js / style.css
═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- HUD (เว้นซ้ายให้ปุ่มเสียง SDK top-left z40) -->
    <div id="hud">
        <div id="hud-spacer"></div>
        <div id="timer-container">⏱️ <span id="timer-value">--</span></div>
        <div id="combo-badge"></div>
        <div id="score-container">⭐ <span id="score-value">0</span></div>
    </div>

    <!-- สนามแข่ง 2 เลน -->
    <div id="track">
        <div class="lane" id="lane-rival">
            <div class="lane-name" id="rival-name">🤖 คู่แข่ง</div>
            <div class="road"><div class="stripes"></div></div>
            <div class="car" id="rival-car"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32"><path d="M10,8 L56,8 L60,12 L60,20 L56,24 L10,24 L4,20 L4,12 Z" fill="#2563eb"/><ellipse cx="32" cy="16" rx="16" ry="9" fill="#172554" opacity="0.85"/><path d="M55,12 L62,16 L55,20 Z" fill="#60a5fa"/><rect x="0" y="12" width="8" height="8" rx="3" fill="#1d4ed8"/><ellipse cx="48" cy="4" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="48" cy="28" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="16" cy="4" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="16" cy="28" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="48" cy="4" rx="3" ry="1.8" fill="#94a3b8"/><ellipse cx="48" cy="28" rx="3" ry="1.8" fill="#94a3b8"/><ellipse cx="16" cy="4" rx="3" ry="1.8" fill="#94a3b8"/><ellipse cx="16" cy="28" rx="3" ry="1.8" fill="#94a3b8"/><rect x="10" y="14" width="44" height="4" rx="2" fill="#93c5fd" opacity="0.55"/></svg></div>
            <div class="lane-pct" id="rival-pct">0%</div>
        </div>
        <div class="finish-line">🏁</div>
        <div class="lane" id="lane-player">
            <div class="lane-name" id="lane-player-name">🏎️ ฉัน</div>
            <div class="road"><div class="stripes"></div></div>
            <div id="item-layer"></div>
            <div class="car" id="player-car"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32"><rect x="0" y="3" width="7" height="26" rx="2" fill="#c2410c"/><rect x="1" y="7" width="5" height="18" rx="1" fill="#f97316" opacity="0.8"/><path d="M10,8 L55,7 L60,11 L61,16 L60,21 L55,25 L10,24 L5,21 L4,16 L5,11 Z" fill="#ef4444"/><ellipse cx="32" cy="16" rx="14" ry="8.5" fill="#172554" opacity="0.9"/><ellipse cx="32" cy="16" rx="9" ry="5.5" fill="#1e40af" opacity="0.4"/><path d="M54,11 L61,16 L54,21 Z" fill="#f97316"/><rect x="54" y="10" width="10" height="12" rx="2.5" fill="#ea580c"/><ellipse cx="48" cy="4" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="48" cy="28" rx="6.5" ry="3.5" fill="#0f172a"/><ellipse cx="16" cy="3" rx="6" ry="3" fill="#0f172a"/><ellipse cx="16" cy="29" rx="6" ry="3" fill="#0f172a"/><ellipse cx="48" cy="4" rx="3" ry="1.8" fill="#475569"/><ellipse cx="48" cy="28" rx="3" ry="1.8" fill="#475569"/><ellipse cx="16" cy="3" rx="2.8" ry="1.5" fill="#475569"/><ellipse cx="16" cy="29" rx="2.8" ry="1.5" fill="#475569"/><rect x="12" y="14" width="42" height="4" rx="2" fill="#fbbf24" opacity="0.6"/></svg><span id="shield-badge" class="car-badge">🛡️</span><span id="star-badge" class="car-badge">⭐</span></div>
            <div class="lane-pct" id="player-pct">0%</div>
        </div>
    </div>

    <!-- โจทย์ + ปุ่มตอบ layout เพชร -->
    <div id="quiz">
        <div id="question">7 × 8</div>
        <div id="q-timer"><div id="q-timer-bar"></div></div>
        <div id="feedback"></div>
        <div id="answers">
            <button class="ans ans-up"    data-i="0"><span class="k">↑</span><span class="v"></span></button>
            <button class="ans ans-left"  data-i="1"><span class="k">←</span><span class="v"></span></button>
            <button class="ans ans-right" data-i="2"><span class="k">→</span><span class="v"></span></button>
            <button class="ans ans-down"  data-i="3"><span class="k">↓</span><span class="v"></span></button>
        </div>
    </div>
</div>

<div id="toast"></div>

<!-- Start screen -->
<div id="blocker">
    <h1>🏎️ รถซิ่งคณิตศาสตร์</h1>
    <div id="player-chip"></div>
    <p>ตอบคำถามคณิตศาสตร์ถูก รถพุ่ง! ตอบผิด รถช้า 🐌<br>เก็บไอเทมบนถนน 🚀🛡️⭐ — ถึงเส้นชัยก่อนชนะ 🏁</p>
    <div id="my-stats">
        <div class="ms-cell"><div class="ms-val" id="ms-best">0</div><div class="ms-label">คะแนนสูงสุด</div></div>
        <div class="ms-cell"><div class="ms-val" id="ms-plays">0</div><div class="ms-label">เล่นไปแล้ว (ครั้ง)</div></div>
    </div>
    <div class="pick-label">โหมดคณิตศาสตร์:</div>
    <div id="table-picker"></div>
    <div class="mode-row">
        <button class="btn btn-primary" onclick="startCpu('easy')">🤖 ง่าย</button>
        <button class="btn btn-primary" onclick="startCpu('mid')">🤖 กลาง</button>
        <button class="btn btn-primary" onclick="startCpu('hard')">🤖 โหด</button>
        <button class="btn btn-blue" id="online-btn" onclick="openOnline()" style="display:none">🌐 ออนไลน์</button>
    </div>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list" class="leaderboard-list"><li class="lb-loading">กำลังโหลด...</li></ul>
    </div>
</div>

<!-- Game Over screen -->
<div id="gameover-screen">
    <h1 id="go-title">จบเกม!</h1>
    <div id="go-result"></div>
    <div id="final-score">0</div>
    <p id="go-summary"></p>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list-gameover" class="leaderboard-list"><li class="lb-loading">—</li></ul>
    </div>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px;">
        <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
        <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
    </div>
</div>

<div id="confetti-layer"></div>

<!-- ═══ KAMPAI SDK + Online framework (single source — อย่าแก้) ═══ -->
<script src="/games/kampai-sdk.js"></script>
<script>
/* fallback stub: กันพังถ้าเปิด standalone แล้ว SDK โหลดไม่ได้ */
window.KAMPAI = window.KAMPAI || { isEmbed:false, isTouch:false, ready:true, student:null, stats:null, leaderboard:[], input:{up:false,down:false,left:false,right:false,a:false,b:false}, onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, exit:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, online:{available:false,makeCode:function(){return'0000';},join:function(){return this;},send:function(){return this;},leave:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},speak:function(){},stopSpeak:function(){},fxFlash:function(){},mountToggles:function(){return this;},defaultBgm:function(){return this;},setBgm:function(){return this;},setBgmUrl:function(){return this;},bgmStart:function(){},bgmStop:function(){},unlock:function(){return this;}} };
</script>
<script src="/games/kampai-match.js"></script>
<script>
/* fallback stub สำหรับโหมดออนไลน์ */
window.KampaiMatch = window.KampaiMatch || { create:function(){return{available:false,openMenu:function(){alert('โหมดออนไลน์เล่นผ่านระบบเท่านั้น');},report:function(){},finish:function(){},leave:function(){}};} };
</script>

<!-- ═══ เกม (config → data → game · โหลดตามลำดับ แชร์ global scope) ═══ -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
