<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset="0.55" stop-color="#155e75"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="220" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🔢</text>
  <text x="1110" y="170" font-size="180" opacity="0.08" text-anchor="middle" dominant-baseline="middle">⏳</text>

  <g transform="translate(640,116)">
    <rect x="-200" y="-26" width="400" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#cffafe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · บูรณาการ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="122" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">เรียงให้ถูกลำดับ</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">แตะการ์ด 2 ใบเพื่อสลับ → เรียงให้ถูก</text>

  <!-- การ์ดเรียง -->
  <g transform="translate(640,520)" font-family="'Kanit'" font-weight="700" font-size="40">
    <g><rect x="-330" y="-46" width="150" height="92" rx="16" fill="#f8fafc"/><text x="-255" y="6" fill="#155e75" text-anchor="middle" dominant-baseline="middle">1/4</text></g>
    <g><rect x="-165" y="-46" width="150" height="92" rx="16" fill="#f8fafc"/><text x="-90" y="6" fill="#155e75" text-anchor="middle" dominant-baseline="middle">1/2</text></g>
    <g><rect x="0" y="-46" width="150" height="92" rx="16" fill="url(#gold)" stroke="#fff7e0" stroke-width="4"/><text x="75" y="6" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">2/3</text></g>
    <g><rect x="165" y="-46" width="150" height="92" rx="16" fill="#f8fafc"/><text x="240" y="6" fill="#155e75" text-anchor="middle" dominant-baseline="middle">3/4</text></g>
  </g>
  <g transform="translate(640,648)">
    <rect x="-235" y="-24" width="470" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เรียงจำนวน · ไทม์ไลน์ประวัติศาสตร์ · ขั้นตอนวิทย์ · แข่งสด</text>
  </g>
</svg>
