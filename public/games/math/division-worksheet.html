<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ระบบใบงานการหารยาวอัจฉริยะ ป.4–ป.6 — โรงเรียนบ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link href="/games/worksheet-modes.css?v=1.171.3" rel="stylesheet" />
  <style>
    *{box-sizing:border-box} body{margin:0;background:#ecfdf5;color:#0f172a;font-family:Sarabun,sans-serif}
    :root{--sw:22px;--cw:33px;--ch:31px;--rh:17.5px}
    
    .toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#065f46;color:#fff;box-shadow:0 3px 12px rgba(6,95,70,.35)}
    .toolbar h1{font-size:1rem;flex:1;margin:0;min-width:170px}
    .toolbar-ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .t-select,.t-input{font:700 .85rem Sarabun;padding:6px 10px;border-radius:8px;border:1px solid #6ee7b7;background:#fff;color:#065f46}
    .t-input{width:130px}
    .btn{border:0;border-radius:8px;padding:7px 11px;font:700 .88rem Sarabun;cursor:pointer;background:#fff;color:#065f46;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .btn.primary{background:#fbbf24;color:#78350f}.btn.green{background:#10b981;color:#fff}.btn.accent{background:#0284c7;color:#fff}
    
    .pages{padding:14px}.sheet{width:210mm;min-height:297mm;margin:0 auto 16px;background:#fff;padding:5mm 6mm;box-shadow:0 5px 24px rgba(6,95,70,.15);page-break-after:always;break-after:page;display:flex;flex-direction:column;gap:2mm;position:relative}
    .sheet:last-child{page-break-after:auto}
    
    .sheet-head{border-bottom:2px solid #047857;padding-bottom:2mm;padding-right:28mm;position:relative;min-height:26mm}
    .sheet-title{display:flex;align-items:center;gap:8px}.sheet-title h2{margin:0;flex:1;color:#065f46;font-size:15pt}.level{border:1.5px solid #6ee7b7;border-radius:999px;padding:2px 9px;font-weight:800;color:#065f46;font-size:8.5pt}
    .school-name{font-size:9pt;font-weight:700;color:#047857;margin-top:0.5mm;display:flex;align-items:center;gap:6px}
    .school-logo-mini{width:18px;height:18px;object-fit:contain}
    
    .student{display:flex;flex-wrap:nowrap;gap:8mm;align-items:center;margin-top:2mm;font-size:10.5pt;font-weight:700;color:#1e293b}
    .student-name{flex:1;display:flex;align-items:center;gap:6px}
    .student-no{display:flex;align-items:center;gap:6px;white-space:nowrap}
    .blank{display:inline-block;border-bottom:1px solid #334155;height:5mm}
    .blank.long{flex:1;min-width:60mm}
    .blank.short{width:22mm}
    
    .directions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:9pt;font-weight:700;color:#334155;margin-top:2mm}
    .indicator{color:#047857;font-weight:800;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:6px;padding:1px 7px;white-space:nowrap}
    
    .qr-box{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center;width:25mm}
    .qr-img{width:22mm;height:22mm;border:1px solid #047857;border-radius:4px;padding:1px;background:#fff}
    .qr-label{font-size:6.5pt;font-weight:700;color:#047857;margin-top:1px;line-height:1.1}

    .questions{display:grid;gap:1.5mm;flex:1}
    .questions.count-10{grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:1.5mm 3mm}
    .questions.count-10 .q{padding:1.5mm 1mm 2mm;min-height:36.5mm}
    .questions.count-5{grid-template-columns:1fr;grid-template-rows:repeat(5,1fr);gap:3mm}
    .questions.count-5 .q{padding:4mm 3mm;min-height:44mm}
    
    .q{border:1.4px solid #a7f3d0;border-radius:2.5mm;padding:2.5mm 2mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5mm;position:relative;break-inside:avoid}
    .q-num{position:absolute;left:2mm;top:1.5mm;width:6.5mm;height:6.5mm;border-radius:50%;display:grid;place-items:center;background:#047857;color:#fff;font-weight:800;font-size:9pt}
    .q-rating{position:absolute;right:2mm;top:1.5mm;font-size:7pt;color:#64748b;font-weight:700}
    
    /* Long-division writing scaffold */
    .long-division{--ld-cell:7mm;display:flex;flex-direction:column;align-items:flex-start;margin:1mm auto 0;color:#065f46;font-weight:800}
    .ld-quotient{display:grid;grid-template-columns:repeat(var(--digits),var(--ld-cell));margin-left:13mm;position:relative}
    .ld-quotient::before{content:'ผลหาร';position:absolute;right:calc(100% + 2mm);bottom:1mm;font-size:6.5pt;color:#64748b;white-space:nowrap}
    .ld-quotient-cell{height:5mm;border-bottom:1px dashed #047857;display:grid;place-items:center;position:relative}
    .ld-quotient-answer{display:none;color:#b91c1c;font-size:11pt;font-weight:800;line-height:1}
    .ld-main{display:flex;align-items:flex-start}
    .ld-divisor{width:12mm;height:7mm;display:grid;place-items:center;font-size:12pt}
    .ld-dividend{display:grid;grid-template-columns:repeat(var(--digits),var(--ld-cell));border-top:2px solid #047857;border-left:2px solid #047857;border-top-left-radius:4px}
    .ld-digit{height:7mm;display:grid;place-items:center;border-right:1px dashed #a7f3d0;font-size:12pt}
    .ld-digit:last-child{border-right:0}
    .ld-work{width:66mm;margin:1mm 0 0;display:grid;gap:.4mm}
    .ld-step{height:4.2mm;display:grid;grid-template-columns:9mm 1fr;align-items:end;font-size:6.3pt;color:#64748b}
    .ld-write{height:3.8mm;border-bottom:1px dotted #64748b;display:flex;align-items:flex-end;padding:0 .7mm;min-width:0}
    .ld-teacher-value{display:none;color:#b91c1c;font-size:5.6pt;font-weight:800;white-space:nowrap;line-height:1.1;width:100%;grid-template-columns:auto auto 1fr;align-items:center}
    .ld-phase{padding:0 1mm;border-right:1px solid #fecaca;text-align:center}.ld-phase:first-child{padding-left:0}.ld-phase:last-child{border-right:0;text-align:left}
    .ld-answer-fill{display:none;color:#b91c1c;font-weight:800}
    .show-answers .ld-quotient-answer,.show-answers .ld-answer-fill{display:inline}.show-answers .ld-teacher-value{display:grid}
    .show-answers .ld-quotient-cell,.show-answers .ld-write{background:#fef2f2;border-color:#f87171}
    .questions.count-10 .long-division{--ld-cell:7.5mm}
    .questions.count-10 .ld-quotient-cell{height:4mm}
    .questions.count-10 .ld-main .ld-divisor,.questions.count-10 .ld-digit{height:6mm;font-size:10.5pt}
    .questions.count-10 .ld-step{height:3.2mm}
    .questions.count-5 .long-division{--ld-cell:14mm}
    .questions.count-5 .ld-quotient{margin-left:17mm}
    .questions.count-5 .ld-work{width:92mm;margin-top:1.3mm}
    .questions.count-5 .ld-divisor{width:16mm}
    .questions.count-5 .q{padding:2mm 3mm}
    .questions.count-5 .ld-quotient-cell{height:5mm}
    .questions.count-5 .ld-main .ld-divisor,.questions.count-5 .ld-digit{height:7mm;font-size:15pt}
    .questions.count-5 .ld-step{height:4.8mm;font-size:7pt;grid-template-columns:11mm 1fr}
    .questions.count-5 .ld-teacher-value{font-size:7.2pt}
    .questions.count-5 .ans{margin-top:1mm}

    .ans{font:700 9pt Sarabun,sans-serif;color:#065f46;margin-top:3mm}
    .blank-sm{display:inline-block;min-width:20mm;border-bottom:1px solid #334155;height:4.5mm}
    .ta{display:none;color:#b91c1c;font-weight:800;border:1px dashed #f87171;background:#fef2f2;border-radius:4px;padding:0 4px;margin-left:4px;font-size:8.5pt}
    .show-answers .ta{display:inline}

    .parent-slip{border-top:2px dashed #047857;margin-top:auto;padding-top:1.5mm;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;font-size:8pt;color:#334155}
    .parent-slip .cut-label{font-weight:800;color:#047857}
    .parent-slip .teacher-label{font-weight:700;color:#065f46;background:#ecfdf5;padding:1px 6px;border-radius:4px;border:1px solid #a7f3d0}

    .cover-sheet{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:4px double #047857;padding:12mm}
    .cover-logo-img{width:100px;height:100px;object-fit:contain;margin-bottom:4mm;filter:drop-shadow(0 4px 12px rgba(4,120,87,.2))}
    .cover-title{font-size:24pt;font-weight:800;color:#065f46;margin:0 0 2mm}
    .cover-sub{font-size:14pt;font-weight:700;color:#047857;margin-bottom:8mm}
    .cover-box{border:2px solid #a7f3d0;background:#ecfdf5;border-radius:12px;padding:6mm;width:80%;margin-bottom:8mm}
    .stamp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;width:100%;margin-top:6mm}
    .stamp-card{border:1.5px dashed #047857;border-radius:8px;padding:4mm;min-height:22mm;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5pt;font-weight:700;color:#047857;background:#fff}

    .sheet-foot{display:flex;justify-content:space-between;align-items:center;color:#64748b;font-size:7.5pt;margin-top:0.5mm}
    .sheet-foot-teacher{font-weight:700;color:#047857}
    
    @media print{
      @page{size:A4 portrait;margin:0}
      body{background:#fff}.toolbar{display:none!important}.pages{padding:0}
      .sheet{margin:0;box-shadow:none;width:210mm;height:297mm;min-height:297mm;padding:5mm 6mm;overflow:hidden}.q{min-height:0}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>➗ ระบบใบงานการหารยาวอัจฉริยะ</h1>
    <div class="toolbar-ctrls">
      <select class="t-select" id="selStyle">
        <option value="standard">รูปแบบ: ใบงานมาตรฐาน (ตั้งหาร)</option>
        <option value="progressive">รูปแบบ: บันไดไต่ระดับ ⭐</option>
        <option value="booklet">รูปแบบ: รวมเล่มแบบฝึกหัด (พร้อมปก & Skill Tree)</option>
      </select>
      <select class="t-select" id="selPageCount">
        <option value="1">สร้าง 1 หน้า</option>
        <option value="2">สร้าง 2 หน้าพร้อมกัน</option>
        <option value="3">สร้าง 3 หน้าพร้อมกัน</option>
        <option value="5">สร้าง 5 หน้าพร้อมกัน</option>
      </select>
      <select class="t-select" id="selGrade" aria-label="ระดับชั้นของใบงาน">
        <option value="4" selected>ชั้น: ป.4 (หารไม่เกิน 3 หลัก)</option>
        <option value="5">ชั้น: ป.5 (หารมีเศษ/ตัวหาร 2 หลัก)</option>
        <option value="6">ชั้น: ป.6 (หารทศนิยม)</option>
      </select>
      <select class="t-select" id="selCount" aria-label="จำนวนข้อต่อหน้า">
        <option value="10" selected>10 ข้อ/หน้า (โจทย์ใหญ่)</option>
        <option value="5">5 ข้อ/หน้า (โจทย์ใหญ่พิเศษ)</option>
      </select>
      <input class="t-input" type="text" id="inpSchool" value="โรงเรียนบ้านคำไผ่" />
      <select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select>
      <button class="btn primary" id="btnRandom">🎲 สุ่มโจทย์ใหม่</button>
      <button class="btn" id="btnAnswers">👁️ เฉลยครู</button>
      <button class="btn green" id="btnPrint">🖨️ พิมพ์ A4</button>
    </div>
  </div>
  <main class="pages" id="pages"></main>

<script src="/games/worksheet-runtime.js?v=1.171.3"></script>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const SCHOOL_LOGO_URL = 'https://lkpqssbqxxpasidfqhpb.supabase.co/storage/v1/object/public/school-images/logo/1778157862905_c2swwm.webp';
const MEDIA_URL = window.location.origin;
const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(MEDIA_URL);
function question(qi, grade, showRating=false){
  let divisor = R(2,9), dividend = R(100,999);
  if(grade === '5') { divisor = R(10,25); dividend = R(1000,9999); }
  else if(grade === '6') { divisor = R(2,9); dividend = R(10,99)*10; }
  
  const quotient = Math.floor(dividend / divisor);
  const remainder = dividend % divisor;
  const ansText = remainder > 0 ? `${quotient} เศษ ${remainder}` : `${quotient}`;
  const ratingHtml = showRating ? '<span class="q-rating">ประเมินตนเอง: [ ] ⭐3  [ ] ⭐2  [ ] ⭐1</span>' : '';
  const dividendDigits = String(dividend).split('');
  const workSteps = [];
  let runningRemainder = 0;
  let quotientStarted = false;
  const quotientByColumn = dividendDigits.map((digit, digitIndex) => {
    const partial = runningRemainder * 10 + Number(digit);
    if (!quotientStarted && partial < divisor && digitIndex < dividendDigits.length - 1) {
      runningRemainder = partial;
      return '';
    }
    quotientStarted = true;
    const quotientDigit = Math.floor(partial / divisor);
    const product = quotientDigit * divisor;
    const remainderAfter = partial - product;
    const nextDigit = dividendDigits[digitIndex + 1];
    const bringDown = nextDigit === undefined ? '' : ' ↓'+nextDigit+'→'+(remainderAfter * 10 + Number(nextDigit));
    workSteps.push({ partial, quotientDigit, product, remainderAfter, bringDown });
    runningRemainder = remainderAfter;
    return String(quotientDigit);
  });
  const quotientCells = quotientByColumn.map(digit => '<span class="ld-quotient-cell"><span class="ld-quotient-answer">'+digit+'</span></span>').join('');
  const dividendCells = dividendDigits.map(digit => '<span class="ld-digit">'+digit+'</span>').join('');
  const workRows = workSteps.map((step, index) => '<div class="ld-step"><span>ขั้น '+(index+1)+'</span><span class="ld-write"><span class="ld-teacher-value">'
    +'<span class="ld-phase">'+step.partial+'÷'+divisor+'='+step.quotientDigit+'</span>'
    +'<span class="ld-phase">'+step.quotientDigit+'×'+divisor+'='+step.product+'</span>'
    +'<span class="ld-phase">'+step.partial+'−'+step.product+'='+step.remainderAfter+step.bringDown+'</span>'
    +'</span></span></div>').join('');
  
  return '<article class="q"><span class="q-num">'+qi+'</span>'+ratingHtml
    +'<div class="long-division" style="--digits:'+dividendDigits.length+'" aria-label="ตั้งหารยาว '+dividend+' หารด้วย '+divisor+'">'
    +'<div class="ld-quotient">'+quotientCells+'</div>'
    +'<div class="ld-main"><span class="ld-divisor">'+divisor+'</span><div class="ld-dividend">'+dividendCells+'</div></div>'
    +'<div class="ld-work">'+workRows+'</div></div>'
    +'<div class="ans">ตอบ <span class="blank-sm"><span class="ld-answer-fill">'+ansText+'</span></span></div></article>';
}

function renderBookletCover(schoolName, teacherName){
  return '<section class="sheet cover-sheet">'
    +'<img class="cover-logo-img" src="'+SCHOOL_LOGO_URL+'" alt="ตราโรงเรียน" />'
    +'<h1 class="cover-title">'+(schoolName||'โรงเรียนบ้านคำไผ่')+'</h1>'
    +'<div class="cover-sub">แบบฝึกหัดทักษะการหารยาว ป.4–ป.6 (ชุดเรียนรู้สมบูรณ์แบบ)</div>'
    +'<div class="cover-box"><div style="font-size:12pt;font-weight:800;color:#065f46">ข้อมูลนักเรียน</div>'
    +'<div style="text-align:left;font-size:11pt;font-weight:700;margin-top:3mm;display:grid;gap:2mm">'
    +'<div>ชื่อ - นามสกุล: <span class="blank" style="min-width:100mm"></span></div>'
    +'<div>เลขที่: <span class="blank" style="min-width:30mm"></span></div>'
    +'<div>ครูผู้สอน: <span class="blank" style="min-width:80mm">'+(teacherName||'....................................')+'</span></div>'
    +'</div></div>'
    +'<footer class="sheet-foot" style="position:absolute;bottom:8mm;right:8mm">กลุ่มสาระการเรียนรู้คณิตศาสตร์ · โรงเรียนบ้านคำไผ่</footer></section>';
}

function renderParentSlip(teacherName){
  return '<div class="parent-slip"><span class="cut-label">✂️ แถบส่งผู้ปกครอง</span>'
    +(teacherName?`<span class="teacher-label">ครูผู้สอน: ${teacherName}</span>`:'')
    +'<span>ผลการทำแบบฝึกหัด: [  ] ผ่านเกณฑ์   [  ] ควรทบทวนเพิ่ม</span>'
    +'<span>ลงชื่อผู้ปกครอง: .......................................</span></div>';
}

function renderSingleSheet(pageIdx, totalPages, style, count, grade, schoolName, teacherName){
  let qs = ''; for(let i=1; i<=count; i++) qs += question(i, grade, style==='progressive');
  return '<section class="sheet"><header class="sheet-head">'
    +'<div class="qr-box"><img class="qr-img" src="'+QR_API+'" alt="QR" /><span class="qr-label">สแกนดูวิธีคิด</span></div>'
    +'<div class="sheet-title"><h2>➗ ใบงานการหารยาว — ชั้น ป.'+grade+'</h2><span class="level">ค 1.1 ป.'+grade+'/4</span></div>'
    +'<div class="school-name"><img src="'+SCHOOL_LOGO_URL+'" class="school-logo-mini" /> '+schoolName+'</div>'
    +'<div class="student"><div class="student-name">ชื่อ - นามสกุล: <span class="blank long"></span></div><div class="student-no">เลขที่: <span class="blank short"></span></div></div>'
    +'<div class="directions"><span>คำชี้แจง: เติมผลหาร ผลคูณ ผลลบ และเศษลงในแบบตั้งหารยาวทีละขั้น</span><span class="indicator">ค 1.1 ป.'+grade+'/4</span></div>'
    +'</header><div class="questions count-'+count+'">'+qs+'</div>'+renderParentSlip(teacherName)
    +'<footer class="sheet-foot"><span>หน้า '+pageIdx+' / '+totalPages+'</span>'+(teacherName?`<span class="sheet-foot-teacher">ครูผู้สอน: ${teacherName}</span>`:'')+'</footer></section>';
}

function render(){
  const style = document.getElementById('selStyle').value;
  const count = parseInt(document.getElementById('selCount').value, 10);
  const pageCount = parseInt(document.getElementById('selPageCount').value, 10);
  const grade = document.getElementById('selGrade').value;
  const schoolName = document.getElementById('inpSchool').value.trim();
  const teacherName = document.getElementById('selTeacher').value;

  let html = style==='booklet' ? renderBookletCover(schoolName, teacherName) : '';
  for(let p=1; p<=pageCount; p++) html += renderSingleSheet(p, pageCount, style, count, grade, schoolName, teacherName);
  document.getElementById('pages').innerHTML = html;
}

document.getElementById('btnRandom').onclick = render;
document.getElementById('selStyle').onchange = render;
document.getElementById('selPageCount').onchange = render;
document.getElementById('selGrade').onchange = render;
document.getElementById('selCount').onchange = render;
document.getElementById('inpSchool').oninput = render;
document.getElementById('selTeacher').onchange = render;
document.getElementById('btnAnswers').onclick = function(){
  document.body.classList.toggle('show-answers');
  this.textContent = document.body.classList.contains('show-answers') ? '🙈 ซ่อนเฉลยครู' : '👁️ เฉลยครู';
};
document.getElementById('btnPrint').onclick = () => window.print();

window.KampaiWorksheet.loadTeachers();
render();
</script>
<script src="/games/worksheet-modes.js?v=1.171.3"></script>
</body>
</html>
