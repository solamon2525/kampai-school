<script src="/games/worksheet-runtime.js?v=1.199.3"></script>
<script>
const WORKSHEET_KEY='division';
const SET_TITLE_PREFIX='ใบงานหารยาว';
let renderSeed=Date.now();
let rng=null;
let setsUi=null;
let revealCount=0;
function ensureRng(){
  if(window.KampaiWorksheetSets) rng=window.KampaiWorksheetSets.createRng(renderSeed);
  else rng=null;
}
const R=(a,b)=>rng?rng.randomInt(a,b):(a+Math.floor(Math.random()*(b-a+1)));
const SCHOOL_LOGO_URL = 'https://lkpqssbqxxpasidfqhpb.supabase.co/storage/v1/object/public/school-images/logo/1778157862905_c2swwm.webp';
const MEDIA_URL = window.location.origin + '/games/math/long-division-thinking-media.html';
const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(MEDIA_URL);

function getProblemNumbers(grade, divOpt, dvdOpt){
  let divDigits = divOpt || '2';
  let dvdDigits = dvdOpt || '4';
  if(grade === '4'){ divDigits = '1'; dvdDigits = '3'; }
  else if(grade === '4_4d'){ divDigits = '1'; dvdDigits = '4'; }
  else if(grade === '5_2d3d'){ divDigits = '2_round'; dvdDigits = '3'; }
  else if(grade === '5'){ divDigits = '2'; dvdDigits = '4'; }
  else if(grade === '6'){ divDigits = '1'; dvdDigits = '3'; }

  let divisor = 2, dividend = 100;
  let attempts = 0;
  do {
    attempts++;
    if(divDigits === '1') divisor = R(2,9);
    else if(divDigits === '2_round') divisor = R(1,9) * 10;
    else if(divDigits === '2') divisor = R(10,99);
    else divisor = R(2,9);

    if(dvdDigits === '2') dividend = R(10,99);
    else if(dvdDigits === '3') dividend = R(100,999);
    else if(dvdDigits === '4') dividend = R(1000,9999);
    else if(dvdDigits === '5') dividend = R(10000,99999);
    else dividend = R(100,999);

    if(grade === '6') dividend = R(10,99) * 10;
  } while(attempts < 50 && (dividend < divisor * 2));

  return { divisor, dividend };
}

function question(qi, grade, divOpt, dvdOpt, showRating=false){
  const { divisor, dividend } = getProblemNumbers(grade, divOpt, dvdOpt);
  
  const quotient = Math.floor(dividend / divisor);
  const remainder = dividend % divisor;
  const ansText = remainder > 0 ? `${quotient} เศษ ${remainder}` : `${quotient}`;
  const ratingHtml = showRating ? '<span class="q-rating">ประเมินตนเอง: [ ] ⭐3  [ ] ⭐2  [ ] ⭐1</span>' : '';
  const dividendDigits = String(dividend).split('');
  const workSteps = [];
  let runningRemainder = 0;
  let quotientStarted = false;
  const quotientByColumn = dividendDigits.map((digit, digitIndex) => {
    const partial = runningRemainder * 10 + Number(digit);
    if (!quotientStarted && partial < divisor && digitIndex < dividendDigits.length - 1) {
      runningRemainder = partial;
      return '';
    }
    quotientStarted = true;
    const quotientDigit = Math.floor(partial / divisor);
    const product = quotientDigit * divisor;
    const remainderAfter = partial - product;
    const nextDigit = dividendDigits[digitIndex + 1];
    workSteps.push({ partial, quotientDigit, product, remainderAfter, nextDigit, digitIndex });
    runningRemainder = remainderAfter;
    return String(quotientDigit);
  });
  const quotientCells = quotientByColumn.map(digit => '<span class="ld-quotient-cell"><span class="ld-quotient-answer">'+digit+'</span></span>').join('');
  const dividendCells = dividendDigits.map(digit => '<span class="ld-digit">'+digit+'</span>').join('');
  const placedValue = (value, endIndex, className, spanLength=String(value).length) => {
    const text = String(value);
    const start = endIndex - spanLength + 2;
    const pad = spanLength - text.length;
    const cells = Array.from({ length: spanLength }, (_, index) => '<span class="ld-pos-digit ld-teacher-value">'+(index < pad ? '' : text[index-pad])+'</span>').join('');
    return '<span class="ld-placed '+className+'" style="--span:'+spanLength+';grid-column:'+start+' / span '+spanLength+'">'+cells+'</span>';
  };
  const workRows = workSteps.map((step) => {
    const productSpan = Math.max(String(step.partial).length, String(step.product).length);
    const nextPartial = step.nextDigit === undefined ? step.remainderAfter : step.remainderAfter * 10 + Number(step.nextDigit);
    const nextEndIndex = step.nextDigit === undefined ? step.digitIndex : step.digitIndex + 1;
    return '<div class="ld-calc-row">'+placedValue(step.product, step.digitIndex, 'ld-product', productSpan)+'</div>'
      +'<div class="ld-calc-row">'+placedValue(nextPartial, nextEndIndex, 'ld-partial')+'</div>';
  }).join('');
  
  let rowHeight = '6.3mm';
  if (dividendDigits.length >= 5) {
    rowHeight = workSteps.length >= 4 ? '4.2mm' : '4.8mm';
  } else if (dividendDigits.length >= 4) {
    rowHeight = workSteps.length >= 3 ? '5.2mm' : '5.8mm';
  } else if (workSteps.length <= 2) {
    rowHeight = '7.8mm';
  }
  const divisorWidth = String(divisor).length >= 2 ? '14mm' : '9mm';
  
  return '<article class="q"><span class="q-num">'+qi+'</span>'+ratingHtml
    +'<div class="q-board"><div class="long-division" style="--digits:'+dividendDigits.length+';--ld-row:'+rowHeight+';--ld-divisor-width:'+divisorWidth+'" aria-label="ตั้งหารยาว '+dividend+' หารด้วย '+divisor+'">'
    +'<div class="ld-quotient">'+quotientCells+'</div>'
    +'<div class="ld-main"><span class="ld-divisor">'+divisor+'</span><div class="ld-dividend">'+dividendCells+'</div></div>'
    +'<div class="ld-work">'+workRows+'</div></div></div>'
    +'<div class="ans">ตอบ <span class="blank-sm"><span class="ld-answer-fill">'+ansText+'</span></span></div></article>';
}

function renderBookletCover(schoolName, teacherName){

    +'<div class="cover-box"><div style="font-size:12pt;font-weight:800;color:#065f46">ข้อมูลนักเรียน</div>'
    +'<div style="text-align:left;font-size:11pt;font-weight:700;margin-top:3mm;display:grid;gap:2mm">'
    +'<div>ชื่อ - นามสกุล: <span class="blank" style="min-width:100mm"></span></div>'
    +'<div>เลขที่: <span class="blank" style="min-width:30mm"></span></div>'

}

function renderParentSlip(teacherName){

    +'<span>ผลการทำแบบฝึกหัด: [  ] ผ่านเกณฑ์   [  ] ควรทบทวนเพิ่ม</span>'
    +'<span>ลงชื่อผู้ปกครอง: .......................................</span></div>';
}

function syncDigitSelectors(fromGradeChange=false){
  const grade = document.getElementById('selGrade')?.value;
  const selDiv = document.getElementById('selDivisorDigits');
  const selDvd = document.getElementById('selDividendDigits');
  if(!selDiv || !selDvd) return;

  if (fromGradeChange) {
    if (grade === '4') { selDiv.value = '1'; selDvd.value = '3'; }
    else if (grade === '4_4d') { selDiv.value = '1'; selDvd.value = '4'; }
    else if (grade === '5_2d3d') { selDiv.value = '2_round'; selDvd.value = '3'; }
    else if (grade === '5') { selDiv.value = '2'; selDvd.value = '4'; }
    else if (grade === '6') { selDiv.value = '1'; selDvd.value = '3'; }
  }

  const isCustom = grade === 'custom';
  selDiv.style.display = isCustom ? 'inline-block' : 'none';
  selDvd.style.display = isCustom ? 'inline-block' : 'none';
}

function currentConfig(){
  return{
    style:document.getElementById('selStyle')?.value||'standard',
    pageCount:document.getElementById('selPageCount')?.value||'1',
    grade:document.getElementById('selGrade')?.value||'5',
    divisorDigits:document.getElementById('selDivisorDigits')?.value||'2',
    dividendDigits:document.getElementById('selDividendDigits')?.value||'4',
    count:8,
    schoolName:document.getElementById('inpSchool')?.value||'',
    teacherName:document.getElementById('selTeacher')?.value||'',
    useMode:document.getElementById('selUseMode')?.value||'standard',
  };
}
function applyConfig(cfg){
  if(!cfg)return;
  if(cfg.style!=null&&document.getElementById('selStyle'))document.getElementById('selStyle').value=String(cfg.style);
  if(cfg.pageCount!=null&&document.getElementById('selPageCount'))document.getElementById('selPageCount').value=String(cfg.pageCount);
  if(cfg.grade!=null&&document.getElementById('selGrade'))document.getElementById('selGrade').value=String(cfg.grade);
  if(cfg.divisorDigits!=null&&document.getElementById('selDivisorDigits'))document.getElementById('selDivisorDigits').value=String(cfg.divisorDigits);
  if(cfg.dividendDigits!=null&&document.getElementById('selDividendDigits'))document.getElementById('selDividendDigits').value=String(cfg.dividendDigits);
  if(document.getElementById('selCount'))document.getElementById('selCount').value='8';
  if(cfg.schoolName!=null&&document.getElementById('inpSchool'))document.getElementById('inpSchool').value=String(cfg.schoolName);
  if(cfg.teacherName!=null&&document.getElementById('selTeacher'))document.getElementById('selTeacher').value=String(cfg.teacherName);
  if(cfg.useMode!=null&&document.getElementById('selUseMode'))document.getElementById('selUseMode').value=String(cfg.useMode);
  syncDigitSelectors(false);
}

function getQuestions(){return Array.from(document.querySelectorAll('#pages .q'))}
function syncAnswerReveal(){
  document.body.classList.remove('show-answers');
  const qs=getQuestions();
  const total=qs.length;
  qs.forEach((q,index)=>{
    q.classList.toggle('reveal-answer',index<revealCount);
    q.classList.toggle('reveal-current',revealCount>0&&index===revealCount-1);
  });
  const label=document.getElementById('answerStepLabel');
  const btnAll=document.getElementById('btnAnswers');
  if(!total){label.textContent='เฉลย: ปิด';btnAll.textContent='👁 ทั้งหมด';return}
  if(revealCount<=0){label.textContent='เฉลย: ปิด';btnAll.textContent='👁 ทั้งหมด'}
  else if(revealCount>=total){label.textContent='เฉลย: ครบ '+total+' ข้อ';btnAll.textContent='🙈 ซ่อนทั้งหมด'}
  else{label.textContent='เฉลยข้อ '+revealCount+' / '+total;btnAll.textContent='👁 ทั้งหมด'}
  document.getElementById('btnAnswerPrev').disabled=revealCount<=0;
  document.getElementById('btnAnswerNext').disabled=revealCount>=total;
}
function revealNext(){const total=getQuestions().length;if(revealCount<total)revealCount+=1;syncAnswerReveal()}
function revealPrev(){if(revealCount>0)revealCount-=1;syncAnswerReveal()}
function toggleAllAnswers(){
  const total=getQuestions().length;
  revealCount=revealCount>=total?0:total;
  syncAnswerReveal();
}

function renderSingleSheet(pageIdx, totalPages, style, count, grade, schoolName, teacherName){
  const divOpt = document.getElementById('selDivisorDigits')?.value || '2';
  const dvdOpt = document.getElementById('selDividendDigits')?.value || '4';
  let qs = ''; for(let i=1; i<=count; i++) qs += question(i, grade, divOpt, dvdOpt, style==='progressive');
  
  let indicatorLabel = 'ค 1.1 ป.5/8';
  let gradeDisplay = 'ป.5';
  if (grade === '4' || grade === '4_4d') {
    gradeDisplay = 'ป.4';
    indicatorLabel = 'ค 1.1 ป.4/9';
  } else if (grade === '6') {
    gradeDisplay = 'ป.6';
    indicatorLabel = 'ทบทวน ค 1.1 ป.6/1';
  } else if (grade === 'custom') {
    gradeDisplay = 'กำหนดหลักเอง';
    indicatorLabel = 'ค 1.1';
  }
  
  return '<section class="sheet"><header class="sheet-head">'
    +'<div class="qr-box"><img class="qr-img" src="'+QR_API+'" alt="QR" /><span class="qr-label">สแกนดูวิธีคิด</span></div>'
    +'<div class="sheet-title"><h2>➗ ใบงานการหารยาว — ชั้น '+gradeDisplay+'</h2><span class="level">'+indicatorLabel+'</span></div>'
    +'<div class="school-name"><img src="'+SCHOOL_LOGO_URL+'" class="school-logo-mini" /> '+schoolName+'</div>'
    +'<div class="student"><div class="student-name"><span class="lbl">ชื่อ–นามสกุล</span><span class="blank"></span></div><div class="student-no"><span class="lbl">เลขที่</span><span class="blank"></span></div></div>'
    +'<div class="directions"><span>คำชี้แจง: ตั้งหารให้ตรงหลัก เขียนผลคูณใต้จำนวนที่หาร ขีดเส้น ลบ แล้วดึงเลขหลักถัดไปลงมา</span><span class="indicator">'+indicatorLabel+'</span></div>'
    +'</header><div class="questions count-8">'+qs+'</div>'+renderParentSlip(teacherName)
    +'<footer class="sheet-foot"><span>หน้า '+pageIdx+' / '+totalPages+'</span>'+(teacherName?`<span class="sheet-foot-teacher">ครูผู้สอน: ${teacherName}</span>`:'')+'</footer></section>';
}

function render(){
  ensureRng();
  const style = document.getElementById('selStyle').value;
  const count = 8;
  const pageCount = parseInt(document.getElementById('selPageCount').value, 10);
  const grade = document.getElementById('selGrade').value;
  const schoolName = document.getElementById('inpSchool').value.trim();
  const teacherName = document.getElementById('selTeacher').value;

  let html = style==='booklet' ? renderBookletCover(schoolName, teacherName) : '';
  for(let p=1; p<=pageCount; p++) html += renderSingleSheet(p, pageCount, style, count, grade, schoolName, teacherName);
  document.getElementById('pages').innerHTML = html;
  revealCount=0;
  syncAnswerReveal();
  if(window.KampaiWorksheetSets){
    window.KampaiWorksheetSets.writeUrl({seed:renderSeed,setId:setsUi?.getCurrentSetId?.()||undefined});
  }
}

function randomize(){
  if(window.KampaiWorksheetSets){
    renderSeed=window.KampaiWorksheetSets.newSeed();
    window.KampaiWorksheetSets.writeUrl({seed:renderSeed,clearSet:true});
  }else{
    renderSeed=Date.now()+Math.floor(Math.random()*100000);
  }
  if(setsUi?.setCurrentSetId)setsUi.setCurrentSetId('');
  render();
  if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
}
function applySetState(state){
  if(state?.config)applyConfig(state.config);
  if(state?.seed!=null)renderSeed=Number(state.seed);
  if(state?.setId&&setsUi?.setCurrentSetId)setsUi.setCurrentSetId(state.setId);
  render();
}
async function bootSets(){
  try{
    const Sets=await window.KampaiWorksheet.loadSetsModule();
    const fromUrl=Sets.getConfigFromUrl();
    if(fromUrl.seed!=null)renderSeed=Number(fromUrl.seed);
    else renderSeed=Sets.newSeed();
    setsUi=Sets.mountToolbar({
      worksheetKey:WORKSHEET_KEY,
      titlePrefix:SET_TITLE_PREFIX,
      initialSetId:fromUrl.setId||'',
      getState:()=>({
        seed:renderSeed,
        config:currentConfig(),
        title:document.getElementById('kampaiSetTitle')?.value||'',
      }),
      applyState:applySetState,
    });
    if(fromUrl.setId){
      const row=await Sets.load(fromUrl.setId);
      if(row){
        applyConfig(row.config||{});
        renderSeed=Number(row.seed);
        if(setsUi?.markTitleLoaded)setsUi.markTitleLoaded(row.title||'');
        else{
          const titleInput=document.getElementById('kampaiSetTitle');
          if(titleInput&&row.title)titleInput.value=row.title;
        }
        if(setsUi?.setCurrentSetId)setsUi.setCurrentSetId(row.id);
        render();
        if(setsUi?.setMessage)setsUi.setMessage('โหลดชุด: '+(row.title||row.id.slice(0,8)));
        return;
      }
    }
    render();
    if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(false);
  }catch(error){
    console.warn('worksheet sets unavailable',error);
    render();
  }
}

document.getElementById('btnRandom').onclick = randomize;
document.getElementById('selGrade').onchange = () => {
  syncDigitSelectors(true);
  render();
  if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
};
['selDivisorDigits', 'selDividendDigits'].forEach((id) => {
  const el = document.getElementById(id);
  if(el){
    el.onchange = () => {
      if(document.getElementById('selGrade')) document.getElementById('selGrade').value = 'custom';
      syncDigitSelectors(false);
      render();
      if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
    };
  }
});
['selStyle','selPageCount','selCount','selTeacher'].forEach((id)=>{
  document.getElementById(id).onchange=()=>{
    render();
    if(setsUi?.refreshSuggestedTitle)setsUi.refreshSuggestedTitle(true);
  };
});
document.getElementById('inpSchool').oninput = render;
document.getElementById('btnAnswerNext').onclick=revealNext;
document.getElementById('btnAnswerPrev').onclick=revealPrev;
document.getElementById('btnAnswers').onclick=toggleAllAnswers;
document.getElementById('btnPrint').onclick = () => window.KampaiWorksheet.printA4();
document.addEventListener('keydown',(event)=>{
  if(event.target.matches('input,textarea,select'))return;
  if(event.key==='ArrowRight'||event.key==='n'||event.key==='N'){event.preventDefault();revealNext()}
  if(event.key==='ArrowLeft'||event.key==='b'||event.key==='B'){event.preventDefault();revealPrev()}
});

window.KampaiWorksheet.loadTeachers();
window.render=render;
window.randomize=randomize;
bootSets();
</script>
<script src="/games/worksheet-modes.js?v=1.199.3"></script>
</body>
