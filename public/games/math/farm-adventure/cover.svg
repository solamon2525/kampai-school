<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#98FB98"/>
      <stop offset="100%" stop-color="#228B22"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#922B21"/>
    </linearGradient>
    <linearGradient id="title-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7931E"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky & Ground -->
  <rect width="1280" height="720" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1100" cy="100" r="70" fill="url(#sun)" opacity="0.9"/>
  <circle cx="1100" cy="100" r="85" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.3"/>

  <!-- Clouds -->
  <g opacity="0.8" fill="white">
    <ellipse cx="200" cy="90" rx="80" ry="35"/>
    <ellipse cx="250" cy="80" rx="60" ry="30"/>
    <ellipse cx="160" cy="85" rx="50" ry="25"/>
    <ellipse cx="700" cy="120" rx="90" ry="40"/>
    <ellipse cx="760" cy="110" rx="70" ry="32"/>
    <ellipse cx="650" cy="115" rx="55" ry="28"/>
  </g>

  <!-- Mountains -->
  <polygon points="0,450 200,280 400,450" fill="#66BB6A" opacity="0.5"/>
  <polygon points="300,450 550,230 800,450" fill="#4CAF50" opacity="0.5"/>
  <polygon points="700,450 950,300 1280,450" fill="#43A047" opacity="0.4"/>

  <!-- Ground -->
  <rect x="0" y="450" width="1280" height="270" fill="#2E7D32" rx="0"/>
  <rect x="0" y="445" width="1280" height="15" fill="#4CAF50" rx="8"/>

  <!-- Farm Fields (stripes) -->
  <g opacity="0.3">
    <rect x="50" y="520" width="200" height="25" rx="5" fill="#8B4513"/>
    <rect x="50" y="555" width="200" height="25" rx="5" fill="#A0522D"/>
    <rect x="50" y="590" width="200" height="25" rx="5" fill="#8B4513"/>
    <rect x="50" y="625" width="200" height="25" rx="5" fill="#A0522D"/>
  </g>

  <!-- Vegetables in field -->
  <text x="80" y="540" font-size="28">🥕</text>
  <text x="130" y="540" font-size="28">🥕</text>
  <text x="180" y="540" font-size="28">🥕</text>
  <text x="90" y="575" font-size="28">🌽</text>
  <text x="150" y="575" font-size="28">🌽</text>
  <text x="210" y="575" font-size="28">🌽</text>
  <text x="70" y="612" font-size="28">🍅</text>
  <text x="140" y="612" font-size="28">🍅</text>
  <text x="200" y="612" font-size="28">🍅</text>

  <!-- Barn -->
  <rect x="850" y="350" width="180" height="120" fill="url(#barn)" rx="4"/>
  <polygon points="850,355 940,280 1030,355" fill="#E74C3C"/>
  <rect x="910" y="400" width="50" height="70" fill="#5D4037" rx="4"/>
  <rect x="935" y="400" width="2" height="70" fill="#8B6914"/>
  <rect x="860" y="365" width="30" height="25" fill="#F7DC6F" rx="3"/>
  <rect x="990" y="365" width="30" height="25" fill="#F7DC6F" rx="3"/>

  <!-- Fence -->
  <g stroke="#8B4513" stroke-width="3" fill="none">
    <line x1="300" y1="460" x2="800" y2="460"/>
    <line x1="300" y1="480" x2="800" y2="480"/>
    <line x1="320" y1="445" x2="320" y2="495"/>
    <line x1="400" y1="445" x2="400" y2="495"/>
    <line x1="480" y1="445" x2="480" y2="495"/>
    <line x1="560" y1="445" x2="560" y2="495"/>
    <line x1="640" y1="445" x2="640" y2="495"/>
    <line x1="720" y1="445" x2="720" y2="495"/>
    <line x1="800" y1="445" x2="800" y2="495"/>
  </g>

  <!-- Trees -->
  <g>
    <rect x="1140" y="380" width="20" height="80" fill="#6D4C41" rx="4"/>
    <circle cx="1150" cy="360" r="45" fill="#43A047"/>
    <circle cx="1130" cy="370" r="35" fill="#388E3C"/>
    <circle cx="1170" cy="375" r="30" fill="#2E7D32"/>
  </g>
  <g>
    <rect x="1220" y="400" width="15" height="60" fill="#6D4C41" rx="3"/>
    <circle cx="1228" cy="385" r="35" fill="#4CAF50"/>
    <circle cx="1210" cy="395" r="28" fill="#388E3C"/>
  </g>

  <!-- Animals -->
  <text x="380" y="530" font-size="48">🐷</text>
  <text x="500" y="540" font-size="42">🐮</text>
  <text x="620" y="525" font-size="38">🐰</text>
  <text x="740" y="535" font-size="36">🐔</text>

  <!-- Ruler (measuring element) -->
  <g transform="translate(350, 600) rotate(-5)">
    <rect x="0" y="0" width="250" height="35" rx="4" fill="#FEF3C7" stroke="#CA8A04" stroke-width="2"/>
    <g font-size="10" fill="#78350F" font-weight="bold">
      <line x1="0" y1="28" x2="0" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="0" y="24" text-anchor="middle">0</text>
      <line x1="25" y1="28" x2="25" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="25" y="24" text-anchor="middle">1</text>
      <line x1="50" y1="28" x2="50" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="50" y="24" text-anchor="middle">2</text>
      <line x1="75" y1="28" x2="75" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="75" y="24" text-anchor="middle">3</text>
      <line x1="100" y1="28" x2="100" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="100" y="24" text-anchor="middle">4</text>
      <line x1="125" y1="28" x2="125" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="125" y="24" text-anchor="middle">5</text>
      <line x1="150" y1="28" x2="150" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="150" y="24" text-anchor="middle">6</text>
      <line x1="175" y1="28" x2="175" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="175" y="24" text-anchor="middle">7</text>
      <line x1="200" y1="28" x2="200" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="200" y="24" text-anchor="middle">8</text>
      <line x1="225" y1="28" x2="225" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="225" y="24" text-anchor="middle">9</text>
      <line x1="250" y1="28" x2="250" y2="35" stroke="#78350F" stroke-width="1.5"/>
      <text x="250" y="24" text-anchor="middle">10</text>
    </g>
  </g>

  <!-- Farmer boy character (chibi) -->
  <g transform="translate(640, 340)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="0" cy="55" rx="28" ry="35" fill="#4CAF50"/>
    <!-- Head -->
    <circle cx="0" cy="10" r="35" fill="#FFDAB9"/>
    <!-- Straw hat -->
    <ellipse cx="0" cy="-10" rx="45" ry="14" fill="#DEB887"/>
    <ellipse cx="0" cy="-15" rx="30" ry="18" fill="#D2B48C"/>
    <rect x="-25" y="-25" width="50" height="8" rx="4" fill="#C19A6B"/>
    <!-- Eyes -->
    <circle cx="-12" cy="8" r="5" fill="#333"/>
    <circle cx="12" cy="8" r="5" fill="#333"/>
    <circle cx="-10" cy="6" r="2" fill="white"/>
    <circle cx="14" cy="6" r="2" fill="white"/>
    <!-- Smile -->
    <path d="M-10,20 Q0,30 10,20" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Blush -->
    <circle cx="-20" cy="18" r="6" fill="#FFB6C1" opacity="0.5"/>
    <circle cx="20" cy="18" r="6" fill="#FFB6C1" opacity="0.5"/>
    <!-- Arms -->
    <line x1="-28" y1="45" x2="-45" y2="30" stroke="#FFDAB9" stroke-width="8" stroke-linecap="round"/>
    <line x1="28" y1="45" x2="50" y2="35" stroke="#FFDAB9" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="-12" y1="85" x2="-15" y2="110" stroke="#4CAF50" stroke-width="10" stroke-linecap="round"/>
    <line x1="12" y1="85" x2="15" y2="110" stroke="#4CAF50" stroke-width="10" stroke-linecap="round"/>
    <!-- Boots -->
    <ellipse cx="-17" cy="115" rx="14" ry="8" fill="#5D4037"/>
    <ellipse cx="17" cy="115" rx="14" ry="8" fill="#5D4037"/>
  </g>

  <!-- Title Banner -->
  <g filter="url(#shadow)">
    <rect x="180" y="50" width="700" height="100" rx="20" fill="url(#title-bg)"/>
    <rect x="180" y="50" width="700" height="100" rx="20" fill="none" stroke="white" stroke-width="3" opacity="0.4"/>
    <text x="530" y="100" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="bold" fill="white">
      Farm Adventure
    </text>
    <text x="530" y="135" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600" fill="#FEF3C7">
      ภารกิจวัดความยาวในฟาร์มมหาสนุก
    </text>
  </g>

  <!-- Subject badge -->
  <g filter="url(#shadow)">
    <rect x="440" y="160" width="200" height="36" rx="18" fill="#7C3AED"/>
    <text x="540" y="184" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">
      📐 คณิตศาสตร์ ป.4
    </text>
  </g>

  <!-- Sparkles -->
  <text x="100" y="200" font-size="24" opacity="0.7">✨</text>
  <text x="1050" y="250" font-size="28" opacity="0.7">⭐</text>
  <text x="950" y="180" font-size="20" opacity="0.6">✨</text>
  <text x="300" y="300" font-size="22" opacity="0.5">🌟</text>
  <text x="1180" y="320" font-size="18" opacity="0.6">💫</text>

  <!-- Sunflowers -->
  <text x="1080" y="460" font-size="36">🌻</text>
  <text x="1120" y="475" font-size="28">🌻</text>
  <text x="280" y="470" font-size="32">🌻</text>

  <!-- Butterfly -->
  <text x="750" y="290" font-size="24">🦋</text>
  <text x="400" y="240" font-size="20">🐝</text>
</svg>
