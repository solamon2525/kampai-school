<script>
/* CORE_START */
function mnGcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
function mnLcm(a,b){return Math.abs(a*b)/mnGcd(a,b)}
function mnSimplify(n,d){const g=mnGcd(n,d);return[n/g,d/g]}
function mnToImproper(w,n,d){return w*d+n}
function mnFromImproper(n,d){const w=Math.floor(n/d),r=n%d;if(!r)return{whole:w,numerator:0,denominator:1};const s=mnSimplify(r,d);return{whole:w,numerator:s[0],denominator:s[1]}}
function mnCompare(a,b){const left=mnToImproper(a.whole,a.numerator,a.denominator)*b.denominator,right=mnToImproper(b.whole,b.numerator,b.denominator)*a.denominator;return Math.sign(left-right)}
function mnOperate(a,b,op){const common=mnLcm(a.denominator,b.denominator),left=mnToImproper(a.whole,a.numerator,a.denominator)*(common/a.denominator),right=mnToImproper(b.whole,b.numerator,b.denominator)*(common/b.denominator),raw=op==='+'?left+right:left-right;if(raw<0)throw new Error('ผลลัพธ์ต้องไม่ติดลบ');return{common,left,right,raw,result:mnFromImproper(raw,common)}}
function mnNumberLinePosition(value,max){return Math.max(0,Math.min(1,value/max))}
window.MixedNumberCore={gcd:mnGcd,lcm:mnLcm,simplify:mnSimplify,toImproper:mnToImproper,fromImproper:mnFromImproper,compare:mnCompare,operate:mnOperate,numberLinePosition:mnNumberLinePosition};
/* CORE_END */
const MEDIA_SLUG='mixed-number-media';window.KAMPAI?.setSlug(MEDIA_SLUG);
const LESSONS=[
 {key:'meaning',title:'1. ความหมายของจำนวนคละ',lead:'จำนวนคละประกอบด้วย “จำนวนเต็ม” และ “เศษส่วนแท้” ที่อยู่รวมกัน'},
 {key:'visual',title:'2. ภาพจำนวนเต็มและส่วนที่เหลือ',lead:'นับส่วนที่เต็มก่อน แล้วอ่านส่วนที่เหลือจากหน่วยถัดไป'},
 {key:'convert',title:'3. จำนวนคละ ↔ เศษเกิน',lead:'แปลงกลับไปมาโดยรักษาปริมาณเดิมทุกครั้ง'},
 {key:'compare',title:'4. เปรียบเทียบจำนวนคละ',lead:'เทียบจำนวนเต็มก่อน หากเท่ากันจึงเปรียบเทียบส่วนเศษ'},
 {key:'operate',title:'5. บวก–ลบแบบทีละขั้น',lead:'ทำส่วนให้เท่ากัน คำนวณ ย่อ และแปลงคำตอบเป็นจำนวนคละ'},
 {key:'verify',title:'6. ตรวจคำตอบด้วยภาพและเส้นจำนวน',lead:'คำตอบต้องตรงทั้งสมการ ปริมาณในภาพ และตำแหน่งบนเส้นจำนวน'}
];
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const params=new URLSearchParams(location.search);let seed=Number(params.get('seed'))||Date.now();let random=mulberry32(seed);const pick=a=>a[Math.floor(random()*a.length)];const rand=(a,b)=>a+Math.floor(random()*(b-a+1));
function fracHtml(n,d){return'<span class="frac" data-fraction="'+n+'/'+d+'"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>'}
function mixedHtml(v){if(!v.numerator)return String(v.whole);return'<span class="mixed" data-mixed="'+v.whole+' '+v.numerator+'/'+v.denominator+'"><span>'+v.whole+'</span>'+fracHtml(v.numerator,v.denominator)+'</span>'}
function mixedText(v){return v.numerator?v.whole+' '+v.numerator+'/'+v.denominator:String(v.whole)}
function newMixed(grade){const den=pick(grade==='4'?[2,3,4,5,6,8]:[3,4,5,6,8,10,12]);return{whole:rand(1,grade==='4'?3:5),numerator:rand(1,den-1),denominator:den}}
function svgDefs(){return'<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="var(--hatch)" stroke-width="1.4"/></pattern></defs>'}
function barsHtml(v){let rows='';for(let w=0;w<v.whole+1;w++){let rect='';for(let i=0;i<v.denominator;i++){const cls=w<v.whole?'piece full':i<v.numerator?'piece part':'piece';rect+='<rect class="'+cls+'" x="'+(i*600/v.denominator)+'" y="5" width="'+(600/v.denominator)+'" height="42"/>'}rows+='<div class="bar-row"><span class="bar-label">'+(w<v.whole?'เต็ม 1':'เหลือ')+'</span><svg class="bar-svg" viewBox="0 0 600 52" role="img" aria-label="'+(w<v.whole?'หนึ่งเต็ม':v.numerator+' ส่วนจาก '+v.denominator)+'">'+svgDefs()+rect+'</svg></div>'}return rows}
function circleHtml(v){const total=v.whole*v.denominator+v.numerator,max=Math.min(total,(v.whole+1)*v.denominator);let paths='';for(let i=0;i<max;i++){const circle=Math.floor(i/v.denominator),part=i%v.denominator,a1=part*360/v.denominator-90,a2=(part+1)*360/v.denominator-90,cx=72+circle*150,cy=75,r=58,p1=[cx+r*Math.cos(a1*Math.PI/180),cy+r*Math.sin(a1*Math.PI/180)],p2=[cx+r*Math.cos(a2*Math.PI/180),cy+r*Math.sin(a2*Math.PI/180)],large=a2-a1>180?1:0,cls=i<total?(circle<v.whole?'piece full':'piece part'):'piece';paths+='<path class="'+cls+'" d="M '+cx+' '+cy+' L '+p1[0]+' '+p1[1]+' A '+r+' '+r+' 0 '+large+' 1 '+p2[0]+' '+p2[1]+' Z"/>'}return'<svg class="circle-model" style="width:100%;height:180px" viewBox="0 0 '+((v.whole+1)*150)+' 150" role="img" aria-label="ภาพวงกลมจำนวนคละ '+mixedText(v)+'">'+svgDefs()+paths+'</svg>'}
function numberLineHtml(v){const value=v.whole+(v.numerator/v.denominator),max=Math.max(2,Math.ceil(value)+1),x=45+mnNumberLinePosition(value,max)*610;let ticks='';for(let i=0;i<=max;i++){const tx=45+(i/max)*610;ticks+='<line class="tick" x1="'+tx+'" y1="47" x2="'+tx+'" y2="65"/><text class="tick-text" x="'+tx+'" y="86" text-anchor="middle">'+i+'</text>'}return'<svg class="numberline" viewBox="0 0 700 105" role="img" aria-label="'+mixedText(v)+' อยู่ระหว่าง '+v.whole+' และ '+(v.whole+1)+'"><line class="axis" x1="45" y1="56" x2="655" y2="56"/>'+ticks+'<circle class="marker" cx="'+x+'" cy="56" r="10"/><text class="tick-text" x="'+x+'" y="28" text-anchor="middle">'+mixedText(v)+'</text></svg>'}
function createProblem(topic,grade){const a=newMixed(grade);if(topic==='meaning'||topic==='visual')return{topic,a};if(topic==='convert')return{topic,a,direction:random()<.5?'toImproper':'toMixed'};if(topic==='compare'){let b=newMixed(grade);while(mnCompare(a,b)===0)b=newMixed(grade);return{topic,a,b}}if(topic==='operate'){let b=newMixed(grade),op=random()<.55?'+':'−';if(grade==='4')b={...b,denominator:a.denominator,numerator:rand(1,a.denominator-1)};if(op==='−'&&mnCompare(a,b)<0)[a.whole,b.whole,a.numerator,b.numerator,a.denominator,b.denominator]=[b.whole,a.whole,b.numerator,a.numerator,b.denominator,a.denominator];return{topic,a,b,op,calc:mnOperate(a,b,op)}}const improper=mnToImproper(a.whole,a.numerator,a.denominator),claim=random()<.5?improper:improper+pick([-2,-1,1,2]);return{topic,a,claim,correct:claim===improper}}
function lessonView(p){
  const a=p.a,imp=mnToImproper(a.whole,a.numerator,a.denominator);
  if(p.topic==='meaning')return{problem:mixedHtml(a),models:barsHtml(a),steps:['จำนวนเต็มคือ <strong>'+a.whole+'</strong> หน่วย','ส่วนที่เหลือคือ <strong>'+a.numerator+'/'+a.denominator+'</strong> หน่วย','จึงอ่านว่า <strong>'+mixedText(a)+'</strong>'],answer:'จำนวนคละ = จำนวนเต็ม + เศษส่วนแท้'};
  if(p.topic==='visual')return{problem:'ภาพนี้แทนจำนวนใด?',models:barsHtml(a)+circleHtml(a),steps:['นับภาพที่เต็มครบ ได้ <strong>'+a.whole+'</strong> เต็ม','ภาพสุดท้ายระบาย <strong>'+a.numerator+' จาก '+a.denominator+'</strong> ส่วน','เขียนเป็น '+mixedHtml(a)],answer:'ตอบ '+mixedText(a)};
  if(p.topic==='convert'){
    if(p.direction==='toImproper')return{problem:mixedHtml(a)+' = ?',models:barsHtml(a),steps:['คูณจำนวนเต็มกับตัวส่วน: <strong>'+a.whole+' × '+a.denominator+' = '+(a.whole*a.denominator)+'</strong>','บวกตัวเศษ: <strong>'+(a.whole*a.denominator)+' + '+a.numerator+' = '+imp+'</strong>','คงตัวส่วนเดิม: '+fracHtml(imp,a.denominator)],answer:mixedText(a)+' = '+imp+'/'+a.denominator};
    return{problem:fracHtml(imp,a.denominator)+' = ?',models:barsHtml(a),steps:['หาร <strong>'+imp+' ÷ '+a.denominator+'</strong>','ได้ '+a.whole+' เต็ม เศษ '+a.numerator,'จึงเป็น '+mixedHtml(a)],answer:imp+'/'+a.denominator+' = '+mixedText(a)};
  }
  if(p.topic==='compare'){
    const sign=mnCompare(a,p.b)>0?'&gt;':'&lt;';
    return{problem:mixedHtml(a)+' &nbsp; ? &nbsp; '+mixedHtml(p.b),models:barsHtml(a)+barsHtml(p.b),steps:['เปรียบเทียบจำนวนเต็ม: <strong>'+a.whole+' กับ '+p.b.whole+'</strong>','ถ้าจำนวนเต็มเท่ากัน จึงเทียบส่วนเศษ','สรุป '+mixedHtml(a)+' <strong>'+sign+'</strong> '+mixedHtml(p.b)],answer:mixedText(a)+' '+(sign==='&gt;'?'>':'<')+' '+mixedText(p.b)};
  }
  if(p.topic==='operate'){
    const c=p.calc,r=c.result;
    return{problem:mixedHtml(a)+' '+p.op+' '+mixedHtml(p.b)+' = ?',models:numberLineHtml(a),steps:['แปลงเป็นเศษเกิน: <strong>'+mnToImproper(a.whole,a.numerator,a.denominator)+'/'+a.denominator+'</strong> และ <strong>'+mnToImproper(p.b.whole,p.b.numerator,p.b.denominator)+'/'+p.b.denominator+'</strong>','ทำส่วนให้เท่ากันเป็น <strong>/'+c.common+'</strong> → '+c.left+'/'+c.common+' '+p.op+' '+c.right+'/'+c.common,'คำนวณได้ <strong>'+c.raw+'/'+c.common+'</strong>','ย่อและแปลงกลับเป็น '+mixedHtml(r)],answer:'ตอบ '+mixedText(r)};
  }
  return{problem:'คำตอบที่อ้าง: '+mixedText(a)+' = '+p.claim+'/'+a.denominator,models:barsHtml(a)+numberLineHtml(a),steps:['ภาพแสดง '+a.whole+' เต็ม กับ '+a.numerator+'/'+a.denominator,'คำนวณเศษเกิน: '+a.whole+' × '+a.denominator+' + '+a.numerator+' = <strong>'+imp+'</strong>','ตรวจตำแหน่งบนเส้นจำนวนว่าอยู่ระหว่าง '+a.whole+' และ '+(a.whole+1)],answer:p.correct?'✅ คำตอบถูกต้อง':'❌ ควรเป็น '+imp+'/'+a.denominator};
}
let state={mode:'learn',lesson:0,step:0,problem:null,practice:[],practiceIndex:0,locked:false};
const $=id=>document.getElementById(id);function renderNav(){lessonNav.innerHTML=LESSONS.map((l,i)=>'<button class="lesson-btn '+(i===state.lesson?'active':'')+'" data-lesson="'+i+'">'+l.title+'</button>').join('')}
function newLessonProblem(){state.problem=createProblem(LESSONS[state.lesson].key,gradeSelect.value);state.step=0;renderLearn()}
function renderLearn(){const lesson=LESSONS[state.lesson],view=lessonView(state.problem);lessonTitle.textContent=lesson.title;lessonLead.textContent=lesson.lead;problem.innerHTML=view.problem;models.innerHTML=view.models;stepsCard.innerHTML=view.steps.map((s,i)=>'<div class="step '+(i<state.step?'visible':'')+'"><span class="step-no">'+(i+1)+'</span><div>'+s+'</div></div>').join('')+'<div class="answer-box '+(state.step>view.steps.length?'':'hidden')+'">'+view.answer+'</div>';prevStep.disabled=state.step===0;nextStep.disabled=state.step>view.steps.length;nextStep.textContent=state.step===view.steps.length?'แสดงคำตอบ ✓':state.step>view.steps.length?'ครบทุกขั้นแล้ว':'แสดงขั้นถัดไป →';renderNav()}
function setMode(mode){state.mode=mode;modeLearn.classList.toggle('active',mode==='learn');modePractice.classList.toggle('active',mode==='practice');learnPanel.classList.toggle('hidden-mode',mode!=='learn');practicePanel.classList.toggle('hidden-mode',mode!=='practice');if(mode==='practice')startPractice()}
function practiceItems(grade){return['meaning','convert','compare','operate','verify'].map(t=>createProblem(t,grade))}
function wrongOptions(correct,p){const opts=new Set([correct]);const d=p.a.denominator,imp=mnToImproper(p.a.whole,p.a.numerator,d);while(opts.size<4){if(correct.includes('/'))opts.add(String(Math.max(1,imp+rand(-3,3)))+'/'+d);else opts.add(pick(['ถูกต้อง','ไม่ถูกต้อง','>','<','เท่ากัน']))}return[...opts].sort(()=>random()-.5)}
function practiceData(p){if(p.topic==='meaning'){const correct=mixedText(p.a);return{q:'ภาพนี้แทนจำนวนใด?',visual:barsHtml(p.a),correct,choices:wrongOptions(correct,p),why:'นับได้ '+p.a.whole+' เต็ม และเหลือ '+p.a.numerator+'/'+p.a.denominator}}if(p.topic==='convert'){const imp=mnToImproper(p.a.whole,p.a.numerator,p.a.denominator),correct=imp+'/'+p.a.denominator;return{q:mixedText(p.a)+' เขียนเป็นเศษเกินข้อใด?',visual:'',correct,choices:wrongOptions(correct,p),why:p.a.whole+' × '+p.a.denominator+' + '+p.a.numerator+' = '+imp}}if(p.topic==='compare'){const correct=mnCompare(p.a,p.b)>0?'>':'<';return{q:mixedText(p.a)+' ___ '+mixedText(p.b),visual:'',correct,choices:['>','<','=','บอกไม่ได้'],why:'เปรียบเทียบจำนวนเต็มก่อน แล้วจึงเปรียบเทียบส่วนเศษ'}}if(p.topic==='operate'){const correct=mixedText(p.calc.result);return{q:mixedText(p.a)+' '+p.op+' '+mixedText(p.b)+' = ?',visual:'',correct,choices:wrongOptions(correct,p),why:'ทำส่วนให้เท่ากันเป็น /'+p.calc.common+' แล้วคำนวณและย่อคำตอบ'}}const correct=p.correct?'ถูกต้อง':'ไม่ถูกต้อง';return{q:'ตรวจ: '+mixedText(p.a)+' = '+p.claim+'/'+p.a.denominator,visual:numberLineHtml(p.a),correct,choices:['ถูกต้อง','ไม่ถูกต้อง'],why:'ค่าที่ถูกคือ '+mnToImproper(p.a.whole,p.a.numerator,p.a.denominator)+'/'+p.a.denominator}}
function startPractice(){state.practice=practiceItems(gradeSelect.value);state.practiceIndex=0;state.locked=false;renderPractice()}
function renderPractice(){const p=state.practice[state.practiceIndex],d=practiceData(p);practiceProgress.textContent='ข้อ '+(state.practiceIndex+1)+' / 5';practiceQuestion.textContent=d.q;practiceVisual.innerHTML=d.visual;choices.innerHTML=d.choices.map(c=>'<button class="choice" data-choice="'+c.replace(/"/g,'&quot;')+'">'+c+'</button>').join('');feedback.className='feedback';feedback.textContent='เลือกคำตอบ แล้วอ่านเหตุผลเพื่อทบทวนแนวคิด';nextQuestion.disabled=true;state.locked=false;state.practiceData=d}
lessonNav.onclick=e=>{const b=e.target.closest('[data-lesson]');if(!b)return;state.lesson=Number(b.dataset.lesson);newLessonProblem()};modeLearn.onclick=()=>setMode('learn');modePractice.onclick=()=>setMode('practice');gradeSelect.onchange=()=>state.mode==='learn'?newLessonProblem():startPractice();randomBtn.onclick=()=>{seed=(seed+0x9E3779B9)>>>0;random=mulberry32(seed);history.replaceState(null,'','?seed='+seed);state.mode==='learn'?newLessonProblem():startPractice()};prevStep.onclick=()=>{state.step=Math.max(0,state.step-1);renderLearn()};nextStep.onclick=()=>{state.step++;renderLearn()};choices.onclick=e=>{const b=e.target.closest('[data-choice]');if(!b||state.locked)return;state.locked=true;const ok=b.dataset.choice===state.practiceData.correct;b.classList.add(ok?'correct':'wrong');if(!ok)[...choices.children].find(x=>x.dataset.choice===state.practiceData.correct)?.classList.add('correct');feedback.className='feedback '+(ok?'ok':'bad');feedback.textContent=(ok?'✅ ถูกต้อง — ':'❌ ทบทวนอีกครั้ง — ')+state.practiceData.why;nextQuestion.disabled=false};nextQuestion.onclick=()=>{if(state.practiceIndex<4){state.practiceIndex++;renderPractice()}else startPractice()};fullscreenBtn.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});document.addEventListener('keydown',e=>{if(state.mode!=='learn')return;if(e.key==='ArrowRight'){state.step++;renderLearn()}if(e.key==='ArrowLeft'){state.step=Math.max(0,state.step-1);renderLearn()}if(e.key.toLowerCase()==='r')randomBtn.click()});
renderNav();newLessonProblem();
</script>
</body>
