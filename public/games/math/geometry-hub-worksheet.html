<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/math/math-geometry-hub/index.html"><meta name="curriculum-indicators" content="ค 2.2 ป.4/1, ค 2.2 ป.4/2"><title>ใบงานเรขาคณิต Hub ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.14" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.14" rel="stylesheet">
<style>
.geo-fig{display:flex;justify-content:center;margin:1.5mm 0}
.geo-fig svg{width:28mm;height:18mm}
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2mm;margin:1mm 0;font-size:7.5pt;font-weight:700}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.8mm 1.5mm}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:22mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill,.q.reveal-answer .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}.count-5 .geo-fig svg{width:34mm;height:22mm}
</style>
</head><body>
<header class="toolbar"><h1>📐 ใบงานเรขาคณิต Hub</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="shape">รูปทรง</option><option value="angle">มุม</option><option value="perimeter">เส้นรอบ</option><option value="area">พื้นที่</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.14"></script><script>
const FIGS={
  tri:'<svg viewBox="0 0 80 50"><polygon points="40,4 74,46 6,46" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  sq:'<svg viewBox="0 0 80 50"><rect x="18" y="6" width="44" height="38" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  rect:'<svg viewBox="0 0 80 50"><rect x="8" y="12" width="64" height="28" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  circ:'<svg viewBox="0 0 80 50"><circle cx="40" cy="25" r="18" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  ang:'<svg viewBox="0 0 80 50"><path d="M10 40 H55 M55 40 L30 10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M45 40 A10 10 0 0 0 48 32" fill="none" stroke="currentColor"/></svg>',
  right:'<svg viewBox="0 0 80 50"><path d="M12 40 H50 V12" fill="none" stroke="currentColor" stroke-width="2"/><rect x="42" y="32" width="8" height="8" fill="none" stroke="currentColor"/></svg>'
};
const GEO_ITEMS=[
{type:'shape',prompt:'สามเหลี่ยมมีกี่ด้าน',fig:'tri',ticks:['3 ด้าน','4 ด้าน'],answer:'3 ด้าน',s1:'นับด้านจากรูป',s2:'มี 3 ด้าน',s3:'สามเหลี่ยม'},
{type:'shape',prompt:'สี่เหลี่ยมจัตุรัสต่างจากสี่เหลี่ยมผืนผ้าอย่างไร',fig:'sq',ticks:['จัตุรัสด้านเท่าทั้งหมด','เหมือนกันทุกประการ'],answer:'จัตุรัสทุกด้านเท่า · ผืนผ้าคู่ตรงข้ามเท่า',s1:'จัตุรัส 4 ด้านเท่า',s2:'ผืนผ้า 2 คู่',s3:'ต่างกันที่ด้าน'},
{type:'angle',prompt:'มุมฉาก = ? องศา',fig:'right',ticks:['90°','180°'],answer:'90°',s1:'มีเครื่องหมายมุมฉาก',s2:'=90°',s3:'90°'},
{type:'angle',prompt:'มุมแหลมกับมุมป้านต่างกันอย่างไร',fig:'ang',ticks:['แหลม <90° · ป้าน >90°','แหลม >90°'],answer:'แหลม<90° · ป้าน>90°',s1:'เทียบกับ 90°',s2:'แคบ=แหลม กว้าง=ป้าน',s3:'<90 vs >90'},
{type:'perimeter',prompt:'จัตุรัสด้าน 5 cm เส้นรอบรูป',fig:'sq',ticks:['20 cm','25 cm'],answer:'20 cm (5×4)',s1:'เส้นรอบ = รวมด้าน',s2:'5×4=20',s3:'20 cm'},
{type:'perimeter',prompt:'สี่เหลี่ยมยาว 6 กว้าง 4 เส้นรอบ',fig:'rect',ticks:['20','24'],answer:'20 (2×(6+4))',s1:'2×(ยาว+กว้าง)',s2:'2×10=20',s3:'20'},
{type:'area',prompt:'สี่เหลี่ยมยาว 5 กว้าง 3 พื้นที่',fig:'rect',ticks:['15','8'],answer:'15 ตร.หน่วย',s1:'สูตร ก×ย',s2:'5×3=15',s3:'15'},
{type:'area',prompt:'จัตุรัสด้าน 4 พื้นที่',fig:'sq',ticks:['16','8'],answer:'16',s1:'ด้าน×ด้าน',s2:'4×4=16',s3:'16'},
{type:'shape',prompt:'วงกลมมีมุมกี่มุม',fig:'circ',ticks:['0','4'],answer:'0 มุม',s1:'วงกลมเป็นเส้นโค้ง',s2:'ไม่มีมุม',s3:'0'},
{type:'angle',prompt:'มุมตรง = ? องศา',fig:'ang',ticks:['180°','90°'],answer:'180°',s1:'เป็นเส้นตรง',s2:'=180°',s3:'180°'},
{type:'perimeter',prompt:'สามเหลี่ยมด้าน 3,4,5 เส้นรอบ',fig:'tri',ticks:['12','15'],answer:'12',s1:'3+4+5',s2:'=12',s3:'12'},
{type:'area',prompt:'สูตรพื้นที่สี่เหลี่ยมคืออะไร',fig:'rect',ticks:['ก×ย','2(ก+ย)'],answer:'ก×ย (ยาว×กว้าง)',s1:'พื้นที่ ≠ เส้นรอบ',s2:'พื้นที่=ก×ย',s3:'เส้นรอบ=2(ก+ย)'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'geometry-hub',icon:'📐',title:'ใบงานเรขาคณิต Hub',subject:'คณิตศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'เรขาคณิต Hub',
  sourceMediaUrl:'/games/math/math-geometry-hub/index.html',indicators:['ค 2.2 ป.4/1','ค 2.2 ป.4/2'],
  directions:'ดูรูป · ติ๊กชนิด · หาเส้นรอบ/พื้นที่ด้วยขั้นติดป้าย',
  getItems(t){return t==='mixed'?GEO_ITEMS:GEO_ITEMS.filter(i=>i.type===t);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="geo-fig">'+FIGS[item.fig]+'</div>'
      +'<div class="tick-grid">'+item.ticks.map(t=>'<div class="tick-box">□ '+e(t)+'</div>').join('')+'</div></div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดูรูป</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 สูตร/กฎ</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.14"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.14"></script></body></html>
