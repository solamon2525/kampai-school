<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Hand Tracking Game — Template (โฟลเดอร์ 5 ไฟล์)</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  KAMPAI-SCHOOL · AR HAND TRACKING GAME TEMPLATE (โฟลเดอร์ 5 ไฟล์)
  สำหรับเกมที่ใช้มือ 2 ข้างสัมผัส/ชนวัตถุบนจอ (เช่น เจาะลูกโป่ง, รับของ)
  ───────────────────────────────────────────────────────────────────────
  ต่างจาก _template-ar (zone quiz) ตรงที่:
  • ใช้ ar.leftHand / ar.rightHand (พิกัด 2 จุด) แทน zone commit
  • ตรวจจับการชนด้วยระยะห่าง (radius) ไม่ใช่ hold-to-commit
  • รองรับ One Euro Filter สำหรับลด jitter ของพิกัดมือ
  • มี rawLeftHand/rawRightHand สำหรับดีบัก/Calibrate
  ───────────────────────────────────────────────────────────────────────
  วิธีใช้:
  1. cp -r public/games/_template-ar-hands  public/games/{subject}/{slug}
  2. แก้ config.js → SLUG = '{slug}' จริง (+ พารามิเตอร์อื่น)
  3. เขียนเกมใน game.js (ส่วน GAME LOGIC) · เนื้อหาใน data.js · สไตล์ใน style.css
  4. ออนไลน์? ตั้ง ENABLE_ONLINE: true ใน config.js (ใช้ kampai-versus)
  5. migration: NNN_seed_{slug}_game.sql (external_url = '/games/{subject}/{slug}/index.html')
  6. pnpm verify:game public/games/{subject}/{slug}   (ต้องผ่านทุก check)
  7. ทดสอบ browser จริงมีกล้อง + เครื่องไม่มีกล้อง (โหมดแตะ/คลิก fallback)
═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── วิดีโอกล้อง + Canvas (AR) ── -->
<video id="arVideo" autoplay playsinline muted></video>
<canvas id="arCanvas"></canvas>

<!-- ── จอเริ่มต้น ── -->
<div class="screen active" id="startScreen">
    <div class="card">
        <div class="logo">🖐️</div>
        <h1 class="title">AR Hand Tracking Game</h1>
        <div class="subtitle">ใช้มือทั้ง 2 ข้างแตะวัตถุบนหน้าจอ</div>
        <div id="player-chip"></div>
        <div class="hint">
            🎥 เปิดกล้องแล้วใช้ <b>มือซ้าย-ขวา</b> แตะวัตถุที่ลอยขึ้นมา<br>
            📱 ไม่มีกล้อง? <b>แตะ/คลิก</b> บนจอได้เลย
        </div>
        <div id="my-stats" style="display:none;">
            <div class="ms-cell"><div class="ms-val" id="ms-best">0</div><div class="ms-label">คะแนนสูงสุด</div></div>
            <div class="ms-cell"><div class="ms-val" id="ms-plays">0</div><div class="ms-label">เล่นไปแล้ว (ครั้ง)</div></div>
        </div>
        <div class="lb-box" id="lbBox" style="display:none">
            <h3>🏆 อันดับ</h3>
            <ul class="lb-list" id="lbList"></ul>
        </div>
        <div class="mode-row">
            <button class="btn btn-primary" id="startBtn">▶️ เริ่มเล่น</button>
            <button class="btn btn-ghost" id="onlineBtn" style="display:none">🌐 ออนไลน์</button>
        </div>
    </div>
</div>

<!-- ── จอเล่นเกม (AR overlay) ── -->
<div class="screen" id="gameScreen">
    <div class="hud">
        <button class="back-btn" id="quitBtn">🏠 ออก</button>
        <div style="display:flex; gap:8px;">
            <span class="pill" id="timerPill">⏱ 60</span>
            <span class="pill score" id="scorePill">⭐ 0</span>
        </div>
    </div>
    <!-- ตัวชี้มือ (วาดลงบน Canvas ใน game.js — ไม่ต้องใส่ HTML) -->
    <div id="status-tag"></div>
</div>

<!-- ── จอจบเกม ── -->
<div class="screen" id="resultScreen">
    <div class="card">
        <div class="logo">🎉</div>
        <h1 class="title">จบเกม!</h1>
        <div id="go-stars">☆☆☆</div>
        <div id="final-score">0</div>
        <div id="final-detail"></div>
        <div id="kampai-result"></div>
        <div class="lb-box" id="lbBoxEnd" style="display:none">
            <h3>🏆 อันดับ</h3>
            <ul class="lb-list" id="lbListEnd"></ul>
        </div>
        <div class="row">
            <button class="btn btn-primary" id="restartBtn">🔄 เล่นอีกครั้ง</button>
            <button class="btn ghost" id="homeBtn">🏠 หน้าหลัก</button>
        </div>
    </div>
</div>

</body>
</html>
