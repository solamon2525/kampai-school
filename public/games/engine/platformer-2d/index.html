<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Platformer Blueprint Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Kanit',sans-serif;overflow:hidden;touch-action:none;user-select:none;background:#0f172a}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1e293b}
#gameCanvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:16/9;background:linear-gradient(180deg,#7dd3fc 0%,#bae6fd 55%,#86efac 100%)}
#hud{position:fixed;top:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none;z-index:10;font-weight:700;font-size:clamp(14px,3vw,20px)}
#hud.on{display:flex}
.hud-pill{background:rgba(255,255,255,.9);color:#0f172a;padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;background:rgba(15,23,42,.85)}
.modal.off{display:none}
.modal-card{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:24px;text-align:center;color:#334155}
.modal-card h1{font-size:28px;color:#0369a1;margin-bottom:8px}
.modal-card p{font-size:15px;margin-bottom:12px;color:#64748b}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 24px;margin:4px;border:none;border-radius:999px;font-family:inherit;font-size:17px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#22c55e,#16a34a)}
</style>
</head>
<body>
<div id="wrap"><canvas id="gameCanvas" width="1280" height="720"></canvas></div>
<div id="hud" class="hud">
  <div class="hud-pill">⭐ <span id="scoreVal">0</span></div>
  <div class="hud-pill">⏱ <span id="timeVal">90</span></div>
  <div class="hud-pill">❤️ <span id="lifeVal">5</span></div>
  <div class="hud-pill" id="qPrompt" style="display:none;max-width:40vw;overflow:hidden;text-overflow:ellipsis">?</div>
</div>
<div id="startModal" class="modal">
  <div class="modal-card">
    <h1>🏗️ Platformer Blueprint</h1>
    <p>เก็บดาวให้ครบก่อนหมดเวลา — ใช้ลูกศรหรือปุ่มบนมือถือ</p>
    <button class="btn" id="btnStart">▶ เริ่มเกม (เดี่ยว)</button>
    <button class="btn" id="btnVersus" style="background:linear-gradient(135deg,#f59e0b,#f97316);margin-top:8px">🏁 แข่ง 2 คน</button>
  </div>
</div>
<div id="endModal" class="modal off">
  <div class="modal-card">
    <h1>จบเกม!</h1>
    <p>คะแนน</p>
    <div id="finalScore" style="font-size:42px;font-weight:800;color:#f59e0b">0</div>
    <button class="btn" id="btnRetry">เล่นอีกครั้ง</button>
  </div>
</div>
<script src="/games/kampai-sdk.js"></script>
<script src="/games/kampai-match.js"></script>
<script src="/games/kampai-versus.js"></script>
<script src="game.js"></script>
</body>
</html>
