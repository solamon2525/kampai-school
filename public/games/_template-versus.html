<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เกม 2 ผู้เล่น — Template (kampai-versus)</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  KAMPAI-SCHOOL · TEMPLATE เกมแข่ง 2 ผู้เล่น (single-file)
  ใช้เฟรมเวิร์ก kampai-versus.js — ครบ 3 โหมดจาก wiring ชุดเดียว:
    • เดี่ยว                 (ปุ่ม "เริ่มเกม")
    • 2 คนเครื่องนี้ (hot-seat) (ปุ่ม "แข่ง 2 คน" → 👫)
    • ออนไลน์ ต่างเครื่อง       (ปุ่ม "แข่ง 2 คน" → 🌐, ต่อ kampai-match)

  วิธีใช้:
  1. cp ไฟล์นี้ → public/games/{subject}/{slug}.html
  2. แก้ GAME_SLUG = '{slug}' (1 ที่)
  3. เขียนเกมใน SECTION C — ใช้ rng ที่ onPlay ส่งมา (โจทย์ตรงกันทุกตา/ทุกเครื่อง)
     + เรียก vs.report(score,{correct}) ตอนได้คะแนน
     + ใน endGame ใส่ guard: if (vs.finish(score,{correct})) return;
  4. migration: supabase/migrations/NNN_seed_{slug}_game.sql (+ game_docs)
  5. pnpm verify:game public/games/{subject}/{slug}.html   (ต้องผ่าน รวม Check 11)

  เฟรมเวิร์กรับผิดชอบ: เมนูเลือกโหมด · เลือกคู่แข่ง P2 · นับถอยหลัง · สลับตา (hot-seat) ·
  นาฬิกาตา · จอเทียบผู้ชนะ · บันทึกสถิติแชมป์ห้อง (versusEnd) · online (delegate kampai-match).
═══════════════════════════════════════════════════════════════════════════
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Kanit', sans-serif; color: #fff; overflow: hidden; }
body { background: linear-gradient(180deg, #1e3a8a, #0f172a); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#hud { display: none; align-items: center; justify-content: center; padding: 14px 18px; }
#hud.on { display: flex; }
#score { font-size: 26px; font-weight: 700; color: #FFD700; background: rgba(0,0,0,.35); padding: 4px 16px; border-radius: 999px; }
#play { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; }
#play.on { display: flex; }
#q { font-size: clamp(44px, 12vw, 80px); font-weight: 700; }
#ans { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 440px; }
.a { font-size: clamp(28px, 8vw, 40px); font-weight: 700; padding: 22px 0; min-height: 48px; border: none; border-radius: 18px; cursor: pointer; color: #1e293b; background: #f8fafc; box-shadow: 0 5px 0 #cbd5e1; }
.a:active { transform: translateY(4px); box-shadow: 0 1px 0 #cbd5e1; }
.a.correct { background: linear-gradient(135deg,#86efac,#22c55e); }
.a.wrong { background: linear-gradient(135deg,#fca5a5,#ef4444); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; background: rgba(15,23,42,.92); }
.screen.off { display: none; }
h1 { font-size: 32px; background: linear-gradient(135deg,#FFD700,#FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#final { color: #FFD700; font-size: 46px; font-weight: 700; }
.btn { padding: 14px 30px; font-family: inherit; font-size: 19px; font-weight: 600; border: none; border-radius: 999px; color: #fff; cursor: pointer; min-height: 48px; }
.btn-primary { background: linear-gradient(45deg,#22c55e,#16a34a); }
.btn-versus { background: linear-gradient(45deg,#f59e0b,#f97316); }
.btn-blue { background: linear-gradient(45deg,#3b82f6,#2563eb); }
</style>
</head>
<body>
<div id="app">
    <div id="hud"><div id="score">⭐ <span id="score-v">0</span></div></div>
    <div id="play"><div id="q">2 + 3</div><div id="ans"></div></div>
</div>

<!-- จอเริ่ม -->
<div id="start" class="screen">
    <h1>➕ แข่งบวกเลข (Template)</h1>
    <p style="color:#cbd5e1">ตอบให้ถูกมากที่สุดใน 30 วินาที</p>
    <button class="btn btn-primary" onclick="startSingle()">▶ เริ่มเกม (เดี่ยว)</button>
    <button class="btn btn-versus" onclick="vs.openMenu()">🏁 แข่ง 2 คน</button>
</div>

<!-- จอจบ (เฉพาะโหมดเดี่ยว — โหมดแข่งใช้จอเทียบผลของเฟรมเวิร์ก) -->
<div id="over" class="screen off">
    <h1>จบเกม!</h1><p>คะแนนของคุณ</p><div id="final">0</div>
    <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
    <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
</div>

<!-- ═══ KAMPAI SDK + เฟรมเวิร์ก (single source — อย่าแก้) ═══ -->
<script src="/games/kampai-sdk.js"></script>
<script>window.KAMPAI = window.KAMPAI || { isEmbed:false, ready:true, student:null, stats:null, leaderboard:[], classmates:[], onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}}, online:{available:false} };</script>
<script src="/games/kampai-match.js"></script>
<script>window.KampaiMatch = window.KampaiMatch || { create:function(){ return { available:false, openMenu:function(){ alert('โหมดออนไลน์เล่นผ่านระบบ /play เท่านั้น'); }, report:function(){}, finish:function(){}, leave:function(){} }; } };</script>
<script src="/games/kampai-versus.js"></script>
<script>window.KampaiVersus = window.KampaiVersus || { create:function(o){ var m=(window.KampaiMatch&&window.KampaiMatch.create)?window.KampaiMatch.create(o):null; return { available:false, openMenu:function(){ if(m)m.openMenu(); }, report:function(s,i){ if(m)m.report(s,i); }, finish:function(s,i){ if(m){m.finish(s,i);return true;} return false; }, leave:function(){}, mode:null }; } };</script>

<script>
/* ═══ SECTION A · ตั้งค่า ═══ */
const GAME_SLUG = 'placeholder-versus';   // ⚠️ TODO: เปลี่ยนเป็น slug จริง
const DURATION = 30;                       // วินาทีต่อตา (เดี่ยว + แข่ง ใช้ค่าเดียวกัน)
KAMPAI.setSlug(GAME_SLUG);
const $ = (id) => document.getElementById(id);

/* ═══ SECTION B · เชื่อมเฟรมเวิร์ก 2 ผู้เล่น (wire ครั้งเดียว) ═══ */
const vs = KampaiVersus.create({
    duration: DURATION,
    title: 'แข่งบวกเลข',
    rankBy: 'score',
    onPlay: ({ rng, player }) => startRound(rng, player),  // เริ่ม 1 ตา ด้วย rng (โจทย์ตรงกัน)
    onEnd:  () => { locked = true; },                       // หมดเวลา → หยุดรับคำตอบ
});

/* ═══ SECTION C · GAME LOGIC (ตัวอย่าง: ควิซบวกเลข — แทนที่ด้วยเกมของคุณ) ═══ */
let qrand = Math.random, score = 0, correct = 0, a = 0, b = 0, ans = 0, locked = false;
let singleMode = false, singleTimer = 0;

// เดี่ยว: ตั้งนาฬิกาเอง (โหมดแข่ง เฟรมเวิร์กจับเวลาให้)
function startSingle() {
    singleMode = true;
    startRound(Math.random, null);
    clearTimeout(singleTimer);
    singleTimer = setTimeout(() => { locked = true; endGame(); }, DURATION * 1000);
}

function startRound(rng, player) {
    qrand = rng || Math.random; score = 0; correct = 0; locked = false;
    if (player !== null) singleMode = false;      // อยู่ในโหมดแข่ง (P1/P2)
    $('start').classList.add('off'); $('over').classList.add('off');
    $('hud').classList.add('on'); $('play').classList.add('on');
    $('score-v').textContent = 0;
    nextQ();
}

function nextQ() {
    locked = false;
    a = 1 + (qrand() * 9 | 0); b = 1 + (qrand() * 9 | 0); ans = a + b;
    $('q').textContent = `${a} + ${b}`;
    const opts = new Set([ans]);
    while (opts.size < 4) { const r = ans + ((Math.random() * 7 | 0) - 3); if (r > 0) opts.add(r); }
    $('ans').innerHTML = [...opts].sort(() => Math.random() - 0.5)
        .map((v) => `<button class="a" onclick="answer(${v},this)">${v}</button>`).join('');
}

function answer(v, btn) {
    if (locked) return; locked = true;
    if (v === ans) {
        btn.classList.add('correct'); correct++; score += 10;
        $('score-v').textContent = score;
        KAMPAI.sound.correct();
        vs.report(score, { correct });           // ⬅️ อัปเดตคะแนน (online สด / local HUD)
        setTimeout(nextQ, 320);
    } else {
        btn.classList.add('wrong'); KAMPAI.sound.wrong();
        setTimeout(nextQ, 600);
    }
}

// จบเกม: โหมดแข่ง → เฟรมเวิร์กจัดการต่อ (จอเทียบผล) · เดี่ยว → submit + จอจบ
function endGame() {
    if (vs.finish(score, { correct })) return;   // ⬅️ guard: versus จัดการเอง
    clearTimeout(singleTimer);
    KAMPAI.sound.gameOver();
    KAMPAI.submitScore(score, { mode: 'normal', correct });
    $('hud').classList.remove('on'); $('play').classList.remove('on');
    $('final').textContent = score; $('over').classList.remove('off');
}

KAMPAI.onReady(function () { KAMPAI.sound.mountToggles(); });
</script>
</body>
</html>
