<script src="/games/worksheet-runtime.js?v=1.181.0"></script><script>
const WATER_ITEMS=[
 {type:'sequence',prompt:'เติมชื่อกระบวนการทั้ง 4 ขั้นตามลำดับ',flow:['น้ำได้รับความร้อน','ไอน้ำลอยสูง','เมฆมีหยดน้ำมาก','น้ำกลับสู่แหล่งน้ำ'],answer:'ระเหย → ควบแน่น → หยาดน้ำฟ้า → รวมตัว'},
 {type:'sequence',prompt:'เรียงเหตุการณ์จากทะเลจนกลับลงสู่พื้นดิน',flow:['ทะเล','ไอน้ำ','เมฆ','ฝน'],answer:'ทะเล → ไอน้ำ → เมฆ → ฝน'},
 {type:'sequence',prompt:'เติมขั้นที่หายไป: ระเหย → ______ → หยาดน้ำฟ้า → รวมตัว',flow:['ระเหย','?','หยาดน้ำฟ้า','รวมตัว'],answer:'ควบแน่น'},
 {type:'cause',prompt:'เพราะเหตุใดเสื้อผ้าจึงแห้งเร็วเมื่ออยู่กลางแดด',flow:['แสงอาทิตย์','น้ำในผ้า','ไอน้ำ','อากาศ'],answer:'ความร้อนทำให้น้ำระเหยเร็วขึ้น'},
 {type:'cause',prompt:'เมฆเกิดขึ้นได้อย่างไร',flow:['ไอน้ำ','อากาศเย็น','หยดน้ำเล็ก','เมฆ'],answer:'ไอน้ำเย็นลงและควบแน่นเป็นหยดน้ำเล็ก ๆ'},
 {type:'cause',prompt:'เหตุใดฝนจึงตกเมื่อเมฆมีหยดน้ำจำนวนมาก',flow:['หยดน้ำเล็ก','รวมตัว','หนักขึ้น','ตกลงมา'],answer:'หยดน้ำรวมตัวจนหนักและตกเป็นหยาดน้ำฟ้า'},
 {type:'cause',prompt:'ถ้าอากาศร้อนขึ้น การระเหยจะเปลี่ยนอย่างไร',flow:['อุณหภูมิสูง','พลังงานเพิ่ม','ระเหย','?'],answer:'การระเหยเร็วขึ้น'},
 {type:'apply',prompt:'เช้าวันหนึ่งมีหยดน้ำเกาะด้านนอกแก้วเย็น เกี่ยวกับขั้นใด',flow:['ไอน้ำ','แก้วเย็น','หยดน้ำ','สังเกต'],answer:'การควบแน่น'},
 {type:'apply',prompt:'น้ำฝนไหลลงแม่น้ำและทะเล จัดเป็นขั้นใด',flow:['ฝน','พื้นดิน','แม่น้ำ','ทะเล'],answer:'การรวมตัวหรือการสะสม'},
 {type:'apply',prompt:'เขียนเหตุผลว่าทำไมวัฏจักรน้ำจึงเกิดซ้ำได้',flow:['แสงอาทิตย์','ระเหย','ฝน','แหล่งน้ำ'],answer:'น้ำกลับสู่แหล่งน้ำและได้รับความร้อนให้ระเหยอีกครั้ง'},
 {type:'apply',prompt:'ถ้าไม่มีพลังงานจากดวงอาทิตย์ ขั้นแรกจะได้รับผลอย่างไร',flow:['ดวงอาทิตย์','ความร้อน','ระเหย','วัฏจักร'],answer:'การระเหยลดลง ทำให้วัฏจักรน้ำช้าลง'},
 {type:'apply',prompt:'ยกตัวอย่างการรวมตัวของน้ำที่พบใกล้บ้านหนึ่งอย่าง',flow:['ฝน','รางน้ำ','คลอง','แหล่งน้ำ'],answer:'เช่น น้ำฝนไหลรวมในคลองหรือบ่อ'}
];
window.WORKSHEET_CONFIG={icon:'💧',title:'ใบงานวัฏจักรน้ำ',subject:'วิทยาศาสตร์',gradeLabel:'ป.5',mediaLabel:'วัฏจักรน้ำ',sourceMediaUrl:'/games/science/water-cycle-media.html',indicators:['ว 3.2 ป.5/3'],directions:'เรียงขั้น เชื่อมเหตุผล และอธิบายวัฏจักรด้วยคำวิทยาศาสตร์',getItems(topic){return topic==='mixed'?WATER_ITEMS:WATER_ITEMS.filter(item=>item.type===topic);},buildWaterWork(item){if(item.type==='sequence'){const missing=item.flow.indexOf('?');if(missing>=0)return{line1:'ขั้นที่ขาด: '+item.answer,line2:'ลำดับ: '+item.flow.map(s=>s==='?'?item.answer.split(' → ')[0]:s).join(' → ')};return{line1:'เรียงลำดับ: '+item.answer,line2:'เชื่อม: '+item.flow.join(' → ')};}return{line1:'เชื่อมเหตุ–ผลจากแผนภาพ',line2:item.answer};},renderQuestion(item){const e=window.KampaiTopicWorksheet.escapeHtml;const work=this.buildWaterWork(item);return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div><div class="cycle-flow">'+item.flow.map((step,index)=>'<div class="cycle-step">'+e(step==='?'?'?':step)+'</div>'+(index<3?'<span class="cycle-arrow">→</span>':'')).join('')+'</div><div>คำอธิบาย/เหตุผล</div></div><div class="q-work-block"><div class="reason-line"><span class="work-fill">'+e(work.line1)+'</span></div><div class="reason-line"><span class="work-fill">'+e(work.line2)+'</span></div></div>';}};
</script><script src="/games/worksheet-topic.js?v=1.181.0"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.181.0"></script></body></html>
