<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saturnRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ca8a04" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#713f12" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Space -->
  <rect width="1280" height="720" fill="url(#spaceGrad)"/>

  <!-- Starfield Dots -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="140" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="450" cy="90" r="1" fill="#38bdf8" opacity="0.7"/>
  <circle cx="720" cy="110" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="950" cy="70" r="1.5" fill="#facc15" opacity="0.8"/>
  <circle cx="1180" cy="130" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="150" cy="620" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="340" cy="580" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="820" cy="640" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1120" cy="610" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Glowing Sun on Left Edge -->
  <circle cx="40" cy="360" r="280" fill="url(#sunGrad)" opacity="0.4"/>
  <circle cx="20" cy="360" r="160" fill="#f59e0b"/>
  <circle cx="10" cy="360" r="130" fill="#fbbf24"/>
  <circle cx="0" cy="360" r="90" fill="#fffbeb"/>

  <!-- Orbit Ellipses -->
  <ellipse cx="20" cy="360" rx="320" ry="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35"/>
  <ellipse cx="20" cy="360" rx="520" ry="240" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  <ellipse cx="20" cy="360" rx="760" ry="320" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.25"/>
  <ellipse cx="20" cy="360" rx="1020" ry="400" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.2"/>

  <!-- Mercury -->
  <circle cx="240" cy="270" r="14" fill="#a8a29e"/>

  <!-- Venus -->
  <circle cx="380" cy="440" r="22" fill="#fde047"/>

  <!-- Earth & Moon -->
  <g transform="translate(540, 260)">
    <circle cx="0" cy="0" r="28" fill="#0284c7"/>
    <circle cx="-6" cy="-6" r="12" fill="#22c55e" opacity="0.8"/>
    <circle cx="8" cy="8" r="10" fill="#15803d" opacity="0.7"/>
    <circle cx="42" cy="-15" r="7" fill="#e2e8f0"/>
  </g>

  <!-- Mars -->
  <circle cx="680" cy="450" r="18" fill="#ef4444"/>

  <!-- Jupiter -->
  <g transform="translate(860, 240)">
    <circle cx="0" cy="0" r="54" fill="#ea580c"/>
    <ellipse cx="0" cy="0" rx="54" ry="12" fill="#c2410c" opacity="0.8"/>
    <ellipse cx="0" cy="18" rx="46" ry="8" fill="#9a3412" opacity="0.9"/>
    <circle cx="22" cy="14" r="10" fill="#b91c1c"/>
  </g>

  <!-- Saturn & Ring -->
  <g transform="translate(1080, 420)">
    <ellipse cx="0" cy="0" rx="75" ry="24" fill="none" stroke="url(#saturnRing)" stroke-width="16" transform="rotate(-20)"/>
    <circle cx="0" cy="0" r="40" fill="#facc15"/>
    <ellipse cx="0" cy="0" rx="75" ry="24" fill="none" stroke="url(#saturnRing)" stroke-width="16" stroke-dasharray="120,40" transform="rotate(-20)"/>
  </g>

  <!-- Title Card Container -->
  <rect x="220" y="50" width="840" height="150" rx="24" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
  
  <text x="640" y="112" text-anchor="middle" font-family="'Sarabun', Tahoma, sans-serif" font-size="46" font-weight="800" fill="#ffffff">
    🪐 ระบบสุริยะ 3 มิติ (Solar System 3D)
  </text>
  <text x="640" y="162" text-anchor="middle" font-family="'Sarabun', Tahoma, sans-serif" font-size="22" font-weight="600" fill="#38bdf8">
    สื่อการสอนวิทยาศาสตร์ ป.4–ป.6 · โรงเรียนบ้านคำไผ่ (ว 3.1)
  </text>
</svg>
