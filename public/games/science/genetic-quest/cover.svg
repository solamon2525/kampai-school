<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#040209"/>
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Matrix/Helix Background Patterns -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="1.5">
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none"/>
      <path d="M 50 0 L 0 0 0 50"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>

  <!-- Giant Glowing DNA Double Helix (Center Right) -->
  <g transform="translate(750, 60)" filter="url(#glow)" opacity="0.75">
    <!-- Strand 1 (Pink/Teal) -->
    <path d="M 0 0 C 100 150 -100 300 0 450 C 100 600 -100 750 0 900" stroke="#f43f5e" stroke-width="8" fill="none"/>
    <!-- Strand 2 -->
    <path d="M 0 0 C -100 150 100 300 0 450 C -100 600 100 750 0 900" stroke="#10b981" stroke-width="8" fill="none"/>
    
    <!-- Base Pairs (Crossbars) -->
    <line x1="-48" y1="75" x2="48" y2="75" stroke="#3b82f6" stroke-width="4"/>
    <line x1="-86" y1="150" x2="86" y2="150" stroke="#fbbf24" stroke-width="4"/>
    <line x1="-48" y1="225" x2="48" y2="225" stroke="#3b82f6" stroke-width="4"/>
    <line x1="48" y1="375" x2="-48" y2="375" stroke="#f43f5e" stroke-width="4"/>
    <line x1="86" y1="450" x2="-86" y2="450" stroke="#10b981" stroke-width="4"/>
    <line x1="48" y1="525" x2="-48" y2="525" stroke="#fbbf24" stroke-width="4"/>

    <!-- Nodes -->
    <circle cx="-86" cy="150" r="10" fill="#fbbf24"/>
    <circle cx="86" cy="150" r="10" fill="#fbbf24"/>
    <circle cx="-86" cy="450" r="10" fill="#10b981"/>
    <circle cx="86" cy="450" r="10" fill="#10b981"/>
  </g>

  <!-- Glowing Treasure Chest (Left/Center bottom) -->
  <g transform="translate(180, 240)" filter="url(#glow)">
    <!-- Chest Body (Holographic Sci-Fi Chest) -->
    <rect x="0" y="80" width="340" height="220" rx="30" fill="rgba(17, 24, 39, 0.8)" stroke="#a78bfa" stroke-width="6"/>
    
    <!-- Chest Lid (Semi-Opened) -->
    <path d="M -20 80 Q 170 -40 360 80 Z" fill="rgba(17, 24, 39, 0.9)" stroke="#fbbf24" stroke-width="6"/>
    
    <!-- Glowing Treasure from Inside -->
    <path d="M 20 80 Q 170 30 320 80 Z" fill="url(#glow-gold)" opacity="0.8"/>
    
    <!-- DNA spirals popping out of the chest -->
    <text x="170" y="60" fill="#3b82f6" font-family="Fredoka One" font-size="54" text-anchor="middle" filter="url(#glow)">🧬</text>
    <text x="70" y="40" fill="#f43f5e" font-family="Fredoka One" font-size="44" text-anchor="middle" filter="url(#glow)">🧬</text>
    <text x="270" y="30" fill="#10b981" font-family="Fredoka One" font-size="40" text-anchor="middle" filter="url(#glow)">🧬</text>

    <!-- Key Lock -->
    <rect x="140" y="70" width="60" height="50" rx="10" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
    <circle cx="170" cy="90" r="8" fill="#111827"/>
    <rect x="167" y="96" width="6" height="15" fill="#111827"/>
  </g>

  <!-- Glowing floating icons around chest -->
  <g transform="translate(100, 180)" filter="url(#glow)" stroke="#60a5fa" stroke-width="2" fill="none">
    <circle cx="30" cy="30" r="20"/>
    <text x="30" y="37" fill="#60a5fa" stroke="none" font-family="Prompt" font-weight="bold" font-size="20" text-anchor="middle">A</text>
  </g>
  <g transform="translate(560, 200)" filter="url(#glow)" stroke="#f472b6" stroke-width="2" fill="none">
    <circle cx="30" cy="30" r="20"/>
    <text x="30" y="37" fill="#f472b6" stroke="none" font-family="Prompt" font-weight="bold" font-size="20" text-anchor="middle">T</text>
  </g>
  <g transform="translate(480, 420)" filter="url(#glow)" stroke="#34d399" stroke-width="2" fill="none">
    <circle cx="30" cy="30" r="20"/>
    <text x="30" y="37" fill="#34d399" stroke="none" font-family="Prompt" font-weight="bold" font-size="20" text-anchor="middle">C</text>
  </g>

  <!-- Header badges (Top Left) -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="160" height="40" rx="12" fill="#2563eb" opacity="0.9"/>
    <text x="80" y="26" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">วิทยาศาสตร์ ป.6</text>
  </g>
  <g transform="translate(260, 70)">
    <rect x="0" y="0" width="180" height="40" rx="12" fill="#7c3aed" opacity="0.9"/>
    <text x="90" y="26" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Phaser 3 Engine</text>
  </g>

  <!-- Title / Logo Banner (Bottom / Right) -->
  <g transform="translate(800, 480)">
    <!-- Plate -->
    <rect x="-240" y="-30" width="480" height="150" rx="30" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(255,255,255,0.15)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Thai Title -->
    <text x="0" y="32" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="900" font-size="36" letter-spacing="2" text-anchor="middle">
      ล่าสมบัติพันธุศาสตร์
    </text>
    
    <!-- English Subtitle -->
    <text x="0" y="76" fill="#fbbf24" font-family="Fredoka One, Prompt" font-weight="bold" font-size="22" letter-spacing="3" text-anchor="middle">
      GENETIC TREASURE QUEST
    </text>
    
    <!-- Mini details -->
    <text x="0" y="105" fill="#9ca3af" font-family="Prompt" font-size="13" text-anchor="middle">
      ตอบคำถามเพื่อสะสมยีนและชิ้นส่วนดีเอ็นเอ
    </text>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M 640 120 L 645 135 L 660 140 L 645 145 L 640 160 L 635 145 L 620 140 L 635 135 Z" fill="#fbbf24" filter="url(#glow)"/>
  <path d="M 400 480 L 403 490 L 413 493 L 403 496 L 400 506 L 397 496 L 387 493 L 397 490 Z" fill="#60a5fa" filter="url(#glow)"/>
</svg>
