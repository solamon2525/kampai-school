<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#166534"/><stop offset="0.55" stop-color="#14532d"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="180" y="600" font-size="240" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🔬</text>
  <text x="1110" y="170" font-size="200" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🧪</text>

  <g transform="translate(640,118)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · วิทยาศาสตร์</text>
  </g>
  <text x="640" y="290" font-size="124" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">จำแนกวิทย์</text>
  <text x="640" y="378" font-size="38" font-weight="700" fill="#cbd5e1" text-anchor="middle" dominant-baseline="middle">ดูสิ่งของ → จัดกลุ่มให้ถูก</text>

  <!-- example: item + 4 category chips -->
  <g transform="translate(640,520)">
    <text x="-380" y="0" font-size="86" text-anchor="middle" dominant-baseline="middle">🐶</text>
    <g dominant-baseline="middle" text-anchor="middle" font-weight="700">
      <rect x="-300" y="-38" width="118" height="76" rx="16" fill="#f8fafc"/><text x="-241" y="4" fill="#1e293b" font-size="30">พืช</text>
      <rect x="-174" y="-38" width="118" height="76" rx="16" fill="url(#gold)" stroke="#fff7e0" stroke-width="4"/><text x="-115" y="4" fill="#0f172a" font-size="30">สัตว์</text>
      <rect x="-48" y="-38" width="118" height="76" rx="16" fill="#f8fafc"/><text x="11" y="4" fill="#1e293b" font-size="28">มนุษย์</text>
      <rect x="78" y="-38" width="138" height="76" rx="16" fill="#f8fafc"/><text x="147" y="4" fill="#1e293b" font-size="22">ไม่มีชีวิต</text>
    </g>
  </g>
  <g transform="translate(640,642)">
    <rect x="-210" y="-24" width="420" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="24" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">🔥 สิ่งมีชีวิต · สถานะสสาร · ที่อยู่อาศัย · ออนไลน์</text>
  </g>
</svg>
