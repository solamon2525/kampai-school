<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- ดาว -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="180" cy="120" r="3"/><circle cx="1080" cy="90" r="4"/><circle cx="980" cy="220" r="2.5"/>
    <circle cx="320" cy="240" r="2.5"/><circle cx="1150" cy="360" r="3"/><circle cx="120" cy="420" r="2.5"/>
  </g>
  <!-- แถบพลัง -->
  <rect x="1090" y="180" width="60" height="380" rx="30" fill="rgba(255,255,255,0.14)"/>
  <rect x="1090" y="320" width="60" height="240" rx="30" fill="url(#meter)"/>
  <!-- จรวด -->
  <text x="300" y="450" font-size="240" text-anchor="middle">🚀</text>
  <!-- หัวเรื่อง -->
  <text x="660" y="180" text-anchor="middle" font-family="'Fredoka One','Sarabun',sans-serif" font-size="116" font-weight="800" fill="#ffffff" stroke="#3b0764" stroke-width="8" paint-order="stroke">จรวดพลังงาน</text>
  <text x="640" y="600" text-anchor="middle" font-family="'Sarabun',sans-serif" font-size="44" font-weight="700" fill="#fde68a">ขยับตัว/วิ่งอยู่กับที่ เติมพลัง → ปล่อยจรวด!</text>
  <text x="640" y="656" text-anchor="middle" font-family="'Sarabun',sans-serif" font-size="29" fill="#fdba74">AR พลังการเคลื่อนไหว · วิทยาศาสตร์พลังงาน</text>
</svg>
