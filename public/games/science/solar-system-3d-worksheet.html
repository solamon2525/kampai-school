  subject: 'วิทยาศาสตร์',

  mediaLabel: 'สื่อระบบสุริยะ 3D',
  sourceMediaUrl:'/games/science/solar-system-3d-media.html',

  getItems(topic) {
    const selGrade = document.getElementById('selGrade')?.value || 'all';
    let pool = ITEMS;
    if (selGrade && selGrade !== 'all') {
      pool = pool.filter(it => it.grade === selGrade || it.grade === 'all');
    }
    if (topic && topic !== 'mixed') {
      pool = pool.filter(it => it.type === topic);
    }
    // If filtered pool is too small, fallback gracefully to topic match
    if (pool.length === 0 && topic && topic !== 'mixed') {
      pool = ITEMS.filter(it => it.type === topic);
    }
    return pool;
  },
  renderQuestion(item) {
    const e = window.KampaiTopicWorksheet.escapeHtml;
    const gradeBadge = item.grade === 'p4' ? ' [ป.4]' : item.grade === 'p5' ? ' [ป.5]' : item.grade === 'p6' ? ' [ป.6]' : '';
    return '<div class="work-line reason-line" style="font-size:1.02rem">' +
      '<div class="prompt"><strong>' + e(item.prompt) + '<span style="font-size:0.85em; color:#0284c7; font-weight:700;">' + gradeBadge + '</span></strong></div>' +
      '<div class="answer-line" style="min-height:2.2em; margin-top:6px;">' +
        'คำตอบ: <span class="blank long"></span>' +
      '</div>' +
      '<div class="reason-line" style="min-height:2.4em; border-bottom:2px dotted #94a3b8; margin-top:4px;">' +
        'เหตุผล/กระบวนการคิด: <span class="blank long"></span>' +
      '</div>' +
      '<div class="answer teacher-answer" style="margin-top:6px; color:#15803d; font-weight:700;">' +
        'เฉลย: ' + e(item.answer) +
      '</div>' +
    '</div>';
  }
};
