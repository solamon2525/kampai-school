<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.25" stop-color="#38bdf8"/><stop offset="0.6" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tankwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.25"/><stop offset="1" stop-color="#075985" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.35"/><stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="290" rx="680" ry="380" fill="url(#glow)"/>
  <text x="150" y="610" font-size="190" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🪨</text>
  <text x="1140" y="180" font-size="170" opacity="0.07" text-anchor="middle" dominant-baseline="middle">🎈</text>

  <!-- ป้ายหัว -->
  <g transform="translate(640,98)">
    <rect x="-260" y="-26" width="520" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#e0f2fe" text-anchor="middle" dominant-baseline="middle">💧 KAMPAI · วิทยาศาสตร์ ป.4–5 · แรงลอยตัว</text>
  </g>
  <!-- ชื่อเกม -->
  <text x="640" y="232" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="1">จม หรือ ลอย?</text>
  <text x="640" y="312" font-size="32" font-weight="700" fill="#e0f2fe" text-anchor="middle" dominant-baseline="middle">ทายแล้วดูของจม ⬇️ หรือ ลอย ⬆️ ในถังน้ำ</text>

  <!-- ถังน้ำ -->
  <g transform="translate(640,520)">
    <rect x="-330" y="-150" width="660" height="320" rx="26" fill="url(#tankwater)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6" filter="url(#sh)"/>
    <!-- ผิวน้ำ -->
    <line x1="-330" y1="-78" x2="330" y2="-78" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
    <rect x="-327" y="-78" width="654" height="245" rx="20" fill="#38bdf8" opacity="0.18"/>

    <!-- ของลอย (เหนือ/ที่ผิวน้ำ) -->
    <g font-size="72" text-anchor="middle">
      <text x="-200" y="-90" dominant-baseline="central">🪵</text>
      <text x="0" y="-104" dominant-baseline="central">🦆</text>
      <text x="200" y="-92" dominant-baseline="central">🍎</text>
    </g>
    <!-- ของจม (ก้นถัง) -->
    <g font-size="66" text-anchor="middle" opacity="0.95">
      <text x="-180" y="118" dominant-baseline="central">🪨</text>
      <text x="20" y="128" dominant-baseline="central">🔑</text>
      <text x="200" y="118" dominant-baseline="central">🪙</text>
    </g>
    <!-- ลูกศรบอกทิศ -->
    <text x="-300" y="-92" font-size="40" font-weight="800" fill="#67e8f9" text-anchor="middle" dominant-baseline="central">⬆️</text>
    <text x="300" y="120" font-size="40" font-weight="800" fill="#1e40af" text-anchor="middle" dominant-baseline="central">⬇️</text>
  </g>

  <!-- ป้ายล่าง -->
  <g transform="translate(640,684)">
    <rect x="-320" y="-24" width="640" height="48" rx="24" fill="#0ea5e9" opacity="0.30"/>
    <text x="0" y="2" font-size="22" font-weight="700" fill="#e0f2fe" text-anchor="middle" dominant-baseline="middle">เรียนรู้แรงลอยตัว · 24 สิ่งของ · แข่งเร็ว / ฝึกหัด / 🌐 ออนไลน์</text>
  </g>
</svg>
