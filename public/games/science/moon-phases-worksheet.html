<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/science/moon-phases-media.html"><meta name="curriculum-indicators" content="ว 3.1 ป.4/1, ว 3.1 ป.4/2"><title>ใบงานดวงจันทร์และข้างขึ้น ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.181.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.181.0" rel="stylesheet">
<style>
.moon-row{display:flex;gap:1.5mm;justify-content:center;flex-wrap:wrap;margin:1mm 0}
.moon{width:8mm;height:8mm;border-radius:50%;border:1.4px solid var(--ws-ink);background:var(--ws-paper);position:relative;box-sizing:border-box}
.moon.half::after{content:'';position:absolute;inset:0;left:50%;background:var(--ws-ink);border-radius:0 50% 50% 0}
.moon.full{background:var(--ws-ink)}
.moon.new{background:var(--ws-muted);opacity:.35}
.moon.ask{outline:1.5px dashed var(--ws-accent-2);outline-offset:1px}
.moon.ask::before{content:'?';position:absolute;inset:0;display:grid;place-items:center;font-size:7pt;font-weight:800;color:var(--ws-accent)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:18mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .moon{width:9.5mm;height:9.5mm}
.count-5 .step-row{min-height:8.5mm}
</style>

  getItems(topic){return topic==='mixed'?MOON_ITEMS:MOON_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const moons=(item.moons||['new','half','full']).map(c=>'<i class="moon '+c+'"></i>').join('');
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="moon-row">'+moons+'</div>'
      +'<div class="cycle-flow">'+item.flow.map((s,i)=>'<div class="cycle-step">'+e(s)+'</div>'+(i<item.flow.length-1?'<span class="cycle-arrow">→</span>':'')).join('')+'</div></div>'
