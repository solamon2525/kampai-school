ลังงานน้อย อนุภาคเคลื่อนที่น้อยลงและอยู่ใกล้กัน จึงเป็นของแข็ง'},{label:'แก๊ส',correct:false,explain:'แก๊สต้องมีพลังงานมากกว่าเพื่อให้อานุภาคเคลื่อนที่และกระจายออก'}]},{question:'ถ้าเพิ่มความร้อนให้น้ำมากขึ้น อนุภาคจะเป็นอย่างไร?',options:[{label:'เคลื่อนที่เร็วขึ้น',correct:true,explain:'ถูกต้อง ความร้อนเพิ่มพลังงานให้อนุภาค จึงเคลื่อนที่เร็วขึ้นและอาจเปลี่ยนเป็นแก๊ส'},{label:'หยุดนิ่งสนิท',correct:false,explain:'ความร้อนทำให้อนุภาคมีพลังงานมากขึ้น ไม่ได้ทำให้หยุดนิ่ง'}]},{question:'ไอน้ำต่างจากควันอย่างไร?',options:[{label:'ไอน้ำคือแก๊สของน้ำ ไม่ใช่ควัน',correct:true,explain:'ถูกต้อง ไอน้ำจริง ๆ มองไม่เห็น ส่วนควันเป็นอนุภาคจากการเผาไหม้ที่ลอยในอากาศ'},{label:'ไอน้ำคือควันสีขาวทุกชนิด',correct:false,explain:'ไม่ใช่ ควันกับไอน้ำเกิดจากคนละกระบวนการ'}]}]},practice:{title:'เช็กความเข้าใจเรื่องสถานะของสสาร',question:'ข้อใดอธิบายไอน้ำได้ถูกต้องที่สุด?',options:[{label:'ไอน้ำคือแก๊สของน้ำ และไม่ใช่ควัน',correct:true,explain:'ถูกต้อง ไอน้ำคือสถานะแก๊สของน้ำ ส่วนควันเป็นอนุภาคจากการเผาไหม้'},{label:'ไอน้ำคือน้ำแข็งที่ลอยอยู่',correct:false,explain:'ยังไม่ถูก ไอน้ำเกิดจากน้ำได้รับพลังงานจนอนุภาคกระจายเป็นแก๊ส'},{label:'ไอน้ำเป็นสารใหม่ที่ไม่เกี่ยวกับน้ำ',correct:false,explain:'ไม่ใช่ การเปลี่ยนสถานะยังเป็นสารเดิมคือน้ำ'}]}};</script><script src="/games/media-lab-runtime.js?v=1.0.0" defer></script></head><body><div id="media-root"></div><button data-mode="learn" hidden>อ่าน</button><button data-mode="practice" hidden>ฝึก</button></body></html>
