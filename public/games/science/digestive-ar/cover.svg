<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Tech Grid Overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>

  <!-- Decorative Science Elements (Floating) -->
  <!-- DNA Helix -->
  <g transform="translate(100, 120)" opacity="0.25" stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#glow-blue)">
    <path d="M 0 0 Q 30 -30 60 0 T 120 0 Q 150 30 180 0"/>
    <path d="M 0 0 Q 30 30 60 0 T 120 0 Q 150 -30 180 0"/>
    <line x1="30" y1="-15" x2="30" y2="15"/>
    <line x1="90" y1="-15" x2="90" y2="15"/>
    <line x1="150" y1="-15" x2="150" y2="15"/>
    <circle cx="30" cy="-15" r="5" fill="#38bdf8"/>
    <circle cx="30" cy="15" r="5" fill="#f472b6"/>
    <circle cx="90" cy="-15" r="5" fill="#f472b6"/>
    <circle cx="90" cy="15" r="5" fill="#38bdf8"/>
  </g>

  <!-- Lab Flask -->
  <g transform="translate(1120, 520)" opacity="0.3" stroke="#f472b6" stroke-width="4" fill="none" filter="url(#glow-pink)">
    <path d="M 20 0 L 40 0 M 30 0 L 30 30 L 10 70 A 10 10 0 0 0 20 85 L 60 85 A 10 10 0 0 0 70 70 L 50 30 L 50 0"/>
    <path d="M 18 55 L 62 55" stroke-dasharray="4 4"/>
    <circle cx="32" cy="45" r="3" fill="#f472b6"/>
    <circle cx="48" cy="68" r="4" fill="#38bdf8"/>
  </g>

  <!-- Holographic Circles / Tech Orbs -->
  <circle cx="640" cy="360" r="280" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 15" opacity="0.2"/>
  <circle cx="640" cy="360" r="320" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="5 8" opacity="0.15"/>

  <!-- Left/Right Hologram Laser Paths -->
  <path d="M 220 220 C 350 200 480 300 550 310" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <path d="M 1060 220 C 930 200 800 300 730 310" stroke="rgba(244, 114, 182, 0.4)" stroke-width="3" stroke-dasharray="8 6" fill="none"/>

  <!-- Left & Right Glowing Interface Boxes (Representing DropZones) -->
  <rect x="120" y="240" width="180" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-blue)" opacity="0.6"/>
  <text x="210" y="285" fill="#38bdf8" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" opacity="0.8">ปาก (Mouth)</text>

  <rect x="980" y="240" width="180" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#f472b6" stroke-width="2" filter="url(#glow-pink)" opacity="0.6"/>
  <text x="1070" y="285" fill="#f472b6" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" opacity="0.8">ตับ (Liver)</text>

  <!-- Holographic Anatomy Character Torso -->
  <g transform="translate(440, 100)">
    <!-- Body Outline (Transparent Sci-Fi look) -->
    <rect x="70" y="140" width="260" height="400" rx="60" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4"/>
    <circle cx="200" cy="70" r="70" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3"/>
    
    <!-- Neon Digestive Organs -->
    <!-- Esophagus -->
    <path d="M 200 130 C 195 190, 205 210, 200 240" stroke="#f472b6" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glow-pink)"/>
    <!-- Stomach -->
    <path d="M 200 240 C 240 230, 270 280, 230 300 C 190 320, 180 270, 200 240" fill="#ef4444" stroke="#f87171" stroke-width="2" filter="url(#glow-pink)"/>
    <!-- Liver -->
    <path d="M 150 250 C 190 230, 220 250, 210 280 C 185 285, 140 275, 150 250" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
    <!-- Small Intestine -->
    <path d="M 220 300 Q 160 330, 190 360 Q 240 330, 210 390" stroke="#fbcfe8" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Large Intestine -->
    <path d="M 170 390 C 150 320, 250 320, 230 390" stroke="#22c55e" stroke-width="20" stroke-dasharray="12 6" fill="none" stroke-linecap="round" filter="url(#glow-blue)"/>
  </g>

  <!-- AR Gesture / Hand Interaction Overlay -->
  <!-- Hand skeletal pointer overlaying the body -->
  <g transform="translate(680, 260)" stroke="#38bdf8" stroke-width="4" fill="none" filter="url(#glow-blue)">
    <!-- Wrist -->
    <circle cx="100" cy="200" r="6" fill="#38bdf8"/>
    <!-- Palm lines -->
    <line x1="100" y1="200" x2="60" y2="120"/>
    <line x1="100" y1="200" x2="100" y2="100"/>
    <!-- Index Finger (Pointing/Pinching) -->
    <path d="M 60 120 L 40 70 L 10 50"/>
    <circle cx="60" cy="120" r="5" fill="#38bdf8"/>
    <circle cx="40" cy="70" r="5" fill="#38bdf8"/>
    <circle cx="10" cy="50" r="8" fill="#f472b6" stroke="#fff" stroke-width="2" filter="url(#glow-pink)"/> <!-- Laser target point -->
    
    <!-- Thumb (Pinching) -->
    <path d="M 100 100 L 70 75 L 30 65"/>
    <circle cx="100" cy="100" r="5" fill="#38bdf8"/>
    <circle cx="70" cy="75" r="5" fill="#38bdf8"/>
    <circle cx="30" cy="65" r="5" fill="#38bdf8"/>
    
    <!-- Laser connector connecting pinch -->
    <path d="M 10 50 Q 20 57 30 65" stroke="#4ade80" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Game Title and Banner -->
  <g transform="translate(640, 570)">
    <!-- Glassmorphic Banner Plate -->
    <rect x="-420" y="0" width="840" height="110" rx="25" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.15)" stroke-width="2" filter="url(#glow-blue)"/>
    
    <!-- Title Text -->
    <text x="0" y="42" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="900" font-size="34" letter-spacing="3" text-anchor="middle">
      ระบบย่อยอาหารมหัศจรรย์
    </text>
    <text x="0" y="78" fill="#38bdf8" font-family="Fredoka One, Prompt, sans-serif" font-weight="bold" font-size="22" letter-spacing="4" text-anchor="middle">
      DIGESTIVE SYSTEM AR EXPLORER
    </text>
  </g>

  <!-- Grade Level & Subject Badges -->
  <g transform="translate(1080, 50)">
    <rect x="0" y="0" width="140" height="36" rx="10" fill="#db2777" opacity="0.9"/>
    <text x="70" y="23" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">วิทยาศาสตร์ ป.4-6</text>
  </g>
  <g transform="translate(930, 50)">
    <rect x="0" y="0" width="140" height="36" rx="10" fill="#0284c7" opacity="0.9"/>
    <text x="70" y="23" fill="#ffffff" font-family="Prompt, Kanit, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">กล้อง AR &amp; Touch</text>
  </g>
</svg>
