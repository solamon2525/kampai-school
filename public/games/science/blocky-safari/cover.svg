<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="60%" stop-color="#87ceeb" />
      <stop offset="100%" stop-color="#b3e5fc" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7cb342" />
      <stop offset="100%" stop-color="#558b2f" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8d6e63" />
      <stop offset="100%" stop-color="#5d4037" />
    </linearGradient>
    
    <!-- Title Gradients & Effects -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c8e6c9" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1b5e20" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1280" height="480" fill="url(#skyGrad)" />
  
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="80" y="80" width="180" height="60" rx="30" />
    <rect x="140" y="50" width="160" height="80" rx="40" />
    
    <rect x="920" y="100" width="220" height="60" rx="30" />
    <rect x="990" y="70" width="140" height="80" rx="40" />
  </g>

  <!-- Sun -->
  <circle cx="640" cy="180" r="100" fill="#fff9c4" opacity="0.3" filter="url(#glow)" />
  <circle cx="640" cy="180" r="80" fill="#fffde7" opacity="0.6" />

  <!-- Mountain Silhouettes -->
  <path d="M-50,480 L150,300 L400,480 Z" fill="#b2dfdb" opacity="0.4" />
  <path d="M250,480 L550,260 L850,480 Z" fill="#80cbc4" opacity="0.5" />
  <path d="M750,480 L1050,280 L1350,480 Z" fill="#4db6ac" opacity="0.4" />

  <!-- Ground / Hills -->
  <ellipse cx="640" cy="650" rx="800" ry="250" fill="url(#grassGrad)" />
  <ellipse cx="200" cy="680" rx="500" ry="200" fill="#689f38" />
  <ellipse cx="1100" cy="700" rx="600" ry="220" fill="#33691e" />

  <!-- Blocky Trees (Left side) -->
  <g transform="translate(100, 320)">
    <!-- Trunk -->
    <rect x="30" y="100" width="20" height="120" fill="url(#trunkGrad)" />
    <!-- Leaves (Cube/Isometric style) -->
    <rect x="0" y="20" width="80" height="80" rx="10" fill="url(#treeGrad)" />
    <rect x="15" y="0" width="50" height="30" rx="5" fill="#81c784" />
  </g>
  <g transform="translate(220, 360)">
    <rect x="20" y="80" width="15" height="100" fill="url(#trunkGrad)" />
    <rect x="0" y="15" width="55" height="70" rx="8" fill="url(#treeGrad)" />
  </g>

  <!-- Blocky Trees (Right side) -->
  <g transform="translate(1080, 330)">
    <rect x="30" y="100" width="20" height="120" fill="url(#trunkGrad)" />
    <rect x="0" y="20" width="80" height="80" rx="10" fill="url(#treeGrad)" />
  </g>
  <g transform="translate(980, 380)">
    <rect x="20" y="60" width="12" height="80" fill="url(#trunkGrad)" />
    <rect x="-10" y="10" width="55" height="55" rx="6" fill="#388e3c" />
  </g>

  <!-- 3D Pixel/Blocky Explorer (Player) -->
  <g transform="translate(250, 480)" filter="url(#shadow)">
    <!-- Main Body -->
    <rect x="0" y="0" width="90" height="90" rx="15" fill="#1e88e5" />
    <!-- Face / Eyes -->
    <rect x="15" y="25" width="20" height="20" rx="4" fill="#ffffff" />
    <rect x="23" y="31" width="8" height="8" rx="2" fill="#000000" />
    <rect x="55" y="25" width="20" height="20" rx="4" fill="#ffffff" />
    <rect x="59" y="31" width="8" height="8" rx="2" fill="#000000" />
    <!-- Cheeks -->
    <rect x="8" y="50" width="10" height="10" fill="#f48fb1" rx="2" />
    <rect x="72" y="50" width="10" height="10" fill="#f48fb1" rx="2" />
    <!-- Explorer Hat -->
    <path d="M-10,5 L100,5 L85,-15 L5,-15 Z" fill="#d7ccc8" />
    <rect x="5" y="-5" width="80" height="10" fill="#8d6e63" />
  </g>

  <!-- Blocky Safari Animals -->
  <!-- 1. Cow (🐄) -->
  <g transform="translate(480, 520)" filter="url(#shadow)">
    <rect x="0" y="0" width="100" height="80" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" />
    <!-- Cow spots -->
    <rect x="15" y="10" width="25" height="25" rx="6" fill="#212121" />
    <rect x="60" y="40" width="30" height="30" rx="8" fill="#212121" />
    <rect x="10" y="45" width="20" height="20" rx="5" fill="#212121" />
    <!-- Eyes -->
    <rect x="20" y="20" width="8" height="15" fill="#212121" rx="2" />
    <rect x="72" y="20" width="8" height="15" fill="#212121" rx="2" />
    <!-- Snout -->
    <rect x="30" y="42" width="40" height="25" rx="6" fill="#ff80ab" />
    <circle cx="42" cy="54" r="3" fill="#c2185b" />
    <circle cx="58" cy="54" r="3" fill="#c2185b" />
    <!-- Horns -->
    <path d="M10,0 L2, -15 L15,-5 Z" fill="#cfd8dc" />
    <path d="M90,0 L98, -15 L85,-5 Z" fill="#cfd8dc" />
  </g>

  <!-- 2. Frog (🐸) -->
  <g transform="translate(680, 550)" filter="url(#shadow)">
    <rect x="0" y="0" width="70" height="60" rx="15" fill="#4caf50" />
    <!-- Frog Eyes -->
    <circle cx="18" cy="0" r="14" fill="#4caf50" />
    <circle cx="18" cy="0" r="10" fill="#ffffff" />
    <circle cx="18" cy="0" r="5" fill="#000000" />
    
    <circle cx="52" cy="0" r="14" fill="#4caf50" />
    <circle cx="52" cy="0" r="10" fill="#ffffff" />
    <circle cx="52" cy="0" r="5" fill="#000000" />
    <!-- Cheeks & Mouth -->
    <ellipse cx="12" cy="30" rx="6" ry="4" fill="#ff5722" />
    <ellipse cx="58" cy="30" rx="6" ry="4" fill="#ff5722" />
    <path d="M22,35 Q35,45 48,35" stroke="#1b5e20" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- 3. Turtle (🐢) -->
  <g transform="translate(820, 500)" filter="url(#shadow)">
    <!-- Shell -->
    <rect x="0" y="10" width="90" height="60" rx="20" fill="#2e7d32" />
    <!-- Shell Pattern -->
    <rect x="25" y="20" width="40" height="25" rx="8" fill="#1b5e20" opacity="0.6" />
    <!-- Head -->
    <rect x="75" y="20" width="30" height="25" rx="8" fill="#81c784" />
    <circle cx="90" cy="28" r="3" fill="#000000" />
    <!-- Legs -->
    <rect x="15" y="60" width="15" height="15" rx="4" fill="#81c784" />
    <rect x="60" y="60" width="15" height="15" rx="4" fill="#81c784" />
  </g>

  <!-- Game Title and Subtitle Overlay -->
  <g transform="translate(640, 260)" text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text y="0" font-family="'Kanit', sans-serif" font-weight="900" font-size="84" fill="url(#titleGrad)" stroke="#1b5e20" stroke-width="4" letter-spacing="2">BLOCKY SAFARI</text>
    <!-- Subtitle -->
    <text y="70" font-family="'Kanit', sans-serif" font-weight="800" font-size="34" fill="url(#subGrad)" letter-spacing="1">สุดยอดนักสำรวจพิทักษ์สัตว์โลก</text>
  </g>
  
  <!-- Topic Tag -->
  <g transform="translate(640, 390)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#2e7d32" filter="url(#shadow)" />
    <text text-anchor="middle" y="7" font-family="'Kanit', sans-serif" font-weight="600" font-size="20" fill="#ffffff">การจำแนกประเภทสัตว์ วิทยาศาสตร์ ป.4</text>
  </g>

</svg>
