<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/science/food-chain-media.html"><meta name="curriculum-indicators" content="ว 1.1 ป.5/2, ว 1.1 ป.5/3"><title>ใบงานห่วงโซ่อาหาร ป.4–6 — โรงเรียนบ้านคำไผ่</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=1.175.15" rel="stylesheet"><link href="/games/worksheet-modes.css?v=1.175.15" rel="stylesheet">
<style>
.tick-grid{display:grid;grid-template-columns:1fr 1fr;gap:1mm;margin-top:1mm}
.tick-box{border:1px dashed var(--ws-line);border-radius:3px;padding:.7mm 1mm;font-size:7pt;font-weight:700;color:var(--ws-muted)}
.energy-note{font-size:7pt;font-weight:700;color:var(--ws-accent-2);margin-top:.5mm}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center;line-height:1.15}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
</style>
</head><body>
<header class="toolbar"><h1>🔗 ใบงานห่วงโซ่อาหาร</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle" aria-label="รูปแบบใบงาน"><option value="standard">มาตรฐาน</option><option value="progressive">บันไดระดับ</option><option value="booklet">รวมเล่ม</option></select><select class="t-select" id="selPageCount" aria-label="จำนวนหน้า"><option value="1">1 หน้า</option><option value="2">2 หน้า</option><option value="3">3 หน้า</option></select><select class="t-select" id="selGrade" aria-label="ระดับชั้น"><option value="4">ป.4</option><option value="5">ป.5</option><option value="6">ป.6</option></select><select class="t-select" id="selTopic" aria-label="ทักษะ"><option value="mixed">ผสมทุกทักษะ</option><option value="order">เรียงลำดับ</option><option value="role">บทบาทสิ่งมีชีวิต</option><option value="apply">วิเคราะห์สถานการณ์</option></select><select class="t-select" id="selCount" aria-label="จำนวนข้อ"><option value="5" selected>5 ข้อ / หน้า</option><option value="10">10 ข้อ / หน้า</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่" aria-label="ชื่อโรงเรียน"><select class="t-select" id="selTeacher" aria-label="ครูผู้สอน"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main>
<script src="/games/worksheet-runtime.js?v=1.175.15"></script><script>
const CHAIN_ITEMS=[
 {type:'order',prompt:'เรียงห่วงโซ่: หญ้า → กวาง → ?',flow:['หญ้า','กวาง','?'],answer:'เสือ/สิงโต (ผู้ล่า)',s1:'หญ้า = ผู้ผลิต',s2:'กวางกินหญ้า',s3:'ผู้ล่ากินกวาง'},
 {type:'order',prompt:'เรียง: พืช → แมลง → กบ → ?',flow:['พืช','แมลง','กบ','?'],answer:'งู/นก (ผู้ล่าระดับถัดไป)',s1:'พืชเริ่มต้น',s2:'แมลง→กบ',s3:'ผู้ล่าระดับถัดไป'},
 {type:'order',prompt:'เติมบทบาท: ข้าว → หนู → งู',flow:['ผู้ผลิต','ผู้บริโภค 1','ผู้บริโภค 2'],answer:'ผู้ผลิต → ผู้บริโภคขั้นที่ 1 → ผู้บริโภคขั้นที่ 2',s1:'ข้าวสร้างอาหาร',s2:'หนูกินข้าว',s3:'งูกินหนู'},
 {type:'role',prompt:'พืชสีเขียวจัดเป็นบทบาทใด',flow:['พืช'],answer:'ผู้ผลิต',s1:'สร้างอาหารเอง',s2:'ใช้แสงอาทิตย์',s3:'ผู้ผลิต'},
 {type:'role',prompt:'สัตว์ที่กินพืชเป็นอาหารเรียกว่า',flow:['กินพืช'],answer:'ผู้บริโภคขั้นที่ 1 / สัตว์กินพืช',s1:'กินพืชโดยตรง',s2:'ไม่สร้างอาหารเอง',s3:'ผู้บริโภคขั้นที่ 1'},
 {type:'role',prompt:'สัตว์ที่กินเนื้อเป็นอาหารเรียกว่า',flow:['กินเนื้อ'],answer:'ผู้บริโภคขั้นที่ 2+ / สัตว์กินเนื้อ',s1:'กินสัตว์อื่น',s2:'อยู่ถัดจากกินพืช',s3:'ผู้บริโภคขั้นที่ 2+'},
 {type:'role',prompt:'จุลินทรีย์ที่ย่อยซากเรียกว่า',flow:['ย่อยสลาย'],answer:'ผู้ย่อยสลาย',s1:'ย่อยซากพืช–สัตว์',s2:'คืนแร่ธาตุสู่ดิน',s3:'ผู้ย่อยสลาย'},
 {type:'apply',prompt:'ถ้าพืชหายไป ใครได้รับผลกระทบก่อน',flow:['พืช','→','?'],answer:'สัตว์กินพืช / ผู้บริโภคขั้นที่ 1',s1:'พืชเป็นฐานพลังงาน',s2:'กินพืชอดอาหารก่อน',s3:'ผู้บริโภคขั้นที่ 1'},
 {type:'apply',prompt:'ลูกศรในห่วงโซ่อาหารแสดงอะไร',flow:['A','→','B'],answer:'ทิศทางการถ่ายทอดพลังงาน',s1:'ลูกศรชี้จากผู้ถูกกิน',s2:'ไปยังผู้กิน',s3:'แสดงการถ่ายทอดพลังงาน'},
 {type:'apply',prompt:'ทำไมห่วงโซ่จึงเริ่มจากพืช',flow:['แสงอาทิตย์','พืช'],answer:'พืชสร้างอาหารจากแสงเป็นพลังงานเริ่มต้น',s1:'ต้องการพลังงานเริ่ม',s2:'พืชรับแสงสร้างอาหาร',s3:'เป็นฐานของห่วงโซ่'},
 {type:'apply',prompt:'เขียนห่วงโซ่ในนาข้าว 1 ชุด',flow:['นา','→','?','→','?'],answer:'เช่น ข้าว → หนู → งู → นกอินทรี',s1:'เริ่มจากข้าว',s2:'ผู้กินข้าว',s3:'ผู้ล่าถัดไป'},
 {type:'apply',prompt:'ถ้าผู้ย่อยสลายหายไป จะเกิดอะไร',flow:['ซาก','→','?'],answer:'ซากสะสม แร่ธาตุคืนสู่ดินช้าลง',s1:'ซากไม่ถูกย่อย',s2:'แร่ธาตุค้าง',s3:'ระบบนิเวศเสียสมดุล'}
];
window.WORKSHEET_CONFIG={
  worksheetKey:'food-chain',icon:'🔗',title:'ใบงานห่วงโซ่อาหาร',subject:'วิทยาศาสตร์',gradeLabel:'ป.4–6',mediaLabel:'ห่วงโซ่อาหาร',
  sourceMediaUrl:'/games/science/food-chain-media.html',indicators:['ว 1.1 ป.5/2','ว 1.1 ป.5/3'],
  directions:'เรียงห่วงโซ่ · ระบุบทบาท · ลูกศร = ทิศทางพลังงาน · วิเคราะห์ผลกระทบ',
  getItems(topic){return topic==='mixed'?CHAIN_ITEMS:CHAIN_ITEMS.filter(i=>i.type===topic);},
  renderQuestion(item){
    const e=window.KampaiTopicWorksheet.escapeHtml;
    const roles=item.type==='role'||item.type==='apply'
      ?'<div class="tick-grid"><div class="tick-box">□ ผู้ผลิต</div><div class="tick-box">□ ผู้บริโภค 1</div><div class="tick-box">□ ผู้บริโภค 2+</div><div class="tick-box">□ ผู้ย่อยสลาย</div></div>':'';
    return '<div class="q-stem"><div class="q-prompt">'+e(item.prompt)+'</div>'
      +'<div class="cycle-flow">'+item.flow.map((s,i)=>'<div class="cycle-step">'+e(s)+'</div>'+(i<item.flow.length-1?'<span class="cycle-arrow">→</span>':'')).join('')+'</div>'
      +'<div class="energy-note">→ = ทิศทางพลังงาน</div>'+roles+'</div>'
      +'<div class="q-work-block step-block">'
      +'<div class="step-row"><span class="step-tag">1 ดูบทบาท</span><div class="step-body"><span class="work-fill">'+e(item.s1)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 จัดลำดับ</span><div class="step-body"><span class="work-fill">'+e(item.s2)+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.s3)+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
  }
};
</script><script src="/games/worksheet-topic.js?v=1.175.15"></script><script>function render(){window.KampaiTopicWorksheet.render();}document.getElementById('btnRandom').onclick=window.KampaiTopicWorksheet.randomize;document.getElementById('btnAnswers').onclick=()=>document.body.classList.toggle('show-answers');document.getElementById('btnPrint').onclick=()=>window.print();window.KampaiWorksheet.loadTeachers();render();</script><script src="/games/worksheet-modes.js?v=1.175.15"></script></body></html>
