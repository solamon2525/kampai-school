<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จำแนกสัตว์มี/ไม่มีกระดูกสันหลัง — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #047857; --line: #a7f3d0; --vert: #2563eb; --invt: #ea580c; --muted: #475569; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #d1fae5, #a7f3d0); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #047857, #059669); color: #fff; }
    header h1 { font-size: 1.05rem; font-weight: 800; flex: 1; min-width: 160px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .box:focus-visible, .card:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #ecfdf5; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid #6ee7b7; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: #047857; font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn-wrap { max-width: 760px; margin: 0 auto 16px; display: flex; flex-direction: column; gap: 12px; }
    .learn-wrap.hide { display: none; }
    .learn { display: grid; gap: 12px; }
    @media (min-width: 700px) { .learn { grid-template-columns: 1fr 1fr; } }
    .box { border-radius: 16px; padding: 16px; border: 3px solid; text-align: left; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 8px; color: var(--ink); }
    .box.v { border-color: var(--vert); background: #eff6ff; }
    .box.i { border-color: var(--invt); background: #fff7ed; }
    .box h3 { margin-bottom: 2px; font-size: 1.08rem; font-weight: 800; }
    .box.v h3 { color: var(--vert); }
    .box.i h3 { color: var(--invt); }
    .box p { font-weight: 600; line-height: 1.5; }
    .animals { display: flex; flex-wrap: wrap; gap: 8px; }
    .an { font-size: 1.8rem; padding: 6px 10px; background: #fff; border-radius: 12px; border: 2px solid #e2e8f0; }
    .say-hint { font-size: .8rem; font-weight: 700; color: var(--deep); margin-top: auto; }
    .sort-game { display: none; flex-direction: column; gap: 14px; max-width: 640px; margin: 0 auto; width: 100%; }
    .sort-game.on { display: flex; }
    .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 72px; padding: 12px; background: #f8fafc; border-radius: 14px; border: 2px dashed #cbd5e1; }
    .card { font-family: inherit; font-size: 2rem; padding: 10px 14px; border: 3px solid #e2e8f0; border-radius: 14px; background: #fff; cursor: pointer; transition: transform .1s; min-height: 44px; min-width: 44px; }
    .card:hover { transform: scale(1.05); }
    .card.selected { border-color: var(--deep); box-shadow: 0 0 0 3px #a7f3d0; }
    .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .bins { grid-template-columns: 1fr; } }
    .bin { min-height: 120px; border-radius: 16px; border: 3px dashed; padding: 10px; cursor: pointer; }
    .bin.v { border-color: var(--vert); background: #eff6ff; }
    .bin.i { border-color: var(--invt); background: #fff7ed; }
    .bin h4 { text-align: center; font-size: .9rem; margin-bottom: 8px; }
    .bin.v h4 { color: var(--vert); }
    .bin.i h4 { color: var(--invt); }
    .bin-cards { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .score { text-align: center; font-weight: 800; color: var(--deep); }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
    .practice.on { display: flex; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .ke-classify-card { background: #f8fafc; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-classify-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--deep); font-size: .95rem; }
    .ke-classify-item { text-align: center; padding: 18px 14px; background: #ecfdf5; border: 2px dashed #34d399; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ke-item-icon { font-size: clamp(56px, 14vw, 84px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 800; color: var(--ink); }
    .ke-buckets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 420px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
    .ke-bucket-btn[data-bucket-id="vertebrate"] { border-color: var(--vert); background: #eff6ff; color: #1e3a8a; }
    .ke-bucket-btn[data-bucket-id="invertebrate"] { border-color: var(--invt); background: #fff7ed; color: #9a3412; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: #ecfdf5; border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .ke-classify-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; }
    .speech-status.show { display: block; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .footer a { color: var(--deep); font-weight: 700; text-decoration: none; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active, .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" onclick="if(window.KAMPAI&&KAMPAI.goHome)KAMPAI.goHome();else history.back();">← กลับคลังสื่อ</button>
      <h1>🦴 สัตว์มีกระดูกสันหลัง vs ไม่มีกระดูกสันหลัง</h1>
      <span class="badge">ป.4 · วิทยาศาสตร์</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
        <button type="button" data-mode="sort">🎯 จัดกลุ่ม</button>
        <button type="button" data-mode="practice">✏️ ฝึกสั้น</button>
      </span>
      <p class="hint" id="hintText">มีกระดูกสันหลัง = มีแกนกระดูกภายในร่างกาย</p>
      <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶</button>
    </div>
    <div class="stage">
      <div class="learn-wrap" id="learnWrap">
        <div class="learn" id="learn">
          <button type="button" class="box v" data-say-bucket="vertebrate">
            <h3>🦴 สัตว์มีกระดูกสันหลัง</h3>
            <p>มี<strong>กระดูกสันหลัง</strong> ภายในร่างกาย · ช่วยพยุงและปกป้องไขสันหลัง · เช่น สัตว์เลี้ยงลูกด้วยนม นก ปลา สัตว์เลื้อยคลาน สัตว์สะเทินน้ำสะเทินบก</p>
            <div class="animals"><span class="an">🐘</span><span class="an">🐟</span><span class="an">🐦</span><span class="an">🐍</span><span class="an">🐸</span></div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
          <button type="button" class="box i" data-say-bucket="invertebrate">
            <h3>🐛 สัตว์ไม่มีกระดูกสันหลัง</h3>
            <p>ไม่มีกระดูกสันหลัง · มี<strong>เปลือกแข็งหรือลำตัวอ่อนนุ่ม</strong> · เช่น แมลง ปู หอย ปลาหมึก ไส้เดือน</p>
            <div class="animals"><span class="an">🦋</span><span class="an">🐌</span><span class="an">🦀</span><span class="an">🐙</span><span class="an">🪱</span></div>
            <span class="say-hint">🔊 แตะเพื่อฟังคำอธิบาย</span>
          </button>
        </div>
        <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
      </div>
      <div class="sort-game" id="sortGame">
        <p class="score" id="sortScore">แตะสัตว์ → แตะกล่องเพื่อจัดกลุ่ม</p>
        <div class="pool" id="pool"></div>
        <div class="bins">
          <div class="bin v" data-type="vertebrate"><h4>มีกระดูกสันหลัง</h4><div class="bin-cards" id="binV"></div></div>
          <div class="bin i" data-type="invertebrate"><h4>ไม่มีกระดูกสันหลัง</h4><div class="bin-cards" id="binI"></div></div>
        </div>
        <button type="button" class="btn btn-primary" id="btnReset">เริ่มใหม่</button>
      </div>
      <div class="practice" id="practice">
        <div class="practice-bar">
          <span class="practice-note">แตะเลือกกลุ่มสัตว์หรือกดปุ่มตัวเลข 1–2 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
          <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังโจทย์</button>
        </div>
        <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
        <div id="classifyEngineRoot"></div>
      </div>
    </div>
    <footer class="footer">ตัวชี้วัด <strong>ว 1.3 ป.4/3–4</strong> · คู่เกม <a href="/play/blocky-safari">Blocky Safari</a></footer>
  </div>
  <script>
    const MEDIA_SLUG = 'vertebrate-sort-media';
    if (window.KAMPAI) {
      window.KAMPAI.setSlug('vertebrate-sort-media');
      if (window.KAMPAI.sound && typeof window.KAMPAI.sound.mountToggles === 'function') {
        try { window.KAMPAI.sound.mountToggles(); } catch (_) {}
      }
    }

    const ANIMALS = [
      { e: '🐘', n: 'ช้าง', t: 'vertebrate', reason: 'ช้างเป็นสัตว์เลี้ยงลูกด้วยนม มีกระดูกสันหลังภายในร่างกาย' },
      { e: '🦋', n: 'ผีเสื้อ', t: 'invertebrate', reason: 'ผีเสื้อเป็นแมลง มีโครงร่างแข็งภายนอก ไม่มีกระดูกสันหลัง' },
      { e: '🐟', n: 'ปลา', t: 'vertebrate', reason: 'ปลามีก้างและกระดูกสันหลังช่วยพยุงลำตัวในน้ำ' },
      { e: '🦀', n: 'ปู', t: 'invertebrate', reason: 'ปูมีกระดองแข็งหุ้มภายนอก ไม่มีกระดูกสันหลัง' },
      { e: '🐦', n: 'นก', t: 'vertebrate', reason: 'นกมีโครงกระดูกและกระดูกสันหลังภายในร่างกาย' },
      { e: '🐌', n: 'หอยทาก', t: 'invertebrate', reason: 'หอยทากลำตัวอ่อนนุ่ม มีเปลือกหุ้ม ไม่มีกระดูกสันหลัง' },
      { e: '🐍', n: 'งู', t: 'vertebrate', reason: 'งูเป็นสัตว์เลื้อยคลาน มีกระดูกสันหลังเรียงต่อกันยาวตลอดตัว' },
      { e: '🐙', n: 'ปลาหมึก', t: 'invertebrate', reason: 'ปลาหมึกเป็นสัตว์ลำตัวอ่อนนุ่ม ไม่มีกระดูกสันหลัง' },
      { e: '🐸', n: 'กบ', t: 'vertebrate', reason: 'กบเป็นสัตว์สะเทินน้ำสะเทินบก มีกระดูกสันหลัง' },
      { e: '🪱', n: 'ไส้เดือน', t: 'invertebrate', reason: 'ไส้เดือนมีลำตัวเป็นปล้องอ่อนนุ่ม ไม่มีกระดูกสันหลัง' },
      { e: '🐱', n: 'แมว', t: 'vertebrate', reason: 'แมวเป็นสัตว์เลี้ยงลูกด้วยนม มีกระดูกสันหลัง' },
      { e: '🐝', n: 'ผึ้ง', t: 'invertebrate', reason: 'ผึ้งเป็นแมลง ไม่มีกระดูกสันหลัง' },
    ];

    const BUCKETS = [
      { id: 'vertebrate', label: 'มีกระดูกสันหลัง', icon: '🦴', say: 'สัตว์มีกระดูกสันหลัง มีแกนกระดูกสันหลังภายในร่างกาย เช่น ช้าง ปลา นก งู กบ แมว' },
      { id: 'invertebrate', label: 'ไม่มีกระดูกสันหลัง', icon: '🐛', say: 'สัตว์ไม่มีกระดูกสันหลัง ไม่มีแกนกระดูกสันหลัง มักมีเปลือกแข็งหรือลำตัวอ่อนนุ่ม เช่น ผีเสื้อ หอยทาก ปู ปลาหมึก ไส้เดือน ผึ้ง' },
    ];

    const CLASSIFY_ITEMS = ANIMALS.map((a, idx) => ({
      id: 'animal-' + idx,
      icon: a.e,
      label: a.n,
      bucketId: a.t,
      reason: a.reason,
    }));

    let mode = 'learn';
    let selected = null;
    let poolData = [];
    let classifySession = null;

    function speakText(text, statusId) {
      const clean = String(text || '').trim();
      if (!clean) return;
      const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
        const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
        if (statusEl) {
          if (res && res.ok === false) {
            statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
            statusEl.classList.add('show');
          } else {
            statusEl.textContent = '';
            statusEl.classList.remove('show');
          }
        }
        return;
      }
      try {
        if (window.KAMPAI?.sound?.speak) {
          KAMPAI.sound.speak(clean, 'th-TH', true);
          return;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(clean);
          u.lang = 'th-TH';
          u.rate = 0.92;
          window.speechSynthesis.speak(u);
          return;
        }
      } catch (_) {}
      if (statusEl) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      }
    }

    function stopSpeech() {
      if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
        window.KampaiMediaLab.stopAllSpeech();
      } else {
        try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
        try { window.speechSynthesis?.cancel?.(); } catch (_) {}
      }
    }

    function initSort() {
      poolData = [...ANIMALS].sort(() => Math.random() - 0.5);
      selected = null;
      document.getElementById('binV').innerHTML = '';
      document.getElementById('binI').innerHTML = '';
      document.getElementById('pool').innerHTML = poolData.map((a, i) =>
        `<button type="button" class="card" data-i="${i}" title="${a.n}" aria-label="${a.n}">${a.e}</button>`
      ).join('');
      document.getElementById('sortScore').textContent = 'แตะสัตว์ → แตะกล่องเพื่อจัดกลุ่ม';
      document.querySelectorAll('#pool .card').forEach(c => {
        c.onclick = () => {
          document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
          c.classList.add('selected');
          selected = +c.dataset.i;
        };
      });
    }

    function placeInBin(type) {
      if (selected === null) return;
      const a = poolData[selected];
      if (!a) return;
      const ok = a.t === type;
      const el = document.createElement('span');
      el.className = 'card';
      el.textContent = a.e;
      el.title = a.n;
      if (!ok) el.style.borderColor = '#fca5a5';
      document.getElementById(type === 'vertebrate' ? 'binV' : 'binI').appendChild(el);
      poolData[selected] = null;
      document.getElementById('pool').querySelector(`[data-i="${selected}"]`)?.remove();
      selected = null;
      document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
      const left = poolData.filter(Boolean).length;
      document.getElementById('sortScore').textContent = left ? `เหลือ ${left} ตัว` : '✓ จัดครบแล้ว!';
    }

    document.querySelectorAll('.bin').forEach(bin => {
      bin.onclick = () => placeInBin(bin.dataset.type);
    });
    document.getElementById('btnReset').onclick = initSort;

    function mountClassifyPractice() {
      if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
      classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
        items: CLASSIFY_ITEMS,
        buckets: BUCKETS,
        mode: 'media',
        roundSize: 8,
        onAnswer: function (res) {
          if (window.KAMPAI && window.KAMPAI.sound) {
            try {
              if (res.isCorrect) KAMPAI.sound.correct();
              else KAMPAI.sound.wrong();
            } catch (_) {}
          }
        },
      });
    }

    function setMode(nextMode) {
      stopSpeech();
      mode = (nextMode === 'sort' || nextMode === 'practice') ? nextMode : 'learn';
      document.getElementById('modeSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
      document.getElementById('learnWrap').classList.toggle('hide', mode !== 'learn');
      document.getElementById('sortGame').classList.toggle('on', mode === 'sort');
      document.getElementById('practice').classList.toggle('on', mode === 'practice');
      document.getElementById('hintText').textContent = mode === 'learn'
        ? 'มีกระดูกสันหลัง = มีแกนกระดูกภายในร่างกาย'
        : (mode === 'sort' ? 'แตะสัตว์แล้วแตะกล่องให้ถูกกลุ่ม' : 'จำแนกสัตว์ตามการมีกระดูกสันหลัง — ไม่มีคะแนน');

      if (mode === 'sort') {
        if (window.KampaiEngines?.ClassifyBucket?.cleanup) window.KampaiEngines.ClassifyBucket.cleanup();
        initSort();
      } else if (mode === 'practice') {
        mountClassifyPractice();
      } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
        window.KampaiEngines.ClassifyBucket.cleanup();
      }
    }

    document.getElementById('modeSeg').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn) return;
      setMode(btn.dataset.mode);
    });

    document.getElementById('learn').addEventListener('click', (e) => {
      const card = e.target.closest('[data-say-bucket]');
      if (!card) return;
      const bucket = BUCKETS.find(b => b.id === card.dataset.sayBucket);
      if (bucket) speakText(bucket.say, 'speechStatusLearn');
    });

    document.getElementById('btnSpeakCurrent').addEventListener('click', () => {
      const item = classifySession?.currentItem?.();
      if (item) {
        speakText(item.label + ' เป็นสัตว์มีกระดูกสันหลัง หรือไม่มีกระดูกสันหลัง', 'speechStatusPractice');
      } else {
        speakText('ฝึกจำแนกสัตว์มีกระดูกสันหลังครบแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
      }
    });

    document.getElementById('btnFs').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });
    window.addEventListener('pagehide', stopSpeech);

    window.getState = () => Object.freeze({
      slug: MEDIA_SLUG,
      mode: mode,
      totalItems: CLASSIFY_ITEMS.length,
      bucketsCount: BUCKETS.length,
      sortRemaining: poolData.filter(Boolean).length,
      classify: classifySession ? classifySession.getState() : null,
      reducedMotion: typeof window.matchMedia === 'function'
        ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        : false,
    });
  </script>
</body>
</html>
