<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/classify-bucket-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💡 สมบัติของแสง — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #6d28d9; --line: #ddd6fe; --muted: #475569; --ok: #15803d; --bad: #b91c1c; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #ede9fe, #f5f3ff); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #5b21b6, #7c3aed); color: #fff; }
    header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; min-width: 160px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .tabs button:focus-visible, .card:focus-visible, .ke-bucket-btn:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; font-size: .9rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .85rem; color: var(--deep); font-weight: 600; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs button { font-family: inherit; font-weight: 800; border: 2px solid var(--line); background: #fff; color: var(--deep); border-radius: 12px; padding: 8px 14px; cursor: pointer; min-height: 44px; }
    .tabs button.on { background: var(--deep); color: #fff; border-color: var(--deep); }
    .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .card { font-family: inherit; border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: #fff; cursor: pointer; text-align: center; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .card.on { border-color: var(--deep); background: #f5f3ff; box-shadow: 0 0 0 2px #c4b5fd; }
    .card .e { font-size: 2.2rem; line-height: 1.1; }
    .card .n { font-weight: 800; color: var(--deep); margin-top: 2px; font-size: .95rem; }
    .info-wrap { margin-top: 14px; background: #f5f3ff; border: 2px dashed var(--line); border-radius: 14px; padding: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .info { font-weight: 600; line-height: 1.55; flex: 1; min-width: 200px; }
    .practice { display: none; max-width: 680px; margin: 0 auto; flex-direction: column; gap: 12px; width: 100%; }
    .shell.mode-practice .learn { display: none; }
    .shell.mode-practice .practice { display: flex; }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .speech-status { font-size: .85rem; font-weight: 700; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; margin-top: 10px; }
    .speech-status.show { display: block; }
    .ke-classify-card { background: #faf5ff; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-classify-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--deep); font-size: .95rem; }
    .ke-classify-item { text-align: center; padding: 18px 14px; background: #fff; border: 2px dashed #a78bfa; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ke-item-icon { font-size: clamp(56px, 14vw, 84px); line-height: 1.05; }
    .ke-item-label { font-size: clamp(1.25rem, 3vw, 1.6rem); font-weight: 800; color: var(--ink); }
    .ke-buckets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 560px) { .ke-buckets { grid-template-columns: 1fr; } }
    .ke-bucket-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 54px; padding: 10px 12px; border-radius: 14px; border: 2px solid #cbd5e1; background: #fff; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
    .ke-bucket-btn[data-bucket-id="opaque"] { border-color: #4c1d95; background: #f5f3ff; color: #3b0764; }
    .ke-bucket-btn[data-bucket-id="translucent"] { border-color: #d97706; background: #fffbeb; color: #78350f; }
    .ke-bucket-btn[data-bucket-id="transparent"] { border-color: #0284c7; background: #f0f9ff; color: #0c4a6e; }
    .ke-bucket-btn.is-correct { outline: 3px solid #15803d; background: #dcfce7; color: #14532d; }
    .ke-bucket-btn.is-wrong { opacity: .65; text-decoration: line-through; }
    .ke-bucket-btn:disabled { cursor: default; }
    .ke-classify-feedback { padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.45; background: #fff; border: 1.5px solid #cbd5e1; color: var(--ink); }
    .ke-classify-feedback.is-good { background: #dcfce7; border-color: #16a34a; color: #14532d; }
    .ke-classify-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    .ke-btn { font-family: inherit; font-weight: 800; font-size: .95rem; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: none; background: var(--deep); color: #fff; cursor: pointer; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-classify-summary { text-align: center; padding: 24px 16px; background: #f5f3ff; border: 2px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .ke-classify-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
    <h1>💡 สมบัติของแสง</h1>
    <span class="badge">ป.4 · วิทยาศาสตร์</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
    </span>
    <p class="hint" id="hintText">จัดกลุ่มวัตถุตามสมบัติของแสง — ไม่เก็บคะแนน</p>
    <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/science/light-properties-media-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="learn" id="learn">
      <div class="tabs" id="tabs"></div>
      <div class="cards" id="cards"></div>
      <div class="info-wrap">
        <div class="info" id="info">เลือกวัตถุเพื่อดูว่าแสงผ่านได้มากน้อยแค่ไหน</div>
        <button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>
      </div>
      <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
    </div>
    <div class="practice" id="practice">
      <div class="practice-bar">
        <span class="practice-note">แตะเลือกกลุ่มสมบัติของแสงหรือกดปุ่ม 1–3 (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
        <button type="button" class="btn btn-ghost" id="btnSpeakCurrent">🔊 ฟังโจทย์</button>
      </div>
      <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
      <div id="classifyEngineRoot"></div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อการสอน · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG = 'light-properties-media';
if (window.KAMPAI) {
  KAMPAI.setSlug(MEDIA_SLUG);
  if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
    try { KAMPAI.sound.mountToggles(); } catch (_) {}
  }
}

const TYPES = [
  { id: 'opaque', name: 'ทึบแสง', icon: '⬛', desc: 'แสงผ่านไม่ได้ หรือผ่านได้น้อยมาก ทำให้เกิดเงาชัด', color: '#4c1d95' },
  { id: 'translucent', name: 'ผ่านแสงบางส่วน', icon: '🌫️', desc: 'แสงผ่านได้บางส่วน เห็นเงาไม่คมชัด', color: '#92400e' },
  { id: 'transparent', name: 'โปร่งใส', icon: '💎', desc: 'แสงผ่านได้ดี เห็นวัตถุอีกฝั่งชัด', color: '#0369a1' }
];

const ITEMS = [
  { id: 'wood', name: 'ไม้', emoji: '🪵', type: 'opaque', reason: 'ไม้เป็นวัสดุทึบแสง แสงผ่านไม่ได้และเกิดเงาชัด' },
  { id: 'stone', name: 'หิน', emoji: '🪨', type: 'opaque', reason: 'หินทึบแสง แสงผ่านไม่ได้เลย' },
  { id: 'book', name: 'หนังสือ', emoji: '📘', type: 'opaque', reason: 'กระดาษหนาซ้อนกันขวางแสง แสงผ่านไม่ได้' },
  { id: 'metal', name: 'โลหะ', emoji: '🪙', type: 'opaque', reason: 'โลหะทึบแสง มองทะลุอีกฝั่งไม่ได้' },
  { id: 'wax-paper', name: 'กระดาษไข', emoji: '📄', type: 'translucent', reason: 'แสงผ่านกระดาษไขได้บางส่วน มองเห็นไม่ชัด' },
  { id: 'curtain', name: 'ผ้าม่านบาง', emoji: '🪟', type: 'translucent', reason: 'แสงลอดผ่านผ้าบางได้บางส่วน เห็นเงาไม่คม' },
  { id: 'frosted-plastic', name: 'พลาสติกฝ้า', emoji: '🧴', type: 'translucent', reason: 'พลาสติกขุ่นหรือฝ้าให้แสงผ่านได้บางส่วน' },
  { id: 'clear-glass', name: 'กระจกใส', emoji: '🪞', type: 'transparent', reason: 'กระจกใสยอมให้แสงผ่านได้ดี เห็นอีกฝั่งชัด' },
  { id: 'water', name: 'น้ำสะอาด', emoji: '💧', type: 'transparent', reason: 'แสงผ่านน้ำใสได้ดี มองเห็นใต้น้ำได้' },
  { id: 'air', name: 'อากาศ', emoji: '🌬️', type: 'transparent', reason: 'อากาศโปร่งใส แสงผ่านได้ตลอด' },
  { id: 'clear-plastic', name: 'พลาสติกใส', emoji: '🥤', type: 'transparent', reason: 'พลาสติกใสให้แสงผ่านได้ดี เห็นสิ่งที่อยู่ด้านในชัด' }
];

const BUCKETS = TYPES.map((t) => ({ id: t.id, label: t.name, icon: t.icon, description: t.desc }));
const CLASSIFY_ITEMS = ITEMS.map((it) => ({
  id: it.id,
  icon: it.emoji,
  label: it.name,
  bucketId: it.type,
  reason: it.reason,
}));

let filter = 'all';
let mode = 'learn';
let selectedItem = null;
let classifySession = null;

function speakText(text, statusId) {
  const clean = String(text || '').trim();
  if (!clean) return;
  const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
    const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
    if (statusEl) {
      if (res && res.ok === false) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
        statusEl.classList.add('show');
      } else {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try {
    if (window.KAMPAI?.sound?.speak) {
      KAMPAI.sound.speak(clean, 'th-TH', true);
      return;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'th-TH';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
      return;
    }
  } catch (_) {}
  if (statusEl) {
    statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความต่อได้';
    statusEl.classList.add('show');
  }
}

function stopSpeech() {
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
    window.KampaiMediaLab.stopAllSpeech();
  } else {
    try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
    try { window.speechSynthesis?.cancel?.(); } catch (_) {}
  }
}

function mountClassifyPractice() {
  if (!window.KampaiEngines || !window.KampaiEngines.ClassifyBucket) return;
  classifySession = window.KampaiEngines.ClassifyBucket.mount('#classifyEngineRoot', {
    items: CLASSIFY_ITEMS,
    buckets: BUCKETS,
    mode: 'media',
    roundSize: CLASSIFY_ITEMS.length,
    onAnswer: function (res) {
      if (window.KAMPAI && window.KAMPAI.sound) {
        try {
          if (res.isCorrect) KAMPAI.sound.correct();
          else KAMPAI.sound.wrong();
        } catch (_) {}
      }
    },
  });
}

function setMode(m) {
  stopSpeech();
  mode = m === 'practice' ? 'practice' : 'learn';
  document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
  document.getElementById('shell').classList.toggle('mode-practice', mode === 'practice');
  document.getElementById('hintText').textContent = mode === 'learn'
    ? 'จัดกลุ่มวัตถุตามสมบัติของแสง — ไม่เก็บคะแนน'
    : 'แยกวัตถุเป็น ทึบแสง · ผ่านแสงบางส่วน · โปร่งใส — ไม่มีคะแนน';
  if (mode === 'practice') {
    mountClassifyPractice();
  } else if (window.KampaiEngines?.ClassifyBucket?.cleanup) {
    window.KampaiEngines.ClassifyBucket.cleanup();
  }
}

function renderTabs() {
  const el = document.getElementById('tabs');
  const opts = [{ id: 'all', name: 'ทั้งหมด' }, ...TYPES];
  el.innerHTML = opts.map((t) => '<button type="button" data-id="' + t.id + '" class="' + (t.id === filter ? 'on' : '') + '">' + t.name + '</button>').join('');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  stopSpeech();
  filter = b.dataset.id;
  renderTabs();
  renderCards();
});

function renderCards() {
  const list = ITEMS.filter((x) => filter === 'all' || x.type === filter);
  const el = document.getElementById('cards');
  el.innerHTML = list.map((x) => '<button type="button" class="card' + (selectedItem && selectedItem.id === x.id ? ' on' : '') + '" data-i="' + ITEMS.indexOf(x) + '"><div class="e">' + x.emoji + '</div><div class="n">' + x.name + '</div></button>').join('');
}

document.getElementById('cards').addEventListener('click', (e) => {
  const b = e.target.closest('.card');
  if (!b) return;
  [...document.getElementById('cards').children].forEach((c) => c.classList.toggle('on', c === b));
  const it = ITEMS[+b.dataset.i];
  if (!it) return;
  selectedItem = it;
  const t = TYPES.find((z) => z.id === it.type);
  document.getElementById('info').innerHTML = '<strong>' + it.emoji + ' ' + it.name + '</strong> → <strong style="color:' + t.color + '">' + t.name + '</strong><br>' + it.reason;
  speakText(it.name + ' เป็นวัสดุ' + t.name + ' ' + it.reason, 'speechStatusLearn');
});

document.getElementById('btnSpeakLearn').addEventListener('click', () => {
  if (selectedItem) {
    const t = TYPES.find((z) => z.id === selectedItem.type);
    speakText(selectedItem.name + ' เป็นวัสดุ' + t.name + ' ' + selectedItem.reason, 'speechStatusLearn');
  } else {
    speakText('สมบัติของแสงแบ่งวัตถุเป็น 3 กลุ่ม คือ ทึบแสง ผ่านแสงบางส่วน และโปร่งใส แตะเลือกวัตถุเพื่อฟังรายละเอียด', 'speechStatusLearn');
  }
});

document.getElementById('btnSpeakCurrent').addEventListener('click', () => {
  const item = classifySession?.currentItem?.();
  if (item) {
    speakText(item.label + ' จัดเป็นวัสดุกลุ่มใด ทึบแสง ผ่านแสงบางส่วน หรือโปร่งใส', 'speechStatusPractice');
  } else {
    speakText('จำแนกสมบัติของแสงครบทุกข้อแล้ว กดฝึกใหม่อีกครั้งได้', 'speechStatusPractice');
  }
});

document.getElementById('modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) setMode(b.dataset.mode);
});

document.getElementById('btnBack').addEventListener('click', () => {
  stopSpeech();
  if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
  else history.back();
});

document.getElementById('btnFs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopSpeech();
});
window.addEventListener('pagehide', stopSpeech);

renderTabs();
renderCards();
setMode('learn');

window.getState = () => Object.freeze({
  slug: MEDIA_SLUG,
  mode: mode,
  filter: filter,
  selectedItem: selectedItem ? selectedItem.id : null,
  totalItems: CLASSIFY_ITEMS.length,
  bucketsCount: BUCKETS.length,
  classify: classifySession ? classifySession.getState() : null,
  reducedMotion: typeof window.matchMedia === 'function'
    ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    : false,
});
</script>
</body>
</html>
