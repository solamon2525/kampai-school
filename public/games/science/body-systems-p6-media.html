<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <script src="/games/media-lab-runtime.js?v=2.0.0"></script>
  <script src="/games/engine/vocab-quiz-engine.js?v=2.0.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบร่างกาย ป.6 — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --deep: #be123c; --line: #fecdd3; --muted: #475569; --ok: #15803d; --bad: #b91c1c; --ink: #0f172a; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body { font-family: 'Sarabun', sans-serif; background: linear-gradient(145deg, #fecdd3, #fff1f2); min-height: 100%; padding: 12px; color: var(--ink); }
    .shell { max-width: 1100px; margin: 0 auto; background: #fff; border-radius: 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.12); overflow: hidden; min-height: calc(100vh - 24px); display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; background: linear-gradient(90deg, #9f1239, var(--deep)); color: #fff; }
    header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; min-width: 160px; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 999px; font-weight: 700; }
    .btn { font-family: inherit; font-weight: 700; border: none; border-radius: 12px; padding: 10px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible, .seg button:focus-visible, .pick button:focus-visible, .ke-option:focus-visible, .ke-btn:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
    .btn-back { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 8px 12px; font-size: .85rem; }
    .btn-primary { background: var(--deep); color: #fff; }
    .btn-ghost { background: #fff; color: var(--deep); border: 2px solid var(--line); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--line); align-items: center; }
    .seg { display: inline-flex; flex-wrap: wrap; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); max-width: 100%; }
    .seg button { font-family: inherit; font-weight: 800; border: none; background: #fff; color: var(--deep); padding: 8px 14px; cursor: pointer; min-height: 44px; font-size: .9rem; }
    .seg button.on { background: var(--deep); color: #fff; }
    .hint { font-size: .9rem; color: var(--deep); font-weight: 700; flex: 1; min-width: 140px; }
    .stage { flex: 1; padding: 16px; overflow: auto; }
    .learn { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .footer { padding: 10px 16px; font-size: .8rem; color: var(--muted); text-align: center; border-top: 1px solid var(--line); }
    .practice { display: none; flex-direction: column; gap: 12px; max-width: 640px; margin: 0 auto; width: 100%; }
    .shell.mode-practice .learn { display: none; }
    .shell.mode-practice .practice { display: flex; }
    .pick { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick button { font-family: inherit; font-weight: 800; font-size: .98rem; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; color: var(--deep); min-height: 44px; }
    .pick button.on { background: var(--deep); color: #fff; border-color: var(--deep); }
    .box { background: #fff1f2; border: 2px solid var(--line); border-radius: 16px; padding: 18px; font-weight: 700; line-height: 1.7; font-size: 1.08rem; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .box h2 { color: var(--deep); font-size: 1.4rem; }
    .emo { font-size: 3.1rem; line-height: 1; }
    .box-tip { color: var(--muted); font-size: .98rem; font-weight: 600; }
    .ex { width: 100%; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px dashed var(--line); font-size: .98rem; color: var(--ink); }
    .practice-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .practice-note { font-size: .88rem; font-weight: 700; color: var(--deep); }
    .speech-status { font-size: .85rem; font-weight: 700; color: #78350f; background: #fef3c7; border-radius: 10px; padding: 8px 12px; display: none; }
    .speech-status.show { display: block; }
    .ke-quiz-card, .ke-quiz-summary { background: #fff1f2; border: 2px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ke-quiz-summary { text-align: center; align-items: center; padding: 24px 16px; }
    .ke-quiz-summary h3 { color: var(--deep); font-size: 1.3rem; font-weight: 800; }
    .ke-quiz-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-weight: 800; }
    .ke-badge { padding: 4px 10px; border-radius: 999px; background: #ffe4e6; color: #9f1239; font-size: .85rem; }
    .ke-progress { color: var(--muted); font-size: .92rem; }
    .ke-prompt { font-size: 1.15rem; font-weight: 800; color: var(--ink); line-height: 1.5; }
    .ke-audio-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .ke-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 640px) { .ke-options { grid-template-columns: 1fr 1fr; } }
    .ke-option, .ke-btn { min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink); font-family: inherit; font-size: .98rem; font-weight: 700; cursor: pointer; text-align: left; }
    .ke-btn { background: var(--deep); color: #fff; border-color: var(--deep); text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px; align-self: center; }
    .ke-option.is-correct { background: #dcfce7; border-color: var(--ok); color: #14532d; }
    .ke-option.is-wrong { background: #fee2e2; border-color: var(--bad); color: var(--bad); }
    .ke-option:disabled { cursor: default; }
    .ke-feedback { min-height: 24px; padding: 10px 14px; border-radius: 12px; font-weight: 700; background: #fff; border: 1.5px solid var(--line); color: var(--ink); line-height: 1.45; }
    .ke-feedback.is-good { background: #dcfce7; border-color: var(--ok); color: #14532d; }
    .ke-feedback.is-learn { background: #fef3c7; border-color: #d97706; color: #78350f; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .shell { border-radius: 0; min-height: 100vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
<div class="shell" id="shell">
  <header>
    <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
    <h1>🫀 สารอาหาร · ระบบย่อย ป.6</h1>
    <span class="badge">ป.6 · วิทยาศาสตร์</span>
  </header>
  <div class="toolbar">
    <span class="seg" id="modeSeg">
      <button type="button" data-mode="learn" class="on">📖 เรียนรู้</button>
      <button type="button" data-mode="practice">✏️ ฝึก</button>
    </span>
    <p class="hint" id="hintText">เลือกหัวข้อ · อ่านและฟังคำอธิบาย</p>
    <button type="button" class="btn btn-ghost" id="btnFs" aria-label="ขยายเต็มจอ">⛶ เต็มจอ</button>
    <a class="btn btn-ghost" href="/games/science/body-systems-p6-worksheet.html" target="_blank" rel="noopener">📝 เปิดใบงาน</a>
  </div>
  <div class="stage" id="stage">
    <div class="learn" id="learn">
      <div class="pick" id="pick"></div>
      <div class="box" id="box"></div>
      <div class="speech-status" id="speechStatusLearn" role="status" aria-live="polite"></div>
    </div>
    <div class="practice" id="practice">
      <div class="practice-bar">
        <span class="practice-note">เลือกคำตอบและลองใหม่ได้ (ไม่จับเวลา · ไม่เก็บคะแนน)</span>
        <button type="button" class="btn btn-ghost" id="btnNewPractice">🔄 สุ่มชุดใหม่</button>
      </div>
      <div class="speech-status" id="speechStatusPractice" role="status" aria-live="polite"></div>
      <div id="quizEngineRoot"></div>
    </div>
  </div>
  <div class="footer">โรงเรียนบ้านคำไผ่ · สื่อ ป.6 · Phase 13 · ไม่เก็บคะแนน</div>
</div>
<script>
const MEDIA_SLUG = 'body-systems-p6-media';
if (window.KAMPAI) {
  KAMPAI.setSlug('body-systems-p6-media');
  if (KAMPAI.sound && typeof KAMPAI.sound.mountToggles === 'function') {
    try { KAMPAI.sound.mountToggles(); } catch (_) {}
  }
}

const ITEMS = [
  { emoji: '🥗', name: 'สารอาหารหลัก', body: 'คาร์โบไฮเดรต โปรตีน ไขมัน วิตามิน แร่ธาตุ น้ำ — แต่ละชนิดมีประโยชน์ต่างกัน', tip: 'กินครบสัดส่วนตามเพศวัย', ex: 'ข้าว = พลังงาน · เนื้อไข่ = ซ่อมแซม', q: 'โปรตีนมีประโยชน์หลักอย่างไร?', a: 'ซ่อมแซม/สร้างกล้ามเนื้อ' },
  { emoji: '🍽️', name: 'เลือกอาหารปลอดภัย', body: 'เลือกอาหารสด สะอาด สัดส่วนเหมาะ ไม่หวานเค็มมันเกิน', tip: 'อ่านฉลากเมื่อซื้อของสำเร็จรูป', ex: 'ผักผลไม้ทุกมื้อ', q: 'การเลือกอาหารควรคำนึงถึงอะไร?', a: 'ครบถ้วนและปลอดภัย' },
  { emoji: '👄', name: 'เริ่มที่ย่อย', body: 'ปากเคี้ยว+น้ำลาย · หลอดอาหาร · กระเพาะ · ลำไส้เล็กดูดซึม · ลำไส้ใหญ่', tip: 'เคี้ยวให้ละเอียดช่วยย่อย', ex: 'กระเพาะมีน้ำย่อยช่วยย่อยโปรตีน', q: 'การดูดซึมสารอาหารเกิดที่ใดเป็นหลัก?', a: 'ลำไส้เล็ก' },
  { emoji: '🧪', name: 'หน้าที่อวัยวะ', body: 'แต่ละอวัยวะในระบบย่อยมีหน้าที่เฉพาะ ทำงานต่อเนื่องเป็นระบบ', tip: 'จำลำดับทางเดินอาหาร', ex: 'ลำไส้ใหญ่ดูดน้ำและสร้างอุจจาระ', q: 'ลำไส้ใหญ่ทำหน้าที่สำคัญข้อใด?', a: 'ดูดน้ำ' },
  { emoji: '💚', name: 'ดูแลระบบย่อย', body: 'กินสุก สะอาด เคี้ยวดี ดื่มน้ำ พักผ่อน ไม่กินจุกจิกเกิน', tip: 'ปวดท้องบ่อยควรปรึกษาผู้ใหญ่/แพทย์', ex: 'ล้างมือก่อนกิน', q: 'วิธีดูแลระบบย่อยข้อหนึ่งคือ?', a: 'เคี้ยวให้ละเอียด/กินสะอาด' },
  { emoji: '🧱', name: 'แบบจำลองระบบย่อย', body: 'สร้างแบบจำลองช่วยอธิบายลำดับและหน้าที่อวัยวะ', tip: 'ใช้ภาพหรือของจำลองเรียงลำดับ', ex: 'ติดป้ายชื่ออวัยวะบนแผนภาพ', q: 'แบบจำลองช่วยให้นักเรียนทำอะไร?', a: 'อธิบายระบบย่อยได้ชัด' },
];

const QUIZ_POOL = [
  { id: 'bs-1', term: 'โปรตีน (เนื้อสัตว์ ไข่ นม ถั่ว)', meaning: 'ซ่อมแซมส่วนที่สึกหรอและสร้างกล้ามเนื้อ', explain: 'โปรตีนช่วยซ่อมแซมเนื้อเยื่อและสร้างกล้ามเนื้อให้แข็งแรง', locale: 'th-TH' },
  { id: 'bs-2', term: 'คาร์โบไฮเดรต (ข้าว แป้ง เผือก มัน)', meaning: 'ให้พลังงานหลักแก่ร่างกายในการทำกิจกรรม', explain: 'คาร์โบไฮเดรตเป็นแหล่งพลังงานหลักประจำวันของร่างกาย', locale: 'th-TH' },
  { id: 'bs-3', term: 'การเลือกอาหารที่ปลอดภัย', meaning: 'ครบถ้วน สด สะอาด ไม่หวานเค็มมันเกินไป', explain: 'ควรอ่านฉลากโภชนาการและเลือกอาหารที่ครบถ้วนและปลอดภัย', locale: 'th-TH' },
  { id: 'bs-4', term: 'ปากและน้ำลาย', meaning: 'บดเคี้ยวอาหารให้เล็กลงและเริ่มย่อยแป้ง', explain: 'การเคี้ยวให้ละเอียดช่วยให้หลอดอาหารและกระเพาะทำงานง่ายขึ้น', locale: 'th-TH' },
  { id: 'bs-5', term: 'กระเพาะอาหาร', meaning: 'สร้างกรดและน้ำย่อยช่วยย่อยโปรตีน', explain: 'กระเพาะอาหารมีน้ำย่อยเฉพาะสำหรับย่อยโปรตีนให้เล็กลง', locale: 'th-TH' },
  { id: 'bs-6', term: 'ลำไส้เล็ก', meaning: 'ดูดซึมสารอาหารเข้าสู่กระแสเลือดเป็นหลัก', explain: 'การดูดซึมสารอาหารส่วนใหญ่เกิดขึ้นที่ลำไส้เล็ก', locale: 'th-TH' },
  { id: 'bs-7', term: 'ลำไส้ใหญ่', meaning: 'ดูดซึมน้ำกลับและสร้างกากอาหารเป็นอุจจาระ', explain: 'ลำไส้ใหญ่ทำหน้าที่ดูดน้ำและเกลือแร่ส่วนที่เหลือ ก่อนขับกากอาหาร', locale: 'th-TH' },
  { id: 'bs-8', term: 'การดูแลระบบย่อยอาหาร', meaning: 'กินสุกสะอาด เคี้ยวให้ละเอียด และล้างมือก่อนกิน', explain: 'การเคี้ยวละเอียด ดื่มน้ำเพียงพอ และกินอาหารสะอาดช่วยถนอมระบบย่อย', locale: 'th-TH' },
  { id: 'bs-9', term: 'แบบจำลองระบบย่อยอาหาร', meaning: 'ช่วยอธิบายลำดับทางเดินอาหารและหน้าที่อวัยวะได้ชัด', explain: 'แบบจำลองช่วยให้เห็นภาพรวมและการทำงานต่อเนื่องของแต่ละอวัยวะ', locale: 'th-TH' },
];

let cur = ITEMS[0];
let mode = 'learn';
let quizSession = null;

function clearSpeechBanners() {
  document.querySelectorAll('.speech-status').forEach((el) => {
    el.textContent = '';
    el.classList.remove('show');
  });
}

function speakText(text, statusId) {
  const clean = String(text || '').trim();
  if (!clean) return;
  const statusEl = document.getElementById(statusId || (mode === 'practice' ? 'speechStatusPractice' : 'speechStatusLearn'));
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.speakSafe === 'function') {
    const res = window.KampaiMediaLab.speakSafe(clean, { lang: 'th-TH', rate: 0.92 });
    if (statusEl) {
      if (res && res.ok === false) {
        statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความบนหน้าจอต่อได้';
        statusEl.classList.add('show');
      } else {
        statusEl.textContent = '';
        statusEl.classList.remove('show');
      }
    }
    return;
  }
  try {
    if (window.KAMPAI?.sound?.speak) {
      KAMPAI.sound.speak(clean, 'th-TH', true);
      return;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'th-TH';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
      return;
    }
  } catch (_) {}
  if (statusEl) {
    statusEl.textContent = 'อุปกรณ์นี้ยังไม่รองรับเสียงอ่านอัตโนมัติ สามารถอ่านข้อความบนหน้าจอต่อได้';
    statusEl.classList.add('show');
  }
}

function stopSpeech() {
  if (window.KampaiMediaLab && typeof window.KampaiMediaLab.stopAllSpeech === 'function') {
    window.KampaiMediaLab.stopAllSpeech();
  } else {
    try { window.KAMPAI?.sound?.stopSpeak?.(); } catch (_) {}
    try { window.speechSynthesis?.cancel?.(); } catch (_) {}
  }
  clearSpeechBanners();
}

function render() {
  document.getElementById('pick').innerHTML = ITEMS.map((x, i) =>
    '<button type="button" data-i="' + i + '" class="' + (x === cur ? 'on' : '') + '">' + (x.emoji ? x.emoji + ' ' : '') + x.name + '</button>'
  ).join('');
  document.getElementById('box').innerHTML =
    (cur.emoji ? '<div class="emo" aria-hidden="true">' + cur.emoji + '</div>' : '') +
    '<h2>' + cur.name + '</h2>' +
    '<p>' + cur.body + '</p>' +
    (cur.tip ? '<p class="box-tip">💡 ' + cur.tip + '</p>' : '') +
    (cur.ex ? '<div class="ex">' + cur.ex + '</div>' : '') +
    '<button type="button" class="btn btn-ghost" id="btnSpeakLearn">🔊 ฟังคำอธิบาย</button>';
  document.getElementById('btnSpeakLearn').onclick = () => {
    speakText(cur.name + ' ' + cur.body + (cur.tip ? ' เคล็ดลับ ' + cur.tip : ''), 'speechStatusLearn');
  };
}

function mountQuizPractice() {
  if (!window.KampaiEngines || !window.KampaiEngines.Quiz) return;
  quizSession = window.KampaiEngines.Quiz.mountChoice('#quizEngineRoot', {
    items: QUIZ_POOL,
    mode: 'media',
    roundSize: 6,
    locale: 'th-TH',
    speak: (text) => speakText(text, 'speechStatusPractice'),
    onAnswer: (res) => {
      if (window.KAMPAI && window.KAMPAI.sound) {
        try {
          if (res.isCorrect) KAMPAI.sound.correct();
          else KAMPAI.sound.wrong();
        } catch (_) {}
      }
    },
  });
}

function setMode(m) {
  stopSpeech();
  mode = m === 'practice' ? 'practice' : 'learn';
  document.getElementById('shell').classList.toggle('mode-practice', mode === 'practice');
  document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
  document.getElementById('hintText').textContent = mode === 'learn'
    ? 'เลือกหัวข้อ · อ่านและฟังคำอธิบาย'
    : 'ตอบคำถามทบทวน — ลองใหม่ได้ ไม่เก็บคะแนน';
  if (mode === 'practice') {
    mountQuizPractice();
  } else if (window.KampaiEngines?.Quiz?.cleanup) {
    window.KampaiEngines.Quiz.cleanup();
  }
}

document.getElementById('pick').onclick = (e) => {
  const b = e.target.closest('[data-i]');
  if (!b) return;
  stopSpeech();
  cur = ITEMS[+b.dataset.i];
  render();
};

document.getElementById('modeSeg').onclick = (e) => {
  const b = e.target.closest('button[data-mode]');
  if (b) setMode(b.dataset.mode);
};

document.getElementById('btnNewPractice').onclick = () => {
  stopSpeech();
  mountQuizPractice();
};

document.getElementById('btnBack').onclick = () => {
  stopSpeech();
  if (window.KAMPAI && KAMPAI.goHome) KAMPAI.goHome();
  else history.back();
};

document.getElementById('btnFs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopSpeech();
});
window.addEventListener('pagehide', stopSpeech);

render();
setMode('learn');

window.getState = () => Object.freeze({
  slug: MEDIA_SLUG,
  mode: mode,
  currentTopic: cur ? cur.name : null,
  totalItems: ITEMS.length,
  quiz: quizSession ? quizSession.getState() : null,
  reducedMotion: typeof window.matchMedia === 'function'
    ? Boolean(window.matchMedia('(prefers-reduced-motion: reduce)').matches)
    : false,
});
</script>
</body>
</html>
