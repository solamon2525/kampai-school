<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#022c22"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.25"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">✏️</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">📐</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.1–3</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">ลากเส้นตามแบบ</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">ฝึกลากเส้นตามรอยรูปวาด พัฒนากล้ามเนื้อมือและสายตา</text>

  <!-- Interactive line-tracing preview -->
  <g transform="translate(640,515)">
    <!-- Traced heart shape -->
    <path d="M 0,-40 A 25 25 0 0 1 50,-40 A 25 25 0 0 1 100,-40 Q 100,0 0,80 Q -100,0 -100,-40 A 25 25 0 0 1 -50,-40 A 25 25 0 0 1 0,-40 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
    <!-- Yellow progress trace -->
    <path d="M -100,-40 A 25 25 0 0 1 -50,-40 A 25 25 0 0 1 0,-40" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Target flashing yellow dot -->
    <circle cx="0" cy="-40" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="3" filter="url(#sh)"/>
    
    <!-- Drawing pencil representation -->
    <g transform="translate(15, -45) rotate(-35)">
      <rect x="-8" y="-45" width="16" height="40" fill="#facc15" rx="2"/>
      <path d="M -8,-5 L 0,5 L 8,-5 Z" fill="#ffedd5"/>
      <path d="M -3,0 L 0,5 L 3,0 Z" fill="#1e293b"/>
      <rect x="-8" y="-55" width="16" height="10" fill="#f43f5e" rx="2"/>
    </g>
  </g>
  <g transform="translate(640,652)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#10b981" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#a7f3d0" text-anchor="middle" dominant-baseline="middle">ลากรูปหัวใจ · รูปดาว · รูปปลา · รูปบ้าน · รูปเพชร</text>
  </g>
</svg>
