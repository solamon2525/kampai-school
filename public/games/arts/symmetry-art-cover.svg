<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="0.55" stop-color="#4c1d95"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.30"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🪞</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🦋</text>

  <g transform="translate(640,116)">
    <rect x="-200" y="-26" width="400" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">เติมลายสมมาตร</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">เติมอีกครึ่งให้สะท้อนกระจกเหมือนกันเป๊ะ</text>

  <!-- ═══ ฉาก chibi: เด็กศิลปินระบายผีเสื้อสมมาตรบนขาตั้งภาพ ═══ -->
  <!-- ประกาย -->
  <g fill="#FFD700" opacity="0.9">
    <path d="M665,412 L670,425 L683,430 L670,435 L665,448 L660,435 L647,430 L660,425 Z"/>
    <path d="M955,425 L959,436 L970,440 L959,444 L955,455 L951,444 L940,440 L951,436 Z"/>
    <path d="M700,366 L703,375 L712,378 L703,381 L700,390 L697,381 L688,378 L697,375 Z"/>
    <path d="M915,374 L919,384 L929,388 L919,392 L915,402 L911,392 L901,388 L911,384 Z"/>
  </g>
  <!-- หยดสีลอย -->
  <g stroke="#0f172a" stroke-width="2" opacity="0.92">
    <circle cx="634" cy="558" r="9" fill="#22c55e"/>
    <circle cx="970" cy="520" r="8" fill="#38bdf8"/>
    <circle cx="650" cy="500" r="6" fill="#ef4444"/>
    <circle cx="958" cy="572" r="7" fill="#facc15"/>
  </g>

  <!-- ขาตั้งภาพ -->
  <g stroke="#92400e" stroke-linecap="round" fill="none">
    <line x1="820" y1="560" x2="820" y2="648" stroke="#7c2d12" stroke-width="10"/>
    <line x1="726" y1="548" x2="702" y2="634" stroke-width="12"/>
    <line x1="914" y1="548" x2="938" y2="634" stroke-width="12"/>
    <line x1="700" y1="567" x2="940" y2="567" stroke-width="12"/>
  </g>
  <!-- canvas -->
  <rect x="708" y="403" width="224" height="164" rx="8" fill="#fffdf5" stroke="#3b2a5a" stroke-width="5" filter="url(#ds)"/>
  <rect x="718" y="413" width="204" height="144" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- เส้นแกนกระจก -->
  <line x1="820" y1="420" x2="820" y2="552" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- ผีเสื้อสมมาตร: ปีกซ้ายระบายเต็ม / ปีกขวากำลังเติม -->
  <g>
    <!-- ลำตัว + หนวด -->
    <ellipse cx="820" cy="488" rx="8" ry="40" fill="#3b2a5a"/>
    <circle cx="820" cy="450" r="9" fill="#3b2a5a"/>
    <path d="M816,444 Q800,425 802,415" stroke="#3b2a5a" stroke-width="3" fill="none"/>
    <path d="M824,444 Q840,425 838,415" stroke="#3b2a5a" stroke-width="3" fill="none"/>
    <circle cx="802" cy="414" r="4" fill="#3b2a5a"/><circle cx="838" cy="414" r="4" fill="#3b2a5a"/>
    <!-- ปีกซ้าย (ระบายแล้ว) -->
    <ellipse cx="781" cy="470" rx="40" ry="33" fill="#a855f7" stroke="#3b2a5a" stroke-width="3"/>
    <circle cx="772" cy="464" r="12" fill="#ec4899"/>
    <circle cx="793" cy="481" r="6" fill="#facc15"/>
    <ellipse cx="790" cy="518" rx="27" ry="23" fill="#ec4899" stroke="#3b2a5a" stroke-width="3"/>
    <circle cx="786" cy="518" r="7" fill="#ffffff" opacity="0.55"/>
    <!-- ปีกขวา (โครงประ + กำลังเติม) -->
    <ellipse cx="859" cy="470" rx="40" ry="33" fill="#a855f7" fill-opacity="0.16" stroke="#a855f7" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="842" cy="464" r="11" fill="#a855f7" opacity="0.5"/>
    <circle cx="868" cy="464" r="12" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="847" cy="481" r="6" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="3 3"/>
    <ellipse cx="850" cy="518" rx="27" ry="23" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="8 6"/>
  </g>

  <!-- ═══ เด็ก chibi ═══ -->
  <g filter="url(#ds)">
    <!-- ตัว/ผ้ากันเปื้อน -->
    <path d="M424,548 Q468,524 514,548 L526,636 Q468,650 410,636 Z" fill="#38bdf8" stroke="#3b2a5a" stroke-width="4"/>
    <rect x="442" y="560" width="52" height="64" rx="10" fill="#fef9c3" stroke="#3b2a5a" stroke-width="3"/>
    <circle cx="468" cy="600" r="7" fill="#a855f7" opacity="0.75"/>
    <circle cx="456" cy="585" r="4" fill="#ef4444" opacity="0.75"/>
    <circle cx="481" cy="592" r="4" fill="#22c55e" opacity="0.75"/>
  </g>
  <!-- แขนซ้ายถือจานสี -->
  <path d="M428,556 Q410,585 406,604" stroke="#3b2a5a" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M428,556 Q410,585 406,604" stroke="#38bdf8" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="404" cy="608" r="12" fill="#ffe0bd" stroke="#3b2a5a" stroke-width="3"/>
  <g transform="rotate(-8,398,612)">
    <ellipse cx="398" cy="612" rx="46" ry="29" fill="#fde68a" stroke="#3b2a5a" stroke-width="3"/>
    <ellipse cx="420" cy="620" rx="8" ry="11" fill="#2a1a4a"/>
    <circle cx="376" cy="604" r="8" fill="#ef4444"/>
    <circle cx="398" cy="600" r="8" fill="#facc15"/>
    <circle cx="418" cy="602" r="7" fill="#22c55e"/>
    <circle cx="382" cy="622" r="7" fill="#38bdf8"/>
    <circle cx="403" cy="624" r="7" fill="#ec4899"/>
  </g>
  <!-- แขนขวาถือพู่กัน -->
  <path d="M512,556 Q566,538 614,518" stroke="#3b2a5a" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M512,556 Q566,538 614,518" stroke="#38bdf8" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="620" cy="516" r="13" fill="#ffe0bd" stroke="#3b2a5a" stroke-width="3"/>
  <line x1="620" y1="516" x2="686" y2="486" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
  <line x1="676" y1="492" x2="691" y2="484" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
  <path d="M690,484 L712,474 L706,488 Z" fill="#a855f7" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- หัว -->
  <g filter="url(#ds)">
    <circle cx="468" cy="488" r="54" fill="#ffe0bd" stroke="#3b2a5a" stroke-width="4"/>
  </g>
  <path d="M414,488 A54,54 0 0 1 522,488 Q520,470 495,467 Q485,478 470,469 Q455,478 445,467 Q418,470 414,488 Z" fill="#6b4423" stroke="#3b2a5a" stroke-width="3"/>
  <g transform="rotate(-16,500,452)">
    <ellipse cx="500" cy="452" rx="32" ry="15" fill="#ef4444" stroke="#3b2a5a" stroke-width="3"/>
    <circle cx="512" cy="441" r="5" fill="#ef4444" stroke="#3b2a5a" stroke-width="2"/>
  </g>
  <ellipse cx="450" cy="494" rx="9" ry="12" fill="#2b2440"/><circle cx="447" cy="489" r="3" fill="#fff"/>
  <ellipse cx="486" cy="494" rx="9" ry="12" fill="#2b2440"/><circle cx="483" cy="489" r="3" fill="#fff"/>
  <circle cx="440" cy="510" r="8" fill="#fca5a5" opacity="0.85"/>
  <circle cx="496" cy="510" r="8" fill="#fca5a5" opacity="0.85"/>
  <path d="M460,512 Q468,520 477,512" stroke="#2b2440" stroke-width="3" fill="none" stroke-linecap="round"/>

  <g transform="translate(640,668)">
    <rect x="-230" y="-24" width="460" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">12 ลาย · กระจกแนวตั้ง/แนวนอน · แข่งสด</text>
  </g>
</svg>
