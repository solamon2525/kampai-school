<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จังหวะและเครื่องหมายดนตรี — สื่อการสอน — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#b45309;--line:#fde68a;--soft:#fffbeb;--muted:#64748b;--ok:#16a34a;--bad:#dc2626}
    body{font-family:'Sarabun',sans-serif;background:linear-gradient(160deg,#fef3c7,#ffedd5);min-height:100%;padding:12px;color:#0f172a}
    .shell{max-width:960px;margin:0 auto;background:#fff;border-radius:1.5rem;box-shadow:0 20px 50px rgba(15,23,42,.12);overflow:hidden;min-height:calc(100vh - 24px);display:flex;flex-direction:column}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#b45309,#f59e0b);color:#fff}
    header h1{font-size:1.1rem;font-weight:800;flex:1;min-width:140px}
    .badge{font-size:.75rem;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-weight:700}
    .btn{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:10px 14px;cursor:pointer}
    .btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;font-size:.85rem}
    .btn-primary{background:var(--deep);color:#fff}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);align-items:center}
    .seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid #fbbf24}
    .seg button{font-family:inherit;font-weight:800;border:none;background:#fff;color:var(--deep);padding:8px 14px;cursor:pointer}
    .seg button.on{background:var(--deep);color:#fff}
    .hint{font-size:.85rem;font-weight:600;color:var(--deep);flex:1;min-width:120px}
    .stage{flex:1;padding:16px}
    .panel{display:none;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
    .panel.on{display:flex}
    .subnav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .subnav button{font-family:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:6px 12px;cursor:pointer}
    .subnav button.on{background:var(--deep);border-color:var(--deep);color:#fff}
    .slide{display:none;flex-direction:column;gap:12px}
    .slide.on{display:flex}
    .fig{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
    .fig svg{max-width:100%;height:auto}
    .card{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--soft)}
    .card h3{color:var(--deep);font-weight:800;margin-bottom:6px;font-size:1.05rem}
    .card p{font-weight:600;line-height:1.55;font-size:.95rem}
    .ex{margin-top:8px;font-size:.85rem;font-weight:700;color:#92400e;background:#fff;border-radius:10px;padding:8px;border:1px dashed #fcd34d}
    .q{font-weight:800;font-size:1.15rem;text-align:center;color:var(--deep);line-height:1.45}
    .opts{display:flex;flex-direction:column;gap:8px}
    .opt{font-family:inherit;font-weight:700;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-size:.95rem}
    .opt.ok{background:#dcfce7;border-color:#86efac}.opt.no{background:#fee2e2;border-color:#fca5a5}
    .fb{font-weight:800;text-align:center;min-height:24px}
    .pcount{text-align:center;font-weight:700;color:var(--muted);font-size:.85rem}
    .footer{padding:10px 16px;font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
    .footer a{color:var(--deep);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
      <h1>🎵 จังหวะและเครื่องหมายดนตรี — สอนและฝึกสั้น</h1>
      <span class="badge">ป.3–4 · ศิลปะ (ดนตรี)</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 สอน</button>
        <button type="button" data-mode="practice">✏️ ฝึกสั้น</button>
      </span>
      <span class="hint" id="hintText">จังหวะ · ค่าตัวโน้ตสั้นยาว · ตัวหยุด · เครื่องหมายกำกับเพลง</span>
    </div>
    <div class="stage">
      <div class="panel on" id="learn">
        <div class="subnav" id="subnav"></div>
        <div id="slides"></div>
      </div>
      <div class="panel" id="practice">
        <p class="pcount" id="pcount"></p>
        <p class="q" id="pq"></p>
        <div class="opts" id="popts"></div>
        <p class="fb" id="pfb"></p>
        <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
      </div>
    </div>
    <footer class="footer">ตัวชี้วัด <strong>ศ 2.1 ป.3/2 · ศ 2.1 ป.4/3 · ศ 2.1 ป.4/4</strong> · คู่ใบงาน <a href="/games/arts/music-rhythm-worksheet.html">music-rhythm</a></footer>
  </div>
  <script>
    const MEDIA_SLUG = 'music-rhythm-media';
    if (window.KAMPAI) window.KAMPAI.setSlug('music-rhythm-media');
    document.getElementById('btnBack').onclick = () => { if (window.KAMPAI && window.KAMPAI.goHome) KAMPAI.goHome(); else history.back(); };

    /* วาดตัวโน้ตด้วย SVG (ไม่พึ่งฟอนต์สัญลักษณ์ดนตรี) */
    function noteSvg(type, size) {
      const s = size || 56;
      const head = { x: 20, y: 46 };
      let inner = '';
      if (type === 'whole') {
        inner = '<ellipse cx="28" cy="30" rx="13" ry="8.5" fill="none" stroke="#111" stroke-width="3"/>';
      } else if (type === 'half') {
        inner = '<ellipse cx="' + head.x + '" cy="' + head.y + '" rx="9" ry="6.5" transform="rotate(-20 ' + head.x + ' ' + head.y + ')" fill="none" stroke="#111" stroke-width="2.6"/>'
          + '<line x1="28.5" y1="43" x2="28.5" y2="6" stroke="#111" stroke-width="2.4"/>';
      } else if (type === 'quarter') {
        inner = '<ellipse cx="' + head.x + '" cy="' + head.y + '" rx="9" ry="6.5" transform="rotate(-20 ' + head.x + ' ' + head.y + ')" fill="#111"/>'
          + '<line x1="28.5" y1="43" x2="28.5" y2="6" stroke="#111" stroke-width="2.4"/>';
      } else if (type === 'eighth') {
        inner = '<ellipse cx="' + head.x + '" cy="' + head.y + '" rx="9" ry="6.5" transform="rotate(-20 ' + head.x + ' ' + head.y + ')" fill="#111"/>'
          + '<line x1="28.5" y1="43" x2="28.5" y2="6" stroke="#111" stroke-width="2.4"/>'
          + '<path d="M28.5 6 C 40 12, 40 22, 30 28" fill="none" stroke="#111" stroke-width="2.6"/>';
      }
      return '<svg viewBox="0 0 56 56" width="' + s + '" height="' + s + '">' + inner + '</svg>';
    }

    const SLIDES = [
      {
        tab: '1. จังหวะคืออะไร',
        svg: '<svg viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="จังหวะเคาะสม่ำเสมอเหมือนชีพจร">'
          + '<text x="70" y="80" text-anchor="middle" font-size="52">🫀</text>'
          + '<text x="70" y="130" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="700" fill="#92400e">ชีพจรเต้นสม่ำเสมอ</text>'
          + Array.from({length:8},(_,i)=>'<circle cx="'+(190+i*58)+'" cy="70" r="13" fill="'+(i%2===0?'#b45309':'#fbbf24')+'"/>').join('')
          + Array.from({length:8},(_,i)=>'<text x="'+(190+i*58)+'" y="115" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">'+(i%4+1)+'</text>').join('')
          + '<text x="395" y="150" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="700" fill="#92400e">เคาะ 1–2–3–4 ซ้ำไปเรื่อย ๆ อย่างสม่ำเสมอ = จังหวะ (Beat)</text></svg>',
        body: '<div class="card"><h3>🥁 จังหวะ (Beat)</h3><p>คือการเคาะที่<strong>ดังสม่ำเสมอเท่ากันตลอดเพลง</strong> เหมือนชีพจรหรือเสียงนาฬิกา ทุกเพลงมีจังหวะซ่อนอยู่ เราปรบมือหรือเคาะโต๊ะตามได้</p><div class="ex">กิจกรรม: ครูเปิดเพลง แล้วให้นักเรียนปรบมือตามจังหวะ 1–2–3–4 พร้อมกัน</div></div>'
      },
      {
        tab: '2. ค่าตัวโน้ตสั้น–ยาว',
        svg: '<svg viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="ค่าตัวโน้ตสี่ชนิด">'
          + '<g transform="translate(45,15)">' + '' + '</g>'
          + '<g transform="translate(30,20) scale(1.15)"><ellipse cx="28" cy="30" rx="13" ry="8.5" fill="none" stroke="#111" stroke-width="3"/></g>'
          + '<text x="65" y="120" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">ตัวกลม</text><text x="65" y="145" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">4 จังหวะ (ยาวสุด)</text>'
          + '<g transform="translate(180,25)"><ellipse cx="20" cy="66" rx="10" ry="7" transform="rotate(-20 20 66)" fill="none" stroke="#111" stroke-width="2.6"/><line x1="29" y1="62" x2="29" y2="10" stroke="#111" stroke-width="2.4"/></g>'
          + '<text x="205" y="120" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">ตัวขาว</text><text x="205" y="145" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">2 จังหวะ</text>'
          + '<g transform="translate(330,25)"><ellipse cx="20" cy="66" rx="10" ry="7" transform="rotate(-20 20 66)" fill="#111"/><line x1="29" y1="62" x2="29" y2="10" stroke="#111" stroke-width="2.4"/></g>'
          + '<text x="355" y="120" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">ตัวดำ</text><text x="355" y="145" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">1 จังหวะ</text>'
          + '<g transform="translate(480,25)"><ellipse cx="20" cy="66" rx="10" ry="7" transform="rotate(-20 20 66)" fill="#111"/><line x1="29" y1="62" x2="29" y2="10" stroke="#111" stroke-width="2.4"/><path d="M29 10 C 42 17, 42 28, 31 35" fill="none" stroke="#111" stroke-width="2.6"/></g>'
          + '<text x="505" y="120" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">เขบ็ตหนึ่งชั้น</text><text x="505" y="145" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">ครึ่งจังหวะ (สั้น)</text>'
          + '<text x="320" y="190" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="700" fill="#92400e">ตัวกลม 1 ตัว = ตัวขาว 2 ตัว = ตัวดำ 4 ตัว = เขบ็ตหนึ่งชั้น 8 ตัว</text></svg>',
        body: '<div class="card"><h3>🎼 ค่าตัวโน้ต (ความสั้น–ยาวของเสียง)</h3><p>ตัวโน้ตแต่ละชนิดบอกให้ร้อง/เล่น<strong>ยาวไม่เท่ากัน</strong>: <strong>ตัวกลม = 4 จังหวะ</strong> · <strong>ตัวขาว = 2 จังหวะ</strong> · <strong>ตัวดำ = 1 จังหวะ</strong> · <strong>เขบ็ตหนึ่งชั้น = ครึ่งจังหวะ</strong></p><div class="ex">วิธีจำ: หัวโปร่งไม่มีก้าน = ยาวสุด · ยิ่งมีก้านมีธง (เขบ็ต) เสียงยิ่งสั้นลง</div></div>'
      },
      {
        tab: '3. ตัวหยุด',
        svg: '<svg viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="ตัวหยุดชนิดต่าง ๆ">'
          + '<line x1="60" y1="55" x2="180" y2="55" stroke="#111" stroke-width="2"/><rect x="100" y="55" width="34" height="12" fill="#111"/>'
          + '<text x="120" y="115" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">หยุดตัวกลม</text><text x="120" y="140" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">เงียบ 4 จังหวะ (แขวนใต้เส้น)</text>'
          + '<line x1="260" y1="67" x2="380" y2="67" stroke="#111" stroke-width="2"/><rect x="300" y="55" width="34" height="12" fill="#111"/>'
          + '<text x="320" y="115" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">หยุดตัวขาว</text><text x="320" y="140" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">เงียบ 2 จังหวะ (วางบนเส้น)</text>'
          + '<path d="M520 25 l12 14 c-6 6 -8 10 -2 17 c-8 2 -12 8 -8 16 c-7 -3 -8 -9 -3 -14 l-9 -11 c6 -5 9 -12 10 -22 z" fill="#111"/>'
          + '<text x="525" y="115" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">หยุดตัวดำ</text><text x="525" y="140" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#b45309">เงียบ 1 จังหวะ</text></svg>',
        body: '<div class="card"><h3>🤫 ตัวหยุด (Rest)</h3><p>เครื่องหมายที่บอกให้<strong>เงียบเสียง</strong> ไม่ร้องไม่เล่น แต่<strong>ยังต้องนับจังหวะต่อ</strong> ตัวหยุดมีค่าเท่ากับตัวโน้ตแต่ละชนิด เช่น หยุดตัวดำ = เงียบ 1 จังหวะ</p><div class="ex">เกมในห้อง: ปรบมือตามโน้ต พอเจอตัวหยุด ให้กำมือเงียบไว้ 1 จังหวะ</div></div>'
      },
      {
        tab: '4. บรรทัด 5 เส้น·เครื่องหมาย',
        svg: '<svg viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="บรรทัดห้าเส้น กุญแจซอล เส้นกั้นห้อง เครื่องหมายประจำจังหวะ">'
          + Array.from({length:5},(_,i)=>'<line x1="60" y1="'+(50+i*14)+'" x2="600" y2="'+(50+i*14)+'" stroke="#111" stroke-width="1.6"/>').join('')
          + '<path d="M95 118 C 78 112, 76 92, 92 86 C 108 80, 116 96, 104 104 C 90 112, 84 60, 96 34 C 104 48, 100 70, 94 92" fill="none" stroke="#b45309" stroke-width="3.4" stroke-linecap="round"/>'
          + '<text x="150" y="76" font-family="Sarabun,sans-serif" font-size="26" font-weight="800" fill="#111">4</text><text x="150" y="104" font-family="Sarabun,sans-serif" font-size="26" font-weight="800" fill="#111">4</text>'
          + '<line x1="330" y1="50" x2="330" y2="106" stroke="#111" stroke-width="2.4"/>'
          + '<line x1="470" y1="50" x2="470" y2="106" stroke="#111" stroke-width="2.4"/>'
          + '<line x1="592" y1="50" x2="592" y2="106" stroke="#111" stroke-width="2"/><line x1="598" y1="50" x2="598" y2="106" stroke="#111" stroke-width="4"/>'
          + '<text x="100" y="150" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#92400e">กุญแจซอล</text>'
          + '<text x="160" y="150" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#92400e">4/4</text>'
          + '<text x="330" y="150" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#92400e">เส้นกั้นห้อง</text>'
          + '<text x="595" y="150" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="700" fill="#92400e">เส้นจบเพลง</text>'
          + '<text x="320" y="185" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="700" fill="#78350f">บรรทัด 5 เส้น ใช้บันทึกตัวโน้ต · เลข 4/4 = 1 ห้องมี 4 จังหวะ</text></svg>',
        body: '<div class="card"><h3>📏 เครื่องหมายกำกับเพลง</h3><p><strong>บรรทัด 5 เส้น</strong> ใช้บันทึกตัวโน้ต · <strong>กุญแจซอล</strong> วางไว้ต้นบรรทัดเพื่อกำหนดระดับเสียง · <strong>เส้นกั้นห้อง</strong> แบ่งเพลงเป็นห้อง ๆ · <strong>เครื่องหมายประจำจังหวะ 4/4</strong> บอกว่า 1 ห้องมี 4 จังหวะ (ตัวดำ = 1 จังหวะ)</p><div class="ex">ลองนับ: ห้อง 4/4 ใส่ตัวดำได้ 4 ตัว หรือตัวขาว 2 ตัว หรือตัวกลม 1 ตัว</div></div>'
      },
      {
        tab: '5. ช้า–เร็ว·รูปแบบจังหวะ',
        svg: '<svg viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="จังหวะช้าเร็วและรูปแบบจังหวะปรบมือ">'
          + '<text x="90" y="55" text-anchor="middle" font-size="40">🐢</text><text x="90" y="95" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">จังหวะช้า</text><text x="90" y="118" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" font-weight="700" fill="#b45309">เพลงกล่อมเด็ก สงบ</text>'
          + '<text x="230" y="55" text-anchor="middle" font-size="40">🐇</text><text x="230" y="95" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#78350f">จังหวะเร็ว</text><text x="230" y="118" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" font-weight="700" fill="#b45309">เพลงเชียร์ สนุก คึกคัก</text>'
          + '<g transform="translate(360,20)"><rect x="0" y="0" width="250" height="110" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>'
          + '<text x="40" y="45" text-anchor="middle" font-size="26">👏</text><text x="100" y="45" text-anchor="middle" font-size="26">👏</text><text x="160" y="38" text-anchor="middle" font-size="18">👏👏</text><text x="215" y="45" text-anchor="middle" font-size="26">🤫</text>'
          + '<text x="40" y="82" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#78350f">ตา</text><text x="100" y="82" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#78350f">ตา</text><text x="160" y="82" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#78350f">ติ–ติ</text><text x="215" y="82" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#78350f">หยุด</text></g>'
          + '<text x="485" y="160" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="700" fill="#92400e">รูปแบบจังหวะ: ตา = ตัวดำ · ติ–ติ = เขบ็ตคู่ · หยุด = เงียบ</text></svg>',
        body: '<div class="card"><h3>🐢🐇 ความช้า–เร็วของจังหวะ (Tempo) และรูปแบบจังหวะ</h3><p>เพลงแต่ละเพลงมีความเร็วจังหวะต่างกัน <strong>จังหวะช้า</strong> ให้ความรู้สึกสงบ อ่อนโยน <strong>จังหวะเร็ว</strong> ให้ความรู้สึกสนุก คึกคัก เรานำตัวโน้ตมาเรียงเป็น<strong>รูปแบบจังหวะ</strong> แล้วปรบมือหรือใช้สัญลักษณ์แทนเสียงเคาะได้</p><div class="ex">อ่านออกเสียง: ตา · ตา · ติ–ติ · หยุด แล้วปรบมือตาม (ตา=1 จังหวะ, ติ–ติ=สั้น 2 ครั้งใน 1 จังหวะ)</div></div>'
      },
    ];

    const subnav = document.getElementById('subnav');
    const slidesBox = document.getElementById('slides');
    SLIDES.forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = s.tab; b.dataset.slide = i;
      if (i === 0) b.classList.add('on');
      subnav.appendChild(b);
      const d = document.createElement('div');
      d.className = 'slide' + (i === 0 ? ' on' : ''); d.dataset.slide = i;
      d.innerHTML = '<div class="fig">' + s.svg + '</div>' + s.body;
      slidesBox.appendChild(d);
    });
    subnav.onclick = (e) => {
      const b = e.target.closest('button[data-slide]');
      if (!b) return;
      subnav.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      slidesBox.querySelectorAll('.slide').forEach((s) => s.classList.toggle('on', s.dataset.slide === b.dataset.slide));
    };

    /* ---------- ฝึกสั้น MCQ ---------- */
    const QS = [
      { q: 'จังหวะ (Beat) ของเพลง เปรียบได้กับข้อใด?', opts: ['ชีพจรที่เต้นสม่ำเสมอ', 'เสียงร้องของนักร้อง', 'ชื่อของเพลง', 'เนื้อเพลงท่อนฮุก'], a: 'ชีพจรที่เต้นสม่ำเสมอ' },
      { q: 'โน้ตตัวดำ มีค่ากี่จังหวะ?', opts: ['1 จังหวะ', '2 จังหวะ', '4 จังหวะ', 'ครึ่งจังหวะ'], a: '1 จังหวะ' },
      { q: 'โน้ตตัวขาว มีค่ากี่จังหวะ?', opts: ['2 จังหวะ', '1 จังหวะ', '4 จังหวะ', 'ครึ่งจังหวะ'], a: '2 จังหวะ' },
      { q: 'โน้ตตัวกลม มีค่ากี่จังหวะ?', opts: ['4 จังหวะ', '2 จังหวะ', '1 จังหวะ', '3 จังหวะ'], a: '4 จังหวะ' },
      { q: 'โน้ตเขบ็ตหนึ่งชั้น มีค่ากี่จังหวะ?', opts: ['ครึ่งจังหวะ', '1 จังหวะ', '2 จังหวะ', '4 จังหวะ'], a: 'ครึ่งจังหวะ' },
      { q: 'เครื่องหมายที่บอกให้ "เงียบเสียง" แต่ยังนับจังหวะต่อ คือข้อใด?', opts: ['ตัวหยุด', 'กุญแจซอล', 'เส้นกั้นห้อง', 'ตัวกลม'], a: 'ตัวหยุด' },
      { q: 'บรรทัด 5 เส้น มีไว้เพื่ออะไร?', opts: ['บันทึกตัวโน้ต', 'วาดรูประบายสี', 'เขียนเนื้อเพลงภาษาไทย', 'คั่นหน้ากระดาษ'], a: 'บันทึกตัวโน้ต' },
      { q: 'กุญแจซอล วางไว้ที่ตำแหน่งใด?', opts: ['ต้นบรรทัด 5 เส้น', 'ท้ายเพลง', 'กลางห้องเพลง', 'ใต้เนื้อเพลง'], a: 'ต้นบรรทัด 5 เส้น' },
      { q: 'เครื่องหมายประจำจังหวะ 4/4 บอกอะไรเรา?', opts: ['1 ห้องมี 4 จังหวะ', 'เพลงมี 4 ท่อน', 'ต้องร้อง 4 รอบ', 'มีนักดนตรี 4 คน'], a: '1 ห้องมี 4 จังหวะ' },
      { q: 'เพลงกล่อมเด็กที่ฟังแล้วสงบ ง่วงนอน มักมีจังหวะแบบใด?', opts: ['ช้า นุ่มนวล', 'เร็ว คึกคัก', 'ดังสนั่น', 'ไม่มีจังหวะ'], a: 'ช้า นุ่มนวล' },
    ];

    let queue = [];
    let qNo = 0;
    function nextPractice() {
      if (!queue.length) { queue = QS.slice().sort(() => Math.random() - 0.5); }
      const item = queue.shift();
      qNo += 1;
      document.getElementById('pcount').textContent = 'ข้อที่ ' + qNo + ' (คลัง ' + QS.length + ' ข้อ)';
      document.getElementById('pq').textContent = item.q;
      document.getElementById('pfb').textContent = '';
      const opts = item.opts.slice().sort(() => Math.random() - 0.5);
      document.getElementById('popts').innerHTML = opts.map((o) =>
        '<button type="button" class="opt" data-a="' + o + '">' + o + '</button>'
      ).join('');
      document.querySelectorAll('#popts .opt').forEach((btn) => {
        btn.onclick = () => {
          const ok = btn.dataset.a === item.a;
          btn.classList.add(ok ? 'ok' : 'no');
          document.querySelectorAll('#popts .opt').forEach((b) => {
            b.disabled = true;
            if (b.dataset.a === item.a) b.classList.add('ok');
          });
          document.getElementById('pfb').textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: ' + item.a;
          document.getElementById('pfb').style.color = ok ? 'var(--ok)' : 'var(--bad)';
          if (window.KAMPAI && window.KAMPAI.sound) (ok ? KAMPAI.sound.correct : KAMPAI.sound.wrong)();
        };
      });
    }

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b) return;
      const mode = b.dataset.mode;
      document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x === b));
      document.getElementById('learn').classList.toggle('on', mode === 'learn');
      document.getElementById('practice').classList.toggle('on', mode === 'practice');
      document.getElementById('hintText').textContent =
        mode === 'learn' ? 'จังหวะ · ค่าตัวโน้ตสั้นยาว · ตัวหยุด · เครื่องหมายกำกับเพลง' : 'เลือกคำตอบ 4 ตัวเลือก';
      if (mode === 'practice') nextPractice();
    };
    document.getElementById('btnNext').onclick = nextPractice;
  </script>
</body>
</html>
