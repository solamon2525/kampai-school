<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.25"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎵</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🥁</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">Rhythm Master</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">เคาะตามจังหวะ เรียนรู้โน้ตดนตรีและฝึกความแม่นยำ</text>

  <!-- Rhythm track preview representation -->
  <g transform="translate(640,520)">
    <!-- Track line -->
    <rect x="-400" y="-30" width="800" height="60" rx="30" fill="#1e293b" stroke="#ec4899" stroke-width="4"/>
    <!-- Target ring -->
    <circle cx="-250" cy="0" r="40" fill="none" stroke="#60a5fa" stroke-width="6" filter="url(#sh)"/>
    <circle cx="-250" cy="0" r="15" fill="#60a5fa"/>
    <!-- Note bubbles (Don / Ka representation) -->
    <circle cx="-50" cy="0" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text x="-50" y="2" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">ดอน</text>

    <circle cx="100" cy="0" r="28" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="100" y="2" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">ก๊ะ</text>

    <circle cx="200" cy="0" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <text x="200" y="2" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">ดอน</text>

    <circle cx="300" cy="0" r="28" fill="#3b82f6" stroke="#ffffff" stroke-width="3"/>
    <text x="300" y="2" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">ก๊ะ</text>
  </g>
  <g transform="translate(640,648)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#ec4899" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fbcfe8" text-anchor="middle" dominant-baseline="middle">กดปุ่ม J (แดง/ดอน) และ K (น้ำเงิน/ก๊ะ) ให้ตรงเป้า!</text>
  </g>
</svg>
