<!DOCTYPE html>
<html lang="th">
<head>
  <script src="/games/kampai-sdk.js?v=1.181.0"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>นาฏศิลป์พื้นฐาน ภาษาท่า–นาฏยศัพท์ — สื่อการสอน — บ้านคำไผ่</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#be123c;--line:#fecdd3;--soft:#fff1f2;--muted:#64748b;--ok:#16a34a;--bad:#dc2626}
    body{font-family:'Sarabun',sans-serif;background:linear-gradient(160deg,#ffe4e6,#fef3c7);min-height:100%;padding:12px;color:#0f172a}
    .shell{max-width:960px;margin:0 auto;background:#fff;border-radius:1.5rem;box-shadow:0 20px 50px rgba(15,23,42,.12);overflow:hidden;min-height:calc(100vh - 24px);display:flex;flex-direction:column}
    header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,#be123c,#fb7185);color:#fff}
    header h1{font-size:1.1rem;font-weight:800;flex:1;min-width:140px}
    .badge{font-size:.75rem;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;font-weight:700}
    .btn{font-family:inherit;font-weight:700;border:none;border-radius:12px;padding:10px 14px;cursor:pointer}
    .btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:8px 12px;font-size:.85rem}
    .btn-primary{background:var(--deep);color:#fff}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);align-items:center}
    .seg{display:inline-flex;border-radius:12px;overflow:hidden;border:2px solid #fda4af}
    .seg button{font-family:inherit;font-weight:800;border:none;background:#fff;color:var(--deep);padding:8px 14px;cursor:pointer}
    .seg button.on{background:var(--deep);color:#fff}
    .hint{font-size:.85rem;font-weight:600;color:var(--deep);flex:1;min-width:120px}
    .stage{flex:1;padding:16px}
    .panel{display:none;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
    .panel.on{display:flex}
    .subnav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .subnav button{font-family:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:6px 12px;cursor:pointer}
    .subnav button.on{background:var(--deep);border-color:var(--deep);color:#fff}
    .slide{display:none;flex-direction:column;gap:12px}
    .slide.on{display:flex}
    .fig{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
    .fig svg{max-width:100%;height:auto}
    .card{border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--soft)}
    .card h3{color:var(--deep);font-weight:800;margin-bottom:6px;font-size:1.05rem}
    .card p{font-weight:600;line-height:1.55;font-size:.95rem}
    .ex{margin-top:8px;font-size:.85rem;font-weight:700;color:#9f1239;background:#fff;border-radius:10px;padding:8px;border:1px dashed #fda4af}
    .q{font-weight:800;font-size:1.15rem;text-align:center;color:var(--deep);line-height:1.45}
    .opts{display:flex;flex-direction:column;gap:8px}
    .opt{font-family:inherit;font-weight:700;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font-size:.95rem}
    .opt.ok{background:#dcfce7;border-color:#86efac}.opt.no{background:#fee2e2;border-color:#fca5a5}
    .fb{font-weight:800;text-align:center;min-height:24px}
    .pcount{text-align:center;font-weight:700;color:var(--muted);font-size:.85rem}
    .footer{padding:10px 16px;font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
    .footer a{color:var(--deep);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <button type="button" class="btn btn-back" id="btnBack">← กลับคลังสื่อ</button>
      <h1>💃 นาฏศิลป์พื้นฐาน — สอนและฝึกสั้น</h1>
      <span class="badge">ป.3–5 · ศิลปะ (นาฏศิลป์)</span>
    </header>
    <div class="toolbar">
      <span class="seg" id="modeSeg">
        <button type="button" data-mode="learn" class="on">📖 สอน</button>
        <button type="button" data-mode="practice">✏️ ฝึกสั้น</button>
      </span>
      <span class="hint" id="hintText">นาฏยศัพท์ · ภาษาท่า · การเคลื่อนไหวประกอบเพลง</span>
    </div>
    <div class="stage">
      <div class="panel on" id="learn">
        <div class="subnav" id="subnav"></div>
        <div id="slides"></div>
      </div>
      <div class="panel" id="practice">
        <p class="pcount" id="pcount"></p>
        <p class="q" id="pq"></p>
        <div class="opts" id="popts"></div>
        <p class="fb" id="pfb"></p>
        <button type="button" class="btn btn-primary" id="btnNext">ข้อถัดไป</button>
      </div>
    </div>
    <footer class="footer">ตัวชี้วัด <strong>ศ 3.1 ป.3/2 · ศ 3.1 ป.4/2 · ศ 3.1 ป.5/3</strong> · คู่ใบงาน <a href="/games/arts/thai-dance-worksheet.html">thai-dance</a></footer>
  </div>
  <script>
    const MEDIA_SLUG = 'thai-dance-media';
    if (window.KAMPAI) window.KAMPAI.setSlug('thai-dance-media');
    document.getElementById('btnBack').onclick = () => { if (window.KAMPAI && window.KAMPAI.goHome) KAMPAI.goHome(); else history.back(); };

    const SLIDES = [
      {
        tab: '1. นาฏยศัพท์ · มือ',
        svg: '<svg viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="ท่าจีบและตั้งวง">'
          /* จีบ (close-up มือ) */
          + '<g transform="translate(60,30)"><ellipse cx="60" cy="90" rx="34" ry="42" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>'
          + '<circle cx="38" cy="52" r="14" fill="none" stroke="#b45309" stroke-width="3"/>'
          + '<line x1="66" y1="46" x2="80" y2="8" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>'
          + '<line x1="80" y1="52" x2="100" y2="20" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>'
          + '<line x1="90" y1="62" x2="114" y2="38" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>'
          + '<text x="60" y="165" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="16" font-weight="800" fill="#9f1239">«จีบ»</text>'
          + '<text x="60" y="188" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" font-weight="700" fill="#be123c">หัวแม่มือจรดข้อแรกนิ้วชี้</text>'
          + '<text x="60" y="206" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" font-weight="700" fill="#be123c">อีกสามนิ้วเหยียดตึงคล้ายพัด</text></g>'
          /* ตั้งวงบน (stick figure) */
          + '<g transform="translate(330,15)" stroke="#be123c" stroke-width="4" fill="none" stroke-linecap="round">'
          + '<circle cx="70" cy="30" r="16"/>'
          + '<line x1="70" y1="46" x2="70" y2="115"/>'
          + '<path d="M70 60 C 40 58, 22 42, 28 18"/><circle cx="28" cy="14" r="5" fill="#be123c"/>'
          + '<path d="M70 60 C 100 58, 118 42, 112 18"/><circle cx="112" cy="14" r="5" fill="#be123c"/>'
          + '<line x1="70" y1="115" x2="50" y2="165"/><line x1="70" y1="115" x2="90" y2="165"/>'
          + '</g>'
          + '<text x="400" y="205" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="16" font-weight="800" fill="#9f1239">«ตั้งวงบน» ยกแขนโค้งเป็นวงระดับศีรษะ นิ้วเรียงชิด</text>'
          + '<text x="400" y="226" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="13" font-weight="700" fill="#be123c">ตั้งวงล่าง = วงโค้งระดับเอว/ชายพก</text></svg>',
        body: '<div class="card"><h3>🖐️ นาฏยศัพท์ของมือ</h3><p><strong>นาฏยศัพท์</strong> คือคำเรียกท่ารำพื้นฐานของนาฏศิลป์ไทย ท่ามือสำคัญ ได้แก่ <strong>จีบ</strong> (หัวแม่มือจรดข้อแรกของนิ้วชี้ อีกสามนิ้วเหยียดตึง มีทั้งจีบหงาย–จีบคว่ำ) และ <strong>ตั้งวง</strong> (ยกแขนโค้งเป็นวง นิ้วทั้งสี่เรียงชิด หัวแม่มือหักเข้าหาฝ่ามือ มีวงบน–วงล่าง)</p><div class="ex">ฝึกหน้ากระจก: จีบหงาย 8 จังหวะ สลับตั้งวงบน 8 จังหวะ</div></div>'
      },
      {
        tab: '2. นาฏยศัพท์ · เท้า',
        svg: '<svg viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="ประเท้าและกระดกเท้า">'
          + '<g transform="translate(100,15)" stroke="#be123c" stroke-width="4" fill="none" stroke-linecap="round">'
          + '<circle cx="60" cy="30" r="16"/><line x1="60" y1="46" x2="60" y2="115"/>'
          + '<path d="M60 62 C 40 70, 30 85, 34 100"/><path d="M60 62 C 80 70, 90 85, 86 100"/>'
          + '<line x1="60" y1="115" x2="45" y2="168"/>'
          + '<line x1="60" y1="115" x2="92" y2="150"/><line x1="92" y1="150" x2="104" y2="166"/>'
          + '<line x1="30" y1="170" x2="130" y2="170" stroke="#94a3b8" stroke-width="2"/>'
          + '</g>'
          + '<text x="160" y="215" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«ประเท้า» ใช้จมูกเท้าแตะพื้นเบา ๆ แล้วยกขึ้น</text>'
          + '<g transform="translate(400,15)" stroke="#be123c" stroke-width="4" fill="none" stroke-linecap="round">'
          + '<circle cx="60" cy="30" r="16"/><line x1="60" y1="46" x2="60" y2="115"/>'
          + '<path d="M60 62 C 40 70, 30 85, 34 100"/><path d="M60 62 C 80 70, 90 85, 86 100"/>'
          + '<line x1="60" y1="115" x2="48" y2="168"/>'
          + '<path d="M60 115 C 85 125, 95 145, 82 158"/><path d="M82 158 L 96 148"/>'
          + '<line x1="30" y1="170" x2="130" y2="170" stroke="#94a3b8" stroke-width="2"/>'
          + '</g>'
          + '<text x="460" y="215" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«กระดกเท้า» พับขาไปข้างหลัง ปลายเท้ากระดกขึ้น</text></svg>',
        body: '<div class="card"><h3>🦶 นาฏยศัพท์ของเท้า</h3><p>ท่าเท้าพื้นฐาน ได้แก่ <strong>ประเท้า</strong> (ใช้จมูกเท้าแตะพื้นแล้วยกขึ้น เป็นการเตรียมก้าว) <strong>กระดกเท้า</strong> (พับขาไปด้านหลัง หนีบน่อง ปลายเท้ากระดกขึ้น) และ<strong>การก้าวข้าง–ก้าวหน้า</strong>ตามจังหวะเพลง</p><div class="ex">ฝึกจับคู่: คนหนึ่งตีฉิ่ง ฉิ่ง–ฉับ อีกคนประเท้าตามจังหวะ แล้วสลับกัน</div></div>'
      },
      {
        tab: '3. ภาษาท่า',
        svg: '<svg viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="ภาษาท่าสี่ท่า">'
          /* ตัวฉัน */
          + '<g transform="translate(30,20)" stroke="#be123c" stroke-width="3.5" fill="none" stroke-linecap="round">'
          + '<circle cx="55" cy="26" r="13"/><line x1="55" y1="39" x2="55" y2="98"/>'
          + '<path d="M55 52 C 35 60, 30 72, 44 66"/><line x1="44" y1="66" x2="52" y2="60"/>'
          + '<path d="M55 52 C 75 62, 82 78, 76 92"/>'
          + '<line x1="55" y1="98" x2="42" y2="140"/><line x1="55" y1="98" x2="68" y2="140"/></g>'
          + '<text x="85" y="190" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«ตัวฉัน»</text>'
          + '<text x="85" y="212" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="12.5" font-weight="700" fill="#be123c">นิ้วชี้จรดอกตนเอง</text>'
          /* รัก */
          + '<g transform="translate(185,20)" stroke="#be123c" stroke-width="3.5" fill="none" stroke-linecap="round">'
          + '<circle cx="55" cy="26" r="13"/><line x1="55" y1="39" x2="55" y2="98"/>'
          + '<path d="M55 52 C 38 62, 42 70, 50 64"/><path d="M55 52 C 72 62, 68 70, 60 64"/>'
          + '<line x1="55" y1="98" x2="42" y2="140"/><line x1="55" y1="98" x2="68" y2="140"/></g>'
          + '<text x="240" y="190" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«รัก»</text>'
          + '<text x="240" y="212" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="12.5" font-weight="700" fill="#be123c">ฝ่ามือทั้งสองทาบที่อก</text>'
          /* ปฏิเสธ */
          + '<g transform="translate(340,20)" stroke="#be123c" stroke-width="3.5" fill="none" stroke-linecap="round">'
          + '<circle cx="55" cy="26" r="13"/><line x1="55" y1="39" x2="55" y2="98"/>'
          + '<path d="M55 52 C 30 50, 16 34, 20 22"/><line x1="14" y1="26" x2="26" y2="18"/>'
          + '<path d="M55 52 C 75 62, 82 78, 76 92"/>'
          + '<line x1="55" y1="98" x2="42" y2="140"/><line x1="55" y1="98" x2="68" y2="140"/></g>'
          + '<text x="395" y="190" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«ปฏิเสธ (ไม่)»</text>'
          + '<text x="395" y="212" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="12.5" font-weight="700" fill="#be123c">ตั้งฝ่ามือแล้วสั่นมือ</text>'
          /* เรียก */
          + '<g transform="translate(495,20)" stroke="#be123c" stroke-width="3.5" fill="none" stroke-linecap="round">'
          + '<circle cx="55" cy="26" r="13"/><line x1="55" y1="39" x2="55" y2="98"/>'
          + '<path d="M55 52 C 34 44, 24 28, 32 14"/><path d="M32 14 C 36 22, 34 26, 28 28"/>'
          + '<path d="M55 52 C 75 62, 82 78, 76 92"/>'
          + '<line x1="55" y1="98" x2="42" y2="140"/><line x1="55" y1="98" x2="68" y2="140"/></g>'
          + '<text x="550" y="190" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="15" font-weight="800" fill="#9f1239">«เรียก (มานี่)»</text>'
          + '<text x="550" y="212" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="12.5" font-weight="700" fill="#be123c">ยกมือกวักเข้าหาตัว</text></svg>',
        body: '<div class="card"><h3>🤟 ภาษาท่า — พูดด้วยท่าทาง</h3><p><strong>ภาษาท่า</strong> คือการใช้ท่าทาง<strong>สื่อความหมายแทนคำพูด</strong> เช่น ตัวฉัน (นิ้วชี้จรดอก) · ท่าน/เธอ (ผายมือไปทางผู้อื่น) · รัก (มือทาบอก) · ปฏิเสธ (ตั้งฝ่ามือสั่น) · เรียก (กวักมือ) · ร้องไห้ (ฝ่ามือแตะใต้ตา) · โกรธ (กระทืบเท้า ชี้หน้า)</p><div class="ex">เกมใบ้ท่า: ครูบอกคำ เช่น «ฉันรักเธอ» นักเรียนแสดง 3 ท่าต่อกัน: ตัวฉัน → รัก → ท่าน</div></div>'
      },
      {
        tab: '4. เคลื่อนไหวประกอบเพลง',
        svg: '<svg viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="เคลื่อนไหวตามจังหวะช้าเร็ว ทิศทาง และระดับ">'
          + '<text x="90" y="60" text-anchor="middle" font-size="42">🐢</text>'
          + '<text x="90" y="105" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#9f1239">เพลงช้า → ท่านุ่มนวล ต่อเนื่อง</text>'
          + '<text x="90" y="150" text-anchor="middle" font-size="42">🐇</text>'
          + '<text x="90" y="192" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#9f1239">เพลงเร็ว → ท่ากระฉับกระเฉง</text>'
          + '<g stroke="#be123c" stroke-width="4" fill="none" stroke-linecap="round"><path d="M250 100 h90"/><path d="M330 90 l14 10 -14 10"/><path d="M420 145 v-80"/><path d="M410 80 l10 -14 10 14"/></g>'
          + '<text x="335" y="175" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#9f1239">ทิศทาง: หน้า–หลัง–ซ้าย–ขวา</text>'
          + '<g transform="translate(490,20)"><rect x="0" y="115" width="120" height="10" fill="#fda4af"/><rect x="20" y="75" width="80" height="10" fill="#fb7185"/><rect x="40" y="35" width="40" height="10" fill="#be123c"/>'
          + '<text x="60" y="160" text-anchor="middle" font-family="Sarabun,sans-serif" font-size="14" font-weight="800" fill="#9f1239">ระดับ: ต่ำ–กลาง–สูง</text></g></svg>',
        body: '<div class="card"><h3>🎶 การเคลื่อนไหวประกอบเพลง</h3><p>หลักสำคัญ 3 ข้อ: <strong>(1) ตรงจังหวะ</strong> — ฟังจังหวะเพลงแล้วขยับให้พอดี เพลงช้าใช้ท่านุ่มนวล เพลงเร็วใช้ท่ากระฉับกระเฉง <strong>(2) ใช้ทิศทาง</strong> — หน้า หลัง ซ้าย ขวา หมุนตัว <strong>(3) ใช้ระดับ</strong> — สูง (เขย่ง/ยกแขน) กลาง (ยืน) ต่ำ (ย่อ/นั่ง) และแสดงให้<strong>พร้อมเพรียงกับกลุ่ม</strong></p><div class="ex">กิจกรรม: เปิดเพลงรำวงมาตรฐาน ให้นักเรียนออกแบบท่า 8 จังหวะ ใช้ครบทั้งทิศทางและระดับ</div></div>'
      },
    ];

    const subnav = document.getElementById('subnav');
    const slidesBox = document.getElementById('slides');
    SLIDES.forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = s.tab; b.dataset.slide = i;
      if (i === 0) b.classList.add('on');
      subnav.appendChild(b);
      const d = document.createElement('div');
      d.className = 'slide' + (i === 0 ? ' on' : ''); d.dataset.slide = i;
      d.innerHTML = '<div class="fig">' + s.svg + '</div>' + s.body;
      slidesBox.appendChild(d);
    });
    subnav.onclick = (e) => {
      const b = e.target.closest('button[data-slide]');
      if (!b) return;
      subnav.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      slidesBox.querySelectorAll('.slide').forEach((s) => s.classList.toggle('on', s.dataset.slide === b.dataset.slide));
    };

    /* ---------- ฝึกสั้น MCQ ---------- */
    const QS = [
      { q: '«นาฏยศัพท์» หมายถึงอะไร?', opts: ['คำเรียกท่ารำพื้นฐานของนาฏศิลป์ไทย', 'ชื่อเพลงไทยเดิม', 'เครื่องแต่งกายละคร', 'เวทีการแสดง'], a: 'คำเรียกท่ารำพื้นฐานของนาฏศิลป์ไทย' },
      { q: 'ท่า «จีบ» ทำอย่างไร?', opts: ['หัวแม่มือจรดข้อแรกของนิ้วชี้ อีกสามนิ้วเหยียดตึง', 'กำมือแน่นทั้งสองข้าง', 'แบมือชูเหนือหัว', 'เอามือไขว้หลัง'], a: 'หัวแม่มือจรดข้อแรกของนิ้วชี้ อีกสามนิ้วเหยียดตึง' },
      { q: 'ท่า «ตั้งวง» ทำอย่างไร?', opts: ['ยกแขนโค้งเป็นวง นิ้วทั้งสี่เรียงชิด', 'ชี้นิ้วไปข้างหน้า', 'ตบมือเป็นจังหวะ', 'กางแขนตรงแข็ง ๆ'], a: 'ยกแขนโค้งเป็นวง นิ้วทั้งสี่เรียงชิด' },
      { q: '«ประเท้า» คือการเคลื่อนไหวแบบใด?', opts: ['ใช้จมูกเท้าแตะพื้นเบา ๆ แล้วยกขึ้น', 'กระโดดสองเท้า', 'วิ่งรอบเวที', 'นั่งคุกเข่า'], a: 'ใช้จมูกเท้าแตะพื้นเบา ๆ แล้วยกขึ้น' },
      { q: '«กระดกเท้า» คือท่าแบบใด?', opts: ['พับขาไปด้านหลัง ปลายเท้ากระดกขึ้น', 'เตะขาไปข้างหน้าสูง ๆ', 'ยืนเขย่งปลายเท้า', 'นั่งเหยียดขาตรง'], a: 'พับขาไปด้านหลัง ปลายเท้ากระดกขึ้น' },
      { q: '«ภาษาท่า» ใช้เพื่ออะไร?', opts: ['สื่อความหมายแทนคำพูด', 'ออกกำลังกายให้แข็งแรง', 'แข่งขันความเร็ว', 'ฝึกท่องจำเนื้อเพลง'], a: 'สื่อความหมายแทนคำพูด' },
      { q: 'ภาษาท่า «รัก» แสดงอย่างไร?', opts: ['ฝ่ามือทั้งสองทาบที่อก', 'ชี้นิ้วไปที่เพื่อน', 'โบกมือไปมา', 'เอามือปิดตา'], a: 'ฝ่ามือทั้งสองทาบที่อก' },
      { q: 'ภาษาท่า «ปฏิเสธ (ไม่)» แสดงอย่างไร?', opts: ['ตั้งฝ่ามือแล้วสั่นมือ', 'พยักหน้าช้า ๆ', 'ปรบมือรัว ๆ', 'กอดอกนิ่ง ๆ'], a: 'ตั้งฝ่ามือแล้วสั่นมือ' },
      { q: 'เพลงจังหวะช้า ควรเคลื่อนไหวอย่างไร?', opts: ['นุ่มนวล ต่อเนื่อง', 'กระโดดเร็ว ๆ', 'สะบัดแขนแรง ๆ', 'หยุดนิ่งไม่ขยับ'], a: 'นุ่มนวล ต่อเนื่อง' },
      { q: 'การแสดงเป็นหมู่ (หลายคน) สิ่งสำคัญที่สุดคือข้อใด?', opts: ['ความพร้อมเพรียงตรงจังหวะเดียวกัน', 'แต่ละคนทำท่าตามใจตนเอง', 'แข่งกันเด่นคนเดียว', 'หันหลังให้ผู้ชม'], a: 'ความพร้อมเพรียงตรงจังหวะเดียวกัน' },
    ];

    let queue = [];
    let qNo = 0;
    function nextPractice() {
      if (!queue.length) { queue = QS.slice().sort(() => Math.random() - 0.5); }
      const item = queue.shift();
      qNo += 1;
      document.getElementById('pcount').textContent = 'ข้อที่ ' + qNo + ' (คลัง ' + QS.length + ' ข้อ)';
      document.getElementById('pq').textContent = item.q;
      document.getElementById('pfb').textContent = '';
      const opts = item.opts.slice().sort(() => Math.random() - 0.5);
      document.getElementById('popts').innerHTML = opts.map((o) =>
        '<button type="button" class="opt" data-a="' + o + '">' + o + '</button>'
      ).join('');
      document.querySelectorAll('#popts .opt').forEach((btn) => {
        btn.onclick = () => {
          const ok = btn.dataset.a === item.a;
          btn.classList.add(ok ? 'ok' : 'no');
          document.querySelectorAll('#popts .opt').forEach((b) => {
            b.disabled = true;
            if (b.dataset.a === item.a) b.classList.add('ok');
          });
          document.getElementById('pfb').textContent = ok ? '✓ ถูกต้อง!' : '✗ คำตอบ: ' + item.a;
          document.getElementById('pfb').style.color = ok ? 'var(--ok)' : 'var(--bad)';
          if (window.KAMPAI && window.KAMPAI.sound) (ok ? KAMPAI.sound.correct : KAMPAI.sound.wrong)();
        };
      });
    }

    document.getElementById('modeSeg').onclick = (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b) return;
      const mode = b.dataset.mode;
      document.querySelectorAll('#modeSeg button').forEach((x) => x.classList.toggle('on', x === b));
      document.getElementById('learn').classList.toggle('on', mode === 'learn');
      document.getElementById('practice').classList.toggle('on', mode === 'practice');
      document.getElementById('hintText').textContent =
        mode === 'learn' ? 'นาฏยศัพท์ · ภาษาท่า · การเคลื่อนไหวประกอบเพลง' : 'เลือกคำตอบ 4 ตัวเลือก';
      if (mode === 'practice') nextPractice();
    };
    document.getElementById('btnNext').onclick = nextPractice;
  </script>
</body>
</html>
