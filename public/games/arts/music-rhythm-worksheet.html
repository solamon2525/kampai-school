<style>

.draw-box .draw-hint{position:absolute;top:.5mm;left:1mm;font-size:6pt;font-weight:700;color:var(--ws-muted)}
.draw-box svg{max-width:100%;height:auto}
.draw-check{display:flex;flex-wrap:wrap;gap:1.5mm;margin:.6mm 0;font-size:6.5pt;font-weight:700;color:var(--ws-muted)}
.step-block{display:flex;flex-direction:column;gap:1.2mm;margin-top:1mm}
.step-row{display:grid;grid-template-columns:20mm 1fr;gap:1.5mm;align-items:end;min-height:7mm}
.step-tag{font-size:6.5pt;font-weight:800;color:var(--ws-paper);background:var(--ws-accent);border-radius:3px;padding:.8mm;text-align:center}
.step-body{min-height:6mm;border-bottom:1px dotted var(--ws-muted);display:flex;align-items:flex-end;font-weight:700;font-size:8pt}
.work-fill{color:transparent;font-weight:800}.show-answers .work-fill{color:var(--ws-danger)}
.count-5 .step-row{min-height:8.5mm}
.count-5 .draw-box{min-height:24mm}

      +'<div class="step-row"><span class="step-tag">1 สังเกต</span><div class="step-body"><span class="work-fill">'+e(item.steps[0])+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">2 นับ/คิด</span><div class="step-body"><span class="work-fill">'+e(item.steps[1])+'</span></div></div>'
      +'<div class="step-row"><span class="step-tag">3 สรุป</span><div class="step-body"><span class="work-fill">'+e(item.steps[2])+'</span></div></div>'
      +'</div><div class="q-foot"><div class="answer-line">ตอบ <span class="answer-fill">'+e(item.answer)+'</span></div></div>';
    return html;
  }
};
