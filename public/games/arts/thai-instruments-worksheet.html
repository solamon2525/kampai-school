<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="worksheet-source-media" content="/games/arts/thai-instruments-media.html"><meta name="curriculum-indicators" content="ศ 2.1 ป.1/1,ศ 2.1 ป.3/1"><title>ใบงานเครื่องดนตรีไทยและเสียง</title><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="/games/worksheet-topic.css?v=2.0.0" rel="stylesheet"><link href="/games/worksheet-modes.css?v=2.0.0" rel="stylesheet"></head><body><header class="toolbar"><h1>🎶 ใบงานเครื่องดนตรีไทย</h1><div class="toolbar-ctrls"><select class="t-select" id="selStyle"><option value="standard">มาตรฐาน</option></select><select class="t-select" id="selPageCount"><option value="1">1 หน้า</option></select><select class="t-select" id="selGrade"><option value="1">ป.1–ป.4</option></select><select class="t-select" id="selTopic"><option value="mixed">รวม</option></select><select class="t-select" id="selCount"><option value="10">10 ข้อ</option></select><input class="t-input" id="inpSchool" value="โรงเรียนบ้านคำไผ่"><select class="t-select" id="selTeacher"><option value="">-- เลือกครูผู้สอน --</option></select><button class="btn primary" id="btnRandom">🎲 สุ่มใหม่</button><button class="btn" id="btnAnswers">👁 เฉลยครู</button><button class="btn green" id="btnPrint">🖨 พิมพ์ A4</button></div></header><main class="pages" id="pages"><section class="sheet"><div class="questions"><article class="q">กำลังสร้างใบงาน</article></div></section></main><script src="/games/worksheet-runtime.js?v=2.0.0"></script><script>const ITEMS=[{prompt:'กลองอยู่ในประเภทใด',answer:'ตี'},{prompt:'ซออยู่ในประเภทใด',answer:'สี'},{prompt:'ปี่อยู่ในประเภทใด',answer:'เป่า'},{prompt:'จะเข้อยู่ในประเภทใด',answer:'ดีด'},{prompt:'เครื่องดนตรีประเภทตีเกิดเสียงได้อย่างไร',answer:'กระทบ'},{prompt:'เครื่องดนตรีประเภทสีใช้อะไร',answer:'คันชัก'},{prompt:'เสียงเกิดจากอะไร',answer:'การสั่น'},{prompt:'
