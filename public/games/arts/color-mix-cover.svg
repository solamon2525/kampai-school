<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="0.55" stop-color="#4c1d95"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.30"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎨</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🖌️</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">ผสมสีให้ตรงเป้า</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">ปรับแม่สี แดง·เหลือง·น้ำเงิน ให้ได้สีตรงเป้า</text>

  <!-- แม่สี 3 วง + สีรอง -->
  <g transform="translate(640,520)">
    <circle cx="-150" cy="0" r="74" fill="#dc2626" opacity="0.92"/>
    <circle cx="0" cy="0" r="74" fill="#facc15" opacity="0.92"/>
    <circle cx="150" cy="0" r="74" fill="#2563eb" opacity="0.92"/>
    <circle cx="-75" cy="0" r="40" fill="#ea580c"/>
    <circle cx="75" cy="0" r="40" fill="#16a34a"/>
    <circle cx="0" cy="46" r="34" fill="#7c3aed"/>
  </g>
  <g transform="translate(640,648)">
    <rect x="-220" y="-24" width="440" height="48" rx="24" fill="#f59e0b" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fcd34d" text-anchor="middle" dominant-baseline="middle">เหลือง+น้ำเงิน=เขียว · แดง+เหลือง=ส้ม · แข่งสด</text>
  </g>
</svg>
