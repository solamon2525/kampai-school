<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.25"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎨</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🖌️</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">วงล้อสี</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">เรียนรู้ทฤษฎีสี สีวรรณะร้อน/เย็น และตอบคำถาม</text>

  <!-- Interactive Color Wheel visual -->
  <g transform="translate(640,515)">
    <!-- 12 color dots arranged in a circle -->
    <circle cx="0" cy="-100" r="24" fill="#ef4444" stroke="#fff" stroke-width="3"/>
    <circle cx="50" cy="-86.6" r="24" fill="#f97316" stroke="#fff" stroke-width="2"/>
    <circle cx="86.6" cy="-50" r="24" fill="#ea580c" stroke="#fff" stroke-width="2"/>
    <circle cx="100" cy="0" r="24" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
    <circle cx="86.6" cy="50" r="24" fill="#eab308" stroke="#fff" stroke-width="2"/>
    <circle cx="50" cy="86.6" r="24" fill="#84cc16" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="100" r="24" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <circle cx="-50" cy="86.6" r="24" fill="#06b6d4" stroke="#fff" stroke-width="2"/>
    <circle cx="-86.6" cy="50" r="24" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
    <circle cx="-100" cy="0" r="24" fill="#6366f1" stroke="#fff" stroke-width="2"/>
    <circle cx="-86.6" cy="-50" r="24" fill="#a855f7" stroke="#fff" stroke-width="2"/>
    <circle cx="-50" cy="-86.6" r="24" fill="#ec4899" stroke="#fff" stroke-width="2"/>
    <!-- Center selector indicator line (red to green complement) -->
    <line x1="0" y1="-76" x2="0" y2="76" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="20" fill="#1f2937" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g transform="translate(640,652)">
    <rect x="-220" y="-24" width="440" height="48" rx="24" fill="#6366f1" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#c7d2fe" text-anchor="middle" dominant-baseline="middle">คู่ตรงข้าม แดง-เขียว · เหลือง-ม่วง · น้ำเงิน-ส้ม</text>
  </g>
</svg>
