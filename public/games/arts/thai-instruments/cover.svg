<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Kanit','Sarabun','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e152a"/><stop offset="0.55" stop-color="#0c0714"/><stop offset="1" stop-color="#2d170b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="640" ry="360" fill="url(#glow)"/>
  <text x="170" y="600" font-size="230" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎭</text>
  <text x="1110" y="170" font-size="190" opacity="0.08" text-anchor="middle" dominant-baseline="middle">🎵</text>

  <g transform="translate(640,116)">
    <rect x="-180" y="-26" width="360" height="52" rx="26" fill="#ffffff" opacity="0.12"/>
    <text x="0" y="2" font-size="26" font-weight="600" fill="#ede9fe" text-anchor="middle" dominant-baseline="middle">⚡ KAMPAI · ศิลปะ ป.4–6</text>
  </g>
  <text x="640" y="284" font-size="120" font-weight="800" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#sh)" letter-spacing="2">เครื่องดนตรีไทย</text>
  <text x="640" y="372" font-size="36" font-weight="700" fill="#ddd6fe" text-anchor="middle" dominant-baseline="middle">เรียนรู้ ดีด·สี·ตี·เป่า ฟังเสียงจำลองและทายเสียงเครื่องดนตรี</text>

  <!-- Traditional Instrument visual (Ranat representation / notes) -->
  <g transform="translate(640,515)">
    <!-- Ranat wooden bars representation -->
    <path d="M -200,40 Q 0,-20 200,40 L 190,70 Q 0,10 -190,70 Z" fill="url(#gold)" opacity="0.9" filter="url(#sh)"/>
    <!-- Keys lines on ranat -->
    <line x1="-150" y1="42" x2="-145" y2="67" stroke="#1e152a" stroke-width="2"/>
    <line x1="-100" y1="31" x2="-98" y2="60" stroke="#1e152a" stroke-width="2"/>
    <line x1="-50" y1="21" x2="-49" y2="52" stroke="#1e152a" stroke-width="2"/>
    <line x1="0" y1="18" x2="0" y2="50" stroke="#1e152a" stroke-width="2"/>
    <line x1="50" y1="21" x2="49" y2="52" stroke="#1e152a" stroke-width="2"/>
    <line x1="100" y1="31" x2="98" y2="60" stroke="#1e152a" stroke-width="2"/>
    <line x1="150" y1="42" x2="145" y2="67" stroke="#1e152a" stroke-width="2"/>

    <!-- Two mallet hammers crossing -->
    <line x1="-70" y1="90" x2="40" y2="-40" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#sh)"/>
    <circle cx="40" cy="-40" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>

    <line x1="70" y1="90" x2="-40" y2="-40" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#sh)"/>
    <circle cx="-40" cy="-40" r="16" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
  </g>
  <g transform="translate(640,652)">
    <rect x="-240" y="-24" width="480" height="48" rx="24" fill="#d97706" opacity="0.18"/>
    <text x="0" y="2" font-size="23" font-weight="700" fill="#fef3c7" text-anchor="middle" dominant-baseline="middle">ดีด: จะเข้ · สี: ซอด้วง/ซออู้ · ตี: ระนาดเอก/ขิม · เป่า: ขลุ่ย</text>
  </g>
</svg>
