<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>เกมตัวอย่าง — Template (โฟลเดอร์ 5 ไฟล์)</title>
<!--
═══════════════════════════════════════════════════════════════════════════
  KAMPAI-SCHOOL · GAME TEMPLATE (โฟลเดอร์ 5 ไฟล์)
  index.html (โครง) · style.css (หน้าตา) · config.js (พารามิเตอร์) ·
  data.js (เนื้อหา) · game.js (ลอจิก)  — แก้แต่ละส่วนแยกกันได้ ไม่ต้องรื้อไฟล์ใหญ่

  วิธีใช้:
  1. cp -r public/games/_template-folder  public/games/{subject}/{slug}
  2. แก้ config.js → SLUG = '{slug}' จริง (+ พารามิเตอร์อื่น)
  3. เขียนเกมใน game.js (ส่วน GAME LOGIC) · เนื้อหาใน data.js · สไตล์ใน style.css
  4. ออนไลน์? ตั้ง ENABLE_ONLINE: true ใน config.js (ใช้ kampai-match)
  5. migration: NNN_seed_{slug}_game.sql  (external_url = '/games/{subject}/{slug}/index.html')
  6. pnpm verify:game public/games/{subject}/{slug}/index.html   (ต้องผ่าน 8/8)
═══════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HUD -->
<div id="score-container">⭐ <span id="score-value">0</span></div>
<div id="timer-container">⏱️ <span id="timer-value">60</span></div>
<div id="life-container">❤️❤️❤️</div>
<div id="level-badge">เลเวล 1</div>
<div id="combo-badge"></div>
<div id="player-chip"></div>
<div id="toast"></div>

<canvas id="game-canvas"></canvas>

<!-- Start screen -->
<div id="blocker">
    <h1>🧺 เกมตัวอย่าง</h1>
    <p>รับ ⭐ ให้ได้คะแนน · เลี่ยง 💣 · คว้า 💎 โบนัส<br>ลาก/ปุ่มลูกศร/← → เลื่อนตะกร้า · รับติดกันได้คอมโบ 🔥</p>
    <div id="my-stats">
        <div class="ms-cell"><div class="ms-val" id="ms-best">0</div><div class="ms-label">คะแนนสูงสุด</div></div>
        <div class="ms-cell"><div class="ms-val" id="ms-plays">0</div><div class="ms-label">เล่นไปแล้ว (ครั้ง)</div></div>
    </div>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list" class="leaderboard-list"><li class="lb-loading">กำลังโหลด...</li></ul>
    </div>
    <div class="mode-row">
        <button class="btn btn-primary" onclick="startGame('adventure')">🗺️ ผจญภัย (3 ชีวิต)</button>
        <button class="btn btn-blue" onclick="startGame('time')">⏱️ แข่งเวลา 60 วิ</button>
        <button class="btn btn-ghost" id="online-btn" onclick="openOnline()" style="display:none">🌐 ออนไลน์</button>
    </div>
</div>

<!-- Game Over screen -->
<div id="gameover-screen">
    <h1>จบเกม!</h1>
    <div id="go-stars">☆☆☆</div>
    <div id="final-score">0</div>
    <p id="go-summary"></p>
    <div id="kampai-result"></div>
    <div class="leaderboard-box">
        <h3 class="lb-title">🏆 อันดับนักเรียน</h3>
        <ul id="score-list-gameover" class="leaderboard-list"><li class="lb-loading">—</li></ul>
    </div>
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:4px;">
        <button class="btn btn-primary" onclick="location.reload()">🔄 เล่นใหม่</button>
        <button class="btn btn-blue" onclick="KAMPAI.goHome()">🎮 เลือกเกมใหม่</button>
    </div>
</div>

<!-- ═══ KAMPAI SDK + Online framework (single source — อย่าแก้) ═══ -->
<script src="/games/kampai-sdk.js"></script>
<script>
/* fallback stub: กันพังถ้าเปิด standalone แล้ว SDK โหลดไม่ได้ */
window.KAMPAI = window.KAMPAI || { isEmbed:false, isTouch:false, ready:true, student:null, stats:null, leaderboard:[], input:{up:false,down:false,left:false,right:false,a:false,b:false}, onReady:function(cb){cb(this);}, setSlug:function(){return this;}, submitScore:function(){return false;}, goHome:function(){location.href='/h/nattapong';}, exit:function(){location.href='/h/nattapong';}, controls:{mount:function(){return this;}}, sound:{correct:function(){},wrong:function(){},timeUp:function(){},gameOver:function(){},speak:function(){},stopSpeak:function(){},fxFlash:function(){},mountToggles:function(){},defaultBgm:function(){},bgmStart:function(){},bgmStop:function(){},unlock:function(){}} };
</script>
<script src="/games/kampai-match.js"></script>
<script>
/* fallback stub สำหรับโหมดออนไลน์ (ลบทั้ง 2 บรรทัด match ได้ถ้าเกมไม่ทำออนไลน์) */
window.KampaiMatch = window.KampaiMatch || { create:function(){return{available:false,openMenu:function(){alert('โหมดออนไลน์เล่นผ่านระบบเท่านั้น');},report:function(){},finish:function(){},leave:function(){}};} };
</script>

<!-- ═══ เกม (config → data → game · โหลดตามลำดับ แชร์ global scope · ไม่ใช้ import/export) ═══ -->
<script src="config.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
