<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".16"/></filter><linearGradient id="top" x2="0" y2="1"><stop stop-color="#f7f8fb"/><stop offset="1" stop-color="#d7deea"/></linearGradient></defs><rect width="1280" height="720" fill="#edf1f8"/><rect width="1280" height="34" fill="#cbd4e2"/><rect x="0" y="34" width="1280" height="44" fill="url(#top)"/><rect x="18" y="41" width="155" height="31" rx="3" fill="#f7e783" stroke="#a7a173"/><text x="42" y="63" font-size="17" fill="#26354d">Layout: Game</text><rect x="178" y="41" width="224" height="31" rx="3" fill="#f3a09f" stroke="#ad7373"/><text x="202" y="63" font-size="17" font-weight="700" fill="#3e2830">Event sheet: Event_Game</text><rect x="420" y="41" width="842" height="31" fill="#e5e9f0" stroke="#b6bfcc"/><rect x="18" y="92" width="1244" height="574" rx="5" fill="#fff" stroke="#9eacbf" filter="url(#s)"/><rect x="18" y="92" width="1244" height="55" fill="#cad9ed"/><text x="42" y="127" font-size="24" font-weight="800" fill="#1f304b">ผลลัพธ์ของขั้นที่ 9 • สร้างแท่นฝึกกระโดด</text><rect x="36" y="164" width="1208" height="42" fill="#ffe07a" stroke="#c9a83f"/><text x="54" y="192" font-size="21" font-weight="800" fill="#493c19">⊟ พื้นและการชน</text><rect x="74" y="226" width="1134" height="174" rx="5" fill="#f1f5fa" stroke="#9eafc3"/><text x="98" y="258" font-size="18" font-weight="800" fill="#334861">PROPERTIES / LAYOUT RESULT</text><text x="100" y="296" font-size="18" fill="#26354d" font-weight="550">เลือก Ground → กด Ctrl ค้างและลากเพื่อคัดลอก → ย่อเป็นแท่น → วางสูงจากพื้นประมาณ 150–220 px</text><text x="100" y="324" font-size="18" fill="#26354d" font-weight="550">→ ทำซ้ำ 3 แท่น</text><rect x="74" y="425" width="1134" height="142" rx="8" fill="#edf9f4" stroke="#7ebba9"/><text x="98" y="458" font-size="18" font-weight="800" fill="#0e6b54">✓ ผลที่ต้องตรวจใน Preview</text><text x="100" y="495" font-size="20" fill="#173f35" font-weight="700">ขึ้นแท่นได้</text><rect x="74" y="585" width="1134" height="46" rx="5" fill="#fff5e8" stroke="#e9b979"/><text x="96" y="614" font-size="16" fill="#7a4816">หากผลไม่ตรง: ตรวจชื่อ Object → Behavior → Condition → Action → Parameter ตามลำดับ</text><rect x="18" y="676" width="1244" height="30" fill="#d8e2f0"/><text x="36" y="697" font-size="15" fill="#405573">ภาพ B — Event/Properties ที่ต้องได้ และสิ่งที่ต้องตรวจเมื่อกด F4 Preview</text></svg>