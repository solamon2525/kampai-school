<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เช็กลิสต์พัฒนาเกม Red Hood Adventure</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Leelawadee UI",Tahoma,sans-serif;color:#17243b;background:linear-gradient(140deg,#e7f8ff,#fff7df);min-height:100vh}.page{max-width:1180px;margin:auto;padding:30px}.head{background:#304778;color:#fff;border-radius:22px;padding:24px 30px;box-shadow:0 8px #1c2b50}.head h1{margin:3px 0;font-size:38px}.head p{margin:0;color:#ddecff}.bar{height:16px;background:#d9e2ef;border-radius:9px;overflow:hidden;margin-top:16px}.fill{height:100%;width:0;background:#48c786;transition:.25s}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.tools input{padding:10px;border:2px solid #9eb7d2;border-radius:9px;font:inherit}.tools button{padding:10px 16px;border:0;border-radius:9px;background:#304778;color:#fff;font-weight:bold;cursor:pointer}.tools .danger{background:#b64250}.count{margin-left:auto;font-size:20px;font-weight:bold;color:#294c7b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:2px solid #abc6da;border-radius:16px;padding:15px;box-shadow:0 5px #cbdfea}.card h2{font-size:21px;color:#294c7b;margin:0 0 9px}.item{display:flex;align-items:flex-start;gap:9px;padding:6px 4px;border-radius:7px;cursor:pointer}.item:hover{background:#eef7fd}.item input{width:20px;height:20px;accent-color:#2dae72;flex:none}.item:has(input:checked) span{text-decoration:line-through;color:#768196}.test{grid-column:1/-1;border-color:#65ae87;background:#f3fff8}.test .items{display:grid;grid-template-columns:1fr 1fr}.foot{text-align:center;color:#59677b;padding:23px}.saved{color:#247653;font-weight:bold}@media(max-width:750px){.grid{grid-template-columns:1fr}.test{grid-column:auto}.test .items{grid-template-columns:1fr}.count{margin-left:0;width:100%}}</style></head><body><main class="page">
<header class="head"><b>RED HOOD ADVENTURE • PRODUCTION CHECKLIST</b><h1>เช็กลิสต์งานที่ต้องทำในเกม</h1><p>คลิกช่องเพื่อติ๊ก • บันทึกอัตโนมัติในเครื่องนี้</p><div class="bar"><div class="fill" id="fill"></div></div></header>
<section class="tools"><input id="version" placeholder="ชื่อไฟล์รุ่น เช่น master_v31"><input id="tester" placeholder="ชื่อผู้ตรวจ"><button onclick="window.print()">พิมพ์ / บันทึก PDF</button><button class="danger" id="reset">ล้างทั้งหมด</button><span class="count" id="count">0 / 54 (0%)</span><span class="saved" id="saved"></span></section>
<section class="grid" id="grid"></section><div class="foot">เสร็จ = ใส่ Event แล้วและทดลองเล่นผ่านจริง</div></main>
<script>
const groups=[
["1. ฉากเริ่มเกมและเมนู",["โลโก้ ชื่อเกม และฉากหลังพอดีจอ","ปุ่มเริ่มเกมกดได้ครั้งเดียว","ช่องชื่อผู้เล่นรับข้อความได้","ไม่ให้เข้าเกมเมื่อยังไม่ใส่ชื่อ","ปุ่ม Back / OK ทำงาน","เพลง Opening เล่นครั้งเดียว"]],
["2. ฉากคู่มือและเลือกด่าน",["อธิบายการเดิน กระโดด และ Double Jump","อธิบายโจทย์ คำตอบผิด และหัวใจ","ข้อความใหญ่ อ่านง่าย ไม่กลืนฉาก","หน้าเลือกด่านแสดงสถานะครบ 3 ด่าน","ด่านผ่านแล้วล็อกเข้าเล่นซ้ำ","เพลงเลือกด่านไม่ทับเพลงเดิม"]],
["3. ผู้เล่น พื้น และ Checkpoint",["เดินซ้าย–ขวาและหยุดลื่นไหล","กระโดดและ Double Jump ทำงาน","หันหน้าถูกทิศโดยไม่กลับหัว","Idle / Run / Jump / Fall ไม่ตีกัน","Solid / Jump-thru และ Collision ถูกต้อง","ตกฉากกลับ Checkpoint ล่าสุด"]],
["4. HUD เวลา และพลังชีวิต",["เริ่มด่านด้วยหัวใจ 5 ดวง","เวลาเริ่ม 200 / 180 / 160 วินาที","เวลาและหัวใจเห็นชัดทุกฉาก","โดนโจมตีลดครั้งละ 1","กระเด็นและอมตะ 1.5 วินาที","หัวใจหรือเวลาหมดเข้าสู่ Game Over"]],
["5. มอนสเตอร์และกระสุน",["เดินลาดตระเวน ไม่ตกเกาะ","หันหน้าตามทิศทางเดิน","ระยะเดินและความเร็วสุ่มปลอดภัย","ยิงจากปากทุก 10–20 วินาที","เล็งผู้เล่นไม่เกิน 30 องศา","กระสุนชนหรือพ้นฉากแล้วถูกลบ"]],
["6. โจทย์คณิตและคำตอบ",["ด่านละ 5 ข้อ คูณ/หารตามระดับ","คำตอบคำนวณจากโจทย์","ตัวเลือกไม่ซ้ำ ไม่มี 0 และถูกหนึ่งค่า","ตัวเลขใหญ่ ชัด และตามดาว","ตอบผิดลดหัวใจและตัวเลือกหาย","ตอบถูกเพิ่มข้อครั้งเดียว"]],
["7. ระบบผ่านด่าน",["ตอบไม่ครบ ประตูเป็นภาพปิด","ครบ 5 ข้อ ประตูเปลี่ยนภาพเปิด","ชนประตูแล้วตัวละครยังเห็น","ล็อกควบคุมระหว่างจบด่าน","เพลงจบก่อนทำจอดำ","กลับหน้าเลือกด่านและบันทึกสถานะ"]],
["8. เสียงและการจบเกม",["Stop เพลงเก่าก่อน Play เพลงใหม่","มีเสียง Jump / Hurt / Shoot / Correct / Wrong","เอฟเฟกต์ไม่ดังกลบเพลง","ด่าน 1–3 ใช้เพลงที่กำหนด","ผ่านด่านบันทึก Local Storage","ครบ 3 ด่านจึงแสดงฉากจบ"]],
["9. ตรวจ Build ก่อนส่งงาน",["เปิดโปรเจกต์ได้ ไม่มี XML / object error","เล่นตั้งแต่หน้าแรกจนจบครบ 3 ด่าน","ทดสอบตอบถูก ผิด ตกฉาก และ Game Over","ไม่มีวัตถุเกิดทับ player / door / monster","ไม่มีเพลงซ้อน กระสุนค้าง หรือ Event รัว","สำรองไฟล์รุ่นใหม่ก่อนแก้ทุกครั้ง"]]];
const key="redhood-checklist-v1",grid=document.querySelector("#grid");let state=JSON.parse(localStorage.getItem(key)||"{}");
let n=0;groups.forEach((g,gi)=>{const c=document.createElement("article");c.className="card"+(gi===8?" test":"");c.innerHTML="<h2>"+g[0]+"</h2><div class=items></div>";g[1].forEach(t=>{const id="task-"+n++;const l=document.createElement("label");l.className="item";l.innerHTML='<input type="checkbox" id="'+id+'"><span>'+t+"</span>";const x=l.querySelector("input");x.checked=!!state[id];x.onchange=()=>{state[id]=x.checked;save()};c.querySelector(".items").append(l)});grid.append(c)});
function save(){state.version=version.value;state.tester=tester.value;localStorage.setItem(key,JSON.stringify(state));update();saved.textContent="บันทึกแล้ว";setTimeout(()=>saved.textContent="",900)}
function update(){const all=[...document.querySelectorAll('input[type=checkbox]')],done=all.filter(x=>x.checked).length,p=Math.round(done/all.length*100);count.textContent=done+" / "+all.length+" ("+p+"%)";fill.style.width=p+"%"}
version.value=state.version||"";tester.value=state.tester||"";version.oninput=save;tester.oninput=save;reset.onclick=()=>{if(confirm("ล้างเครื่องหมายถูกและข้อมูลทั้งหมดหรือไม่?")){localStorage.removeItem(key);location.reload()}};update();
</script></body></html>
