<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประกอบขา 3D — หุ่นยนต์เลี้ยงแกะ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Sarabun', sans-serif; color: #1a2b4a; }
#app { display: grid; grid-template-rows: 1fr auto; height: 100%; }
#canvas-wrap { position: relative; background: linear-gradient(180deg, #87ceeb 0%, #c8e8f5 55%, #8ecf7a 55%, #5a9e4b 100%); }
canvas { display: block; width: 100%; height: 100%; }
.badge {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  background: rgba(15,28,51,0.82); color: #fff;
  padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.9rem;
  pointer-events: none;
}
.hint-3d {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  background: rgba(255,255,255,0.88); padding: 6px 12px; border-radius: 8px;
  font-size: 0.8rem; color: #5a6a7a; pointer-events: none;
}
.panel {
  background: #fffef8; border-top: 1px solid #d8e0e8;
  padding: 12px 14px 16px; display: grid; gap: 10px;
  max-height: 42vh; overflow-y: auto;
}
.panel h2 { font-size: 1.15rem; font-weight: 800; }
.panel .step-num { font-size: 0.82rem; font-weight: 700; color: #d4a017; }
.panel p { color: #5a6a7a; font-size: 0.92rem; line-height: 1.45; }
.progress { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dot {
  width: 11px; height: 11px; border-radius: 50%; background: #d8e0e8; border: none; cursor: pointer;
}
.dot.done { background: #8ecf7a; }
.dot.active { background: #d4a017; box-shadow: 0 0 0 3px rgba(212,160,23,0.28); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  appearance: none; border: none; font-family: inherit; font-weight: 700;
  font-size: 0.95rem; padding: 10px 16px; border-radius: 999px; cursor: pointer;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-nav { background: #1a2b4a; color: #fff; min-width: 110px; }
.btn-play { background: linear-gradient(135deg, #d4a017, #e0b12a); color: #0f1c33; min-width: 150px; }
.btn-play.on { background: linear-gradient(135deg, #e67700, #f08c00); color: #fff; }
.btn-ghost { background: #eef3f8; color: #1a2b4a; }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <div class="badge" id="stepBadge">ขั้น 1 / 9</div>
    <div class="hint-3d">ลากหมุน · ล้อซูม</div>
  </div>
  <div class="panel">
    <div class="progress" id="progress"></div>
    <div class="step-num" id="stepNum">ขั้นที่ 1</div>
    <h2 id="stepTitle">แผ่นยึดเพลา L4</h2>
    <p id="stepDesc">ยึดแผ่น L4 ซ้าย–ขวาบนฐานหุ่น</p>
    <div class="btn-row">
      <button class="btn btn-nav" id="btnPrev" type="button">← ย้อน</button>
      <button class="btn btn-play" id="btnPlay" type="button">▶ เล่นแอนิเมชัน</button>
      <button class="btn btn-nav" id="btnNext" type="button">ถัดไป →</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btnReset" type="button">รีเซ็ต</button>
      <a class="btn btn-ghost" href="legs-only.html" style="text-decoration:none">📐 แบบเพลนขา</a>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const STEPS = [
  { title: 'แผ่นยึดเพลา L4', desc: 'ยึดแผ่น L4 ซ้าย–ขวาบนฐานหุ่น เป็นจุดพยุงเพลาขา 3 ขาต่อข้าง' },
  { title: 'มอเตอร์เกียร์ M-L / M-R', desc: 'ติดมอเตอร์เกียร์ 2 ตัว ขับเพลาซ้ายและขวา' },
  { title: 'เพลาหลัก Ø6', desc: 'สอบเพลาสแตนเลสผ่านรู L4 ทั้ง 2 ข้าง' },
  { title: 'ฮับ P-L1 ×6', desc: 'ใส่ฮับพิมพ์ 3D ล็อกเพลา — ขากลางเฟสนำ 60°' },
  { title: 'คันโยก L1 ×6', desc: 'ยึดแผ่นคันโยก R20 มม. บนฮับแต่ละขา' },
  { title: 'ลิงก์ L2 ×6', desc: 'เชื่อมลิงก์ 55 มม. จากคันโยกไปเท้า' },
  { title: 'เท้า L3 ×6', desc: 'ติดเท้าปลายลิงก์ — ขากลาง ML/MR ใส่ยางซิลิโคน' },
  { title: 'ฐานหุ่น A1', desc: 'วางตัวเครื่องบนฐานอะคริลิก 3 มม.' },
  { title: 'พร้อมเดิน!', desc: 'ประกอบครบ — หุ่นเดิน 6 ขา ขับด้วยมอเตอร์ 2 ตัว' },
];

const PART_GROUPS = ['l4', 'motors', 'axle', 'hubs', 'cranks', 'links', 'feet', 'chassis', 'walk'];

// ── scene setup ──────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc8e8f5, 18, 45);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.set(5.5, 4.2, 6.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);
controls.maxPolarAngle = Math.PI / 2.05;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff8e8, 1.1);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88bbff, 0.35);
fill.position.set(-4, 3, -3);
scene.add(fill);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ color: 0x5a9e4b, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(24, 24, 0x4a8a3f, 0x6aad55);
grid.position.y = 0.01;
scene.add(grid);

// materials
const mat = {
  acrylic: new THREE.MeshStandardMaterial({ color: 0xd0dae8, metalness: 0.1, roughness: 0.35 }),
  acrylicDark: new THREE.MeshStandardMaterial({ color: 0x8a9bb0, metalness: 0.15, roughness: 0.4 }),
  motor: new THREE.MeshStandardMaterial({ color: 0x2b6cb0, metalness: 0.3, roughness: 0.5 }),
  motorCap: new THREE.MeshStandardMaterial({ color: 0x1a4f8a, metalness: 0.4, roughness: 0.45 }),
  hub: new THREE.MeshStandardMaterial({ color: 0xf6d860, metalness: 0.2, roughness: 0.55 }),
  crank: new THREE.MeshStandardMaterial({ color: 0xe8eef5, metalness: 0.15, roughness: 0.4 }),
  crankEdge: new THREE.MeshStandardMaterial({ color: 0xc00, metalness: 0.1, roughness: 0.5 }),
  link: new THREE.MeshStandardMaterial({ color: 0xb8c8d8, metalness: 0.1, roughness: 0.45 }),
  foot: new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.2, roughness: 0.6 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x38a169, metalness: 0.05, roughness: 0.85 }),
  shaft: new THREE.MeshStandardMaterial({ color: 0x9aa5b5, metalness: 0.7, roughness: 0.3 }),
  chassis: new THREE.MeshStandardMaterial({ color: 0x1a2b4a, metalness: 0.25, roughness: 0.5 }),
  glow: new THREE.MeshStandardMaterial({ color: 0xd4a017, emissive: 0xd4a017, emissiveIntensity: 0.6 }),
};

const root = new THREE.Group();
scene.add(root);

function box(w, h, d, material, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || root).add(m);
  return m;
}

function cyl(r, h, material, x, y, z, parent, seg = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  (parent || root).add(m);
  return m;
}

// leg positions: [x, z, name, isMiddle]
const LEGS = [
  [-0.55, -0.35, 'FL', false],
  [-0.55, 0, 'ML', true],
  [-0.55, 0.35, 'RL', false],
  [0.55, -0.35, 'FR', false],
  [0.55, 0, 'MR', true],
  [0.55, 0.35, 'RR', false],
];

const CRANK_R = 0.02; // 20mm
const groups = {};

// ── build parts ──────────────────────────────────────────────
function buildAll() {
  // L4 brackets
  groups.l4 = new THREE.Group();
  [-0.55, 0.55].forEach((x) => {
    const g = new THREE.Group();
    box(0.22, 0.055, 0.55, mat.acrylic, 0, 0.12, 0, g);
    for (let i = -1; i <= 1; i++) {
      cyl(0.006, 0.07, mat.shaft, 0, 0.16, i * 0.2, g);
    }
    g.position.x = x;
    groups.l4.add(g);
  });
  groups.l4.userData.spawn = new THREE.Vector3(0, 2.5, 0);
  root.add(groups.l4);

  // Motors
  groups.motors = new THREE.Group();
  [-0.55, 0.55].forEach((x) => {
    const g = new THREE.Group();
    box(0.07, 0.055, 0.05, mat.motor, 0, 0.1, 0, g);
    cyl(0.025, 0.04, mat.motorCap, 0, 0.1, 0.06, g);
    g.position.set(x, 0, 0);
    groups.motors.add(g);
  });
  groups.motors.userData.spawn = new THREE.Vector3(0, 2.2, 2);
  root.add(groups.motors);

  // Axle shafts
  groups.axle = new THREE.Group();
  [-0.55, 0.55].forEach((x) => {
    cyl(0.004, 0.62, mat.shaft, x, 0.16, 0, groups.axle, 8);
  });
  groups.axle.userData.spawn = new THREE.Vector3(3, 1.5, 0);
  root.add(groups.axle);

  // Hubs P-L1
  groups.hubs = new THREE.Group();
  LEGS.forEach(([lx, lz, name, isMid], i) => {
    const g = new THREE.Group();
    cyl(0.012, 0.014, mat.hub, 0, 0, 0, g, 12);
    box(0.02, 0.01, 0.02, mat.glow, 0, 0.01, 0, g);
    g.position.set(lx, 0.17, lz);
    // phase: middle legs +60°
    if (isMid) g.rotation.y = Math.PI / 3;
    groups.hubs.add(g);
  });
  groups.hubs.userData.spawn = new THREE.Vector3(-2.5, 2, 1.5);
  root.add(groups.hubs);

  // Cranks L1
  groups.cranks = new THREE.Group();
  LEGS.forEach(([lx, lz, , isMid], i) => {
    const g = new THREE.Group();
    const plate = box(0.038, 0.003, 0.048, mat.crank, 0, 0, 0, g);
    const pin = cyl(0.003, 0.02, mat.crankEdge, CRANK_R, 0.01, 0, g, 8);
    g.position.set(lx, 0.17, lz);
    if (isMid) g.rotation.y = Math.PI / 3;
    groups.cranks.add(g);
  });
  groups.cranks.userData.spawn = new THREE.Vector3(2.5, 2.2, -1.5);
  root.add(groups.cranks);

  // Links L2
  groups.links = new THREE.Group();
  LEGS.forEach(([lx, lz, , isMid]) => {
    const g = new THREE.Group();
    const rod = box(0.012, 0.055, 0.012, mat.link, CRANK_R, -0.025, 0, g);
    g.position.set(lx, 0.17, lz);
    if (isMid) g.rotation.y = Math.PI / 3;
    groups.links.add(g);
  });
  groups.links.userData.spawn = new THREE.Vector3(-2, 2.8, -2);
  root.add(groups.links);

  // Feet L3
  groups.feet = new THREE.Group();
  LEGS.forEach(([lx, lz, , isMid]) => {
    const g = new THREE.Group();
    box(0.028, 0.006, 0.018, mat.foot, CRANK_R, -0.06, 0, g);
    if (isMid) {
      box(0.028, 0.004, 0.018, mat.rubber, CRANK_R, -0.065, 0, g);
    }
    g.position.set(lx, 0.17, lz);
    if (isMid) g.rotation.y = Math.PI / 3;
    groups.feet.add(g);
  });
  groups.feet.userData.spawn = new THREE.Vector3(2, 2.5, 2);
  root.add(groups.feet);

  // Chassis A1
  groups.chassis = new THREE.Group();
  box(1.8, 0.04, 2.6, mat.chassis, 0, 0.35, 0, groups.chassis);
  box(1.6, 0.08, 0.06, mat.acrylicDark, 0, 0.42, 0.9, groups.chassis);
  groups.chassis.userData.spawn = new THREE.Vector3(0, 3.5, 0);
  root.add(groups.chassis);

  groups.walk = new THREE.Group(); // marker for walk phase
  root.add(groups.walk);
}

buildAll();

// ── animation state ──────────────────────────────────────────
let step = 0;
let animT = 0;
let playing = false;
let playTimer = null;
let walkPhase = 0;
const partAnims = new Map(); // group -> { from, to, t }

function getSpawnOffset(grp) {
  const s = grp.userData.spawn || new THREE.Vector3(0, 2, 0);
  return s.clone();
}

function hideFrom(s) {
  for (let i = 0; i < s; i++) {
    const key = PART_GROUPS[i];
    const g = groups[key];
    if (!g || key === 'walk') continue;
    g.visible = true;
    g.position.set(0, 0, 0);
    g.scale.set(1, 1, 1);
    g.traverse((c) => { if (c.material && c.material.emissive) c.material.emissiveIntensity = 0; });
  }
  for (let i = s; i < PART_GROUPS.length - 1; i++) {
    const g = groups[PART_GROUPS[i]];
    if (g) {
      g.visible = false;
      const off = getSpawnOffset(g);
      g.position.copy(off);
      g.scale.set(0.3, 0.3, 0.3);
    }
  }
}

function animatePartIn(key, onDone) {
  const g = groups[key];
  if (!g) { onDone?.(); return; }
  g.visible = true;
  const from = getSpawnOffset(g);
  const start = performance.now();
  const dur = 850;
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    g.position.lerpVectors(from, new THREE.Vector3(0, 0, 0), e);
    const sc = 0.3 + 0.7 * e;
    g.scale.set(sc, sc, sc);
    if (t < 1) requestAnimationFrame(tick);
    else {
      g.position.set(0, 0, 0);
      g.scale.set(1, 1, 1);
      flashGroup(g);
      onDone?.();
    }
  }
  requestAnimationFrame(tick);
}

function flashGroup(g) {
  g.traverse((c) => {
    if (c.material && c.material.emissive) {
      c.material.emissiveIntensity = 0.8;
      setTimeout(() => { c.material.emissiveIntensity = 0; }, 400);
    }
  });
}

function updateWalk(dt) {
  if (step < PART_GROUPS.length - 1) return;
  walkPhase += dt * 4;
  const legs = [groups.cranks, groups.links, groups.feet];
  legs.forEach((grp) => {
    grp.children.forEach((leg, i) => {
      const isLeft = i < 3;
      const isMid = i === 1 || i === 4;
      const phase = isMid ? walkPhase + 1.05 : walkPhase + (isLeft ? 0 : Math.PI);
      const swing = Math.sin(phase) * 0.025;
      leg.rotation.x = swing;
      if (grp === groups.feet) leg.position.y = 0.17 + Math.max(0, Math.sin(phase)) * 0.015;
    });
  });
  groups.motors.children.forEach((m) => { m.rotation.z = walkPhase * 0.5; });
}

// ── UI ───────────────────────────────────────────────────────
const els = {
  badge: document.getElementById('stepBadge'),
  num: document.getElementById('stepNum'),
  title: document.getElementById('stepTitle'),
  desc: document.getElementById('stepDesc'),
  progress: document.getElementById('progress'),
  prev: document.getElementById('btnPrev'),
  next: document.getElementById('btnNext'),
  play: document.getElementById('btnPlay'),
  reset: document.getElementById('btnReset'),
};

function buildDots() {
  STEPS.forEach((_, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.title = `ขั้น ${i + 1}`;
    b.addEventListener('click', () => { stopPlay(); goTo(i, true); });
    els.progress.appendChild(b);
  });
}

function updateUI() {
  const s = STEPS[step];
  els.badge.textContent = `ขั้น ${step + 1} / ${STEPS.length}`;
  els.num.textContent = `ขั้นที่ ${step + 1}`;
  els.title.textContent = s.title;
  els.desc.textContent = s.desc;
  els.prev.disabled = step === 0 || playing;
  els.next.disabled = step === STEPS.length - 1 || playing;
  [...els.progress.children].forEach((d, i) => {
    d.classList.toggle('active', i === step);
    d.classList.toggle('done', i < step);
  });
}

function showStep(n, animate) {
  step = Math.max(0, Math.min(STEPS.length - 1, n));
  hideFrom(step + 1);
  if (animate && step < PART_GROUPS.length - 1) {
    animatePartIn(PART_GROUPS[step]);
  }
  updateUI();
}

function goTo(n, animate = false) {
  if (n > step && animate) {
    showStep(n, true);
  } else {
    step = n;
    hideFrom(step + 1);
    PART_GROUPS.slice(0, step + 1).forEach((k) => {
      const g = groups[k];
      if (g && k !== 'walk') {
        g.visible = true;
        g.position.set(0, 0, 0);
        g.scale.set(1, 1, 1);
      }
    });
    updateUI();
  }
}

function stopPlay() {
  playing = false;
  clearTimeout(playTimer);
  els.play.classList.remove('on');
  els.play.textContent = '▶ เล่นแอนิเมชัน';
  updateUI();
}

function startPlay() {
  if (playing) { stopPlay(); return; }
  if (step === STEPS.length - 1) {
    goTo(0, false);
  }
  playing = true;
  els.play.classList.add('on');
  els.play.textContent = '❚❚ หยุด';
  els.prev.disabled = true;
  els.next.disabled = true;

  const run = () => {
    if (!playing) return;
    if (step >= STEPS.length - 1) { stopPlay(); return; }
    showStep(step, true);
    playTimer = setTimeout(() => {
      if (!playing) return;
      step++;
      if (step < STEPS.length) run();
      else stopPlay();
    }, 1100);
  };
  if (step < STEPS.length - 1 && groups[PART_GROUPS[step]]?.visible && groups[PART_GROUPS[step]].scale.x >= 0.99) {
    step++;
  }
  run();
}

els.prev.addEventListener('click', () => { stopPlay(); goTo(step - 1); });
els.next.addEventListener('click', () => { stopPlay(); goTo(step + 1, true); });
els.play.addEventListener('click', startPlay);
els.reset.addEventListener('click', () => { stopPlay(); goTo(0); animatePartIn(PART_GROUPS[0]); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { stopPlay(); goTo(step + 1, true); }
  if (e.key === 'ArrowLeft') { stopPlay(); goTo(step - 1); }
  if (e.key === ' ') { e.preventDefault(); startPlay(); }
});

// ── render loop ──────────────────────────────────────────────
let lastT = performance.now();
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = (now - lastT) / 1000;
  lastT = now;
  updateWalk(dt);
  controls.update();
  renderer.render(scene, camera);
}

buildDots();
goTo(0);
animatePartIn(PART_GROUPS[0]);
requestAnimationFrame(loop);
</script>
</body>
</html>
