/* ===== HUB ===== */
#hub-view{display:none;flex-direction:column;width:100vw;height:100vh;padding:3vh 4vw 2.5vh}
#hub-view.show{display:flex}
#hub-title{text-align:center;font-size:5vh;font-weight:700;color:#FFE082;letter-spacing:0.03em}
#hub-sub{text-align:center;font-size:2vh;color:rgba(255,224,130,0.55);margin:0.5vh 0 2.5vh}
#hub-grid{
  flex:1;display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:2.2vh 2.2vw;
}
.hub-card{
  display:flex;align-items:center;gap:2vw;
  border-radius:18px;cursor:pointer;padding:2vh 2.5vw;
  border:2px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.07);
  transition:background 0.14s,transform 0.12s,border-color 0.14s;
}
.hub-card:hover{background:rgba(255,255,255,0.18);border-color:rgba(255,215,0,0.55);transform:scale(1.03)}

.hub-card .hc-title{font-size:3.4vh;font-weight:700;color:#FFE082;line-height:1.1}
.hub-card .hc-sub{font-size:2vh;color:rgba(255,255,255,0.7);line-height:1.15}
.hub-card .hc-meta{display:flex;gap:0.6vw;margin-top:0.4vh;flex-wrap:wrap}
.hc-tag{font-size:1.5vh;padding:0.2vh 0.8vw;border-radius:20px;font-weight:700}
.hc-tag.subj{background:rgba(255,215,0,0.18);color:#FFE082}
.hc-tag.mech{background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.75)}
.hc-tag.code{background:rgba(0,0,0,0.2);color:rgba(255,255,255,0.55)}

/* ===== GAME SHELL ===== */
#game-view{display:none;flex-direction:column;width:100vw;height:100vh}
#game-view.show{display:flex}

#g-right{margin-left:auto;display:flex;align-items:center;gap:1.2vw}
#g-score{font-size:2.4vh;font-weight:700;color:#fff}
#g-score b{color:#FFD700}
#g-restart{

#g-restart:hover{background:rgba(255,255,255,0.18)}
#stage{flex:1;position:relative;overflow:hidden;padding:2vh 3vw}

// =====================================================================
// SOUND (WebAudio, no assets)
// =====================================================================
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){}} return actx; }
function tone(freq, start, dur, type='sine', vol=0.18){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sCorrect(){ tone(660,0,0.12,'sine'); tone(880,0.1,0.16,'sine'); }
function sWrong(){ tone(180,0,0.25,'square',0.14); }
function sWin(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.22,'triangle',0.16)); }

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function chunkEven(arr, maxPer){
  const n=Math.max(1,Math.ceil(arr.length/maxPer));
  const size=Math.ceil(arr.length/n);
  const out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}
let toastTimer=null;
function toast(ok, text){

  toastEl.className = (ok?'ok':'bad')+' show';
  toastEl.textContent = (ok?'✓ ':'✗ ')+text;

}

        `<div class="hc-sub">${d.sub}</div>`+
        `<div class="hc-meta">`+
          `<span class="hc-tag subj">${d.subject}</span>`+
          `<span class="hc-tag mech">${MECH_LABEL[d.mech]}</span>`+
          `<span class="hc-tag code">${d.code}</span>`+
        `</div>`+
      `</div>`;
    c.addEventListener('click', ()=>{ location.hash='#'+d.id; });
    hubGrid.appendChild(c);
  });
}
function showHub(){
  currentDeck=null;
  hubView.classList.add('show');
  gameView.classList.remove('show');
  winEl.classList.remove('show');
  toastEl.classList.remove('show');
  document.title='เกมการ์ดความรู้ ป.4-6';
}

// =====================================================================
// GAME SHELL
// =====================================================================
function startDeck(deck){
  currentDeck=deck;
  hubView.classList.remove('show');
  gameView.classList.add('show');
  winEl.classList.remove('show');
  gTitle.innerHTML = `${deck.icon} ${deck.title}<small>${deck.subject} · ${deck.code}</small>`;
  document.title = deck.title;
  if(deck.mech==='match') initMatch(deck);
  else if(deck.mech==='sort') initSort(deck);
  else if(deck.mech==='timeline') initTimeline(deck);
}
function showWin(emoji, text, scoreHtml){
  winEmoji.textContent = emoji;
  winText.textContent = text;
  winScore.innerHTML = scoreHtml||'';
  winEl.classList.add('show');
  sWin();
}

// =====================================================================
// MECHANIC B — MATCHING
// =====================================================================
let mState=null;
function initMatch(deck){
  const rounds = chunkEven(shuffle(deck.pairs), 6);
  mState = { rounds, ri:0, matched:0, total:deck.pairs.length, sel:{l:null,r:null}, lock:false };
  setScore(`จับคู่แล้ว <b>0</b>/${mState.total}`);
  renderMatchRound();
}
function cardInner(face){
  if(face.flag){
    return `<div class="mc-lab">${flagImg(face.flag)}<small>${face.text}</small></div>`;
  }
  return face.text;
}
function renderMatchRound(){
  const round = mState.rounds[mState.ri];
  mState.sel={l:null,r:null};
  const lefts = round.map((p,i)=>({p,i}));
  const rights = shuffle(round.map((p,i)=>({p,i})));
  stage.innerHTML =
    `<div class="match-wrap">`+
      `<div class="match-hint">${currentDeck.hint} &nbsp;·&nbsp; รอบ ${mState.ri+1}/${mState.rounds.length}</div>`+
      `<div class="match-cols">`+
        `<div class="mcol" id="mcol-l"></div>`+
        `<div class="mcol" id="mcol-r"></div>`+
      `</div>`+
    `</div>`;
  const colL=document.getElementById('mcol-l'), colR=document.getElementById('mcol-r');
  lefts.forEach(({p,i})=>{
    const el=document.createElement('div');
    el.className='mcard'; el.dataset.pid=i; el.dataset.side='l';
    el.innerHTML=cardInner(p.a);
    el.addEventListener('click',()=>pickMatch(el));
    colL.appendChild(el);
  });
  rights.forEach(({p,i})=>{
    const el=document.createElement('div');
    el.className='mcard'; el.dataset.pid=i; el.dataset.side='r';
    el.innerHTML=cardInner(p.b);
    el.addEventListener('click',()=>pickMatch(el));
    colR.appendChild(el);
  });
}
function pickMatch(el){
  if(mState.lock || el.classList.contains('matched')) return;
  const side=el.dataset.side, pid=+el.dataset.pid;
  const cur=mState.sel[side];
  // toggle off if re-click same
  if(cur && cur.el===el){ el.classList.remove('sel'); mState.sel[side]=null; return; }
  // re-pick same side
  if(cur){ cur.el.classList.remove('sel'); }
  el.classList.add('sel');
  mState.sel[side]={pid,el};
  // evaluate when both sides chosen
  if(mState.sel.l && mState.sel.r){
    const L=mState.sel.l, R=mState.sel.r;
    if(L.pid===R.pid){
      L.el.classList.remove('sel'); R.el.classList.remove('sel');
      L.el.classList.add('matched'); R.el.classList.add('matched');
      mState.sel={l:null,r:null};
      mState.matched++;
      setScore(`จับคู่แล้ว <b>${mState.matched}</b>/${mState.total}`);
      sCorrect();
      // round complete?
      if([...stage.querySelectorAll('.mcard.matched')].length === mState.rounds[mState.ri].length*2){
        if(mState.ri < mState.rounds.length-1){
          mState.lock=true;
          toast(true,'รอบนี้ผ่าน!');
          setTimeout(()=>{ mState.ri++; mState.lock=false; renderMatchRound(); }, 900);
        } else {
          showWin('🎉','จับคู่ครบแล้ว!', `ครบทั้ง <b style="color:#FFD700">${mState.total}</b> คู่`);
        }
      }
    } else {
      mState.lock=true;
      L.el.classList.add('wrong'); R.el.classList.add('wrong');
      L.el.classList.remove('sel'); R.el.classList.remove('sel');
      sWrong();
      setTimeout(()=>{
        L.el.classList.remove('wrong'); R.el.classList.remove('wrong');
        mState.sel={l:null,r:null}; mState.lock=false;
      }, 500);
    }
  }
}

// =====================================================================
// MECHANIC C — SORT / CLASSIFY
// =====================================================================
let sState=null;
function initSort(deck){
  sState={ order:shuffle(deck.items), idx:0, correct:0, total:deck.items.length, lock:false };
  renderSortShell(deck);
  renderSortItem();
}
function renderSortShell(deck){
  stage.innerHTML =
    `<div class="sort-wrap">`+
      `<div class="sort-hint">${deck.hint}</div>`+
      `<div class="sort-card" id="sort-card"></div>`+
      `<div class="sort-groups" id="sort-groups"></div>`+
    `</div>`;
  const gw=document.getElementById('sort-groups');
  deck.groups.forEach((g,i)=>{
    const b=document.createElement('div');
    b.className='gbtn'; b.dataset.key=g.key;
    b.innerHTML=`<div class="gb-icon">${g.icon}</div><div class="gb-lab">${g.label}</div><div class="gb-key">[${i+1}]</div>`;
    b.addEventListener('click',()=>pickSort(g.key,b));
    gw.appendChild(b);
  });
}
function renderSortItem(){
  setScore(`ข้อ <b>${Math.min(sState.idx+1,sState.total)}</b>/${sState.total} · ถูก <b>${sState.correct}</b>`);
  if(sState.idx>=sState.total){
    const pct=Math.round(sState.correct/sState.total*100);
    showWin(pct>=80?'🏆':'👍','เล่นจบแล้ว!', `ตอบถูก <b style="color:#FFD700">${sState.correct}</b>/${sState.total} (${pct}%)`);
    return;
  }
  const it=sState.order[sState.idx];
  const card=document.getElementById('sort-card');
  card.className='sort-card';
  card.innerHTML=`<div class="sc-emoji">${it.emoji}</div><div class="sc-name">${it.name}</div>`;
}
function pickSort(key, btn){
  if(sState.lock || sState.idx>=sState.total) return;
  sState.lock=true;
  const it=sState.order[sState.idx];
  const card=document.getElementById('sort-card');
  const correct = key===it.group;
  if(correct){
    sState.correct++; btn.classList.add('ok'); card.classList.add('ok');
    toast(true,'ถูกต้อง!'); sCorrect();
  } else {
    btn.classList.add('bad'); card.classList.add('bad');
    const right=currentDeck.groups.find(g=>g.key===it.group);
    toast(false,'อยู่กลุ่ม '+right.label); sWrong();
    // highlight correct group
    const rb=[...document.querySelectorAll('.gbtn')].find(b=>b.dataset.key===it.group);
    if(rb) rb.classList.add('ok');
  }
  setTimeout(()=>{
    document.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('ok','bad'));
    sState.idx++; sState.lock=false; renderSortItem();
  }, correct?650:1150);
}

// =====================================================================
// MECHANIC D — TIMELINE / SEQUENCE
// =====================================================================
let tState=null;
function initTimeline(deck){
  const solution=[...deck.items].sort((a,b)=>a.order-b.order);
  tState={ solution, pool:shuffle(deck.items), pos:0, total:deck.items.length };
  stage.innerHTML =
    `<div class="tl-wrap">`+
      `<div class="tl-hint">${deck.hint}</div>`+
      `<div class="tl-pool" id="tl-pool"></div>`+
      `<div class="tl-track" id="tl-track"></div>`+
    `</div>`;
  setScore(`เรียงแล้ว <b>0</b>/${tState.total}`);
  renderPool();
}
function renderPool(){
  const pool=document.getElementById('tl-pool');
  pool.innerHTML='';
  tState.pool.forEach(it=>{
    const el=document.createElement('div');
    el.className='tl-card';
    el.innerHTML=`<div class="tc-name">${it.name}</div><div class="tc-sub">คลิกถ้าคิดว่ามาก่อน</div>`;
    el.addEventListener('click',()=>pickTimeline(it,el));
    pool.appendChild(el);
  });
}
function pickTimeline(it, el){
  const expected=tState.solution[tState.pos];
  if(it.order===expected.order){
    // place into track
    tState.pool=tState.pool.filter(x=>x!==it);
    const track=document.getElementById('tl-track');
    if(tState.pos>0){
      const arr=document.createElement('div'); arr.className='tl-arrow'; arr.textContent='→';
      track.appendChild(arr);
    }
    const slot=document.createElement('div');
    slot.className='tl-slot';
    slot.innerHTML=`<div class="ts-order">ลำดับ ${tState.pos+1}</div><div class="ts-name">${it.name}</div>`+
                   `<div class="ts-year">${it.year}</div><div class="ts-sub">${it.sub}</div>`;
    track.appendChild(slot);
    tState.pos++;
    setScore(`เรียงแล้ว <b>${tState.pos}</b>/${tState.total}`);
    sCorrect();
    renderPool();
    if(tState.pos>=tState.total){
      showWin('🏆','เรียงถูกทั้งหมด!', `ลำดับอาณาจักรไทยถูกต้อง 👏`);
    }
  } else {
    el.classList.add('wrong'); sWrong(); toast(false,'ยังไม่ใช่ ลองดูปีอีกที');
    setTimeout(()=>el.classList.remove('wrong'),450);
  }
}

// =====================================================================
// CONTROLS
// =====================================================================
document.getElementById('g-home').addEventListener('click',()=>{ location.hash=''; });
document.getElementById('g-restart').addEventListener('click',()=>{ if(currentDeck) startDeck(currentDeck); });
document.getElementById('win-again').addEventListener('click',()=>{ winEl.classList.remove('show'); if(currentDeck) startDeck(currentDeck); });
document.getElementById('win-home').addEventListener('click',()=>{ location.hash=''; });

document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
    return;
  }
  if(e.key==='Escape'){ location.hash=''; return; }
  // number keys 1-5 for sort
  if(currentDeck && currentDeck.mech==='sort' && /^[1-5]$/.test(e.key) && !winEl.classList.contains('show')){
    const btn=document.querySelectorAll('.gbtn')[+e.key-1];
    if(btn) btn.click();
  }
});

// =====================================================================
// ROUTING + INIT
// =====================================================================
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  const deck=DECKS.find(d=>d.id===h);
  if(deck) startDeck(deck);
  else showHub();
}
window.addEventListener('hashchange',route);
buildHub();
route();
</script>
